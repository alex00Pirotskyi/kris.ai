      - shell: bash
        run: flutter pub get
      - name: Validate authority, contracts, formatting, analysis, and tests
        shell: bash
        run: |
          set -euo pipefail
          python tool/roadmap_control.py validate --project . --strict
          python - <<'PY'
          import subprocess
          result=subprocess.run(['python','tool/roadmap_control.py','explain','P5-001','--project','.'],text=True,capture_output=True)
          text=result.stdout+result.stderr
          if result.returncode != 2 or not any(token in text for token in ('Unknown task','outside','scope')): raise SystemExit(text)
          PY
          python tool/worker_f_p5_ia.py manifest --project . --check
          python tool/worker_f_p5_ia.py check --project .
          python tool/worker_f_p5_ia_test.py
          python tool/test_center_contracts.py check --project .
          python - <<'PY'
          import subprocess
          a=subprocess.check_output(['python','tool/worker_f_p5_ia.py','select','--project','.','lib/product/p5_information_architecture/p5_models.dart','test/product/p5_information_architecture/p5_accessibility_test.dart'],text=True).strip()
