          import 'package:kristin_local_agent/product/p5_information_architecture/p5_prototype.dart';

          Future<void> pumpPrototype(WidgetTester tester, P5InformationArchitectureController controller) async {
            tester.view.physicalSize = const Size(1440, 960);
            tester.view.devicePixelRatio = 1;
            addTearDown(tester.view.resetPhysicalSize);
            addTearDown(tester.view.resetDevicePixelRatio);
            await tester.pumpWidget(P5InformationArchitectureApp(controller: controller));
            await tester.pumpAndSettle();
          }
          Future<void> tapKey(WidgetTester tester, Key key) async {
            final finder=find.byKey(key); await tester.ensureVisible(finder); await tester.tap(finder); await tester.pumpAndSettle();
          }
          void main() {
            testWidgets('all required workspaces are reachable', (tester) async {
              final controller=P5InformationArchitectureController()..changeExperienceLevel(P5ExperienceLevel.advanced);
              addTearDown(controller.dispose); await pumpPrototype(tester,controller);
              for (final definition in controller.visibleWorkspaces) { await tapKey(tester,Key('workspace-nav-${definition.id.name}')); expect(controller.state.workspace,definition.id); }
              expect(controller.sideEffects.isZero,isTrue);
            });
            testWidgets('simple task reaches evidence and verification', (tester) async {
              final controller=P5InformationArchitectureController(); addTearDown(controller.dispose); await pumpPrototype(tester,controller);
              await tapKey(tester,const Key('review-plan-button')); await tapKey(tester,const Key('start-run-button'));
              await tapKey(tester,const Key('pause-run-button')); await tapKey(tester,const Key('resume-run-button'));
              await tapKey(tester,const Key('complete-run-button')); await tapKey(tester,const Key('open-evidence-button'));
              expect(controller.state.workspace,P5WorkspaceId.evidence); controller.selectWorkspace(P5WorkspaceId.homeChat); await tester.pumpAndSettle();
              await tapKey(tester,const Key('run-verification-button')); expect(controller.state.workspace,P5WorkspaceId.verificationCenter);
              expect(controller.state.verificationRequested,isTrue); expect(controller.sideEffects.isZero,isTrue);
            });
            testWidgets('existing run retains project and run context', (tester) async {
              final controller=P5InformationArchitectureController()..selectWorkspace(P5WorkspaceId.runsActivity);
              addTearDown(controller.dispose); await pumpPrototype(tester,controller); await tapKey(tester,const Key('run-run.p5-existing-001'));
              final project=controller.state.selectedProjectId; final run=controller.state.selectedRunId;
              await tapKey(tester,const Key('existing-run-evidence-button')); expect(controller.state.selectedProjectId,project); expect(controller.state.selectedRunId,run);
              controller.back(); expect(controller.state.workspace,P5WorkspaceId.runsActivity);
            });
            testWidgets('Owner Mode remains presentation-only', (tester) async {
              final controller=P5InformationArchitectureController()..selectWorkspace(P5WorkspaceId.ownerMode);
              addTearDown(controller.dispose); await pumpPrototype(tester,controller); expect(find.textContaining('BLOCKED_EXTERNAL'),findsOneWidget);
              await tapKey(tester,const Key('owner-preview-running')); expect(controller.state.ownerModeState,P5OwnerModePresentationState.running); expect(controller.sideEffects.isZero,isTrue);
            });
            testWidgets('Web Studio unavailable state has an exit', (tester) async {
              final controller=P5InformationArchitectureController()..changeExperienceLevel(P5ExperienceLevel.advanced)..selectWorkspace(P5WorkspaceId.capabilitiesIntegrations);
              addTearDown(controller.dispose); await pumpPrototype(tester,controller); await tapKey(tester,const Key('capability-webStudio'));
              expect(find.text('BLOCKED_BY_DEPENDENCY'),findsOneWidget); await tester.tap(find.text('Back to Capabilities')); await tester.pumpAndSettle();
              expect(controller.state.workspace,P5WorkspaceId.capabilitiesIntegrations); expect(controller.sideEffects.isZero,isTrue);
            });
          }
          '''
          nav_path=root/'test/product/p5_information_architecture/p5_navigation_test.dart'; nav_path.parent.mkdir(parents=True,exist_ok=True)
          nav_path.write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in nav.splitlines())+'\n',encoding='utf-8')

          registry_path=root/'config/test_center_registry.v1.json'
          registry=json.loads(registry_path.read_text(encoding='utf-8'))
          test_ids=['tc.p5-001.navigation.primary-workspaces','tc.p5-001.flow.simple-task','tc.p5-001.flow.existing-run','tc.p5-001.flow.owner-mode','tc.p5-001.flow.verification-center','tc.p5-001.state.transitions','tc.p5-001.mode.progressive-disclosure','tc.p5-001.capability.honest-unavailable','tc.p5-001.keyboard.primary-flow','tc.p5-001.semantics.primary-flow']
          titles=['Primary workspaces are reachable','Simple task flow','Existing run continuity','Owner Mode presentation boundary','Verification Center domain separation','Deterministic state transitions','Progressive disclosure','Honest unavailable capability','Keyboard-only primary flow','Primary flow semantics']
          files=['test/product/p5_information_architecture/p5_navigation_test.dart']*4+['test/product/p5_information_architecture/p5_verification_center_test.dart','test/product/p5_information_architecture/p5_state_controller_test.dart','test/product/p5_information_architecture/p5_verification_center_test.dart','test/product/p5_information_architecture/p5_navigation_test.dart','test/product/p5_information_architecture/p5_accessibility_test.dart','test/product/p5_information_architecture/p5_accessibility_test.dart']
          profiles=[f'profile.p5-001.{i+1:02d}' for i in range(10)]; mappings=[f'affected.p5-001.{i+1:02d}' for i in range(10)]; module='tm.p5-information-architecture'
          paths=[['lib/product/p5_information_architecture/**','lib/p5_ia_preview.dart'],['lib/product/p5_information_architecture/p5_task_workspaces.dart','test/product/p5_information_architecture/p5_navigation_test.dart'],['lib/product/p5_information_architecture/p5_controller.dart','test/product/p5_information_architecture/p5_navigation_test.dart'],['lib/product/p5_information_architecture/p5_verification_workspaces.dart','test/product/p5_information_architecture/p5_navigation_test.dart'],['lib/product/p5_information_architecture/p5_verification_workspaces.dart','release/evidence/P5-001/test-center-registration.json'],['lib/product/p5_information_architecture/p5_models.dart','lib/product/p5_information_architecture/p5_controller.dart'],['lib/product/p5_information_architecture/p5_prototype.dart','lib/product/p5_information_architecture/p5_components.dart'],['lib/product/p5_information_architecture/p5_support_workspaces.dart','release/evidence/P5-001/capability-presentation-matrix.json'],['lib/product/p5_information_architecture/p5_prototype.dart','test/product/p5_information_architecture/p5_accessibility_test.dart'],['lib/product/p5_information_architecture/p5_components.dart','test/product/p5_information_architecture/p5_accessibility_test.dart']]
          def p5(record): return 'p5-001' in json.dumps(record,sort_keys=True) or 'p5-information-architecture' in json.dumps(record,sort_keys=True)
          for key in ('testModules','testCases','projectTestProfiles','affectedTestMappings'):
            if not isinstance(registry.get(key),list) or not registry[key]: raise RuntimeError(f'missing canonical template {key}')
            registry[key]=[record for record in registry[key] if not p5(record)]
          def transform(value,ctx,key=''):
            if isinstance(value,dict): return {k:transform(v,ctx,k) for k,v in value.items()}
            if isinstance(value,list):
              lower=key.lower()
              if lower in {'testids','testcaseids','selectedtestids','affectedtestids'}: return list(ctx.get('testIds',[ctx['testId']]))
              if lower in {'projectprofileids','profileids','testprofileids'}: return list(ctx.get('profileIds',[ctx['profileId']]))
              if lower=='pathpatterns': return list(ctx.get('pathPatterns',['lib/product/p5_information_architecture/**']))
              if lower=='excludedpaths': return ['docs/roadmap/MASTER.md','docs/roadmap/roadmap.yaml']
              if lower in {'argv','arguments'}: return ['flutter','test',ctx.get('testFile',files[0])]
              if lower in {'inputs','inputpaths'}: return [ctx.get('testFile',files[0]),'lib/product/p5_information_architecture/**']
              if lower in {'outputs','outputpaths','evidencepaths'}: return ['release/evidence/P5-001/test-results.json']
              if lower in {'environmentallowlist','allowedenvironmentvariables'}: return ['CI','FLUTTER_ROOT','PATH','PUB_CACHE']
              return [transform(item,ctx,key) for item in value]
            if isinstance(value,bool): return False if key.lower() in {'mutating','allowsmutation','requiresnetwork','requirescredentials'} else value
            if isinstance(value,int): return 900 if 'timeout' in key.lower() else ctx.get('priority',100) if key.lower()=='priority' else value
            if isinstance(value,str):
              lower=key.lower()
              if lower=='moduleid' or value.startswith('tm.'): return module
              if lower in {'testid','testcaseid'} or value.startswith('tc.'): return ctx['testId']
              if lower in {'profileid','projectprofileid','testprofileid'} or value.startswith('profile.'): return ctx['profileId']
              if lower=='mappingid' or value.startswith('affected.'): return ctx['mappingId']
              if lower in {'title','name','displayname'}: return ctx.get('title','P5-001 information architecture')
              if lower in {'description','summary','rationale'}: return ctx.get('description','Bounded non-mutating P5-001 presentation verification.')
              if lower in {'workingdirectory','cwd'}: return '.'
              if lower in {'mutationpolicy','executionpolicy'}: return 'NON_MUTATING'
              if lower in {'resultstate','testexecutionresult','result'}: return 'UNKNOWN'
              if lower in {'certificationstate','certificationstatus'}: return 'NOT_EVALUATED'
              if lower in {'capabilitysupport','supportstate','supportstatus'}: return 'SOURCE_FOUNDATION'
              if lower.endswith('at') or 'timestamp' in lower: return fixed
              if re.fullmatch(r'[0-9a-f]{40}',value): return '90c574665363140aeb6cf764ab8387714cab88cf'
            return value
          module_ctx={'testId':test_ids[0],'profileId':profiles[0],'mappingId':mappings[0],'testIds':test_ids,'profileIds':profiles,'title':'P5 information architecture','description':'Presentation-only navigation, state, verification, keyboard, and semantics foundation.'}
          registry['testModules'].append(transform(copy.deepcopy(registry['testModules'][0]),module_ctx))
          case_template=copy.deepcopy(registry['testCases'][0]); profile_template=copy.deepcopy(next((item for item in registry['projectTestProfiles'] if item.get('mutationPolicy')=='NON_MUTATING'),registry['projectTestProfiles'][0])); mapping_template=copy.deepcopy(registry['affectedTestMappings'][0])
          for i,test_id in enumerate(test_ids):
            ctx={'testId':test_id,'profileId':profiles[i],'mappingId':mappings[i],'title':titles[i],'description':'P5-001 bounded source/widget presentation verification.','testFile':files[i],'pathPatterns':paths[i],'priority':100-i}
            registry['testCases'].append(transform(copy.deepcopy(case_template),ctx)); registry['projectTestProfiles'].append(transform(copy.deepcopy(profile_template),ctx)); registry['affectedTestMappings'].append(transform(copy.deepcopy(mapping_template),ctx))
          for key,value in registry.items():
            if isinstance(value,list) and value and all(isinstance(item,dict) for item in value):
              for identity in ('moduleId','testId','profileId','mappingId','requestId','resultId','evidenceId','certificationId','capabilitySupportId','presentationId'):
                if any(identity in item for item in value): value.sort(key=lambda item:str(item.get(identity,''))); break
          registry_path.write_text(json.dumps(registry,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          registration={'schemaVersion':'1.0.0','moduleId':module,'capabilitySupport':'SOURCE_FOUNDATION','testIds':test_ids,'profileIds':profiles,'mappingIds':mappings,'mutationPolicy':'NON_MUTATING','workingDirectory':'.','environmentAllowlist':['CI','FLUTTER_ROOT','PATH','PUB_CACHE'],'evidencePaths':['release/evidence/P5-001/test-results.json','release/evidence/P5-001/manifest.json'],'certificationState':'NOT_EVALUATED','platformSupport':'UNSUPPORTED','releaseSupport':'UNSUPPORTED'}
          (evidence/'test-center-registration.json').write_text(json.dumps(registration,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

          cat > tool/worker_f_p5_ia.py <<'PY'
          from __future__ import annotations
          import argparse, fnmatch, hashlib, json
          from pathlib import Path
          MODULE_ID='tm.p5-information-architecture'
          TEST_IDS=('tc.p5-001.navigation.primary-workspaces','tc.p5-001.flow.simple-task','tc.p5-001.flow.existing-run','tc.p5-001.flow.owner-mode','tc.p5-001.flow.verification-center','tc.p5-001.state.transitions','tc.p5-001.mode.progressive-disclosure','tc.p5-001.capability.honest-unavailable','tc.p5-001.keyboard.primary-flow','tc.p5-001.semantics.primary-flow')
          PLACEHOLDERS=('PENDING_SHA','STAGE_1_COMMIT_PENDING','TODO','TBD','UNKNOWN_TREE')
          def load(path): return json.loads(path.read_text(encoding='utf-8'))
          def extract_p5_module(root):
            data=load(root/'config/test_center_registry.v1.json'); prefixes=('p5-001','p5-information-architecture')
            return {key:[item for item in value if isinstance(item,dict) and any(prefix in json.dumps(item,sort_keys=True) for prefix in prefixes)] if isinstance(value,list) else value for key,value in data.items()}
          def select_affected_tests(paths,mappings):
            selected=set()
            for mapping in mappings:
              for path in sorted(set(paths)):
                if any(fnmatch.fnmatch(path,p) for p in mapping.get('excludedPaths',[])): continue
                if any(fnmatch.fnmatch(path,p) for p in mapping.get('pathPatterns',[])): selected.update(mapping.get('testIds',[]))
            return sorted(selected)
          def owned_files(root):
            explicit=[root/'.github/workflows/worker-f-p5-001-information-architecture.yml',root/'config/test_center_registry.v1.json',root/'lib/p5_ia_preview.dart',root/'docs/ux/P5-001_INFORMATION_ARCHITECTURE.md',root/'docs/roadmap/progress/2026-08-05-p5-001-information-architecture.md',root/'tool/worker_f_p5_ia.py',root/'tool/worker_f_p5_ia_test.py']
            files=[path for path in explicit if path.exists()]
            for base in (root/'lib/product/p5_information_architecture',root/'test/product/p5_information_architecture',root/'release/evidence/P5-001'):
              if base.exists(): files.extend(path for path in base.rglob('*') if path.is_file() and path.name!='manifest.json')
            return sorted(set(files),key=lambda path:path.as_posix())
          def manifest_payload(root):
            rows=[]
            for path in owned_files(root):
              raw=path.read_bytes(); rows.append({'path':path.relative_to(root).as_posix(),'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)})
            return {'schemaVersion':'1.0.0','milestone':'P5-001','classification':'SOURCE_FOUNDATION','artifacts':rows}
          def write_manifest(root,check=False):
            path=root/'release/evidence/P5-001/manifest.json'; expected=json.dumps(manifest_payload(root),indent=2,sort_keys=True)+'\n'
            if check:
              if not path.exists() or path.read_text(encoding='utf-8')!=expected: raise AssertionError('P5-001 manifest is stale')
            else:
              path.parent.mkdir(parents=True,exist_ok=True); path.write_text(expected,encoding='utf-8')
          def check(root):
            master=(root/'docs/roadmap/MASTER.md').read_text(encoding='utf-8')
            if 'P0-008' not in master: raise AssertionError('P0-008 authority not found')
