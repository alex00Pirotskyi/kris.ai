            profiles={item.get('profileId'):item for item in registry.get('projectTestProfiles',[]) if 'p5-001' in str(item.get('profileId',''))}
            mappings=[item for item in registry.get('affectedTestMappings',[]) if 'p5-001' in str(item.get('mappingId',''))]
