name: Worker F P5-001 repaired finalizer

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: worker-f-p5-001-repaired-finalizer
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_tree: ${{ steps.identity.outputs.source_tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Cancel competing Worker F runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs?branch=agent/f/P5-001-information-architecture&per_page=100" \
            --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | .id' \
            | while read -r run_id; do
                if [[ "$run_id" != "$CURRENT_RUN" ]]; then
                  gh api --method POST "repos/$REPO/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
                fi
              done
          sleep 15
      - name: Materialize reviewed source and deterministic contracts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64, copy, fnmatch, json, os, re, urllib.request
          from pathlib import Path

          root=Path('.')
          repo=os.environ['REPO']
          token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}'
          fixed='2026-08-05T18:00:00Z'

          def request(url):
            req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          def blob(sha):
            payload=request(f'{api}/git/blobs/{sha}')
            return base64.b64decode(payload['content'])
          def put(path,sha,overwrite=False):
            target=root/path
            if target.exists() and not overwrite: return
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(blob(sha))

          direct={
            'lib/product/p5_information_architecture/p5_models.dart':'963c27f6604a068d057c5d7dbdf8ae856b97f59c',
            'lib/product/p5_information_architecture/p5_controller.dart':'d39fc0bad7980f35942dcdac170032722d765caa',
            'lib/product/p5_information_architecture/p5_fixtures.dart':'19d8e3e848e4ec937acb9f51ac65c07c044361f9',
            'lib/product/p5_information_architecture/p5_prototype.dart':'a13aa488c7d0c35bb0105a8e739decf6b0e07280',
            'lib/product/p5_information_architecture/p5_task_workspaces.dart':'845b99d2e99a6d4cf31073d5b10099781eb4da63',
            'lib/product/p5_information_architecture/p5_verification_workspaces.dart':'1c2e5d78ef9d67ed6e3b72879ff33d8ffa355ab8',
            'lib/product/p5_information_architecture/p5_support_workspaces.dart':'ab4c6a2691d577c1fb6d593d986bce68b68fc403',
            'lib/product/p5_information_architecture/p5_components.dart':'5a2a4c9d8c6ff5e6f3a606e6add788a331900409',
            'test/product/p5_information_architecture/p5_state_controller_test.dart':'642eb0eba2ca9b3ae16a1170915db03263b9ea59',
            'test/product/p5_information_architecture/p5_source_boundary_test.dart':'c4368ce437caa96a9b99b9505df981a0f9a7ad9b',
            'test/product/p5_information_architecture/p5_verification_center_test.dart':'2e3b7d098696bd7f92d3830a506ff33fe7205e0f',
            'test/product/p5_information_architecture/p5_accessibility_test.dart':'d95b658732943b5e6fa4f47ae1d7b958124f38eb',
            'tool/worker_f_p5_ia_test.py':'326462d4db7c9ec895c7f9dbf09de84fa83b8895',
            'release/evidence/P5-001/current-ux-inventory.json':'7edcec5ec298a6ac93f6e381910a109e8560376b',
          }
          for path,sha in direct.items(): put(path,sha)

          tree=request(f'{api}/git/trees/d581f21fb7b36ca9938cb55f24052df36df8475f?recursive=1')
          entries={item['path']:item for item in tree.get('tree',[]) if item.get('type')=='blob'}
          wanted=[
            'lib/p5_ia_preview.dart','docs/ux/P5-001_INFORMATION_ARCHITECTURE.md',
            'docs/roadmap/progress/2026-08-05-p5-001-information-architecture.md',
            'release/evidence/P5-001/jobs-to-be-done.json','release/evidence/P5-001/navigation-map.json',
            'release/evidence/P5-001/state-transition-graph.json','release/evidence/P5-001/prototype-scenarios.json',
            'release/evidence/P5-001/capability-presentation-matrix.json','release/evidence/P5-001/test-results.json',
            'release/evidence/P5-001/claim-boundary.json',
          ]
          for path in wanted:
            if path in entries: put(path,entries[path]['sha'])

          preview=root/'lib/p5_ia_preview.dart'
          if not preview.exists():
            preview.write_text("import 'package:flutter/widgets.dart';\nimport 'product/p5_information_architecture/p5_prototype.dart';\n\nvoid main() { runApp(const P5InformationArchitectureApp()); }\n",encoding='utf-8')
          docs=root/'docs/ux/P5-001_INFORMATION_ARCHITECTURE.md'; docs.parent.mkdir(parents=True,exist_ok=True)
          if not docs.exists(): docs.write_text('# P5-001 Information Architecture\n\nIsolated presentation-only coded prototype. No production runtime authority changes.\n',encoding='utf-8')
          progress=root/'docs/roadmap/progress/2026-08-05-p5-001-information-architecture.md'; progress.parent.mkdir(parents=True,exist_ok=True)
          if not progress.exists(): progress.write_text('# P5-001 progress — 2026-08-05\n\nBounded SOURCE_FOUNDATION prototype; roadmap authority unchanged.\n',encoding='utf-8')
          evidence=root/'release/evidence/P5-001'; evidence.mkdir(parents=True,exist_ok=True)
          fallback={
            'jobs-to-be-done.json':{'schemaVersion':'1.0.0','jobs':['task','project-continuity','run-recovery','verification','developer-inspection']},
            'navigation-map.json':{'schemaVersion':'1.0.0','workspaces':['homeChat','projects','runsActivity','verificationCenter','evidence','ownerMode','modelsProviders','capabilitiesIntegrations','settingsDiagnostics'],'future':['webStudio','searchResearch','nativeAutomation','devices']},
            'state-transition-graph.json':{'schemaVersion':'1.0.0','states':['EMPTY','LOADING','READY','RUNNING','PAUSED','BLOCKED','ERROR','COMPLETED','UNAVAILABLE'],'authority':'presentation-only'},
            'prototype-scenarios.json':{'schemaVersion':'1.0.0','scenarios':['simple-task','existing-run','owner-mode','verification-center','unavailable-capability','failure-recovery']},
            'capability-presentation-matrix.json':{'schemaVersion':'1.0.0','support':'SOURCE_FOUNDATION','states':['NOT_IMPLEMENTED','SOURCE_FOUNDATION','BLOCKED_BY_DEPENDENCY','UNSUPPORTED','UNAVAILABLE']},
            'test-results.json':{'schemaVersion':'1.0.0','stage':'SOURCE_CANDIDATE','result':'UNKNOWN','bindingStrategy':'stage-2-exact-head'},
            'claim-boundary.json':{'schemaVersion':'1.0.0','p5_001':'SOURCE_FOUNDATION','productionShell':False,'ownerModeBehavior':False,'webStudio':False,'accessibilityCertified':False,'consumerReady':False,'releaseReady':False},
          }
          for name,payload in fallback.items():
            path=evidence/name
            if not path.exists(): path.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')

