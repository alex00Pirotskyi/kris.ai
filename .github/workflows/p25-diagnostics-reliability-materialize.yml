name: P25 Diagnostics Reliability Rescue Materializer

on:
  push:
    branches:
      - 'agent/p25-diagnostics-reliability-rescue'
    paths:
      - '.github/workflows/p25-diagnostics-reliability-materialize.yml'
      - 'lib/product/adaptive_mission_planning.dart'
      - 'lib/product/agent_decision.dart'
      - 'lib/product/agent_protocol.dart'
      - 'lib/product/execution_intelligence.dart'
      - 'lib/product/retry_policy.dart'
      - 'lib/product/tool_schema.dart'
      - 'test/product/p25_diagnostics_reliability_rescue_test.dart'

permissions:
  contents: write

concurrency:
  group: p25-diagnostics-reliability-materialize
  cancel-in-progress: false

env:
  EXPECTED_P25_PARENT: 2f5b8f8fdf83f56f6405590675d3cb39881793a3
  TARGET_BRANCH: agent/p25-diagnostics-reliability-rescue

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact rescue ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXPECTED_P25_PARENT")" = "$EXPECTED_P25_PARENT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Apply pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/product/adaptive_mission_planning.dart \
            lib/product/agent_decision.dart \
            lib/product/agent_protocol.dart \
            lib/product/execution_intelligence.dart \
            lib/product/retry_policy.dart \
            lib/product/tool_schema.dart \
            test/product/p25_diagnostics_reliability_rescue_test.dart

      - name: Diagnostics reliability regression
        run: flutter test --no-pub --concurrency=1 test/product/p25_diagnostics_reliability_rescue_test.dart

      - name: Adaptive mission planner regressions
        run: flutter test --no-pub --concurrency=1 test/product/adaptive_mission_planning_test.dart

      - name: Protocol compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 \
            test/product/typed_protocol_schema_test.dart \
            test/product/model_protocol_hotfix_test.dart \
            test/product/tool_compatibility_reliability_test.dart

      - name: Execution and workflow regressions
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 \
            test/product/execution_reliability_test.dart \
            test/product/budget_diagnostics_test.dart \
            test/product/durable_workflow_kernel_test.dart

      - name: P25 contract gate
        shell: bash
        run: |
          set -euo pipefail
          python tool/validate_p25_roadmap.py
          python tool/p25_test_station.py --profile contract

      - name: Full analyzer
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos

      - name: Recheck active P25 parent before publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/agent/product/p25-002-fast-interactive-runtime
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_P25_PARENT" || {
            echo 'Active P25 parent moved; refusing to publish a stale stacked rescue.' >&2
            exit 79
          }

      - name: Remove temporary rescue workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p25-diagnostics-reliability-rescue.yml
          rm -f .github/workflows/p25-diagnostics-reliability-materialize.yml

      - name: Regenerate exact source authority twice
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --check

      - name: Stage exact rescue scope
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            SOURCE_MANIFEST.sha256 \
            lib/product/adaptive_mission_planning.dart \
            lib/product/agent_decision.dart \
            lib/product/agent_protocol.dart \
            lib/product/execution_intelligence.dart \
            lib/product/retry_policy.dart \
            lib/product/tool_schema.dart \
            test/product/p25_diagnostics_reliability_rescue_test.dart \
            .github/workflows/p25-diagnostics-reliability-rescue.yml \
            .github/workflows/p25-diagnostics-reliability-materialize.yml
          python - <<'PY'
          import subprocess
          expected = {
              'SOURCE_MANIFEST.sha256',
              'lib/product/adaptive_mission_planning.dart',
              'lib/product/agent_decision.dart',
              'lib/product/agent_protocol.dart',
              'lib/product/execution_intelligence.dart',
              'lib/product/retry_policy.dart',
              'lib/product/tool_schema.dart',
              'test/product/p25_diagnostics_reliability_rescue_test.dart',
              '.github/workflows/p25-diagnostics-reliability-rescue.yml',
              '.github/workflows/p25-diagnostics-reliability-materialize.yml',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(
                  f'exact rescue scope mismatch: actual={sorted(actual)} expected={sorted(expected)}'
              )
          print('P25 diagnostics rescue exact staged scope: PASS')
          PY

      - name: Publish validated clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kristin Diagnostics Reliability Worker'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(p25): harden local execution from diagnostics'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"
