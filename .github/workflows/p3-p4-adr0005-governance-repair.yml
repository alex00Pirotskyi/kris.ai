name: P3 P4 ADR-0005 Governance Repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p3-p4-adr0005-governance-repair.yml
      - .repo-p3-p4-adr0005-governance-repair.py

permissions:
  contents: write

concurrency:
  group: p3-p4-adr0005-governance-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p3-p4-adr0005-closure-20260823
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Verify current-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Apply bounded roadmap governance repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .repo-p3-p4-adr0005-governance-repair.py
          rm -f .repo-p3-p4-adr0005-governance-repair.py
          rm -f .github/workflows/p3-p4-adr0005-governance-repair.yml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Refresh source manifest
        shell: bash
        run: |
          set -euo pipefail
          python tool/p2_refresh_source_manifest.py .
          git add -A
          git diff --cached --check
      - name: P0 roadmap authority contract
        run: python tool/p0_008_roadmap_test.py --project .
      - name: Focused P3 P4 storage acceptance
        run: >-
          flutter test --no-pub --reporter expanded
          test/product/browser/browser_profile_isolation_test.dart
          test/product/browser/browser_phase_completion_test.dart
          test/product/browser/browser_security_suite_test.dart
          test/product/research/research_runtime_test.dart
      - name: Fatal static analysis
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos
      - name: Complete Flutter regression
        run: flutter test --no-pub --concurrency=1 --reporter expanded
      - name: Deterministic release validator
        run: python tool/validate_release.py
      - name: Verify clean durable delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'SOURCE_MANIFEST.sha256',
              'docs/adr/ADR-0005-browser-storage.md',
              'docs/roadmap/DECISIONS.md',
              'release/evidence/P3-008/manifest.json',
              'release/evidence/P3-008/test-results.json',
              'release/evidence/P4-011/manifest.json',
              'release/evidence/P4-011/test-results.json',
              'test/product/browser/browser_profile_isolation_test.dart',
              'tool/p0_008_roadmap_test.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', 'origin/main', '--'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected ADR-0005 governance delta: {sorted(changed)}')
          PY
      - name: Publish clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(p3-p4): bind ADR-0005 acceptance to owner evidence'
          git push origin HEAD:agent/p3-p4-adr0005-closure-20260823
