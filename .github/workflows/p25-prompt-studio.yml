name: P25 Prompt Studio Roadmap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p25-prompt-studio.yml'
      - 'SOURCE_MANIFEST.sha256'
      - 'config/test_center_registry.v1.json'
      - 'config/test_center_assurance_hierarchy.v1.json'
      - 'docs/roadmap/P25_PROMPT_STUDIO_PRODUCT_RESCUE.md'
      - 'docs/roadmap/p25/**'
      - 'docs/roadmap/decisions/ADR-P25-001-prompt-studio-product-rescue.md'
      - 'docs/testing/TEST_CENTER_P25_PROMPT_STUDIO.md'
      - 'tasks/planned/P25-*.md'
      - 'tool/p25_prompt_studio_*.py'
  push:
    branches:
      - 'agent/p25-prompt-studio-product-rescue-v4'
      - 'agent/product/p25-*'
    paths:
      - '.github/workflows/p25-prompt-studio.yml'
      - 'SOURCE_MANIFEST.sha256'
      - 'config/test_center_registry.v1.json'
      - 'config/test_center_assurance_hierarchy.v1.json'
      - 'docs/roadmap/P25_PROMPT_STUDIO_PRODUCT_RESCUE.md'
      - 'docs/roadmap/p25/**'
      - 'docs/roadmap/decisions/ADR-P25-001-prompt-studio-product-rescue.md'
      - 'docs/testing/TEST_CENTER_P25_PROMPT_STUDIO.md'
      - 'tasks/planned/P25-*.md'
      - 'tool/p25_prompt_studio_*.py'

permissions:
  contents: write

jobs:
  contract:
    name: p25-roadmap-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: P25 roadmap and Test Station contracts
        run: |
          python tool/p25_prompt_studio_roadmap_test.py --project .
          python tool/p25_prompt_studio_test_station.py --project . --profile contract --check
      - name: Existing roadmap and Test Center contracts
        run: |
          python tool/roadmap_control.py validate --project . --strict
          python tool/roadmap_control.py render --project . --check
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
      - name: Workflow integrity
        run: ruby tool/workflow_integrity_test.rb .
      - name: Non-mutation
        shell: bash
        run: |
          git diff --check
          git diff --exit-code

  source-manifest:
    name: p25-roadmap-source-manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Rebuild source manifest twice
        shell: bash
        run: |
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --exit-code -- SOURCE_MANIFEST.sha256

  materialize-fast-product:
    if: github.event_name == 'push' && github.ref_name == 'agent/product/p25-002-fast-interactive-runtime'
    name: p25-fast-interactive-product
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Apply, verify, and publish focused product source
        shell: bash
        env:
          TARGET_BRANCH: agent/product/p25-002-fast-interactive-runtime
          ORIGINAL_P25_WORKFLOW_BLOB: e7d37e81a095a5614b799fc7f55fe4c8872e2b88
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"

          payload_root="$(mktemp -d)"
          cleanup() { rm -rf "${payload_root}"; }
          trap cleanup EXIT

          test "$(sha256sum .p25-fastpath/payload.b64.00 | cut -d' ' -f1)" = "8f0fe9f0d787fabbbf4b3e307f9d9bdde092184d0488528508d495c2054352b1"
          test "$(sha256sum .p25-fastpath/payload.b64.01 | cut -d' ' -f1)" = "66f8b6130dcc83b7550ebf4d8e6365fb55c629de4c4baed7d36416b40f6eee15"
          test "$(sha256sum .p25-fastpath/payload.b64.02 | cut -d' ' -f1)" = "44e4750a72e9a494c7d582639e0124e69dab34db45b06f3c2c15dba31699ab44"
          cat .p25-fastpath/payload.b64.* | base64 --decode > "${payload_root}/payload.tar.gz"
          test "$(sha256sum "${payload_root}/payload.tar.gz" | cut -d' ' -f1)" = "31369830896d1b7191976b0743fd71880f87d4952e0eb9bb11342110602e5080"
          tar -xzf "${payload_root}/payload.tar.gz" -C "${payload_root}"

          python3 "${payload_root}/p25_patcher_selftest.py"
          python3 "${payload_root}/p25_fastpath_apply.py" . --no-verify

          test_targets=(
            test/product/p25_fast_path_contract_test.dart
            test/product/prompt_studio_v2_test.dart
            test/product/model/model_registry_test.dart
            test/product/budget_diagnostics_test.dart
            test/product/execution_reliability_test.dart
          )
          flutter test --reporter expanded "${test_targets[@]}"
          flutter analyze --no-fatal-infos --no-fatal-warnings
          python3 tool/p25_prompt_studio_roadmap_test.py --project .
          python3 tool/p25_prompt_studio_test_station.py --project . --profile contract --check

          expected_product=(
            lib/product/models_research.dart
            lib/product/prompt_planning.dart
            lib/product/product_runtime.dart
            lib/product/chat_studio.dart
            lib/product/execution_intelligence.dart
            lib/product/planning_runtime.dart
            test/product/p25_fast_path_contract_test.dart
          )
          git diff --check -- "${expected_product[@]}"
          git status --porcelain=v1 --untracked-files=all > "${payload_root}/status.txt"
          python3 - "${payload_root}/status.txt" "${expected_product[@]}" <<'PY'
          from pathlib import Path
          import sys

          allowed = set(sys.argv[2:])
          changed = set()
          for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              if not line:
                  continue
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit('unexpected changed paths: ' + ', '.join(unexpected))
          if missing:
              raise SystemExit('expected product paths were not changed: ' + ', '.join(missing))
          print('Changed-path scope verified.')
          PY

          git add -- "${expected_product[@]}"
          git cat-file blob "${ORIGINAL_P25_WORKFLOW_BLOB}" > .github/workflows/p25-prompt-studio.yml
          git add -- .github/workflows/p25-prompt-studio.yml
          git rm -r -- .p25-fastpath .github/workflows/p25-002-materialize.yml
          git diff --cached --check

          git -c user.name='Kris AI Product Worker' \
              -c user.email='kris-ai-product-worker@users.noreply.github.com' \
              commit -m 'feat(p25): make local prompt generation interactive and bounded'
          result_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          printf 'P25-002 product commit: %s\n' "${result_sha}"
