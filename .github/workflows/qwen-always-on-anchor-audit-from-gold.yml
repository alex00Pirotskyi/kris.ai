name: Qwen Always-On Anchor Audit From Gold

on:
  push:
    branches:
      - agent/mission-execution-v15-gold
    paths:
      - .github/workflows/qwen-always-on-anchor-audit-from-gold.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true
      - name: Record exact transformation anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          w = Path('tool/kris_qwen_worker.py').read_text(encoding='utf-8')
          c = Path('tool/kris_qwen_control.py').read_text(encoding='utf-8')
          t = Path('tool/kris_qwen_control_test.py').read_text(encoding='utf-8')
          p = Path('tool/kris_qwen_worker.py.compat.py').read_text(encoding='utf-8')
          checks = {
            'worker_version': len(re.findall(r'SCRIPT_VERSION = "5\\.2\\.2"', w)),
            'fetch_function': len(re.findall(r'def fetch_all\\(cfg: Config\\) -> None:', w)),
            'promote_function': len(re.findall(r'def promote_reviewed_source_work\\(', w)),
            'authority_insert': len(re.findall(r'def validate_authority_append_safety\\(', w)),
            'stranded_housekeeping': w.count('stranded_woken = wake_stranded_integrations(cfg)'),
            'noeligible_except': w.count('except NoEligibleWork as exc:'),
            'loop60': w.count('KRIS_QWEN_LOOP_SLEEP", "60"'),
            'idle_status': w.count('write_worker_status(cfg, "IDLE"'),
            'tail_sleep': w.count('if interruptible_sleep(cfg, cfg.loop_sleep):'),
            'compat_523': p.count('TARGET_VERSION = "5.2.3"'),
            'control_210': c.count('CONTROL_VERSION = "2.1.0"'),
            'control_worker_args_field': c.count('worker_extra_args: tuple[str, ...]'),
            'control_fetch_job': c.count('def _fetch_latest_and_run_job(self) -> None:'),
            'control_fetch_entry': c.count('def fetch_latest_and_run(self) -> dict[str, Any]:'),
            'control_handler_stop': c.count('result = self.controller.request_safe_stop()'),
            'test_worker_args': t.count('worker_extra_args=(),'),
          }
          Path('qwen-always-on-gold-anchor-audit.json').write_text(json.dumps(checks, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(checks, indent=2, sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qwen-always-on-gold-anchor-audit.json
          git commit -m 'ci(qwen): record 5.3 materializer anchors'
          git push origin HEAD:refs/heads/agent/qwen-phone-control
