name: Worker D Bootstrap

on:
  push:
    branches:
      - agent/d/p3-readiness-fixtures

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/d/p3-readiness-fixtures
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: config/p2.python-version
          check-latest: false
      - name: Materialize verified deterministic source package
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import zipfile

          root = Path('.').resolve()
          parts = [Path(f'.worker_d_payload.part{index:02d}') for index in range(1, 6)]
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          observed = hashlib.sha256(payload).hexdigest()
          expected = '917748345350c98ef6e2b4746842490541f0e21599152cb10b4c6283fd73ac78'
          if observed != expected:
              raise SystemExit(f'payload checksum mismatch: {observed}')
          archive_path = Path('.worker_d_payload_v2.zip')
          archive_path.write_bytes(payload)
          with zipfile.ZipFile(archive_path) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('payload archive failed CRC validation')
              for member in archive.infolist():
                  target = (root / member.filename).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f'unsafe archive path: {member.filename}')
              archive.extractall(root)
          archive_path.unlink()
          Path('.worker_d_payload.zip').unlink(missing_ok=True)
          for path in parts:
              path.unlink()
          Path('.github/workflows/worker-d-bootstrap.yml').unlink()
          PY
      - name: Validate Worker D records
        run: |
          python tool/worker_d_p3_readiness.py --check --project .
          python -m unittest -v tool/worker_d_p3_readiness_test.py
          python tool/test_center_contracts.py check --project .
      - name: Regenerate canonical source manifest twice
        run: |
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/worker-d-source-manifest-first
          python tool/p1a_refresh_source_manifest.py .
          cmp /tmp/worker-d-source-manifest-first SOURCE_MANIFEST.sha256
      - name: Commit exact source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(p3): add browser runtime readiness and deterministic fixtures'
          git push origin HEAD:agent/d/p3-readiness-fixtures
