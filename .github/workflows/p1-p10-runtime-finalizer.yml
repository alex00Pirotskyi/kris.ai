name: P1-P10 Runtime Bundle Finalizer

on:
  push:
    branches:
      - hotfix/p2-p3-runtime-p1-p10-20260824

permissions:
  contents: write

concurrency:
  group: p1-p10-runtime-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
          check-latest: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Apply durable P2/P3 product bundle patch
        run: python tool/p1_p10_runtime_bundle_finalize.py

      - name: Make combined runtime qualification a normal PR gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/p1-p10-product-runtime.yml')
          s = p.read_text(encoding='utf-8')
          old = "on:\n  workflow_dispatch:\n"
          new = """on:\n  workflow_dispatch:\n  pull_request:\n    branches: [main]\n    paths:\n      - '.github/workflows/p1-p10-product-runtime.yml'\n      - 'lib/product/p2_*.dart'\n      - 'lib/product/product_runtime.dart'\n      - 'lib/product/browser/**'\n      - 'automation_host/**'\n      - 'tool/v70_*.py'\n      - 'tool/p3_stage_browser_runtime_bundle.py'\n      - 'tool/p9_*.py'\n      - 'tool/p10_*.py'\n      - 'tool/p2_p3_product_packaging_contract_test.py'\n      - 'test/product/p1_p10_packaged_runtime_smoke_test.dart'\n      - 'test/product/p2_p3_packaged_runtime_paths_test.dart'\n      - 'config/release_targets.v1.json'\n      - 'SOURCE_MANIFEST.sha256'\n"""
          if s.count(old) != 1:
              raise SystemExit('product runtime workflow trigger anchor drift')
          s = s.replace(old, new, 1)
          s = s.replace('.v70-dist/KRISTIN_PRODUCT_CURRENT_ACCOUNT_*.zip', '.v70-dist/KRISTIN_OWNER_MODE_*.zip')
          s = s.replace('.v70-dist/KRISTIN_PRODUCT_CURRENT_ACCOUNT_*.zip.sha256', '.v70-dist/KRISTIN_OWNER_MODE_*.zip.sha256')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/product/p2_runtime_resource_resolver.dart \
            lib/product/browser/browser_runtime_bundle.dart \
            test/product/p2_p3_packaged_runtime_paths_test.dart \
            test/product/p1_p10_packaged_runtime_smoke_test.dart

      - run: flutter pub get

      - name: Source and packaging contracts
        run: |
          python tool/p2_packaging_contract_test.py
          python tool/p2_p3_product_packaging_contract_test.py
          python -m unittest -v tool/p9_release_engineering_test.py
          python -m unittest -v tool/p9_update_install_test.py
          python -m unittest -v tool/p10_release_readiness_test.py
          flutter test --no-pub test/product/p2_p3_packaged_runtime_paths_test.dart
          flutter test --no-pub test/product/p2_single_click_owner_mode_test.dart
          flutter test --no-pub test/product/browser/browser_runtime_bundle_test.dart
          flutter test --no-pub test/product/browser/browser_product_runtime_test.dart
          flutter analyze --no-pub --fatal-warnings --fatal-infos

      - name: Remove all carrier files and refresh governed manifest
        run: |
          rm tool/p1_p10_runtime_bundle_finalize.py
          rm .github/workflows/p1-p10-runtime-finalizer.yml
          rm .github/workflows/p1-p10-runtime-materialize.yml
          python tool/p2_refresh_source_manifest.py .
          flutter test --no-pub test/product/source_contract_test.dart
          git diff --check

      - name: Publish durable candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "P1-P10: package P2 and P3 runtimes with release readiness"
          git push origin HEAD:hotfix/p2-p3-runtime-p1-p10-20260824
