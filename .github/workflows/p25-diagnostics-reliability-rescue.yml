name: P25 Diagnostics Reliability Rescue

on:
  push:
    branches:
      - 'agent/p25-diagnostics-reliability-rescue'
    paths:
      - 'lib/product/adaptive_mission_planning.dart'
      - 'lib/product/agent_decision.dart'
      - 'lib/product/agent_protocol.dart'
      - 'lib/product/execution_intelligence.dart'
      - 'lib/product/retry_policy.dart'
      - 'test/product/p25_diagnostics_reliability_rescue_test.dart'
      - '.github/workflows/p25-diagnostics-reliability-rescue.yml'

permissions:
  contents: read

concurrency:
  group: p25-diagnostics-reliability-rescue
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: P25 diagnostics regression suite
        run: flutter test --no-pub --concurrency=1 test/product/p25_diagnostics_reliability_rescue_test.dart
      - name: Adaptive planner regressions
        run: flutter test --no-pub --concurrency=1 test/product/adaptive_mission_planning_test.dart
      - name: Execution reliability regressions
        run: flutter test --no-pub --concurrency=1 test/product/execution_reliability_test.dart
      - name: Budget diagnostics regressions
        run: flutter test --no-pub --concurrency=1 test/product/budget_diagnostics_test.dart
      - name: Protocol and retry related product tests
        shell: bash
        run: |
          set -euo pipefail
          matches=()
          for file in test/product/*protocol*test.dart test/product/*retry*test.dart; do
            if [[ -f "$file" ]]; then
              matches+=("$file")
            fi
          done
          if (( ${#matches[@]} > 0 )); then
            flutter test --no-pub --concurrency=1 "${matches[@]}"
          fi
      - name: Analyzer
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos
      - name: Format and diff checks
        shell: bash
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/product/adaptive_mission_planning.dart \
            lib/product/agent_decision.dart \
            lib/product/agent_protocol.dart \
            lib/product/execution_intelligence.dart \
            lib/product/retry_policy.dart \
            test/product/p25_diagnostics_reliability_rescue_test.dart
          git diff --check
          git diff --exit-code
