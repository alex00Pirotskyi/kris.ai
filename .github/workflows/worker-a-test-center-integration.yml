name: Worker A Test Center Integration

on:
  push:
    branches:
      - agent/a/p1-p2-new-roadmap-execution

permissions:
  contents: write

concurrency:
  group: worker-a-test-center-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-p1a-source-profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply governed P1A source-only profile repair
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          registry_path = root / 'config/test_center_registry.v1.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          profile = next(
              item for item in registry['projectTestProfiles']
              if item['stableCheckId'] == 'tc.p1a.exit-gate'
          )
          profile['argv'] = [
              'python', 'tool/p1a_exit_gate_test.py', '--project', '.', '--source-only'
          ]
          profile['assuranceClass'] = 'source_contract'
          profile['evidenceDestination'] = (
              'release/evidence/generated/worker-a/p1a-exit-gate-source.json'
          )
          profile['inputPaths'] = [
              'tool/p1a_exit_gate_test.py',
              'release/evidence/P1A/manifest.json',
              'tasks/active/P1A-001.md',
              'tasks/active/.gitkeep',
          ]
          registry_path.write_text(
              json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          test_path = root / 'tool/worker_a_test_center_v1_test.py'
          text = test_path.read_text(encoding='utf-8')
          marker = '    def test_worker_b_review_is_immutable_history(self) -> None:\n'
          addition = '''    def test_p1a_profile_uses_governed_source_only_mode(self) -> None:\n        profile = next(\n            profile\n            for profile in self.registry["projectTestProfiles"]\n            if profile["stableCheckId"] == "tc.p1a.exit-gate"\n        )\n        self.assertEqual(\n            ["python", "tool/p1a_exit_gate_test.py", "--project", ".", "--source-only"],\n            profile["argv"],\n        )\n        self.assertEqual("source_contract", profile["assuranceClass"])\n\n'''
          if 'test_p1a_profile_uses_governed_source_only_mode' not in text:
              if marker not in text:
                  raise SystemExit('unit-test insertion marker missing')
              text = text.replace(marker, addition + marker)
              test_path.write_text(text, encoding='utf-8')
          PY
          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/worker_a_test_center_v1_test.py
          git diff --check
      - name: Commit bounded profile repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/test_center_registry.v1.json tool/worker_a_test_center_v1_test.py
          git commit -m 'fix(worker-a): use governed P1A source-only gate'
          git push origin HEAD:agent/a/p1-p2-new-roadmap-execution
