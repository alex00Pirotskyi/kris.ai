name: Worker A Test Center Integration

on:
  push:
    branches:
      - agent/a/p1-p2-new-roadmap-execution

permissions:
  contents: write
  actions: read

concurrency:
  group: worker-a-test-center-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-exact-stage1-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE1_COMMIT: 70bfeaaf62acad99bf4aa5195e97e5307c0d805f
      STAGE1_TREE: 04b4a452a31100ca7a82994749b78fcda3f61e25
      STAGE1_RUN: '31020134276'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download exact Stage 1 artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/worker-a-stage1"
          mkdir -p "$ROOT"/{linux,macos,windows,manifest}
          gh run download "$STAGE1_RUN" --repo "$GITHUB_REPOSITORY" --name "worker-a-test-center-${STAGE1_RUN}-linux" --dir "$ROOT/linux"
          gh run download "$STAGE1_RUN" --repo "$GITHUB_REPOSITORY" --name "worker-a-test-center-${STAGE1_RUN}-macos" --dir "$ROOT/macos"
          gh run download "$STAGE1_RUN" --repo "$GITHUB_REPOSITORY" --name "worker-a-test-center-${STAGE1_RUN}-windows" --dir "$ROOT/windows"
          gh run download "$STAGE1_RUN" --repo "$GITHUB_REPOSITORY" --name "worker-a-source-manifest-${STAGE1_RUN}" --dir "$ROOT/manifest"
      - name: Build canonical durable evidence package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/worker-a-stage1"
          DEST="release/evidence/worker-a/test-center-v1"
          mkdir -p "$DEST/executions" "$DEST/source-manifest-candidate"
          cp "$ROOT/linux/development-verification.json" "$DEST/executions/linux.json"
          cp "$ROOT/macos/development-verification.json" "$DEST/executions/macos.json"
          cp "$ROOT/windows/development-verification.json" "$DEST/executions/windows.json"
          cp "$ROOT/manifest/SOURCE_MANIFEST.sha256" "$DEST/source-manifest-candidate/SOURCE_MANIFEST.sha256"
          cp "$ROOT/manifest/source-manifest-metadata.json" "$DEST/source-manifest-candidate/metadata.json"
          python tool/worker_a_test_center_v1.py validate-execution --project . "$DEST/executions/linux.json"
          python tool/worker_a_test_center_v1.py validate-execution --project . "$DEST/executions/macos.json"
          python tool/worker_a_test_center_v1.py validate-execution --project . "$DEST/executions/windows.json"
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          dest = root / 'release/evidence/worker-a/test-center-v1'
          expected_commit = '70bfeaaf62acad99bf4aa5195e97e5307c0d805f'
          expected_tree = '04b4a452a31100ca7a82994749b78fcda3f61e25'
          platforms = {}
          for platform in ('linux', 'macos', 'windows'):
              path = dest / 'executions' / f'{platform}.json'
              body = json.loads(path.read_text(encoding='utf-8'))
              if body['request']['candidateCommit'] != expected_commit:
                  raise SystemExit(f'{platform}: candidate commit mismatch')
              if body['request']['candidateTree'] != expected_tree:
                  raise SystemExit(f'{platform}: candidate tree mismatch')
              if body['overallState'] != 'PASS':
                  raise SystemExit(f'{platform}: source result is not PASS')
              platforms[platform] = {
                  'path': path.as_posix(),
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'resultCount': len(body['results']),
                  'overallState': body['overallState'],
              }
          manifest_path = dest / 'source-manifest-candidate/SOURCE_MANIFEST.sha256'
          metadata_path = dest / 'source-manifest-candidate/metadata.json'
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          if metadata['candidateCommit'] != expected_commit or metadata['candidateTree'] != expected_tree:
              raise SystemExit('source manifest candidate binding mismatch')
          package = {
              'schemaVersion': '1.0.0',
              'classification': 'SOURCE_VERIFICATION_EVIDENCE_ONLY',
              'baseline': {
                  'commit': '0a4176bcbcb975684c3a590be652c9fffe1ce770',
                  'tree': '641e11e63fa84f3a16dc4d74b418778839ce5bc2',
              },
              'workerBBase': {
                  'commit': '2b8988b84c4eb8929cc1e733de274d5f484afea1',
                  'tree': 'b33344fd5a7bcc212fd94933e4962654de062aac',
                  'pullRequest': 65,
              },
              'implementationCandidate': {
                  'commit': expected_commit,
                  'tree': expected_tree,
                  'branch': 'agent/a/p1-p2-new-roadmap-execution',
              },
              'evidenceGeneration': {
                  'workflow': 'Worker A Test Center Integration',
                  'runId': 31020134276,
                  'event': 'push',
              },
              'artifacts': {
                  'linux': {'artifactId': 8936232494, 'artifactDigest': 'sha256:dee4264f96337e570eb8ad503b69f8d439b4e1bf3dff40a4d10e522fd545eded'},
                  'macos': {'artifactId': 8936273539, 'artifactDigest': 'sha256:fbcf8c13c9ec1791415b8d9505dfe76f3f4e9879604d6f0db72f6792a943de68'},
                  'windows': {'artifactId': 8936285728, 'artifactDigest': 'sha256:6105dacceee5e689f2079a0702d7734e442e9e82e4423b3d9f317d321814f63f'},
                  'sourceManifest': {'artifactId': 8936225568, 'artifactDigest': 'sha256:c62493e6f80b8d7c8af17cb13b5b1d5ade264006820c0ed462bb0b29eea27077'},
              },
              'executionRecords': platforms,
              'sourceManifestCandidate': {
                  'path': manifest_path.as_posix(),
                  'sha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
                  'metadataPath': metadata_path.as_posix(),
                  'entryCount': metadata['entryCount'],
                  'idempotent': metadata['idempotent'],
                  'checkModeNonMutating': metadata['checkModeNonMutating'],
              },
              'behavioralCertification': {
                  'windows': 'BLOCKED_EXTERNAL',
                  'macos': 'BLOCKED_EXTERNAL',
                  'linux': 'BLOCKED_EXTERNAL',
                  'canonicalHelloTxt': 'BLOCKED_EXTERNAL',
                  'cleanup': 'BLOCKED_EXTERNAL',
                  'processTreeTermination': 'BLOCKED_EXTERNAL',
                  'aggregate': 'BLOCKED',
                  'reason': 'Governed jobs require workflow_dispatch on protected main, approved p2-controlled environment, signed provisioning, exact package identity, and self-hosted interactive-desktop runners.',
              },
              'review': {
                  'historicalDecision': 'REQUEST_CHANGES',
                  'historicalCommit': '345847cb06b3123f2841bdface68a6615cd5de42',
                  'historicalTree': '10345698dea33222955cce23e5c45e59459f626f',
                  'freshReviewRequired': True,
              },
              'completionClaim': False,
              'supportPromotion': False,
          }
          (dest / 'evidence-package.json').write_text(json.dumps(package, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Generate packaging-tree source manifest twice
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/packaging-manifest-first.sha256"
          FIRST=$(sha256sum SOURCE_MANIFEST.sha256 | cut -d' ' -f1)
          python tool/test_center_contracts.py check --project .
          python tool/worker_a_test_center_v1.py check --project .
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/packaging-manifest-first.sha256" SOURCE_MANIFEST.sha256
          SECOND=$(sha256sum SOURCE_MANIFEST.sha256 | cut -d' ' -f1)
          test "$FIRST" = "$SECOND"
          git diff --check
      - name: Commit Stage 2 evidence packaging
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256 release/evidence/worker-a/test-center-v1
          git commit -m 'evidence(worker-a): package exact Test Center candidate records'
          git push origin HEAD:agent/a/p1-p2-new-roadmap-execution
