name: Qwen Always-On Compat Finalize

on:
  push:
    branches:
      - agent/mission-execution-v15-gold
    paths:
      - .github/workflows/qwen-always-on-compat-finalize.yml

permissions:
  contents: write

concurrency:
  group: qwen-always-on-compat-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact Qwen branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Remove temporary Qwen materializer transports
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/qwen-always-on-materialize.yml
          rm -f .github/workflows/qwen-always-on-anchor-audit.yml
          rm -f qwen-always-on-anchor-audit.json
          rm -f qwen-always-on-gold-anchor-audit.json

      - name: Update operator documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/KRIS_QWEN_SERVER_CONTROL.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Always-on Product protocol (5.3 / controller 2.2)'
          if marker not in text:
              text += '''\n\n## Always-on Product protocol (5.3 / controller 2.2)\n\nNormal `IDLE` is a red-alert condition rather than a steady state. The phone launcher executes the fail-closed 5.3 compatibility entry, which immediately chains successful Work Orders, wakes eligible context-independent R1 review lanes, wakes reviewed helper integration lanes, and when the governed frontier is genuinely empty can create one bounded `PRODUCT_DEFECT_REPAIR` Work Order only against an existing ACTIVE canonical Product PR through Mission Runtime `work-create`. Path authority, WIP limits, semaphores, exact-head review independence, and protected-main restrictions remain fail-closed.\n\nThe phone launcher also executes controller compatibility entry 2.2. Automatic update monitoring is enabled by default. Every 30 seconds (configurable with `KRIS_QWEN_AUTO_UPDATE_SECONDS`) it compares the configured remote Qwen branch head with the local checkout. A newer head reuses the existing graceful drain, dirty-checkout refusal, fast-forward-only update, refreshed version probe, and worker restart path. If the worker exits unexpectedly while the remote head is current, it is started again. A deliberate Safe stop pauses automatic restart until Run current Qwen or Fetch latest + run Qwen is requested.\n\nThe compatibility entries are operational adapters over the retained normal 5.2 source/controller until the same 5.3/2.2 semantics are fully materialized into those large source files. The version shown by the phone flow is the executed compatibility-entry version, not the retained base-file label.\n'''
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Compile and execute exact compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_test.py
          python3 tool/kris_qwen_control_test.py
          python3 tool/kris_qwen_worker.py.compat.py version > /tmp/qwen-version.json
          python3 - <<'PY'
          import importlib.util, json, pathlib
          value = json.load(open('/tmp/qwen-version.json', encoding='utf-8'))
          assert value['scriptVersion'] == '5.3.0', value
          path = pathlib.Path('tool/kris_qwen_control.py.compat.py')
          spec = importlib.util.spec_from_file_location('qwen_control_compat_probe', path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          assert module.TARGET_CONTROL_VERSION == '2.2.0'
          assert module.base.CONTROL_VERSION == '2.2.0'
          worker_compat = pathlib.Path('tool/kris_qwen_worker.py.compat.py').read_text(encoding='utf-8')
          for marker in ('TARGET_VERSION = "5.3.0"', 'def seed_continuous_product_work', 'RED_ALERT_FRONTIER'):
              assert marker in worker_compat, marker
          launcher = pathlib.Path('run_my_server.py').read_text(encoding='utf-8')
          assert 'kris_qwen_control.py.compat.py' in launcher
          assert 'KRIS_QWEN_AUTO_UPDATE_SECONDS' in launcher
          PY
          git diff --check

      - name: Regenerate source manifest twice
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/manifest.first
          python3 tool/p1a_refresh_source_manifest.py .
          cmp -s /tmp/manifest.first SOURCE_MANIFEST.sha256
          python3 tool/p1a_source_manifest_test.py .
          git diff --check

      - name: Publish validated compat candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(qwen): finalize always-on phone execution'
          candidate="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/agent/qwen-phone-control
          git fetch origin '+refs/heads/agent/qwen-phone-control:refs/remotes/origin/agent/qwen-phone-control'
          [[ "$(git rev-parse origin/agent/qwen-phone-control)" == "$candidate" ]]
          echo "QWEN_ALWAYS_ON_COMPAT_PASS candidate=$candidate"
