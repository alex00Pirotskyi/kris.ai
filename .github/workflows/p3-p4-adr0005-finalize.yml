name: P3 P4 ADR-0005 Closure

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p3-p4-adr0005-finalize.yml
      - docs/adr/ADR-0005-browser-storage.md
      - docs/roadmap/DECISIONS.md
      - release/evidence/P3-008/**
      - release/evidence/P4-011/**
      - test/product/browser/browser_profile_isolation_test.dart

permissions:
  contents: write

concurrency:
  group: p3-p4-adr0005-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p3-p4-adr0005-closure-20260823
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Verify current-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format closure test
        run: dart format test/product/browser/browser_profile_isolation_test.dart
      - name: P3-008 and P4-011 acceptance tests
        run: >-
          flutter test --no-pub --reporter expanded
          test/product/browser/browser_profile_isolation_test.dart
          test/product/browser/browser_phase_completion_test.dart
          test/product/browser/browser_security_suite_test.dart
          test/product/research/research_runtime_test.dart
      - name: Complete browser and research regression
        run: >-
          flutter test --no-pub --concurrency=1 --reporter expanded
          test/product/browser
          test/product/research
      - name: Fatal static analysis
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos
      - name: Complete Flutter regression
        run: flutter test --no-pub --concurrency=1 --reporter expanded
      - name: Record owner-task evidence and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = 'b1bc568d8b69534eb65a0cfc7b86dfcebe893051'
          common = {
              'schemaVersion': '1.0.0',
              'baseMainSha': base,
              'runner': 'github-actions:ubuntu-24.04',
              'result': 'passed',
              'commands': [
                  'flutter test --no-pub --reporter expanded test/product/browser/browser_profile_isolation_test.dart test/product/browser/browser_phase_completion_test.dart test/product/browser/browser_security_suite_test.dart test/product/research/research_runtime_test.dart',
                  'flutter test --no-pub --concurrency=1 --reporter expanded test/product/browser test/product/research',
                  'flutter analyze --no-pub --fatal-warnings --fatal-infos',
                  'flutter test --no-pub --concurrency=1 --reporter expanded',
              ],
          }
          packets = {
              'P3-008': 'Cross-profile ciphertext transplantation is rejected and browser profile storage remains authenticated and application-owned.',
              'P4-011': 'Content-addressed research storage deduplicates identical objects while preserving fetch and citation provenance.',
          }
          for task, assertion in packets.items():
              payload = dict(common)
              payload['taskId'] = task
              payload['assertion'] = assertion
              path = Path('release/evidence') / task / 'test-results.json'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/p3-p4-adr0005-finalize.yml
          python tool/p2_refresh_source_manifest.py .
          git add -A
      - name: Verify clean durable delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'SOURCE_MANIFEST.sha256',
              'docs/adr/ADR-0005-browser-storage.md',
              'docs/roadmap/DECISIONS.md',
              'release/evidence/P3-008/manifest.json',
              'release/evidence/P3-008/test-results.json',
              'release/evidence/P4-011/manifest.json',
              'release/evidence/P4-011/test-results.json',
              'test/product/browser/browser_profile_isolation_test.dart',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', 'origin/main', '--'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected ADR-0005 closure delta: {sorted(changed)}')
          PY
      - name: Deterministic release validator
        run: python tool/validate_release.py
      - name: Publish clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(p3-p4): accept browser and research storage contract'
          git push origin HEAD:agent/p3-p4-adr0005-closure-20260823
