name: hf-runner-manual-title-tighten

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/runner-capability-followup
          fetch-depth: 0

      - name: Tighten manual-only fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          domain = Path('lib/product/domain.dart')
          text = domain.read_text(encoding='utf-8')
          old = """      title: json['title']?.toString().trim().isNotEmpty == true
                  ? json['title'].toString().trim()
                  : (json['manual'] == true ? 'Manual checkpoint' : 'Task'),"""
          new = """      title: json['title']?.toString().trim().isNotEmpty == true
                  ? json['title'].toString().trim()
                  : (json['manual'] == true
                      ? 'Manual checkpoint'
                      : (json['title']?.toString() ?? 'Task')),"""
          if text.count(old) != 1:
              raise SystemExit('domain manual-title fallback anchor mismatch')
          domain.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('test/product/hf_runner_chat_convergence_test.dart')
          text = test.read_text(encoding='utf-8')
          anchor = """  test('timeline projection keeps durable and live activity together', () {"""
          regression = """  test('blank non-manual task titles remain invalid', () {
            final task = PlanTaskRecord.fromJson(const <String, dynamic>{
              'id': 'non-manual-task',
              'title': '   ',
              'manual': false,
            });
            expect(task.title.trim(), isEmpty);
          });

          """
          if text.count(anchor) != 1:
              raise SystemExit('non-manual regression insertion anchor mismatch')
          test.write_text(text.replace(anchor, regression + anchor), encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - run: flutter pub get
      - run: dart format lib/product/domain.dart test/product/hf_runner_chat_convergence_test.dart
      - run: flutter test --no-pub --concurrency=1 --reporter expanded test/product/hf_runner_chat_convergence_test.dart
      - run: flutter analyze --no-pub --fatal-warnings --fatal-infos

      - name: Commit durable tightening and remove qualifier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hf-runner-manual-title-tighten.yml
          git add lib/product/domain.dart test/product/hf_runner_chat_convergence_test.dart
          git diff --cached --check
          git commit -m "fix(runner): keep manual title fallback bounded"
          git push origin HEAD:hotfix/runner-capability-followup
