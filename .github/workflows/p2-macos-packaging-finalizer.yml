name: P2 macOS packaging finalizer

on:
  push:
    branches:
      - agent/gpt-gold/gs-003d-macos-package-signing

permissions:
  contents: write

concurrency:
  group: p2-macos-packaging-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact branch
        run: git switch --force-create agent/gpt-gold/gs-003d-macos-package-signing "$GITHUB_SHA"
      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Build source and manifest commits
        run: python3 tool/p2_macos_packaging_finalizer.py
