name: temporary-one-kristin-final-dispatch

on:
  push:
    branches:
      - automation/one-kristin-format-finalize-20260901

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify and dispatch exact final head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: d9e92c44c4f3fbcc21c60b1592dfd52dc71ddfb1
          FINAL_BRANCH: feat/one-kristin-convergence-qualified
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$FINAL_BRANCH" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$actual" = "$EXPECTED_SHA"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$FINAL_BRANCH\"}"
