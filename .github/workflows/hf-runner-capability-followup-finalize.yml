name: hf-runner-capability-followup-finalize

on:
  push:
    branches:
      - hotfix/runner-capability-followup
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/runner-capability-followup
          fetch-depth: 0

      - name: Apply bounded durable repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(path, old, new, count=1):
              text = read(path)
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact matches, found {actual}')
              write(path, text.replace(old, new))

          path = 'lib/product/workspace_tools.dart'
          text = read(path)
          import_anchor = "import 'product_error_normalizer.dart';\nimport 'retry_policy.dart';"
          if text.count(import_anchor) != 1:
              raise SystemExit(f'{path}: process-launch import anchor mismatch')
          text = text.replace(
              import_anchor,
              "import 'product_error_normalizer.dart';\nimport 'process_launch.dart';\nimport 'retry_policy.dart';",
          )
          launch_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)process = await Process\.start\(\n'
              r'(?P<argindent>[ \t]*)executable,\n'
              r'(?P<body>.*?)'
              r'(?P<shellindent>[ \t]*)runInShell: false,\n'
              r'(?P<tail>.*?)'
              r'(?P=indent)\);',
              re.S,
          )
          matches = list(launch_pattern.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f'{path}: expected 2 guarded process launches, found {len(matches)}')

          def repair_launch(match):
              indent = match.group('indent')
              return (
                  f"{indent}final launch = await resolveProcessLaunchTarget(executable);\n"
                  f"{indent}process = await Process.start(\n"
                  f"{match.group('argindent')}launch.executable,\n"
                  f"{match.group('body')}"
                  f"{match.group('shellindent')}runInShell: launch.runInShell,\n"
                  f"{match.group('tail')}"
                  f"{indent});"
              )

          text = launch_pattern.sub(repair_launch, text)
          write(path, text)

          path = 'lib/product/prompt_planning.dart'
          text = read(path)
          title_pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)var title = raw\['title'\]\?\.toString\(\)\.trim\(\) \?\? '';\n"
          )
          matches = list(title_pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'{path}: expected 1 generated-task title anchor, found {len(matches)}')
          text = title_pattern.sub(
              lambda match: (
                  match.group(0)
                  + f"{match.group('indent')}if (title.isEmpty && raw['manual'] == true) {{\n"
                  + f"{match.group('indent')}  title = 'Manual checkpoint';\n"
                  + f"{match.group('indent')}}}\n"
              ),
              text,
          )
          write(path, text)

          path = 'lib/product/domain.dart'
          text = read(path)
          domain_pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)title: json\['title'\]\?\.toString\(\) \?\? 'Task',\n"
          )
          matches = list(domain_pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'{path}: expected 1 PlanTaskRecord title fallback, found {len(matches)}')
          text = domain_pattern.sub(
              lambda match: (
                  f"{match.group('indent')}title: json['title']?.toString().trim().isNotEmpty == true\n"
                  f"{match.group('indent')}    ? json['title'].toString().trim()\n"
                  f"{match.group('indent')}    : (json['manual'] == true ? 'Manual checkpoint' : 'Task'),\n"
              ),
              text,
          )
          write(path, text)

          replace_exact(
              'lib/product/p5_global_autonomy.dart',
              "'Model ${snapshot.modelLabel}. ${snapshot.sessionBreakdown}. '",
              "'Running model ${snapshot.modelLabel}. ${snapshot.sessionBreakdown}. '",
          )
          replace_exact(
              'lib/product/p5_global_autonomy.dart',
              "label: 'Model: ${snapshot.modelLabel}',",
              "label: 'Running model: ${snapshot.modelLabel}',",
          )

          path = 'test/product/hf_runner_chat_convergence_test.dart'
          text = read(path)
          test_anchor = "  test('timeline projection keeps durable and live activity together', () {"
          if text.count(test_anchor) != 1:
              raise SystemExit(f'{path}: timeline insertion anchor mismatch')
          manual_test = """  test('manual task deserialization gives blank checkpoints a name', () {
            final task = PlanTaskRecord.fromJson(const <String, dynamic>{
              'id': 'manual-task',
              'title': '   ',
              'instructions': 'Wait for explicit user approval.',
              'manual': true,
            });
            expect(task.title, 'Manual checkpoint');
            expect(task.manual, isTrue);
          });

          """
          text = text.replace(test_anchor, manual_test + test_anchor)
          write(path, text)

          path = 'test/product/p5_global_autonomy_test.dart'
          text = read(path)
          model_expect = "    expect(find.byKey(const Key('p5-global-model')), findsOneWidget);\n"
          if text.count(model_expect) != 1:
              raise SystemExit(f'{path}: model-chip test anchor mismatch')
          text = text.replace(
              model_expect,
              model_expect
              + "    expect(\n"
              + "      find.text('Running model: ollama/test-model@digest'),\n"
              + "      findsOneWidget,\n"
              + "    );\n",
          )
          write(path, text)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - run: flutter pub get

      - name: Format touched Dart sources
        shell: bash
        run: |
          dart format \
            lib/product/domain.dart \
            lib/product/p5_global_autonomy.dart \
            lib/product/process_launch.dart \
            lib/product/prompt_planning.dart \
            lib/product/run_preflight.dart \
            lib/product/workspace_tools.dart \
            test/product/hf_runner_chat_convergence_test.dart \
            test/product/p5_global_autonomy_test.dart \
            test/product/process_launch_test.dart

      - name: Focused qualification
        run: >-
          flutter test --no-pub --concurrency=1 --reporter expanded
          test/product/hf_runner_chat_convergence_test.dart
          test/product/p5_global_autonomy_test.dart
          test/product/process_launch_test.dart

      - name: Analyzer qualification
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos

      - name: Commit durable repairs and remove qualifier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hf-runner-capability-followup-finalize.yml
          git add \
            lib/product/domain.dart \
            lib/product/p5_global_autonomy.dart \
            lib/product/process_launch.dart \
            lib/product/prompt_planning.dart \
            lib/product/run_preflight.dart \
            lib/product/workspace_tools.dart \
            test/product/hf_runner_chat_convergence_test.dart \
            test/product/p5_global_autonomy_test.dart \
            test/product/process_launch_test.dart
          git diff --cached --check
          git commit -m "fix(runner): repair capability and Windows follow-up"
          git push origin HEAD:hotfix/runner-capability-followup
