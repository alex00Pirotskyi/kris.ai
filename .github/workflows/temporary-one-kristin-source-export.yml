name: temporary-one-kristin-source-export

on:
  push:
    branches:
      - draft/one-kristin-convergence-checkpoint

permissions:
  contents: read

jobs:
  export:
    name: export-exact-recovered-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: dd2f46ba6df3fb25adc2c8c927e807147b8f16f2
          fetch-depth: 1
      - name: Verify exact recovered head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dd2f46ba6df3fb25adc2c8c927e807147b8f16f2"
      - name: Package public source checkout
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/kris-exact-recovered-source.tgz" .
      - name: Upload exact recovered source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: one-kristin-exact-recovered-source-${{ github.run_id }}
          path: ${{ runner.temp }}/kris-exact-recovered-source.tgz
          if-no-files-found: error
          retention-days: 1
