name: Temporary Session Deferred Projection

on:
  push:
    branches:
      - feat/one-kristin-convergence
    paths:
      - .github/workflows/tmp-session-deferred-projection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/one-kristin-convergence
          fetch-depth: 1
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply session projection patch
        run: python tool/tmp_session_deferred_projection.py
      - name: Format changed Dart
        run: dart format lib/product/kristin_conversation_session.dart test/product/kristin_conversation_session_test.dart
      - name: Verify diff shape
        run: git diff --check
      - name: Run focused contracts
        run: flutter test test/product/kristin_conversation_session_test.dart test/product/agent_deferred_interaction_test.dart
      - name: Commit projection
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/product/kristin_conversation_session.dart test/product/kristin_conversation_session_test.dart
          git commit -m "feat(product): project deferred input through Kristin session"
          git push origin HEAD:feat/one-kristin-convergence
