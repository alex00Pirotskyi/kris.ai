name: Temporary Session Deferred Projection

on:
  push:
    branches:
      - feat/one-kristin-convergence
    paths:
      - .github/workflows/tmp-session-deferred-projection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/one-kristin-convergence
          fetch-depth: 1
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Project deferred interaction through canonical session
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/product/kristin_conversation_session.dart')
          text = path.read_text()
          text = text.replace(
              "import 'chat_control_plane.dart';\n",
              "import 'agent_deferred_interaction.dart';\nimport 'chat_control_plane.dart';\n",
              1,
          )
          text = text.replace(
              "  RunRecord? _currentRun;\n  bool _awaitingPermission = false;\n",
              "  RunRecord? _currentRun;\n  AgentDeferredInteraction? _deferredInteraction;\n  bool _awaitingPermission = false;\n",
              1,
          )
          text = text.replace(
              "  RunRecord? get currentRun => _currentRun;\n  bool get awaitingPermission => _awaitingPermission;\n",
              "  RunRecord? get currentRun => _currentRun;\n  AgentDeferredInteraction? get deferredInteraction => _deferredInteraction;\n  bool get awaitingPermission => _awaitingPermission;\n",
              1,
          )
          marker = "  bool get runAwaitingApproval =>\n      _currentRun?.state == RunState.awaitingApproval;\n\n"
          addition = marker + "  bool get awaitingUserInput =>\n      _deferredInteraction?.awaitingUserResponse ?? false;\n\n  String? get deferredUserPrompt {\n    final interaction = _deferredInteraction;\n    if (interaction == null || !interaction.awaitingUserResponse) return null;\n    final question = interaction.decision.question?.trim() ?? '';\n    if (question.isNotEmpty) return question;\n    final reason = interaction.decision.reason.trim();\n    return reason.isEmpty\n        ? 'Kristin needs your input before continuing.'\n        : reason;\n  }\n\n"
          if text.count(marker) != 1:
              raise SystemExit('runAwaitingApproval marker mismatch')
          text = text.replace(marker, addition, 1)
          text = text.replace(
              "    _currentRun = null;\n    _awaitingPermission = false;\n    clearLiveExecution();\n",
              "    _currentRun = null;\n    _deferredInteraction = null;\n    _awaitingPermission = false;\n    clearLiveExecution();\n",
              1,
          )
          method_marker = "  void setAwaitingPermission(bool value) {\n    _awaitingPermission = value;\n  }\n\n"
          method = method_marker + "  void setDeferredInteraction(AgentDeferredInteraction? interaction) {\n    if (interaction == null) {\n      _deferredInteraction = null;\n      return;\n    }\n    final run = _currentRun;\n    if (run == null) {\n      throw const KristinConversationSessionException(\n        'conversation_deferred_run_missing',\n        'A deferred interaction requires an attached durable run.',\n      );\n    }\n    if (interaction.runId != run.id) {\n      throw KristinConversationSessionException(\n        'conversation_deferred_run_mismatch',\n        'Deferred interaction ${interaction.id} belongs to run ${interaction.runId}, not ${run.id}.',\n      );\n    }\n    if (!run.items.any(\n      (progress) => progress.item.id == interaction.workItemId,\n    )) {\n      throw KristinConversationSessionException(\n        'conversation_deferred_work_item_mismatch',\n        'Deferred interaction ${interaction.id} references work item ${interaction.workItemId} outside run ${run.id}.',\n      );\n    }\n    if (interaction.pending && runTerminal) {\n      throw const KristinConversationSessionException(\n        'conversation_deferred_run_terminal',\n        'A terminal run cannot await a deferred interaction.',\n      );\n    }\n    _deferredInteraction = interaction;\n  }\n\n"
          if text.count(method_marker) != 1:
              raise SystemExit('setAwaitingPermission marker mismatch')
          text = text.replace(method_marker, method, 1)
          reset_marker = "    _prepared = null;\n    _currentRun = null;\n    _awaitingPermission = false;\n    _activeRequest = '';\n"
          reset_new = "    _prepared = null;\n    _currentRun = null;\n    _deferredInteraction = null;\n    _awaitingPermission = false;\n    _activeRequest = '';\n"
          if text.count(reset_marker) != 1:
              raise SystemExit('reset marker mismatch')
          text = text.replace(reset_marker, reset_new, 1)
          attach_marker = "    if (existing == null || existing.id != run.id) {\n      clearLiveExecution();\n    }\n"
          attach_new = "    if (existing == null || existing.id != run.id) {\n      _deferredInteraction = null;\n      clearLiveExecution();\n    }\n"
          if text.count(attach_marker) != 1:
              raise SystemExit('attach marker mismatch')
          text = text.replace(attach_marker, attach_new, 1)
          path.write_text(text)

          test = Path('test/product/kristin_conversation_session_test.dart')
          text = test.read_text()
          text = text.replace(
              "import 'package:flutter_test/flutter_test.dart';\n",
              "import 'package:flutter_test/flutter_test.dart';\nimport 'package:kristin_local_agent/product/agent_decision_v3.dart';\nimport 'package:kristin_local_agent/product/agent_deferred_interaction.dart';\n",
              1,
          )
          marker = "  test('awaiting approval run projects to the permission state', () {\n"
          addition = """  test('pending user takeover is projected through the canonical session', () {
    final session = KristinConversationSession();
    session.restoreRun(_run(id: 'run-a', state: RunState.paused));
    session.setDeferredInteraction(
      _interaction(
        runId: 'run-a',
        status: AgentDeferredInteractionStatus.pending,
      ),
    );

    expect(session.awaitingUserInput, isTrue);
    expect(session.deferredUserPrompt, 'Which target should I use?');
    expect(session.deferredInteraction?.userResponseGrantsAuthority, isFalse);
  });

  test('deferred interaction cannot cross durable run identity', () {
    final session = KristinConversationSession();
    session.restoreRun(_run(id: 'run-a', state: RunState.paused));

    expect(
      () => session.setDeferredInteraction(
        _interaction(
          runId: 'run-b',
          status: AgentDeferredInteractionStatus.pending,
        ),
      ),
      throwsA(
        isA<KristinConversationSessionException>().having(
          (error) => error.code,
          'code',
          'conversation_deferred_run_mismatch',
        ),
      ),
    );
  });

  test('resolved takeover no longer projects as awaiting user input', () {
    final session = KristinConversationSession();
    session.restoreRun(_run(id: 'run-a', state: RunState.paused));
    session.setDeferredInteraction(
      _interaction(
        runId: 'run-a',
        status: AgentDeferredInteractionStatus.resolved,
        userResponse: 'Use staging.',
      ),
    );

    expect(session.awaitingUserInput, isFalse);
    expect(session.deferredUserPrompt, isNull);
  });

"""
          if text.count(marker) != 1:
              raise SystemExit('test marker mismatch')
          text = text.replace(marker, addition + marker, 1)
          helper_marker = "LiveRunSignal _signal(String runId, int sequence, LiveRunSignalKind kind) =>\n"
          helper = """AgentDeferredInteraction _interaction({
  required String runId,
  required AgentDeferredInteractionStatus status,
  String? userResponse,
}) =>
    AgentDeferredInteraction(
      id: 'interaction-a',
      runId: runId,
      workItemId: 'work-a',
      decision: AgentDecisionV3(
        kind: AgentDecisionV3Kind.userTakeover,
        question: 'Which target should I use?',
        reason: 'The target is ambiguous.',
      ),
      status: status,
      createdAt: DateTime.utc(2026, 8, 29),
      updatedAt: DateTime.utc(2026, 8, 29),
      checkpointId: 'checkpoint-a',
      userResponse: userResponse,
    );

"""
          if text.count(helper_marker) != 1:
              raise SystemExit('helper marker mismatch')
          text = text.replace(helper_marker, helper + helper_marker, 1)
          test.write_text(text)
          PY
          dart format lib/product/kristin_conversation_session.dart test/product/kristin_conversation_session_test.dart
          git diff --check
          git diff -- lib/product/kristin_conversation_session.dart test/product/kristin_conversation_session_test.dart
      - name: Run focused session contracts
        run: flutter test test/product/kristin_conversation_session_test.dart test/product/agent_deferred_interaction_test.dart
      - name: Commit canonical projection
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/product/kristin_conversation_session.dart test/product/kristin_conversation_session_test.dart
          git commit -m "feat(product): project deferred input through Kristin session"
          git push origin HEAD:feat/one-kristin-convergence
