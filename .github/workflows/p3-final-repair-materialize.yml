name: P3 Final Repair Materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p3-final-repair-materialize.yml'
      - '.p3-final-repair/**'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/p3-phase-completion'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p3-phase-completion
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Repair final P3 gates and publish clean candidate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python .p3-final-repair/materialize.py
          dart format test/product/browser/web_preview_test.dart
          python tool/p0_008_roadmap_test.py --project .
          flutter test --no-pub test/product/browser/web_preview_test.dart --reporter expanded
          rm -f .github/workflows/p3-final-repair-materialize.yml
          rm -rf .p3-final-repair
          python tool/p2_refresh_source_manifest.py .
          flutter test --no-pub test/product/source_contract_test.dart --reporter expanded
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'test(p3): stabilize preview gate and preserve ADR authority'
          git push origin HEAD:agent/p3-phase-completion
