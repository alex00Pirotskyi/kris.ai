name: P1-P8 Source Contract Secret Scan Repair

on:
  push:
    branches:
      - 'agent/p1-p8-source-convergence-20260823'
    paths:
      - '.github/workflows/p1-p8-source-contract-secret-scan-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p1-p8-source-convergence-20260823
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Repair stale semantic assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/product/source_contract_test.dart')
          text = path.read_text(encoding='utf-8')
          old = "      expect(scanner, contains('is_generated_path(p.relative_to(ROOT))'));\n"
          new = """      expect(scanner, contains('from source_tree_policy import is_generated_path'));
      expect(scanner, contains('relative = path.relative_to(root)'));
      expect(scanner, contains('if is_generated_path(relative):'));
"""
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('stale secret scan assertion anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          dart format test/product/source_contract_test.dart
          flutter pub get
          flutter test --no-pub --concurrency=1 test/product/source_contract_test.dart
      - name: Publish clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p1-p8-source-contract-secret-scan-repair.yml
          python tool/p2_refresh_source_manifest.py .
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(train): align secret scan path hygiene contract'
          git push origin HEAD:agent/p1-p8-source-convergence-20260823
