name: P3 current-main manifest receipt

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p3-current-main-manifest.yml

permissions:
  contents: write

env:
  BASE_MAIN_SHA: 7b90b6412e1d91244a74fd6f1ada09382458ee42
  TARGET_BRANCH: agent/p3-phase-closure-main-20260822
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  TRANSPORT_PATH: .github/workflows/p3-current-main-manifest.yml

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact current-main transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          test -f "$TRANSPORT_PATH"
          test -z "$(git status --short)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - name: Generate transport-free manifest twice
        shell: bash
        run: |
          set -euo pipefail
          git rm -f "$TRANSPORT_PATH"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --check
      - name: Assert exact seven-file durable scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_MAIN_SHA" | sort > "$RUNNER_TEMP/actual.paths"
          cat > "$RUNNER_TEMP/expected.paths" <<'EOF'
          SOURCE_MANIFEST.sha256
          lib/product/browser/browser_quality.dart
          lib/product/browser/browser_workspace.dart
          test/product/browser/browser_quality_recipes_test.dart
          test/product/browser/fixtures/p3_browser/fixture.js
          test/product/browser/fixtures/p3_browser/index.html
          test/product/browser/fixtures/p3_browser/popup.html
          EOF
          sort -o "$RUNNER_TEMP/expected.paths" "$RUNNER_TEMP/expected.paths"
          diff -u "$RUNNER_TEMP/expected.paths" "$RUNNER_TEMP/actual.paths"
      - name: Publish exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(p3): close browser quality security fixture and recipe gaps'
          git push origin "HEAD:$TARGET_BRANCH"
