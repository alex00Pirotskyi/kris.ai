name: P3 current-main manifest receipt

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p3-current-main-manifest.yml

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - name: Generate transport-free manifest twice
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/p3-current-main-manifest.yml
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p3-current-main-source-manifest
          path: SOURCE_MANIFEST.sha256
          if-no-files-found: error
          retention-days: 7
