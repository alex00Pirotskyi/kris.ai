name: P4-001 Exact Manifest Capture

on:
  pull_request:
    paths:
      - .github/workflows/p4-001-manifest-capture.yml
      - .github/workflows/p4-001-search-provider.yml
      - .github/workflows/p4-001-finalize-evidence.yml
      - .github/workflows/p4-001-pr-handoff.yml
      - .github/workflows/p4-001-publish-candidate.yml

permissions:
  contents: write

env:
  P4_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  capture:
    name: p4-001-exact-manifest-capture
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.P4_CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Assert exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${P4_CANDIDATE_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Generate final Stage 1 manifest blob
        id: final_manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/p4-001-manifest-capture"
          mkdir -p "${output_dir}"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${output_dir}/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp --silent "${output_dir}/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          git show -s --format='%H%n%T' HEAD > "${output_dir}/candidate.txt"
          python - "${output_dir}" <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import pathlib
          import sys
          import urllib.request

          output = pathlib.Path(sys.argv[1])
          project_manifest = pathlib.Path('SOURCE_MANIFEST.sha256')
          final_manifest = output / 'SOURCE_MANIFEST.stage1.sha256'
          remove = {
              '.github/workflows/p4-001-finalize-evidence.yml',
              '.github/workflows/p4-001-manifest-capture.yml',
              '.github/workflows/p4-001-pr-handoff.yml',
              '.github/workflows/p4-001-publish-candidate.yml',
          }
          kept: list[str] = []
          removed: set[str] = set()
          for line in project_manifest.read_text(encoding='utf-8').splitlines(keepends=True):
              relative = line.split('  ', 1)[1].rstrip('\n')
              if relative in remove:
                  removed.add(relative)
              else:
                  kept.append(line)
          if removed != remove:
              raise SystemExit(f'workflow deletion set mismatch: {sorted(removed)}')
          final_bytes = ''.join(kept).encode('utf-8')
          final_manifest.write_bytes(final_bytes)
          digest = hashlib.sha256(final_bytes).hexdigest()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=json.dumps(
                  {
                      'content': base64.b64encode(final_bytes).decode('ascii'),
                      'encoding': 'base64',
                  }
              ).encode('utf-8'),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          blob_sha = payload['sha']
          metadata = {
              'schemaVersion': '1.0.0',
              'taskId': 'P4-001',
              'sourceCandidateCommit': os.environ['P4_CANDIDATE_SHA'],
              'sourceCandidateTree': pathlib.Path(output / 'candidate.txt').read_text(encoding='utf-8').splitlines()[1],
              'generator': 'tool/p1a_refresh_source_manifest.py',
              'removedPaths': sorted(remove),
              'finalManifestSha256': digest,
              'gitBlobSha': blob_sha,
              'idempotent': True,
          }
          (output / 'metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          (output / 'git-blob-sha.txt').write_text(blob_sha + '\n', encoding='utf-8')
          print(f'P4_STAGE1_MANIFEST_BLOB={blob_sha}')
          print(f'P4_STAGE1_MANIFEST_SHA256={digest}')
          PY
          blob_sha="$(cat "${output_dir}/git-blob-sha.txt")"
          digest="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["finalManifestSha256"])' "${output_dir}/metadata.json")"
          echo "blob_sha=${blob_sha}" >> "$GITHUB_OUTPUT"
          echo "sha256=${digest}" >> "$GITHUB_OUTPUT"
      - name: Upload exact final manifest evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-001-exact-manifest-${{ env.P4_CANDIDATE_SHA }}
          path: ${{ runner.temp }}/p4-001-manifest-capture
          if-no-files-found: error
          retention-days: 7
      - name: Report final manifest identity
        shell: bash
        run: |
          echo "P4_STAGE1_MANIFEST_BLOB=${{ steps.final_manifest.outputs.blob_sha }}"
          echo "P4_STAGE1_MANIFEST_SHA256=${{ steps.final_manifest.outputs.sha256 }}"
