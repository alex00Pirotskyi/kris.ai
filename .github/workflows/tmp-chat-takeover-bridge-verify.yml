name: Temporary Chat Takeover Bridge Verify

on:
  push:
    branches:
      - feat/one-kristin-convergence
    paths:
      - .github/workflows/tmp-chat-takeover-bridge-verify.yml

permissions:
  contents: write

concurrency:
  group: tmp-chat-takeover-bridge-verify
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/one-kristin-convergence
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Patch Chat durable takeover bridge
        shell: bash
        run: |
          set -euo pipefail
          python tool/tmp_chat_takeover_bridge_patch.py
          python tool/tmp_chat_takeover_contract_fix.py

      - name: Resolve package context and format
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/product/product_runtime.dart lib/product/chat_control_plane_studio.dart lib/product/chat_control_plane_studio_view.dart test/product/chat_deferred_takeover_bridge_test.dart
          git diff --check -- lib/product/product_runtime.dart lib/product/chat_control_plane_studio.dart lib/product/chat_control_plane_studio_view.dart test/product/chat_deferred_takeover_bridge_test.dart

      - name: Analyze Chat bridge
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --fatal-infos --fatal-warnings lib/product/product_runtime.dart lib/product/chat_control_plane_studio.dart lib/product/chat_control_plane_studio_view.dart test/product/chat_deferred_takeover_bridge_test.dart

      - name: Run focused convergence contracts
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/product/kristin_conversation_session_test.dart test/product/agent_deferred_interaction_test.dart test/product/runner_deferred_takeover_contract_test.dart test/product/chat_deferred_takeover_bridge_test.dart

      - name: Remove helpers and refresh exact manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-chat-takeover-bridge-verify.yml
          rm tool/tmp_chat_takeover_bridge_patch.py
          rm tool/tmp_chat_takeover_contract_fix.py
          python tool/tmp_source_manifest_refresh.py
          rm tool/tmp_source_manifest_refresh.py
          git diff --check
          git status --short

      - name: Commit verified Chat bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bridge Chat durable user takeover"
          git push origin HEAD:feat/one-kristin-convergence
