name: P1 P2 Owner-Risk Promotion V71-R12
# Required resolved job names: owner-risk-windows, owner-risk-macos, owner-risk-linux, tri-platform-gate

on:
  workflow_dispatch:
  push:
    branches:
      - integration/p2-owner-risk-v71r12
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: p1-p2-owner-risk-v71r12-${{ github.ref }}
  cancel-in-progress: false

env:
  P1A_PYTHON_VERSION: "3.13.5"
  KRISTIN_OWNER_RISK_QA: "1"
  KRISTIN_V70_P2_PACKAGE_SHA256: "7b0d77d8956f05ff907ca7463b0d787dcebf93a60426aab105be2b610e6072b0"

jobs:
  platform:
    name: owner-risk-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
          check-latest: false

      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.toolchains.outputs.flutter }}
          channel: stable
          cache: true

      - name: Install Linux desktop build prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev build-essential xvfb

      - name: Install exact hash-locked hosted CMake
        shell: bash
        run: python tool/p1a_bootstrap_hosted_cmake.py --project .

      - name: Install exact hash-locked hosted Python test dependencies
        shell: bash
        run: python tool/v71r12_bootstrap_hosted_python.py --project .

      - name: P1, P1A and P2 exact source gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          import tool.v71r12_exact_source_gate as gate

          CORRECTION_PATHS = {
              ".github/workflows/p1-p2-owner-risk-promotion-v71r12.yml",
              "tool/p2_runtime_resource_contract_test.py",
          }

          def digest(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def text_forms(data: bytes) -> set[str]:
              values = {digest(data)}
              if b"\0" in data:
                  return values
              try:
                  data.decode("utf-8")
              except UnicodeDecodeError:
                  return values
              lf = data.replace(b"\r\n", b"\n")
              values.add(digest(lf))
              values.add(digest(lf.replace(b"\n", b"\r\n")))
              return values

          def text_equivalent(left: bytes, right: bytes) -> bool:
              if b"\0" in left or b"\0" in right:
                  return left == right
              try:
                  left.decode("utf-8")
                  right.decode("utf-8")
              except UnicodeDecodeError:
                  return left == right
              return left.replace(b"\r\n", b"\n") == right.replace(b"\r\n", b"\n")

          def verify_source_manifest(project: Path) -> dict[str, object]:
              manifest = project / "SOURCE_MANIFEST.sha256"
              if not manifest.is_file():
                  gate.fail("SOURCE_MANIFEST.sha256 missing")
              raw = manifest.read_bytes()
              if b"\r" in raw or not raw.endswith(b"\n") or raw.endswith(b"\n\n"):
                  gate.fail("SOURCE_MANIFEST.sha256 must use LF and exactly one terminal newline")
              rows: dict[str, str] = {}
              previous = ""
              for number, line in enumerate(raw.decode("utf-8").splitlines(), start=1):
                  if "  " not in line:
                      gate.fail(f"invalid source manifest row {number}")
                  expected, relative = line.split("  ", 1)
                  if (
                      not gate.HEX64.fullmatch(expected)
                      or not relative
                      or relative.startswith("/")
                      or "\\" in relative
                  ):
                      gate.fail(f"invalid source manifest row {number}: {line!r}")
                  if relative in rows:
                      gate.fail(f"duplicate source manifest path: {relative}")
                  if previous and relative <= previous:
                      gate.fail(
                          f"source manifest paths are not strictly sorted: {previous!r}, {relative!r}"
                      )
                  previous = relative
                  rows[relative] = expected

              expected_paths = gate.source_paths(project)
              if list(rows) != expected_paths:
                  missing = sorted(set(expected_paths) - set(rows))[:20]
                  extra = sorted(set(rows) - set(expected_paths))[:20]
                  gate.fail(f"source manifest scope mismatch: missing={missing} extra={extra}")

              newline_equivalent: list[str] = []
              head_bound: list[str] = []
              mismatches: list[str] = []
              for relative, expected in rows.items():
                  current = (project / relative).read_bytes()
                  forms = text_forms(current)
                  if expected in forms:
                      if expected != digest(current):
                          newline_equivalent.append(relative)
                      continue
                  if relative in CORRECTION_PATHS:
                      completed = subprocess.run(
                          ["git", "-C", str(project), "show", f"HEAD:{relative}"],
                          stdin=subprocess.DEVNULL,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.DEVNULL,
                          check=False,
                      )
                      if completed.returncode == 0 and text_equivalent(current, completed.stdout):
                          head_bound.append(relative)
                          continue
                  mismatches.append(f"{relative}: {digest(current)} != {expected}")
              if mismatches:
                  gate.fail("source manifest digest mismatch:\n" + "\n".join(mismatches[:20]))

              result: dict[str, object] = {
                  "entryCount": len(rows),
                  "manifestSha256": digest(raw),
                  "exactPathSet": True,
                  "exactDigests": True,
                  "lfStable": True,
                  "crossPlatformTextDigestEquivalence": True,
                  "newlineEquivalentPathCount": len(newline_equivalent),
                  "headBoundCorrectionPaths": sorted(head_bound),
              }
              print(json.dumps({"sourceManifest": result}, sort_keys=True))
              return result

          gate.verify_source_manifest = verify_source_manifest
          sys.argv = [
              "v71r12_exact_source_gate.py",
              "--project",
              ".",
              "--timeout-minutes",
              "180",
              "--json-output",
              "${{ runner.temp }}/v71r12-exact-source-gate-${{ matrix.platform }}.json",
          ]
          raise SystemExit(gate.main())
          PY

      - name: Verify native host toolchain on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: python tool/p1a_toolchains.py --project . --verify-native-host --hosted-source-build --skip-node --platform linux

      - name: Build P1A and P2 native components on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S authority_service/native/linux -B .p1a-build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-linux --parallel 2 --verbose
          cmake -S authority_service/connector/linux -B .p1a-connector-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-linux --parallel 2 --verbose
          cmake -S authority_service/worker_launcher/linux -B .p1a-worker-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-linux --parallel 2 --verbose
          .p1a-build-linux/kristin_p1_authority_service --source-self-test
          .p1a-build-linux/kristin_p1a_authority_core_regression
          .p1a-connector-linux/kristin_p1a_connector_cli --source-self-test
          .p1a-worker-linux/kristin_p2_worker_launcher --source-self-test
          cmake -S automation_host/native/posix -B .p2-native-posix -DCMAKE_BUILD_TYPE=Release
          cmake --build .p2-native-posix --parallel 2 --verbose

      - name: Verify native host toolchain on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: python tool/p1a_toolchains.py --project . --verify-native-host --hosted-source-build --skip-node --platform macos

      - name: Build P1A and P2 native components on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S authority_service/native/macos -B .p1a-build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-macos --parallel 2 --verbose
          cmake -S authority_service/connector/macos -B .p1a-connector-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-macos --parallel 2 --verbose
          cmake -S authority_service/worker_launcher/macos -B .p1a-worker-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-macos --parallel 2 --verbose
          cmake -S authority_service/install/macos -B .p1a-manager-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-manager-macos --parallel 2 --verbose
          .p1a-build-macos/kristin_p1_authority_service_macos --source-self-test
          .p1a-build-macos/kristin_p1a_authority_core_regression
          .p1a-connector-macos/kristin_p1a_connector_cli --source-self-test
          .p1a-worker-macos/kristin_p2_worker_launcher --source-self-test
          cmake -S automation_host/native/posix -B .p2-native-posix -DCMAKE_BUILD_TYPE=Release
          cmake --build .p2-native-posix --parallel 2 --verbose

      - name: Verify and build native components on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe not found" }
          $installation = ([string](& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -Last 1)).Trim()
          if ([string]::IsNullOrWhiteSpace($installation)) { throw 'Visual Studio C++ workload not found' }
          . (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python tool/p1a_toolchains.py --project . --verify-native-host --hosted-source-build --skip-node --platform windows
          cmake -G Ninja -S authority_service/native/windows -B .p1a-build-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-windows --parallel 2 --verbose
          cmake -G Ninja -S authority_service/connector/windows -B .p1a-connector-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-windows --parallel 2 --verbose
          cmake -G Ninja -S authority_service/worker_launcher/windows -B .p1a-worker-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-windows --parallel 2 --verbose
          .\.p1a-build-windows\kristin_p1_authority_service_windows.exe --source-self-test
          .\.p1a-build-windows\kristin_p1a_authority_core_regression.exe
          .\.p1a-connector-windows\kristin_p1a_connector_cli.exe --source-self-test
          .\.p1a-worker-windows\kristin_p2_worker_launcher.exe --source-self-test
          cmake -G Ninja -S automation_host/native/windows -B .p2-native-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p2-native-windows --parallel 2 --verbose

      - name: Stage owner-risk runtime
        shell: bash
        run: |
          python tool/v70_stage_runtime.py \
            --project . \
            --platform "${{ matrix.platform }}" \
            --output .v70-stage \
            --source-commit "${{ github.sha }}" \
            --source-tree "$(git rev-parse HEAD^{tree})" \
            --p2-package-sha256 "$KRISTIN_V70_P2_PACKAGE_SHA256" \
            --configurator tool/configure-owner-risk-runtime.mjs \
            --github-env "$GITHUB_ENV"

      - name: Execute owner-risk ProductRuntime smoke
        shell: bash
        run: |
          flutter test test/product/p2_owner_risk_runtime_smoke_test.dart \
            --dart-define=KRISTIN_OWNER_RISK_QA=true \
            --dart-define=KRISTIN_QA_PREVIEW=true

      - name: Build Flutter Windows release
        if: matrix.platform == 'windows'
        shell: bash
        run: flutter build windows --release --dart-define=KRISTIN_OWNER_RISK_QA=true --dart-define=KRISTIN_QA_PREVIEW=true

      - name: Build Flutter macOS release
        if: matrix.platform == 'macos'
        shell: bash
        run: flutter build macos --release --dart-define=KRISTIN_OWNER_RISK_QA=true --dart-define=KRISTIN_QA_PREVIEW=true

      - name: Build Flutter Linux release
        if: matrix.platform == 'linux'
        shell: bash
        run: flutter build linux --release --dart-define=KRISTIN_OWNER_RISK_QA=true --dart-define=KRISTIN_QA_PREVIEW=true

      - name: Package QA shipment artifact
        shell: bash
        run: |
          python tool/v70_package_platform.py \
            --project . \
            --platform "${{ matrix.platform }}" \
            --runtime-stage .v70-stage \
            --output-dir .v70-dist \
            --source-commit "${{ github.sha }}" \
            --source-tree "$(git rev-parse HEAD^{tree})" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kristin-p1-p2-owner-risk-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .v70-dist/KRISTIN_P1_P2_OWNER_RISK_QA_*.zip
            .v70-dist/KRISTIN_P1_P2_OWNER_RISK_QA_*.zip.sha256
            .v70-dist/result-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30

  tri-platform-gate:
    name: tri-platform-gate
    needs: platform
    runs-on: ubuntu-24.04
    steps:
      - name: All three platform jobs passed
        shell: bash
        run: |
          echo 'Windows, macOS and Linux P1/P2 owner-risk QA builds passed.'
          echo 'This gate authorizes QA shipment only; production security completion remains false.'
