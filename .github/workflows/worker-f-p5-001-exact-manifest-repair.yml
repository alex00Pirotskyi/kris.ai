name: Worker F P5-001 exact manifest repair

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: worker-f-p5-001-exact-manifest-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Refresh manifests and create clean publication object
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLEAN_BASE_TREE: 941170a86309e59105ddd2204022f8f2756197b3
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/worker-f-p5-001-exact-manifest-repair.yml

          python tool/worker_f_p5_ia.py manifest --project .
          python tool/worker_f_p5_ia.py manifest --project . --check
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/worker-f-source-manifest
          python tool/p1a_refresh_source_manifest.py .
          cmp /tmp/worker-f-source-manifest SOURCE_MANIFEST.sha256

          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/worker_f_p5_ia.py check --project .
          git diff --check

          python - <<'PY'
          from __future__ import annotations
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'

          def request(method: str, path: str, payload=None):
              body = None
              headers = {
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              if payload is not None:
                  body = json.dumps(payload).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(
                  f'{api}/{path}', data=body, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)

          elements = []
          for relative in (
              'release/evidence/P5-001/manifest.json',
              'SOURCE_MANIFEST.sha256',
          ):
              raw = Path(relative).read_bytes()
              blob = request('POST', 'git/blobs', {
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              })
              elements.append({
                  'path': relative,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob['sha'],
              })

          tree = request('POST', 'git/trees', {
              'base_tree': os.environ['CLEAN_BASE_TREE'],
              'tree': elements,
          })
          commit = request('POST', 'git/commits', {
              'message': 'P5-001: refresh exact manifest bindings',
              'tree': tree['sha'],
              'parents': [os.environ['GITHUB_SHA']],
          })
          print(f'WORKER_F_MANIFEST_COMMIT={commit["sha"]}')
          print(f'WORKER_F_MANIFEST_TREE={tree["sha"]}')
          print(f'WORKER_F_MANIFEST_PARENT={os.environ["GITHUB_SHA"]}')
          PY
