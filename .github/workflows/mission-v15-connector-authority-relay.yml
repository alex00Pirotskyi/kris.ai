name: Mission V1.5 Connector Authority Relay

on:
  push:
    branches:
      - agent/mission-runtime
    paths:
      - 'docs/roadmap/missions/runtime-commands/*.json'

permissions:
  contents: write

concurrency:
  group: mission-v15-connector-authority-relay
  cancel-in-progress: false

jobs:
  apply-authority-command:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mission-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Fetch live branches and refresh runtime head
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git reset --hard refs/remotes/origin/agent/mission-runtime
      - name: Resolve the immutable connector command
        id: command
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
        run: |
          mapfile -t commands < <(
            git diff-tree --no-commit-id --name-only --diff-filter=A -r "$EVENT_BEFORE" "$EVENT_AFTER" -- \
              'docs/roadmap/missions/runtime-commands/*.json'
          )
          if [ "${#commands[@]}" -ne 1 ]; then
            echo "expected exactly one newly-added connector command, found ${#commands[@]}" >&2
            printf '%s\n' "${commands[@]}" >&2
            exit 1
          fi
          command="${commands[0]}"
          test -f "$command"
          operation="$(python - "$command" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          operation = value.get('operation')
          if not isinstance(operation, str) or not operation:
              raise SystemExit('connector command operation is missing')
          print(operation)
          PY
          )"
          case "$operation" in
            APPEND_SAFE_DART_SET|UPDATE_RELEASE_VALIDATOR_SOURCE_POLICY_V1|MATERIALIZE_SOURCE_MANIFEST_V1) ;;
            *) echo "unsupported connector authority operation: $operation" >&2; exit 1 ;;
          esac
          echo "path=$command" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
      - name: Apply append-safe Dart source authority command
        if: steps.command.outputs.operation == 'APPEND_SAFE_DART_SET'
        shell: bash
        run: |
          python tool/mission_v15_connector_authority_apply.py \
            --project . \
            --command '${{ steps.command.outputs.path }}' \
            --output "$RUNNER_TEMP/connector-authority-result.json"
      - name: Apply bounded release-validator source policy command
        if: steps.command.outputs.operation == 'UPDATE_RELEASE_VALIDATOR_SOURCE_POLICY_V1'
        shell: bash
        run: |
          python tool/mission_v15_release_validator_policy_apply.py \
            --project . \
            --command '${{ steps.command.outputs.path }}' \
            --output "$RUNNER_TEMP/connector-authority-result.json"
      - name: Materialize exact Product PR source manifest
        if: steps.command.outputs.operation == 'MATERIALIZE_SOURCE_MANIFEST_V1'
        shell: bash
        run: |
          python tool/mission_v15_source_manifest_release_apply.py \
            --project . \
            --command '${{ steps.command.outputs.path }}' \
            --output "$RUNNER_TEMP/connector-authority-result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: mission-v15-connector-authority-result
          path: ${{ runner.temp }}/connector-authority-result.json
