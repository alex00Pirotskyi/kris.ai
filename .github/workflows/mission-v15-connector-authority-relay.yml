name: Mission V1.5 Connector Authority Relay

on:
  push:
    branches:
      - agent/mission-runtime
    paths:
      - 'docs/roadmap/missions/runtime-commands/*.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: mission-v15-connector-authority-relay
  cancel-in-progress: false

jobs:
  apply-authority-command:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mission-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Fetch live branches and refresh runtime head
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git reset --hard refs/remotes/origin/agent/mission-runtime
      - name: Resolve the immutable connector command
        id: command
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
        run: |
          mapfile -t commands < <(
            git diff-tree --no-commit-id --name-only --diff-filter=A -r "$EVENT_BEFORE" "$EVENT_AFTER" -- \
              'docs/roadmap/missions/runtime-commands/*.json'
          )
          if [ "${#commands[@]}" -ne 1 ]; then
            echo "expected exactly one newly-added connector command, found ${#commands[@]}" >&2
            printf '%s\n' "${commands[@]}" >&2
            exit 1
          fi
          command="${commands[0]}"
          test -f "$command"
          operation="$(python - "$command" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          operation = value.get('operation')
          if not isinstance(operation, str) or not operation:
              raise SystemExit('connector command operation is missing')
          print(operation)
          PY
          )"
          case "$operation" in
            APPEND_SAFE_DART_SET|APPEND_SAFE_JSON_IDENTITIES_V1|UPDATE_RELEASE_VALIDATOR_SOURCE_POLICY_V1|MATERIALIZE_SOURCE_MANIFEST_V1|DISPATCH_EXACT_PRODUCT_GATES_V1|DELETE_EXACT_LEGACY_BRANCH_V1) ;;
            *) echo "unsupported connector authority operation: $operation" >&2; exit 1 ;;
          esac
          echo "path=$command" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
      - name: Apply append-safe Dart source authority command
        if: steps.command.outputs.operation == 'APPEND_SAFE_DART_SET'
        shell: bash
        run: |
          python tool/mission_v15_connector_authority_apply.py \
            --project . \
            --command '${{ steps.command.outputs.path }}' \
            --output "$RUNNER_TEMP/connector-authority-result.json"
      - name: Apply explicit append-safe JSON authority command
        if: steps.command.outputs.operation == 'APPEND_SAFE_JSON_IDENTITIES_V1'
        shell: bash
        run: |
          python tool/mission_v15_connector_json_authority_apply.py \
            --project . \
            --command '${{ steps.command.outputs.path }}' \
            --output "$RUNNER_TEMP/connector-authority-result.json"
      - name: Apply bounded release-validator source policy command
        if: steps.command.outputs.operation == 'UPDATE_RELEASE_VALIDATOR_SOURCE_POLICY_V1'
        shell: bash
        run: |
          python tool/mission_v15_release_validator_policy_apply.py \
            --project . \
            --command '${{ steps.command.outputs.path }}' \
            --output "$RUNNER_TEMP/connector-authority-result.json"
      - name: Materialize exact Product PR source manifest
        if: steps.command.outputs.operation == 'MATERIALIZE_SOURCE_MANIFEST_V1'
        shell: bash
        run: |
          python tool/mission_v15_source_manifest_release_apply.py \
            --project . \
            --command '${{ steps.command.outputs.path }}' \
            --output "$RUNNER_TEMP/connector-authority-result.json"
      - name: Validate bounded exact Product PR CI dispatch
        if: steps.command.outputs.operation == 'DISPATCH_EXACT_PRODUCT_GATES_V1'
        shell: bash
        run: |
          python tool/mission_v15_exact_product_ci_dispatch.py \
            --project . \
            --command '${{ steps.command.outputs.path }}' \
            --output "$RUNNER_TEMP/connector-authority-result.json"
      - name: Dispatch and bind exact product-gates run
        if: steps.command.outputs.operation == 'DISPATCH_EXACT_PRODUCT_GATES_V1'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESULT_PATH: ${{ runner.temp }}/connector-authority-result.json
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.parse
          import urllib.request

          result_path = pathlib.Path(os.environ['RESULT_PATH'])
          result = json.loads(result_path.read_text(encoding='utf-8'))
          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          workflow = result['workflowFile']
          branch = result['productBranch']
          expected_head = result['productHead']
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'kris-mission-v15-exact-ci-dispatch',
          }

          payload = json.dumps({'ref': branch}).encode('utf-8')
          request = urllib.request.Request(
              f"{api_root}/actions/workflows/{urllib.parse.quote(workflow, safe='')}/dispatches",
              data=payload,
              headers={**headers, 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201, 204):
                  raise RuntimeError(f'workflow dispatch returned HTTP {response.status}')

          query = urllib.parse.urlencode({
              'event': 'workflow_dispatch',
              'branch': branch,
              'per_page': 30,
          })
          allocated = None
          for _ in range(30):
              list_request = urllib.request.Request(
                  f"{api_root}/actions/workflows/{urllib.parse.quote(workflow, safe='')}/runs?{query}",
                  headers=headers,
              )
              with urllib.request.urlopen(list_request, timeout=30) as response:
                  payload = json.loads(response.read().decode('utf-8'))
              for run in payload.get('workflow_runs', []):
                  if run.get('event') == 'workflow_dispatch' and run.get('head_sha') == expected_head:
                      allocated = run
                      break
              if allocated is not None:
                  break
              time.sleep(2)
          if allocated is None:
              raise RuntimeError(
                  f'workflow_dispatch did not allocate an exact-head run for {expected_head}'
              )

          result['dispatchedRunId'] = allocated['id']
          result['dispatchedRunHead'] = allocated['head_sha']
          result['dispatchedRunEvent'] = allocated['event']
          result['dispatchedRunStatus'] = allocated['status']
          result_path.write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Validate exact legacy-debt branch reap
        if: steps.command.outputs.operation == 'DELETE_EXACT_LEGACY_BRANCH_V1'
        shell: bash
        run: |
          python tool/mission_v15_legacy_branch_reap.py \
            --project . \
            --command '${{ steps.command.outputs.path }}' \
            --output "$RUNNER_TEMP/connector-authority-result.json"
      - name: Delete only the exact reviewed legacy-debt branch
        if: steps.command.outputs.operation == 'DELETE_EXACT_LEGACY_BRANCH_V1'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESULT_PATH: ${{ runner.temp }}/connector-authority-result.json
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          result_path = pathlib.Path(os.environ['RESULT_PATH'])
          result = json.loads(result_path.read_text(encoding='utf-8'))
          policy = {
              'schemaVersion': '1.0.0',
              'roadmapAuthority': 'docs/roadmap/MASTER.md',
              'defaultBranch': 'main',
              'keep': [
                  {'name': 'main', 'reason': 'protected default branch'},
              ],
              'delete': [
                  {
                      'name': result['targetBranch'],
                      'expectedSha': result['expectedTargetHead'],
                      'class': result['cleanupClass'],
                      'reason': 'Mission Execution 1.5 exact legacy-debt branch-budget reclamation',
                  },
              ],
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'mission-v15-one-branch-hygiene.json').write_text(
              json.dumps(policy, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          python tool/branch_hygiene.py \
            --config "$RUNNER_TEMP/mission-v15-one-branch-hygiene.json" \
            --repository "$GITHUB_REPOSITORY" \
            --execute \
            --receipt "$RUNNER_TEMP/mission-v15-branch-reap-receipt.json"
          python - <<'PY'
          import json
          import os
          import pathlib

          result_path = pathlib.Path(os.environ['RESULT_PATH'])
          result = json.loads(result_path.read_text(encoding='utf-8'))
          receipt = json.loads(
              pathlib.Path(os.environ['RUNNER_TEMP'], 'mission-v15-branch-reap-receipt.json').read_text(encoding='utf-8')
          )
          result['branchHygieneReceipt'] = receipt
          result['deleted'] = receipt.get('status') == 'complete' and receipt.get('afterBranchCount', 0) < receipt.get('beforeBranchCount', 0)
          if not result['deleted']:
              raise SystemExit('exact legacy-debt branch was not proven deleted')
          result_path.write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mission-v15-connector-authority-result
          path: ${{ runner.temp }}/connector-authority-result.json
