name: One Kristin Source Freeze Focused

on:
  push:
    branches:
      - draft/one-kristin-development
    paths:
      - .github/workflows/one-kristin-source-freeze-focused.yml

permissions:
  contents: write

concurrency:
  group: one-kristin-source-freeze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Freeze deterministic source manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-kristin-source-freeze-focused.yml
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/one-kristin-source-manifest.sha256
          python tool/p1a_refresh_source_manifest.py .
          diff -u /tmp/one-kristin-source-manifest.sha256 SOURCE_MANIFEST.sha256
          git diff --check
      - name: Commit qualified source freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "test(kristin): refresh governed source manifest"
          git push origin HEAD:draft/one-kristin-development
