name: One Kristin Source Freeze Focused

on:
  push:
    branches:
      - draft/one-kristin-development
    paths:
      - tool/apply_one_kristin_source_freeze.py
      - .github/workflows/one-kristin-source-freeze-focused.yml

permissions:
  contents: write

concurrency:
  group: one-kristin-source-freeze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Apply exact source inventory
        shell: bash
        run: python tool/apply_one_kristin_source_freeze.py
      - name: Format source contract
        shell: bash
        run: dart format test/product/source_contract_test.dart
      - name: Resolve package
        shell: bash
        run: flutter pub get
      - name: Verify governed source contract
        shell: bash
        run: flutter test --no-pub --concurrency=1 test/product/source_contract_test.dart
      - name: Rebind toolchain authority to resolved lock
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/apply_one_kristin_source_freeze.py
          rm -f .github/workflows/one-kristin-source-freeze-focused.yml
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          path = root / 'config/toolchains.lock.json'
          manifest = json.loads(path.read_text(encoding='utf-8'))
          lock_sha = hashlib.sha256((root / 'pubspec.lock').read_bytes()).hexdigest()
          matched = False
          for entry in manifest['lockfiles']:
              if entry['path'] == 'pubspec.lock':
                  entry['sha256'] = lock_sha
                  matched = True
          if not matched:
              raise SystemExit('pubspec.lock is absent from P0 toolchain authority')
          payload = {
              'schemaVersion': manifest['schemaVersion'],
              'sourceCommit': manifest['sourceCommit'],
              'python': manifest['python'],
              'flutter': manifest['flutter'],
              'dart': manifest['dart'],
              'githubActions': manifest['githubActions'],
              'runners': manifest['runners'],
              'cache': manifest['cache'],
              'lockfiles': manifest['lockfiles'],
          }
          canonical = (
              json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n'
          ).encode('utf-8')
          manifest['declaredInputFingerprint'] = hashlib.sha256(canonical).hexdigest()
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'pubspecLockSha256': lock_sha, 'fingerprint': manifest['declaredInputFingerprint']}, sort_keys=True))
          PY
          python tool/p2_extend_toolchain_lock.py --project .
          python tool/toolchain_lock_test.py --source-only
      - name: Freeze deterministic source manifest
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/one-kristin-source-manifest.sha256
          python tool/p1a_refresh_source_manifest.py .
          diff -u /tmp/one-kristin-source-manifest.sha256 SOURCE_MANIFEST.sha256
          git diff --check
      - name: Commit qualified source freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "test(kristin): freeze governed convergence source"
          git push origin HEAD:draft/one-kristin-development
