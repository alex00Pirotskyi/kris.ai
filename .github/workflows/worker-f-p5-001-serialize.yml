name: Worker F P5-001 serialize source

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  actions: write
  contents: write

jobs:
  serialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Cancel older competing Worker F runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs?branch=agent/f/P5-001-information-architecture&per_page=100" \
            --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and (.id|tostring) != env.CURRENT_RUN) | .id' \
            | while read -r run_id; do
                gh api --method POST "repos/$REPO/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
              done
          sleep 15
      - name: Execute exactly one reviewed materializer or repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyyaml
          if [[ -f lib/p5_ia_preview.dart && -f .github/workflows/worker-f-p5-001-repair.yml ]]; then
            MODE=repair
            SOURCE=.github/workflows/worker-f-p5-001-repair.yml
            JOB=repair
            STEP='Apply bounded gate and support-state repairs'
          else
            MODE=materialize
            SOURCE=.github/workflows/worker-f-materialize-p5-001.yml
            JOB=materialize
            STEP='Materialize reviewed Worker F objects'
          fi
          test -f "$SOURCE"
          export SOURCE JOB STEP MODE
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          source=Path(os.environ['SOURCE'])
          payload=yaml.safe_load(source.read_text(encoding='utf-8'))
          steps=payload['jobs'][os.environ['JOB']]['steps']
          script=next(step['run'] for step in steps if step.get('name')==os.environ['STEP'])
          temp_files=[
            '.github/workflows/worker-f-bootstrap.yml',
            '.github/workflows/worker-f-materialize-p5-001.yml',
            '.github/workflows/worker-f-stage2-orchestrator.yml',
            '.github/workflows/worker-f-p5-001-repair.yml',
            '.github/workflows/worker-f-stage2-orchestrator-v2.yml',
            '.github/workflows/worker-f-p5-001-serialize.yml',
          ]
          marker='rm -f .github/workflows/worker-f-bootstrap.yml'
          replacement='rm -f ' + ' \\\n            '.join(temp_files)
          if marker in script:
              start=script.index(marker)
              line_end=script.find('\n',start)
              # Materializer has a short two-file rm line; replace complete command line.
              script=script[:start]+replacement+script[line_end:]
          elif 'rm -f .github/workflows/worker-f-materialize-p5-001.yml' in script:
              start=script.index('rm -f .github/workflows/worker-f-materialize-p5-001.yml')
              # Repair command spans backslash continuation lines until git add.
              end=script.index('git add -A .github/workflows',start)
              script=script[:start]+replacement+'\n          '+script[end:]
          else:
              raise RuntimeError('temporary workflow cleanup command not found')
          out=Path('/tmp/worker-f-selected.sh')
          out.write_text('#!/usr/bin/env bash\n'+script+'\n',encoding='utf-8')
          out.chmod(0o755)
          print(f"selected mode={os.environ['MODE']} source={source}")
          PY
          /tmp/worker-f-selected.sh
