name: Temporary Source Manifest Refresh

on:
  push:
    branches:
      - feat/one-kristin-convergence
    paths:
      - .github/workflows/tmp-source-manifest-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/one-kristin-convergence
          fetch-depth: 0
      - name: Refresh exact source manifest and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-source-manifest-refresh.yml
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import importlib.util
          from pathlib import Path
          import subprocess
          import sys

          root = Path('.').resolve()
          policy_path = root / 'tool/source_tree_policy.py'
          spec = importlib.util.spec_from_file_location('tmp_source_policy', policy_path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load source-tree policy')
          policy = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = policy
          spec.loader.exec_module(policy)

          raw = subprocess.check_output([
              'git', '-C', str(root), 'ls-files', '--cached', '--others', '--exclude-standard', '-z'
          ])
          values = sorted({
              item.decode('utf-8', errors='surrogateescape').replace('\\', '/')
              for item in raw.split(b'\0') if item
          })
          paths = [
              relative for relative in values
              if relative != 'SOURCE_MANIFEST.sha256'
              and not policy.is_generated_path(relative)
              and (root / relative).is_file()
          ]

          def canonical(data: bytes) -> bytes:
              if b'\0' in data:
                  return data
              try:
                  data.decode('utf-8')
              except UnicodeDecodeError:
                  return data
              return data.replace(b'\r\n', b'\n')

          rows = []
          for relative in paths:
              digest = hashlib.sha256(canonical((root / relative).read_bytes())).hexdigest()
              rows.append(f'{digest}  {relative}')
          (root / 'SOURCE_MANIFEST.sha256').write_text(
              '\n'.join(rows) + '\n', encoding='utf-8', newline='\n'
          )
          PY
          git diff --check -- SOURCE_MANIFEST.sha256 .github/workflows/tmp-source-manifest-refresh.yml
          git diff -- SOURCE_MANIFEST.sha256 .github/workflows/tmp-source-manifest-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- SOURCE_MANIFEST.sha256 .github/workflows/tmp-source-manifest-refresh.yml
          if git diff --cached --quiet; then
            echo "Source manifest already current and helper absent."
            exit 0
          fi
          git commit -m "chore: finalize exact source manifest"
          git push origin HEAD:feat/one-kristin-convergence
