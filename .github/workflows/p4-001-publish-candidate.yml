name: P4-001 Canonical Test Center Materializer

on:
  pull_request:
    paths:
      - .github/workflows/p4-001-publish-candidate.yml
      - tool/p4_001_materialize_canonical.py
      - tool/p4_001_materialize_payload.part*
      - services/research_worker/src/search/**
      - services/research_worker/test/**
      - schemas/web_search_page.v1.json

permissions:
  contents: read

jobs:
  materialize:
    if: >-
      github.event.pull_request.user.login == 'alex00Pirotskyi' &&
      github.event.pull_request.head.ref == 'agent/p4-001-search-provider-foundation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Materialize canonical Worker C integration
        shell: bash
        run: |
          set -euo pipefail
          python tool/p4_001_materialize_canonical.py
      - name: Publish bounded non-workflow integration commit
        shell: bash
        run: |
          set -euo pipefail

          # The GITHUB_TOKEN has contents:write but cannot update workflow files.
          # Restore every workflow path to the exact checked-out owner commit and
          # publish only the already validated canonical non-workflow surfaces.
          git restore --source=HEAD --worktree -- \
            .github/workflows/p4-001-finalize-evidence.yml \
            .github/workflows/p4-001-pr-handoff.yml \
            .github/workflows/p4-001-publish-candidate.yml \
            .github/workflows/p4-001-search-provider.yml
          python tool/p1a_refresh_source_manifest.py .
          git diff --check

          mapfile -t paths < <(git status --porcelain=v1 -uall | sed -E 's/^...//' | LC_ALL=C sort)
          printf 'P4-001_MATERIALIZED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -gt 0
          for path in "${paths[@]}"; do
            case "$path" in
              SOURCE_MANIFEST.sha256|\
              config/test_center_registry.v1.json|\
              release/evidence/P4-001/history/test-center-handoff.provisional.0.1.1.json|\
              release/evidence/P4-001/test-center-handoff.json|\
              services/research_worker/test/test_normalized_result_adapter.py|\
              tool/p4_001_materialize_canonical.py|\
              tool/p4_001_materialize_payload.part*|\
              tool/p4_001_search_provider_test.py|\
              tool/p4_001_test_center_v1.py|\
              tool/p4_001_test_center_v1_test.py)
                ;;
              *)
                echo "Unexpected materialized path: $path" >&2
                exit 1
                ;;
            esac
          done

          base_sha="$(git rev-parse HEAD)"
          git add -A
          git diff --cached --check
          patch="$RUNNER_TEMP/p4-001-materialized.patch"
          git diff --cached --binary -- . ':(exclude)SOURCE_MANIFEST.sha256' > "$patch"
          test -s "$patch"

          git fetch origin \
            "refs/heads/${{ github.event.pull_request.head.ref }}:refs/remotes/origin/p4-001-publish-target"
          remote_sha="$(git rev-parse refs/remotes/origin/p4-001-publish-target)"
          echo "P4-001_BASE_SHA=$base_sha"
          echo "P4-001_REMOTE_SHA=$remote_sha"

          if [ "$remote_sha" != "$base_sha" ]; then
            git merge-base --is-ancestor "$base_sha" "$remote_sha"
            mapfile -t remote_paths < <(git diff --name-only "$base_sha" "$remote_sha" | LC_ALL=C sort)
            printf 'P4-001_CONCURRENT_PATH=%s\n' "${remote_paths[@]}"
            test "${#remote_paths[@]}" -eq 1
            test "${remote_paths[0]}" = 'SOURCE_MANIFEST.sha256'
            git reset --hard "$remote_sha"
            git clean -fd
            git apply --index --3way "$patch"
          fi

          python tool/p1a_refresh_source_manifest.py .
          first_manifest_sha="$(sha256sum SOURCE_MANIFEST.sha256 | awk '{print $1}')"
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.first" SOURCE_MANIFEST.sha256
          second_manifest_sha="$(sha256sum SOURCE_MANIFEST.sha256 | awk '{print $1}')"
          test "$first_manifest_sha" = "$second_manifest_sha"
          git add SOURCE_MANIFEST.sha256

          python tool/test_center_contracts.py check --project .
          python tool/p4_001_test_center_v1.py check --project .
          python tool/p4_001_search_provider_test.py --project .
          python tool/roadmap_control.py validate --project . --strict
          python tool/generated_state_guard.py audit --project . --strict
          git diff --cached --check

          git config user.name 'Kristin P4-001 Canonical Integrator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'P4-001: materialize canonical Test Center v1 integration'
          git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"
