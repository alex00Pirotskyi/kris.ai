name: P24-001 Manifest Transport

on:
  push:
    branches:
      - agent/anarchy-autonomous-worker-missions
    paths:
      - .github/workflows/p24-manifest-transport.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: p24-001-manifest-transport
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'MISSION-015: stage P24 manifest transport')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONTROL_BRANCH: agent/anarchy-autonomous-worker-missions
      WORKER_BRANCH: agent/j/P24-001-roadmap-as-data-adr
      EXPECTED_WORKER_HEAD: 1598e5f406f8ce74775730a94b36efb731b0192e
      EXPECTED_WORKER_TREE: 9497333f131ccddcb229aa5b179927aeac8dfd31
      EXPECTED_SOURCE_PARENT: d9863b69ff8507246cdf2c024599c29ed4210534
      ARTIFACT_ID: '8968427181'
      EXPECTED_SHA256: bd779a0852c174880cc30f4888eb6975b2ab330a9d00480672e7683a574cd2f8
      EXPECTED_BLOB: e94c5ab44ea19321bf4e6976c54ea30fc8b0b4b3
      TRANSPORT_PATH: .github/workflows/p24-manifest-transport.yml
    steps:
      - name: Check out exact mission-control staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/anarchy-autonomous-worker-missions
          fetch-depth: 0
          persist-credentials: true
          path: control

      - name: Check out exact Worker J branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/j/P24-001-roadmap-as-data-adr
          fetch-depth: 0
          persist-credentials: true
          path: workerj

      - name: Set up locked Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Verify exact branches and fetch canonical artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C workerj rev-parse HEAD)" = "$EXPECTED_WORKER_HEAD"
          test "$(git -C workerj rev-parse HEAD^{tree})" = "$EXPECTED_WORKER_TREE"
          test -f "control/$TRANSPORT_PATH"
          test -z "$(git -C control status --porcelain=v1)"
          test -z "$(git -C workerj status --porcelain=v1)"

          artifact_zip="$RUNNER_TEMP/p24-artifact.zip"
          artifact_dir="$RUNNER_TEMP/p24-artifact"
          mkdir -p "$artifact_dir"
          curl --fail --location --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$artifact_zip"
          unzip -q "$artifact_zip" -d "$artifact_dir"
          expected="$artifact_dir/expected-SOURCE_MANIFEST.sha256"
          test -f "$expected"

          python - "$expected" "$EXPECTED_SHA256" "$EXPECTED_BLOB" <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          path = Path(sys.argv[1])
          expected_sha256, expected_blob = sys.argv[2:]
          data = path.read_bytes()
          sha256 = hashlib.sha256(data).hexdigest()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          if sha256 != expected_sha256:
              raise SystemExit(f'SHA-256 mismatch: {sha256} != {expected_sha256}')
          if blob != expected_blob:
              raise SystemExit(f'Git blob mismatch: {blob} != {expected_blob}')
          if len(data) != 128802 or data.count(b'\n') != 1195:
              raise SystemExit(f'unexpected manifest shape: bytes={len(data)} lines={data.count(b"\n")}')
          print(f'canonical manifest verified sha256={sha256} blob={blob}')
          PY
          printf '%s\n' "$expected" > "$RUNNER_TEMP/expected-manifest-path"

      - name: Validate and commit manifest-only Worker J closure
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/expected-manifest-path")"
          cp "$expected" workerj/SOURCE_MANIFEST.sha256
          cd workerj

          python tool/p1a_refresh_source_manifest.py .
          cmp "$expected" SOURCE_MANIFEST.sha256
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.first" SOURCE_MANIFEST.sha256
          cmp "$expected" SOURCE_MANIFEST.sha256

          python -m py_compile \
            tool/anarchy_control_plane.py \
            tool/anarchy_control_plane_test.py \
            tool/p24_ci_driver.py
          python -m unittest -v tool/anarchy_control_plane_test.py
          python tool/anarchy_control_plane.py --check --project .
          python tool/anarchy_control_plane.py --resume-worker J --project .
          python tool/roadmap_control.py validate --project . --strict
          python tool/generated_state_guard.py audit --project . --strict
          python tool/validate_release.py --skip-tests
          git diff --check

          mapfile -t paths < <(git diff --name-only "$EXPECTED_SOURCE_PARENT" | LC_ALL=C sort)
          printf 'FINAL_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = 'SOURCE_MANIFEST.sha256'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256
          git diff --cached --check
          git commit -m 'P24-001: commit deterministic source manifest closure'
          final_commit="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_WORKER_HEAD"
          git push origin "HEAD:$WORKER_BRANCH"
          test "$(git ls-remote origin refs/heads/$WORKER_BRANCH | awk '{print $1}')" = "$final_commit"
          echo "P24_FINAL_COMMIT=$final_commit"
          echo "P24_FINAL_TREE=$final_tree"

      - name: Retire the one-shot transport from mission control
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd control
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -f "$TRANSPORT_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "$TRANSPORT_PATH"
          git diff --cached --check
          git commit -m 'MISSION-015: retire P24 manifest transport'
          git push origin "HEAD:$CONTROL_BRANCH"
