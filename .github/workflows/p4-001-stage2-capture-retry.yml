name: P4-001 Stage 2 Evidence Blob Capture Retry

on:
  pull_request:
    paths:
      - .github/workflows/p4-001-stage2-capture-retry.yml

permissions:
  contents: write

env:
  P4_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  P4_PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  capture:
    name: p4-001-stage2-blob-capture-retry
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.P4_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Execute corrected exact Stage 2 capture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${P4_CANDIDATE_SHA}"
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/p4-001-stage2-capture.yml').read_text(encoding='utf-8')
          anchor = '      - name: Materialize immutable Stage 1 artifacts and Stage 2 metadata\n'
          start = source.index(anchor) + len(anchor)
          run_anchor = '        run: |\n'
          start = source.index(run_anchor, start) + len(run_anchor)
          lines = source[start:].splitlines(keepends=True)
          block = []
          for line in lines:
              if line.startswith('          '):
                  block.append(line[10:])
              else:
                  break
          script = ''.join(block)
          replacements = {
              'sha256:b1ac02cd035a38ccfa78e52c50447cbf185fc68d12ab051253a06d87117e6f29': 'sha256:926951a0c3bb8f69b7daf90e35b9adf6d0ac3e510217295883ffb13d11b844d1',
              'sha256:676cce145cfec38be94652c87da43ed3393f2b5d56775610043de42af29b64dc': 'sha256:869f717a49f24f04b8b7591facaed7260c8deb490e4cd39e6be5fa6a0f5923e0',
              'sha256:061f5dcd56a69935383943a72d05f9621ac22c61ea4eef85ea13aeaf99c599f5': 'sha256:e8d4ba668fc79dbc02d2968ed05b63bc38b558718a0d54fb0fe49f8eabf68850',
              'sha256:e172131ef739acbc4d676ae27f041ef2e84a806659274f2c92f0635c901e5df5': 'sha256:a4bcb61da20f2746e1f339608af09cf3b8305ce49d83aa0a9859ac2eeb236509',
              'rm .github/workflows/p4-001-stage2-capture.yml\n': 'rm .github/workflows/p4-001-stage2-capture.yml\n          rm .github/workflows/p4-001-stage2-capture-retry.yml\n',
          }
          for old, new in replacements.items():
              if old not in script:
                  raise SystemExit(f'missing retry patch anchor: {old}')
              script = script.replace(old, new, 1)
          target = Path('/tmp/p4-stage2-corrected.sh')
          target.write_text(script, encoding='utf-8')
          print(f'corrected script bytes={target.stat().st_size}')
          PY
          bash /tmp/p4-stage2-corrected.sh
      - name: Upload exact Stage 2 blob map
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-001-stage2-blobs-${{ env.P4_CANDIDATE_SHA }}
          path: ${{ runner.temp }}/p4-001-stage2
          if-no-files-found: error
          retention-days: 7
