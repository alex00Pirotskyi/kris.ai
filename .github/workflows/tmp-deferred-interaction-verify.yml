name: Temporary Deferred Interaction Verify

on:
  push:
    branches:
      - feat/one-kristin-convergence

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/one-kristin-convergence
          fetch-depth: 1
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Register governed source and format branch delta
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/product/source_contract_test.dart')
          text = path.read_text()
          source = "        'lib/product/agent_deferred_interaction.dart',\n"
          if source not in text:
              marker = "        'lib/product/agent_protocol_v3.dart',\n"
              if text.count(marker) != 1:
                  raise SystemExit(f'expected one source marker, found {text.count(marker)}')
              text = text.replace(marker, marker + source, 1)
              path.write_text(text)
          PY
          python tool/dart_format_scope.py --write
          git diff --check
          git diff -- lib/product/agent_deferred_interaction.dart test/product/agent_deferred_interaction_test.dart test/product/source_contract_test.dart
      - name: Run deferred interaction contracts
        run: flutter test test/product/agent_deferred_interaction_test.dart test/product/kristin_conversation_session_test.dart
      - name: Commit canonical verifier output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/product/agent_deferred_interaction.dart test/product/agent_deferred_interaction_test.dart test/product/source_contract_test.dart lib/product/agent_protocol_v3.dart lib/product/kristin_conversation_session.dart test/product/agent_protocol_v3_execution_step_test.dart test/product/kristin_conversation_session_test.dart
          git commit -m "test(product): register deferred interaction seam"
          git push origin HEAD:feat/one-kristin-convergence
