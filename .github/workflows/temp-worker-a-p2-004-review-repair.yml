name: TEMP Worker A P2-004 Review Repair

on:
  push:
    branches:
      - agent/a/p2-004-measurement-contract-repair
    paths:
      - '.github/workflows/temp-worker-a-p2-004-review-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-worker-a-p2-004-review-repair
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: config/p2.python-version
          check-latest: false
      - name: Assert carrier identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Apply bounded review repair
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64
          import json
          import pathlib

          root = pathlib.Path('.').resolve()
          encoded = """eyJmaWxlcyI6eyJ0b29sL3AyX3RlY2hub2xvZ3lfc3Bpa2UucHkiOiIjIS91c3IvYmluL2VudiBweXRob24zXG5cIlwiXCJBZ2dyZWdhdGUgaW5kZXBlbmRl
