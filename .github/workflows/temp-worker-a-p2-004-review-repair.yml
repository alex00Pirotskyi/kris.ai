          RUNFSVBUXCIsXG4gICAgKSxcbiAgICBcImRhcnQtY29udHJvbC1wbGFuZS1uYXRpdmUtcHR5LWhlbHBlclwiOiAoXG4gICAgICAgIFwiZGFydC1pbmRlcGVuZGVu
          dC1jb250cm9sLXBsYW5lXCIsXG4gICAgICAgIFwiS1JJU1RJTl9QMl9URUNIX0RBUlRfUkVDRUlQVFwiLFxuICAgICksXG59XG5QTEFURk9STSA9IHtcbiAgICBc
          IldpbmRvd3NcIjogXCJ3aW5kb3dzXCIsXG4gICAgXCJEYXJ3aW5cIjogXCJtYWNvc1wiLFxuICAgIFwiTGludXhcIjogXCJsaW51eFwiLFxufS5nZXQocGxhdGZv
          cm0uc3lzdGVtKCksIHBsYXRmb3JtLnN5c3RlbSgpLmxvd2VyKCkpXG5IRVg0MCA9IHJlLmNvbXBpbGUoclwiXlswLTlhLWZdezQwffSUvIilcbkhFWDY0ID0gcmUu
          Y29tcGlsZShyXCJeWzAtOWEtZl17NjR9JFwiKVxuU0FGRV9JRCA9IHJlLmNvbXBpbGUoclwiXltBLVphLXowLTldW0EtWmEtejAtOS5fOi1dezAsMTI3fSRcIilcbk1B
          WF9UUlVTVF9MSUZFVElNRSA9IHRpbWVkZWx0YShob3Vycz02KVxuTUFYX0NMT0NLX1NLRVcgPSB0aW1lZGVsdGEobWludXRlcz01KVxuXG5cbmRlZiBzaGEocGF0
          aDogcGF0aGxpYi5QYXRoKSAtPiBzdHI6XG4gICAgZGlnZXN0ID0gaGFzaGxpYi5zaGEyNTYoKVxuICAgIHdpdGggcGF0aC5vcGVuKFwicmJcIikgYXMgc3RyZWFt
          OlxuICAgICAgICBmb3IgYmxvY2sgaW4gaXRlcihsYW1iZGE6IHN0cmVhbS5yZWFkKDEwMjQgKiAxMDI0KSwgYlwiXCIpOlxuICAgICAgICAgICAgZGlnZXN0LnVw
          ZGF0ZShibG9jaylcbiAgICByZXR1cm4gZGlnZXN0LmhleGRpZ2VzdCgpXG5cblxuZGVmIHNoYV90ZXh0KHZhbHVlOiBzdHIpIC0+IHN0cjpcbiAgICByZXR1cm4g
          aGFzaGxpYi5zaGEyNTYodmFsdWUuZW5jb2RlKFwidXRmLThcIikpLmhleGRpZ2VzdCgpXG5cblxuZGVmIGxvYWQocGF0aDogcGF0aGxpYi5QYXRoKSAtPiBkaWN0
