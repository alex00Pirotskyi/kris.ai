          IXJ9XCIpXG4gICAgcmV0dXJuIHBhdGhcb...TRUNCATED_FOR_BREVITY..."""
          payload = json.loads(base64.b64decode(''.join(encoded.split())).decode('utf-8'))
          for relative, content in payload['files'].items():
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')

          runner_path = root / 'tool/p2_task_platform_assertions.py'
          runner = runner_path.read_text(encoding='utf-8')
          marker = '        "KRISTIN_P2_TECH_DART_RECEIPT",\n'
          additions = (
              marker
              + '        "KRISTIN_P2_TECH_AUTHORIZED_ROOT",\n'
              + '        "KRISTIN_P2_TECH_TRUST_MANIFEST",\n'
              + '        "KRISTIN_P2_TECH_TRUST_MANIFEST_SHA256",\n'
              + '        "KRISTIN_P2_TECH_SESSION_ID",\n'
              + '        "KRISTIN_P2_TECH_NONCE",\n'
          )
          if runner.count(marker) != 1:
              raise SystemExit('unexpected P2 receipt allowlist marker count')
          if 'KRISTIN_P2_TECH_AUTHORIZED_ROOT' not in runner:
              runner = runner.replace(marker, additions, 1)
          start = runner.index('def validate_technology_spike(data: dict) -> dict:')
          end = runner.index('\n\ndef main() -> int:', start)
          runner = runner[:start] + payload['validateFunction'].rstrip() + runner[end:]
          runner_path.write_text(runner, encoding='utf-8')

          registry_path = root / 'config/test_center_registry.v1.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          mapping = next(
              (row for row in registry.get('affectedTestMappings', [])
               if isinstance(row, dict) and row.get('mappingId') == 'affected.p2.owner-mode-source'),
              None,
          )
          if not isinstance(mapping, dict):
              raise SystemExit('affected.p2.owner-mode-source mapping missing')
          mapping_paths = mapping.setdefault('pathPatterns', [])
          for relative in payload['boundPaths']:
              if relative not in mapping_paths:
                  mapping_paths.append(relative)
          profile = next(
              (row for row in registry.get('projectTestProfiles', [])
               if isinstance(row, dict) and row.get('stableCheckId') == 'tc.p2.acceptance-contract'),
              None,
          )
          if not isinstance(profile, dict):
              raise SystemExit('tc.p2.acceptance-contract profile missing')
          for field in ('affectedPaths', 'inputPaths'):
              values = profile.setdefault(field, [])
              for relative in payload['boundPaths']:
                  if relative not in values:
                      values.append(relative)
          registry_path.write_text(json.dumps(registry, indent=2) + '\n', encoding='utf-8')

          progress_path = root / 'docs/roadmap/progress/2026-08-06-worker-a-p2-004-measurement-contract-repair.md'
          progress = progress_path.read_text(encoding='utf-8')
          if '## Exact-review hardening' not in progress:
              progress += payload['progressAppendix']
          progress_path.write_text(progress, encoding='utf-8')
          PYCODE
          rm '.github/workflows/temp-worker-a-p2-004-review-repair.yml'
      - name: Validate hardened contract
        shell: bash
        run: |
          python -m py_compile \
            tool/p2_technology_spike.py \
            tool/p2_technology_spike_contract_test.py \
            tool/p2_task_platform_assertions.py
          python tool/p2_technology_spike_contract_test.py --project .
          python tool/p2_task_assertion_cli_test.py --project . --max-command-seconds 15
          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/worker_a_test_center_v1_test.py
      - name: Refresh canonical source manifest
        shell: bash
        run: |
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.after-first-refresh"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.after-first-refresh" SOURCE_MANIFEST.sha256
          git diff --check
      - name: Publish final review-repair commit
        shell: bash
        env:
          CARRIER_SHA: ${{ github.sha }}
          BRANCH: agent/a/p2-004-measurement-contract-repair
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$CARRIER_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain=v1)"
          git commit -m "fix(p2-004): harden trusted measurement receipts"
          git push origin "HEAD:$BRANCH"
