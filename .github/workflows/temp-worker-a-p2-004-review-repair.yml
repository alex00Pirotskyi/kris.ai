name: TEMP Worker A P2-004 Review Repair

on:
  push:
    branches:
      - agent/a/p2-004-measurement-contract-repair
    paths:
      - '.github/workflows/temp-worker-a-p2-004-review-repair.yml'
      - 'tool/.temp-worker-a-p2-004-review-payload/materialize.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-worker-a-p2-004-review-repair
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: config/p2.python-version
          check-latest: false
      - name: Assert carrier identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Materialize bounded exact-review repair
        shell: bash
        run: |
          python tool/.temp-worker-a-p2-004-review-payload/materialize.py \
            --project .
      - name: Validate hardened contract
        shell: bash
        run: |
          python -m py_compile \
            tool/p2_technology_spike.py \
            tool/p2_technology_spike_contract_test.py \
            tool/p2_task_platform_assertions.py
          python tool/p2_technology_spike_contract_test.py --project .
          python tool/p2_task_assertion_cli_test.py \
            --project . \
            --max-command-seconds 15
          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/worker_a_test_center_v1_test.py
      - name: Refresh canonical source manifest
        shell: bash
        run: |
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 \
            "$RUNNER_TEMP/SOURCE_MANIFEST.after-first-refresh"
          python tool/p1a_refresh_source_manifest.py .
          cmp \
            "$RUNNER_TEMP/SOURCE_MANIFEST.after-first-refresh" \
            SOURCE_MANIFEST.sha256
          git diff --check
      - name: Create exact materialized commit bundle
        shell: bash
        env:
          CARRIER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No materialized source changes are staged." >&2
            exit 1
          fi
          git commit -m \
            "fix(p2-004): harden trusted measurement receipts"
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          parent_sha="$(git rev-parse HEAD^)"
          test "$parent_sha" = "$CARRIER_SHA"
          export_dir="$RUNNER_TEMP/p2-004-materialized"
          mkdir -p "$export_dir"
          git bundle create \
            "$export_dir/final.bundle" \
            HEAD \
            ^"$CARRIER_SHA"
          git archive \
            --format=tar.gz \
            --output="$export_dir/final-tree.tar.gz" \
            HEAD
          git diff \
            --binary \
            --full-index \
            "$CARRIER_SHA..HEAD" \
            >"$export_dir/materialized.patch"
          git diff \
            --name-status \
            "$CARRIER_SHA..HEAD" \
            >"$export_dir/name-status.txt"
          git ls-tree \
            -r \
            --full-tree \
            HEAD \
            >"$export_dir/ls-tree.txt"
          python - \
            "$export_dir/metadata.json" \
            "$CARRIER_SHA" \
            "$final_sha" \
            "$final_tree" <<'PYCODE'
          import hashlib
          import json
          import pathlib
          import sys

          metadata_path = pathlib.Path(sys.argv[1])
          carrier_sha = sys.argv[2]
          final_sha = sys.argv[3]
          final_tree = sys.argv[4]
          export_dir = metadata_path.parent
          files = {}
          for path in sorted(export_dir.iterdir()):
              if path == metadata_path or not path.is_file():
                  continue
              files[path.name] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          metadata = {
              "carrierSha": carrier_sha,
              "finalSha": final_sha,
              "finalTree": final_tree,
              "files": files,
          }
          metadata_path.write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PYCODE
          git status --short
          test -z "$(git status --porcelain=v1)"
      - name: Upload exact materialized tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-a-p2-004-materialized-${{ github.sha }}
          path: ${{ runner.temp }}/p2-004-materialized
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: true
