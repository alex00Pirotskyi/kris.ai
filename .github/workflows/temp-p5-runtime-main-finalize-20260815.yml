name: Temporary P5 actual-main landing finalizer

on:
  push:
    branches:
      - agent/mission-runtime
    paths:
      - .github/workflows/temp-p5-runtime-main-finalize-20260815.yml
      - tool/temp_p5_runtime_main_finalize_20260815.py

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: temp-p5-runtime-main-finalize-20260815
  cancel-in-progress: false

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'arm exact P5 main finalizer')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out live runtime authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/mission-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: automation_host/package-lock.json

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Merge exact candidate, validate actual main, and close runtime lease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/temp_p5_runtime_main_finalize_20260815.py
