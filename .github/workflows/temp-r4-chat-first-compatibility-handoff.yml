name: Temporary PR159 exact R4 finalizer

on:
  push:
    branches: [agent/gpt-gold/gs-003c-p2-promotion-current-main]

permissions:
  contents: write

concurrency:
  group: temp-pr159-exact-r4-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: git switch --force-create agent/gpt-gold/gs-003c-p2-promotion-current-main "$GITHUB_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Build immutable exact candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, os, re, subprocess, sys, urllib.request
          from pathlib import Path

          root = Path.cwd()
          base = 'e4f66ce5a95870cad342bbf9aaf89f94dc768f58'
          clean = '6f3fcf7b0b786bc804d86ff3a07bda1f99301454'
          branch = 'agent/gpt-gold/gs-003c-p2-promotion-current-main'
          gate_path = root / 'tool/v71r12_exact_source_gate.py'
          test_path = root / 'tool/p2_promotion_state_test.py'
          temps = [
              root / '.github/workflows/temp-r4-chat-first-compatibility-handoff.yml',
              root / 'tool/temp_r4_chat_first_compatibility_handoff.py',
          ]
          final_paths = {
              '.github/workflows/p1-p2-owner-risk-promotion-v71r12.yml',
              'SOURCE_MANIFEST.sha256',
              'tool/p2_promotion_state_test.py',
              'tool/v71r12_exact_source_gate.py',
          }

          def run(*args, capture=False):
              p = subprocess.run(args, cwd=root, text=True,
                  stdout=subprocess.PIPE if capture else None,
                  stderr=subprocess.STDOUT if capture else None)
              if p.returncode:
                  raise SystemExit(f"failed ({p.returncode}): {' '.join(args)}\n{p.stdout or ''}")
              return (p.stdout or '').strip()

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')
              return text.replace(old, new, 1)

          helpers = r'''
          def _load_read_only_r4_auditor(project: Path) -> Any:
              path = project / "tool/v70r4_patch_p2_flutter_runtime_tests.py"
              spec = importlib.util.spec_from_file_location("v71r12_read_only_r4", path)
              if spec is None or spec.loader is None:
                  fail("cannot load historical R4 audit source")
              module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = module
              spec.loader.exec_module(module)
              required = ("_dart_tokens", "_test_authority_complete", "_workspace_banner_complete", "_workspace_onboarding_complete")
              if any(not callable(getattr(module, name, None)) for name in required):
                  fail("historical R4 source lacks read-only auditors")
              return module

          def _sequence_count(tokens: list[str], sequence: Sequence[str]) -> int:
              width = len(sequence)
              return sum(1 for i in range(len(tokens) - width + 1) if tokens[i:i + width] == list(sequence))

          def _page_order(tokens: list[str]) -> list[str]:
              prefix = ["final", "pages", "=", "<", "Widget", ">", "["]
              starts = [i for i in range(len(tokens) - len(prefix) + 1) if tokens[i:i + len(prefix)] == prefix]
              if len(starts) != 1:
                  fail(f"governed shell must contain one pages list; found {len(starts)}")
              start = starts[0] + len(prefix) - 1
              depth = 0
              end = -1
              for i in range(start, len(tokens)):
                  depth += tokens[i] == "["
                  depth -= tokens[i] == "]"
                  if depth == 0:
                      end = i
                      break
              if end < 0:
                  fail("governed shell pages list is unbalanced")
              items, item = [], []
              paren = brace = square = angle = 0
              for token in tokens[start + 1:end]:
                  if token == "(": paren += 1
                  elif token == ")": paren -= 1
                  elif token == "{": brace += 1
                  elif token == "}": brace -= 1
                  elif token == "[": square += 1
                  elif token == "]": square -= 1
                  elif token == "<": angle += 1
                  elif token == ">" and angle: angle -= 1
                  if token == "," and paren == brace == square == angle == 0:
                      if item: items.append(item); item = []
                  else: item.append(token)
              if item: items.append(item)
              def classify(value):
                  if value[:3] == ["widget", ".", "chat"]: return "chat"
                  if value[:2] == ["P5InformationArchitecturePrototype", "("]: return "experience"
                  if value[:6] == ["widget", ".", "ownerMode", ".", "buildWorkspace", "("]: return "owner_mode"
                  return "unknown:" + "".join(value[:10])
              return [classify(value) for value in items]

          def audit_governed_shell_sources(integrated_source: str, legacy_source: str, *, lexer: Any) -> dict[str, Any]:
              integrated = lexer(integrated_source)
              legacy = lexer(legacy_source)
              integrated_selected = _sequence_count(integrated, ("home", ":", "KristinMainShell", "(")) == 1
              legacy_selected = _sequence_count(integrated, ("home", ":", "P2KristinShell", "(")) == 1
              if integrated_selected == legacy_selected:
                  fail(f"exactly one governed shell must be selected: integrated={integrated_selected} legacy={legacy_selected}")
              order = _page_order(integrated if integrated_selected else legacy)
              expected = ["chat", "experience", "owner_mode"] if integrated_selected else ["chat", "owner_mode"]
              if order != expected:
                  fail(f"governed shell page order invalid: expected {expected}, got {order}")
              return {"selectedShell": "integrated-p5-successor" if integrated_selected else "legacy-p2-shell", "pageOrder": order, "exactlyOneShellSelected": True, "chatFirst": True}

          def audit_r4_compatibility(project: Path) -> dict[str, Any]:
              auditor = _load_read_only_r4_auditor(project)
              inventory = load_json(project / "config/p2_source_inventory.v1.json")
              tests = inventory.get("testDart")
              semantics = {
                  "testAuthority": auditor._test_authority_complete((project / "test/product/p2_test_support.dart").read_text(encoding="utf-8")),
                  "ownerWorkspaceBanner": auditor._workspace_banner_complete((project / "lib/product/p2_owner_workspace.dart").read_text(encoding="utf-8")),
                  "ownerWorkspaceOnboarding": auditor._workspace_onboarding_complete((project / "lib/product/p2_owner_workspace.dart").read_text(encoding="utf-8")),
                  "qaPreviewInventory": isinstance(tests, list) and "test/product/p2_qa_preview_gate_test.dart" in tests,
              }
              if not all(semantics.values()): fail(f"R4 non-shell invariants invalid: {semantics}")
              shell = audit_governed_shell_sources((project / "lib/product/ui.dart").read_text(encoding="utf-8"), (project / "lib/product/p2_app_shell.dart").read_text(encoding="utf-8"), lexer=auditor._dart_tokens)
              return {"status": "passed", "semanticStateRecognized": True, "historicalPatcherExecuted": False, "readOnlyAudit": True, "syntaxAwareLexerReused": True, "allNonShellR4Invariants": True, **shell}

          '''
          old_r4 = '''        r4_json = temp / "r4.json"
                  step("R4 semantic idempotence", (python, "tool/v70r4_patch_p2_flutter_runtime_tests.py", "--project", ".", "--json-output", str(r4_json)))
                  r4 = load_json(r4_json)
                  if not (
                      r4.get("status") == "passed"
                      and r4.get("changedFileCount") == 0
                      and r4.get("semanticStateRecognized") is True
                      and r4.get("allFourR4FilesCovered") is True
                      and r4.get("ownerWorkspaceOnboardingSyntaxAware") is True
                      and r4.get("ownerWorkspaceCompactExpandedRecognized") is True
                      and r4.get("ownerWorkspaceTrailingCommaIndependent") is True
                  ):
                      fail(f"R4 compatibility invalid: {r4}")
          '''
          new_r4 = '''        print("\\n=== R4 read-only compatibility audit ===")
                  r4 = audit_r4_compatibility(project)
                  if not (r4.get("status") == "passed" and r4.get("semanticStateRecognized") is True and r4.get("historicalPatcherExecuted") is False and r4.get("readOnlyAudit") is True and r4.get("syntaxAwareLexerReused") is True and r4.get("allNonShellR4Invariants") is True and r4.get("exactlyOneShellSelected") is True and r4.get("chatFirst") is True):
                      fail(f"R4 compatibility audit invalid: {r4}")
                  steps.append({"name": "R4 read-only compatibility audit", "command": ["internal", "audit_r4_compatibility"], "cwd": ".", "durationSeconds": 0.0, "passed": True})
          '''
          source = gate_path.read_text(encoding='utf-8')
          anchor = 'def fail(message: str) -> None:\n    raise GateError(message)\n\n\ndef utc_now() -> str:\n'
          source = replace_once(source, anchor, 'def fail(message: str) -> None:\n    raise GateError(message)\n\n\n' + helpers + 'def utc_now() -> str:\n', 'helper insertion')
          source = replace_once(source, old_r4, new_r4, 'R4 execution replacement')
          gate_path.write_text(source, encoding='utf-8', newline='\n')

          test = test_path.read_text(encoding='utf-8')
          test = replace_once(test, 'import json\nfrom pathlib import Path\nimport unittest\n', 'import importlib.util\nimport json\nfrom pathlib import Path\nimport sys\nimport unittest\n', 'test imports')
          test = replace_once(test, 'ROOT = Path(__file__).resolve().parents[1]\n', 'ROOT = Path(__file__).resolve().parents[1]\nGATE_PATH = ROOT / "tool/v71r12_exact_source_gate.py"\nSPEC = importlib.util.spec_from_file_location("p2_owner_risk_gate", GATE_PATH)\nif SPEC is None or SPEC.loader is None: raise RuntimeError("unable to load owner-risk gate")\nGATE = importlib.util.module_from_spec(SPEC)\nsys.modules[SPEC.name] = GATE\nSPEC.loader.exec_module(GATE)\n', 'gate import')
          extra = '''    def test_r4_read_only_shell_audit(self) -> None:
                  source = GATE_PATH.read_text(encoding="utf-8")
                  self.assertIn("audit_r4_compatibility(project)", source)
                  self.assertNotIn('step("R4 semantic idempotence"', source)
                  result = GATE.audit_r4_compatibility(ROOT)
                  self.assertEqual(result["selectedShell"], "integrated-p5-successor")
                  self.assertEqual(result["pageOrder"], ["chat", "experience", "owner_mode"])
                  self.assertFalse(result["historicalPatcherExecuted"])

              def test_reordered_shell_fails_closed_and_decoys_are_ignored(self) -> None:
                  auditor = GATE._load_read_only_r4_auditor(ROOT)
                  good = "// home: P2KristinShell(\\nconst x = 'home: P2KristinShell(';\\nWidget build(){return MaterialApp(home: KristinMainShell());}\\nclass S{Widget build(){final pages=<Widget>[widget.chat,P5InformationArchitecturePrototype(),widget.ownerMode.buildWorkspace(),];return IndexedStack(children:pages);}}"
                  result = GATE.audit_governed_shell_sources(good, "class L{Widget build(){final pages=<Widget>[widget.chat,widget.ownerMode.buildWorkspace(),];}}", lexer=auditor._dart_tokens)
                  self.assertTrue(result["chatFirst"])
                  bad = good.replace("widget.chat,P5InformationArchitecturePrototype()", "P5InformationArchitecturePrototype(),widget.chat")
                  with self.assertRaisesRegex(GATE.GateError, "page order invalid"):
                      GATE.audit_governed_shell_sources(bad, "class L{Widget build(){final pages=<Widget>[widget.chat,widget.ownerMode.buildWorkspace(),];}}", lexer=auditor._dart_tokens)

          '''
          test = replace_once(test, '    def test_unfinished_capabilities_remain_source_only(self) -> None:\n', extra + '    def test_unfinished_capabilities_remain_source_only(self) -> None:\n', 'R4 tests')
          test_path.write_text(test, encoding='utf-8', newline='\n')

          for path in temps: path.unlink()
          run('python3', '-m', 'py_compile', str(gate_path), str(test_path))
          run('python3', str(test_path))
          run('python3', 'tool/p2_evidence_state_test.py')
          run('python3', 'tool/p1a_refresh_source_manifest.py', '.')
          first = (root / 'SOURCE_MANIFEST.sha256').read_bytes()
          run('python3', 'tool/p1a_refresh_source_manifest.py', '.')
          if (root / 'SOURCE_MANIFEST.sha256').read_bytes() != first: raise SystemExit('manifest not byte-stable')
          run('python3', 'tool/p1a_text_eof_contract_test.py', '--project', '.')
          run('python3', str(test_path))
          run('ruby', 'tool/workflow_integrity_test.rb', '.')
          run('git', 'diff', '--check')
          run('git', 'add', '-A')
          paths = set(run('git', 'diff', '--cached', '--name-only', base, '--', capture=True).splitlines())
          if paths != final_paths: raise SystemExit(f'exact scope mismatch: {sorted(paths)}')

          token, repo = os.environ['GITHUB_TOKEN'], os.environ['GITHUB_REPOSITORY']
          def api(endpoint, payload):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}{endpoint}", data=json.dumps(payload).encode(), method='POST', headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response: return json.loads(response.read())
          entries = []
          for relative in ['SOURCE_MANIFEST.sha256', 'tool/p2_promotion_state_test.py', 'tool/v71r12_exact_source_gate.py']:
              data = (root / relative).read_bytes()
              blob = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              entries.append({'path': relative, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          for relative in ['.github/workflows/temp-r4-chat-first-compatibility-handoff.yml', 'tool/temp_r4_chat_first_compatibility_handoff.py']:
              entries.append({'path': relative, 'mode': '100644', 'type': 'blob', 'sha': None})
          trigger = os.environ['GITHUB_SHA']
          tree = api('/git/trees', {'base_tree': run('git', 'rev-parse', 'HEAD^{tree}', capture=True), 'tree': entries})
          commit = api('/git/commits', {'message': 'fix(p2): replace mutating R4 patch execution with read-only shell audit', 'tree': tree['sha'], 'parents': [trigger]})
          print(json.dumps({'candidateCommit': commit['sha'], 'candidateTree': tree['sha'], 'effectivePaths': sorted(paths), 'historicalPatcherExecuted': False, 'truthBoundary': {'P2-004': 'VERIFIED_SOURCE', 'P2-005': 'source_only', 'P2-006': 'source_only', 'platformQualified': False, 'releaseSupported': False, 'productionSupported': False, 'gaPromoted': False}}, indent=2))
          print('CANDIDATE_COMMIT=' + commit['sha'])
          print('CANDIDATE_TREE=' + tree['sha'])
          PY
