name: TEMP Worker B Exact Review Validation

on:
  pull_request:
    paths:
      - .github/workflows/temp-worker-b-exact-review-validation.yml

permissions:
  contents: read

jobs:
  exact-worker-b-review-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d3452aa224c3228a9a3e3155a896e828af8d9ded
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Validate exact Worker B review-artifact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd3452aa224c3228a9a3e3155a896e828af8d9ded'
          test "$(git rev-parse 'HEAD^{tree}')" = 'd6717a2954c15a76d4e71739fe448caac68a4333'
          sha256sum -c docs/roadmap/anarchy/reviews/WORKER_B_A_REVIEW_e0f416f.json.sha256
          python -m unittest -v tool/test_center_contracts_test.py
          python tool/test_center_contracts.py check --project .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.before"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.before" SOURCE_MANIFEST.sha256
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.before" SOURCE_MANIFEST.sha256
          python tool/source_tree_policy_test.py
          python tool/generated_state_guard_test.py
          python tool/p0_010_generated_state_test.py --project .
          python tool/generated_state_guard.py audit --project . --strict
          python tool/p1a_source_inventory_test.py --project .
          python tool/p2_source_inventory_test.py --project .
          git diff --check
          test -z "$(git status --short)"
          {
            echo 'commit=d3452aa224c3228a9a3e3155a896e828af8d9ded'
            echo 'tree=d6717a2954c15a76d4e71739fe448caac68a4333'
            echo 'reviewArtifactSha256=b5edc38fe69e718e30859334ac20ccdde7924aef13a90e403938037a0b3b2c8b'
            echo 'semanticTests=PASS'
            echo 'testCenterCheck=PASS_NON_MUTATING'
            echo 'manifestFirstWrite=BYTE_IDENTICAL'
            echo 'manifestSecondWrite=BYTE_IDENTICAL'
            echo 'generatedState=PASS'
            echo 'p1aSourceInventory=PASS'
            echo 'p2SourceInventory=PASS'
            echo 'gitDiffCheck=PASS'
            echo 'gitStatus=CLEAN'
          } > "$RUNNER_TEMP/worker-b-exact-review-validation.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-b-exact-review-validation-d3452aa
          path: ${{ runner.temp }}/worker-b-exact-review-validation.txt
          if-no-files-found: error
          retention-days: 90
