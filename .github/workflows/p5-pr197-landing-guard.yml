name: P5 PR197 Exact Landing Guard

on:
  push:
    branches:
      - 'agent/p5-pr197-landing-guard'
    paths:
      - '.github/workflows/p5-pr197-landing-guard.yml'

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: p5-pr197-exact-landing
  cancel-in-progress: false

env:
  TARGET_PR: '197'
  EXPECTED_MAIN: '26fd52f4bbb9906955d4b7d8c0e81e0fed6f180a'
  GH_TOKEN: ${{ github.token }}

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Wait for exact candidate review and CI, then merge safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          token = os.environ['GH_TOKEN']
          pr_number = int(os.environ['TARGET_PR'])
          expected_main = os.environ['EXPECTED_MAIN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          expected_files = {
              'SOURCE_MANIFEST.sha256',
              'automation_host/src/browser-runtime.mjs',
              'automation_host/src/browser-runtime.test.mjs',
              'lib/product/browser/browser_runtime.dart',
              'test/product/browser/browser_runtime_process_test.dart',
              'lib/product/ui.dart',
              'lib/product/p5_information_architecture/p5_models.dart',
              'lib/product/p5_information_architecture/p5_fixtures.dart',
              'lib/product/p5_information_architecture/p5_prototype.dart',
              'lib/product/p5_information_architecture/p5_support_workspaces.dart',
              'lib/product/p5_information_architecture/p5_verification_workspaces.dart',
              'test/product/p5_information_architecture/p5_source_boundary_test.dart',
              'test/product/p5_information_architecture/p5_navigation_test.dart',
              'test/product/p5_information_architecture/p5_state_controller_test.dart',
              'test/product/p5_information_architecture/p5_accessibility_test.dart',
          }

          def request(path, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  f'{api}/repos/{repo}{path}',
                  data=data,
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def pr_snapshot():
              pr = request(f'/pulls/{pr_number}')
              if pr['state'] != 'open' or pr['draft']:
                  raise SystemExit(
                      f'PR must be open and ready: state={pr["state"]} draft={pr["draft"]}'
                  )
              return pr

          pr = pr_snapshot()
          head = pr['head']['sha']
          base = pr['base']['sha']
          if base != expected_main:
              raise SystemExit(f'PR base moved before guard: {base} != {expected_main}')

          files = request(f'/pulls/{pr_number}/files?per_page=100')
          actual_files = {row['filename'] for row in files}
          if actual_files != expected_files:
              raise SystemExit(
                  f'PR file scope mismatch: actual={sorted(actual_files)} '
                  f'expected={sorted(expected_files)}'
              )
          print(f'Exact PR scope PASS head={head} files={len(actual_files)}')

          deadline = time.monotonic() + 31 * 60
          last_report = None
          while True:
              current_main = request('/branches/main')['commit']['sha']
              if current_main != expected_main:
                  raise SystemExit(
                      f'protected main moved: {current_main} != {expected_main}'
                  )
              current_pr = pr_snapshot()
              if current_pr['head']['sha'] != head:
                  raise SystemExit(
                      f'PR head moved during landing guard: '
                      f'{current_pr["head"]["sha"]} != {head}'
                  )

              reviews = request(f'/pulls/{pr_number}/reviews?per_page=100')
              exact_reviews = [
                  row for row in reviews
                  if row.get('commit_id') == head
                  and (row.get('user') or {}).get('login') == 'alex11Pirotskyi'
              ]
              exact_reviews.sort(key=lambda row: row.get('submitted_at') or '')
              review_state = exact_reviews[-1]['state'] if exact_reviews else 'PENDING'

              runs = request(f'/actions/runs?head_sha={head}&per_page=100')['workflow_runs']
              terminal = [row for row in runs if row['status'] == 'completed']
              pending = [row for row in runs if row['status'] != 'completed']
              bad = [row for row in terminal if row.get('conclusion') != 'success']
              names = {row['name'] for row in runs}
              product_gate = any('Product Gates' in name for name in names)
              p3_gate = any('P3' in name and 'Browser' in name for name in names)
              ci_ready = bool(runs) and not pending and not bad and product_gate and p3_gate
              review_ready = review_state == 'APPROVED'

              report = (
                  review_state,
                  len(runs),
                  tuple(sorted(row['name'] for row in pending)),
                  tuple(sorted((row['name'], row.get('conclusion')) for row in bad)),
                  product_gate,
                  p3_gate,
              )
              if report != last_report:
                  print(
                      'landing status: '
                      f'review={review_state} runs={len(runs)} '
                      f'pending={[row["name"] for row in pending]} '
                      f'bad={[(row["name"], row.get("conclusion")) for row in bad]} '
                      f'product_gate={product_gate} p3_gate={p3_gate}'
                  )
                  last_report = report

              if review_ready and ci_ready:
                  break
              if bad:
                  raise SystemExit(
                      'exact-head workflow failure: '
                      + ', '.join(
                          f'{row["name"]}={row.get("conclusion")}' for row in bad
                      )
                  )
              if time.monotonic() >= deadline:
                  raise SystemExit(
                      f'landing guard timeout: review={review_state} '
                      f'pending={[row["name"] for row in pending]} '
                      f'product_gate={product_gate} p3_gate={p3_gate}'
                  )
              time.sleep(20)

          # Re-read every mutable gate immediately before the one irreversible action.
          current_main = request('/branches/main')['commit']['sha']
          current_pr = pr_snapshot()
          if current_main != expected_main or current_pr['head']['sha'] != head:
              raise SystemExit('landing CAS changed immediately before merge')
          reviews = request(f'/pulls/{pr_number}/reviews?per_page=100')
          exact = [
              row for row in reviews
              if row.get('commit_id') == head
              and (row.get('user') or {}).get('login') == 'alex11Pirotskyi'
          ]
          exact.sort(key=lambda row: row.get('submitted_at') or '')
          if not exact or exact[-1]['state'] != 'APPROVED':
              raise SystemExit('independent exact-head approval missing at merge boundary')

          result = request(
              f'/pulls/{pr_number}/merge',
              method='PUT',
              body={
                  'sha': head,
                  'merge_method': 'squash',
                  'commit_title': 'feat(p5): connect Web Studio to landed P2/P3 runtime (#197)',
                  'commit_message': (
                      'Wire the Experience Web Studio to the landed P3 browser runtime, '
                      'reflect live P2 Owner Mode state without duplicating authority, '
                      'and retain independently-owned P3 editor/preview/inspector boundaries.'
                  ),
              },
          )
          if result.get('merged') is not True:
              raise SystemExit(f'merge rejected: {result}')
          merged_sha = result['sha']
          landed_main = request('/branches/main')['commit']['sha']
          if landed_main != merged_sha:
              raise SystemExit(
                  f'post-merge main mismatch: {landed_main} != {merged_sha}'
              )
          print(f'PR #{pr_number} LANDED main={merged_sha} source_head={head}')
          PY
