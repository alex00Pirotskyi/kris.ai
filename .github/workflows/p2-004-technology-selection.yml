name: P2-004 Technology Selection

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p2-004-technology-selection.yml'
      - 'tool/p2_004_technology_selection.py'
      - 'tool/p2_004_technology_selection_test.py'
      - 'docs/adr/ADR-0012-p2-automation-host.md'
      - 'release/evidence/P2-004/**'
      - 'automation_host/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-004-selection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  KRISTIN_P2_SELECTION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  measure:
    name: selection-${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ubuntu
            os: ubuntu-24.04
            platform: linux
          - lane: windows
            os: windows-2025
            platform: windows
          - lane: macos
            os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.KRISTIN_P2_SELECTION_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: config/p2.python-version
          check-latest: false
      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.toolchains.outputs.flutter }}
          channel: stable
          cache: true
      - name: Install exact Node/node-pty dependency closure
        shell: bash
        run: npm ci --prefix automation_host --ignore-scripts=false --no-audit --no-fund
      - name: Validate selection contract
        shell: bash
        run: python tool/p2_004_technology_selection_test.py -v
      - name: Measure P2-004 candidates
        shell: bash
        run: >-
          python tool/p2_004_technology_selection.py --project . measure
          --output "$RUNNER_TEMP/selection-${{ matrix.platform }}.json"
      - name: Print platform measurement
        shell: bash
        run: cat "$RUNNER_TEMP/selection-${{ matrix.platform }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p2-004-selection-${{ matrix.platform }}
          path: ${{ runner.temp }}/selection-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: selection-aggregate
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.KRISTIN_P2_SELECTION_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: config/p2.python-version
          check-latest: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: p2-004-selection-*
          path: ${{ runner.temp }}/p2-004-selection
          merge-multiple: true
      - name: Aggregate exact tri-platform selection
        shell: bash
        run: |
          python tool/p2_004_technology_selection.py --project . aggregate \
            --input "$RUNNER_TEMP/p2-004-selection/selection-linux.json" \
            --input "$RUNNER_TEMP/p2-004-selection/selection-windows.json" \
            --input "$RUNNER_TEMP/p2-004-selection/selection-macos.json" \
            --output "$RUNNER_TEMP/p2-004-selection/selection-aggregate.json"
          cat "$RUNNER_TEMP/p2-004-selection/selection-aggregate.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p2-004-selection-aggregate
          path: ${{ runner.temp }}/p2-004-selection/selection-aggregate.json
          if-no-files-found: error
          retention-days: 30
