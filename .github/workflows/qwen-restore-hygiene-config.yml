name: Qwen Exact Hygiene Config Restore

on:
  push:
    branches:
      - 'agent/qwen-phone-control'
    paths:
      - '.github/workflows/qwen-restore-hygiene-config.yml'

permissions:
  contents: write

concurrency:
  group: qwen-exact-hygiene-config-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Capture exact base
        shell: bash
        run: |
          set -euo pipefail
          echo "RESTORE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore exact known-good config blob
        shell: bash
        run: |
          set -euo pipefail
          expected='2e63b23ae846f5a0c1e59663e19c3972a9acfe1e'
          git cat-file blob "$expected" > config/branch_hygiene.json
          actual="$(git hash-object config/branch_hygiene.json)"
          [[ "$actual" == "$expected" ]]
          rm .github/workflows/qwen-restore-hygiene-config.yml
          git diff --check
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {'.github/workflows/qwen-restore-hygiene-config.yml','config/branch_hygiene.json'}
          if actual != expected:
              raise SystemExit(f'restore scope mismatch: {sorted(actual)}')
          PY

      - name: Publish only if feature head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --heads origin refs/heads/agent/qwen-phone-control | awk '{print $1}')"
          [[ "$remote" == "$RESTORE_BASE" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .github/workflows/qwen-restore-hygiene-config.yml config/branch_hygiene.json
          git diff --cached --check
          git commit -m 'chore(qwen): restore branch-hygiene config after connector error'
          candidate="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/agent/qwen-phone-control
          git fetch origin '+refs/heads/agent/qwen-phone-control:refs/remotes/origin/agent/qwen-phone-control'
          [[ "$(git rev-parse origin/agent/qwen-phone-control)" == "$candidate" ]]
          echo "QWEN_CONFIG_RESTORE_PASS candidate=$candidate"
