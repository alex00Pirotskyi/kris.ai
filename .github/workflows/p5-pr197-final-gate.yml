name: P5 PR197 Final Landing Gate

on:
  push:
    branches:
      - 'agent/p5-pr197-landing-guard'
    paths:
      - '.github/workflows/p5-pr197-final-gate.yml'

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: p5-pr197-exact-landing
  cancel-in-progress: true

env:
  TARGET_PR: '197'
  EXPECTED_MAIN: '26fd52f4bbb9906955d4b7d8c0e81e0fed6f180a'
  GH_TOKEN: ${{ github.token }}

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Evaluate exact gate and merge only if ready now
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; api=os.environ['GITHUB_API_URL']
          token=os.environ['GH_TOKEN']; prn=int(os.environ['TARGET_PR']); expected_main=os.environ['EXPECTED_MAIN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          expected={
            'SOURCE_MANIFEST.sha256','automation_host/src/browser-runtime.mjs','automation_host/src/browser-runtime.test.mjs',
            'lib/product/browser/browser_runtime.dart','test/product/browser/browser_runtime_process_test.dart','lib/product/ui.dart',
            'lib/product/p5_information_architecture/p5_models.dart','lib/product/p5_information_architecture/p5_fixtures.dart',
            'lib/product/p5_information_architecture/p5_prototype.dart','lib/product/p5_information_architecture/p5_support_workspaces.dart',
            'lib/product/p5_information_architecture/p5_verification_workspaces.dart',
            'test/product/p5_information_architecture/p5_source_boundary_test.dart',
            'test/product/p5_information_architecture/p5_navigation_test.dart',
            'test/product/p5_information_architecture/p5_state_controller_test.dart',
            'test/product/p5_information_architecture/p5_accessibility_test.dart'}
          def req(path, method='GET', body=None):
            r=urllib.request.Request(f'{api}/repos/{repo}{path}', data=None if body is None else json.dumps(body).encode(), method=method, headers=headers)
            with urllib.request.urlopen(r, timeout=30) as x: return json.load(x)
          pr=req(f'/pulls/{prn}'); head=pr['head']['sha']; main=req('/branches/main')['commit']['sha']
          if pr['state']!='open' or pr['draft']: raise SystemExit(f'BLOCKED: PR state={pr["state"]} draft={pr["draft"]}')
          if main!=expected_main or pr['base']['sha']!=expected_main: raise SystemExit(f'BLOCKED: main/base moved main={main} base={pr["base"]["sha"]}')
          files={x['filename'] for x in req(f'/pulls/{prn}/files?per_page=100')}
          if files!=expected: raise SystemExit(f'BLOCKED: exact file scope mismatch actual={sorted(files)}')
          reviews=[x for x in req(f'/pulls/{prn}/reviews?per_page=100') if x.get('commit_id')==head and (x.get('user') or {}).get('login')=='alex11Pirotskyi']
          reviews.sort(key=lambda x:x.get('submitted_at') or '')
          review=reviews[-1]['state'] if reviews else 'PENDING'
          if review!='APPROVED': raise SystemExit(f'BLOCKED: independent exact-head review={review} head={head}')
          runs=req(f'/actions/runs?head_sha={head}&per_page=100')['workflow_runs']
          pending=[x for x in runs if x['status']!='completed']; bad=[x for x in runs if x['status']=='completed' and x.get('conclusion')!='success']
          names={x['name'] for x in runs}; product=any('Product Gates' in n for n in names); p3=any('P3' in n and 'Browser' in n for n in names)
          if not runs or pending or bad or not product or not p3:
            raise SystemExit('BLOCKED: exact-head CI '+json.dumps({'runs':len(runs),'pending':[x['name'] for x in pending],'bad':[(x['name'],x.get('conclusion')) for x in bad],'product_gate':product,'p3_gate':p3},sort_keys=True))
          # CAS immediately before merge.
          pr2=req(f'/pulls/{prn}'); main2=req('/branches/main')['commit']['sha']
          if pr2['head']['sha']!=head or main2!=expected_main: raise SystemExit('BLOCKED: CAS moved before merge')
          result=req(f'/pulls/{prn}/merge','PUT',{'sha':head,'merge_method':'squash','commit_title':'feat(p5): connect Web Studio to landed P2/P3 runtime (#197)','commit_message':'P5 integration slice: live P3 browser workspace and live P2 Owner Mode status, preserving independently-owned P3 editor/preview/inspector authority.'})
          if result.get('merged') is not True: raise SystemExit(f'BLOCKED: merge rejected {result}')
          landed=req('/branches/main')['commit']['sha']
          if landed!=result['sha']: raise SystemExit(f'BLOCKED: post-merge main mismatch {landed} != {result["sha"]}')
          print(f'LANDED PR #{prn} source={head} main={landed}')
          PY
