name: PR14 Current Main Reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/pr14-current-main-reconciliation.yml
      - config/pr14_main_reconciliation.json
      - tool/pr14_current_main_reconciliation.py
      - docs/progress/2026-08-05-pr14-current-main-reconciliation-controller.md
      - docs/progress/2026-08-05-pr14-reconciliation-ancestry-fix.md
      - SOURCE_MANIFEST.sha256
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/pr14-current-main-reconciliation.yml
      - config/pr14_main_reconciliation.json
      - tool/pr14_current_main_reconciliation.py
      - docs/progress/2026-08-05-pr14-current-main-reconciliation-controller.md
      - docs/progress/2026-08-05-pr14-reconciliation-ancestry-fix.md
      - SOURCE_MANIFEST.sha256

permissions:
  contents: read

concurrency:
  group: pr14-current-main-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: pr14-current-main-reconciliation-validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Compile and self-test reconciliation controller
        run: |
          python -m py_compile tool/pr14_current_main_reconciliation.py
          python tool/pr14_current_main_reconciliation.py --self-test
      - name: Validate reconciliation policy and product-gate control
        run: >-
          python tool/pr14_current_main_reconciliation.py
          --validate-control
          --config config/pr14_main_reconciliation.json
          --ci .github/workflows/ci.yml

  discover:
    name: pr14-current-main-reconciliation-discover
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact reconciliation controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: control
      - name: Check out exact governed P1/P2 target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: false
          path: target
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Discover exact conflict set without mutation
        run: >-
          python control/tool/pr14_current_main_reconciliation.py
          --discover
          --config control/config/pr14_main_reconciliation.json
          --target target
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --receipt "$RUNNER_TEMP/pr14-main-reconciliation-discovery.json"
      - name: Upload exact conflict discovery receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr14-main-reconciliation-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr14-main-reconciliation-discovery.json
          if-no-files-found: error
          retention-days: 30

  refresh-source-manifest:
    name: pr14-current-main-source-manifest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/pr14-reconciliation-ancestry-fix-20260805' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Validate controller and regenerate governed inventory
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tool/pr14_current_main_reconciliation.py
          python tool/pr14_current_main_reconciliation.py --self-test
          python tool/pr14_current_main_reconciliation.py \
            --validate-control \
            --config config/pr14_main_reconciliation.json \
            --ci .github/workflows/ci.yml
          python tool/p1a_refresh_source_manifest.py .
          git diff --check
          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          if [ "${#paths[@]}" -eq 0 ]; then
            echo 'SOURCE_MANIFEST_CURRENT=true'
            exit 0
          fi
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = 'SOURCE_MANIFEST.sha256'
      - name: Publish exact source manifest to reconciliation branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- SOURCE_MANIFEST.sha256; then
            echo 'SOURCE_MANIFEST_PUSH_REQUIRED=false'
            exit 0
          fi
          git config user.name 'Kristin PR14 Reconciler'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256
          git diff --cached --check
          git commit -m 'ci: refresh source manifest for PR14 reconciliation ancestry fix'
          git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"

  execute:
    name: pr14-current-main-reconciliation-execute
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: read
    env:
      CONTROL_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact protected-main reconciliation controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - name: Check out exact governed P1/P2 target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: true
          path: target
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Construct exact two-parent reconciliation candidate
        id: reconcile
        shell: bash
        run: |
          set +e
          python control/tool/pr14_current_main_reconciliation.py \
            --execute \
            --config control/config/pr14_main_reconciliation.json \
            --control control \
            --target target \
            --receipt "$RUNNER_TEMP/pr14-main-reconciliation-receipt.json"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact reconciliation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr14-main-reconciliation-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr14-main-reconciliation-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce successful reconciliation candidate
        if: always()
        run: test "${{ steps.reconcile.outputs.rc }}" -eq 0
