name: GS002 P2 Evidence State Finalizer

on:
  push:
    branches:
      - agent/gpt-gold/gs-002-p2-evidence-state
    paths:
      - .github/workflows/gs002-p2-evidence-finalizer.yml

permissions:
  contents: write

concurrency:
  group: gs002-p2-evidence-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: gs002-p2-evidence-finalizer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gpt-gold/gs-002-p2-evidence-state
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Annotate legacy evidence and finalize canonical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'agent/gpt-gold/gs-002-p2-evidence-state'

          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          annotations = {
              'release/evidence/P2/manifest.json': {
                  'recordType': 'P2LegacyPhaseManifest',
                  'recordRole': 'historical',
                  'stateAuthority': False,
                  'supersededBy': 'release/evidence/P2/state.json',
              },
              'release/evidence/P2-004/manifest.json': {
                  'recordType': 'P2TaskAcceptanceEvidence',
                  'recordRole': 'historical',
                  'stateAuthority': False,
                  'supersededBy': 'release/evidence/P2-004/state.json',
                  'claimLevel': 'VERIFIED_SOURCE',
                  'productBehaviorObserved': False,
                  'platformQualified': False,
                  'releaseSupported': False,
                  'productionSupported': False,
                  'gaPromoted': False,
              },
              'release/evidence/P2-004/technology-spike.json': {
                  'recordType': 'P2TechnologySpike',
                  'recordRole': 'historical',
                  'stateAuthority': False,
                  'supersededBy': 'release/evidence/P2-004/state.json',
                  'claimLevel': 'IMPLEMENTED_SOURCE',
              },
              'release/evidence/P2-004/test-results.json': {
                  'recordType': 'P2TaskDiagnostic',
                  'recordRole': 'diagnostic',
                  'stateAuthority': False,
                  'activeState': 'release/evidence/P2-004/state.json',
                  'claimLevel': 'IMPLEMENTED_SOURCE',
              },
          }

          for relative, fields in annotations.items():
              path = Path(relative)
              value = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise SystemExit(f'{relative}: JSON object required')
              for key, expected in fields.items():
                  current = value.get(key, expected)
                  if current != expected:
                      raise SystemExit(
                          f'{relative}: conflicting existing {key}: {current!r}'
                      )
                  value[key] = expected
              path.write_text(
                  json.dumps(value, indent=2) + '\n',
                  encoding='utf-8',
                  newline='\n',
              )
          PY

          python -m py_compile tool/p2_evidence_state.py tool/p2_evidence_state_test.py
          python tool/p2_evidence_state.py --project .
          python tool/p2_evidence_state_test.py
          python -m json.tool schemas/p2_evidence_state.v1.schema.json >/dev/null

          python tool/p1a_refresh_source_manifest.py .
          rm .github/workflows/gs002-p2-evidence-finalizer.yml
          python tool/p1a_refresh_source_manifest.py .

          python tool/p2_evidence_state.py --project .
          python tool/p2_evidence_state_test.py
          ruby tool/workflow_integrity_test.rb .
          git diff --check

          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 6
          test "${paths[0]}" = '.github/workflows/gs002-p2-evidence-finalizer.yml'
          test "${paths[1]}" = 'SOURCE_MANIFEST.sha256'
          test "${paths[2]}" = 'release/evidence/P2-004/manifest.json'
          test "${paths[3]}" = 'release/evidence/P2-004/technology-spike.json'
          test "${paths[4]}" = 'release/evidence/P2-004/test-results.json'
          test "${paths[5]}" = 'release/evidence/P2/manifest.json'

          git config user.name 'KRIS.AI Gold Standard Finalizer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(p2): finalize canonical evidence-state migration'
          git push origin HEAD:refs/heads/agent/gpt-gold/gs-002-p2-evidence-state
