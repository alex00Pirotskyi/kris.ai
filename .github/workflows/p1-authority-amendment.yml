name: P1 Authority Service Amendment

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main P1A source-landing commit
        required: true
        type: string
      package_sha256:
        description: Exact KRISTIN_P1_AUTHORITY_SERVICE_AMENDMENT_V63R13.zip SHA-256
        required: true
        type: string
  push:
    branches:
      - main
      - "integration/p1-authority-service-v63r13"
      - "integration/p1-authority-service-v63r13-evidence"
      - "preflight/p1a-v66-*"
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read

concurrency:
  group: p1a-v63-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  P1A_PYTHON_VERSION: "3.13.5"

jobs:
  p1a-source-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
          check-latest: false
      - id: toolchains
        shell: bash
        run: python tool/p1a_toolchains.py --project . --source-only --github-output "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.toolchains.outputs.flutter }}
          channel: stable
          cache: true
      - name: P1A source, security, inventory and Flutter contracts
        shell: bash
        run: |
          python tool/p1a_source_inventory_test.py --project .
          python tool/p1a_authority_contract_test.py --project .
          python tool/p1a_installer_secret_contract_test.py --project .
          python tool/p1a_build_authority_snapshot_test.py --project .
          python tool/p1a_toolchain_extension_test.py --project .
          python tool/p1a_patch_product_runtime_test.py --project .
          python tool/p1a_evidence_forgery_test.py --project .
          python tool/p1a_finalizer_contract_test.py --project .
          python tool/p1a_exit_gate_test.py --project . --source-only
          flutter pub get
          dart format --output=none --set-exit-if-changed lib/product/p1_authority_service_*.dart test/product/p1_authority_service_*.dart
          flutter analyze
          flutter test test/product/p1_authority_service_contract_v1_test.dart test/product/p1_authority_service_product_runtime_v1_test.dart
          git diff --exit-code

  p1a-native-build-linux:
    runs-on: ubuntu-24.04
    needs: p1a-source-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.13.5", check-latest: false}
      - name: Install exact hash-locked hosted CMake 3.31.6
        shell: bash
        run: python tool/p1a_bootstrap_hosted_cmake.py --project .
      - name: Verify exact linux native toolchain
        shell: bash
        run: python tool/p1a_toolchains.py --project . --verify-native-host --hosted-source-build --skip-node --platform linux
      - name: Strict Linux service, connector and worker builds
        shell: bash
        run: |
          cmake -S authority_service/native/linux -B .p1a-build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-linux --config Release --parallel 2 --verbose
          cmake -S authority_service/connector/linux -B .p1a-connector-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-linux --config Release --parallel 2 --verbose
          cmake -S authority_service/worker_launcher/linux -B .p1a-worker-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-linux --config Release --parallel 2 --verbose
          .p1a-build-linux/kristin_p1_authority_service --source-self-test
          .p1a-connector-linux/kristin_p1a_connector_cli --source-self-test
          .p1a-worker-linux/kristin_p2_worker_launcher --source-self-test

  p1a-native-build-windows:
    runs-on: windows-2025
    needs: p1a-source-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.13.5", check-latest: false}
      - name: Install exact hash-locked hosted CMake 3.31.6
        shell: bash
        run: python tool/p1a_bootstrap_hosted_cmake.py --project .
      - name: Verify exact Windows hosted toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $installation = [string](& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -Last 1)
          $installation = $installation.Trim()
          if ([string]::IsNullOrWhiteSpace($installation)) { throw 'Visual Studio C++ workload not found' }
          $devShell = Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1'
          if (-not (Test-Path -LiteralPath $devShell)) { throw "Visual Studio developer shell not found: $devShell" }
          . $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-Command cl.exe, cmake.exe, ninja.exe | Format-List Name, Source, Version
          python tool/p1a_toolchains.py --project . --verify-native-host --hosted-source-build --skip-node --platform windows
      - name: Build Windows authority service with Ninja/MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = ([string](& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -Last 1)).Trim()
          . (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake -G Ninja -S authority_service/native/windows -B .p1a-build-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-windows --parallel 2 --verbose
      - name: Build Windows connector with Ninja/MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = ([string](& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -Last 1)).Trim()
          . (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake -G Ninja -S authority_service/connector/windows -B .p1a-connector-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-windows --parallel 2 --verbose
      - name: Build Windows restricted worker launcher with Ninja/MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = ([string](& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -Last 1)).Trim()
          . (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake -G Ninja -S authority_service/worker_launcher/windows -B .p1a-worker-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-windows --parallel 2 --verbose
      - name: Run Windows hosted source self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          .\.p1a-build-windows\kristin_p1_authority_service_windows.exe --source-self-test
          .\.p1a-connector-windows\kristin_p1a_connector_cli.exe --source-self-test
          .\.p1a-worker-windows\kristin_p2_worker_launcher.exe --source-self-test

  p1a-native-build-macos:
    runs-on: macos-15
    needs: p1a-source-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.13.5", check-latest: false}
      - name: Install exact hash-locked hosted CMake 3.31.6
        shell: bash
        run: python tool/p1a_bootstrap_hosted_cmake.py --project .
      - name: Verify exact macOS hosted toolchain
        shell: bash
        run: python tool/p1a_toolchains.py --project . --verify-native-host --hosted-source-build --skip-node --platform macos
      - name: Build strict macOS authority service
        shell: bash
        run: |
          set -euo pipefail
          cmake -S authority_service/native/macos -B .p1a-build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-macos --config Release --parallel 2 --verbose
      - name: Build strict macOS connector
        shell: bash
        run: |
          set -euo pipefail
          cmake -S authority_service/connector/macos -B .p1a-connector-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-macos --config Release --parallel 2 --verbose
      - name: Build strict macOS restricted worker launcher
        shell: bash
        run: |
          set -euo pipefail
          cmake -S authority_service/worker_launcher/macos -B .p1a-worker-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-macos --config Release --parallel 2 --verbose
      - name: Build strict macOS SMAppService manager
        shell: bash
        run: |
          set -euo pipefail
          cmake -S authority_service/install/macos -B .p1a-manager-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-manager-macos --config Release --parallel 2 --verbose
      - name: Run macOS hosted source self-tests
        shell: bash
        run: |
          set -euo pipefail
          .p1a-build-macos/kristin_p1_authority_service_macos --source-self-test
          .p1a-connector-macos/kristin_p1a_connector_cli --source-self-test
          .p1a-worker-macos/kristin_p2_worker_launcher --source-self-test
          .p1a-manager-macos/kristin_p1a_smappservice_manager --source-self-test

  p1a-behavioral-linux:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.source_sha == github.sha && inputs.package_sha256 == vars.KRISTIN_P1A_V66_PACKAGE_SHA256 && github.actor == vars.KRISTIN_P1A_AUTHORIZED_ACTOR }}
    environment: p1a-controlled
    needs: [p1a-native-build-linux, p1a-native-build-windows, p1a-native-build-macos]
    runs-on: [self-hosted, kristin-p1a, linux, authority-isolated, interactive-desktop, ubuntu-24.04]
    timeout-minutes: 180
    env:
      KRISTIN_P1A_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      KRISTIN_P1A_RUNNER_ATTESTATION_PROVIDER: ${{ vars.KRISTIN_P1A_RUNNER_ATTESTATION_PROVIDER_LINUX }}
      KRISTIN_P1A_EVIDENCE_TRUST: ${{ vars.KRISTIN_P1A_EVIDENCE_TRUST_LINUX }}
      KRISTIN_P1A_EVIDENCE_TRUST_SHA256: ${{ vars.KRISTIN_P1A_V66_EVIDENCE_TRUST_SHA256 }}
      KRISTIN_P1A_EVIDENCE_SIGNER: ${{ vars.KRISTIN_P1A_EVIDENCE_SIGNER_LINUX }}
      KRISTIN_P1A_LINUX_PERMIT_KEY_URI: ${{ vars.KRISTIN_P1A_LINUX_PERMIT_KEY_URI }}
      KRISTIN_P1A_LINUX_OPENSSL_CONFIG: ${{ vars.KRISTIN_P1A_LINUX_OPENSSL_CONFIG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.13.5", check-latest: false}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: "24.18.0", check-latest: false}
      - name: Verify exact controlled linux toolchain
        shell: bash
        run: python tool/p1a_toolchains.py --project . --verify-native-host --platform linux
      - name: Build exact native binaries on controlled runner
        shell: bash
        run: |
          cmake -S authority_service/native/linux -B .p1a-build-linux -DCMAKE_BUILD_TYPE=Release && cmake --build .p1a-build-linux --parallel 2
          cmake -S authority_service/connector/linux -B .p1a-connector-linux -DCMAKE_BUILD_TYPE=Release && cmake --build .p1a-connector-linux --parallel 2
          cmake -S authority_service/worker_launcher/linux -B .p1a-worker-linux -DCMAKE_BUILD_TYPE=Release && cmake --build .p1a-worker-linux --parallel 2
          echo "KRISTIN_P1A_SOURCE_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "KRISTIN_P1A_SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "KRISTIN_P1A_RUNNER_EPHEMERAL_SESSION_ID=$(python -c 'import uuid;print(uuid.uuid4().hex)')" >> "$GITHUB_ENV"
      - name: Resolve exact controlled Linux job and runner identity
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        shell: bash
        run: python tool/p1a_github_job_identity.py --output .p1a-job-linux.json --github-env "$GITHUB_ENV" --platform linux --job-name "$GITHUB_JOB" --commit-sha "$GITHUB_SHA"
      - name: Install, authorize, deny production worker, restart/replay, uninstall and sign exact evidence
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        shell: bash
        run: bash authority_service/tests/run_linux_behavioral.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: p1a-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/evidence/P1A/platforms/
          if-no-files-found: error
          retention-days: 30

  p1a-behavioral-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.source_sha == github.sha && inputs.package_sha256 == vars.KRISTIN_P1A_V66_PACKAGE_SHA256 && github.actor == vars.KRISTIN_P1A_AUTHORIZED_ACTOR }}
    environment: p1a-controlled
    needs: [p1a-native-build-linux, p1a-native-build-windows, p1a-native-build-macos]
    runs-on: [self-hosted, kristin-p1a, windows, authority-isolated, interactive-desktop, windows-2025]
    timeout-minutes: 180
    env:
      KRISTIN_P1A_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      KRISTIN_P1A_RUNNER_ATTESTATION_PROVIDER: ${{ vars.KRISTIN_P1A_RUNNER_ATTESTATION_PROVIDER_WINDOWS }}
      KRISTIN_P1A_EVIDENCE_TRUST: ${{ vars.KRISTIN_P1A_EVIDENCE_TRUST_WINDOWS }}
      KRISTIN_P1A_EVIDENCE_TRUST_SHA256: ${{ vars.KRISTIN_P1A_V66_EVIDENCE_TRUST_SHA256 }}
      KRISTIN_P1A_EVIDENCE_SIGNER: ${{ vars.KRISTIN_P1A_EVIDENCE_SIGNER_WINDOWS }}
      KRISTIN_P1A_WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.KRISTIN_P1A_WINDOWS_SIGNING_CERT_THUMBPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.13.5", check-latest: false}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: "24.18.0", check-latest: false}
      - name: Verify exact controlled windows toolchain
        shell: pwsh
        run: python tool/p1a_toolchains.py --project . --verify-native-host --platform windows
      - name: Build exact native binaries on controlled runner
        shell: pwsh
        run: |
          cmake -S authority_service/native/windows -B .p1a-build-windows -A x64; cmake --build .p1a-build-windows --config Release --parallel 2
          cmake -S authority_service/connector/windows -B .p1a-connector-windows -A x64; cmake --build .p1a-connector-windows --config Release --parallel 2
          cmake -S authority_service/worker_launcher/windows -B .p1a-worker-windows -A x64; cmake --build .p1a-worker-windows --config Release --parallel 2
          "KRISTIN_P1A_SOURCE_COMMIT=$env:GITHUB_SHA" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "KRISTIN_P1A_SOURCE_TREE=$(git rev-parse HEAD^{tree})" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "KRISTIN_P1A_RUNNER_EPHEMERAL_SESSION_ID=$([guid]::NewGuid().ToString('N'))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Resolve exact controlled Windows job and runner identity
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        shell: pwsh
        run: python tool/p1a_github_job_identity.py --output .p1a-job-windows.json --github-env $env:GITHUB_ENV --platform windows --job-name $env:GITHUB_JOB --commit-sha $env:GITHUB_SHA
      - name: Install, authorize, deny AppContainer worker, restart/replay, uninstall and sign exact evidence
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        shell: pwsh
        run: ./authority_service/tests/run_windows_behavioral.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: p1a-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/evidence/P1A/platforms/
          if-no-files-found: error
          retention-days: 30

  p1a-behavioral-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.source_sha == github.sha && inputs.package_sha256 == vars.KRISTIN_P1A_V66_PACKAGE_SHA256 && github.actor == vars.KRISTIN_P1A_AUTHORIZED_ACTOR }}
    environment: p1a-controlled
    needs: [p1a-native-build-linux, p1a-native-build-windows, p1a-native-build-macos]
    runs-on: [self-hosted, kristin-p1a, macos, authority-isolated, interactive-desktop, macos-15]
    timeout-minutes: 180
    env:
      KRISTIN_P1A_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      KRISTIN_P1A_RUNNER_ATTESTATION_PROVIDER: ${{ vars.KRISTIN_P1A_RUNNER_ATTESTATION_PROVIDER_MACOS }}
      KRISTIN_P1A_EVIDENCE_TRUST: ${{ vars.KRISTIN_P1A_EVIDENCE_TRUST_MACOS }}
      KRISTIN_P1A_EVIDENCE_TRUST_SHA256: ${{ vars.KRISTIN_P1A_V66_EVIDENCE_TRUST_SHA256 }}
      KRISTIN_P1A_EVIDENCE_SIGNER: ${{ vars.KRISTIN_P1A_EVIDENCE_SIGNER_MACOS }}
      KRISTIN_P1A_MACOS_SIGNING_IDENTITY: ${{ vars.KRISTIN_P1A_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.13.5", check-latest: false}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: "24.18.0", check-latest: false}
      - name: Verify exact controlled macos toolchain
        shell: bash
        run: python tool/p1a_toolchains.py --project . --verify-native-host --platform macos
      - name: Build exact native binaries on controlled runner
        shell: bash
        run: |
          cmake -S authority_service/native/macos -B .p1a-build-macos -DCMAKE_BUILD_TYPE=Release && cmake --build .p1a-build-macos --parallel 2
          cmake -S authority_service/connector/macos -B .p1a-connector-macos -DCMAKE_BUILD_TYPE=Release && cmake --build .p1a-connector-macos --parallel 2
          cmake -S authority_service/worker_launcher/macos -B .p1a-worker-macos -DCMAKE_BUILD_TYPE=Release && cmake --build .p1a-worker-macos --parallel 2
          cmake -S authority_service/install/macos -B .p1a-manager-macos -DCMAKE_BUILD_TYPE=Release && cmake --build .p1a-manager-macos --parallel 2
          echo "KRISTIN_P1A_SOURCE_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "KRISTIN_P1A_SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "KRISTIN_P1A_RUNNER_EPHEMERAL_SESSION_ID=$(uuidgen | tr -d '-')" >> "$GITHUB_ENV"
      - name: Resolve exact controlled macOS job and runner identity
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        shell: bash
        run: python tool/p1a_github_job_identity.py --output .p1a-job-macos.json --github-env "$GITHUB_ENV" --platform macos --job-name "$GITHUB_JOB" --commit-sha "$GITHUB_SHA"
      - name: Install, authorize, deny sandboxed worker, restart/replay, uninstall and sign exact evidence
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        shell: bash
        run: bash authority_service/tests/run_macos_behavioral.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: p1a-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/evidence/P1A/platforms/
          if-no-files-found: error
          retention-days: 30
