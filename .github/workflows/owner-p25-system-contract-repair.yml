name: Owner P25 System Contract Repair

on:
  push:
    branches:
      - automation/owner-recovery
    paths:
      - .github/workflows/owner-p25-system-contract-repair.yml

permissions:
  contents: write

concurrency:
  group: owner-p25-system-contract-repair
  cancel-in-progress: false

env:
  EXPECTED_P25_HEAD: 31714a77b2f0fbf08f0c6b895fa5ef00aa82a960
  EXPECTED_MAIN: 278aeccfa013411bc7cf23b4a34199718327f4b2
  P25_BRANCH: agent/owner-p25-current-main

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact P25 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/owner-p25-current-main
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Verify exact publication preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_P25_HEAD}"
          test "$(git ls-remote origin "refs/heads/${P25_BRANCH}" | cut -f1)" = "${EXPECTED_P25_HEAD}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${EXPECTED_MAIN}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Align cumulative source contract with P25 product behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tool/system_test.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              ('"Generate prompt",', '"Shape this idea",'),
              ('"Generate task list",', '"Build task plan",'),
              ('".clamp(2, 3)",', '".clamp(1, 2)",'),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'system contract anchor drift: {old!r} count={count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          grep -F '"Shape this idea",' tool/system_test.py
          grep -F '"Build task plan",' tool/system_test.py
          grep -F '".clamp(1, 2)",' tool/system_test.py
          grep -F "label: Text(" lib/product/chat_studio.dart >/dev/null
          grep -F "'Shape this idea'" lib/product/chat_studio.dart
          grep -F "'Build task plan'" lib/product/chat_studio.dart
          grep -F '.clamp(1, 2)' lib/product/prompt_planning.dart
          python3 -m py_compile tool/system_test.py
          git diff --check

      - name: Prove cumulative offline source contract is healthy
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/system_test.py --project . --json > "${RUNNER_TEMP}/system.json"
          python3 - "${RUNNER_TEMP}/system.json" <<'PY'
          import json
          import pathlib
          import sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          failed = [row for row in payload.get('results', []) if isinstance(row, dict) and not row.get('passed')]
          if failed:
              raise SystemExit(f'system contract still has failures: {failed}')
          print(f"SYSTEM_CONTRACT_PASS cases={len(payload.get('results', []))}")
          PY

      - name: Regenerate healthy deterministic portable baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/benchmark_runner.py run --project . --mode portable --strict-infrastructure
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('evals/results/p0_009_baseline.json').read_text(encoding='utf-8'))
          cases = {row.get('id'): row for row in report.get('cases', []) if isinstance(row, dict)}
          analysis = cases.get('analysis.offline_system_contract', {})
          summary = report.get('summary', {})
          if analysis.get('status') != 'passed':
              raise SystemExit(f'offline system contract did not recover: {analysis}')
          if analysis.get('score') != 1.0:
              raise SystemExit(f'offline system contract score is not 1.0: {analysis}')
          if summary.get('failedCount') not in (None, 0):
              raise SystemExit(f'baseline summary contains failedCount: {summary}')
          status_counts = summary.get('statusCounts', {})
          if status_counts.get('failed') != 0:
              raise SystemExit(f'baseline still records a failed case: {status_counts}')
          if summary.get('sourceContractPassedCount') != 1:
              raise SystemExit(f'source contract pass count regressed: {summary}')
          if float(summary.get('readiness', 0.0)) < 0.5:
              raise SystemExit(f'baseline readiness regressed below 0.5: {summary}')
          if report.get('claims', {}).get('baselineRecordedMeansProductReady') is not False:
              raise SystemExit('baseline claim boundary weakened')
          print(f"HEALTHY_BASELINE fingerprint={report.get('resultFingerprint')} readiness={summary.get('readiness')}")
          PY
          git diff --check

      - name: Refresh canonical manifest and validate benchmark contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/manifest.first"
          python3 tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/manifest.first" SOURCE_MANIFEST.sha256
          python3 tool/p1a_text_eof_contract_test.py --project .
          python3 tool/benchmark_runner.py validate --project .
          python3 tool/benchmark_runner.py check --project .
          python3 tool/benchmark_runner_test.py
          python3 tool/p0_009_benchmark_test.py --project .
          python3 tool/p0_010_generated_state_test.py --project .
          python3 tool/generated_state_guard.py audit --project . --strict >/dev/null
          python3 tool/roadmap_control.py validate --project . --strict
          python3 tool/p25_prompt_studio_roadmap_test.py --project .
          git diff --check

      - name: Prove exact bounded repair scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'SOURCE_MANIFEST.sha256',
              'evals/results/P0_009_BASELINE.md',
              'evals/results/p0_009_baseline.json',
              'tool/system_test.py',
          }
          if actual != expected:
              raise SystemExit(f'P25 healthy-baseline repair scope mismatch actual={sorted(actual)} expected={sorted(expected)}')
          PY
          git diff --check
          test "$(git ls-remote origin "refs/heads/${P25_BRANCH}" | cut -f1)" = "${EXPECTED_P25_HEAD}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${EXPECTED_MAIN}"

      - name: Publish exact healthy repair as fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'alex00Pirotskyi'
          git config user.email '177022051+alex00Pirotskyi@users.noreply.github.com'
          git add -- \
            SOURCE_MANIFEST.sha256 \
            evals/results/P0_009_BASELINE.md \
            evals/results/p0_009_baseline.json \
            tool/system_test.py
          git diff --cached --check
          git commit -m 'fix(p25): restore cumulative source-contract health'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_P25_HEAD}"
          remote="$(git ls-remote origin "refs/heads/${P25_BRANCH}" | cut -f1)"
          test "${remote}" = "${EXPECTED_P25_HEAD}"
          git push origin "HEAD:refs/heads/${P25_BRANCH}"
          git fetch origin "+refs/heads/${P25_BRANCH}:refs/remotes/origin/${P25_BRANCH}"
          test "$(git rev-parse "origin/${P25_BRANCH}")" = "${candidate}"
          echo "P25_SYSTEM_CONTRACT_REPAIRED_HEAD=${candidate}"
