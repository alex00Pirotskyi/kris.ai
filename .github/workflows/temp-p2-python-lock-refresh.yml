name: TEMP P2 Python Lock Refresh

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: temp-p2-python-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lock:
    if: github.event.pull_request.head.ref == 'ci/p2-python-lock-refresh-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: merge/p1-p2-owner-risk-qa-preview
      INTEGRATION_BRANCH: integration/p2-owner-risk-v71r12
      EXPECTED_HEAD: 0e7897523e18395a17f43756f98f5cf4af41789b
      REQUIREMENTS_SHA256: 7e5585be8612ae05f14448c2a4cff8f7afce44a74bc0a88cb3317e3f6ecb3693
      REQUIREMENTS_BASE64: 
    steps:
      - name: Check out exact P1/P2 integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false

      - name: Verify exact shared branch head
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git fetch origin "$TARGET_BRANCH" "$INTEGRATION_BRANCH"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/$INTEGRATION_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Update exact cross-version wheel lock, verifier, and source manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          payload = base64.b64decode(os.environ['REQUIREMENTS_BASE64'], validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          if actual != os.environ['REQUIREMENTS_SHA256']:
              raise SystemExit(f'requirements payload hash mismatch: {actual}')
          Path('config/v71r12_hosted_python_requirements.txt').write_bytes(payload)

          bootstrap = Path('tool/v71r12_bootstrap_hosted_python.py')
          value = bootstrap.read_text(encoding='utf-8')
          old = '        {\n            "8e74a6135550c4748af665b1b1118b6aab33b1fc6a16f9aff630af107c3b4512",\n            "799416bae98336e400981ff6e532d67d5c709cfb30afb79865a1315f94b0e224",\n            "716ff8ec22f20b4d988b12884086bcef0fc99737043e503f7a3935a6be99b1ea",\n        },\n'
          new = '        {\n            "1e9f50d192a3e525b15a75ab5114e442d83d657b7ec29182a991bc9a88fd3a66",\n            "716ff8ec22f20b4d988b12884086bcef0fc99737043e503f7a3935a6be99b1ea",\n            "78474632761faa0fb96f30b1c928c84ebcf68713cbb80d15bab09dfe61640fde",\n            "799416bae98336e400981ff6e532d67d5c709cfb30afb79865a1315f94b0e224",\n            "8e74a6135550c4748af665b1b1118b6aab33b1fc6a16f9aff630af107c3b4512",\n            "c97f080ea627e2863524c5af3836e2270b5f5dfff1f104392b959f8df0c5d384",\n            "df2b82571a1b30f58a87bf4e5a9e78d2b1eff6c6ce8fd3aa3757221f93f0863f",\n        },\n'
          if value.count(old) != 1:
              raise SystemExit(f'bootstrap cffi allowlist anchor count: {value.count(old)}')
          if any(digest in value for digest in (
              '1e9f50d192a3e525b15a75ab5114e442d83d657b7ec29182a991bc9a88fd3a66',
              'c97f080ea627e2863524c5af3836e2270b5f5dfff1f104392b959f8df0c5d384',
              'df2b82571a1b30f58a87bf4e5a9e78d2b1eff6c6ce8fd3aa3757221f93f0863f',
              '78474632761faa0fb96f30b1c928c84ebcf68713cbb80d15bab09dfe61640fde',
          )):
              raise SystemExit('bootstrap cffi allowlist repair is already present')
          bootstrap.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python tool/p2_refresh_source_manifest.py .

      - name: Validate governed three-path change
        shell: bash
        run: |
          set -euo pipefail
          echo "$REQUIREMENTS_SHA256  config/v71r12_hosted_python_requirements.txt" | sha256sum --check --strict
          python tool/v71r12_bootstrap_hosted_python.py --project .
          python tool/p2_source_inventory_test.py --project .
          git diff --check
          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 3
          test "${paths[0]}" = "SOURCE_MANIFEST.sha256"
          test "${paths[1]}" = "config/v71r12_hosted_python_requirements.txt"
          test "${paths[2]}" = "tool/v71r12_bootstrap_hosted_python.py"
          grep -Fx "$REQUIREMENTS_SHA256  config/v71r12_hosted_python_requirements.txt" SOURCE_MANIFEST.sha256
          grep -F '1e9f50d192a3e525b15a75ab5114e442d83d657b7ec29182a991bc9a88fd3a66' tool/v71r12_bootstrap_hosted_python.py
          grep -F 'c97f080ea627e2863524c5af3836e2270b5f5dfff1f104392b959f8df0c5d384' tool/v71r12_bootstrap_hosted_python.py
          grep -F 'df2b82571a1b30f58a87bf4e5a9e78d2b1eff6c6ce8fd3aa3757221f93f0863f' tool/v71r12_bootstrap_hosted_python.py
          grep -F '78474632761faa0fb96f30b1c928c84ebcf68713cbb80d15bab09dfe61640fde' tool/v71r12_bootstrap_hosted_python.py

      - name: Commit and push exact lock refresh to both integration refs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kristin CI Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256 config/v71r12_hosted_python_requirements.txt tool/v71r12_bootstrap_hosted_python.py
          git diff --cached --check
          git commit -m 'fix(ci): lock Python 3.12 hosted cffi wheels'
          repaired_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git push origin \
            "$repaired_commit:refs/heads/$TARGET_BRANCH" \
            "$repaired_commit:refs/heads/$INTEGRATION_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$repaired_commit"
          test "$(git ls-remote origin refs/heads/$INTEGRATION_BRANCH | awk '{print $1}')" = "$repaired_commit"
          echo "P2_LOCK_REFRESH_COMMIT=$repaired_commit"
