name: p2-012-layout-fix-oracle-v2
on:
  pull_request:
permissions:
  contents: write
jobs:
  layout-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p2-012-layout-fix-oracle-v2
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Guard stale stream callbacks and validate terminal behavior
        shell: bash
        run: |
          flutter pub get
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/product/p2_owner_workspace.dart')
          text = path.read_text()
          old_error = "        if (identical(_outputSubscriptions[tab.id], subscription)) {\n          _outputSubscriptions.remove(tab.id);\n        }\n        _recordOutputFailure(tab.id, error);"
          new_error = "        if (!identical(_outputSubscriptions[tab.id], subscription)) return;\n        _outputSubscriptions.remove(tab.id);\n        _recordOutputFailure(tab.id, error);"
          old_done = "        if (identical(_outputSubscriptions[tab.id], subscription)) {\n          _outputSubscriptions.remove(tab.id);\n        }\n        _connectionLabels[tab.id] = 'Disconnected';"
          new_done = "        if (!identical(_outputSubscriptions[tab.id], subscription)) return;\n        _outputSubscriptions.remove(tab.id);\n        _connectionLabels[tab.id] = 'Disconnected';"
          if old_error not in text:
              raise SystemExit('stream error callback target missing')
          if old_done not in text:
              raise SystemExit('stream done callback target missing')
          text = text.replace(old_error, new_error, 1)
          text = text.replace(old_done, new_done, 1)
          path.write_text(text)
          PY
          dart format lib/product/p2_owner_workspace.dart
          set +e
          flutter test --no-pub test/product/p2_owner_workspace_test.dart --reporter expanded > /tmp/p2-layout.log 2>&1
          status=$?
          set -e
          {
            echo "exit=$status"
            tail -n 180 /tmp/p2-layout.log
          } > p2-012-layout-fix-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/product/p2_owner_workspace.dart p2-012-layout-fix-diagnostic.txt
          git commit -m 'fix(p2): ignore stale terminal stream callbacks'
          git push origin HEAD:agent/p2-012-layout-fix-oracle-v2
