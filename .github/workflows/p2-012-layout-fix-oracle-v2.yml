name: p2-012-layout-fix-oracle-v2
on:
  pull_request:
permissions:
  contents: write
jobs:
  layout-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p2-012-layout-fix-oracle-v2
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Make local detach cleanup non-blocking and validate
        shell: bash
        run: |
          flutter pub get
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/product/p2_owner_workspace.dart')
          text = path.read_text()
          old = "    final cancellation = _cancelLocalOutput(selected.id);\n    widget.terminalModel.setAttached(selected.id, false);\n    _connectionLabels[selected.id] = 'Detached';\n    if (mounted) setState(() {});\n    await cancellation;"
          new = "    unawaited(_cancelLocalOutput(selected.id));\n    widget.terminalModel.setAttached(selected.id, false);\n    _connectionLabels[selected.id] = 'Detached';\n    if (mounted) setState(() {});"
          if old not in text:
              raise SystemExit('blocking detach cleanup target missing')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format lib/product/p2_owner_workspace.dart
          set +e
          flutter test --no-pub test/product/p2_owner_workspace_test.dart --reporter expanded > /tmp/p2-layout.log 2>&1
          status=$?
          set -e
          {
            echo "exit=$status"
            tail -n 180 /tmp/p2-layout.log
          } > p2-012-layout-fix-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/product/p2_owner_workspace.dart p2-012-layout-fix-diagnostic.txt
          git commit -m 'fix(p2): do not block reattach on local stream cleanup'
          git push origin HEAD:agent/p2-012-layout-fix-oracle-v2
