name: p2-012-layout-fix-oracle-v2
on:
  pull_request:
permissions:
  contents: write
jobs:
  layout-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p2-012-layout-fix-oracle-v2
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Synchronize async widget assertions and validate terminal behavior
        shell: bash
        run: |
          flutter pub get
          python - <<'PY'
          from pathlib import Path
          path = Path('test/product/p2_owner_workspace_test.dart')
          text = path.read_text()
          replacements = [
              ("    await tester.tap(find.byTooltip('Send terminal input'));\n    await tester.pump();", "    await tester.tap(find.byTooltip('Send terminal input'));\n    await tester.pumpAndSettle();"),
              ("    await tester.tap(find.text('Detach'));\n    await tester.pump();", "    await tester.tap(find.text('Detach'));\n    await tester.pumpAndSettle();"),
              ("    await tester.tap(find.text('Attach'));\n    await tester.pump();\n    await tester.pump();", "    await tester.tap(find.text('Attach'));\n    await tester.pumpAndSettle();"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'widget synchronization target missing: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          dart format test/product/p2_owner_workspace_test.dart
          set +e
          flutter test --no-pub test/product/p2_owner_workspace_test.dart --reporter expanded > /tmp/p2-layout.log 2>&1
          status=$?
          set -e
          {
            echo "exit=$status"
            tail -n 180 /tmp/p2-layout.log
          } > p2-012-layout-fix-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/product/p2_owner_workspace_test.dart p2-012-layout-fix-diagnostic.txt
          git commit -m 'test(p2): settle asynchronous terminal actions'
          git push origin HEAD:agent/p2-012-layout-fix-oracle-v2
