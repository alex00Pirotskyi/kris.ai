name: p2-012-layout-fix-oracle-v2
on:
  pull_request:
permissions:
  contents: write
jobs:
  layout-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p2-012-layout-fix-oracle-v2
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Apply, format, and validate constrained terminal layout
        shell: bash
        run: |
          flutter pub get
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('lib/product/p2_owner_workspace.dart')
          text = path.read_text()
          start_marker = '              if (constraints.maxWidth >= 900) {'
          end_marker = '            },\n          ),'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('layout start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('layout end marker not found')
          payload = ''
          replacement = base64.b64decode(payload).decode()
          path.write_text(text[:start] + replacement + text[end:])
          PY
          dart format lib/product/p2_owner_workspace.dart
          set +e
          flutter test --no-pub test/product/p2_owner_workspace_test.dart --reporter expanded > /tmp/p2-layout.log 2>&1
          status=$?
          set -e
          {
            echo "exit=$status"
            tail -n 180 /tmp/p2-layout.log
          } > p2-012-layout-fix-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/product/p2_owner_workspace.dart p2-012-layout-fix-diagnostic.txt
          git commit -m 'fix(p2): keep Owner terminal usable at constrained heights'
          git push origin HEAD:agent/p2-012-layout-fix-oracle-v2
