name: p2-012-layout-fix-oracle-v2
on:
  pull_request:
permissions:
  contents: write
jobs:
  layout-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p2-012-layout-fix-oracle-v2
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Publish detach state before local stream cleanup and validate
        shell: bash
        run: |
          flutter pub get
          python - <<'PY'
          from pathlib import Path
          owner = Path('lib/product/p2_owner_workspace.dart')
          owner_text = owner.read_text()
          old_detach = "    await widget.actions.detach(selected);\n    await _cancelLocalOutput(selected.id);\n    widget.terminalModel.setAttached(selected.id, false);\n    _connectionLabels[selected.id] = 'Detached';\n    if (mounted) setState(() {});"
          new_detach = "    await widget.actions.detach(selected);\n    final cancellation = _cancelLocalOutput(selected.id);\n    widget.terminalModel.setAttached(selected.id, false);\n    _connectionLabels[selected.id] = 'Detached';\n    if (mounted) setState(() {});\n    await cancellation;"
          if old_detach not in owner_text:
              raise SystemExit('detach ordering target missing')
          owner.write_text(owner_text.replace(old_detach, new_detach, 1))

          test = Path('test/product/p2_owner_workspace_test.dart')
          test_text = test.read_text()
          reversions = [
              ("    await tester.tap(find.byTooltip('Send terminal input'));\n    await tester.pumpAndSettle();", "    await tester.tap(find.byTooltip('Send terminal input'));\n    await tester.pump();"),
              ("    await tester.tap(find.text('Detach'));\n    await tester.pumpAndSettle();", "    await tester.tap(find.text('Detach'));\n    await tester.pump();"),
              ("    await tester.tap(find.text('Attach'));\n    await tester.pumpAndSettle();", "    await tester.tap(find.text('Attach'));\n    await tester.pump();\n    await tester.pump();"),
          ]
          for old, new in reversions:
              if old not in test_text:
                  raise SystemExit(f'original timing restoration target missing: {old!r}')
              test_text = test_text.replace(old, new, 1)
          test.write_text(test_text)
          PY
          dart format lib/product/p2_owner_workspace.dart test/product/p2_owner_workspace_test.dart
          set +e
          flutter test --no-pub test/product/p2_owner_workspace_test.dart --reporter expanded > /tmp/p2-layout.log 2>&1
          status=$?
          set -e
          {
            echo "exit=$status"
            tail -n 180 /tmp/p2-layout.log
          } > p2-012-layout-fix-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/product/p2_owner_workspace.dart test/product/p2_owner_workspace_test.dart p2-012-layout-fix-diagnostic.txt
          git commit -m 'fix(p2): publish terminal detach before stream cleanup'
          git push origin HEAD:agent/p2-012-layout-fix-oracle-v2
