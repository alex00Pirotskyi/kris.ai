name: P4-001 Search Provider Interface

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/p4-001-search-provider.yml
      - SOURCE_MANIFEST.sha256
      - config/test_center_registry.v1.json
      - docs/roadmap/progress/2026-08-05-p4-001-search-provider-foundation.md
      - evals/fixtures/p4_001_search_provider/**
      - release/evidence/P4-001/**
      - schemas/test_center.v1.json
      - schemas/web_search_*.v1.json
      - services/research_worker/**
      - tool/p4_001_*.py
      - tool/test_center_contracts.py
      - tool/test_center_contracts_test.py

permissions:
  contents: read

env:
  P4_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  canonical-source:
    name: p4-001-canonical-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.P4_CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Assert exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${P4_CANDIDATE_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Parse Worker C Python sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import pathlib

          roots = (
              pathlib.Path('services/research_worker/src/search'),
              pathlib.Path('services/research_worker/test'),
          )
          paths = [path for root in roots for path in root.glob('*.py')]
          paths.extend((
              pathlib.Path('tool/p4_001_search_provider_test.py'),
              pathlib.Path('tool/p4_001_test_center_v1.py'),
              pathlib.Path('tool/p4_001_test_center_v1_test.py'),
          ))
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print(f'P4-001 Python sources parsed: {len(paths)}')
          PY
      - name: Validate Worker B canonical Test Center v1
        shell: bash
        run: |
          set -euo pipefail
          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/test_center_contracts_test.py
          python tool/p4_001_test_center_v1.py check --project .
          python -m unittest -v tool/p4_001_test_center_v1_test.py
      - name: Run exact P4-001 source gate
        shell: bash
        run: |
          set -euo pipefail
          python tool/p4_001_search_provider_test.py \
            --project . \
            --json-output "${{ runner.temp }}/p4-001-raw-${{ matrix.platform }}.json"
      - name: Generate canonical execution records
        shell: bash
        run: |
          set -euo pipefail
          python tool/p4_001_test_center_v1.py run-source-suite \
            --project . \
            --platform "${{ matrix.platform }}" \
            --output "${{ runner.temp }}/p4-001-canonical-${{ matrix.platform }}.json" \
            --generated-dir "${{ runner.temp }}/p4-001-canonical-logs"
          python tool/p4_001_test_center_v1.py validate-records \
            --project . \
            "${{ runner.temp }}/p4-001-canonical-${{ matrix.platform }}.json"
      - name: Validate generated-state and non-mutation boundaries
        shell: bash
        run: |
          set -euo pipefail
          python tool/roadmap_control.py validate --project . --strict
          python tool/generated_state_guard.py audit --project . --strict
          python tool/source_tree_policy_test.py
          git diff --check
          test -z "$(git status --short)"
      - name: Upload canonical P4-001 execution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-001-canonical-${{ matrix.platform }}-${{ env.P4_CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/p4-001-raw-${{ matrix.platform }}.json
            ${{ runner.temp }}/p4-001-canonical-${{ matrix.platform }}.json
            ${{ runner.temp }}/p4-001-canonical-logs
          if-no-files-found: error
          retention-days: 30

  source-manifest:
    name: p4-001-source-manifest
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.P4_CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Assert exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${P4_CANDIDATE_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Generate source manifest twice
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/p4-001-manifest"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/p4-001-manifest/SOURCE_MANIFEST.first.sha256"
          first_hash="$(sha256sum SOURCE_MANIFEST.sha256 | cut -d' ' -f1)"
          python tool/p1a_refresh_source_manifest.py .
          second_hash="$(sha256sum SOURCE_MANIFEST.sha256 | cut -d' ' -f1)"
          cmp --silent \
            "${RUNNER_TEMP}/p4-001-manifest/SOURCE_MANIFEST.first.sha256" \
            SOURCE_MANIFEST.sha256
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/p4-001-manifest/SOURCE_MANIFEST.sha256"
          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          printf '%s\n' "${paths[@]}" > "${RUNNER_TEMP}/p4-001-manifest/changed-paths.txt"
          test "${#paths[@]}" -le 1
          if [ "${#paths[@]}" -eq 1 ]; then
            test "${paths[0]}" = 'SOURCE_MANIFEST.sha256'
          fi
          tree="$(git show -s --format=%T HEAD)"
          python - "${RUNNER_TEMP}/p4-001-manifest/metadata.json" \
            "${P4_CANDIDATE_SHA}" "${tree}" "${first_hash}" "${second_hash}" \
            "${#paths[@]}" <<'PY'
          import json
          import pathlib
          import sys

          target, commit, tree, first_hash, second_hash, changed = sys.argv[1:]
          pathlib.Path(target).write_text(
              json.dumps(
                  {
                      "schemaVersion": "1.0.0",
                      "taskId": "P4-001",
                      "generator": "tool/p1a_refresh_source_manifest.py",
                      "writeCommand": [
                          "python",
                          "tool/p1a_refresh_source_manifest.py",
                          ".",
                      ],
                      "checkCommand": [
                          "python",
                          "tool/p1a_refresh_source_manifest.py",
                          ".",
                      ],
                      "candidateCommit": commit,
                      "candidateTree": tree,
                      "firstGenerationSha256": first_hash,
                      "secondGenerationSha256": second_hash,
                      "idempotent": first_hash == second_hash,
                      "changedPathCount": int(changed),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          echo "changed_count=${#paths[@]}" >> "$GITHUB_OUTPUT"
      - name: Upload exact source-manifest candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-001-source-manifest-${{ env.P4_CANDIDATE_SHA }}
          path: ${{ runner.temp }}/p4-001-manifest
          if-no-files-found: error
          retention-days: 30
      - name: Require exact-head source manifest
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.manifest.outputs.changed_count }}" = '0'
          git diff --check
          test -z "$(git status --short)"
