name: P4-001 Search Provider Interface

on:
  pull_request:
    paths:
      - .github/workflows/p4-001-search-provider.yml
      - SOURCE_MANIFEST.sha256
      - docs/roadmap/progress/2026-08-05-p4-001-search-provider-foundation.md
      - evals/fixtures/p4_001_search_provider/**
      - release/evidence/P4-001/**
      - schemas/web_search_*.v1.json
      - services/research_worker/**
      - tool/p4_001_search_provider_test.py

permissions:
  contents: read

jobs:
  source-manifest:
    name: p4-001-source-manifest
    if: >-
      github.event.pull_request.user.login == 'alex00Pirotskyi' &&
      github.event.pull_request.head.ref == 'agent/p4-001-search-provider-foundation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Refresh governed source manifest
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          git diff --check
          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          if [ "${#paths[@]}" -eq 0 ]; then
            echo 'SOURCE_MANIFEST_CURRENT=true'
            exit 0
          fi
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = 'SOURCE_MANIFEST.sha256'
      - name: Publish exact manifest to Worker C branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- SOURCE_MANIFEST.sha256; then
            echo 'SOURCE_MANIFEST_PUSH_REQUIRED=false'
            exit 0
          fi
          git config user.name 'Kristin P4-001 Source Gate'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256
          git diff --cached --check
          git commit -m 'ci(p4-001): refresh governed source manifest'
          git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"

  validate:
    name: p4-001-contract-source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Compile P4-001 sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            services/research_worker/src/search/*.py \
            services/research_worker/test/*.py \
            tool/p4_001_search_provider_test.py
      - name: Run exact P4-001 source gate
        shell: bash
        run: |
          set -euo pipefail
          python tool/p4_001_search_provider_test.py \
            --project . \
            --json-output release/evidence/P4-001/ci-test-results.json
      - name: Validate roadmap and generated-state boundaries
        shell: bash
        run: |
          set -euo pipefail
          python tool/roadmap_control.py validate --project . --strict
          python tool/generated_state_guard.py audit --project . --strict
          python tool/source_tree_policy_test.py
          git diff --check
          test -z "$(git status --short)"
