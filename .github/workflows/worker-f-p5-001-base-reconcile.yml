name: Worker F P5-001 Base Reconciliation

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture
    paths:
      - .github/workflows/worker-f-p5-001-base-reconcile.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: worker-f-p5-001-base-reconcile
  cancel-in-progress: false

env:
  WORK_EXECUTION_ID: WRK-20260806T181344Z-77157857
  WORKER_F_BRANCH: agent/f/P5-001-information-architecture
  WORKER_B_BRANCH: agent/b/test-center-contracts-and-review
  MISSION_BRANCH: agent/anarchy-autonomous-worker-missions
  DELIVERY_OVERLAY_BRANCH: agent/mission-delivery-enforcement-v1

jobs:
  reconcile:
    name: Reconcile and validate P5-001
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Worker F exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.WORKER_F_BRANCH }}
          fetch-depth: 0

      - name: Checkout canonical mission system read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MISSION_BRANCH }}
          path: _mission_system
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout PR 78 delivery overlay read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DELIVERY_OVERLAY_BRANCH }}
          path: _delivery_overlay
          persist-credentials: false
          fetch-depth: 1

      - name: Validate mission and delivery control planes
        shell: bash
        run: |
          set -euo pipefail
          python _mission_system/tool/mission_control.py --project _mission_system validate
          python _mission_system/tool/mission_control.py --project _mission_system status
          python _delivery_overlay/tool/mission_delivery_control.py --project _delivery_overlay validate
          python _delivery_overlay/tool/mission_delivery_control.py --project _delivery_overlay generate --check
          rm -rf _mission_system _delivery_overlay

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Set up locked Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Merge current Worker B ancestry fail-closed
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$WORKER_B_BRANCH:refs/remotes/origin/$WORKER_B_BRANCH"
          initial_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse "origin/$WORKER_B_BRANCH")"
          base_tree="$(git rev-parse "origin/$WORKER_B_BRANCH^{tree}")"
          set +e
          git merge --no-ff --no-commit "origin/$WORKER_B_BRANCH"
          merge_rc=$?
          set -e
          if [[ "$merge_rc" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              if [[ "$path" != 'SOURCE_MANIFEST.sha256' ]]; then
                echo "Unauthorized or unplanned merge conflict: $path" >&2
                exit 1
              fi
            done
            git checkout --theirs SOURCE_MANIFEST.sha256
            git add SOURCE_MANIFEST.sha256
          fi
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo 'Unresolved merge conflicts remain' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          rm .github/workflows/worker-f-p5-001-base-reconcile.yml
          git add -A
          {
            echo "initial_sha=$initial_sha"
            echo "base_sha=$base_sha"
            echo "base_tree=$base_tree"
          } >> "$GITHUB_OUTPUT"

      - name: Install governed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python tool/v71r12_bootstrap_hosted_python.py --project .
          flutter pub get

      - name: Validate roadmap, Test Center, P8 hierarchy, and Worker F contracts
        shell: bash
        run: |
          set -euo pipefail
          python tool/roadmap_control.py validate --project . --strict
          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/test_center_contracts_test.py
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/test_center_assurance_hierarchy.py check-report --project . --report release/evidence/TEST_CENTER/P8-001/fixtures/assurance-execution-report.pass.json
          python -m unittest -v tool/test_center_assurance_hierarchy_test.py
          python tool/worker_f_p5_ia.py manifest --project . --check
          python tool/worker_f_p5_ia.py check --project .
          python tool/worker_f_p5_ia_test.py

      - name: Validate Flutter prototype and affected shell tests
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed \
            lib/p5_ia_preview.dart \
            lib/product/p5_information_architecture \
            test/product/p5_information_architecture
          flutter analyze
          flutter test test/product/p5_information_architecture/
          while IFS= read -r test_path; do
            if [[ -n "$test_path" ]]; then
              flutter test "$test_path"
            fi
          done < <(
            find test -type f \( \
              -iname '*p2_app_shell*test.dart' -o \
              -iname '*p2_owner*test.dart' -o \
              -iname '*chat_studio*test.dart' \
            \) | sort
          )

      - name: Regenerate canonical source manifest twice
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          python tool/generated_state_guard.py audit --project . --strict
          git diff --check
          test ! -e .github/workflows/worker-f-p5-001-base-reconcile.yml
          git add -A

      - name: Publish ordinary merge candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'P5-001: reconcile current Test Center base'
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse 'HEAD^{tree}')"
          parent_count="$(git rev-list --parents -n 1 HEAD | wc -w)"
          if [[ "$parent_count" -ne 3 ]]; then
            echo "Expected a two-parent merge commit, got word count $parent_count" >&2
            exit 1
          fi
          git push origin "HEAD:$WORKER_F_BRANCH"
          {
            echo "final_sha=$final_sha"
            echo "final_tree=$final_tree"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Worker F P5-001 reconciliation'
            echo
            echo "- Work execution: \`$WORK_EXECUTION_ID\`"
            echo "- Previous Worker F head: \`${{ steps.merge.outputs.initial_sha }}\`"
            echo "- Worker B base: \`${{ steps.merge.outputs.base_sha }}\`"
            echo "- Worker B tree: \`${{ steps.merge.outputs.base_tree }}\`"
            echo "- Final candidate: \`$final_sha\`"
            echo "- Final tree: \`$final_tree\`"
            echo '- Temporary workflow removed before publication: yes'
            echo '- Source manifest regenerated twice byte-identically: yes'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch exact final validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            worker-f-p5-001-information-architecture.yml \
            p8-001-formal-test-hierarchy.yml \
            ci.yml \
            p2-integration-alignment.yml
          do
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              -f "ref=$WORKER_F_BRANCH"
          done
