name: P1-P8 MCP Runtime Diagnostic

on:
  pull_request:
    branches:
      - 'agent/p1-p8-source-convergence-20260823'
    paths:
      - '.github/workflows/p1-p8-focused-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p1-p8-source-convergence-20260823
          fetch-depth: 1
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply runtime integration patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tool/p1_p8_runtime_finalize.py
          python tool/p1_p8_runtime_finalize.py
          dart format lib/product/mcp_registry_v2.dart test/product/mcp_registry_v2_test.dart
      - name: MCP signed install and owner-host execution
        run: >-
          flutter test --no-pub --concurrency=1 --reporter compact
          --plain-name "signed install persists canonical identity and owner-host execution"
          test/product/mcp_registry_v2_test.dart
      - name: MCP tampered descriptor rejection
        run: >-
          flutter test --no-pub --concurrency=1 --reporter compact
          --plain-name "tampered signed descriptor is rejected before registration"
          test/product/mcp_registry_v2_test.dart
      - name: MCP isolated backend denial
        run: >-
          flutter test --no-pub --concurrency=1 --reporter compact
          --plain-name "isolated descriptor fails closed when no sandbox backend is available"
          test/product/mcp_registry_v2_test.dart
      - name: MCP owner-host explicit grant
        run: >-
          flutter test --no-pub --concurrency=1 --reporter compact
          --plain-name "owner-host execution requires an explicit owner-host grant"
          test/product/mcp_registry_v2_test.dart
      - name: MCP executable drift revocation
        run: >-
          flutter test --no-pub --concurrency=1 --reporter compact
          --plain-name "executable identity drift revokes the server before execution"
          test/product/mcp_registry_v2_test.dart
