name: P5 UI Quality

on:
  pull_request:
    branches: [main]
    paths:
      - lib/product/chat_studio.dart
      - lib/product/p5_*.dart
      - lib/product/p5_information_architecture/**
      - lib/product/ui.dart
      - test/product/p5_*.dart
      - test/product/p5_information_architecture/**
      - docs/quality/P5_*.md
      - .github/workflows/p5-ui-quality.yml
  push:
    branches: [main]
    paths:
      - lib/product/chat_studio.dart
      - lib/product/p5_*.dart
      - lib/product/p5_information_architecture/**
      - lib/product/ui.dart
      - test/product/p5_*.dart
      - test/product/p5_information_architecture/**
      - docs/quality/P5_*.md
      - .github/workflows/p5-ui-quality.yml

permissions:
  contents: read

concurrency:
  group: p5-ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Formatting contract
        run: python tool/dart_format_scope.py --check
      - name: P5 accessibility, performance and UX regression gate
        run: >-
          flutter test --no-pub --concurrency=1 --reporter expanded
          test/product/p5_design_tokens_test.dart
          test/product/p5_accessibility_compliance_test.dart
          test/product/p5_ui_performance_test.dart
          test/product/p5_ux_regression_gate_test.dart
          test/product/p5_information_architecture
      - name: Fatal static analysis
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos
