name: P5-004 current-main three-pane finalizer
# Retry with file-backed production persistence and deterministic injected widget persistence.

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p5-004-three-pane-stacked-finalize.yml

permissions:
  contents: write

env:
  BASE_MAIN_SHA: 4b5617d421a63f6528feb2b4b4680b17728e8144
  TARGET_BRANCH: agent/p5-004-three-pane-stacked-20260822
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PATCH_PATH: .repo-p5-004-finalize.py
  ANCHOR_FIX_PATH: .repo-p5-004-anchor-fix.py
  LAYOUT_FIX_PATH: .repo-p5-004-layout-contract-fix.py
  POST_FIX_PATH: .repo-p5-004-postpatch.py
  FINALIZER_PATH: .github/workflows/p5-004-three-pane-stacked-finalize.yml

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact current-main transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          test -f "$PATCH_PATH"
          test -f "$ANCHOR_FIX_PATH"
          test -f "$LAYOUT_FIX_PATH"
          test -f "$POST_FIX_PATH"
          test -f "$FINALIZER_PATH"
          test -z "$(git status --short)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Apply bounded P5-004 source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python -m py_compile "$ANCHOR_FIX_PATH" "$PATCH_PATH" "$LAYOUT_FIX_PATH" "$POST_FIX_PATH"
          python "$ANCHOR_FIX_PATH"
          python "$PATCH_PATH"
          python "$LAYOUT_FIX_PATH"
          python "$POST_FIX_PATH"
          git rm -f "$PATCH_PATH" "$ANCHOR_FIX_PATH" "$LAYOUT_FIX_PATH" "$POST_FIX_PATH" "$FINALIZER_PATH"
          dart format \
            lib/product/p5_information_architecture/p5_controller.dart \
            lib/product/p5_information_architecture/p5_prototype.dart \
            lib/product/p5_information_architecture/p5_shell_layout.dart \
            lib/product/p5_information_architecture/p5_shell_workspace.dart \
            lib/product/ui.dart \
            test/product/p5_information_architecture/p5_shell_layout_test.dart \
            test/product/source_contract_test.dart
      - name: Bootstrap hosted test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Existing P5 navigation contract
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 4m \
            flutter test --no-pub --concurrency=1 --reporter expanded \
            test/product/p5_information_architecture/p5_navigation_test.dart
      - name: New P5-004 shell contract
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 4m \
            flutter test --no-pub --concurrency=1 --reporter expanded \
            test/product/p5_information_architecture/p5_shell_layout_test.dart
      - name: Full P5 information-architecture suite
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            flutter test --no-pub --concurrency=1 --reporter expanded \
            test/product/p5_information_architecture
      - name: Full Flutter regression suite
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 15m \
            flutter test --no-pub --concurrency=1 --reporter expanded
      - name: Analyzer contract
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            flutter analyze --no-pub --fatal-warnings --fatal-infos
      - name: Source identity and release validator
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          python tool/validate_release.py --skip-tests
          git restore --source="$SOURCE_SHA" --staged --worktree -- \
            release/FILE_ADAPTER_RESULTS.json \
            release/KNOWLEDGE_MEMORY_V2_RESULTS.json
          git diff --check
      - name: Assert exact eight-file durable scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_MAIN_SHA" | sort > "$RUNNER_TEMP/actual.paths"
          cat > "$RUNNER_TEMP/expected.paths" <<'EOF'
          SOURCE_MANIFEST.sha256
          lib/product/p5_information_architecture/p5_controller.dart
          lib/product/p5_information_architecture/p5_prototype.dart
          lib/product/p5_information_architecture/p5_shell_layout.dart
          lib/product/p5_information_architecture/p5_shell_workspace.dart
          lib/product/ui.dart
          test/product/p5_information_architecture/p5_shell_layout_test.dart
          test/product/source_contract_test.dart
          EOF
          sort -o "$RUNNER_TEMP/expected.paths" "$RUNNER_TEMP/expected.paths"
          diff -u "$RUNNER_TEMP/expected.paths" "$RUNNER_TEMP/actual.paths"
      - name: Publish exact clean P5-004 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(p5-004): add persistent three-pane Experience shell'
          git push origin "HEAD:$TARGET_BRANCH"
