name: Owner P25 Canonical Baseline Fix

on:
  push:
    branches:
      - automation/owner-recovery
    paths:
      - .github/workflows/owner-p25-canonical-baseline-fix.yml

permissions:
  contents: write

concurrency:
  group: owner-p25-canonical-baseline-fix
  cancel-in-progress: false

env:
  EXPECTED_P25_HEAD: 13d8b9b4c82ec839c47db9f72b95e184380dba5c
  EXPECTED_MAIN: 278aeccfa013411bc7cf23b4a34199718327f4b2
  EXPECTED_FINGERPRINT: b40c1bb87281f0a419c67abfb4c89d71d0fa692bf209fdb2caf22175bde31bf5
  P25_BRANCH: agent/owner-p25-current-main

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact clean P25 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/owner-p25-current-main
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify exact clean provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_P25_HEAD}"
          test "$(git ls-remote origin "refs/heads/${P25_BRANCH}" | cut -f1)" = "${EXPECTED_P25_HEAD}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${EXPECTED_MAIN}"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          import subprocess
          tracked = [
              'tool/system_test.py',
              'tool/benchmark_runner.py',
              'evals/datasets/p0_009_initial_benchmark.v1.json',
          ]
          for path in tracked:
              head = subprocess.check_output(['git','show',f'HEAD:{path}'])
              index = subprocess.check_output(['git','show',f':{path}'])
              work = open(path,'rb').read()
              if head != index or index != work:
                  raise SystemExit(f'benchmark provenance is not clean for {path}')
          print('BENCHMARK_PROVENANCE_CLEAN')
          PY

      - name: Regenerate baseline from committed index-identical source
        shell: bash
        run: |
          set -euo pipefail
          python tool/benchmark_runner.py run --project . --mode portable --strict-infrastructure
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evals/results/p0_009_baseline.json').read_text(encoding='utf-8'))
          expected = 'b40c1bb87281f0a419c67abfb4c89d71d0fa692bf209fdb2caf22175bde31bf5'
          if report.get('resultFingerprint') != expected:
              raise SystemExit(f"unexpected canonical fingerprint {report.get('resultFingerprint')} != {expected}")
          summary = report.get('summary', {})
          if summary.get('statusCounts', {}).get('failed') != 0:
              raise SystemExit(f'canonical baseline contains failure: {summary}')
          if summary.get('sourceContractPassedCount') != 1:
              raise SystemExit(f'canonical source-contract count is wrong: {summary}')
          if float(summary.get('readiness', 0.0)) != 0.5:
              raise SystemExit(f'canonical readiness is not 0.5: {summary}')
          case = next(row for row in report['cases'] if row['id'] == 'analysis.offline_system_contract')
          if case.get('status') != 'passed' or case.get('score') != 1.0:
              raise SystemExit(f'offline cumulative source contract is not healthy: {case}')
          if report.get('claims', {}).get('baselineRecordedMeansProductReady') is not False:
              raise SystemExit('benchmark claim boundary weakened')
          print(f"CANONICAL_P0_009 fingerprint={expected}")
          PY
          git diff --check

      - name: Refresh manifest and prove baseline reproducibility
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          python tool/benchmark_runner.py validate --project .
          python tool/benchmark_runner.py check --project .
          python tool/p0_009_benchmark_test.py --project .
          git diff --check

      - name: Reproduce P0-010 after normal Flutter setup
        shell: bash
        run: |
          set -euo pipefail
          flutter create --project-name kristin_local_agent --org local.kristin --platforms=linux . >/dev/null
          flutter pub get >/dev/null
          python tool/source_tree_policy_test.py >/dev/null
          python tool/generated_state_guard_test.py >/dev/null
          python tool/p0_010_generated_state_test.py --project . > "${RUNNER_TEMP}/p0-010.json"
          python3 - "${RUNNER_TEMP}/p0-010.json" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          if not report.get('passed') or report.get('failedCount') != 0:
              raise SystemExit(f'P0-010 still red: {report}')
          case = next(row for row in report['results'] if row['name'] == 'P0-009 benchmark baseline current')
          if not case.get('passed') or 'b40c1bb87281f0a419c67abfb4c89d71d0fa692bf209fdb2caf22175bde31bf5' not in case.get('detail',''):
              raise SystemExit(f'P0-010 did not bind canonical P0-009 baseline: {case}')
          print('P0_010_P25_CANONICAL_BASELINE_PASS')
          PY

      - name: Prove exact repair scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {
              'SOURCE_MANIFEST.sha256',
              'evals/results/P0_009_BASELINE.md',
              'evals/results/p0_009_baseline.json',
          }
          transient_allowed = {
              '.metadata',
              'release/evidence/P0-006/local_governance_results.json',
          }
          source_delta = actual - transient_allowed
          if source_delta != expected:
              raise SystemExit(f'canonical baseline repair scope mismatch actual={sorted(actual)} source={sorted(source_delta)} expected={sorted(expected)}')
          PY
          git checkout -- .metadata release/evidence/P0-006/local_governance_results.json 2>/dev/null || true
          rm -f release/evidence/P0-003/ci-environment-Linux.json release/evidence/P0-004/toolchain-Linux.json
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "SOURCE_MANIFEST.sha256 evals/results/P0_009_BASELINE.md evals/results/p0_009_baseline.json "
          git diff --check
          test "$(git ls-remote origin "refs/heads/${P25_BRANCH}" | cut -f1)" = "${EXPECTED_P25_HEAD}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${EXPECTED_MAIN}"

      - name: Publish canonical baseline as fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'alex00Pirotskyi'
          git config user.email '177022051+alex00Pirotskyi@users.noreply.github.com'
          git add -- SOURCE_MANIFEST.sha256 evals/results/P0_009_BASELINE.md evals/results/p0_009_baseline.json
          git diff --cached --check
          git commit -m 'fix(p25): bind P0-009 baseline to committed source'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_P25_HEAD}"
          test "$(git ls-remote origin "refs/heads/${P25_BRANCH}" | cut -f1)" = "${EXPECTED_P25_HEAD}"
          git push origin "HEAD:refs/heads/${P25_BRANCH}"
          git fetch origin "+refs/heads/${P25_BRANCH}:refs/remotes/origin/${P25_BRANCH}"
          test "$(git rev-parse "origin/${P25_BRANCH}")" = "${candidate}"
          echo "P25_CANONICAL_BASELINE_HEAD=${candidate}"
