name: Temporary Session Terminal Invariant

on:
  push:
    branches:
      - feat/one-kristin-convergence
    paths:
      - .github/workflows/tmp-session-terminal-invariant.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/one-kristin-convergence
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Patch terminal deferred-interaction invariant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('lib/product/kristin_conversation_session.dart')
          text = source.read_text(encoding='utf-8')
          old = """    _awaitingPermission = run.state == RunState.awaitingApproval;\n    if (existing == null || existing.id != run.id) {\n      _deferredInteraction = null;\n      clearLiveExecution();\n    }\n"""
          new = """    _awaitingPermission = run.state == RunState.awaitingApproval;\n    final replacingRun = existing == null || existing.id != run.id;\n    if (runTerminal || replacingRun) {\n      _deferredInteraction = null;\n    }\n    if (replacingRun) {\n      clearLiveExecution();\n    }\n"""
          if text.count(old) != 1:
              raise SystemExit('unexpected _attachRun source shape')
          source.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          test = Path('test/product/kristin_conversation_session_test.dart')
          text = test.read_text(encoding='utf-8')
          marker = "  test('awaiting approval run projects to the permission state', () {\n"
          addition = """  test('terminal run refresh clears attached deferred interaction', () {\n    final session = KristinConversationSession();\n    session.restoreRun(_run(id: 'run-a', state: RunState.paused));\n    session.setDeferredInteraction(\n      _interaction(\n        runId: 'run-a',\n        status: AgentDeferredInteractionStatus.pending,\n      ),\n    );\n\n    session.updateRun(_run(id: 'run-a', state: RunState.succeeded));\n\n    expect(session.currentRun?.state, RunState.succeeded);\n    expect(session.deferredInteraction, isNull);\n    expect(session.awaitingUserInput, isFalse);\n    expect(session.deferredUserPrompt, isNull);\n  });\n\n"""
          if text.count(marker) != 1:
              raise SystemExit('unexpected session test source shape')
          test.write_text(text.replace(marker, addition + marker), encoding='utf-8', newline='\n')
          PY

      - name: Resolve Dart package context and format
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/product/kristin_conversation_session.dart test/product/kristin_conversation_session_test.dart
          git diff --check -- lib/product/kristin_conversation_session.dart test/product/kristin_conversation_session_test.dart

      - name: Run focused session contract
        shell: bash
        run: flutter test test/product/kristin_conversation_session_test.dart

      - name: Remove helper and refresh exact manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-session-terminal-invariant.yml
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import importlib.util
          from pathlib import Path
          import subprocess
          import sys

          root = Path('.').resolve()
          policy_path = root / 'tool/source_tree_policy.py'
          spec = importlib.util.spec_from_file_location('tmp_source_policy', policy_path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load source-tree policy')
          policy = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = policy
          spec.loader.exec_module(policy)

          raw = subprocess.check_output([
              'git', '-C', str(root), 'ls-files', '--cached', '--others', '--exclude-standard', '-z'
          ])
          values = sorted({
              item.decode('utf-8', errors='surrogateescape').replace('\\', '/')
              for item in raw.split(b'\0') if item
          })
          paths = [
              relative for relative in values
              if relative != 'SOURCE_MANIFEST.sha256'
              and relative != '.github/workflows/tmp-session-terminal-invariant.yml'
              and not policy.is_generated_path(relative)
              and (root / relative).is_file()
          ]

          def canonical(data: bytes) -> bytes:
              if b'\0' in data:
                  return data
              try:
                  data.decode('utf-8')
              except UnicodeDecodeError:
                  return data
              return data.replace(b'\r\n', b'\n')

          rows = []
          for relative in paths:
              digest = hashlib.sha256(canonical((root / relative).read_bytes())).hexdigest()
              rows.append(f'{digest}  {relative}')
          (root / 'SOURCE_MANIFEST.sha256').write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          PY
          git diff --check
          git status --short

      - name: Commit verified invariant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clear deferred interaction on terminal run"
          git push origin HEAD:feat/one-kristin-convergence
