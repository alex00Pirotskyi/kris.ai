name: TEMP P0-001 Candidate Closure Validation

on:
  push:
    branches:
      - 'ci/p0-001-formal-closure-3c236546'

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 3c236546b3907477c3b2358145f23f7bf8615401
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.5'
          check-latest: false
      - name: Run exact P0-001 formal closure command
        id: closure
        shell: bash
        run: |
          set +e
          python3 tool/capture_baseline.py --project . --manifest-mode verify --run-safe-gates --strict
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print closure receipt
        if: always()
        shell: bash
        run: |
          cat release/evidence/baseline/execution.json
          cat release/evidence/baseline/EXECUTION.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p0-001-candidate-closure-${{ github.run_id }}
          path: |
            release/evidence/baseline/execution.json
            release/evidence/baseline/EXECUTION.md
          if-no-files-found: error
          retention-days: 30
      - name: Preserve exact closure verdict
        if: always()
        shell: bash
        run: exit "${{ steps.closure.outputs.exit_code }}"
