name: Qwen Always-On Anchor Audit

on:
  push:
    branches:
      - agent/qwen-phone-control
    paths:
      - .github/workflows/qwen-always-on-anchor-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true
      - name: Audit exact patch anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          w = Path('tool/kris_qwen_worker.py').read_text(encoding='utf-8')
          c = Path('tool/kris_qwen_control.py').read_text(encoding='utf-8')
          t = Path('tool/kris_qwen_control_test.py').read_text(encoding='utf-8')
          p = Path('tool/kris_qwen_worker.py.compat.py').read_text(encoding='utf-8')
          anchors = {
            'worker_version': w.count('SCRIPT_VERSION = "5.2.2"'),
            'fetch_all': w.count('def fetch_all(cfg: Config) -> None:\n    git(cfg.anchor, "fetch", "origin", "+refs/heads/*:refs/remotes/origin/*", "--prune", timeout=1800)\n'),
            'integration_status': w.count('        and w.get("type") == "INTEGRATION"\n        and w.get("status") == "VALIDATING"\n'),
            'promote_status': w.count('        and w.get("status") == "REVIEW"\n        and w.get("type") in {"PRODUCT_FEATURE", "PRODUCT_DEFECT_REPAIR", "PRODUCT_TEST", "CI_REPAIR", "BLOCKER_REMOVAL"}\n'),
            'authority_marker': w.count('\ndef validate_authority_append_safety(cfg: Config, lease: WorkLease) -> None:\n'),
            'housekeeping': w.count('        stranded_woken = wake_stranded_integrations(cfg)\n        if stranded_woken:\n            log.trace("integration-wake", f"woke stranded integration Work Orders: {stranded_woken}")\n            refresh_snapshots(cfg)\n        lease = reserve_work(cfg, worker_identity, work_execution_id)\n'),
            'idle_status_calls': w.count('write_worker_status(cfg, "IDLE"'),
            'no_work_block': w.count('                    except NoEligibleWork as exc:\n'),
            'tail_sleep': w.count('                    if interruptible_sleep(cfg, cfg.loop_sleep):\n                        continue\n'),
            'loop_default': w.count('parser.add_argument("--loop-sleep", type=int, default=int(os.environ.get("KRIS_QWEN_LOOP_SLEEP", "60")))'),
            'compat_version': p.count('TARGET_VERSION = "5.2.3"'),
            'controller_version': c.count('CONTROL_VERSION = "2.1.0"'),
            'controller_fields': c.count('    allow_remote_http: bool\n    stop_timeout: int\n    worker_extra_args: tuple[str, ...]\n'),
            'controller_return': c.count('            allow_remote_http=resolved_allow,\n            stop_timeout=max(30, int(os.environ.get("KRIS_QWEN_STOP_TIMEOUT", "1800"))),\n            worker_extra_args=tuple(shlex.split(os.environ.get("KRIS_QWEN_WORKER_ARGS", ""))),\n        )\n'),
            'controller_init': c.count('        self.token = self._load_or_create_token()\n'),
            'controller_start': c.count('    def start(self) -> dict[str, Any]:\n'),
            'controller_fetch': c.count('    def fetch_latest_and_run(self) -> dict[str, Any]:\n'),
            'controller_fetch_job': c.count('    def _fetch_latest_and_run_job(self) -> None:\n'),
            'controller_status_tail': c.count('            "operation": dict(self.operation), "git": self.git_status(),\n            "logPath": str(self.log_path), "logTail": tail_text(self.log_path),\n        }\n'),
            'test_cfg': t.count('        stop_timeout=30,\n        worker_extra_args=(),\n    )\n'),
          }
          Path('qwen-always-on-anchor-audit.json').write_text(json.dumps(anchors, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(anchors, indent=2, sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qwen-always-on-anchor-audit.json
          git commit -m 'ci(qwen): record always-on patch anchors'
          git push origin HEAD:refs/heads/agent/qwen-phone-control
