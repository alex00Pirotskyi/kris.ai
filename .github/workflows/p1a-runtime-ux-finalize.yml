name: P1A Runtime UX Finalizer

on:
  push:
    branches:
      - sync/p1-p8-main-6237-20260823

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'ci(p1a): execute hardened runtime UX finalizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sync/p1-p8-main-6237-20260823
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: config/p2.python-version
          check-latest: false
      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.toolchains.outputs.flutter }}
          channel: stable
          cache: true
      - name: Apply bounded Owner session corrections
        shell: bash
        run: |
          python tool/p1a_runtime_ux_patch_dart_v2.py
          python tool/p1a_runtime_ux_patch_native_v2.py
      - name: Format governed Dart sources
        shell: bash
        run: |
          dart format \
            lib/product/p1_authority_service_contract_v1.dart \
            lib/product/p2_owner_mode.dart \
            lib/product/p2_owner_workspace.dart \
            lib/product/p2_p1_authority_adapter.dart \
            lib/product/p2_product_runtime_integration.dart \
            lib/product/p2_product_runtime_bootstrap.dart \
            test/product/p2_owner_workspace_test.dart
      - name: Native P1A core regression
        shell: bash
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iauthority_service/native/common \
            authority_service/native/common/authority_core_regression_test.cpp \
            -o /tmp/p1a-authority-core-regression
          /tmp/p1a-authority-core-regression
      - name: P1A Python contracts
        shell: bash
        run: |
          python tool/p1a_activation_contract_test.py
          python tool/p1a_finalizer_contract_test.py
          python tool/p2_shared_p1_authority_contract_test.py --project . --owner-risk-qa
      - name: Flutter qualification
        shell: bash
        run: |
          flutter pub get
          flutter test test/product/p2_owner_workspace_test.dart test/product/p1_authority_service_product_runtime_v1_test.dart
          flutter analyze --fatal-infos --fatal-warnings
      - name: Refresh final source manifest without temporary finalizer files
        shell: bash
        run: |
          git add -A
          python tool/p1a_refresh_source_manifest.py .
          python - <<'PY'
          from pathlib import Path
          p=Path('SOURCE_MANIFEST.sha256')
          excluded={
            '.github/workflows/p1a-runtime-ux-finalize.yml',
            'tool/p1a_runtime_ux_patch_dart.py',
            'tool/p1a_runtime_ux_patch_native.py',
            'tool/p1a_runtime_ux_patch_dart_v2.py',
            'tool/p1a_runtime_ux_patch_native_v2.py',
            'tool/p1a_runtime_ux_trigger.txt',
            'tool/p1a_runtime_ux_trigger_v2.txt',
          }
          rows=[]
          for line in p.read_text(encoding='utf-8').splitlines():
            path=line.split('  ',1)[1] if '  ' in line else ''
            if path not in excluded:
              rows.append(line)
          p.write_text('\n'.join(rows)+'\n',encoding='utf-8',newline='\n')
          PY
          git add -A
      - name: Publish correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(p1a): decouple secure runtime from certification and bound owner approvals'
          git push origin HEAD:sync/p1-p8-main-6237-20260823
