name: Qwen 5.4.1 Finalize

on:
  push:
    branches:
      - agent/qwen-phone-control
    paths:
      - '.github/workflows/qwen-v541-finalize.yml'

permissions:
  contents: write

concurrency:
  group: qwen-v541-finalize-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Capture candidate and promote stable runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "CANDIDATE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cat > tool/kris_qwen_worker_v53.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import json
          import pathlib
          import runpy

          TARGET_VERSION = "5.4.1"
          HERE = pathlib.Path(__file__).resolve().parent
          ENTRY = HERE / "kris_qwen_worker_v541.py"
          ENGINEERING = HERE / "kris_qwen_engineering_env.py"
          CATALOG = HERE.parent / "config/qwen_engineering_skills.v1.json"


          def validate_dependencies() -> None:
              for path, label in (
                  (ENTRY, "deterministic 5.4.1 worker entry"),
                  (ENGINEERING, "5.4 engineering environment"),
                  (CATALOG, "5.4 engineering skill catalog"),
              ):
                  if not path.is_file():
                      raise SystemExit(f"KRIS_QWEN_V53_FORWARD_ERROR: {label} is missing: {path}")
              try:
                  catalog = json.loads(CATALOG.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"KRIS_QWEN_V53_FORWARD_ERROR: engineering skill catalog is invalid: {exc}") from exc
              if catalog.get("schemaVersion") != "1.0.0" or not isinstance(catalog.get("skills"), list) or not catalog["skills"]:
                  raise SystemExit("KRIS_QWEN_V53_FORWARD_ERROR: engineering skill catalog contract is invalid")


          def main() -> None:
              validate_dependencies()
              runpy.run_path(str(ENTRY), run_name="__main__")


          if __name__ == "__main__":
              main()
          PY

          python - <<'PY'
          from pathlib import Path

          def one(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, got {count}')
              return text.replace(old, new, 1)

          # Controller: redact the token value at the source used by controller 2.2.
          p = Path('tool/kris_qwen_control.py')
          text = p.read_text(encoding='utf-8')
          text = one(
              text,
              '        print("\\nPHONE CONTROL TOKEN (keep private):", controller.token, flush=True)\n',
              '        print("\\nPhone control token value omitted from logs; read it from:", controller.token_path, flush=True)\n',
              'controller token print',
          )
          text = text.replace('placeholder="Paste token from server terminal"', 'placeholder="Paste token from controller token file"')
          p.write_text(text, encoding='utf-8', newline='\n')

          # Foreground launcher truth; the base controller is now safe, so the existing 2.2 entry remains canonical.
          p = Path('run_my_server.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('5.3.1', '5.4.1')
          text = one(
              text,
              '    print("The controller will print the control token below.")\n',
              '    print("The control token value is never printed; read it from the controller token file.")\n',
              'foreground token guidance',
          )
          p.write_text(text, encoding='utf-8', newline='\n')

          # Durable installer: add 5.4.1 dependency/test and stable-version expectation.
          p = Path('tool/install_kris_qwen_control_systemd.sh')
          text = p.read_text(encoding='utf-8')
          text = text.replace('engineering worker 5.4 / controller 2.2', 'engineering worker 5.4.1 / controller 2.2')
          text = one(
              text,
              '  "${REPO_DIR}/tool/kris_qwen_worker_v54.py"\n  "${REPO_DIR}/tool/kris_qwen_v53_policy.py"\n',
              '  "${REPO_DIR}/tool/kris_qwen_worker_v54.py"\n  "${REPO_DIR}/tool/kris_qwen_worker_v541.py"\n  "${REPO_DIR}/tool/kris_qwen_v53_policy.py"\n',
              'installer required worker',
          )
          text = one(
              text,
              '  "${REPO_DIR}/tool/kris_qwen_engineering_env_test.py"\n)\n',
              '  "${REPO_DIR}/tool/kris_qwen_engineering_env_test.py"\n  "${REPO_DIR}/tool/kris_qwen_v541_test.py"\n  "${REPO_DIR}/tool/kris_qwen_control_token_redaction_test.py"\n  "${REPO_DIR}/tool/rotate_kris_qwen_control_token.sh"\n)\n',
              'installer required tests',
          )
          text = one(
              text,
              '  "${REPO_DIR}/tool/kris_qwen_worker_v54.py" \\\n  "${REPO_DIR}/tool/kris_qwen_v53_policy.py" \\\n',
              '  "${REPO_DIR}/tool/kris_qwen_worker_v54.py" \\\n  "${REPO_DIR}/tool/kris_qwen_worker_v541.py" \\\n  "${REPO_DIR}/tool/kris_qwen_v53_policy.py" \\\n',
              'installer compile worker',
          )
          text = one(
              text,
              '  "${REPO_DIR}/tool/kris_qwen_v531_test.py" \\\n  "${REPO_DIR}/tool/kris_qwen_engineering_env_test.py"\n',
              '  "${REPO_DIR}/tool/kris_qwen_v531_test.py" \\\n  "${REPO_DIR}/tool/kris_qwen_engineering_env_test.py" \\\n  "${REPO_DIR}/tool/kris_qwen_v541_test.py" \\\n  "${REPO_DIR}/tool/kris_qwen_control_token_redaction_test.py"\n',
              'installer compile tests',
          )
          text = text.replace('"scriptVersion": "5.4.0"', '"scriptVersion": "5.4.1"')
          text = text.replace('Qwen worker 5.4 preflight failed', 'Qwen worker 5.4.1 preflight failed')
          marker = 'if ! as_service_user "${PYTHON_BIN}" "${REPO_DIR}/tool/kris_qwen_engineering_env_test.py" >/dev/null; then\n  echo "Qwen worker 5.4 engineering-environment regression preflight failed." >&2\n  exit 2\nfi\n'
          text = one(
              text,
              marker,
              marker + 'if ! as_service_user "${PYTHON_BIN}" "${REPO_DIR}/tool/kris_qwen_v541_test.py" >/dev/null; then\n  echo "Qwen worker 5.4.1 deployment regression preflight failed." >&2\n  exit 2\nfi\nif ! as_service_user "${PYTHON_BIN}" "${REPO_DIR}/tool/kris_qwen_control_token_redaction_test.py" >/dev/null; then\n  echo "Qwen controller token-redaction regression preflight failed." >&2\n  exit 2\nfi\n',
              'installer runtime tests',
          )
          text = text.replace('forwards to deterministic 5.4.', 'forwards to deterministic 5.4.1.')
          text = one(
              text,
              'ExecStartPre=${PYTHON_BIN} ${REPO_DIR}/tool/kris_qwen_engineering_env_test.py\n',
              'ExecStartPre=${PYTHON_BIN} ${REPO_DIR}/tool/kris_qwen_engineering_env_test.py\nExecStartPre=${PYTHON_BIN} ${REPO_DIR}/tool/kris_qwen_v541_test.py\nExecStartPre=${PYTHON_BIN} ${REPO_DIR}/tool/kris_qwen_control_token_redaction_test.py\n',
              'systemd preflight tests',
          )
          text = text.replace('Worker:       5.4.0', 'Worker:       5.4.1')
          text = text.replace('controller 2.2 / worker 5.4,', 'controller 2.2 / worker 5.4.1,')
          text = text.replace('and the 5.4 engineering environment', 'and the 5.4.1 engineering environment')
          p.write_text(text, encoding='utf-8', newline='\n')

          # Permanent Product Gate owns all incident regressions.
          p = Path('.github/workflows/ci.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('Qwen 5.4 engineering worker regression', 'Qwen 5.4.1 engineering worker regression')
          text = one(
              text,
              '            tool/kris_qwen_worker_v54.py \\\n',
              '            tool/kris_qwen_worker_v54.py \\\n            tool/kris_qwen_worker_v541.py \\\n',
              'ci compile v541',
          )
          text = one(
              text,
              '            tool/kris_qwen_engineering_env_test.py\n',
              '            tool/kris_qwen_engineering_env_test.py \\\n            tool/kris_qwen_v541_test.py \\\n            tool/kris_qwen_control_token_redaction_test.py\n',
              'ci compile incident tests',
          )
          text = one(
              text,
              '          python tool/kris_qwen_engineering_env_test.py\n',
              '          python tool/kris_qwen_engineering_env_test.py\n          python tool/kris_qwen_v541_test.py\n          python tool/kris_qwen_control_token_redaction_test.py\n',
              'ci run incident tests',
          )
          text = text.replace('kris-qwen-v54-version.json', 'kris-qwen-v541-version.json')
          text = text.replace("value.get('scriptVersion') == '5.4.0'", "value.get('scriptVersion') == '5.4.1'")
          text = text.replace("endswith('kris_qwen_worker_v54.py')", "endswith('kris_qwen_worker_v541.py')")
          p.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Validate exact promoted runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_worker_v53_base.py \
            tool/kris_qwen_worker_v531.py \
            tool/kris_qwen_worker_v54.py \
            tool/kris_qwen_worker_v541.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_v53_recovery.py \
            tool/kris_qwen_v53_reconcile.py \
            tool/kris_qwen_engineering_env.py \
            tool/kris_qwen_v531_test.py \
            tool/kris_qwen_engineering_env_test.py \
            tool/kris_qwen_v541_test.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_token_redaction_test.py
          python tool/kris_qwen_v531_test.py
          python tool/kris_qwen_engineering_env_test.py
          python tool/kris_qwen_v541_test.py
          python tool/kris_qwen_control_token_redaction_test.py
          python tool/kris_qwen_control_test.py
          python tool/kris_qwen_control_compat_test.py
          python tool/kris_qwen_worker_v53.py version > "$RUNNER_TEMP/stable-v541.json"
          python - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'stable-v541.json').read_text(encoding='utf-8'))
          assert value.get('scriptVersion') == '5.4.1', value
          assert str(value.get('path', '')).endswith('kris_qwen_worker_v541.py'), value
          PY
          ! grep -Fq 'PHONE CONTROL TOKEN (keep private):' tool/kris_qwen_control.py
          ! grep -Fq 'controller.token, flush=True' tool/kris_qwen_control.py
          bash -n tool/install_kris_qwen_control_systemd.sh
          bash -n tool/rotate_kris_qwen_control_token.sh
          test "$(python tool/kris_qwen_control.py.compat.py --version)" = '2.2.0'
      - name: Remove transports and regenerate source identity
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/kris_qwen_control_secure.py tool/kris_qwen_control_secure_test.py
          rm -f .github/workflows/qwen-v541-hotfix-validation.yml
          rm .github/workflows/qwen-v541-finalize.yml
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp -s "$RUNNER_TEMP/manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --check
      - name: Publish CAS-safe final candidate
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --heads origin refs/heads/agent/qwen-phone-control | awk '{print $1}')"
          test "$remote" = "$CANDIDATE_BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(qwen): repair 5.4.1 production deployment'
          git push origin HEAD:refs/heads/agent/qwen-phone-control
