name: Worker D P3 Readiness

on:
  push:
    branches:
      - agent/d/p3-readiness-fixtures
  pull_request:
    branches:
      - agent/b/test-center-contracts-and-review
      - agent/d/p3-readiness-fixtures
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-d-p3-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-readiness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-15
            platform: macos
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          test "$actual_sha" = "$CANDIDATE_SHA"
          actual_tree=$(git rev-parse 'HEAD^{tree}')
          candidate_tree=$(git rev-parse "${CANDIDATE_SHA}^{tree}")
          test "$actual_tree" = "$candidate_tree"
          {
            echo "candidate_sha=$actual_sha"
            echo "candidate_tree=$actual_tree"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: config/p2.python-version
          check-latest: false
      - name: P3 evidence artifact-binding unit tests
        run: python -m unittest -v tool/worker_d_p3_manifest_binding_test.py
      - name: P3 evidence artifact bindings
        run: python tool/worker_d_p3_manifest_binding.py --check --project .
      - name: Worker D unit tests
        run: python -m unittest -v tool/worker_d_p3_readiness_test.py
      - name: Worker D non-mutating check
        run: python tool/worker_d_p3_readiness.py --check --project .
      - name: Canonical Test Center
        run: python tool/test_center_contracts.py check --project .
      - name: Affected selection is order independent
        shell: bash
        run: |
          A=$(python tool/test_center_contracts.py select-affected --project . release/evidence/P3-001/fixture-specification.json tool/worker_d_p3_readiness.py)
          B=$(python tool/test_center_contracts.py select-affected --project . tool/worker_d_p3_readiness.py release/evidence/P3-001/fixture-specification.json)
          test "$A" = "$B"
      - name: Source manifest owner is deterministic and committed current
        shell: bash
        run: |
          set -euo pipefail
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest-committed"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest-first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/manifest-first" SOURCE_MANIFEST.sha256
          cmp "$RUNNER_TEMP/manifest-committed" "$RUNNER_TEMP/manifest-first"
          git diff --exit-code -- SOURCE_MANIFEST.sha256
      - name: Generated-state and non-mutation check
        shell: bash
        run: |
          set -euo pipefail
          python tool/source_tree_policy.py check --project .
          git diff --check
          test -z "$(git status --porcelain)"
