name: Worker D Base Sync

on:
  push:
    branches:
      - agent/d/p3-readiness-fixtures

permissions:
  contents: write

concurrency:
  group: worker-d-base-sync
  cancel-in-progress: true

jobs:
  synchronize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/d/p3-readiness-fixtures
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: config/p2.python-version
          check-latest: false
      - name: Merge current Worker B base
        shell: bash
        run: |
          git fetch origin agent/b/test-center-contracts-and-review
          set +e
          git merge --no-commit --no-ff origin/agent/b/test-center-contracts-and-review
          MERGE_STATUS=$?
          set -e
          if [ "$MERGE_STATUS" -ne 0 ]; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            test "$CONFLICTS" = "SOURCE_MANIFEST.sha256"
            git checkout --ours SOURCE_MANIFEST.sha256
            git add SOURCE_MANIFEST.sha256
          fi
      - name: Generate manifest for final read-only workflow
        shell: bash
        env:
          FINAL_WORKFLOW_BASE64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path('.github/workflows/worker-d-p3-readiness.yml').write_bytes(
              base64.b64decode(os.environ['FINAL_WORKFLOW_BASE64'], validate=True)
          )
          PY
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/worker-d-merged-manifest-first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/worker-d-merged-manifest-first" SOURCE_MANIFEST.sha256
          git show HEAD:.github/workflows/worker-d-p3-readiness.yml > .github/workflows/worker-d-p3-readiness.yml
      - name: Validate and publish merged non-workflow state
        shell: bash
        run: |
          python tool/worker_d_p3_readiness.py --check --project .
          python -m unittest -v tool/worker_d_p3_readiness_test.py
          python tool/test_center_contracts.py check --project .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'sync(p3): reconcile current Worker B base and manifest'
          git push origin HEAD:agent/d/p3-readiness-fixtures
