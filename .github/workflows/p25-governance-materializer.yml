name: P25 Governance Materializer

on:
  pull_request:
    branches:
      - 'agent/p25-prompt-studio-product-rescue-v4'
    paths:
      - '.github/p25-materializer/trigger.txt'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/p25-governance-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.base.sha }}
      TARGET_BRANCH: agent/p25-prompt-studio-product-rescue-v4
    steps:
      - name: Check out exact P25 governance base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Materialize and verify P25 governance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "${remote_head}" = "${EXPECTED_HEAD}"
          git fetch origin main
          cat .github/p25-materializer/part*.txt > "${RUNNER_TEMP}/p25-materializer.b64"
          python - <<'PY'
          import base64
          import pathlib
          import zlib
          payload = pathlib.Path(__import__('os').environ['RUNNER_TEMP'], 'p25-materializer.b64').read_text(encoding='utf-8')
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(source, '<p25-governance-materializer>', 'exec'), {'__name__': '__main__'})
          PY
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          registry_path = Path('config/test_center_registry.v1.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          if not any(item.get('moduleId') == 'tm.p25.prompt-studio' for item in registry['testModules']):
              registry['testModules'].append({
                  'moduleId': 'tm.p25.prompt-studio',
                  'displayName': 'P25 Prompt Studio Product Rescue',
                  'owner': 'P25 product and Test Center lane',
                  'purpose': 'Verify Prompt Studio rescue contracts, deterministic behavior, owner-machine benchmarks, and packaged journeys without promoting evidence above its assurance class.',
                  'assuranceClasses': ['source_contract', 'behavioral', 'platform'],
              })
          registry_path.write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          proof_path = Path('release/evidence/TEST_CENTER/P8-001/contracts/assurance-proof-contract.v1.json')
          proof = json.loads(proof_path.read_text(encoding='utf-8'))
          existing = {item['testId'] for item in proof['lineageBindings']}
          for test_id in ('tc.p25.roadmap-contract', 'tc.p25.test-station-contract'):
              if test_id not in existing:
                  proof['lineageBindings'].append({
                      'testId': test_id,
                      'lineageId': 'p25.prompt-studio-product-rescue',
                  })
          proof_path.write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          for relative in (
              'docs/roadmap/ASSURANCE_MODEL.md',
              'docs/roadmap/BENCHMARKS.md',
              'docs/roadmap/MASTER.md',
          ):
              path = Path(relative)
              path.write_text(
                  path.read_text(encoding='utf-8').rstrip('\n') + '\n',
                  encoding='utf-8',
                  newline='\n',
              )

          p25_markdown = [
              Path('docs/roadmap/P25_PROMPT_STUDIO_PRODUCT_RESCUE.md'),
              Path('docs/roadmap/decisions/ADR-P25-001-prompt-studio-product-rescue.md'),
              Path('docs/testing/TEST_CENTER_P25_PROMPT_STUDIO.md'),
              *sorted(Path('tasks/planned').glob('P25-*.md')),
          ]
          for path in p25_markdown:
              normalized = '\n'.join(
                  line.rstrip(' \t')
                  for line in path.read_text(encoding='utf-8').splitlines()
              ).rstrip('\n') + '\n'
              path.write_text(
                  normalized,
                  encoding='utf-8',
                  newline='\n',
              )

          master_path = Path('docs/roadmap/MASTER.md')
          roadmap_path = Path('docs/roadmap/roadmap.yaml')
          roadmap = json.loads(roadmap_path.read_text(encoding='utf-8'))
          roadmap['authority']['masterSha256'] = hashlib.sha256(
              master_path.read_bytes()
          ).hexdigest()
          roadmap_path.write_text(
              json.dumps(roadmap, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python tool/roadmap_control.py render --project .
          rm -rf .github/p25-materializer
          rm .github/workflows/p25-governance-materializer.yml
          python -m py_compile tool/p25_prompt_studio_roadmap_test.py tool/p25_prompt_studio_test_station.py
          python tool/p25_prompt_studio_roadmap_test.py --project .
          python tool/p25_prompt_studio_test_station.py --project . --profile contract --check
          python tool/roadmap_control.py validate --project . --strict
          python tool/roadmap_control.py render --project . --check
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python -m unittest -v tool/test_center_contracts_test.py
          ruby tool/workflow_integrity_test.rb .
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/p25-prompt-studio.yml',
              'SOURCE_MANIFEST.sha256',
              'config/test_center_assurance_hierarchy.v1.json',
              'config/test_center_registry.v1.json',
              'docs/roadmap/ASSURANCE_MODEL.md',
              'docs/roadmap/BENCHMARKS.md',
              'docs/roadmap/DECISIONS.md',
              'docs/roadmap/HANDOFF.md',
              'docs/roadmap/MASTER.md',
              'docs/roadmap/P25_PROMPT_STUDIO_PRODUCT_RESCUE.md',
              'docs/roadmap/STATUS.md',
              'docs/roadmap/decisions/ADR-P25-001-prompt-studio-product-rescue.md',
              'docs/roadmap/p25/benchmark_corpus.v1.json',
              'docs/roadmap/p25/manifest.v1.json',
              'docs/roadmap/p25/performance_budget.v1.json',
              'docs/roadmap/p25/prompt_studio_test_station.v1.json',
              'docs/roadmap/roadmap.yaml',
              'docs/testing/TEST_CENTER_P25_PROMPT_STUDIO.md',
              'release/evidence/TEST_CENTER/P8-001/contracts/assurance-proof-contract.v1.json',
              'tasks/planned/P25-001.md',
              'tasks/planned/P25-002.md',
              'tasks/planned/P25-003.md',
              'tasks/planned/P25-004.md',
              'tasks/planned/P25-005.md',
              'tasks/planned/P25-006.md',
              'tasks/planned/P25-007.md',
              'tasks/planned/P25-008.md',
              'tasks/planned/P25-009.md',
              'tasks/planned/P25-010.md',
              'tasks/planned/P25-011.md',
              'tool/p25_prompt_studio_roadmap_test.py',
              'tool/p25_prompt_studio_test_station.py',
          }
          tracked = subprocess.check_output(
              ['git', 'diff', 'origin/main', '--name-only'], text=True
          ).splitlines()
          untracked = subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'], text=True
          ).splitlines()
          actual = set(tracked + untracked)
          if actual != expected:
              raise SystemExit(f'P25 governance scope mismatch actual={sorted(actual)} expected={sorted(expected)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(p25): govern Prompt Studio product rescue'
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "${remote_head}" = "${EXPECTED_HEAD}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
