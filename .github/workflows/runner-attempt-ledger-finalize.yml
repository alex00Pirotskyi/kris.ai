name: runner-attempt-ledger-finalize

on:
  push:
    branches:
      - hotfix/runner-attempt-ledger-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner-attempt-ledger-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hotfix/runner-attempt-ledger-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize current main without publishing
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Unlock authoritative finalizer payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('migrations/workflow/007_runner_attempt_ledger.sql')
          marker = '__RUNNER_ATTEMPT_LEDGER_FINALIZER_GUARD__\n'
          text = path.read_text(encoding='utf-8')
          if text.count(marker) != 1 or not text.startswith(marker):
              raise SystemExit('authoritative runner finalizer guard missing or duplicated')
          path.write_text(text[len(marker):], encoding='utf-8', newline='\n')
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Apply coordinated runner hotfix
        run: python tool/runner_attempt_ledger_finalize.py

      - name: Generate reviewed workflow migrations
        run: python tool/generate_workflow_migrations.py

      - name: Format hotfix sources
        run: >-
          dart format
          lib/product/planning_runtime.dart
          lib/product/durable_workflow.dart
          lib/product/runner_attempt_ledger.dart
          test/product/runner_attempt_ledger_test.dart
          test/product/durable_workflow_kernel_test.dart

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Check generated migrations
        run: python tool/generate_workflow_migrations.py --check

      - name: Check durable workflow kernel
        run: python tool/workflow_kernel_test.py --project .

      - name: Check scoped Dart formatting
        run: python tool/dart_format_scope.py --check

      - name: Analyze hotfix
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos

      - name: Run runner and durability regressions
        run: >-
          flutter test --no-pub --concurrency=1 --reporter expanded
          test/product/runner_attempt_ledger_test.dart
          test/product/durable_workflow_kernel_test.dart
          test/product/execution_reliability_test.dart

      - name: Validate qualified source diff
        run: git diff --check

      - name: Remove one-shot finalizer and staging
        run: |
          git rm tool/runner_attempt_ledger_finalize.py
          git rm .github/workflows/runner-attempt-ledger-finalize.yml
          if [ -d .repo-hotfix/runner-attempt-ledger ]; then
            git rm -r .repo-hotfix/runner-attempt-ledger
          fi
          test ! -e tool/runner_attempt_ledger_finalize.py
          test ! -e .github/workflows/runner-attempt-ledger-finalize.yml
          test ! -e .repo-hotfix/runner-attempt-ledger

      - name: Refresh canonical source manifest
        run: python tool/p2_refresh_source_manifest.py .

      - name: Validate post-cleanup repository state
        run: |
          python tool/source_tree_policy_test.py
          python tool/generated_state_guard_test.py
          python tool/generated_state_guard.py audit --project . --strict
          git diff --check

      - name: Commit qualified hotfix
        run: |
          git add -A
          git commit -m "fix(runner): prune repeated action branches"
          git push origin HEAD:hotfix/runner-attempt-ledger-v2
