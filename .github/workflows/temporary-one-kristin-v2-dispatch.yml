name: temporary-one-kristin-v2-protected-dispatch
on:
  push:
    branches:
      - automation/one-kristin-v2-protected-dispatch-20260901
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Verify exact candidate and dispatch protected CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_BRANCH: feat/one-kristin-convergence-qualified-v2
          EXPECTED_SHA: 535e8351b6ac213623ca1209b255ac63a08694b7
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_BRANCH" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$actual" = "$EXPECTED_SHA"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$FINAL_BRANCH\"}"
      - name: Self-remove dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-one-kristin-v2-dispatch.yml
          git commit -m 'ci: remove temporary One-Kristin v2 dispatcher'
          git push origin HEAD:refs/heads/automation/one-kristin-v2-protected-dispatch-20260901
