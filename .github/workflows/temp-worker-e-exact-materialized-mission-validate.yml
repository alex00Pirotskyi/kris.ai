name: TEMP Worker E Exact Materialized Mission Validate

on:
  push:
    branches:
      - agent/e/mission-system-live-validate-1a04c186
    paths:
      - '.github/workflows/temp-worker-e-exact-materialized-mission-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Assert bounded validation carrier and check out exact source
        shell: bash
        env:
          SOURCE_SHA: e4ca61266383a530c477e34ec9bc7b72188455fa
          SOURCE_TREE: b5be4ca6365518928aa66bec2e84bd172b17bc9e
          CARRIER_PATH: .github/workflows/temp-worker-e-exact-materialized-mission-validate.yml
        run: |
          test "$(git diff --name-only HEAD^ HEAD)" = "$CARRIER_PATH"
          git cat-file -e "$SOURCE_SHA^{commit}"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
      - name: Validate mission execution model
        run: python tool/mission_control.py --project . validate
      - name: Print mission status
        run: python tool/mission_control.py --project . status
      - name: Verify deterministic generated views
        run: python tool/mission_control.py --project . bootstrap --check
      - name: Verify Worker E resume contract
        run: python tool/mission_control.py --project . resume --mission MISSION-010 --worker E
      - name: Verify canonical source manifest twice
        shell: bash
        run: |
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.before"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.before" SOURCE_MANIFEST.sha256
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.after-first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.after-first" SOURCE_MANIFEST.sha256
      - name: Verify repository whitespace and non-mutation
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1)"
