name: P3 Phase Completion Materializer
on:
  pull_request:
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p3-phase-completion
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - name: Build exact P3 phase candidate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python .p3-phase-completion/materialize.py
          dart format lib/product/browser/*.dart test/product/browser/*.dart
          npm ci --prefix automation_host --ignore-scripts --no-audit --no-fund
          npm test --prefix automation_host
          flutter analyze --no-pub --fatal-warnings --fatal-infos
          flutter test --no-pub test/product/browser --concurrency=1 --reporter expanded
          rm -f .github/workflows/p3-phase-completion-materialize.yml
          rm -rf .p3-phase-completion
          python tool/p2_refresh_source_manifest.py .
          flutter test --no-pub test/product/source_contract_test.dart --reporter expanded
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(p3): close browser runtime product phase'
          git push origin HEAD:agent/p3-phase-completion
