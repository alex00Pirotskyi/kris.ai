name: GS003 P2 Promotion State Finalizer

on:
  push:
    branches:
      - agent/gpt-gold/gs-003-p2-promotion-state
    paths:
      - .github/workflows/gs003-p2-promotion-finalizer.yml
      - tool/gs003_p2_promotion_finalize.py

permissions:
  contents: write

concurrency:
  group: gs003-p2-promotion-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: gs003-p2-promotion-finalizer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gpt-gold/gs-003-p2-promotion-state
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Materialize and validate the current promotion-state gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'agent/gpt-gold/gs-003-p2-promotion-state'

          python tool/gs003_p2_promotion_finalize.py .
          python -m py_compile \
            tool/v71r12_exact_source_gate.py \
            tool/p2_promotion_state_test.py
          python tool/p2_evidence_state.py --project .
          python tool/p2_evidence_state_test.py
          python tool/p2_promotion_state_test.py

          python tool/p1a_refresh_source_manifest.py .
          rm \
            .github/workflows/gs003-p2-promotion-finalizer.yml \
            tool/gs003_p2_promotion_finalize.py
          python tool/p1a_refresh_source_manifest.py .

          python tool/p2_evidence_state.py --project .
          python tool/p2_evidence_state_test.py
          python tool/p2_promotion_state_test.py
          ruby tool/workflow_integrity_test.rb .
          git diff --check

          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 4
          test "${paths[0]}" = '.github/workflows/gs003-p2-promotion-finalizer.yml'
          test "${paths[1]}" = 'SOURCE_MANIFEST.sha256'
          test "${paths[2]}" = 'tool/gs003_p2_promotion_finalize.py'
          test "${paths[3]}" = 'tool/v71r12_exact_source_gate.py'

          git config user.name 'KRIS.AI Gold Standard Finalizer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(p2): validate accepted decisions without phase promotion'
          git push origin HEAD:refs/heads/agent/gpt-gold/gs-003-p2-promotion-state
