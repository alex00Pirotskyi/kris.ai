name: Qwen 5.4.1 Hotfix Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/qwen-v541-hotfix-validation.yml'
      - 'tool/kris_qwen_worker_v541.py'
      - 'tool/kris_qwen_v541_test.py'
      - 'tool/kris_qwen_control_secure.py'
      - 'tool/kris_qwen_control_secure_test.py'
      - 'tool/kris_qwen_worker_v54.py'
      - 'tool/kris_qwen_engineering_env.py'
      - 'config/qwen_engineering_skills.v1.json'

permissions:
  contents: read

jobs:
  validate:
    name: qwen-v541-hotfix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Compile 5.4.1 production hotfix stack
        run: |
          python -m py_compile \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker_v53_base.py \
            tool/kris_qwen_worker_v531.py \
            tool/kris_qwen_worker_v54.py \
            tool/kris_qwen_worker_v541.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_v53_recovery.py \
            tool/kris_qwen_v53_reconcile.py \
            tool/kris_qwen_engineering_env.py \
            tool/kris_qwen_v531_test.py \
            tool/kris_qwen_engineering_env_test.py \
            tool/kris_qwen_v541_test.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_secure.py \
            tool/kris_qwen_control_secure_test.py
      - name: Preserve 5.3.1 and 5.4 regressions
        run: |
          python tool/kris_qwen_v531_test.py
          python tool/kris_qwen_engineering_env_test.py
      - name: Reproduce and close catalog-root incident
        run: python tool/kris_qwen_v541_test.py
      - name: Verify controller token redaction
        run: python tool/kris_qwen_control_secure_test.py
      - name: Execute direct 5.4.1 version entry
        run: |
          python tool/kris_qwen_worker_v541.py version > "$RUNNER_TEMP/v541.json"
          python - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'v541.json').read_text(encoding='utf-8'))
          assert value.get('scriptVersion') == '5.4.1', value
          assert str(value.get('path', '')).endswith('kris_qwen_worker_v541.py'), value
          PY
