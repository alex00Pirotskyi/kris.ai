name: Qwen v531 Clean Finalize

on:
  push:
    branches:
      - agent/qwen-phone-control
    paths:
      - .github/workflows/qwen-v531-clean-finalize.yml

permissions:
  contents: write

concurrency:
  group: qwen-v531-clean-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Capture exact branch base
        shell: bash
        run: echo "CANDIDATE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Remove rollout audit transport only
        shell: bash
        run: |
          set -euo pipefail
          test -f qwen-always-on-anchor-audit.json
          test "$(git hash-object qwen-always-on-anchor-audit.json)" = '3982efb797d237865abb2da8ecc3d875704bbefd'
          rm qwen-always-on-anchor-audit.json
          rm .github/workflows/qwen-v531-clean-finalize.yml
      - name: Revalidate Qwen and regenerate source identity
        shell: bash
        run: |
          set -euo pipefail
          python tool/kris_qwen_v531_test.py
          python tool/kris_qwen_worker_v53.py version > "$RUNNER_TEMP/v531.json"
          python - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'v531.json').read_text(encoding='utf-8'))
          assert value.get('scriptVersion') == '5.3.1', value
          PY
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp -s "$RUNNER_TEMP/manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          printf 'CLEAN_FINALIZE_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 3
          test "${paths[0]}" = '.github/workflows/qwen-v531-clean-finalize.yml'
          test "${paths[1]}" = 'SOURCE_MANIFEST.sha256'
          test "${paths[2]}" = 'qwen-always-on-anchor-audit.json'
      - name: Publish only against unchanged branch
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --heads origin refs/heads/agent/qwen-phone-control | awk '{print $1}')"
          test "$remote" = "$CANDIDATE_BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/qwen-v531-clean-finalize.yml \
            SOURCE_MANIFEST.sha256 \
            qwen-always-on-anchor-audit.json
          git diff --cached --check
          git commit -m 'chore(qwen): remove rollout audit artifact and refresh manifest'
          git push origin HEAD:refs/heads/agent/qwen-phone-control
