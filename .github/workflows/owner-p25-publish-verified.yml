name: Owner P25 Publish Verified Candidate

on:
  push:
    branches:
      - automation/owner-recovery
    paths:
      - .github/workflows/owner-p25-publish-verified.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: owner-p25-publish-verified
  cancel-in-progress: false

env:
  HEALTHY_MAIN: 278aeccfa013411bc7cf23b4a34199718327f4b2
  ARTIFACT_ID: '9445979205'
  ARTIFACT_SHA256: 3d04c9f855a9e2048fe73cb4b7dcc0275d8c923fd4e72a79d2c548e3811dfeb3
  TARGET_BRANCH: agent/owner-p25-current-main

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact healthy protected-main base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 278aeccfa013411bc7cf23b4a34199718327f4b2
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable publication preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEALTHY_MAIN}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${HEALTHY_MAIN}"
          test -z "$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}")"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Download exact already-validated P25 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "${RUNNER_TEMP}/p25-verified.zip"
          actual="$(sha256sum "${RUNNER_TEMP}/p25-verified.zip" | cut -d' ' -f1)"
          test "${actual}" = "${ARTIFACT_SHA256}"
          mkdir -p "${RUNNER_TEMP}/verified-tree"
          unzip -q "${RUNNER_TEMP}/p25-verified.zip" -d "${RUNNER_TEMP}/verified-tree"
          cd "${RUNNER_TEMP}"
          sha256sum -c verified-tree/RECOVERY_SHA256SUMS.txt
          grep -Fx "base=${HEALTHY_MAIN}" verified-tree/RECOVERY_METADATA.txt
          grep -Fx 'salvage=64286a2110fd9d852dbbeb7653e5896866b0c4ac' verified-tree/RECOVERY_METADATA.txt
          test "$(find verified-tree -type f ! -name 'RECOVERY_METADATA.txt' ! -name 'RECOVERY_SHA256SUMS.txt' | wc -l)" -eq 40

      - name: Materialize exact candidate bytes onto current main
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "${TARGET_BRANCH}"
          while IFS= read -r -d '' source; do
            path="${source#${RUNNER_TEMP}/verified-tree/}"
            case "${path}" in
              RECOVERY_METADATA.txt|RECOVERY_SHA256SUMS.txt) continue ;;
            esac
            mkdir -p "$(dirname "${path}")"
            cp -p "${source}" "${path}"
            git add -- "${path}"
          done < <(find "${RUNNER_TEMP}/verified-tree" -type f -print0 | sort -z)

          test "$(git diff --cached --name-only | wc -l)" -eq 40
          test ! -e .p25
          test ! -e .p25-redesign
          test ! -e .p25-adaptive
          test ! -e .github/workflows/p25-001-direct-trigger.yml
          test ! -e .github/workflows/p25-001-materialize.yml
          grep -F 'contents: read' .github/workflows/p25-prompt-studio.yml
          git diff --cached --check

      - name: Reconfirm canonical manifest and P25 control truth
        shell: bash
        run: |
          set -euo pipefail
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/published-manifest.before"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/published-manifest.before" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          python tool/p25_prompt_studio_roadmap_test.py --project .
          python tool/p25_prompt_studio_test_station.py --project . --profile contract --check >/dev/null
          git diff --cached --check
          test -z "$(git diff --name-only)"

      - name: Publish one-parent current-main P25 commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${HEALTHY_MAIN}"
          test -z "$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}")"
          git config user.name 'alex00Pirotskyi'
          git config user.email '177022051+alex00Pirotskyi@users.noreply.github.com'
          git commit -m 'feat(p25): land fast interactive Prompt Studio foundation'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${HEALTHY_MAIN}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          git fetch origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${candidate}"
          echo "P25_CURRENT_MAIN_CANDIDATE=${candidate}"
