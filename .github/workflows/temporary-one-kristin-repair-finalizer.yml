name: temporary-one-kristin-repair-finalizer

on:
  push:
    branches:
      - automation/one-kristin-product-gates-dispatch-20260902
    paths:
      - .github/workflows/temporary-one-kristin-repair-finalizer.yml

permissions:
  actions: write
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BASE_SHA: bbb8cbdb52844f868abf9916c9bb77446c2809cf
      PRIOR_CANDIDATE_SHA: 7a0bcfdc2f904036503f11a4f84f2dc588be27b0
      RECONCILIATION_REF: feat/one-kristin-live-continuation-reconciliation
    steps:
      - name: Check out exact live base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0

      - name: Reconstruct qualified candidate and repair approval state synchronization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse "$PRIOR_CANDIDATE_SHA^")" = "$BASE_SHA"
          git cherry-pick --no-commit "$PRIOR_CANDIDATE_SHA"
          python - <<'PY'
          from pathlib import Path

          studio_path = Path('lib/product/chat_control_plane_studio.dart')
          studio = studio_path.read_text(encoding='utf-8')
          assert 'if (existing != null) {' in studio, 'prior null-run planning-state repair missing'
          old_refresh = '      if (runActive) unawaited(_refreshCurrentRun());'
          new_refresh = '''      if (currentRun != null && !runTerminal) {
            unawaited(_refreshCurrentRun());
          }'''
          assert old_refresh in studio, 'expected active-only refresh guard missing'
          assert new_refresh not in studio, 'nonterminal refresh repair already present unexpectedly'
          studio_path.write_text(studio.replace(old_refresh, new_refresh, 1), encoding='utf-8')

          actions_path = Path('lib/product/chat_control_plane_studio_actions.dart')
          actions = actions_path.read_text(encoding='utf-8')
          old_transition = '''      currentRun = run;
      unawaited(runtime.execute(run.id));
      await Future<void>.delayed(const Duration(milliseconds: 180));
      return await runtime.getRun(run.id) ?? run;'''
          new_transition = '''      currentRun = run;
      unawaited(runtime.execute(run.id));
      return await _awaitRunStartTransition(run);'''
          assert old_transition in actions, 'expected fixed approval transition sample missing'
          assert '_awaitRunStartTransition' not in actions, 'approval synchronization helper already present unexpectedly'
          actions = actions.replace(old_transition, new_transition, 1)
          helper = '''

  Future<RunRecord> _awaitRunStartTransition(RunRecord run) async {
    var latest = run;
    for (var attempt = 0; attempt < 60; attempt++) {
      final refreshed = await runtime.getRun(run.id);
      if (refreshed != null) latest = refreshed;
      if (latest.state != RunState.awaitingApproval) return latest;
      await Future<void>.delayed(const Duration(milliseconds: 50));
    }
    return latest;
  }
'''
          marker = '\n  Future<void> _startPrepared() async {'
          assert marker in actions, 'start-prepared marker missing'
          actions = actions.replace(marker, helper + marker, 1)
          actions_path.write_text(actions, encoding='utf-8')

          test_path = Path('test/product/live_continuation_reconciliation_contract_test.dart')
          test_text = test_path.read_text(encoding='utf-8')
          assert 'null currentRun does not erase planning state before a run exists' in test_text, 'prior dogfood regression contract missing'
          test_name = 'Chat approval follows authoritative run state instead of a fixed delay'
          assert test_name not in test_text, 'approval synchronization regression already present unexpectedly'
          addition = '''

  test('Chat approval follows authoritative run state instead of a fixed delay', () {
    final studio =
        File('lib/product/chat_control_plane_studio.dart').readAsStringSync();
    final actions = File('lib/product/chat_control_plane_studio_actions.dart')
        .readAsStringSync();
    expect(actions, isNot(contains('Duration(milliseconds: 180)')));
    expect(actions, contains('_awaitRunStartTransition'));
    expect(actions, contains('runtime.getRun(run.id)'));
    expect(actions, contains('latest.state != RunState.awaitingApproval'));
    expect(
      studio,
      contains('if (currentRun != null && !runTerminal)'),
      reason: 'Awaiting-approval sessions must keep refreshing until durable run state advances.',
    );
  });'''
          marker = '\n}'
          head, sep, tail = test_text.rpartition(marker)
          assert sep, 'test main closing brace missing'
          test_path.write_text(head + addition + marker + tail, encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json

      - name: Resolve Dart package language version
        shell: bash
        run: flutter pub get

      - name: Canonicalize repair with repository formatter and refresh source manifest
        shell: bash
        run: |
          set -euo pipefail
          python tool/dart_format_scope.py --write
          python tool/dart_format_scope.py --check
          python tool/p2_refresh_source_manifest.py .
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only "$BASE_SHA" | wc -l | tr -d ' ')" = "33"
          if git diff --cached --name-only "$BASE_SHA" | grep -q '^\.github/workflows/'; then
            echo 'workflow history leaked into product candidate' >&2
            exit 1
          fi
          grep -Fq 'if (existing != null)' lib/product/chat_control_plane_studio.dart
          grep -Fq 'if (currentRun != null && !runTerminal)' lib/product/chat_control_plane_studio.dart
          grep -Fq '_awaitRunStartTransition' lib/product/chat_control_plane_studio_actions.dart
          if grep -Fq 'Duration(milliseconds: 180)' lib/product/chat_control_plane_studio_actions.dart; then
            echo 'fixed approval transition sample remains in product candidate' >&2
            exit 1
          fi
          grep -Fq 'null currentRun does not erase planning state before a run exists' test/product/live_continuation_reconciliation_contract_test.dart
          grep -Fq 'Chat approval follows authoritative run state instead of a fixed delay' test/product/live_continuation_reconciliation_contract_test.dart

      - name: Seal one clean product commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git commit -m 'feat(kristin): reconcile durable steering continuations'
          final_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          test "$parent_sha" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = "1"
          test "$(git diff --name-only "$BASE_SHA"..HEAD | wc -l | tr -d ' ')" = "33"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "parent_sha=$parent_sha" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "FINAL_SHA=$final_sha"
          echo "PARENT_SHA=$parent_sha"
          echo "TREE_SHA=$(git rev-parse HEAD^{tree})"

      - name: Install Linux desktop build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libstdc++-12-dev

      - name: Generate native runner
        shell: bash
        run: flutter create --project-name kristin_local_agent --org local.kristin --platforms=linux .

      - name: Install exact dependency closure
        shell: bash
        run: |
          flutter pub get
          python tool/v71r12_bootstrap_hosted_python.py --project .
          npm ci --prefix automation_host --no-audit --no-fund

      - name: Validate formatting, analyzer, and focused runtime regression
        shell: bash
        run: |
          python tool/dart_format_scope.py --check
          flutter analyze --no-pub --fatal-warnings --fatal-infos
          flutter test --no-pub --concurrency=1 --reporter expanded \
            test/product/live_continuation_reconciliation_contract_test.dart \
            test/product/kristin_conversation_session_test.dart \
            test/product/hf_runner_chat_convergence_test.dart

      - name: Run full Flutter suite
        shell: bash
        run: flutter test --no-pub --concurrency=1 --reporter expanded

      - name: Validate generated-state and governance gates
        shell: bash
        run: |
          python tool/source_tree_policy_test.py
          python tool/generated_state_guard_test.py
          python tool/p0_010_generated_state_test.py --project .
          python tool/generated_state_guard.py audit --project . --strict
          python tool/repository_governance_test.py --json-output release/evidence/P0-006/local_governance_results.json
          python -m unittest -v tool/github_governance_client_test.py
          git diff --check "$BASE_SHA"..HEAD

      - name: Move reconciliation ref only after qualification
        shell: bash
        run: |
          set -euo pipefail
          final_sha="${{ steps.candidate.outputs.final_sha }}"
          remote_sha="$(git ls-remote origin "refs/heads/$RECONCILIATION_REF" | cut -f1)"
          test "$remote_sha" = "$PRIOR_CANDIDATE_SHA"
          git push --force-with-lease="refs/heads/$RECONCILIATION_REF:$PRIOR_CANDIDATE_SHA" \
            origin "$final_sha:refs/heads/$RECONCILIATION_REF"

      - name: Dispatch protected product gates on repaired SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$RECONCILIATION_REF\"}"
          echo "Dispatched product-gates for ${{ steps.candidate.outputs.final_sha }}"
