name: Owner P211 bounded finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/owner-p25-current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_PARENT: 67fbf75bb91924a8ce910de01d191c39076ee8ce
      EXPECTED_MAIN: 278aeccfa013411bc7cf23b4a34199718327f4b2
      EXPECTED_BRANCH: agent/owner-p25-current-main
      PATCH_PATH: .repo-rehab-p211-finalize.py
      FINALIZER_PATH: .github/workflows/owner-p211-finalize.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact bounded transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git diff --name-only HEAD^ HEAD)" = "${FINALIZER_PATH}"
          test -f "${PATCH_PATH}"
          test -f "${FINALIZER_PATH}"
          git fetch --no-tags origin main "${EXPECTED_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "$(git rev-parse HEAD)"
          test -z "$(git status --short)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.1.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Apply repair and remove transport before generation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "${PATCH_PATH}"
          python "${PATCH_PATH}"
          git rm -f "${PATCH_PATH}" "${FINALIZER_PATH}"
          python tool/benchmark_runner.py run \
            --project . \
            --output evals/results/p0_009_baseline.json \
            --markdown evals/results/P0_009_BASELINE.md \
            --mode portable
          python tool/p2_refresh_source_manifest.py
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python tool/v71r12_bootstrap_hosted_python.py --project .
          flutter pub get
          npm ci --prefix automation_host --ignore-scripts=false --no-audit --no-fund
      - name: Validate source and roadmap contracts
        shell: bash
        run: |
          set -euo pipefail
          python tool/p2_source_inventory_test.py --project .
          python tool/p0_009_benchmark_test.py --project .
          python tool/p0_008_roadmap_test.py --project .
          python tool/roadmap_control.py validate --project . --strict
          python tool/p25_prompt_studio_roadmap_test.py --project .
          python tool/p25_prompt_studio_test_station.py --project . --profile contract
      - name: Validate Dart format and analysis
        shell: bash
        run: |
          set -euo pipefail
          python tool/dart_format_scope.py --check
          flutter analyze --no-pub --fatal-warnings --fatal-infos
      - name: Validate Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 --reporter expanded
      - name: Validate automation host tests
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix automation_host
      - name: Validate release source contract
        shell: bash
        run: |
          set -euo pipefail
          python tool/validate_release.py --skip-tests
      - name: Validate exact candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only --diff-filter=U)"
          mapfile -t paths < <(git status --short | sed -E 's/^...//' | sort)
          expected=(
            .github/workflows/owner-p211-finalize.yml
            .repo-rehab-p211-finalize.py
            SOURCE_MANIFEST.sha256
            evals/results/P0_009_BASELINE.md
            evals/results/p0_009_baseline.json
            lib/product/prompt_planning.dart
            test/product/source_contract_test.dart
          )
          test "${paths[*]}" = "${expected[*]}"
      - name: Publish exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "${EXPECTED_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "$(git rev-parse HEAD)"
          git config user.name 'alex00Pirotskyi'
          git config user.email '177022051+alex00Pirotskyi@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p25): preserve execution retries and align exact-head tests'
          candidate="$(git rev-parse HEAD)"
          git push origin "HEAD:${EXPECTED_BRANCH}"
          echo "Published candidate ${candidate}"
