name: Worker G P6 release inventory repair

on:
  push:
    branches:
      - agent/g/mission-006-model-routing
    paths:
      - '.github/workflows/worker-g-p6-release-inventory-repair.yml'

permissions:
  contents: write

concurrency:
  group: worker-g-p6-release-inventory-repair
  cancel-in-progress: false

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WORKER_G_BRANCH: agent/g/mission-006-model-routing
      WORKER_B_BRANCH: agent/b/test-center-contracts-and-review
      EXPECTED_G_PARENT: 88405ba55ca7336d05797ec801f579704436f94c
      EXPECTED_B_HEAD: 800643bb5898a80ee3843f83f7657411183a9e6a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/g/mission-006-model-routing
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Require exact uncontended candidate and authority heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_G_PARENT}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin "${WORKER_G_BRANCH}" "${WORKER_B_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_G_BRANCH})" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_B_BRANCH})" = "${EXPECTED_B_HEAD}"
      - name: Repair the release validator P6 Dart inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tool/validate_release.py')
          text = path.read_text(encoding='utf-8')
          entries = (
              "                          'lib/product/model/model.dart',\n"
              "                          'lib/product/model/model_registry.dart',\n"
          )
          needles = [line.strip() for line in entries.splitlines() if line.strip()]
          present = [needle in text for needle in needles]
          if all(present):
              raise SystemExit('P6 model files already exist in validate_release inventory')
          if any(present):
              raise SystemExit('partial P6 validate_release inventory detected')
          anchor = (
              "                          'lib/product/mcp.dart',\n"
              "                          'lib/product/models_research.dart',\n"
          )
          replacement = (
              "                          'lib/product/mcp.dart',\n"
              + entries
              + "                          'lib/product/models_research.dart',\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit('validate_release inventory anchor is not unique')
          path.write_text(
              text.replace(anchor, replacement, 1),
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Add a durable Worker G release-inventory regression
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tool/worker_g_p6_release_inventory_test.py
          cat > tool/worker_g_p6_release_inventory_test.py <<'PY'
          #!/usr/bin/env python3
          """P6-001 regression coverage for the canonical release Dart inventory."""
          from __future__ import annotations

          import sys
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          TOOL = ROOT / "tool"
          if str(TOOL) not in sys.path:
              sys.path.insert(0, str(TOOL))

          import validate_release as V  # noqa: E402

          P6_MODEL_DART = {
              "lib/product/model/model.dart",
              "lib/product/model/model_registry.dart",
          }


          class P6ReleaseInventoryTest(unittest.TestCase):
              def test_p6_model_sources_are_governed(self) -> None:
                  self.assertTrue(P6_MODEL_DART.issubset(V.EXPECTED_DART_FILES))

              def test_release_inventory_accepts_every_active_dart_source(self) -> None:
                  actual = {
                      path.relative_to(V.ROOT).as_posix()
                      for path in V.package_dart_files()
                  }
                  self.assertEqual(actual - V.EXPECTED_DART_FILES, set())


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          PY
      - name: Remove transient workflow and refresh canonical source manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/worker-g-p6-release-inventory-repair.yml
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Prove the repaired architecture and security gate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tool/worker_g_p6_release_inventory_test.py
          python tool/validate_release.py --skip-tests
      - name: Preserve focused P6 and Test Center validation
        shell: bash
        run: |
          set -euo pipefail
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/dart_format_scope.py --check
          flutter test --no-pub --concurrency=1 --reporter expanded \
            test/product/model/model_registry_test.dart \
            test/product/source_contract_test.dart
          git diff --check
      - name: Commit exact validated repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${WORKER_G_BRANCH}" "${WORKER_B_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_G_BRANCH})" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_B_BRANCH})" = "${EXPECTED_B_HEAD}"
          git add -A -- .
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(p6-001): register model sources in release validation'
          git push origin "HEAD:${WORKER_G_BRANCH}"
