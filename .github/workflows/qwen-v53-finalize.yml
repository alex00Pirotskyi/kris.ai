# retrigger final publication against frozen feature head after durability + CI recovery fixes
name: Qwen v53 Final Publication

on:
  push:
    branches:
      - 'automation/qwen-phone-control-materializer'
    paths:
      - '.github/workflows/qwen-v53-finalize.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: qwen-v53-final-publication
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out latest phone-control candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Capture immutable candidate base
        shell: bash
        run: |
          set -euo pipefail
          echo "CANDIDATE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Execute worker and controller contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_v53_recovery.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_test.py \
            tool/kris_qwen_control_compat_test.py
          python3 tool/kris_qwen_control_test.py
          KRIS_QWEN_AUTO_UPDATE=0 python3 tool/kris_qwen_control_compat_test.py
          python3 tool/kris_qwen_worker_v53.py version | tee "$RUNNER_TEMP/v53-version.json"
          python3 - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'v53-version.json').read_text(encoding='utf-8'))
          if value.get('scriptVersion') != '5.3.0':
              raise SystemExit(f'wrong executed worker version: {value}')
          print('QWEN_V53_EXECUTION_PASS')
          PY
          [[ "$(python3 tool/kris_qwen_control.py.compat.py --version)" == '2.2.0' ]]

      - name: Validate never-idle and recovery source markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          worker = Path('tool/kris_qwen_worker_v53.py').read_text(encoding='utf-8')
          policy = Path('tool/kris_qwen_v53_policy.py').read_text(encoding='utf-8')
          recovery = Path('tool/kris_qwen_v53_recovery.py').read_text(encoding='utf-8')
          controller = Path('tool/kris_qwen_control.py.compat.py').read_text(encoding='utf-8')
          combined = worker + '\n' + policy + '\n' + recovery
          required_worker = (
              'RED_ALERT_FRONTIER',
              'RED_ALERT_HARD_ERROR',
              'RED_ALERT_MODEL_SERVER',
              'stack stays alive',
              'Successful work chains immediately',
              'recover_continuous_red_helper_ci',
              'CONTINUOUS_HELPER_CI_REPAIR_MARKER',
              'CONTINUOUS_CANONICAL_CI_REPAIR_MARKER',
              'CONTINUOUS_SOURCE_WIP_LIMIT',
              'WIP_SNAPSHOT_FROM_MISSION_V15',
              '+refs/pull/*/head:refs/remotes/origin/pull/*/head',
          )
          missing = [x for x in required_worker if x not in combined]
          if missing:
              raise SystemExit(f'missing v53 always-on markers: {missing}')
          required_controller = (
              'UPDATE_BLOCKED_DIRTY',
              'UPDATE_BLOCKED_NON_FAST_FORWARD',
              'UPDATE_BLOCKED_CANDIDATE_INVALID',
              '_probe_candidate_entries',
              '_fast_forward_validated',
              'controllerRuntimeSha256',
              'KRIS_QWEN_CONTROLLER_SELF_RESTART',
              '_exit_for_supervisor_restart',
          )
          missing = [x for x in required_controller if x not in controller]
          if missing:
              raise SystemExit(f'missing controller always-on markers: {missing}')
          print('QWEN_V53_ALWAYS_ON_MARKERS_PASS')
          PY

      - name: Validate durable systemd path
        shell: bash
        run: |
          set -euo pipefail
          bash -n tool/install_kris_qwen_control_systemd.sh
          python3 - <<'PY'
          from pathlib import Path
          installer = Path('tool/install_kris_qwen_control_systemd.sh').read_text(encoding='utf-8')
          launcher = Path('run_my_server.py').read_text(encoding='utf-8')
          required_installer = (
              '--phone',
              'kris_qwen_worker_v53.py',
              'kris_qwen_v53_recovery.py',
              'kris_qwen_control.py.compat.py',
              'KRIS_QWEN_CONTROLLER_SELF_RESTART',
              'StartLimitIntervalSec=0',
              'Restart=always',
              'KillMode=process',
              'OOMPolicy=continue',
              'as_service_user gh auth status',
          )
          missing = [x for x in required_installer if x not in installer]
          if missing:
              raise SystemExit(f'durable installer missing: {missing}')
          if 'systemctl", "stop", SERVICE' in launcher:
              raise SystemExit('foreground launcher still disables durable service')
          if 'durable systemd controller is already active' not in launcher:
              raise SystemExit('foreground launcher lacks durable-service preservation')
          print('QWEN_V53_DURABLE_SUPERVISOR_PASS')
          PY

      - name: Reconcile only proven stale branch-hygiene keep entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('config/branch_hygiene.json')
          text = path.read_text(encoding='utf-8')
          blocks = (
              ('ci/direct-pr14-repair-trigger', '''    {\n      "name": "ci/direct-pr14-repair-trigger",\n      "reason": "Historical repair-status lineage retained until PR14 cleanup is fully closed."\n    },\n'''),
              ('integration/p2-owner-risk-v71r12', '''    {\n      "name": "integration/p2-owner-risk-v71r12",\n      "reason": "Unique P1/P2 owner-risk evidence lineage pending current-schema migration."\n    },\n'''),
          )
          for name, block in blocks:
              if text.count(block) > 1:
                  raise SystemExit(f'duplicated branch-hygiene keep block: {name}')
              if block in text:
                  text = text.replace(block, '', 1)
              elif f'"name": "{name}"' in text:
                  raise SystemExit(f'unexpected representation for stale keep entry: {name}')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Validate live branch-hygiene plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tool/branch_hygiene.py --self-test
          python3 tool/branch_hygiene.py \
            --config config/branch_hygiene.json \
            --repository "$GITHUB_REPOSITORY" \
            --receipt "$RUNNER_TEMP/branch-hygiene-plan.json"
          python3 - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'branch-hygiene-plan.json').read_text(encoding='utf-8'))
          if value.get('status') == 'blocked' or value.get('errors'):
              raise SystemExit(f'branch hygiene remains blocked: {value.get("errors")}')
          print('QWEN_V53_BRANCH_HYGIENE_PASS')
          PY

      - name: Refresh final operator truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/KRIS_QWEN_SERVER_CONTROL.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Qwen 5.3 final always-on contract'
          section = '''\n\n## Qwen 5.3 final always-on contract\n\nThe executed phone worker is `tool/kris_qwen_worker_v53.py` (**5.3.0**) and the executed controller is `tool/kris_qwen_control.py.compat.py` (**2.2.0**). Normal idle is not a steady state. Successful Product Work Orders chain immediately; a genuinely empty safe frontier is `RED_ALERT_FRONTIER`; repeated hard Work Order failures become `RED_ALERT_HARD_ERROR` without terminating the persistent stack; and managed `llama-server` death/unreachability is recovered through `RED_ALERT_MODEL_SERVER` child restart. Persistent fleet/control-plane retry backoff is capped at 30 seconds.\n\nContinuous Product work respects the canonical Mission WIP/backpressure model. Hosted helper CI that is merely pending may coexist with additional Product hardening up to the bounded WIP limit. A red continuous helper is never integrated: its exact immutable helper head becomes evidence for a targeted `CI_REPAIR` Work Order on the current canonical Product head, and the superseded red helper is closed only after replacement authority exists. A red exact canonical Product CI lane similarly creates a targeted canonical-head repair rather than falling back to unrelated hardening.\n\nController 2.2 validates updates before drain: dirty, non-fast-forward, or candidate-entry-invalid updates keep the current worker running. Safe updates are pinned to the exact candidate SHA that passed detached worker/controller probes. If the remote moves during graceful drain, the update aborts and the unchanged current worker is restarted. Under durable systemd supervision, a successfully applied update that changes controller runtime bytes restarts only the controller process after the new worker is running; `Restart=always` reloads the new controller bytes while `KillMode=process` leaves the worker alive.\n\nFor durable phone control use `sudo ./tool/install_kris_qwen_control_systemd.sh --phone` on a trusted LAN/VPN. The service runs as the invoking GitHub-authenticated user, binds worker 5.3/controller 2.2, enables automatic safe updates and supervised controller reload, disables systemd start-rate lockout, and preflights the complete worker policy/recovery execution path before start. `./run_my_server.py` no longer stops an active durable service.\n'''
          if marker not in text:
              text += section
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Regenerate canonical manifest twice
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest.first"
          python3 tool/p1a_refresh_source_manifest.py .
          cmp -s "$RUNNER_TEMP/manifest.first" SOURCE_MANIFEST.sha256
          python3 tool/p1a_source_manifest_test.py .
          python3 tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          for path in \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_v53_recovery.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_compat_test.py \
            tool/install_kris_qwen_control_systemd.sh \
            run_my_server.py; do
            grep -F "$path" SOURCE_MANIFEST.sha256
          done
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          allowed = {
              'SOURCE_MANIFEST.sha256',
              'config/branch_hygiene.json',
              'docs/KRIS_QWEN_SERVER_CONTROL.md',
          }
          if 'SOURCE_MANIFEST.sha256' not in actual or not actual.issubset(allowed):
              raise SystemExit(f'final publication diff scope mismatch: {sorted(actual)}')
          PY

      - name: Publish only if validated base is still current
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --heads origin refs/heads/agent/qwen-phone-control | awk '{print $1}')"
          if [[ "$remote" != "$CANDIDATE_BASE" ]]; then
            echo "feature head moved during validation: base=$CANDIDATE_BASE remote=$remote" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256 config/branch_hygiene.json docs/KRIS_QWEN_SERVER_CONTROL.md
          git diff --cached --check
          git commit -m 'feat(qwen): finalize always-on v53 execution'
          candidate="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/agent/qwen-phone-control
          git fetch origin '+refs/heads/agent/qwen-phone-control:refs/remotes/origin/agent/qwen-phone-control'
          [[ "$(git rev-parse origin/agent/qwen-phone-control)" == "$candidate" ]]
          echo "QWEN_V53_FINAL_PASS candidate=$candidate"
