name: TEMP Direct PR14 Repair

on:
  push:
    branches:
      - ci/direct-pr14-repair-trigger

permissions:
  contents: write

concurrency:
  group: temp-direct-pr14-repair
  cancel-in-progress: false

jobs:
  repair-pr14:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: merge/p1-p2-owner-risk-qa-preview
      EXPECTED_HEAD: 0b6a50978de9a954f00de8272ba24134bb85980e
      SELF_REPAIR_PATH: .github/workflows/temp-pr14-self-repair.yml
      STATUS_BRANCH: ci/direct-pr14-repair-trigger
    steps:
      - name: Check out exact PR14 target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: true
          path: target

      - name: Check out repair status branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/direct-pr14-repair-trigger
          fetch-depth: 0
          persist-credentials: true
          path: status

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false

      - name: Apply, validate, commit, and push exact repair
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            cd target
            git config core.autocrlf false
            git fetch origin "$TARGET_BRANCH"
            test "$(git branch --show-current)" = "$TARGET_BRANCH"
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
            test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
            test -f "$SELF_REPAIR_PATH"
            test -z "$(git status --porcelain)"

            python tool/v71r12_bootstrap_hosted_python.py --project .

            python - <<'PY'
          from pathlib import Path

          p2 = Path('.github/workflows/p2-owner-mode.yml')
          value = p2.read_text(encoding='utf-8')
          old = '''      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"
'''
          new = '''      - name: Install exact hash-locked hosted Python test dependencies
        shell: bash
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"
'''
          if value.count(old) < 1:
              raise SystemExit('P2 source-contract toolchain anchor missing')
          p2.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')

          promotion = Path('.github/workflows/p1-p2-owner-risk-promotion-v71r12.yml')
          value = promotion.read_text(encoding='utf-8')
          old = '''          if-no-files-found: error
          retention-days: 30
'''
          new = '''          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
'''
          if value.count(old) != 1:
              raise SystemExit(f'expected one shipment upload target, found {value.count(old)}')
          if 'include-hidden-files: true' in value:
              raise SystemExit('shipment visibility repair already present')
          promotion.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

            python tool/benchmark_runner.py run \
              --project . \
              --mode portable \
              --output evals/results/p0_009_baseline.json \
              --markdown evals/results/P0_009_BASELINE.md
            rm -f "$SELF_REPAIR_PATH"
            python tool/p2_refresh_source_manifest.py .

            python tool/benchmark_runner.py check --project .
            python tool/p0_010_generated_state_test.py --project .
            python tool/p2_source_inventory_test.py --project .
            git diff --check

            mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
            printf 'CHANGED_PATH=%s\n' "${paths[@]}"
            test "${#paths[@]}" -eq 6
            test "${paths[0]}" = ".github/workflows/p1-p2-owner-risk-promotion-v71r12.yml"
            test "${paths[1]}" = ".github/workflows/p2-owner-mode.yml"
            test "${paths[2]}" = ".github/workflows/temp-pr14-self-repair.yml"
            test "${paths[3]}" = "SOURCE_MANIFEST.sha256"
            test "${paths[4]}" = "evals/results/P0_009_BASELINE.md"
            test "${paths[5]}" = "evals/results/p0_009_baseline.json"
            test "$(grep -c '^[[:space:]]*include-hidden-files: true$' .github/workflows/p1-p2-owner-risk-promotion-v71r12.yml)" -eq 1
            test "$(grep -c 'Install exact hash-locked hosted Python test dependencies' .github/workflows/p2-owner-mode.yml)" -eq 1

            git config user.name 'Kristin CI Repair'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'fix(ci): refresh P2 preview gates and benchmark baseline'
            repaired_commit="$(git rev-parse HEAD)"
            test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
            test ! -e "$SELF_REPAIR_PATH"
            git push origin "$repaired_commit:refs/heads/$TARGET_BRANCH"
            test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$repaired_commit"
            printf '%s\n' "$repaired_commit" > "$RUNNER_TEMP/repaired-commit.txt"
          ) > "$RUNNER_TEMP/repair.log" 2>&1
          rc=$?
          echo "REPAIR_RC=$rc" >> "$GITHUB_ENV"
          if [[ -f "$RUNNER_TEMP/repaired-commit.txt" ]]; then
            echo "REPAIRED_COMMIT=$(cat "$RUNNER_TEMP/repaired-commit.txt")" >> "$GITHUB_ENV"
          else
            echo "REPAIRED_COMMIT=" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Publish repair status to trigger branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd status
          cp "$RUNNER_TEMP/repair.log" repair.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              'repairRc': int(os.environ.get('REPAIR_RC', '255')),
              'targetBranch': os.environ['TARGET_BRANCH'],
              'expectedHead': os.environ['EXPECTED_HEAD'],
              'repairedCommit': os.environ.get('REPAIRED_COMMIT', ''),
              'workflowRunId': os.environ.get('GITHUB_RUN_ID', ''),
              'workflowRunAttempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
          }
          Path('repair-status.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          git config user.name 'Kristin CI Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair.log repair-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record direct PR14 repair status'
            git push origin "HEAD:refs/heads/$STATUS_BRANCH"
          fi

      - name: Enforce successful repair
        if: always()
        shell: bash
        run: |
          test "${REPAIR_RC:-255}" -eq 0
          test -n "${REPAIRED_COMMIT:-}"
