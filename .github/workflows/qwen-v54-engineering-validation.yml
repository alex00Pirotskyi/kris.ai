name: Qwen 5.4 Engineering Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/qwen-v54-engineering-validation.yml'
      - 'config/qwen_engineering_skills.v1.json'
      - 'tool/kris_qwen_engineering_env.py'
      - 'tool/kris_qwen_engineering_env_test.py'
      - 'tool/kris_qwen_worker_v54.py'
      - 'tool/kris_qwen_worker_v531.py'
      - 'tool/kris_qwen_worker_v53_base.py'
      - 'tool/kris_qwen_v53_*.py'

permissions:
  contents: read

jobs:
  validate:
    name: qwen-v54-engineering
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Compile deterministic worker stack
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker_v53_base.py \
            tool/kris_qwen_worker_v531.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_v53_recovery.py \
            tool/kris_qwen_v53_reconcile.py \
            tool/kris_qwen_engineering_env.py \
            tool/kris_qwen_worker_v54.py \
            tool/kris_qwen_v531_test.py \
            tool/kris_qwen_engineering_env_test.py
      - name: Preserve 5.3.1 regression baseline
        run: python tool/kris_qwen_v531_test.py
      - name: Execute 5.4 engineering environment regression
        run: python tool/kris_qwen_engineering_env_test.py
      - name: Execute real 5.4 version entry
        shell: bash
        run: |
          set -euo pipefail
          python tool/kris_qwen_worker_v54.py version > "$RUNNER_TEMP/qwen-v54.json"
          python - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'qwen-v54.json').read_text(encoding='utf-8'))
          assert value.get('scriptVersion') == '5.4.0', value
          assert str(value.get('path', '')).endswith('kris_qwen_worker_v54.py'), value
          PY
