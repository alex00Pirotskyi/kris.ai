name: temporary-one-kristin-hybrid-probe

on:
  push:
    branches:
      - automation/one-kristin-reconcile-probe-20260901

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bbb8cbdb52844f868abf9916c9bb77446c2809cf
          fetch-depth: 0

      - name: Build ours-biased three-way candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin d9e92c44c4f3fbcc21c60b1592dfd52dc71ddfb1
          git config user.name probe
          git config user.email probe@example.invalid
          set +e
          git cherry-pick --no-commit d9e92c44c4f3fbcc21c60b1592dfd52dc71ddfb1
          rc=$?
          set -e
          test "$rc" -ne 0
          mapfile -t files < <(git diff --name-only --diff-filter=U | LC_ALL=C sort)
          test "${#files[@]}" -eq 13
          git checkout --ours -- "${files[@]}"
          git add "${files[@]}"
          test -z "$(git diff --name-only --diff-filter=U)"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Normalize and analyze
        shell: bash
        run: |
          flutter pub get
          python tool/dart_format_scope.py --write
          python tool/p1a_refresh_source_manifest.py .
          python tool/dart_format_scope.py --check
          python tool/generated_state_guard.py audit --project . --strict
          git diff --check
          flutter analyze --no-pub --fatal-warnings --fatal-infos

      - name: Run cross-lineage contracts
        shell: bash
        run: |
          flutter test --no-pub --concurrency=1 --reporter expanded \
            test/product/advanced_same_conversation_contract_test.dart \
            test/product/authority_convergence_contract_test.dart \
            test/product/chat_continuation_activity_contract_test.dart \
            test/product/research_archive_degradation_contract_test.dart \
            test/product/runner_bounded_delegate_contract_test.dart \
            test/product/semantic_durable_steering_test.dart \
            test/product/steering_scope_continuation_contract_test.dart \
            test/product/truthful_conversation_streaming_test.dart \
            test/product/kristin_conversation_session_authoritative_state_test.dart \
            test/product/task_kernel/semantic_steering_test.dart \
            test/product/utility_time_test.dart
