name: TEMP PR14 Exact Run Approval V7

on:
  push:
    branches: [ci/pr14-source-contract-repair-20260805]

permissions:
  actions: write
  contents: read

concurrency:
  group: temp-pr14-exact-run-approval-v7
  cancel-in-progress: false

jobs:
  approve-exact-pr-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 227f1cbfe1c044c4eb4310e872d3aff5b5721615
      EXPECTED_PR: '14'
      RUN_IDS: >-
        30991734224 30991734199 30991734215 30991734241
        30991734306 30991734270 30991734546 30991734700
    steps:
      - name: Approve only exact candidate runs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          expected_head = os.environ['EXPECTED_HEAD']
          expected_pr = int(os.environ['EXPECTED_PR'])
          run_ids = [int(value) for value in os.environ['RUN_IDS'].split()]
          token = os.environ['GITHUB_TOKEN']
          base = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2026-03-10',
              'User-Agent': 'kristin-worker-a-exact-run-approval-v7',
          }

          def request(path: str, method: str = 'GET'):
              req = urllib.request.Request(base + path, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      decoded = json.loads(body) if body else None
                      return response.status, decoded
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(
                      f'{method} {path} failed status={exc.code} body={body[:1000]}'
                  ) from exc

          receipts = []
          for run_id in run_ids:
              status, run = request(f'/actions/runs/{run_id}')
              assert status == 200, (run_id, status)
              assert run['head_sha'] == expected_head, (run_id, run['head_sha'])
              assert run['head_branch'] == 'merge/p1-p2-owner-risk-qa-preview', run_id
              assert run['event'] == 'pull_request', (run_id, run['event'])
              pr_numbers = sorted(item['number'] for item in run.get('pull_requests', []))
              assert pr_numbers == [expected_pr], (run_id, pr_numbers)
              before = {
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'workflow': run['name'],
                  'path': run['path'],
              }
              approval_status = None
              if run['status'] == 'completed' and run['conclusion'] == 'action_required':
                  approval_status, _ = request(f'/actions/runs/{run_id}/approve', 'POST')
                  assert approval_status == 201, (run_id, approval_status)
              else:
                  assert run['conclusion'] != 'action_required', (run_id, before)

              after = None
              for _ in range(15):
                  _, after = request(f'/actions/runs/{run_id}')
                  if not (
                      after['status'] == 'completed'
                      and after['conclusion'] == 'action_required'
                  ):
                      break
                  time.sleep(2)
              assert after is not None
              assert after['head_sha'] == expected_head
              receipts.append({
                  'runId': run_id,
                  'workflow': run['name'],
                  'path': run['path'],
                  'before': before,
                  'approvalStatus': approval_status,
                  'after': {
                      'status': after['status'],
                      'conclusion': after['conclusion'],
                      'runAttempt': after['run_attempt'],
                  },
              })

          payload = {
              'schemaVersion': '1.0.0',
              'repository': repository,
              'pullRequest': expected_pr,
              'candidateHead': expected_head,
              'controllerCommit': os.environ['GITHUB_SHA'],
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'runs': receipts,
              'allExact': True,
              'protectionsWeakened': False,
              'completionClaim': False,
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'exact-run-approval-receipt.json'
          output.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload exact approval receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr14-exact-run-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-run-approval-receipt.json
          if-no-files-found: error
          retention-days: 90
