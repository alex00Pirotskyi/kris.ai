name: TEMP P2 Exact Landing Dispatch V9

on:
  push:
    branches: [ci/pr14-source-contract-repair-20260805]

permissions:
  actions: write
  contents: read

concurrency:
  group: temp-p2-exact-landing-dispatch-v9
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LANDING_SHA: 0a4176bcbcb975684c3a590be652c9fffe1ce770
      LANDING_TREE: 641e11e63fa84f3a16dc4d74b418778839ce5bc2
      PACKAGE_SHA256: 7b0d77d8956f05ff907ca7463b0d787dcebf93a60426aab105be2b610e6072b0
      WORKFLOW_FILE: p2-owner-mode.yml
    steps:
      - name: Dispatch only the exact protected landing
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          sha = os.environ['LANDING_SHA']
          tree = os.environ['LANDING_TREE']
          package = os.environ['PACKAGE_SHA256']
          workflow = os.environ['WORKFLOW_FILE']
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'kristin-worker-a-p2-exact-landing-dispatch-v9',
          }

          def request(path, method='GET', payload=None):
              data = None
              local_headers = dict(headers)
              if payload is not None:
                  data = json.dumps(payload).encode()
                  local_headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(base + path, data=data, method=method, headers=local_headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'{method} {path} status={exc.code} body={body[:1200]}') from exc

          _, branch = request('/branches/main')
          assert branch['commit']['sha'] == sha, branch['commit']['sha']
          _, commit = request(f'/git/commits/{sha}')
          assert commit['tree']['sha'] == tree, commit['tree']['sha']
          _, content = request(f'/contents/release/evidence/P2/source-package-sha256.txt?ref={sha}')
          observed_package = base64.b64decode(content['content']).decode().strip()
          assert observed_package == package, observed_package

          runs_path = f'/actions/workflows/{urllib.parse.quote(workflow)}/runs?event=workflow_dispatch&branch=main&per_page=100'
          _, before = request(runs_path)
          before_ids = {item['id'] for item in before['workflow_runs']}
          dispatch_status, _ = request(
              f'/actions/workflows/{urllib.parse.quote(workflow)}/dispatches',
              'POST',
              {'ref': 'main', 'inputs': {'source_sha': sha, 'package_sha256': package}},
          )
          assert dispatch_status == 204, dispatch_status

          created = None
          for _ in range(60):
              _, after = request(runs_path)
              candidates = [
                  item for item in after['workflow_runs']
                  if item['id'] not in before_ids
                  and item['head_sha'] == sha
                  and item['head_branch'] == 'main'
                  and item['event'] == 'workflow_dispatch'
              ]
              if len(candidates) == 1:
                  created = candidates[0]
                  break
              if len(candidates) > 1:
                  raise AssertionError([item['id'] for item in candidates])
              time.sleep(2)
          assert created is not None, 'exact workflow_dispatch run not observed'

          payload = {
              'schemaVersion': '1.0.0',
              'repository': repo,
              'controllerCommit': os.environ['GITHUB_SHA'],
              'controllerRunId': os.environ['GITHUB_RUN_ID'],
              'dispatchStatus': dispatch_status,
              'landingSha': sha,
              'landingTree': tree,
              'packageSha256': package,
              'workflow': workflow,
              'behavioralRun': {
                  'id': created['id'],
                  'status': created['status'],
                  'conclusion': created['conclusion'],
                  'actor': created['actor']['login'],
                  'triggeringActor': created['triggering_actor']['login'],
                  'runAttempt': created['run_attempt'],
                  'url': created['html_url'],
              },
              'completionClaim': False,
              'behavioralPassClaim': False,
              'protectionsWeakened': False,
              'workerCBranchTouched': False,
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'p2-exact-landing-dispatch-receipt.json'
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload exact dispatch receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p2-exact-landing-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2-exact-landing-dispatch-receipt.json
          if-no-files-found: error
          retention-days: 90
