name: TEMP PR14 Source Contract Repair V3

on:
  push:
    branches:
      - ci/pr14-source-contract-repair-20260805

permissions:
  contents: write

concurrency:
  group: temp-pr14-source-contract-repair-v3
  cancel-in-progress: false

jobs:
  repair-pr14-source-contracts:
    name: repair-pr14-source-contracts-v3
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: merge/p1-p2-owner-risk-qa-preview
      EXPECTED_HEAD: bdfec2232cc1718e8b160e7e2fe5c4374fd4b42b
      EXPECTED_TREE: 181671cace704b3dd1b10496c02b20d006533515
      PROGRESS_PATH: docs/roadmap/progress/2026-08-05-p2-pr14-source-contract-regression-closure.md
      TEST_PATH: test/product/source_contract_test.dart
      PARENT_CONTROLLER: 9bfcbb7f240ac0af6d87e1acfaae28f4f433e0e5
      PARENT_WORKFLOW: .github/workflows/temp-pr14-source-contract-repair-v2.yml
    steps:
      - name: Check out exact controller history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: control

      - name: Check out exact PR14 target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: true
          path: target

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Set up exact Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v7.0.0
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Set up exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Execute immutable parent controller with explicit one-file repair
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_EXTRACT'
          import os
          import subprocess
          from pathlib import Path

          parent = os.environ['PARENT_CONTROLLER']
          workflow = os.environ['PARENT_WORKFLOW']
          raw = subprocess.check_output(
              ['git', '-C', 'control', 'show', f'{parent}:{workflow}'],
              text=True,
          )
          lines = raw.splitlines()
          step_name = '      - name: Patch and validate exact live PR14 head'
          try:
              step_index = lines.index(step_name)
          except ValueError as exc:
              raise SystemExit('immutable parent repair step is missing') from exc
          run_index = next(
              index
              for index in range(step_index + 1, len(lines))
              if lines[index] == '        run: |'
          )
          script_lines = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - name: ') or line.startswith('      - uses: '):
                  break
              if not line:
                  script_lines.append('')
              elif line.startswith('          '):
                  script_lines.append(line[10:])
              else:
                  raise SystemExit(f'unexpected parent workflow indentation: {line!r}')
          script = '\n'.join(script_lines) + '\n'
          needle = """PY_PATCH

            python tool/p2_refresh_source_manifest.py .
          """
          if script.count(needle) != 1:
              raise SystemExit(
                  f'parent construction insertion anchor count={script.count(needle)}'
              )
          insertion = r'''PY_PATCH

            python - <<'PY_PROGRESS_CORRECTION'
          import os
          from pathlib import Path

          path = Path(os.environ['PROGRESS_PATH'])
          value = path.read_text(encoding='utf-8')
          marker = '\n## Formatter and compatibility impact\n'
          section = f"""\n## Failed-closed formatter-canonical correction\n\nController run `30988129124` passed the corrected exact head/tree guard and completed the hosted Python bootstrap, dependency resolution, all current generated-contract checks, protocol contracts, durable workflow-kernel checks, and Prompt Studio gates. It then failed closed at `python tool/dart_format_scope.py --check` because the intended handwritten test edit was not formatter-canonical. The check reported only `Changed test/product/source_contract_test.dart`; its output SHA-256 is `be9dc630a03846edab1dbc77eb10b885cffca30d7206cce0a8ed2237e320439d`. Artifact `8922939745` has archive digest `sha256:3873350320c9e346282d5ea38b7c2b35efdd8157ff5039864455c743ac38434c`. No candidate or target branch update was created.\n\nFinal controller run `{os.environ.get('GITHUB_RUN_ID', 'unknown')}` performs one explicit candidate-construction repair, `dart format test/product/source_contract_test.dart`, before refreshing `SOURCE_MANIFEST.sha256` and taking the immutable verification snapshot. The later governed format check and every automatic gate remain non-mutating.\n"""
          if value.count(marker) != 1:
              raise SystemExit(f'target progress formatter marker count={value.count(marker)}')
          old = 'The live P2 workflow already uses `python tool/dart_format_scope.py --check` and finishes with `git diff --exit-code`; no broad generator-mutating formatter remains in this path. Generated Dart remains generator-owned. This repair changes no API, wire format, persistence schema, runtime composition, platform adapter, or Owner Mode authority behavior.'
          new = 'The live P2 workflow already uses `python tool/dart_format_scope.py --check` and finishes with `git diff --exit-code`; no broad generator-mutating formatter remains in this path. The controller formats only the intended handwritten regression test during candidate construction, before verification. Generated Dart remains generator-owned, and the before/after snapshot proves automatic verification is non-mutating. This repair changes no API, wire format, persistence schema, runtime composition, platform adapter, or Owner Mode authority behavior.'
          if value.count(old) != 1:
              raise SystemExit(f'target progress formatter paragraph count={value.count(old)}')
          value = value.replace(marker, section + marker, 1).replace(old, new, 1)
          path.write_text(value, encoding='utf-8', newline='\n')
          PY_PROGRESS_CORRECTION

            set +e
            dart format "$TEST_PATH" 2>&1 | tee "$RUNNER_TEMP/candidate-format.log"
            candidate_format_rc=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$candidate_format_rc" > "$RUNNER_TEMP/candidate-format-rc.txt"
            python - "$RUNNER_TEMP/candidate-format.log" > "$RUNNER_TEMP/candidate-format-sha256.txt" <<'PY_FORMAT_HASH'
          import hashlib
          import sys
          from pathlib import Path
          print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY_FORMAT_HASH
            test "$candidate_format_rc" -eq 0

            python tool/p2_refresh_source_manifest.py .
          '''
          script = script.replace(needle, insertion, 1)
          destination = Path(os.environ['RUNNER_TEMP']) / 'extracted-repair-v3.sh'
          destination.write_text(script, encoding='utf-8', newline='\n')
          destination.chmod(0o700)
          print(f'EXTRACTED_PARENT_CONTROLLER={parent}')
          print(f'EXTRACTED_SCRIPT_SHA256={__import__("hashlib").sha256(script.encode()).hexdigest()}')
          PY_EXTRACT
          bash "$RUNNER_TEMP/extracted-repair-v3.sh"

      - name: Build exact repair receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY_STATUS'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])

          def read(name: str) -> str:
              path = root / name
              return path.read_text(encoding='utf-8').strip() if path.exists() else ''

          commands = []
          path = root / 'command-results.tsv'
          if path.exists():
              for line in path.read_text(encoding='utf-8').splitlines():
                  name, exit_code, digest = line.split('\t')
                  commands.append({
                      'name': name,
                      'exitCode': int(exit_code),
                      'outputSha256': digest,
                  })
          format_rc = read('candidate-format-rc.txt')
          payload = {
              'schemaVersion': '1.0.0',
              'roadmapAuthority': 'docs/roadmap/MASTER.md',
              'repository': os.environ.get('GITHUB_REPOSITORY', ''),
              'workflowRunId': os.environ.get('GITHUB_RUN_ID', ''),
              'workflowRunAttempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              'controllerCommit': os.environ.get('GITHUB_SHA', ''),
              'parentController': os.environ['PARENT_CONTROLLER'],
              'targetBranch': os.environ['TARGET_BRANCH'],
              'expectedHead': os.environ['EXPECTED_HEAD'],
              'expectedTree': os.environ['EXPECTED_TREE'],
              'repairRc': int('${{ steps.repair.outputs.repair_rc }}' or '255'),
              'candidateFormat': {
                  'exitCode': int(format_rc) if format_rc else None,
                  'outputSha256': read('candidate-format-sha256.txt'),
                  'path': os.environ['TEST_PATH'],
                  'phase': 'candidate-construction',
              },
              'candidateCommit': read('candidate-commit.txt'),
              'candidateTree': read('candidate-tree.txt'),
              'refUpdatedByAction': read('ref-updated.txt') == 'true',
              'changedPaths': read('changed-paths.txt').splitlines() if read('changed-paths.txt') else [],
              'commands': commands,
              'completionClaim': False,
              'behavioralEvidenceClaim': False,
              'workerCBranchTouched': False,
          }
          (root / 'repair-status.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY_STATUS

      - name: Upload exact repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr14-source-contract-repair-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repair-status.json
            ${{ runner.temp }}/repair.log
            ${{ runner.temp }}/candidate-format.log
            ${{ runner.temp }}/candidate-format-rc.txt
            ${{ runner.temp }}/candidate-format-sha256.txt
            ${{ runner.temp }}/command-results.tsv
            ${{ runner.temp }}/command-logs
            ${{ runner.temp }}/changed-paths.txt
            ${{ runner.temp }}/local-governance-results.json
            ${{ runner.temp }}/extracted-repair-v3.sh
          if-no-files-found: error
          retention-days: 90

      - name: Enforce successful exact-head repair
        if: always()
        shell: bash
        run: |
          python - <<'PY_ENFORCE'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'repair-status.json').read_text()
          )
          assert payload['repairRc'] == 0, payload
          assert payload['candidateFormat']['exitCode'] == 0, payload
          assert payload['candidateFormat']['outputSha256'], payload
          assert payload['candidateCommit'], payload
          assert payload['candidateTree'], payload
          assert payload['refUpdatedByAction'] is True, payload
          assert payload['changedPaths'] == [
              'SOURCE_MANIFEST.sha256',
              'docs/roadmap/progress/2026-08-05-p2-pr14-source-contract-regression-closure.md',
              'test/product/source_contract_test.dart',
          ], payload
          assert payload['commands'], payload
          assert all(item['exitCode'] == 0 for item in payload['commands']), payload
          PY_ENFORCE
