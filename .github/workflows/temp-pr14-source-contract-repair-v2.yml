name: TEMP P2 Superseded Run Release V8

on:
  push:
    branches: [ci/pr14-source-contract-repair-20260805]

permissions:
  actions: write
  contents: read

concurrency:
  group: temp-p2-superseded-run-release-v8
  cancel-in-progress: false

jobs:
  release-exact-head-p2-source-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OBSOLETE_RUN: '30991734270'
      OBSOLETE_SHA: 227f1cbfe1c044c4eb4310e872d3aff5b5721615
      CURRENT_RUN: '30992084248'
      CURRENT_SHA: 2cb15db0898fb0337b821bbce17bbf60092d3c66
      TARGET_BRANCH: merge/p1-p2-owner-risk-qa-preview
    steps:
      - name: Cancel only the superseded serialized run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          obsolete_run = int(os.environ['OBSOLETE_RUN'])
          current_run = int(os.environ['CURRENT_RUN'])
          obsolete_sha = os.environ['OBSOLETE_SHA']
          current_sha = os.environ['CURRENT_SHA']
          target_branch = os.environ['TARGET_BRANCH']
          base = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'kristin-worker-a-p2-run-release-v8',
          }

          def request(path: str, method: str = 'GET'):
              req = urllib.request.Request(base + path, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(
                      f'{method} {path} failed status={exc.code} body={body[:1000]}'
                  ) from exc

          _, old = request(f'/actions/runs/{obsolete_run}')
          _, current = request(f'/actions/runs/{current_run}')
          for run, expected_id, expected_sha in (
              (old, obsolete_run, obsolete_sha),
              (current, current_run, current_sha),
          ):
              assert run['id'] == expected_id
              assert run['head_sha'] == expected_sha, (expected_id, run['head_sha'])
              assert run['head_branch'] == target_branch
              assert run['path'] == '.github/workflows/p2-owner-mode.yml'
              assert run['event'] == 'pull_request'
              assert [item['number'] for item in run.get('pull_requests', [])] == [14]

          assert current['status'] == 'pending', current
          cancel_status = None
          if old['status'] in {'queued', 'in_progress', 'pending', 'waiting', 'requested'}:
              cancel_status, _ = request(f'/actions/runs/{obsolete_run}/cancel', 'POST')
              assert cancel_status == 202, cancel_status
          else:
              assert old['status'] == 'completed', old

          old_after = old
          current_after = current
          for _ in range(45):
              _, old_after = request(f'/actions/runs/{obsolete_run}')
              _, current_after = request(f'/actions/runs/{current_run}')
              if old_after['status'] == 'completed' and current_after['status'] != 'pending':
                  break
              time.sleep(2)

          assert old_after['status'] == 'completed', old_after
          assert current_after['head_sha'] == current_sha
          assert current_after['status'] != 'pending', current_after
          payload = {
              'schemaVersion': '1.0.0',
              'repository': repository,
              'pullRequest': 14,
              'targetBranch': target_branch,
              'obsoleteRun': {
                  'id': obsolete_run,
                  'headSha': obsolete_sha,
                  'beforeStatus': old['status'],
                  'beforeConclusion': old['conclusion'],
                  'cancelStatus': cancel_status,
                  'afterStatus': old_after['status'],
                  'afterConclusion': old_after['conclusion'],
              },
              'currentRun': {
                  'id': current_run,
                  'headSha': current_sha,
                  'beforeStatus': current['status'],
                  'afterStatus': current_after['status'],
                  'afterConclusion': current_after['conclusion'],
                  'runAttempt': current_after['run_attempt'],
              },
              'evidenceReused': False,
              'protectionsWeakened': False,
              'workerCBranchTouched': False,
              'completionClaim': False,
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'p2-superseded-run-release-receipt.json'
          output.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload exact concurrency-release receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p2-superseded-run-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2-superseded-run-release-receipt.json
          if-no-files-found: error
          retention-days: 90
