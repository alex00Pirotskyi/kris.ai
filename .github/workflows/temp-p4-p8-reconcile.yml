name: Temporary P4 P8 Exact Reconciliation

on:
  push:
    branches:
      - automation/p4-p8-reconcile-800643b
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p4-p8-reconcile-800643b
  cancel-in-progress: false

env:
  P4_HEAD: 1c089c7094a122bb3cfbbc78221f218b3dd7ac0f
  P8_HEAD: 800643bb5898a80ee3843f83f7657411183a9e6a
  P4_BRANCH: agent/p4-001-search-provider-foundation

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Build and publish the exact two-parent reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kristin P4 P8 Reconciler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin "${P4_HEAD}" "${P8_HEAD}"
          remote_p4="$(git ls-remote origin "refs/heads/${P4_BRANCH}" | cut -f1)"
          test "${remote_p4}" = "${P4_HEAD}"

          git checkout --detach "${P4_HEAD}"
          cp config/test_center_registry.v1.json "${RUNNER_TEMP}/p4-registry.json"
          cp config/test_center_assurance_hierarchy.v1.json "${RUNNER_TEMP}/p4-hierarchy.json"
          git show "${P8_HEAD}:config/test_center_registry.v1.json" > "${RUNNER_TEMP}/p8-registry.json"
          git show "${P8_HEAD}:config/test_center_assurance_hierarchy.v1.json" > "${RUNNER_TEMP}/p8-hierarchy.json"

          set +e
          git merge --no-ff --no-commit "${P8_HEAD}"
          merge_rc=$?
          set -e
          test "${merge_rc}" -eq 0 -o "${merge_rc}" -eq 1

          python - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path

          root = Path('.')
          temp = Path(os.environ['RUNNER_TEMP'])

          explicit_keys = {
              'affectedTestMappings': 'mappingId',
              'projectTestProfiles': 'stableCheckId',
              'testBindings': 'testId',
              'levels': 'levelId',
              'modules': 'moduleId',
              'testModules': 'moduleId',
              'tests': 'testId',
          }
          candidate_keys = (
              'mappingId', 'stableCheckId', 'testId', 'moduleId', 'levelId',
              'profileId', 'id', 'name'
          )

          def merge_document(p4, p8):
              out = copy.deepcopy(p8)
              for key, p4_value in p4.items():
                  if key not in out:
                      out[key] = copy.deepcopy(p4_value)
                      continue
                  p8_value = out[key]
                  if not (isinstance(p4_value, list) and isinstance(p8_value, list)):
                      continue
                  if not p4_value:
                      continue
                  if not all(isinstance(item, dict) for item in p4_value + p8_value):
                      continue
                  identity = explicit_keys.get(key)
                  if identity is None:
                      for candidate in candidate_keys:
                          if all(candidate in item for item in p4_value + p8_value):
                              identity = candidate
                              break
                  if identity is None:
                      continue
                  seen = {item[identity] for item in p8_value}
                  out[key] = copy.deepcopy(p8_value) + [
                      copy.deepcopy(item) for item in p4_value
                      if item[identity] not in seen
                  ]
              return out

          pairs = (
              ('p4-registry.json', 'p8-registry.json', root / 'config/test_center_registry.v1.json'),
              ('p4-hierarchy.json', 'p8-hierarchy.json', root / 'config/test_center_assurance_hierarchy.v1.json'),
          )
          for p4_name, p8_name, destination in pairs:
              p4 = json.loads((temp / p4_name).read_text(encoding='utf-8'))
              p8 = json.loads((temp / p8_name).read_text(encoding='utf-8'))
              merged = merge_document(p4, p8)
              destination.write_text(
                  json.dumps(merged, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )
          PY

          git checkout --ours SOURCE_MANIFEST.sha256
          git add config/test_center_registry.v1.json \
                  config/test_center_assurance_hierarchy.v1.json \
                  SOURCE_MANIFEST.sha256
          test -z "$(git diff --name-only --diff-filter=U)"

          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          git add SOURCE_MANIFEST.sha256

          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/test_center_contracts_test.py
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/test_center_assurance_hierarchy.py check-report \
            --project . \
            --report release/evidence/TEST_CENTER/P8-001/fixtures/assurance-execution-report.pass.json
          python -m unittest -v tool/test_center_assurance_hierarchy_test.py
          python tool/p4_001_test_center_v1.py check --project .
          python -m unittest -v tool/p4_001_test_center_v1_test.py
          python tool/p4_001_search_provider_test.py --project .
          python tool/roadmap_control.py validate --project . --strict
          python tool/generated_state_guard.py audit --project . --strict
          python tool/source_tree_policy_test.py
          git diff --check --cached

          git commit -m "merge(p4): reconcile final P8 compatibility repair"
          final_head="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^1)" = "${P4_HEAD}"
          test "$(git rev-parse HEAD^2)" = "${P8_HEAD}"

          remote_p4="$(git ls-remote origin "refs/heads/${P4_BRANCH}" | cut -f1)"
          test "${remote_p4}" = "${P4_HEAD}"
          git push origin "${final_head}:refs/heads/${P4_BRANCH}"
          printf 'FINAL_HEAD=%s\nFINAL_TREE=%s\n' "${final_head}" "${final_tree}"
