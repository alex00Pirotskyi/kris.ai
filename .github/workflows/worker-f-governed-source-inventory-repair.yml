name: Worker F governed source inventory repair

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: worker-f-governed-source-inventory-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Set up locked Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Install governed Python dependencies
        shell: bash
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Add exact P5 paths to the governed Dart inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Worker F governed inventory repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          path=Path('test/product/source_contract_test.dart')
          text=path.read_text(encoding='utf-8')
          anchor="        'lib/main.dart',\n"
          additions=''.join((
              "        'lib/p5_ia_preview.dart',\n",
              "        'lib/product/p5_information_architecture/p5_components.dart',\n",
              "        'lib/product/p5_information_architecture/p5_controller.dart',\n",
              "        'lib/product/p5_information_architecture/p5_fixtures.dart',\n",
              "        'lib/product/p5_information_architecture/p5_models.dart',\n",
              "        'lib/product/p5_information_architecture/p5_prototype.dart',\n",
              "        'lib/product/p5_information_architecture/p5_support_workspaces.dart',\n",
              "        'lib/product/p5_information_architecture/p5_task_workspaces.dart',\n",
              "        'lib/product/p5_information_architecture/p5_verification_workspaces.dart',\n",
          ))
          if additions in text:
              raise RuntimeError('P5 governed source entries already exist')
          if text.count(anchor) != 1:
              raise RuntimeError('governed source inventory anchor drifted')
          text=text.replace(anchor,anchor+additions,1)
          path.write_text(text,encoding='utf-8')
          PY
          rm .github/workflows/worker-f-governed-source-inventory-repair.yml
      - name: Validate full repository suite
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format test/product/source_contract_test.dart
          flutter analyze
          flutter test
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/worker_f_p5_ia.py manifest --project . --check
          python tool/worker_f_p5_ia.py check --project .
          python tool/worker_f_p5_ia_test.py
          python tool/roadmap_control.py validate --project . --strict
          python tool/generated_state_guard.py audit --project . --strict
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/worker-f-source-manifest
          python tool/p1a_refresh_source_manifest.py .
          cmp /tmp/worker-f-source-manifest SOURCE_MANIFEST.sha256
          git diff --check
      - name: Publish non-workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git add test/product/source_contract_test.dart SOURCE_MANIFEST.sha256
          git commit -m 'P5-001: register governed prototype source paths'
          git push origin HEAD:refs/heads/agent/f/P5-001-information-architecture
