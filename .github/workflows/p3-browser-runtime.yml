name: P3-002 Browser Session Materializer

on:
  push:
    branches:
      - 'agent/product/p3-002-browser-session-service'
    paths:
      - '.github/workflows/p3-browser-runtime.yml'

permissions:
  contents: write

jobs:
  materialize:
    name: materialize-tested-product-source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install exact Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '24.18.0'
          check-latest: false
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Materialize, validate, and publish exact product source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_COMMIT: e4f66ce5a95870cad342bbf9aaf89f94dc768f58
          TARGET_BRANCH: agent/product/p3-002-browser-session-service
          EXPECTED_PAYLOAD_SHA256: 5a2494dac468a4fec2b2c2d8d6c3a81bfd4e61d513bf89349cd2b55f7954e744
          PAYLOAD_BLOBS: c3e0d05b5e21ea533d804cbf569bd5441ba97489 d66f721c85db27af76a87107d0c4199873ef5040 1dadc24c325cca8f63739ae75429501c5e16455a e4758af18c1a4484bffa80c6e94c9a83400e3f9a
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p3-002-payload.b64'
          headers = {
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          with output.open('wb') as stream:
              for sha in os.environ['PAYLOAD_BLOBS'].split():
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}",
                      headers=headers,
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  if payload.get('encoding') != 'base64':
                      raise SystemExit(f'blob {sha} did not use base64 encoding')
                  stream.write(base64.b64decode(payload['content']))
          PY
          base64 --decode "$RUNNER_TEMP/p3-002-payload.b64" > "$RUNNER_TEMP/p3-002-payload.tar.gz"
          echo "$EXPECTED_PAYLOAD_SHA256  $RUNNER_TEMP/p3-002-payload.tar.gz" | sha256sum --check --strict
          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p3-002-payload.tar.gz'
          expected = {
              'automation_host/src/browser-runtime.mjs',
              'automation_host/src/browser-runtime.test.mjs',
              'lib/product/browser/browser_runtime.dart',
              'test/product/browser/browser_runtime_process_test.dart',
          }
          with tarfile.open(archive, 'r:gz') as bundle:
              files = {member.name for member in bundle.getmembers() if member.isfile()}
              unsafe = [
                  member.name
                  for member in bundle.getmembers()
                  if member.issym()
                  or member.islnk()
                  or pathlib.PurePosixPath(member.name).is_absolute()
                  or '..' in pathlib.PurePosixPath(member.name).parts
              ]
              if files != expected or unsafe:
                  raise SystemExit(
                      f'payload contract mismatch files={sorted(files)} unsafe={unsafe}'
                  )
              bundle.extractall('.', filter='data')
          PY
          git checkout "$BASE_COMMIT" -- .github/workflows/p3-browser-runtime.yml
          npm ci --prefix automation_host --ignore-scripts --no-audit --no-fund
          npm test --prefix automation_host
          flutter pub get
          dart format \
            lib/product/browser/browser_runtime.dart \
            test/product/browser/browser_runtime_process_test.dart
          flutter test test/product/browser
          flutter analyze --fatal-infos --fatal-warnings
          git diff --check
          python3 - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/p3-browser-runtime.yml',
              'automation_host/src/browser-runtime.mjs',
              'automation_host/src/browser-runtime.test.mjs',
              'lib/product/browser/browser_runtime.dart',
              'test/product/browser/browser_runtime_process_test.dart',
          }
          actual = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f'materializer scope mismatch actual={sorted(actual)} expected={sorted(expected)}'
              )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/p3-browser-runtime.yml \
            automation_host/src/browser-runtime.mjs \
            automation_host/src/browser-runtime.test.mjs \
            lib/product/browser/browser_runtime.dart \
            test/product/browser/browser_runtime_process_test.dart
          git diff --cached --check
          git commit -m 'feat(p3-002): add isolated browser session service'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
