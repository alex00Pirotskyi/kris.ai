name: TEMP P3 exact CI repair

on:
  push:
    branches:
      - 'agent/help/elastic-7d41b6a2/mission-003/p3-ci-repair'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Guard exact P3 repair base
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "a8a393a4dec833dda4c416f541e5a04e79452fcd"
          test "$(git rev-parse "$BASE:.github/workflows/p3-browser-runtime.yml")" = "546e0e4b4904ccabb6a49d11b796b3eb01e93f88"
          test "$(git rev-parse "$BASE:lib/product/browser/browser_runtime.dart")" = "4870d3e1375d3ec2316289996617a2b547d66ec8"
          test "$(git rev-parse "$BASE:lib/product/browser/browser_runtime_bundle.dart")" = "fe0fab1458c6da3daf7d778546b6c372cb03cf96"
          test "$(git rev-parse "$BASE:test/product/browser/browser_runtime_bundle_test.dart")" = "c3a92d1abe6a5cee4c5b08715331ccf3e58effad"
      - name: Resolve dependencies and materialize canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/product/browser/browser_runtime.dart \
            lib/product/browser/browser_runtime_bundle.dart \
            test/product/browser/browser_runtime_bundle_test.dart
      - name: Restore and patch governed P3 workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess
          base = 'a8a393a4dec833dda4c416f541e5a04e79452fcd'
          path = pathlib.Path('.github/workflows/p3-browser-runtime.yml')
          source = subprocess.check_output(
              ['git', 'show', f'{base}:.github/workflows/p3-browser-runtime.yml'],
              text=True,
              encoding='utf-8',
          )
          format_line = '          dart format lib/product/browser/*.dart test/product/browser/*.dart\n'
          if source.count(format_line) != 1:
              raise SystemExit('unexpected P3 formatter oracle shape')
          source = source.replace(
              format_line,
              '          flutter pub get\n' + format_line,
              1,
          )
          env_line = '          echo "BROWSER_EXEC=$BROWSER_EXEC" >> "$GITHUB_ENV"\n'
          if source.count(env_line) != 1:
              raise SystemExit('unexpected P3 browser executable export shape')
          source = source.replace(
              env_line,
              '          export BROWSER_EXEC\n' + env_line,
              1,
          )
          path.write_text(source, encoding='utf-8', newline='\n')
          PY
      - name: Verify exact repair envelope
        shell: bash
        run: |
          set -euo pipefail
          BASE="a8a393a4dec833dda4c416f541e5a04e79452fcd"
          dart format --output=none --set-exit-if-changed \
            lib/product/browser/browser_runtime.dart \
            lib/product/browser/browser_runtime_bundle.dart \
            test/product/browser/browser_runtime_bundle_test.dart
          git diff --check "$BASE"
          printf '%s\n' \
            '.github/workflows/p3-browser-runtime.yml' \
            'lib/product/browser/browser_runtime.dart' \
            'lib/product/browser/browser_runtime_bundle.dart' \
            'test/product/browser/browser_runtime_bundle_test.dart' \
            | sort > "$RUNNER_TEMP/expected-paths.txt"
          git diff --name-only "$BASE" | sort > "$RUNNER_TEMP/actual-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"
          grep -F '          flutter pub get' .github/workflows/p3-browser-runtime.yml
          grep -F '          export BROWSER_EXEC' .github/workflows/p3-browser-runtime.yml
      - name: Commit exact repair result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mission V1.5 P3 Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            .github/workflows/p3-browser-runtime.yml \
            lib/product/browser/browser_runtime.dart \
            lib/product/browser/browser_runtime_bundle.dart \
            test/product/browser/browser_runtime_bundle_test.dart
          git commit -m 'ci(p3): repair browser probe and canonical formatting'
          git push origin HEAD:agent/help/elastic-7d41b6a2/mission-003/p3-ci-repair
