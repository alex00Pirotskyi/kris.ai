name: P3-004 Locator Action Engine Materializer

on:
  push:
    branches:
      - 'agent/product/p3-004-locator-action-engine'
    paths:
      - '.github/workflows/p3-browser-runtime.yml'

permissions:
  contents: write

jobs:
  materialize:
    name: build-tested-locator-action-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install exact Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '24.18.0'
          check-latest: false
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Reuse immutable implementation patch, validate, and publish
        shell: bash
        env:
          BASE_COMMIT: 5456ff57409c75910bc9a1f51ef489bcebcda661
          PATCH_COMMIT: 7b0cf14ef939b3c8faeb77f0f7117a1b2577c845
          TARGET_BRANCH: agent/product/p3-004-locator-action-engine
        run: |
          set -euo pipefail
          git show "$PATCH_COMMIT:.github/workflows/p3-browser-runtime.yml" > "$RUNNER_TEMP/p3-004-original.yml"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import textwrap

          source = (Path(os.environ['RUNNER_TEMP']) / 'p3-004-original.yml').read_text(encoding='utf-8')
          start_token = "          python3 - <<'PY'\n"
          end_token = "\n          PY\n          git checkout \"$BASE_COMMIT\""
          start = source.index(start_token) + len(start_token)
          end = source.index(end_token, start)
          script = textwrap.dedent(source[start:end])
          old = "'  canonicalObservationJson,\\n  performPageAction,\\n"
          new = "'  canonicalObservationJson,\\n  createPageTelemetry,\\n  performPageAction,\\n"
          if script.count(old) != 1:
              raise SystemExit(f'expected one action-test import anchor, found {script.count(old)}')
          script = script.replace(old, new, 1)
          output = Path(os.environ['RUNNER_TEMP']) / 'p3-004-materialize.py'
          output.write_text(script, encoding='utf-8')
          PY
          python3 "$RUNNER_TEMP/p3-004-materialize.py"
          git checkout "$BASE_COMMIT" -- .github/workflows/p3-browser-runtime.yml
          npm ci --prefix automation_host --ignore-scripts --no-audit --no-fund
          npm test --prefix automation_host
          flutter pub get
          dart format \
            lib/product/browser/browser_runtime.dart \
            test/product/browser/browser_runtime_process_test.dart
          flutter test test/product/browser
          flutter analyze --fatal-infos --fatal-warnings
          git diff HEAD --check
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/p3-browser-runtime.yml',
              'automation_host/src/browser-runtime.mjs',
              'automation_host/src/browser-runtime.test.mjs',
              'lib/product/browser/browser_runtime.dart',
              'test/product/browser/browser_runtime_process_test.dart',
          }
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', 'HEAD', '--name-only'], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f'P3-004 scope mismatch actual={sorted(actual)} expected={sorted(expected)}'
              )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/p3-browser-runtime.yml \
            automation_host/src/browser-runtime.mjs \
            automation_host/src/browser-runtime.test.mjs \
            lib/product/browser/browser_runtime.dart \
            test/product/browser/browser_runtime_process_test.dart
          git diff --cached --check
          git commit -m 'feat(p3-004): add structured locator action engine'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
