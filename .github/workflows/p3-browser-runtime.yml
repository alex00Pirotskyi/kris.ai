name: P3 Browser Runtime

on:
  push:
    branches:
      - 'agent/c/mission-003-browser-runtime'
    paths:
      - '.github/workflows/p3-browser-runtime.yml'
      - 'lib/product/browser/**'
      - 'test/product/browser/**'
      - 'automation_host/**'
      - 'config/p3.browser-runtime-lock.json'
      - 'tool/p3_stage_browser_runtime_bundle.py'
      - 'tool/p3_stage_browser_runtime_bundle_test.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p3-browser-runtime.yml'
      - 'lib/product/browser/**'
      - 'test/product/browser/**'
      - 'automation_host/**'
      - 'config/p3.browser-runtime-lock.json'
      - 'tool/p3_stage_browser_runtime_bundle.py'
      - 'tool/p3_stage_browser_runtime_bundle_test.py'

permissions:
  contents: read

jobs:
  parent-format-oracle:
    name: parent-format-oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Require exact Dart formatting for all P3 parent sources
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/product/browser/*.dart test/product/browser/*.dart
          git diff --exit-code -- lib/product/browser test/product/browser

  node-contracts:
    name: node-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '24.18.0'
          check-latest: false
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - name: Verify exact P3 automation-host package closure
        shell: bash
        working-directory: automation_host
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'); if(p.version!=='2.0.0-p3.1'||p.dependencies['playwright-core']!=='1.61.1'||p.dependencies['node-pty']!=='1.1.0') process.exit(1)"
          npm ls --all --json
          npm test
          git diff --exit-code -- package.json package-lock.json

  browser-lock-oracle:
    name: browser-lock-oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '24.18.0'
          check-latest: false
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - name: Derive exact Chromium identity from installed playwright-core
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix automation_host --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('automation_host/package.json', 'utf8'));
          const browsers = JSON.parse(await readFile('automation_host/node_modules/playwright-core/browsers.json', 'utf8'));
          const chromium = browsers.browsers.find((row) => row.name === 'chromium');
          if (!chromium || !chromium.revision || !chromium.browserVersion) throw new Error('playwright Chromium identity missing');
          const lockBytes = await readFile('automation_host/package-lock.json');
          const lock = {
            schemaVersion: '1.0.0',
            nodeVersion: '24.18.0',
            automationHostPackageVersion: pkg.version,
            playwrightCoreVersion: pkg.dependencies['playwright-core'],
            packageLockSha256: createHash('sha256').update(lockBytes).digest('hex'),
            browserEngine: 'chromium',
            browserRevision: String(chromium.revision),
            browserVersion: String(chromium.browserVersion),
            browserInstallPhase: 'packaging_only',
            runtimeBrowserNetworkInstall: false,
            globalNodeRuntimeRequired: false,
          };
          if (lock.automationHostPackageVersion !== '2.0.0-p3.1' || lock.playwrightCoreVersion !== '1.61.1') throw new Error('P3 package identity drift');
          await mkdir('config', { recursive: true });
          await writeFile('config/p3.browser-runtime-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          console.log(JSON.stringify(lock, null, 2));
          NODE
      - name: Preserve machine-derived browser lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p3-browser-runtime-lock-${{ github.run_id }}
          path: config/p3.browser-runtime-lock.json
          if-no-files-found: error
          retention-days: 7
