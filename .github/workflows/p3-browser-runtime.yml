name: P3-002 Session Hardening Materializer

on:
  push:
    branches:
      - 'agent/product/p3-002-browser-session-service'
    paths:
      - '.github/workflows/p3-browser-runtime.yml'

permissions:
  contents: write

jobs:
  harden:
    name: harden-tested-product-source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install exact Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '24.18.0'
          check-latest: false
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply, repair, validate, and publish exact hardening
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_COMMIT: 9ed78d5bdc2a1f04f8fd3198d6b5e6ee5c03a94a
          TARGET_BRANCH: agent/product/p3-002-browser-session-service
          PATCH_SHA256: 1cca6f57a5b016f955c78fcdfabba6fdd4007fcc345734d92fe0c5df205d8c29
          PATCH_BLOBS: dcc2b12af914b0d3403a84cc024ea10614fc7ddb c972d2535f12421aa7e279bc46bf3b9dd878cf88 c1055f5a4e09b4bf3fe347e5f2c41ab2b7d22dd0 e58e5d11a5405e975e2e5a55203e4f1154f9eb06 30bd3809d2a013d95384bc566aa150647f2f7fcd 05784b7869a12ac76f92925cb0071a931e1f2472
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p3-002-hardening.py.b64'
          headers = {
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          with output.open('wb') as stream:
              for sha in os.environ['PATCH_BLOBS'].split():
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}",
                      headers=headers,
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  if payload.get('encoding') != 'base64':
                      raise SystemExit(f'blob {sha} did not use base64 encoding')
                  stream.write(base64.b64decode(payload['content']))
          PY
          base64 --decode "$RUNNER_TEMP/p3-002-hardening.py.b64" > "$RUNNER_TEMP/p3-002-hardening.py"
          echo "$PATCH_SHA256  $RUNNER_TEMP/p3-002-hardening.py" | sha256sum --check --strict
          python3 "$RUNNER_TEMP/p3-002-hardening.py"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('automation_host/src/browser-runtime.mjs')
          source = path.read_text(encoding='utf-8')
          start = source.index("  async openSession({ kind = 'ephemeral', profileId = null } = {}) {")
          end = source.index('\n  listSessions() {', start)
          replacement = r'''  async openSession({ kind = 'ephemeral', profileId = null } = {}) {
            await this.initialize();
            if (!SESSION_MODES.has(kind)) fail('browser_session_kind_invalid');
            if (this.sessions.size >= this.quotas.maxSessions) {
              fail('browser_session_quota_exceeded');
            }
            if (
              kind !== 'persistent' &&
              profileId !== null &&
              profileId !== undefined
            ) {
              fail('browser_ephemeral_profile_forbidden');
            }

            let storageState = null;
            let statePath = null;
            let profileDirectory = null;
            let existingProfile = false;
            let profileReserved = false;
            let context = null;

            if (kind === 'persistent') {
              assertIdentifier(profileId, PROFILE_ID, 'browser_profile_id_invalid');
              if (this.activePersistentProfiles.has(profileId)) {
                fail('browser_profile_in_use', profileId);
              }
              existingProfile = this.persistentProfiles.has(profileId);
              if (
                !existingProfile &&
                this.persistentProfiles.size >= this.quotas.maxPersistentProfiles
              ) {
                fail('browser_persistent_profile_quota_exceeded');
              }
              // Reserve before the first asynchronous filesystem or browser call so
              // concurrent opens cannot race the same persistent profile.
              this.activePersistentProfiles.add(profileId);
              profileReserved = true;
            }

            try {
              if (kind === 'persistent') {
                profileDirectory = childPath(
                  this.stateDirectory,
                  'profiles',
                  profileId,
                );
                await rejectSymlinkIfPresent(
                  profileDirectory,
                  'browser_profile_directory_symlink',
                );
                await mkdir(profileDirectory, { recursive: true, mode: 0o700 });
                statePath = childPath(profileDirectory, 'storage-state.json');
                storageState = await readStorageState(statePath);
              }

              // Identifiers are allocated only after all request/profile policy
              // checks pass. Rejected requests must have no observable ID side effect.
              const sessionId = this._nextId('session');
              if (this.sessions.has(sessionId)) fail('browser_session_id_collision');

              context = await this.browser.newContext({
                acceptDownloads: false,
                ...(storageState ? { storageState } : {}),
              });
              const session = {
                sessionId,
                kind,
                profileId: kind === 'persistent' ? profileId : null,
                statePath,
                context,
                pages: new Map(),
                createdAt: new Date().toISOString(),
              };
              this.sessions.set(sessionId, session);
              if (kind === 'persistent') {
                this.persistentProfiles.add(profileId);
                // The reservation remains active and is now owned by the tracked
                // session. Only successful tracked cleanup releases it.
                profileReserved = false;
              }
              return this._metadata(session);
            } catch (error) {
              if (context) {
                try {
                  await context.close();
                } catch {
                  // Preserve the primary open failure; no session was published.
                }
              }
              if (profileReserved) {
                this.activePersistentProfiles.delete(profileId);
              }
              if (kind === 'persistent' && !existingProfile && profileDirectory) {
                try {
                  await rm(profileDirectory, { recursive: true, force: true });
                } catch {
                  // Preserve the primary failure. A later initialization rejects
                  // unsafe symlinks and re-evaluates the durable profile inventory.
                }
              }
              throw error;
            }
          }
          '''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY
          git checkout "$BASE_COMMIT" -- .github/workflows/p3-browser-runtime.yml
          npm ci --prefix automation_host --ignore-scripts --no-audit --no-fund
          npm test --prefix automation_host
          flutter pub get
          dart format \
            lib/product/browser/browser_runtime.dart \
            test/product/browser/browser_runtime_process_test.dart
          flutter test test/product/browser
          flutter analyze --fatal-infos --fatal-warnings
          git diff HEAD --check
          python3 - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/p3-browser-runtime.yml',
              'automation_host/src/browser-runtime.mjs',
              'automation_host/src/browser-runtime.test.mjs',
              'lib/product/browser/browser_runtime.dart',
              'test/product/browser/browser_runtime_process_test.dart',
          }
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', 'HEAD', '--name-only'], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f'hardening scope mismatch actual={sorted(actual)} expected={sorted(expected)}'
              )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/p3-browser-runtime.yml \
            automation_host/src/browser-runtime.mjs \
            automation_host/src/browser-runtime.test.mjs \
            lib/product/browser/browser_runtime.dart \
            test/product/browser/browser_runtime_process_test.dart
          git diff --cached --check
          git commit -m 'fix(p3-002): harden session isolation and cleanup'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
