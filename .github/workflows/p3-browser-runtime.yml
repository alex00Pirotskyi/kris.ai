                ).toJson(),
                throwsA(isA<P3BrowserRuntimeException>()),
              );
              expect(
                () => P3BrowserActionResult.fromJson(<String, Object?>{
                  'sessionId': 'session_one',
                  'pageId': 'page_one',
                  'action': 'click',
                  'locatorStrategy': 'role',
                  'locatorIndex': 0,
                  'sensitiveInputProvided': false,
                  'beforeObservationHash': _hex('a', 64),
                  'afterObservationHash': _hex('a', 64),
                  'observationChanged': true,
                }),
                throwsA(isA<P3BrowserRuntimeException>()),
              );
            });
          '''
              close = dart_test.rfind('\n}')
              if close < 0:
                  raise SystemExit('Dart test main closing brace missing')
              dart_test = dart_test[:close] + insertion + dart_test[close:]
          dart_test_path.write_text(dart_test, encoding='utf-8')
