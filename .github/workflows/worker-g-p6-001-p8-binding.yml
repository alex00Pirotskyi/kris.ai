name: Worker G P6-001 P8 binding repair

on:
  push:
    branches:
      - agent/g/mission-006-model-routing
    paths:
      - '.github/workflows/worker-g-p6-001-p8-binding.yml'

permissions:
  contents: write

concurrency:
  group: worker-g-p6-001-p8-binding
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: agent/g/mission-006-model-routing
      EXPECTED_PARENT: 29436cbaa3512c1696b77fde8bfac656a74372df
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/g/mission-006-model-routing
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Require exact uncontended repair head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin "${BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${BRANCH})" = "${GITHUB_SHA}"
      - name: Add the missing P8 assurance binding and repair evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          hierarchy_path = Path('config/test_center_assurance_hierarchy.v1.json')
          hierarchy = json.loads(hierarchy_path.read_text(encoding='utf-8'))
          binding = {
              'testId': 'tc.p6.model-registry-v2',
              'levelId': 'unit',
              'rationale': (
                  'Exercises deterministic fail-closed registry behavior for identity, '
                  'limits, tool profile, data boundary, cost, benchmark evidence, and '
                  'evaluation-only defaults; source evidence remains capped at '
                  'SOURCE_FOUNDATION.'
              ),
          }
          bindings = hierarchy['testBindings']
          matches = [item for item in bindings if item.get('testId') == binding['testId']]
          if matches and matches != [binding]:
              raise SystemExit(f'conflicting P6 binding already exists: {matches!r}')
          if not matches:
              bindings.append(binding)
          hierarchy['testBindings'] = sorted(
              bindings,
              key=lambda item: item['testId'],
          )
          hierarchy_path.write_text(
              json.dumps(hierarchy, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          evidence_path = Path('release/evidence/P6-001/p8-binding-repair.json')
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(
              json.dumps(
                  {
                      'schemaVersion': 1,
                      'mission': 'MISSION-006',
                      'task': 'P6-001',
                      'coordinationId': 'MISSION-006-P6-001-TEST-CENTER',
                      'authorityMission': 'MISSION-002',
                      'failedCandidate': {
                          'commit': '29436cbaa3512c1696b77fde8bfac656a74372df',
                          'tree': '93bdeef167bc7d9b16a840f59edbc8220524d6b7',
                          'workflowRun': 31100733622,
                          'failure': (
                              'every canonical Test Center ID needs one hierarchy binding; '
                              "missing=['tc.p6.model-registry-v2']"
                          ),
                      },
                      'repair': {
                          'testId': binding['testId'],
                          'levelId': binding['levelId'],
                          'supportClaimCeiling': 'SOURCE_FOUNDATION',
                          'rationale': binding['rationale'],
                      },
                      'nonClaims': [
                          'component assurance',
                          'integration assurance',
                          'platform assurance',
                          'benchmark certification',
                          'release assurance',
                          'support promotion',
                      ],
                  },
                  indent=2,
                  ensure_ascii=False,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Validate canonical Test Center and P8 contracts
        shell: bash
        run: |
          set -euo pipefail
          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/test_center_contracts_test.py
          python tool/test_center_assurance_hierarchy.py check --project .
          python -m unittest -v tool/test_center_assurance_hierarchy_test.py
      - name: Remove repair workflow and refresh source manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/worker-g-p6-001-p8-binding.yml
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          git diff --check
      - name: Commit exact validated repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${BRANCH})" = "${GITHUB_SHA}"
          git add -A -- .
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(p6-001): bind model registry test to P8 unit assurance'
          git push origin "HEAD:${BRANCH}"
