name: Mission Delivery Enforcement

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  static-validation:
    name: mission-delivery-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Require exact source head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
      - name: Compile mission controls
        run: >-
          python -m py_compile
          tool/mission_control.py
          tool/mission_materialize_safe.py
          tool/mission_runtime_control.py
          tool/mission_runtime_model.py
          tool/mission_orchestrator.py
          tool/mission_delivery_lib.py
          tool/mission_delivery_checks.py
          tool/mission_delivery_live.py
          tool/mission_delivery_control.py
          tool/mission_delivery_strict.py
          tool/mission_delivery_control_test.py
          tool/mission_v15_regression_test.py
      - name: Run delivery regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tool/mission_delivery_control_test.py
          python tool/mission_v15_regression_test.py
      - name: Validate durable runtime and delivery control
        shell: bash
        run: |
          set -euo pipefail
          python tool/mission_materialize_safe.py --project . validate
          python tool/mission_runtime_control.py --project . validate
          python tool/mission_delivery_control.py --project . validate
          python tool/mission_delivery_strict.py --project . validate
          python tool/mission_materialize_safe.py --project . materialize --check
      - name: Generate canonical source-manifest candidate twice
        shell: bash
        run: |
          set -euo pipefail
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/SOURCE_MANIFEST.committed.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/SOURCE_MANIFEST.candidate.sha256"
          cp "${RUNNER_TEMP}/SOURCE_MANIFEST.committed.sha256" SOURCE_MANIFEST.sha256
          git diff --check
          test -z "$(git status --porcelain=v1)"
      - name: Upload exact manifest candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mission-delivery-manifest-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/SOURCE_MANIFEST.candidate.sha256
          if-no-files-found: error
          retention-days: 30

  ownership:
    if: github.event_name == 'pull_request'
    name: mission-delivery-ownership
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Require exact source head and base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}" || git fetch --no-tags origin "${BASE_SHA}"
      - name: Enforce append-only delivery history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python tool/mission_delivery_strict.py --project . append-only \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}"
      - name: Enforce actual changed-file ownership
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python tool/mission_delivery_control.py --project . ownership \
            --event-path "${GITHUB_EVENT_PATH}" \
            --head-branch "${HEAD_BRANCH}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --output "${RUNNER_TEMP}/mission-ownership.json"
      - name: Calculate scoped review impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python tool/mission_delivery_control.py --project . review-impact \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --output "${RUNNER_TEMP}/review-impact.json"
      - name: Upload ownership and review-impact reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mission-delivery-reports-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/mission-ownership.json
            ${{ runner.temp }}/review-impact.json
          if-no-files-found: error
          retention-days: 30
