name: Worker F MISSION-005 source recovery v3

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: worker-f-mission-005-source-recovery-v3
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Reconcile current Worker B ancestry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Worker F MISSION-005 Recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/b/test-center-contracts-and-review
          git merge --no-ff --no-commit FETCH_HEAD
      - name: Install governed Python dependencies
        shell: bash
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Materialize and reconcile P5-001 source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python tool/worker_f_recovery_bootstrap.py
          python tool/worker_f_recovery_test_patch.py
          python tool/worker_f_recovery_manifest_patch.py
          rm -f \
            .github/workflows/worker-f-mission-005-recovery-v2.yml \
            .github/workflows/worker-f-mission-005-recovery-v3.yml \
            tool/worker_f_recovery_source.yml \
            tool/worker_f_recovery_patch.py \
            tool/worker_f_recovery_bootstrap.py \
            tool/worker_f_recovery_test_patch.py \
            tool/worker_f_recovery_manifest_patch.py
      - name: Validate ordinary recovered candidate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/p5_ia_preview.dart lib/product/p5_information_architecture test/product/p5_information_architecture
          flutter analyze
          flutter test test/product/p5_information_architecture/
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/worker_f_p5_ia.py manifest --project .
          python tool/worker_f_p5_ia.py manifest --project . --check
          python tool/worker_f_p5_ia.py check --project .
          python tool/worker_f_p5_ia_test.py
          python tool/roadmap_control.py validate --project . --strict
          python tool/generated_state_guard.py audit --project . --strict
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/p5-source-manifest
          python tool/p1a_refresh_source_manifest.py .
          cmp /tmp/p5-source-manifest SOURCE_MANIFEST.sha256
          git diff --check
      - name: Create validated Git objects for publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          from __future__ import annotations
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          clean_base_tree = 'b8105ec18cc4feac33df325250aada84956719b2'
          skipped_exact = {
              'tool/worker_f_recovery_source.yml',
              'tool/worker_f_recovery_patch.py',
              'tool/worker_f_recovery_bootstrap.py',
              'tool/worker_f_recovery_test_patch.py',
              'tool/worker_f_recovery_manifest_patch.py',
              'tool/worker_f_p5_ia_template.py',
              'tool/worker_f_p5_ia_workflow_template.yml',
          }

          def skip(path: str) -> bool:
              return path.startswith('.github/workflows/') or path in skipped_exact

          def request(method: str, path: str, payload=None):
              body = None
              headers = {
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              if payload is not None:
                  body = json.dumps(payload).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(
                  f'{api}/{path}', data=body, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)

          parent = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          merge_parent = subprocess.check_output(
              ['git', 'rev-parse', 'MERGE_HEAD'], text=True
          ).strip()
          status = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', '-z', 'HEAD']
          )
          fields = status.split(b'\0')
          elements = []
          index = 0
          while index < len(fields) and fields[index]:
              code = fields[index].decode('utf-8')
              index += 1
              if code.startswith(('R', 'C')):
                  old_path = fields[index].decode('utf-8')
                  new_path = fields[index + 1].decode('utf-8')
                  index += 2
                  if skip(old_path) or skip(new_path):
                      continue
                  elements.append({
                      'path': old_path,
                      'mode': '100644',
                      'type': 'blob',
                      'sha': None,
                  })
                  path = new_path
              else:
                  path = fields[index].decode('utf-8')
                  index += 1
                  if skip(path):
                      continue
              if code.startswith('D'):
                  elements.append({
                      'path': path,
                      'mode': '100644',
                      'type': 'blob',
                      'sha': None,
                  })
                  continue
              stage = subprocess.check_output(
                  ['git', 'ls-files', '-s', '--', path], text=True
              ).strip()
              if not stage:
                  raise RuntimeError(f'missing index entry for {path}')
              mode = stage.split(' ', 1)[0]
              raw = Path(path).read_bytes()
              blob = request('POST', 'git/blobs', {
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              })
              elements.append({
                  'path': path,
                  'mode': mode,
                  'type': 'blob',
                  'sha': blob['sha'],
              })

          tree = request('POST', 'git/trees', {
              'base_tree': clean_base_tree,
              'tree': elements,
          })
          commit = request('POST', 'git/commits', {
              'message': 'P5-001: recover information architecture source candidate',
              'tree': tree['sha'],
              'parents': [parent, merge_parent],
          })
          print(f'WORKER_F_SOURCE_COMMIT={commit["sha"]}')
          print(f'WORKER_F_SOURCE_TREE={tree["sha"]}')
          print(f'WORKER_F_SOURCE_PARENT={parent}')
          print(f'WORKER_F_SOURCE_MERGE_PARENT={merge_parent}')
          print(f'WORKER_F_CHANGED_PATH_COUNT={len(elements)}')
          PY
