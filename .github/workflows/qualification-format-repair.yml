name: qualification-format-repair

on:
  push:
    branches:
      - integration/kristin-corrective-main-landing-20260903

permissions:
  contents: write

jobs:
  format:
    if: github.ref_name == 'integration/kristin-corrective-main-landing-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integration/kristin-corrective-main-landing-20260903
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply canonical handwritten Dart formatting
        shell: bash
        run: |
          python tool/dart_format_scope.py --write
          git diff --check
          git status --short
      - name: Commit formatting repair
        shell: bash
        run: |
          git add -A -- lib test tool/prune_stale_legacy.dart
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: apply canonical Dart formatting'
          git push origin HEAD:integration/kristin-corrective-main-landing-20260903
