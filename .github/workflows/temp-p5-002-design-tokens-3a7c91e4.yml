name: Temporary P5-002 design-token finalizer

on:
  push:
    branches:
      - agent/product/p5-002-design-tokens-3a7c91e4

permissions:
  contents: write

concurrency:
  group: temp-p5-002-design-tokens-3a7c91e4
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind detached checkout to exact Product branch
        run: git switch --force-create agent/product/p5-002-design-tokens-3a7c91e4 "$GITHUB_SHA"

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: config/p2.python-version
          check-latest: false

      - name: Install exact Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
          check-latest: false

      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Align temporary finalizer with current repository APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          finalizer = Path('tool/temp_p5_002_design_tokens_3a7c91e4.py')
          text = finalizer.read_text(encoding='utf-8')
          old = 'run("python3", "tool/dart_format_scope.py")'
          new = 'run("python3", "tool/dart_format_scope.py", "--write")'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one legacy formatter invocation')
          finalizer.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          tokens = Path('lib/product/p5_design_tokens.dart')
          source = tokens.read_text(encoding='utf-8')
          redundant = "import 'package:flutter/foundation.dart';\n"
          if source.count(redundant) != 1:
              raise SystemExit('expected exactly one redundant foundation import')
          tokens.write_text(source.replace(redundant, ''), encoding='utf-8', newline='\n')
          PY

      - name: Finalize, validate, and publish clean P5-002 candidate
        run: python3 tool/temp_p5_002_design_tokens_3a7c91e4.py
