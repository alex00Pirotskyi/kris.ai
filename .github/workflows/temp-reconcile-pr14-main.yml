name: TEMP Reconcile PR14 With Main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-reconcile-pr14-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.ref == 'ci/reconcile-pr14-main-trigger' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: merge/p1-p2-owner-risk-qa-preview
      EXPECTED_TARGET_HEAD: eb12a6b45d86f83a87eb30c4cb66e99f773c3054
      BASELINE_MAIN: 00c64af6b0aea27c3b643379c834950d87341eed
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      PROMOTION_RUN_ID: '30938113426'
      PROMOTION_WORKFLOW_NAME: P1 P2 Owner-Risk Promotion V71-R12
      PROMOTION_BRANCH: integration/p2-owner-risk-v71r12
      PRESERVE_PATH: .github/workflows/p1-p2-owner-risk-promotion-v71r12.yml
    steps:
      - name: Check out exact P1/P2 landing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: true
          path: target

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false

      - name: Verify exact successful tri-platform promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROMOTION_RUN_ID" > "$RUNNER_TEMP/promotion-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROMOTION_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/promotion-jobs.json"
          python - "$RUNNER_TEMP/promotion-run.json" "$RUNNER_TEMP/promotion-jobs.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          jobs = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))['jobs']
          expected = {
              'id': int(os.environ['PROMOTION_RUN_ID']),
              'name': os.environ['PROMOTION_WORKFLOW_NAME'],
              'event': 'workflow_dispatch',
              'status': 'completed',
              'conclusion': 'success',
              'head_branch': os.environ['PROMOTION_BRANCH'],
              'head_sha': os.environ['EXPECTED_TARGET_HEAD'],
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f'promotion {key} mismatch: {run.get(key)!r} != {value!r}')
          required = {
              'owner-risk-windows',
              'owner-risk-macos',
              'owner-risk-linux',
              'tri-platform-gate',
          }
          observed = {
              row['name']
              for row in jobs
              if row.get('status') == 'completed' and row.get('conclusion') == 'success'
          }
          missing = sorted(required - observed)
          if missing:
              raise SystemExit(f'promotion jobs missing successful completion: {missing}')
          for name in sorted(required):
              matches = [row for row in jobs if row.get('name') == name]
              if len(matches) != 1:
                  raise SystemExit(f'promotion job count mismatch for {name}: {len(matches)}')
              print(f'PROMOTION_JOB={name} ID={matches[0]["id"]} CONCLUSION=success')
          print(f'PROMOTION_RUN_ID={run["id"]}')
          print(f'PROMOTION_UPDATED_AT={run["updated_at"]}')
          PY

      - name: Verify exact branch heads and preserve the validated workflow
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config core.autocrlf false
          git fetch origin main "$TARGET_BRANCH"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET_HEAD"
          test "$(git rev-parse origin/main)" = "$EVENT_BASE"
          git merge-base --is-ancestor "$BASELINE_MAIN" "$EVENT_BASE"
          test -f "$PRESERVE_PATH"
          test -z "$(git status --porcelain)"
          preserve_sha="$(sha256sum "$PRESERVE_PATH" | awk '{print $1}')"
          echo "PRESERVE_SHA=$preserve_sha" >> "$GITHUB_ENV"
          echo "MAIN_HEAD=$EVENT_BASE" >> "$GITHUB_ENV"
          echo "PRESERVE_SHA=$preserve_sha"
          echo "MAIN_HEAD=$EVENT_BASE"

      - name: Reconcile current main into PR14 and refresh governed inventory
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'Kristin CI Reconciler'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-ff --no-commit "$MAIN_HEAD" > "$RUNNER_TEMP/pr14-main-merge.log" 2>&1
          merge_rc=$?
          set -e
          cat "$RUNNER_TEMP/pr14-main-merge.log"

          if [ "$merge_rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | LC_ALL=C sort)
            printf 'MERGE_CONFLICT=%s\n' "${conflicts[@]}"
            test "${#conflicts[@]}" -eq 1
            test "${conflicts[0]}" = "$PRESERVE_PATH"
            git checkout --ours -- "$PRESERVE_PATH"
            git add "$PRESERVE_PATH"
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(sha256sum "$PRESERVE_PATH" | awk '{print $1}')" = "$PRESERVE_SHA"
          grep -Fx 'name: P1 P2 Owner-Risk Promotion V71-R12' "$PRESERVE_PATH"
          grep -F 'workflow_dispatch:' "$PRESERVE_PATH"
          grep -F 'name: owner-risk-${{ matrix.platform }}' "$PRESERVE_PATH"
          grep -F 'name: tri-platform-gate' "$PRESERVE_PATH"

          for required_path in \
            .github/workflows/temp-p2-python-lock-refresh.yml \
            .github/workflows/temp-dispatch-p1-p2-promotion.yml \
            .github/workflows/temp-observe-p1-p2-promotion.yml \
            .github/workflows/temp-reconcile-pr14-main.yml; do
            test -f "$required_path"
          done

          python tool/p2_refresh_source_manifest.py .
          python tool/p2_source_inventory_test.py --project .
          python tool/benchmark_runner.py check --project .
          python tool/v71r12_bootstrap_hosted_python.py --project . --validate-only
          git diff --check
          git add -A
          git diff --cached --check

      - name: Commit and push the deterministic two-parent reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'Kristin CI Reconciler'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'merge: reconcile validated P1/P2 with current main'
          reconciled_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_TARGET_HEAD"
          test "$(git rev-parse HEAD^2)" = "$MAIN_HEAD"
          test "$(sha256sum "$PRESERVE_PATH" | awk '{print $1}')" = "$PRESERVE_SHA"
          git push origin "$reconciled_commit:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$reconciled_commit"
          echo "RECONCILED_PR14_COMMIT=$reconciled_commit"
          echo "RECONCILED_PR14_PARENT=$EXPECTED_TARGET_HEAD"
          echo "RECONCILED_MAIN_PARENT=$MAIN_HEAD"
