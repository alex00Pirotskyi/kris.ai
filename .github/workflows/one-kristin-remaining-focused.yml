name: One Kristin Remaining Focused

on:
  push:
    branches:
      - draft/one-kristin-development
    paths:
      - tool/prep_one_kristin_remaining.py
      - tool/apply_one_kristin_remaining.py
      - tool/fix_one_kristin_remaining_patch.py
      - .github/workflows/one-kristin-remaining-focused.yml

permissions:
  contents: write

concurrency:
  group: one-kristin-remaining-focused-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Apply remaining One Kristin integration
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/one-kristin-apply.log
          python tool/prep_one_kristin_remaining.py 2>&1 | tee -a /tmp/one-kristin-apply.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            python tool/apply_one_kristin_remaining.py 2>&1 | tee -a /tmp/one-kristin-apply.log
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            python tool/fix_one_kristin_remaining_patch.py 2>&1 | tee -a /tmp/one-kristin-apply.log
            status=${PIPESTATUS[0]}
          fi
          exit "$status"
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: one-kristin-focused-debug-${{ github.sha }}
          path: /tmp/one-kristin-apply.log
          if-no-files-found: warn
      - name: Format focused Dart surface
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/product/chat_control_plane.dart \
            lib/product/chat_control_plane_studio.dart \
            lib/product/chat_control_plane_studio_actions.dart \
            lib/product/chat_studio.dart \
            lib/product/utility_time.dart \
            lib/product/task_kernel/semantic_steering.dart \
            test/product/chat_time_capability_test.dart \
            test/product/one_kristin_advanced_source_contract_test.dart \
            test/product/utility_time_test.dart \
            test/product/task_kernel/semantic_steering_test.dart
      - name: Resolve and bind package lock deterministically
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          path = root / 'config/toolchains.lock.json'
          manifest = json.loads(path.read_text(encoding='utf-8'))
          lock_sha = hashlib.sha256((root / 'pubspec.lock').read_bytes()).hexdigest()
          for entry in manifest['lockfiles']:
              if entry['path'] == 'pubspec.lock':
                  entry['sha256'] = lock_sha
          payload = {
              'schemaVersion': manifest['schemaVersion'],
              'sourceCommit': manifest['sourceCommit'],
              'python': manifest['python'],
              'flutter': manifest['flutter'],
              'dart': manifest['dart'],
              'githubActions': manifest['githubActions'],
              'runners': manifest['runners'],
              'cache': manifest['cache'],
              'lockfiles': manifest['lockfiles'],
          }
          canonical = (json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n').encode()
          manifest['declaredInputFingerprint'] = hashlib.sha256(canonical).hexdigest()
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          python tool/p2_extend_toolchain_lock.py --project .
          python tool/toolchain_lock_test.py --source-only
      - name: Fatal analyzer
        shell: bash
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos
      - name: Focused One Kristin contracts
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 \
            test/product/chat_time_capability_test.dart \
            test/product/one_kristin_advanced_source_contract_test.dart \
            test/product/utility_time_test.dart \
            test/product/chat_action_dispatcher_test.dart \
            test/product/kernel_task_graph_executor_test.dart \
            test/product/kristin_conversation_session_test.dart \
            test/product/task_kernel/capability_authority_compile_test.dart \
            test/product/task_kernel/task_family_executor_test.dart \
            test/product/task_kernel/task_specification_patch_test.dart \
            test/product/task_kernel/task_specification_patch_classifier_test.dart \
            test/product/task_kernel/semantic_steering_test.dart
      - name: Commit verified source and self-clean verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/prep_one_kristin_remaining.py
          rm -f tool/apply_one_kristin_remaining.py
          rm -f tool/fix_one_kristin_remaining_patch.py
          rm -f .github/workflows/one-kristin-remaining-focused.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(kristin): complete remaining convergence wiring"
          git push origin HEAD:draft/one-kristin-development
