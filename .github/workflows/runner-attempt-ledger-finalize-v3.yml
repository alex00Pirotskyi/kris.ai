name: runner-attempt-ledger-finalize-v3

on:
  push:
    branches:
      - hotfix/runner-attempt-ledger-v3-isolated
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hotfix/runner-attempt-ledger-v3-isolated
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Bind finalizer to normalized decision fingerprints
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tool/runner_attempt_ledger_finalize.py')
          text = path.read_text(encoding='utf-8')
          old = "      final decisionSha256 = Sha256.text(generation.text);"
          new = "      final decisionSha256 = attemptLedgerPolicy.decisionSha256(generation.text);"
          assert text.count(old) == 1, 'decision fingerprint patch marker changed'
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Apply coordinated runner hotfix
        run: python tool/runner_attempt_ledger_finalize.py

      - name: Generate reviewed workflow migrations
        run: python tool/generate_workflow_migrations.py

      - name: Format hotfix sources
        run: >-
          dart format
          lib/product/planning_runtime.dart
          lib/product/durable_workflow.dart
          lib/product/runner_attempt_ledger.dart
          test/product/runner_attempt_ledger_test.dart
          test/product/durable_workflow_kernel_test.dart

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Check generated migrations
        run: python tool/generate_workflow_migrations.py --check

      - name: Check durable workflow kernel
        run: python tool/workflow_kernel_test.py --project .

      - name: Check scoped Dart formatting
        run: python tool/dart_format_scope.py --check

      - name: Analyze hotfix
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos

      - name: Run runner and durability regressions
        run: >-
          flutter test --no-pub --concurrency=1 --reporter expanded
          test/product/runner_attempt_ledger_test.dart
          test/product/durable_workflow_kernel_test.dart
          test/product/execution_reliability_test.dart
          test/product/budget_diagnostics_test.dart

      - name: Remove one-shot finalizer
        run: |
          git rm tool/runner_attempt_ledger_finalize.py
          git rm .github/workflows/runner-attempt-ledger-finalize-v3.yml
          test ! -e tool/runner_attempt_ledger_finalize.py
          test ! -e .github/workflows/runner-attempt-ledger-finalize-v3.yml

      - name: Run offline system gate on final product tree
        run: python tool/system_test.py --project .

      - name: Validate final diff
        run: git diff --check

      - name: Commit qualified hotfix
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(runner): prune repeated action branches"
          git push origin HEAD:hotfix/runner-attempt-ledger-v3-isolated
