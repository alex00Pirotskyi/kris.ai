name: P5-009 controller diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p5-009-controller-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Replay bounded P5-009 transforms and print controller evidence lines
        shell: bash
        run: |
          set -euo pipefail
          python .repo-p5-009-finalize.py
          python .repo-p5-009-test-fix.py
          python .repo-p5-009-structure-fix.py
          python .repo-p5-009-integration-fix.py
          echo '--- selectedEvidenceId lines ---'
          grep -n -C 3 'selectedEvidenceId' lib/product/p5_information_architecture/p5_controller.dart || true
          echo '--- compiler neighborhood ---'
          nl -ba lib/product/p5_information_architecture/p5_controller.dart | sed -n '645,675p'
