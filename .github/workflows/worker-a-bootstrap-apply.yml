name: Worker A Bootstrap Apply

on:
  push:
    branches:
      - agent/a/p1-p2-new-roadmap-execution

permissions:
  contents: write

concurrency:
  group: worker-a-bootstrap-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Reconstruct reviewed non-workflow integration files
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, pathlib
          root = pathlib.Path('.')
          mapping = {
              '.worker-a-bootstrap/registry.b64gz': ('config/test_center_registry.v1.json', 'fe788e6d18184d26b5f1e528f045a2fba14d7ea5ff895391c0d33f61451e2fda'),
              '.worker-a-bootstrap/adapter.b64gz': ('tool/worker_a_test_center_v1.py', '03d504a4220ae6296a423cd7b88402d0911204e566fa26471e95bfe0a3170e33'),
              '.worker-a-bootstrap/tests.b64gz': ('tool/worker_a_test_center_v1_test.py', '63db4b6e06f8238af388c265e41d329130f1c0125b1f4407f949b77a4d557303'),
              '.worker-a-bootstrap/rationales.b64gz': ('release/evidence/worker-a/test-center-v1/affected-mapping-rationales.json', 'a51ea1706d56739033d9e4d4030ca2fbda4ae91786bff4b8bb2202ead9e2b26f'),
              '.worker-a-bootstrap/progress.b64gz': ('docs/roadmap/progress/2026-08-05-worker-a-canonical-test-center-integration.md', 'ab2f7735120a1c310949aa7ae7ed16d6866594afec32bd287f323065087ab92e'),
          }
          for source, (target, expected) in mapping.items():
              data = gzip.decompress(base64.b64decode((root / source).read_text(encoding='ascii').strip()))
              observed = hashlib.sha256(data).hexdigest()
              if observed != expected:
                  raise SystemExit(f'{source}: sha256 {observed} != {expected}')
              path = root / target
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          PY
          rm -f \
            .worker-a-bootstrap/registry.b64gz \
            .worker-a-bootstrap/adapter.b64gz \
            .worker-a-bootstrap/tests.b64gz \
            .worker-a-bootstrap/rationales.b64gz \
            .worker-a-bootstrap/progress.b64gz
          git diff --check
      - name: Commit reconstructed non-workflow integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(worker-a): integrate canonical Test Center v1 records'
          git push origin HEAD:agent/a/p1-p2-new-roadmap-execution
