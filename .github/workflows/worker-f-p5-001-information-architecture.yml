name: Worker F P5-001 Information Architecture

on:
  push:
    branches:
      - 'agent/help/*/mission-005/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-f-p5-001-diagnostic-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows P5-001 diagnostic verification
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Confirm exact candidate identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - name: Set up locked Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Install governed Python dependencies
        shell: bash
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Resolve Flutter dependencies
        shell: bash
        run: flutter pub get
      - name: Validate authority and Worker F records
        shell: bash
        run: |
          set -euo pipefail
          python tool/roadmap_control.py validate --project . --strict
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python test/product/p5_information_architecture/worker_f_p5_ia.py manifest --project .
          python test/product/p5_information_architecture/worker_f_p5_ia.py check --project .
          python test/product/p5_information_architecture/worker_f_p5_ia_test.py
      - name: Check scoped Dart formatting
        shell: bash
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/product/p5_information_architecture
          test/product/p5_information_architecture
      - name: Analyze Flutter source
        shell: bash
        run: flutter analyze
      - name: Run P5-001 tests
        shell: bash
        run: flutter test test/product/p5_information_architecture/
      - name: Run affected shipped-shell tests when present
        shell: bash
        run: |
          set -euo pipefail
          affected_tests="$RUNNER_TEMP/p5-affected-shipped-shell-tests.txt"
          find test -type f \( -iname '*p2_app_shell*test.dart' -o -iname '*p2_owner*test.dart' -o -iname '*chat_studio*test.dart' \) -print | sort > "$affected_tests"
          while IFS= read -r test_path; do
            if [[ -n "$test_path" ]]; then
              flutter test "$test_path"
            fi
          done < "$affected_tests"
      - name: Verify source-manifest determinism without materializing helper root manifest
        shell: bash
        run: |
          set -euo pipefail
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest-before"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest-first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest-first" SOURCE_MANIFEST.sha256
          cp "$RUNNER_TEMP/source-manifest-before" SOURCE_MANIFEST.sha256
      - name: Verify generated-state and scoped artifact hygiene
        shell: bash
        run: |
          set -euo pipefail
          python tool/generated_state_guard.py audit --project . --strict
          git diff --check
          git diff --exit-code -- \
            lib/product/p5_information_architecture \
            test/product/p5_information_architecture \
            release/evidence/P5-001/manifest.json \
            SOURCE_MANIFEST.sha256
      - name: Diagnose and preserve final non-mutation gate
        shell: bash
        run: |
          set -uo pipefail
          diff_rc=0
          git diff --exit-code || diff_rc=$?
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' 'WORKTREE_STATUS_BEGIN'
          printf '%s\n' "$status"
          printf '%s\n' 'WORKTREE_STATUS_END'
          git diff --no-ext-diff || true
          test "$diff_rc" -eq 0
          test -z "$status"
