name: Worker F P5-001 Information Architecture

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture
  pull_request:
    branches:
      - agent/b/test-center-contracts-and-review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-f-p5-001-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os_name }} P5-001 verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            os_name: Ubuntu
          - os: windows-2025
            os_name: Windows
          - os: macos-15
            os_name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Confirm exact candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Set up locked Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Install governed Python dependencies
        shell: bash
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Resolve Flutter dependencies
        shell: bash
        run: flutter pub get
      - name: Materialize canonical Dart formatting
        shell: bash
        run: >-
          dart format
          lib/p5_ia_preview.dart
          lib/product/p5_information_architecture
          test/product/p5_information_architecture
      - name: Verify formatter idempotence
        shell: bash
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/p5_ia_preview.dart
          lib/product/p5_information_architecture
          test/product/p5_information_architecture
      - name: Upload canonical formatted P5 source and tests
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p5-001-formatted-source-${{ github.sha }}
          path: |
            lib/p5_ia_preview.dart
            lib/product/p5_information_architecture
            test/product/p5_information_architecture
          if-no-files-found: error
          retention-days: 30
      - name: Validate authority and dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          python tool/roadmap_control.py validate --project . --strict
          python - <<'PY'
          import json
          from pathlib import Path
          roadmap=json.loads(Path('docs/roadmap/roadmap.yaml').read_text(encoding='utf-8'))
          tasks={item['id']:item for item in roadmap['tasks']}
          if tasks.get('P0-008',{}).get('status') != 'DONE':
              raise SystemExit('P0-008 is not DONE in bootstrap authority')
          master=Path('docs/roadmap/MASTER.md').read_text(encoding='utf-8')
          if 'P5-001' not in master:
              raise SystemExit('P5-001 is absent from human roadmap authority')
          PY
      - name: Generate and validate canonical P5 records
        shell: bash
        run: |
          set -euo pipefail
          cp release/evidence/P5-001/manifest.json "$RUNNER_TEMP/p5-manifest-before.json"
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python test/product/p5_information_architecture/worker_f_p5_ia.py manifest --project .
          python test/product/p5_information_architecture/worker_f_p5_ia.py check --project .
          python test/product/p5_information_architecture/worker_f_p5_ia_test.py
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          checker='test/product/p5_information_architecture/worker_f_p5_ia.py'
          forward=subprocess.check_output([
              'python',checker,'select','--project','.',
              'lib/product/p5_information_architecture/p5_models.dart',
              'test/product/p5_information_architecture/p5_accessibility_test.dart',
          ],text=True).strip()
          reverse=subprocess.check_output([
              'python',checker,'select','--project','.',
              'test/product/p5_information_architecture/p5_accessibility_test.dart',
              'lib/product/p5_information_architecture/p5_models.dart',
          ],text=True).strip()
          if forward != reverse:
              raise SystemExit('affected selection is input-order dependent')
          manifest=pathlib.Path('release/evidence/P5-001/manifest.json')
          receipt={
              'schemaVersion':1,
              'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'manifestSha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
              'sizeBytes':manifest.stat().st_size,
              'generatedBy':checker + ' manifest --project .',
          }
          pathlib.Path(os.environ['RUNNER_TEMP'],'p5-manifest-receipt.json').write_text(
              json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - name: Upload canonical P5 evidence-manifest candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p5-001-evidence-manifest-${{ github.sha }}
          path: |
            release/evidence/P5-001/manifest.json
            ${{ runner.temp }}/p5-manifest-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Analyze Flutter source
        shell: bash
        run: flutter analyze
      - name: Run P5-001 widget, state, keyboard, semantics, and boundary tests
        shell: bash
        run: flutter test test/product/p5_information_architecture/
      - name: Run affected shipped-shell tests when present
        shell: bash
        run: |
          set -euo pipefail
          affected_tests="$RUNNER_TEMP/p5-affected-shipped-shell-tests.txt"
          find test -type f \( \
            -iname '*p2_app_shell*test.dart' -o \
            -iname '*p2_owner*test.dart' -o \
            -iname '*chat_studio*test.dart' \
          \) -print | sort > "$affected_tests"
          while IFS= read -r test_path; do
            if [[ -n "$test_path" ]]; then
              flutter test "$test_path"
            fi
          done < "$affected_tests"
      - name: Regenerate root source manifest twice through canonical owner
        shell: bash
        run: |
          set -euo pipefail
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest-before"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest-first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest-first" SOURCE_MANIFEST.sha256
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          manifest=pathlib.Path('SOURCE_MANIFEST.sha256')
          first=pathlib.Path(os.environ['RUNNER_TEMP'],'source-manifest-first')
          receipt={
              'schemaVersion':1,
              'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'manifestSha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
              'firstPassSha256':hashlib.sha256(first.read_bytes()).hexdigest(),
              'byteIdentical':first.read_bytes()==manifest.read_bytes(),
          }
          pathlib.Path(os.environ['RUNNER_TEMP'],'p5-source-manifest-receipt.json').write_text(
              json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - name: Upload canonical source-manifest candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p5-001-source-manifest-${{ github.sha }}
          path: |
            SOURCE_MANIFEST.sha256
            ${{ runner.temp }}/source-manifest-first
            ${{ runner.temp }}/p5-source-manifest-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify generated-state hygiene
        shell: bash
        run: |
          set -euo pipefail
          python tool/generated_state_guard.py audit --project . --strict
          git diff --check
      - name: Verify committed generated artifacts and formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            lib/p5_ia_preview.dart \
            lib/product/p5_information_architecture \
            test/product/p5_information_architecture \
            release/evidence/P5-001/manifest.json \
            SOURCE_MANIFEST.sha256
      - name: Verify final non-mutation hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
