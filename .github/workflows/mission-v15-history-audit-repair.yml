name: Mission V1.5 Historical Runtime Audit Repair

on:
  push:
    branches:
      - agent/mission-execution-v15-gold
    paths:
      - '.github/workflows/mission-v15-history-audit-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mission-execution-v15-gold
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Apply bounded historical-audit repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          model_path = Path('tool/mission_runtime_model.py')
          text = model_path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'import datetime as dt\nimport json\nimport pathlib\nfrom typing import Any\n',
              'import datetime as dt\nimport json\nimport pathlib\nimport re\nimport subprocess\nfrom typing import Any\n',
              'imports',
          )

          audit_work = r'''
          def _audit_git_binding(
              project: pathlib.Path,
              base_commit: Any,
              base_tree: Any,
              label: str,
          ) -> None:
              """Validate durable Git identity without requiring retired refs to remain reachable."""
              for value, key in ((base_commit, "baseCommit"), (base_tree, "baseTree")):
                  if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value):
                      raise ValueError(
                          f"{label} {key} must be a full lowercase Git object id; got {value!r}"
                      )
              probe = subprocess.run(
                  ["git", "-C", str(project), "cat-file", "-e", f"{base_commit}^{{commit}}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if probe.returncode != 0:
                  return
              tree = subprocess.run(
                  ["git", "-C", str(project), "rev-parse", f"{base_commit}^{{tree}}"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              if tree.returncode != 0:
                  raise ValueError(
                      f"{label} locally available baseCommit cannot resolve its tree: {base_commit}"
                  )
              actual_tree = tree.stdout.strip()
              if actual_tree != base_tree:
                  raise ValueError(
                      f"{label} baseCommit/baseTree mismatch: {base_commit} -> {actual_tree}, "
                      f"recorded {base_tree}"
                  )


          def _audit_non_authoritative_work_order(
              project: pathlib.Path,
              item: dict[str, Any],
          ) -> None:
              """Audit terminal/planning history without replaying today's mutable authority policy."""
              required = {
                  "schemaVersion", "workOrderId", "mission", "roadmapTask",
                  "parentProductPr", "priority", "type", "objective", "requestedRole",
                  "allowedPaths", "baseCommit", "baseTree", "dependencyRequirements",
                  "requiredTests", "maxChildWorkOrders", "status", "createdBy", "createdAt",
              }
              missing = sorted(required - set(item))
              if missing:
                  raise ValueError(f"historical Work Order missing fields: {missing}")
              if item["schemaVersion"] != 1:
                  raise ValueError("historical Work Order schemaVersion must be 1")
              if item.get("status") not in WORK_ORDER_STATES or item.get("status") in ACTIVE_WORK:
                  raise ValueError(
                      f"historical Work Order has invalid audit status: {item.get('status')}"
                  )
              for key in (
                  "workOrderId", "mission", "roadmapTask", "type", "objective",
                  "requestedRole", "createdBy",
              ):
                  if not isinstance(item.get(key), str) or not item[key]:
                      raise ValueError(f"historical Work Order {key} must be a non-empty string")
              parent_pr = item.get("parentProductPr")
              if parent_pr is not None and parent_pr != 0 and (
                  not isinstance(parent_pr, int) or isinstance(parent_pr, bool) or parent_pr <= 0
              ):
                  raise ValueError(
                      "historical Work Order parentProductPr must be null, 0, or positive integer"
                  )
              if not isinstance(item.get("priority"), int) or isinstance(item.get("priority"), bool):
                  raise ValueError("historical Work Order priority must be an integer")
              if (
                  not isinstance(item.get("maxChildWorkOrders"), int)
                  or isinstance(item.get("maxChildWorkOrders"), bool)
                  or item["maxChildWorkOrders"] < 0
              ):
                  raise ValueError(
                      "historical Work Order maxChildWorkOrders must be a non-negative integer"
                  )
              allowed = item.get("allowedPaths")
              if not isinstance(allowed, list) or not allowed or not all(
                  isinstance(path, str) and path for path in allowed
              ):
                  raise ValueError("historical Work Order allowedPaths must be non-empty strings")
              dependencies = item.get("dependencyRequirements")
              if not isinstance(dependencies, list) or not all(
                  (isinstance(value, str) and value) or isinstance(value, dict)
                  for value in dependencies
              ):
                  raise ValueError(
                      "historical Work Order dependencyRequirements must be an audit list"
                  )
              if not isinstance(item.get("requiredTests"), list):
                  raise ValueError("historical Work Order requiredTests must be an array")
              parent_id = item.get("parentWorkOrderId")
              if parent_id is not None and not isinstance(parent_id, str):
                  raise ValueError("historical Work Order parentWorkOrderId must be null or string")
              _audit_git_binding(
                  project,
                  item.get("baseCommit"),
                  item.get("baseTree"),
                  f"historical Work Order {item['workOrderId']}",
              )
              parse_time(item["createdAt"])
              if item.get("updatedAt"):
                  parse_time(item["updatedAt"])
          '''.strip('\n') + '\n\n\n'
          text = replace_once(
              text,
              '\n\ndef validate_delegation_graph(work_orders: dict[str, dict[str, Any]]) -> None:\n',
              '\n\n' + audit_work + 'def validate_delegation_graph(work_orders: dict[str, dict[str, Any]]) -> None:\n',
              'work-order audit insertion',
          )
          text = replace_once(
              text,
              '        if (\n            parent["mission"] != item["mission"]\n            or parent["roadmapTask"] != item["roadmapTask"]\n            or parent["parentProductPr"] != item["parentProductPr"]\n        ):\n',
              '        if item.get("status") in ACTIVE_WORK and (\n            parent["mission"] != item["mission"]\n            or parent["roadmapTask"] != item["roadmapTask"]\n            or parent["parentProductPr"] != item["parentProductPr"]\n        ):\n',
              'delegation authority rule',
          )
          old_budget = '            and child.get("status") not in {"CANCELLED", "SUPERSEDED"}\n'
          if text.count(old_budget) != 2:
              raise SystemExit(
                  f"child budget: expected exactly two legacy filters, found {text.count(old_budget)}"
              )
          text = text.replace(old_budget, '            and child.get("status") in ACTIVE_WORK\n')

          audit_sem = r'''
          def _audit_inactive_semaphore(
              project: pathlib.Path,
              item: dict[str, Any],
              work_orders: dict[str, dict[str, Any]],
          ) -> None:
              """Audit non-authoritative semaphore history without current policy replay."""
              required = {
                  "schemaVersion", "semaphoreId", "kind", "workOrderId", "mission",
                  "workerIdentity", "executionRole", "baseCommit", "baseTree",
                  "allowedPaths", "createdAt", "refreshedAt", "expiresAt",
                  "runtimeGeneration", "status",
              }
              missing = sorted(required - set(item))
              if missing:
                  raise ValueError(f"historical semaphore missing fields: {missing}")
              if item["schemaVersion"] != 1 or item.get("status") not in SEMAPHORE_STATES:
                  raise ValueError("invalid historical semaphore schema/status")
              for key in (
                  "semaphoreId", "kind", "workOrderId", "mission",
                  "workerIdentity", "executionRole",
              ):
                  if not isinstance(item.get(key), str) or not item[key]:
                      raise ValueError(f"historical semaphore {key} must be a non-empty string")
              work = work_orders.get(item["workOrderId"])
              if work is None:
                  raise ValueError(
                      f"historical semaphore references unknown Work Order {item['workOrderId']}"
                  )
              if item["mission"] != work.get("mission"):
                  raise ValueError("historical semaphore mission differs from Work Order mission")
              if not isinstance(item.get("allowedPaths"), list) or not all(
                  isinstance(path, str) and path for path in item["allowedPaths"]
              ):
                  raise ValueError("historical semaphore allowedPaths must contain strings")
              if (
                  not isinstance(item.get("runtimeGeneration"), int)
                  or isinstance(item.get("runtimeGeneration"), bool)
                  or item["runtimeGeneration"] < 0
              ):
                  raise ValueError(
                      "historical semaphore runtimeGeneration must be non-negative integer"
                  )
              _audit_git_binding(
                  project,
                  item.get("baseCommit"),
                  item.get("baseTree"),
                  f"historical semaphore {item['semaphoreId']}",
              )
              created, refreshed, expires = map(
                  parse_time,
                  (item["createdAt"], item["refreshedAt"], item["expiresAt"]),
              )
              if refreshed < created or expires <= refreshed:
                  raise ValueError("historical semaphore timestamp ordering invalid")
          '''.strip('\n') + '\n\n\n'
          text = replace_once(
              text,
              '\n\ndef load_semaphores(\n',
              '\n\n' + audit_sem + 'def load_semaphores(\n',
              'semaphore audit insertion',
          )
          text = replace_once(
              text,
              '        validate_semaphore(project, item, work_orders, product_prs)\n        all_items.append(item)\n        if _active(item, now):\n',
              '        is_active = _active(item, now)\n        if is_active:\n            validate_semaphore(project, item, work_orders, product_prs)\n        else:\n            _audit_inactive_semaphore(project, item, work_orders)\n        all_items.append(item)\n        if is_active:\n',
              'semaphore validation dispatch',
          )
          text = replace_once(
              text,
              '    for item in work_orders.values():\n        validate_work_order(project, item, model, claims, products, latest)\n',
              '    for item in work_orders.values():\n        if item.get("status") in ACTIVE_WORK:\n            validate_work_order(project, item, model, claims, products, latest)\n        else:\n            _audit_non_authoritative_work_order(project, item)\n',
              'work-order validation dispatch',
          )
          model_path.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('tool/mission_runtime_history_compat_test.py')
          if test_path.exists():
              raise SystemExit(f'{test_path} already exists')
          test_path.write_text(r'''#!/usr/bin/env python3
          from __future__ import annotations

          import pathlib
          import subprocess
          import sys
          import tempfile
          import unittest

          sys.path.insert(0, str(pathlib.Path(__file__).resolve().parent))
          import mission_runtime_model as runtime


          class MissionRuntimeHistoryCompatTest(unittest.TestCase):
              def test_terminal_work_order_uses_audit_shape_not_current_policy(self) -> None:
                  item = {
                      "schemaVersion": 1,
                      "workOrderId": "WO-LEGACY-AUDIT-0001",
                      "mission": "MISSION-001",
                      "roadmapTask": "P0-001",
                      "parentProductPr": None,
                      "priority": 1,
                      "type": "IMPLEMENTATION",
                      "objective": "Preserve legacy immutable audit history.",
                      "requestedRole": "IMPLEMENTER",
                      "allowedPaths": ["docs/roadmap/missions/delivery/records/P0-001/**"],
                      "baseCommit": "e" * 40,
                      "baseTree": "f" * 40,
                      "dependencyRequirements": ["WO-OLD@LANDED"],
                      "requiredTests": [],
                      "maxChildWorkOrders": 0,
                      "status": "LANDED",
                      "createdBy": "LEGACY",
                      "createdAt": "2026-08-01T00:00:00Z",
                      "updatedAt": "2026-08-01T00:00:01Z",
                  }
                  with tempfile.TemporaryDirectory() as directory:
                      runtime._audit_non_authoritative_work_order(pathlib.Path(directory), item)

              def test_locally_available_historical_commit_still_requires_exact_tree(self) -> None:
                  with tempfile.TemporaryDirectory() as directory:
                      project = pathlib.Path(directory)
                      subprocess.run(["git", "init", "-q", str(project)], check=True)
                      subprocess.run(
                          ["git", "-C", str(project), "config", "user.name", "test"], check=True
                      )
                      subprocess.run(
                          ["git", "-C", str(project), "config", "user.email", "test@example.invalid"],
                          check=True,
                      )
                      (project / "x").write_text("x\n", encoding="utf-8")
                      subprocess.run(["git", "-C", str(project), "add", "x"], check=True)
                      subprocess.run(
                          ["git", "-C", str(project), "commit", "-q", "-m", "fixture"], check=True
                      )
                      head = subprocess.check_output(
                          ["git", "-C", str(project), "rev-parse", "HEAD"], text=True
                      ).strip()
                      with self.assertRaisesRegex(ValueError, "baseCommit/baseTree mismatch"):
                          runtime._audit_git_binding(project, head, "0" * 40, "fixture")

              def test_terminal_children_do_not_consume_live_child_budget(self) -> None:
                  parent = {
                      "mission": "MISSION-001",
                      "roadmapTask": "P0-001",
                      "parentProductPr": 1,
                      "maxChildWorkOrders": 0,
                  }
                  landed_child = {
                      "mission": "MISSION-002",
                      "roadmapTask": "P2-004",
                      "parentProductPr": 2,
                      "parentWorkOrderId": "WO-PARENT",
                      "status": "LANDED",
                  }
                  runtime.validate_delegation_graph(
                      {"WO-PARENT": parent, "WO-HISTORY": landed_child}
                  )

              def test_operational_child_budget_remains_strict(self) -> None:
                  parent = {
                      "mission": "MISSION-001",
                      "roadmapTask": "P0-001",
                      "parentProductPr": 1,
                      "maxChildWorkOrders": 0,
                  }
                  active_child = {
                      "mission": "MISSION-001",
                      "roadmapTask": "P0-001",
                      "parentProductPr": 1,
                      "parentWorkOrderId": "WO-PARENT",
                      "status": "READY",
                  }
                  with self.assertRaisesRegex(ValueError, "child budget exceeded"):
                      runtime.validate_delegation_graph(
                          {"WO-PARENT": parent, "WO-ACTIVE": active_child}
                      )


          if __name__ == "__main__":
              unittest.main()
          ''', encoding='utf-8', newline='\n')

          workflow_path = Path('.github/workflows/mission-execution-control.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = replace_once(
              workflow,
              "      - 'tool/mission_runtime_model.py'\n",
              "      - 'tool/mission_runtime_model.py'\n      - 'tool/mission_runtime_history_compat_test.py'\n",
              'control workflow path',
          )
          workflow = replace_once(
              workflow,
              "      - name: Validate static topology with durable runtime overlay\n",
              "      - name: Validate Mission Execution runtime history compatibility\n        run: python -m unittest -v tool/mission_runtime_history_compat_test.py\n      - name: Validate static topology with durable runtime overlay\n",
              'control workflow test step',
          )
          workflow_path.write_text(workflow, encoding='utf-8', newline='\n')
          PY
      - name: Verify focused repair against live mutable runtime
        shell: bash
        run: |
          python -m py_compile tool/mission_runtime_model.py tool/mission_runtime_history_compat_test.py
          python -m unittest -v tool/mission_runtime_history_compat_test.py
          git fetch origin agent/mission-runtime:refs/remotes/origin/agent/mission-runtime
          git worktree add "$RUNNER_TEMP/mission-runtime" refs/remotes/origin/agent/mission-runtime
          cp tool/mission_runtime_model.py "$RUNNER_TEMP/mission-runtime/tool/mission_runtime_model.py"
          RUNTIME_ROOT="$RUNNER_TEMP/mission-runtime" python - <<'PY'
          import os
          import pathlib
          import sys
          root = pathlib.Path(os.environ['RUNTIME_ROOT'])
          sys.path.insert(0, str(root / 'tool'))
          from mission_runtime_model import validate_runtime_state
          state = validate_runtime_state(root)
          assert state['meta']['runtimeGeneration'] >= 361
          assert any(
              item.get('workOrderId') == 'WO-P5-001-SOURCE-MANIFEST-7C51A2E4'
              for item in state['workOrders'].values()
          )
          print(f"validated runtime generation {state['meta']['runtimeGeneration']}")
          PY
      - name: Commit repair only if control head is still exact
        shell: bash
        run: |
          git rm .github/workflows/mission-v15-history-audit-repair.yml
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/mission-execution-control.yml',
              '.github/workflows/mission-v15-history-audit-repair.yml',
              'tool/mission_runtime_history_compat_test.py',
              'tool/mission_runtime_model.py',
          }
          actual = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(f'unexpected repair paths: {sorted(actual)}')
          PY
          git fetch origin agent/mission-execution-v15-gold:refs/remotes/origin/agent/mission-execution-v15-gold
          test "$(git rev-parse refs/remotes/origin/agent/mission-execution-v15-gold)" = "$GITHUB_SHA"
          git config user.name 'mission-v15-history-audit-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/mission-execution-control.yml tool/mission_runtime_model.py tool/mission_runtime_history_compat_test.py
          git commit -m 'fix(mission-v15): audit historical runtime without reauthorization'
          git push origin HEAD:refs/heads/agent/mission-execution-v15-gold
