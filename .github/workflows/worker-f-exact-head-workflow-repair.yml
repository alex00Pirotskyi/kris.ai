name: Worker F exact manifest refresh

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: worker-f-exact-manifest-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install governed Python dependencies
        shell: bash
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Generate manifests for the final clean tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Worker F manifest refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f .github/workflows/worker-f-exact-head-workflow-repair.yml
          rm -f tool/worker_f_permanent_workflow_template.yml

          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/worker_f_p5_ia.py manifest --project .
          python tool/worker_f_p5_ia.py manifest --project . --check
          python tool/worker_f_p5_ia.py check --project .
          python tool/worker_f_p5_ia_test.py

          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/worker-f-source-manifest
          python tool/p1a_refresh_source_manifest.py .
          cmp /tmp/worker-f-source-manifest SOURCE_MANIFEST.sha256
          git diff --check

          git add release/evidence/P5-001/manifest.json SOURCE_MANIFEST.sha256
          if git diff --cached --quiet; then
            echo 'Manifest bindings were already current.'
            exit 0
          fi
          git commit -m 'P5-001: refresh exact workflow manifest bindings'
          git push origin HEAD:refs/heads/agent/f/P5-001-information-architecture
