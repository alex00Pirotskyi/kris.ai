name: Worker F exact-head workflow repair

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: worker-f-exact-head-workflow-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install governed Python dependencies
        shell: bash
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Install corrected permanent workflow and refresh bindings
        shell: bash
        run: |
          set -euo pipefail
          cp tool/worker_f_permanent_workflow_template.yml .github/workflows/worker-f-p5-001-information-architecture.yml
          rm .github/workflows/worker-f-exact-head-workflow-repair.yml
          rm tool/worker_f_permanent_workflow_template.yml
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/worker_f_p5_ia.py manifest --project .
          python tool/worker_f_p5_ia.py manifest --project . --check
          python tool/worker_f_p5_ia.py check --project .
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/worker-f-workflow-source-manifest
          python tool/p1a_refresh_source_manifest.py .
          cmp /tmp/worker-f-workflow-source-manifest SOURCE_MANIFEST.sha256
          git diff --check
      - name: Create clean workflow repair object
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLEAN_BASE_TREE: c162caf16ed27c5160a66d77f7851241466fc235
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          def request(method,path,payload=None):
              body=None; headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
              if payload is not None:
                  body=json.dumps(payload).encode(); headers['Content-Type']='application/json'
              req=urllib.request.Request(f'{api}/{path}',data=body,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=120) as response: return json.load(response)
          elements=[]
          for relative in ('.github/workflows/worker-f-p5-001-information-architecture.yml','release/evidence/P5-001/manifest.json','SOURCE_MANIFEST.sha256'):
              raw=Path(relative).read_bytes()
              blob=request('POST','git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              elements.append({'path':relative,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=request('POST','git/trees',{'base_tree':os.environ['CLEAN_BASE_TREE'],'tree':elements})
          commit=request('POST','git/commits',{'message':'P5-001: validate exact head across permanent matrix','tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          print(f'WORKER_F_WORKFLOW_REPAIR_COMMIT={commit["sha"]}')
          print(f'WORKER_F_WORKFLOW_REPAIR_TREE={tree["sha"]}')
          PY
