name: GS001B Branch Hygiene Truth Finalizer

on:
  push:
    branches:
      - agent/gpt-gold/gs-001b-branch-hygiene-truth
    paths:
      - .github/workflows/gs001b-branch-hygiene-finalizer.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: gs001b-branch-hygiene-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: gs001b-branch-hygiene-finalizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gpt-gold/gs-001b-branch-hygiene-truth
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Rebind the reviewed cleanup subset to live refs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'agent/gpt-gold/gs-001b-branch-hygiene-truth'

          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          root = pathlib.Path('.').resolve()
          policy_path = root / 'config' / 'branch_hygiene.json'
          policy = json.loads(policy_path.read_text(encoding='utf-8'))

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'kris-ai-gs001b-branch-hygiene',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(path: str):
              request = urllib.request.Request(
                  f'https://api.github.com{path}', headers=headers
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode('utf-8'))

          repo = get_json(f'/repos/{repository}')
          default_branch = str(repo['default_branch'])

          branches = []
          page = 1
          while True:
              rows = get_json(
                  f'/repos/{repository}/branches?per_page=100&page={page}'
              )
              branches.extend(rows)
              if len(rows) < 100:
                  break
              page += 1

          branch_map = {
              row['name']: {
                  'sha': row['commit']['sha'],
                  'protected': bool(row.get('protected')),
              }
              for row in branches
          }

          open_heads = set()
          page = 1
          while True:
              rows = get_json(
                  f'/repos/{repository}/pulls?state=open&per_page=100&page={page}'
              )
              for row in rows:
                  head = row.get('head') or {}
                  head_repo = head.get('repo') or {}
                  if head_repo.get('full_name') == repository:
                      open_heads.add(str(head.get('ref')))
              if len(rows) < 100:
                  break
              page += 1

          retain_reasons = {
              default_branch: 'Protected default branch.',
              'agent/mission-runtime': 'Mutable Mission Execution runtime authority.',
              'agent/mission-execution-v15-gold': 'Current Mission Execution control implementation branch.',
              'agent/mission-delivery-enforcement-v1': 'Current delivery-enforcement lineage pending explicit disposition.',
              'integration/p2-owner-risk-v71r12': 'Unique P1/P2 owner-risk evidence lineage pending current-schema migration.',
              'ci/direct-pr14-repair-trigger': 'Historical repair-status lineage retained until PR14 cleanup is fully closed.',
          }
          keep_names = sorted(
              name for name in retain_reasons if name in branch_map
          )

          reviewed = policy.get('delete')
          if not isinstance(reviewed, list):
              raise SystemExit('reviewed delete set missing')

          filtered = []
          exclusions = []
          for row in reviewed:
              name = str(row.get('name', ''))
              expected = str(row.get('expectedSha', ''))
              current = branch_map.get(name)
              reason = None
              if current is None:
                  reason = 'already_absent'
              elif name in keep_names:
                  reason = 'explicitly_retained'
              elif name in open_heads:
                  reason = 'open_pull_request_head'
              elif current['protected']:
                  reason = 'protected_branch'
              elif current['sha'] != expected:
                  reason = 'sha_moved'
              if reason is not None:
                  exclusions.append({
                      'name': name,
                      'reason': reason,
                      'expectedSha': expected,
                      'observedSha': current['sha'] if current else None,
                  })
                  continue
              filtered.append(row)

          filtered.sort(key=lambda row: str(row['name']))
          policy['defaultBranch'] = default_branch
          policy['keep'] = [
              {'name': name, 'reason': retain_reasons[name]}
              for name in keep_names
          ]
          policy['delete'] = filtered
          policy['audit'] = {
              'beforeBranchCount': len(branches),
              'capturedAtUtc': dt.datetime.now(dt.timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace('+00:00', 'Z'),
              'candidateCount': len(filtered),
              'excludedReviewedCandidateCount': len(exclusions),
              'mainSha': branch_map[default_branch]['sha'],
              'policy': (
                  'Only the prior reviewed deletion set is eligible. Missing, moved, '
                  'protected, retained, and open-PR refs are removed before publication; '
                  'the executor revalidates exact SHAs before the first deletion.'
              ),
              'repository': repository,
          }
          policy['schemaVersion'] = '1.0.0'
          policy['roadmapAuthority'] = 'docs/roadmap/MASTER.md'

          policy_path.write_text(
              json.dumps(policy, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print(json.dumps({
              'branchCount': len(branches),
              'candidateCount': len(filtered),
              'excludedCount': len(exclusions),
              'kept': keep_names,
              'exclusions': exclusions,
          }, indent=2, sort_keys=True))
          PY

          python tool/branch_hygiene.py \
            --config config/branch_hygiene.json \
            --repository "$GITHUB_REPOSITORY" \
            --receipt "$RUNNER_TEMP/branch-hygiene-plan.json"

          python tool/p1a_refresh_source_manifest.py .
          rm .github/workflows/gs001b-branch-hygiene-finalizer.yml
          python tool/p1a_refresh_source_manifest.py .
          ruby tool/workflow_integrity_test.rb .
          git diff --check

          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 3
          test "${paths[0]}" = '.github/workflows/gs001b-branch-hygiene-finalizer.yml'
          test "${paths[1]}" = 'SOURCE_MANIFEST.sha256'
          test "${paths[2]}" = 'config/branch_hygiene.json'

          git config user.name 'KRIS.AI Gold Standard Finalizer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(repo): bind branch cleanup to current live refs'
          git push origin HEAD:refs/heads/agent/gpt-gold/gs-001b-branch-hygiene-truth
