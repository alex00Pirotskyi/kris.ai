name: Temporary design-token validator finalizer

on:
  push:
    branches:
      - agent/gpt-gold/gs-003b-design-token-validator

permissions:
  contents: write

concurrency:
  group: temp-design-token-validator-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind checkout to exact remediation branch
        run: git switch --force-create agent/gpt-gold/gs-003b-design-token-validator "$GITHUB_SHA"

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: config/p2.python-version
          check-latest: false

      - name: Install exact Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
          check-latest: false

      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Align finalizer with deterministic generated test outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tool/temp_design_token_validator_finalizer.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'import re\nimport subprocess\n'
          new_import = 'import re\nimport shutil\nimport subprocess\n'
          if text.count(old_import) != 1:
              raise SystemExit('expected one finalizer import anchor')
          text = text.replace(old_import, new_import, 1)

          marker = '\ndef validate() -> None:\n'
          helper = '''
def restore_generated_test_outputs() -> None:
    allowed = {
        "SOURCE_MANIFEST.sha256",
        "test/product/source_contract_test.dart",
        "tool/validate_release.py",
        WORKFLOW.as_posix(),
        SCRIPT.as_posix(),
    }
    changed = run("git", "diff", "--name-only", capture=True).splitlines()
    for relative in changed:
        if relative and relative not in allowed:
            run("git", "restore", "--source=HEAD", "--", relative)
    untracked = run(
        "git", "ls-files", "--others", "--exclude-standard", capture=True
    ).splitlines()
    for relative in untracked:
        if not relative or relative in allowed:
            continue
        target = ROOT / relative
        if target.is_symlink() or target.is_file():
            target.unlink()
        elif target.is_dir():
            shutil.rmtree(target)

'''
          if text.count(marker) != 1:
              raise SystemExit('expected one validate function anchor')
          text = text.replace(marker, '\n' + helper + 'def validate() -> None:\n', 1)

          old_tail = '''    run("npm", "ci", "--prefix", "automation_host")
    run("npm", "test", "--prefix", "automation_host")
    run("python3", "tool/p1a_refresh_source_manifest.py", ".")
    run("git", "diff", "--exit-code", "--", "SOURCE_MANIFEST.sha256")
'''
          new_tail = '''    run("npm", "ci", "--prefix", "automation_host")
    run("npm", "test", "--prefix", "automation_host")
    restore_generated_test_outputs()
    run("python3", "tool/p1a_refresh_source_manifest.py", ".")
    first = (ROOT / "SOURCE_MANIFEST.sha256").read_bytes()
    run("python3", "tool/p1a_refresh_source_manifest.py", ".")
    if (ROOT / "SOURCE_MANIFEST.sha256").read_bytes() != first:
        raise RuntimeError("SOURCE_MANIFEST.sha256 is not byte-stable after tests")
    run("python3", "tool/p1a_text_eof_contract_test.py", "--project", ".")
'''
          if text.count(old_tail) != 1:
              raise SystemExit('expected one finalizer validation tail')
          path.write_text(text.replace(old_tail, new_tail, 1), encoding='utf-8', newline='\n')
          PY

      - name: Repair, validate, and publish clean validator candidate
        run: python3 tool/temp_design_token_validator_finalizer.py
