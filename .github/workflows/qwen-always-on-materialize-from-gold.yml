          tests = sub1(
              tests,
              r'\n\nif __name__ == "__main__":\n',
              extra_tests + '\n\nif __name__ == "__main__":\n',
              'append-auto-update-tests',
          )
          test_path.write_text(tests, encoding='utf-8', newline='\n')

          docs_path = Path('docs/KRIS_QWEN_SERVER_CONTROL.md')
          docs = docs_path.read_text(encoding='utf-8')
          marker = '## Always-on Product protocol (5.3 / controller 2.2)'
          if marker not in docs:
              docs += '''\n\n## Always-on Product protocol (5.3 / controller 2.2)\n\nNormal `IDLE` is a red-alert condition rather than a steady state. Successful Work Orders chain immediately. The worker wakes eligible context-independent R1 review lanes, wakes reviewed helper integration lanes, and when the governed frontier is genuinely empty it can create one bounded `PRODUCT_DEFECT_REPAIR` Work Order only against an existing ACTIVE canonical Product PR through the existing Mission Runtime `work-create` CAS path. Runtime path policy, WIP limits, semaphores, exact-head review independence, and protected-main restrictions remain fail-closed.\n\nController 2.2 enables automatic update monitoring by default. It periodically compares the configured remote Qwen branch head to the local checkout. A newer head uses the same graceful drain, clean-checkout refusal, fast-forward-only update, version probe, and stack restart as the manual Fetch latest flow. An unexpectedly stopped worker is started again unless the operator explicitly used Safe stop, which pauses automatic restart until Run current Qwen or Fetch latest + run Qwen is selected.\n'''
          docs_path.write_text(docs, encoding='utf-8', newline='\n')
          PY

      - name: Remove temporary feature-branch transports
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/qwen-always-on-materialize.yml
          rm -f .github/workflows/qwen-always-on-anchor-audit.yml
          rm -f qwen-always-on-anchor-audit.json

      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile run_my_server.py tool/kris_qwen_worker.py tool/kris_qwen_worker.py.compat.py tool/kris_qwen_control.py tool/kris_qwen_control_test.py
          python3 tool/kris_qwen_control_test.py
          python3 tool/kris_qwen_worker.py version > /tmp/worker-version.json
          python3 tool/kris_qwen_worker.py.compat.py version > /tmp/compat-version.json
          python3 - <<'PY'
          import json
          for path in ('/tmp/worker-version.json', '/tmp/compat-version.json'):
              value = json.load(open(path, encoding='utf-8'))
              assert value['scriptVersion'] == '5.3.0', value
          control = open('tool/kris_qwen_control.py', encoding='utf-8').read()
          assert 'CONTROL_VERSION = "2.2.0"' in control
          worker = open('tool/kris_qwen_worker.py', encoding='utf-8').read()
          for marker in ('def wake_pending_reviews(', 'def seed_continuous_product_work(', 'RED_ALERT_FRONTIER', '+refs/pull/*/head:refs/remotes/origin/pull/*/head'):
              assert marker in worker, marker
          PY
          git diff --check

      - name: Regenerate and validate source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/manifest.first
          python3 tool/p1a_refresh_source_manifest.py .
          cmp -s /tmp/manifest.first SOURCE_MANIFEST.sha256
          python3 tool/p1a_source_manifest_test.py .
          git diff --check

      - name: Publish exact Qwen candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          allowed=$'.github/workflows/qwen-always-on-anchor-audit.yml\n.github/workflows/qwen-always-on-materialize.yml\nSOURCE_MANIFEST.sha256\ndocs/KRIS_QWEN_SERVER_CONTROL.md\ntool/kris_qwen_control.py\ntool/kris_qwen_control_test.py\ntool/kris_qwen_worker.py\ntool/kris_qwen_worker.py.compat.py'
          if [[ "$changed" != "$allowed" ]]; then
            echo 'Unexpected candidate scope:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git commit -m 'feat(qwen): enforce always-on product execution'
          candidate="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/agent/qwen-phone-control
          git fetch origin '+refs/heads/agent/qwen-phone-control:refs/remotes/origin/agent/qwen-phone-control'
          [[ "$(git rev-parse origin/agent/qwen-phone-control)" == "$candidate" ]]
          echo "QWEN_ALWAYS_ON_PASS candidate=$candidate"
