name: Qwen Always-On Materialize From Gold

on:
  push:
    branches:
      - agent/mission-execution-v15-gold
    paths:
      - .github/workflows/qwen-always-on-materialize-from-gold.yml

permissions:
  contents: write

concurrency:
  group: qwen-always-on-materialize-from-gold
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Qwen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Patch worker controller tests and compat
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
