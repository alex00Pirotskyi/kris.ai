              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement, got {count}')
              return out

          worker_path = Path('tool/kris_qwen_worker.py')
          worker = worker_path.read_text(encoding='utf-8')
          worker = sub1(worker, r'SCRIPT_VERSION = "5\.2\.2"', 'SCRIPT_VERSION = "5.3.0"', 'worker-version')
          worker = sub1(
              worker,
