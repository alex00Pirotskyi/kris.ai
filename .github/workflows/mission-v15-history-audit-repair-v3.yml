name: Mission V1.5 Historical Runtime Audit Repair V3

on:
  push:
    branches:
      - agent/mission-execution-v15-gold
    paths:
      - '.github/workflows/mission-v15-history-audit-repair-v3.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mission-execution-v15-gold
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Reuse bounded patch recipe and proven timestamp compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/mission-v15-history-audit-repair.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n      - name: Verify focused repair against live mutable runtime\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          recipe = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          namespace = {}
          exec(compile(recipe, '<historical-audit-recipe>', 'exec'), namespace, namespace)
          model = Path('tool/mission_runtime_model.py')
          text = model.read_text(encoding='utf-8')
          old = '    if refreshed < created or expires <= refreshed:\n        raise ValueError("historical semaphore timestamp ordering invalid")\n'
          new = '    if refreshed < created or expires < refreshed:\n        raise ValueError("historical semaphore timestamp ordering invalid")\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one generated historical semaphore ordering rule, found {text.count(old)}')
          model.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Verify exact patch against live mutable runtime
        shell: bash
        run: |
          python -m py_compile tool/mission_runtime_model.py tool/mission_runtime_history_compat_test.py
          python -m unittest -v tool/mission_runtime_history_compat_test.py
          git fetch origin agent/mission-runtime:refs/remotes/origin/agent/mission-runtime
          git worktree add "$RUNNER_TEMP/mission-runtime" refs/remotes/origin/agent/mission-runtime
          cp tool/mission_runtime_model.py "$RUNNER_TEMP/mission-runtime/tool/mission_runtime_model.py"
          RUNTIME_ROOT="$RUNNER_TEMP/mission-runtime" python - <<'PY'
          import os, pathlib, sys
          root = pathlib.Path(os.environ['RUNTIME_ROOT'])
          sys.path.insert(0, str(root / 'tool'))
          from mission_runtime_model import validate_runtime_state
          state = validate_runtime_state(root)
          assert state['meta']['runtimeGeneration'] >= 361
          p5 = state['workOrders']['WO-P5-001-SOURCE-MANIFEST-7C51A2E4']
          assert p5['status'] == 'IN_PROGRESS'
          assert p5['activeSemaphoreId'] == 'SEM-P5-001-SOURCE-MANIFEST-7C51A2E4'
          print(f"validated runtime generation {state['meta']['runtimeGeneration']}")
          PY
      - name: Publish exactly the two proven non-workflow files
        shell: bash
        run: |
          git restore .github/workflows/mission-execution-control.yml
          git add tool/mission_runtime_model.py tool/mission_runtime_history_compat_test.py
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              'tool/mission_runtime_history_compat_test.py',
              'tool/mission_runtime_model.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged repair paths: {sorted(actual)}')
          PY
          git fetch origin agent/mission-execution-v15-gold:refs/remotes/origin/agent/mission-execution-v15-gold
          test "$(git rev-parse refs/remotes/origin/agent/mission-execution-v15-gold)" = "$GITHUB_SHA"
          git config user.name 'mission-v15-history-audit-repair'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(mission-v15): audit historical runtime without reauthorization'
          git push origin HEAD:refs/heads/agent/mission-execution-v15-gold
