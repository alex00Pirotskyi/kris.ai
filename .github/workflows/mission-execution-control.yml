name: Mission Execution Control

on:
  pull_request:
    paths:
      - '.github/workflows/mission-execution-control.yml'
      - '.github/workflows/mission-execution-materialize.yml'
      - 'config/mission_execution.v1.json'
      - 'config/mission_delivery.v1.json'
      - 'config/mission_v15_hygiene.v1.json'
      - 'tool/mission_control.py'
      - 'tool/mission_materialize_safe.py'
      - 'tool/mission_runtime_control.py'
      - 'tool/mission_runtime_model.py'
      - 'tool/mission_orchestrator.py'
      - 'docs/roadmap/anarchy/phases/**'
      - 'docs/roadmap/missions/**'
      - 'schemas/mission_*.json'
      - 'SOURCE_MANIFEST.sha256'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mission-execution-control.yml'
      - '.github/workflows/mission-execution-materialize.yml'
      - 'config/mission_execution.v1.json'
      - 'config/mission_delivery.v1.json'
      - 'tool/mission_control.py'
      - 'tool/mission_materialize_safe.py'
      - 'docs/roadmap/anarchy/phases/**'
      - 'docs/roadmap/missions/**'
      - 'schemas/mission_*.json'
      - 'SOURCE_MANIFEST.sha256'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Assert exact source head
        shell: bash
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Validate static topology with durable runtime overlay
        run: python tool/mission_materialize_safe.py --project . validate
      - name: Verify deterministic safe static views
        run: python tool/mission_materialize_safe.py --project . materialize --check
      - name: Generate canonical source-manifest candidate twice
        shell: bash
        run: |
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.committed"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.candidate"
          cp "$RUNNER_TEMP/source-manifest.committed" SOURCE_MANIFEST.sha256
      - name: Verify repository whitespace and non-mutation
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1)"
      - uses: actions/upload-artifact@v4
        with:
          name: mission-execution-source-manifest-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/source-manifest.candidate
