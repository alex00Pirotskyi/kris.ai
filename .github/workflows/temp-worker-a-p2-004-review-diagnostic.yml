name: TEMP Worker A P2-004 Review Diagnostic

on:
  push:
    branches:
      - agent/a/p2-004-measurement-contract-repair
    paths:
      - '.github/workflows/temp-worker-a-p2-004-review-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-worker-a-p2-004-review-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: config/p2.python-version
          check-latest: false
      - name: Assert diagnostic identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Replay verified reconstruction with exact failure annotation
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path

          workflow = Path('.github/workflows/temp-worker-a-p2-004-review-repair.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PYCODE'\n"
          end_marker = "          PYCODE\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'
          Path('/tmp/p2-review-materialize.py').write_text(script, encoding='utf-8')
          PYCODE
          set +e
          python /tmp/p2-review-materialize.py >"$RUNNER_TEMP/reconstruct.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/reconstruct.log"
          if [ "$rc" -ne 0 ]; then
            python - "$RUNNER_TEMP/reconstruct.log" <<'PYCODE'
          import pathlib
          import sys
          text = pathlib.Path(sys.argv[1]).read_text(
              encoding='utf-8', errors='replace'
          )[-12000:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=P2-004 reconstruction::{escaped}')
          PYCODE
            exit "$rc"
          fi
