name: P220 governed-source finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p220-governed-source-finalize.yml

permissions:
  contents: write

env:
  BASE_MAIN_SHA: 7b90b6412e1d91244a74fd6f1ada09382458ee42
  TARGET_BRANCH: agent/p3-phase-closure-main-20260822
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PATCH_PATH: .repo-p220-inventory-finalize.py
  FINALIZER_PATH: .github/workflows/p220-governed-source-finalize.yml

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact bounded transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          test -f "$PATCH_PATH"
          test -f "$FINALIZER_PATH"
          test -z "$(git status --short)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Apply exact authority repair and remove transport
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python -m py_compile "$PATCH_PATH"
          python "$PATCH_PATH"
          git rm -f "$PATCH_PATH" "$FINALIZER_PATH"
          dart format test/product/source_contract_test.dart
      - name: Validate full product and release contract
        shell: bash
        run: |
          set -euo pipefail
          python tool/v71r12_bootstrap_hosted_python.py --project .
          flutter test --no-pub --concurrency=1 --reporter expanded
          flutter analyze --no-pub --fatal-warnings --fatal-infos
          python tool/validate_release.py --skip-tests
          git restore --source="$SOURCE_SHA" --staged --worktree -- \
            release/FILE_ADAPTER_RESULTS.json \
            release/KNOWLEDGE_MEMORY_V2_RESULTS.json
          git diff --check
      - name: Regenerate canonical source identity twice
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
      - name: Assert exact eight-file durable scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_MAIN_SHA" | sort > "$RUNNER_TEMP/actual.paths"
          cat > "$RUNNER_TEMP/expected.paths" <<'EOF'
          SOURCE_MANIFEST.sha256
          lib/product/browser/browser_quality.dart
          lib/product/browser/browser_workspace.dart
          test/product/browser/browser_quality_recipes_test.dart
          test/product/browser/fixtures/p3_browser/fixture.js
          test/product/browser/fixtures/p3_browser/index.html
          test/product/browser/fixtures/p3_browser/popup.html
          test/product/source_contract_test.dart
          EOF
          sort -o "$RUNNER_TEMP/expected.paths" "$RUNNER_TEMP/expected.paths"
          diff -u "$RUNNER_TEMP/expected.paths" "$RUNNER_TEMP/actual.paths"
      - name: Publish exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p3): govern browser quality source before phase closure'
          git push origin "HEAD:$TARGET_BRANCH"
