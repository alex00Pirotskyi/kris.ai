name: qualification-chat-benchmark-repair

on:
  push:
    branches:
      - integration/kristin-corrective-main-landing-20260903

permissions:
  contents: write

jobs:
  repair:
    if: github.ref_name == 'integration/kristin-corrective-main-landing-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integration/kristin-corrective-main-landing-20260903
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: flutter pub get
      - name: Patch capability-help intent and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          control = Path('lib/product/chat_control_plane.dart')
          text = control.read_text(encoding='utf-8')
          helper = """bool isCapabilityHelpRequest(String input) {
            final normalized = _normalized(
              input,
            ).replaceFirst(RegExp(r'\\s*[?!.,]+$'), '').trim();
            return RegExp(
              r'^(?:help|'
              r'what\\s+(?:can|could)\\s+(?:you|u)\\s+do|'
              r'what\\s+(?:are|r)\\s+(?:you|u)\\s+able\\s+to\\s+do|'
              r'what\\s+can\\s+(?:you|u)\\s+help\\s+me\\s+with|'
              r'what\\s+(?:are|r)\\s+(?:your|ur)\\s+capabilities|'
              r'what\\s+capabilities\\s+do\\s+(?:you|u)\\s+have|'
              r'(?:show|list)(?:\\s+me)?\\s+(?:your|ur)\\s+capabilities)$',
            ).hasMatch(normalized);
          }
          """
          if 'bool isCapabilityHelpRequest(String input)' not in text:
              marker = 'bool isSemanticActionRequest(String input) => _isActionLanguage(input);\n'
              if text.count(marker) != 1:
                  raise SystemExit('semantic action marker missing or ambiguous')
              text = text.replace(marker, helper + '\n' + marker, 1)
          info_marker = 'bool _isInformationalLanguage(String input) {\n'
          hook = '  if (isCapabilityHelpRequest(input)) return true;\n'
          if hook not in text:
              if text.count(info_marker) != 1:
                  raise SystemExit('informational classifier marker missing or ambiguous')
              text = text.replace(info_marker, info_marker + hook, 1)
          control.write_text(text, encoding='utf-8', newline='\n')

          actions = Path('lib/product/chat_control_plane_studio_actions.dart')
          text = actions.read_text(encoding='utf-8')
          helper_condition = '    if (isCapabilityHelpRequest(decision.parsed.originalText)) {\n'
          if helper_condition not in text:
              old = """    if (RegExp(r'\\bwhat can you do\\b').hasMatch(text) ||
                  text.trim() == 'help') {
          """
              if text.count(old) != 1:
                  raise SystemExit('local capability-help condition missing or ambiguous')
              text = text.replace(old, helper_condition, 1)
          actions.write_text(text, encoding='utf-8', newline='\n')

          tests = Path('test/product/chat_control_plane_test.dart')
          text = tests.read_text(encoding='utf-8')
          test_name = 'capability-help shorthand stays informational and deterministic'
          if test_name not in text:
              marker = "  group('interaction policy', () {\n"
              if text.count(marker) != 1:
                  raise SystemExit('interaction policy group marker missing or ambiguous')
              addition = """    test('capability-help shorthand stays informational and deterministic', () {
              for (final request in <String>[
                'what can u do ?',
                'what can you do?',
                'what are u able to do?',
                'what are your capabilities?',
                'list ur capabilities',
              ]) {
                expect(isCapabilityHelpRequest(request), isTrue, reason: request);
                final decision = compiler.compile(
                  request,
                  inferredMode: CommandMode.build,
                );
                expect(
                  decision.kind,
                  ChatInteractionKind.informational,
                  reason: request,
                );
                expect(decision.mode, CommandMode.ask, reason: request);
                expect(decision.capability, isNull, reason: request);
                expect(decision.needsUnderstanding, isFalse, reason: request);
                expect(decision.needsPlan, isFalse, reason: request);
              }
            });

          """
              text = text.replace(marker, marker + addition, 1)
          tests.write_text(text, encoding='utf-8', newline='\n')

          # Fail closed if any intended semantic hook is absent.
          assert 'bool isCapabilityHelpRequest(String input)' in control.read_text(encoding='utf-8')
          assert hook in control.read_text(encoding='utf-8')
          assert helper_condition in actions.read_text(encoding='utf-8')
          assert test_name in tests.read_text(encoding='utf-8')
          PY
          dart format \
            lib/product/chat_control_plane.dart \
            lib/product/chat_control_plane_studio_actions.dart \
            test/product/chat_control_plane_test.dart
          python tool/dart_format_scope.py --check
          git diff --check
      - name: Run focused Chat regression test
        run: flutter test --no-pub --concurrency=1 --reporter expanded test/product/chat_control_plane_test.dart
      - name: Regenerate governed benchmark and source manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qualification-chat-benchmark-repair.yml
          git add -A -- \
            lib/product/chat_control_plane.dart \
            lib/product/chat_control_plane_studio_actions.dart \
            test/product/chat_control_plane_test.dart \
            .github/workflows/qualification-chat-benchmark-repair.yml
          python tool/benchmark_runner.py run --project .
          git add -A -- \
            evals/results/p0_009_baseline.json \
            evals/results/P0_009_BASELINE.md
          python tool/benchmark_runner.py check --project .
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          git add SOURCE_MANIFEST.sha256
          test ! -e .github/workflows/qualification-chat-benchmark-repair.yml
          python tool/generated_state_guard.py audit --project . --strict
          python tool/benchmark_runner.py check --project .
          python tool/dart_format_scope.py --check
          git diff --check
          git diff --cached --check
          git status --short
      - name: Commit combined qualification repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair capability help and benchmark baseline'
          git push origin HEAD:integration/kristin-corrective-main-landing-20260903
