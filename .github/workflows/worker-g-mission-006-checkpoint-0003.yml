name: Worker G MISSION-006 checkpoint 0003

on:
  push:
    branches:
      - agent/anarchy-autonomous-worker-missions
    paths:
      - '.github/workflows/worker-g-mission-006-checkpoint-0003.yml'

permissions:
  contents: write

concurrency:
  group: worker-g-mission-006-checkpoint-0003
  cancel-in-progress: false

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: agent/anarchy-autonomous-worker-missions
      EXPECTED_PARENT: 082b4e2b6c95b3f9d00f42f79b2aa035f43b116d
      CANDIDATE_HEAD: 9799768170f13556d3098a07b40be922377f8deb
      CANDIDATE_TREE: 2a5def77debba67066e083222bd7ef76af66c1f9
      AUTHORITY_HEAD: 800643bb5898a80ee3843f83f7657411183a9e6a
      AUTHORITY_TREE: 912aaa98d095561354397c4bc30f520dd235db4c
      WORK_EXECUTION_ID: WRK-20260806T181504Z-e3b9bdf0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/anarchy-autonomous-worker-missions
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Require exact uncontended mission-system head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin "${BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${BRANCH})" = "${GITHUB_SHA}"
      - name: Refresh MISSION-006 claim and generated state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          path = Path('config/mission_execution.v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          matches = [
              claim for claim in payload['activeClaims']
              if claim['mission'] == 'MISSION-006'
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected one MISSION-006 claim, found {len(matches)}')
          claim = matches[0]
          if claim['worker'] != 'G' or claim['branch'] != 'agent/g/mission-006-model-routing' or claim['pr'] != 76:
              raise SystemExit(f'unexpected MISSION-006 ownership: {claim!r}')
          claim['head'] = os.environ['CANDIDATE_HEAD']
          claim['tree'] = os.environ['CANDIDATE_TREE']
          claim['status'] = 'REVIEW'
          claim['current'] = (
              'P6-001 exact candidate is tri-platform CI green at '
              '9799768170f13556d3098a07b40be922377f8deb / '
              '2a5def77debba67066e083222bd7ef76af66c1f9; Worker B authority '
              'review and independent exact-candidate review remain pending; '
              'P6-002+ and merge remain unauthorized.'
          )
          path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python tool/mission_control.py --project . bootstrap
      - name: Refresh exact review coordination
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          path = Path('docs/roadmap/missions/coordination/MISSION-006-P6-001-TEST-CENTER.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('coordinationId') != 'MISSION-006-P6-001-TEST-CENTER':
              raise SystemExit('unexpected MISSION-006 coordination identity')
          payload['authorityOwner']['observedHead'] = os.environ['AUTHORITY_HEAD']
          payload['authorityOwner']['observedTree'] = os.environ['AUTHORITY_TREE']
          payload['requester']['observedHead'] = os.environ['CANDIDATE_HEAD']
          payload['requester']['observedTree'] = os.environ['CANDIDATE_TREE']
          payload['status'] = 'REQUESTED'
          payload['exactCandidate'] = {
              'commit': os.environ['CANDIDATE_HEAD'],
              'tree': os.environ['CANDIDATE_TREE'],
              'pullRequest': 76,
              'reviewStatus': 'PENDING',
              'requiredAuthorityReview': 'Worker B',
              'independentReviewRequired': True,
          }
          payload['currentBlockers'] = [
              'Worker B must review the exact commit/tree for Test Center authority compatibility',
              'an independent exact-commit/tree review is not yet recorded',
              'PR #78 delivery enforcement remains an open, unmerged read-only overlay',
              'P6-002+ and merge remain unauthorized',
          ]
          path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Run mission validation and status
        shell: bash
        run: |
          set -euo pipefail
          python tool/mission_control.py --project . validate | tee "$RUNNER_TEMP/mission-validate.txt"
          python tool/mission_control.py --project . status | tee "$RUNNER_TEMP/mission-status.txt"
          grep -F $'MISSION-006\tREVIEW\tWorker G\tP6,P18' "$RUNNER_TEMP/mission-status.txt"
      - name: Append MISSION-006 checkpoint 0003
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          validation_output = Path(os.environ['RUNNER_TEMP'], 'mission-validate.txt').read_text(encoding='utf-8').strip()
          status_output = Path(os.environ['RUNNER_TEMP'], 'mission-status.txt').read_text(encoding='utf-8')
          status_line = next(
              line for line in status_output.splitlines()
              if line.startswith('MISSION-006\t')
          )
          checkpoint = {
              'schemaVersion': 1,
              'mission': 'MISSION-006',
              'sequence': 3,
              'worker': 'G',
              'branch': 'agent/g/mission-006-model-routing',
              'pullRequest': 76,
              'observedHead': os.environ['CANDIDATE_HEAD'],
              'observedTree': os.environ['CANDIDATE_TREE'],
              'completed': [
                  'Re-resolved protected main, PR #78, the canonical mission system, the read-only delivery-control overlay, active ownership, PR #76, exact branch identities, CI, artifacts, and review state.',
                  'Reused and completed the existing P6-001 fail-closed model registry, tests, evidence, and canonical Worker B Test Center stack without restarting valid work.',
                  'Repaired governed source and release inventories, Windows P8 path portability, and tri-platform-stable release result bytes while preserving public and support boundaries.',
                  'Synchronized Worker B authority ancestry at 800643bb5898a80ee3843f83f7657411183a9e6a / 912aaa98d095561354397c4bc30f520dd235db4c.',
                  'Updated draft PR #76 and its exact-candidate review request to the final candidate and settled green validation state.',
              ],
              'validation': [
                  'Work execution ID: ' + os.environ['WORK_EXECUTION_ID'],
                  'P2 Integration Alignment run 31108017750 completed successfully; validation job passed and intentionally gated execute/materializer jobs were skipped; artifact NONE.',
                  'P8-001 Formal Test Hierarchy run 31108017702 completed successfully on Ubuntu, Windows, and macOS; committed source manifest and non-mutation checks passed.',
                  'P8 source-manifest artifact 8970421528 is 108239 bytes with sha256:dbfda395997b1fd4a8aa4a38ee0fbb79c0277f1591e5de702b21c945b62b7ac4.',
                  'Product-gates run 31108017755 completed successfully on Ubuntu, Windows, and macOS, including full Flutter tests, architecture/security gates, and native release builds.',
                  validation_output,
                  status_line,
              ],
              'blockers': [
                  'Worker B exact-commit/tree Test Center authority review is pending.',
                  'No independent exact-commit/tree source review is recorded.',
                  'PR #78 delivery enforcement is open and unmerged and therefore remains only a read-only execution-control overlay.',
                  'P6-002 and later P6/P18 implementation are not authorized by the current exact dependency and integration state.',
                  'Mission and repository integration gates do not authorize merge.',
              ],
              'nextAction': (
                  'Worker B must publish the Test Center authority decision and an independent '
                  'reviewer must publish an exact decision for commit '
                  '9799768170f13556d3098a07b40be922377f8deb and tree '
                  '2a5def77debba67066e083222bd7ef76af66c1f9; then re-resolve mission '
                  'integration authorization. Do not merge or start P6-002 before those gates pass.'
              ),
              'supersededBy': None,
          }
          path = Path('docs/roadmap/missions/checkpoints/MISSION-006-0003.json')
          if path.exists():
              raise SystemExit('MISSION-006 checkpoint 0003 already exists')
          path.write_text(
              json.dumps(checkpoint, indent=2, ensure_ascii=False, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Remove workflow, refresh manifest, and revalidate
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/worker-g-mission-006-checkpoint-0003.yml
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          python tool/mission_control.py --project . validate
          python tool/mission_control.py --project . status | grep -F $'MISSION-006\tREVIEW\tWorker G\tP6,P18'
          git diff --check
      - name: Commit exact mission checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${BRANCH})" = "${GITHUB_SHA}"
          git add -A -- .
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(mission-006): checkpoint exact green P6-001 candidate'
          git push origin "HEAD:${BRANCH}"
