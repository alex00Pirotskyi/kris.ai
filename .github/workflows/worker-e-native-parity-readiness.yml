name: Worker E Native Parity Readiness

on:
  push:
    branches:
      - agent/e/native-parity-readiness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-e-native-parity-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: materialize-governed-worker-e-evidence
    if: github.ref == 'refs/heads/agent/e/native-parity-readiness'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
    steps:
      - name: Check out exact Worker E source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Verify evidence-manifest refresher regressions
        shell: bash
        run: python -m unittest -v tool/worker_e_refresh_evidence_manifest_test.py
      - name: Refresh Worker E evidence manifest twice
        shell: bash
        run: |
          set -euo pipefail
          python tool/worker_e_refresh_evidence_manifest.py --write --project .
          cp release/evidence/P11-001/manifest.json "${RUNNER_TEMP}/worker-e-manifest.first.json"
          python tool/worker_e_refresh_evidence_manifest.py --write --project .
          cmp "${RUNNER_TEMP}/worker-e-manifest.first.json" release/evidence/P11-001/manifest.json
          python tool/worker_e_refresh_evidence_manifest.py --check --project .
      - name: Refresh canonical source manifest twice
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
      - name: Prove generated change boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              'SOURCE_MANIFEST.sha256',
              'release/evidence/P11-001/manifest.json',
          }
          changed = set(
              filter(
                  None,
                  subprocess.check_output(
                      ['git', 'diff', '--name-only'], text=True
                  ).splitlines(),
              )
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected materializer mutation: {unexpected}')
          PY
          git diff --check
      - name: Publish generated candidate when required
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          if git diff --quiet -- SOURCE_MANIFEST.sha256 release/evidence/P11-001/manifest.json; then
            echo "candidate_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256 release/evidence/P11-001/manifest.json
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | LC_ALL=C sort)
          for path in "${changed[@]}"; do
            case "${path}" in
              SOURCE_MANIFEST.sha256|release/evidence/P11-001/manifest.json) ;;
              *) echo "unexpected staged path: ${path}" >&2; exit 1 ;;
            esac
          done
          git commit -m 'chore(p11): materialize governed evidence manifests'
          candidate_sha="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "candidate_sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"

  validate:
    name: source-verification-${{ matrix.platform }}
    needs: materialize
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, os: ubuntu-24.04}
          - {platform: windows, os: windows-2025}
          - {platform: macos, os: macos-15}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact generated Worker E candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.materialize.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Fetch immutable dependency snapshots
        shell: bash
        run: |
          git fetch origin \
            agent/a/p1-p2-new-roadmap-execution \
            agent/j/P24-001-roadmap-as-data-adr
      - name: Verify exact identity and ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.materialize.outputs.candidate_sha }}"
          python tool/worker_e_dependency_binding.py --project .
      - name: Run Worker E regressions and readiness
        shell: bash
        run: |
          python -m unittest -v \
            tool/worker_e_refresh_evidence_manifest_test.py \
            tool/worker_e_native_parity_readiness_test.py \
            tool/worker_e_test_center_registration_test.py
          python tool/worker_e_refresh_evidence_manifest.py --check --project .
          python tool/worker_e_test_center_registration.py --check --project .
          python tool/worker_e_native_parity_readiness.py --check --project .
      - name: Validate canonical Test Center and P8
        shell: bash
        run: |
          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/test_center_contracts_test.py
          python tool/test_center_assurance_hierarchy.py check --project .
          python -m unittest -v tool/test_center_assurance_hierarchy_test.py
      - name: Prove canonical manifest and non-mutation
        shell: bash
        run: |
          set -euo pipefail
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/SOURCE_MANIFEST.before"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/SOURCE_MANIFEST.before" SOURCE_MANIFEST.sha256
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/SOURCE_MANIFEST.before" SOURCE_MANIFEST.sha256
          git diff --check
          git diff --exit-code
