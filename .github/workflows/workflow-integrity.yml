name: Workflow Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/chat-control-plane
    paths:
      - .github/workflows/**
      - tool/workflow_integrity_test.rb
      - SOURCE_MANIFEST.sha256
  pull_request:
    paths:
      - .github/workflows/**
      - tool/workflow_integrity_test.rb
      - SOURCE_MANIFEST.sha256

permissions:
  contents: read

concurrency:
  group: workflow-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-chat-control-plane:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/chat-control-plane'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/chat-control-plane
          fetch-depth: 0
          persist-credentials: true
      - name: Patch adaptive Runner seam
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/product/planning_runtime.dart')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one patch anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import 'agent_context_v2.dart';\n",
              "import 'adaptive_decomposition.dart';\nimport 'agent_context_v2.dart';\n",
          )
          replace_once(
              "        var succeeded = false;\n        String? lastError;\n        String? lastErrorCode;\n        final firstAttempt =\n",
              "        var succeeded = false;\n        var decomposed = false;\n        String? lastError;\n        String? lastErrorCode;\n        final firstAttempt =\n",
          )
          replace_once(
              "          } catch (error) {\n            lastError = redactor.redact('$error');\n",
              "          } catch (error) {\n            if (error is ProductException &&\n                error.code == 'task_split_required') {\n              final adaptiveRun = await _applyAdaptiveSplit(\n                run: (await repositories.runs.get(run.id)) ?? run,\n                itemIndex: itemIndex,\n                blocked: progress,\n                error: error,\n              );\n              if (adaptiveRun != null) {\n                run = adaptiveRun;\n                decomposed = true;\n                consecutiveFailures = 0;\n                break;\n              }\n            }\n            lastError = redactor.redact('$error');\n",
          )
          replace_once(
              "        }\n        if (!succeeded) {\n          final failedItems = List<WorkItemProgress>.from(run.items);\n",
              "        }\n        if (decomposed) {\n          itemIndex -= 1;\n          continue;\n        }\n        if (!succeeded) {\n          final failedItems = List<WorkItemProgress>.from(run.items);\n",
          )

          marker = "  _RetryDecision _retryDecision({\n"
          if text.count(marker) != 1:
              raise SystemExit('retry decision insertion anchor changed')
          methods = r'''  int _adaptiveGeneration(
    List<WorkItemProgress> items,
    String baseId,
  ) {
    final pattern = RegExp(
      '^${RegExp.escape(baseId)}__adaptive_([0-9]+)_[0-9]+\$',
    );
    var generation = 0;
    for (final progress in items) {
      final match = pattern.firstMatch(progress.item.id);
      if (match == null) continue;
      final value = int.tryParse(match.group(1) ?? '') ?? 0;
      generation = max(generation, value);
    }
    return generation;
  }

  Future<RunRecord?> _applyAdaptiveSplit({
    required RunRecord run,
    required int itemIndex,
    required WorkItemProgress blocked,
    required ProductException error,
  }) async {
    if (itemIndex < 0 || itemIndex >= run.items.length) return null;
    const service = AdaptiveDecompositionService();
    const splitter = AdaptiveWorkItemSplitter();
    final generation = _adaptiveGeneration(run.items, blocked.item.id);
    final splitItems = splitter.split(
      blocked.item,
      generation: generation + 1,
    );
    if (splitItems.length < 2) return null;

    final remainingAfterCurrent = run.items
        .skip(itemIndex + 1)
        .where((item) => item.state != WorkItemState.succeeded)
        .map((item) => item.item)
        .toList(growable: false);
    final proposed = <WorkItem>[...splitItems, ...remainingAfterCurrent];
    final proposedHash = service.remainingCriteriaHash(proposed);
    final stalledTurns =
        int.tryParse(error.details['stalledTurns']?.toString() ?? '') ?? 4;
    final runtimePlan = ExecutionPlan(
      id: run.command.plan.id,
      contractId: run.command.plan.contractId,
      complexity: run.command.plan.complexity,
      rationale: run.command.plan.rationale,
      items: run.items.map((item) => item.item).toList(growable: false),
      createdAt: run.command.plan.createdAt,
    );
    final decision = service.decide(
      AdaptiveDecompositionRequest(
        plan: runtimePlan,
        progress: run.items,
        convergenceDecision: ConvergenceDecision(
          action: ConvergenceAction.splitTask,
          reason: error.message,
          stalledTurns: stalledTurns,
        ),
        semanticProgress: false,
        productiveRepairs: 0,
        discoveredSubproblems: splitItems.length,
        proposedRemainingItems: proposed,
        materiality: const AdaptivePlanMateriality(),
        generation: generation,
        previousRemainingCriteriaHashes:
            generation == 0 ? const <String>{} : <String>{proposedHash},
      ),
    );
    if (!decision.mayContinue) {
      await _bestEffortEvent(
        'work_item.adaptive_decomposition_blocked',
        run.id,
        <String, dynamic>{
          'runId': run.id,
          'workItemId': blocked.item.id,
          'generation': decision.generation,
          'disposition': decision.disposition.name,
          'remainingCriteriaHash': decision.remainingCriteriaHash,
          'permissionsUnchanged': true,
        },
      );
      return null;
    }

    final splitIds = splitItems.map((item) => item.id).toSet();
    final existingRemaining = <String, WorkItemProgress>{
      for (final progress in run.items.skip(itemIndex + 1))
        progress.item.id: progress,
    };
    final projectedRemaining = decision.remainingItems.map((item) {
      if (splitIds.contains(item.id)) {
        return WorkItemProgress(
          item: item,
          state: WorkItemState.queued,
          attempts: 0,
        );
      }
      final existing = existingRemaining[item.id];
      if (existing == null) {
        return WorkItemProgress(
          item: item,
          state: WorkItemState.queued,
          attempts: 0,
        );
      }
      return WorkItemProgress(
        item: item,
        state: existing.state,
        attempts: existing.attempts,
        lastError: existing.lastError,
        startedAt: existing.startedAt,
        completedAt: existing.completedAt,
      );
    }).toList(growable: false);
    final nextItems = <WorkItemProgress>[
      ...run.items.take(itemIndex),
      ...projectedRemaining,
    ];
    final updated = run.copyWith(items: nextItems, clearFailure: true);
    await _save(updated);
    final now = DateTime.now().toUtc();
    await repositories.workflow.recordTaskAttempt(
      runId: run.id,
      workItemId: blocked.item.id,
      attempt: max(1, blocked.attempts),
      state: 'decomposed',
      errorClass: 'convergence',
      errorCode: 'task_split_required',
      retryDisposition: 'adaptive_decomposition',
      startedAt: blocked.startedAt,
      completedAt: now,
      details: <String, dynamic>{
        'generation': decision.generation,
        'replacementIds': splitItems.map((item) => item.id).toList(),
        'remainingCriteriaHash': decision.remainingCriteriaHash,
        'permissionsUnchanged': true,
      },
    );
    await repositories.workflow.createCheckpoint(
      runId: run.id,
      workItemId: blocked.item.id,
      kind: 'adaptive_plan_revised',
      state: <String, dynamic>{
        'generation': decision.generation,
        'replacementIds': splitItems.map((item) => item.id).toList(),
        'remainingCriteriaHash': decision.remainingCriteriaHash,
        'permissionsUnchanged': true,
      },
    );
    final diagnostics = <String, dynamic>{
      'runId': run.id,
      'workItemId': blocked.item.id,
      'generation': decision.generation,
      'replacementIds': splitItems.map((item) => item.id).toList(),
      'remainingCriteriaHash': decision.remainingCriteriaHash,
      'completedItemsPreserved': run.items
          .take(itemIndex)
          .where((item) => item.state == WorkItemState.succeeded)
          .map((item) => item.item.id)
          .toList(),
      'permissionsUnchanged': true,
    };
    await _bestEffortAudit(
      'work_item.adaptive_decomposition_applied',
      run.id,
      diagnostics,
    );
    await _bestEffortEvent(
      'work_item.adaptive_decomposition_applied',
      run.id,
      diagnostics,
    );
    liveSignals.publish(
      LiveRunSignal.phase(
        runId: run.id,
        phase: 'adaptive_decomposition',
        message: decision.userMessage,
      ),
    );
    return updated;
  }

'''
          text = text.replace(marker, methods + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Format and targeted verification
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/product/adaptive_decomposition.dart \
            lib/product/planning_runtime.dart \
            test/product/adaptive_decomposition_test.dart
          flutter pub get
          flutter test \
            test/product/adaptive_decomposition_test.dart \
            test/product/chat_control_plane_test.dart
      - name: Refresh governed source manifest and publish product patch
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          git diff --check
          git show origin/main:.github/workflows/workflow-integrity.yml > .github/workflows/workflow-integrity.yml
          git add \
            lib/product/adaptive_decomposition.dart \
            lib/product/planning_runtime.dart \
            test/product/adaptive_decomposition_test.dart \
            SOURCE_MANIFEST.sha256 \
            .github/workflows/workflow-integrity.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git config user.name 'Kristin Chat Delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(runner): continue with adaptive task decomposition'
          git push origin HEAD:feat/chat-control-plane

  validate:
    name: workflow-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow syntax and immutable dependencies
        shell: bash
        run: ruby tool/workflow_integrity_test.rb .

      - name: Prove validation is non-mutating
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
