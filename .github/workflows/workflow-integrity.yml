name: Workflow Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - tool/workflow_integrity_test.rb
      - SOURCE_MANIFEST.sha256
  pull_request:
    paths:
      - .github/workflows/**
      - tool/workflow_integrity_test.rb
      - SOURCE_MANIFEST.sha256

permissions:
  contents: read

concurrency:
  group: workflow-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: workflow-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow syntax and immutable dependencies
        shell: bash
        run: ruby tool/workflow_integrity_test.rb .

      - name: Prove validation is non-mutating
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
