name: Temporary P5 current-main Product delivery

"on":
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: temp-p5-main-delivery-20260815
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact canonical P5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/f/P5-001-information-architecture
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Materialize, validate, and publish runnable Product candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tool/temp_p5_main_delivery_20260815.py')
          text = path.read_text(encoding='utf-8')

          old = '''    run("dart", "format", *format_paths)
              run("python3", "tool/p1a_refresh_source_manifest.py", ".")
          '''.replace('          ', '')
          new = '''    run("flutter", "pub", "get")
              run("dart", "format", *format_paths)
              run("python3", "tool/p1a_refresh_source_manifest.py", ".")
          '''.replace('          ', '')
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    run("python3", "tool/p1a_text_eof_contract_test.py", "--project", ".")
              run("flutter", "pub", "get")
              run("python3", "tool/dart_format_scope.py", "--check")
          '''.replace('          ', '')
          new = '''    run("python3", "tool/p1a_text_eof_contract_test.py", "--project", ".")
              run("python3", "tool/dart_format_scope.py", "--check")
          '''.replace('          ', '')
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = "p5_information_architecture/p5_controller.dart';\n"
          new = "p5_information_architecture/p5_controller.dart'\n    hide P5IterableFirstOrNull;\n"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = 'Install or start it, then restart Kristin.'
          new = 'Please install or start it, then restart Kristin.'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = '\ndef write_regressions() -> None:\n'
          assert text.count(marker) == 1
          inventory_function = r'''

def update_p2_test_inventory() -> None:
    path = REPO_ROOT / "config/p2_source_inventory.v1.json"
    text = path.read_text(encoding="utf-8")
    text = replace_once(
        text,
        '    "test/product/p2_owner_mode_test.dart",\n',
        '    "test/product/p2_owner_mode_failure_presentation_test.dart",\n'
        '    "test/product/p2_owner_mode_test.dart",\n',
        "P2 Owner Mode recovery test inventory",
    )
    path.write_text(text, encoding="utf-8", newline="\n")
'''
          text = text.replace(marker, inventory_function + marker, 1)

          old = '''    update_source_contract()
              write_regressions()
          '''.replace('          ', '')
          new = '''    update_source_contract()
              update_p2_test_inventory()
              write_regressions()
          '''.replace('          ', '')
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        "SOURCE_MANIFEST.sha256",
              "lib/product/ui.dart",
          '''.replace('          ', '')
          new = '''        "SOURCE_MANIFEST.sha256",
              "config/p2_source_inventory.v1.json",
              "lib/product/ui.dart",
          '''.replace('          ', '')
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python3 tool/temp_p5_main_delivery_20260815.py
