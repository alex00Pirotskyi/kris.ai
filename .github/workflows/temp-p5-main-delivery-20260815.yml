name: Temporary P5 current-main Product delivery

"on":
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: temp-p5-main-delivery-20260815
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact canonical P5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/f/P5-001-information-architecture
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Materialize, validate, and publish runnable Product candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("tool/temp_p5_main_delivery_20260815.py"); t=p.read_text(encoding="utf-8"); old="    run(\"dart\", \"format\", *format_paths)\n    run(\"python3\", \"tool/p1a_refresh_source_manifest.py\", \".\")\n"; new="    run(\"flutter\", \"pub\", \"get\")\n    run(\"dart\", \"format\", *format_paths)\n    run(\"python3\", \"tool/p1a_refresh_source_manifest.py\", \".\")\n"; late="    run(\"python3\", \"tool/p1a_text_eof_contract_test.py\", \"--project\", \".\")\n    run(\"flutter\", \"pub\", \"get\")\n    run(\"python3\", \"tool/dart_format_scope.py\", \"--check\")\n"; late_new="    run(\"python3\", \"tool/p1a_text_eof_contract_test.py\", \"--project\", \".\")\n    run(\"python3\", \"tool/dart_format_scope.py\", \"--check\")\n"; assert t.count(old)==1 and t.count(late)==1; p.write_text(t.replace(old,new,1).replace(late,late_new,1),encoding="utf-8",newline="\n")'
          python3 tool/temp_p5_main_delivery_20260815.py
