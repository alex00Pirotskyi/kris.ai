name: Temporary P5 current-main Product delivery

"on":
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: temp-p5-main-delivery-20260815
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact canonical P5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/f/P5-001-information-architecture
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
          check-latest: false
          cache: npm
          cache-dependency-path: automation_host/package-lock.json

      - name: Materialize, validate, and publish runnable Product candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tool/temp_p5_main_delivery_20260815.py')
          text = path.read_text(encoding='utf-8')

          def replace_one(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_one(
              'import os\nimport re\n',
              'import json\nimport os\nimport re\n',
              'json import',
          )
          replace_one(
              '    run("dart", "format", *format_paths)\n'
              '    run("python3", "tool/p1a_refresh_source_manifest.py", ".")\n',
              '    run("flutter", "pub", "get")\n'
              '    run("dart", "format", *format_paths)\n'
              '    run("python3", "tool/p1a_refresh_source_manifest.py", ".")\n',
              'dependency-before-format order',
          )
          replace_one(
              '    run("python3", "tool/p1a_text_eof_contract_test.py", "--project", ".")\n'
              '    run("flutter", "pub", "get")\n'
              '    run("python3", "tool/dart_format_scope.py", "--check")\n',
              '    run("python3", "tool/p1a_text_eof_contract_test.py", "--project", ".")\n'
              '    run("python3", "tool/dart_format_scope.py", "--check")\n',
              'remove duplicate dependency resolution',
          )
          replace_one(
              '    run("npm", "test", "--prefix", "automation_host")\n',
              '    run(\n'
              '        "npm",\n'
              '        "ci",\n'
              '        "--prefix",\n'
              '        "automation_host",\n'
              '        "--ignore-scripts",\n'
              '        "--no-audit",\n'
              '        "--no-fund",\n'
              '    )\n'
              '    run("npm", "test", "--prefix", "automation_host")\n',
              'locked automation-host install',
          )
          replace_one(
              "      return 'The Kristin Authority Service is not installed or running. Install or start it, then restart Kristin. Owner Mode stayed locked and no host authority was granted.';",
              "      return 'The Kristin Authority Service is unavailable. Please install or start it, then restart Kristin. Owner Mode stayed locked and no host authority was granted.';",
              'actionable Owner Mode copy',
          )
          replace_one(
              '    rebuild_from_main(transport_head)\n'
              '    integrate_main_shell()\n',
              '    rebuild_from_main(transport_head)\n'
              '    controller_path = (\n'
              '        REPO_ROOT\n'
              '        / "lib/product/p5_information_architecture/p5_controller.dart"\n'
              '    )\n'
              '    controller_text = controller_path.read_text(encoding="utf-8")\n'
              '    controller_text = replace_once(\n'
              '        controller_text,\n'
              '        "extension P5IterableFirstOrNull<T> on Iterable<T> {",\n'
              '        "extension _P5IterableFirstOrNull<T> on Iterable<T> {",\n'
              '        "private P5 iterable extension",\n'
              '    )\n'
              '    controller_path.write_text(\n'
              '        controller_text,\n'
              '        encoding="utf-8",\n'
              '        newline="\\n",\n'
              '    )\n'
              '    integrate_main_shell()\n',
              'controller extension isolation',
          )
          inventory_function = (
              '\n\ndef update_p2_source_inventory() -> None:\n'
              '    path = REPO_ROOT / "config/p2_source_inventory.v1.json"\n'
              '    payload = json.loads(path.read_text(encoding="utf-8"))\n'
              '    test_paths = payload.get("testDart")\n'
              '    if not isinstance(test_paths, list):\n'
              '        raise RuntimeError("P2 source inventory testDart is not a list")\n'
              '    entry = "test/product/p2_owner_mode_failure_presentation_test.dart"\n'
              '    if entry not in test_paths:\n'
              '        test_paths.append(entry)\n'
              '    payload["testDart"] = sorted(str(item) for item in test_paths)\n'
              '    path.write_text(\n'
              '        json.dumps(payload, indent=2, ensure_ascii=False) + "\\n",\n'
              '        encoding="utf-8",\n'
              '        newline="\\n",\n'
              '    )\n'
          )
          replace_one(
              '\n\ndef validate_product() -> None:\n',
              inventory_function + '\n\ndef validate_product() -> None:\n',
              'P2 source inventory function',
          )
          replace_one(
              '    write_regressions()\n'
              '    validate_product()\n',
              '    write_regressions()\n'
              '    update_p2_source_inventory()\n'
              '    validate_product()\n',
              'P2 source inventory call',
          )
          replace_one(
              '    exact = {\n'
              '        "SOURCE_MANIFEST.sha256",\n',
              '    exact = {\n'
              '        "SOURCE_MANIFEST.sha256",\n'
              '        "config/p2_source_inventory.v1.json",\n',
              'authorized P2 inventory scope',
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python3 tool/temp_p5_main_delivery_20260815.py
