name: Temporary P5 current-main Product delivery

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: temp-p5-main-delivery-20260815
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_BRANCH: agent/f/P5-001-information-architecture
      EXPECTED_PRE_TRANSPORT_HEAD: 00de2bbf075d4cb91e0f82a1326f9fa6e975786d
      EXPECTED_MAIN: 67e6e0314877d4ff3233d3e11e0743dd7562de55
      P5_SOURCE_BRANCH: agent/help/elastic-7d41b6a2/mission-005/p5-stale-preview
      P5_SOURCE_HEAD: c55e093fec9c5858b63b77c80c7abe2d653e863f
    steps:
      - name: Check out exact canonical P5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/f/P5-001-information-architecture
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Bind exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRE_TRANSPORT_HEAD"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$P5_SOURCE_BRANCH:refs/remotes/origin/p5-source"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/p5-source)" = "$P5_SOURCE_HEAD"
          printf 'transport=%s\nmain=%s\np5_source=%s\n' \
            "$GITHUB_SHA" "$EXPECTED_MAIN" "$P5_SOURCE_HEAD"

      - name: Rebuild Product tree from protected main
        shell: bash
        run: |
          set -euo pipefail
          git read-tree --reset -u "$EXPECTED_MAIN"
          git checkout "$P5_SOURCE_HEAD" -- \
            lib/product/p5_information_architecture \
            test/product/p5_information_architecture
          rm -f \
            test/product/p5_information_architecture/worker_f_p5_ia.py \
            test/product/p5_information_architecture/worker_f_p5_ia_test.py
          test ! -e lib/p5_ia_preview.dart
          test ! -e .github/workflows/temp-p5-main-delivery-20260815.yml

      - name: Wire the experience surface into the shipped app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ui_path = Path('lib/product/ui.dart')
          ui = ui_path.read_text(encoding='utf-8')
          old_import = "import 'p2_app_shell.dart';\n"
          new_imports = (
              "import 'p2_product_runtime_bootstrap.dart';\n"
              "import 'p5_information_architecture/p5_controller.dart';\n"
              "import 'p5_information_architecture/p5_prototype.dart';\n"
          )
          assert ui.count(old_import) == 1
          ui = ui.replace(old_import, new_imports, 1)

          old_home = """      home: P2KristinShell(
        ownerMode: widget.runtime.p2OwnerMode,
        chat: ChatStudio(
          runtime: widget.runtime,
          api: api,
          startupError: startupError,
        ),
      ),
"""
          new_home = """      home: KristinMainShell(
        ownerMode: widget.runtime.p2OwnerMode,
        chat: ChatStudio(
          runtime: widget.runtime,
          api: api,
          startupError: startupError,
        ),
      ),
"""
          assert ui.count(old_home) == 1
          ui = ui.replace(old_home, new_home, 1)

          marker = 'ThemeData _studioTheme(Brightness brightness) {'
          assert ui.count(marker) == 1
          shell = r'''
class KristinMainShell extends StatefulWidget {
  const KristinMainShell({
    super.key,
    required this.ownerMode,
    required this.chat,
  });

  final P2ProductRuntimeOwnerModeHandle ownerMode;
  final Widget chat;

  @override
  State<KristinMainShell> createState() => _KristinMainShellState();
}

class _KristinMainShellState extends State<KristinMainShell> {
  var _index = 0;
  late final P5InformationArchitectureController _experienceController;

  @override
  void initState() {
    super.initState();
    _experienceController = P5InformationArchitectureController();
  }

  @override
  void dispose() {
    _experienceController.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    final qaPreview = widget.ownerMode.runtimeProvenance['qaPreview'] == true;
    final ownerAvailable = widget.ownerMode.available;
    final pages = <Widget>[
      widget.chat,
      P5InformationArchitecturePrototype(
        controller: _experienceController,
      ),
      widget.ownerMode.buildWorkspace(
        key: const ValueKey<String>('kristin-owner-mode-workspace'),
      ),
    ];
    final wide = MediaQuery.sizeOf(context).width >= 1100;
    final shell = Scaffold(
      body: wide
          ? Row(
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: <Widget>[
                NavigationRail(
                  selectedIndex: _index,
                  labelType: NavigationRailLabelType.all,
                  onDestinationSelected: _selectDestination,
                  destinations: <NavigationRailDestination>[
                    const NavigationRailDestination(
                      icon: Icon(Icons.chat_bubble_outline),
                      selectedIcon: Icon(Icons.chat_bubble),
                      label: Text('Chat'),
                    ),
                    const NavigationRailDestination(
                      icon: Icon(Icons.dashboard_customize_outlined),
                      selectedIcon: Icon(Icons.dashboard_customize),
                      label: Text('Experience'),
                    ),
                    NavigationRailDestination(
                      icon: Icon(
                        ownerAvailable
                            ? Icons.admin_panel_settings_outlined
                            : Icons.gpp_bad_outlined,
                      ),
                      selectedIcon: Icon(
                        ownerAvailable
                            ? Icons.admin_panel_settings
                            : Icons.gpp_bad,
                      ),
                      label: const Text('Owner Mode'),
                    ),
                  ],
                ),
                const VerticalDivider(width: 1),
                Expanded(
                  child: IndexedStack(index: _index, children: pages),
                ),
              ],
            )
          : IndexedStack(index: _index, children: pages),
      bottomNavigationBar: wide
          ? null
          : NavigationBar(
              selectedIndex: _index,
              onDestinationSelected: _selectDestination,
              destinations: <NavigationDestination>[
                const NavigationDestination(
                  icon: Icon(Icons.chat_bubble_outline),
                  selectedIcon: Icon(Icons.chat_bubble),
                  label: 'Chat',
                ),
                const NavigationDestination(
                  icon: Icon(Icons.dashboard_customize_outlined),
                  selectedIcon: Icon(Icons.dashboard_customize),
                  label: 'Experience',
                ),
                NavigationDestination(
                  icon: Icon(
                    ownerAvailable
                        ? Icons.admin_panel_settings_outlined
                        : Icons.gpp_bad_outlined,
                  ),
                  selectedIcon: Icon(
                    ownerAvailable
                        ? Icons.admin_panel_settings
                        : Icons.gpp_bad,
                  ),
                  label: 'Owner Mode',
                ),
              ],
            ),
    );
    if (!qaPreview) return shell;
    return Banner(
      message: 'OWNER-RISK QA — SECURITY EVIDENCE WAIVED',
      location: BannerLocation.topEnd,
      color: Colors.deepOrange,
      child: shell,
    );
  }

  void _selectDestination(int value) {
    if (value == _index) return;
    setState(() => _index = value);
  }
}

'''
          ui = ui.replace(marker, shell + marker, 1)
          ui_path.write_text(ui, encoding='utf-8', newline='\n')

          contract_path = Path('test/product/source_contract_test.dart')
          contract = contract_path.read_text(encoding='utf-8')
          p5_paths = """        'lib/product/p5_information_architecture/p5_components.dart',
        'lib/product/p5_information_architecture/p5_controller.dart',
        'lib/product/p5_information_architecture/p5_fixtures.dart',
        'lib/product/p5_information_architecture/p5_models.dart',
        'lib/product/p5_information_architecture/p5_prototype.dart',
        'lib/product/p5_information_architecture/p5_support_workspaces.dart',
        'lib/product/p5_information_architecture/p5_task_workspaces.dart',
        'lib/product/p5_information_architecture/p5_verification_workspaces.dart',
"""
          inventory_marker = "        'lib/product/mcp_protocol.dart',\n"
          assert contract.count(inventory_marker) == 1
          contract = contract.replace(inventory_marker, p5_paths + inventory_marker, 1)

          pattern = re.compile(
              r"    test\('application opens chat-first through the governed P2 shell'.*?^    \}\);\n",
              re.MULTILINE | re.DOTALL,
          )
          replacement = """    test('application opens chat-first through the integrated experience shell', () {
      final ui = source('lib/product/ui.dart');
      expect(ui, contains('home: KristinMainShell('));
      expect(ui, contains('var _index = 0;'));
      final chatOffset = ui.indexOf('widget.chat,');
      final experienceOffset = ui.indexOf('P5InformationArchitecturePrototype(');
      final ownerOffset = ui.indexOf('widget.ownerMode.buildWorkspace(');
      expect(chatOffset, greaterThanOrEqualTo(0));
      expect(experienceOffset, greaterThan(chatOffset));
      expect(ownerOffset, greaterThan(experienceOffset));
    });
"""
          contract, count = pattern.subn(replacement, contract, count=1)
          assert count == 1
          assert contract.count("expect(ui, contains('home: P2KristinShell('));") == 1
          contract = contract.replace(
              "expect(ui, contains('home: P2KristinShell('));",
              "expect(ui, contains('home: KristinMainShell('));",
          )
          assert contract.count("final p2Shell = source('lib/product/p2_app_shell.dart');") == 1
          contract = contract.replace(
              "final p2Shell = source('lib/product/p2_app_shell.dart');",
              "final shell = source('lib/product/ui.dart');",
          )
          assert contract.count("expect(p2Shell, contains('var _index = 0;'));") == 1
          contract = contract.replace(
              "expect(p2Shell, contains('var _index = 0;'));",
              "expect(shell, contains('var _index = 0;'));",
          )
          assert contract.count("expect(p2Shell, contains('widget.chat,'));") == 1
          contract = contract.replace(
              "expect(p2Shell, contains('widget.chat,'));",
              "expect(shell, contains('widget.chat,'));",
          )
          assert "home: P2KristinShell(" not in contract
          contract_path.write_text(contract, encoding='utf-8', newline='\n')
          PY

      - name: Repair Owner Mode failure presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/product/p2_product_runtime_bootstrap.dart')
          text = path.read_text(encoding='utf-8')

          anchor = """  bool get completionEligible =>
      runtime?.authority.completionEligible == true &&
      runtime?.authority.authorityKind == 'p1-isolated-authority-service-v2';

"""
          addition = """  bool get completionEligible =>
      runtime?.authority.completionEligible == true &&
      runtime?.authority.authorityKind == 'p1-isolated-authority-service-v2';

  String get diagnosticCode =>
      _normalizedFailureCode(failureCode ?? 'owner_runtime_start_failed');

  String get recoveryMessage {
    if (diagnosticCode == 'merged_p1a_service_unavailable') {
      return 'The Kristin Authority Service is not installed or running. Install or start it, then restart Kristin. Owner Mode stayed locked and no host authority was granted.';
    }
    if (diagnosticCode == 'product_runtime_p2_not_initialized') {
      return 'Owner Mode has not finished starting. Restart Kristin and open Owner Mode again. No host authority was granted.';
    }
    return 'Kristin could not start Owner Mode safely. Review the diagnostic code, repair the local runtime, and restart Kristin. No host authority was granted.';
  }

"""
          assert text.count(anchor) == 1
          text = text.replace(anchor, addition, 1)

          old_message = """                const Text(
                  'Kristin failed closed because the isolated P1 authority service or the application-owned P2 runtime bundle was unavailable. No host authority was granted.',
                  textAlign: TextAlign.center,
                ),
"""
          new_message = """                Text(
                  recoveryMessage,
                  textAlign: TextAlign.center,
                ),
"""
          assert text.count(old_message) == 1
          text = text.replace(old_message, new_message, 1)
          old_status = "                SelectableText('Status: ${failureCode ?? 'unknown'}'),\n"
          new_status = "                SelectableText('Diagnostic: $diagnosticCode'),\n"
          assert text.count(old_status) == 1
          text = text.replace(old_status, new_status, 1)

          old_blocked = """  static P2ProductRuntimeOwnerModeHandle blocked(String code) =>
      P2ProductRuntimeOwnerModeHandle._(runtime: null, failureCode: code);
}
"""
          new_blocked = """  static P2ProductRuntimeOwnerModeHandle blocked(String code) =>
      P2ProductRuntimeOwnerModeHandle._(
        runtime: null,
        failureCode: _normalizedFailureCode(code),
      );

  static String _normalizedFailureCode(String code) {
    final normalized = code
        .trim()
        .replaceFirst(
          RegExp(r'^Bad[ _]state[:_ ]+', caseSensitive: false),
          '',
        )
        .replaceAll(RegExp(r'[^A-Za-z0-9_.:-]'), '_')
        .replaceAll(RegExp(r'_+'), '_');
    return normalized.isEmpty ? 'owner_runtime_start_failed' : normalized;
  }
}
"""
          assert text.count(old_blocked) == 1
          text = text.replace(old_blocked, new_blocked, 1)

          safe_anchor = """  static String _safeFailureCode(Object error) {
    final value = '$error';
"""
          safe_replacement = """  static String _safeFailureCode(Object error) {
    if (error is StateError &&
        error.message == 'merged_p1a_service_unavailable') {
      return 'merged_p1a_service_unavailable';
    }
    final value = '$error';
"""
          assert text.count(safe_anchor) == 1
          text = text.replace(safe_anchor, safe_replacement, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Add shipped-shell and Owner Mode regressions
        shell: bash
        run: |
          set -euo pipefail
          cat > test/product/p5_main_shell_integration_test.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:kristin_local_agent/product/p2_product_runtime_bootstrap.dart';
          import 'package:kristin_local_agent/product/ui.dart';

          void main() {
            testWidgets('main shell exposes chat, experience, and Owner Mode',
                (tester) async {
              await tester.binding.setSurfaceSize(const Size(1280, 900));
              addTearDown(() => tester.binding.setSurfaceSize(null));
              final ownerMode = P2ProductRuntimeOwnerModeHandle.blocked(
                'Bad state: merged_p1a_service_unavailable',
              );

              await tester.pumpWidget(
                MaterialApp(
                  home: KristinMainShell(
                    ownerMode: ownerMode,
                    chat: const Center(child: Text('Chat surface')),
                  ),
                ),
              );

              expect(find.text('Chat surface'), findsOneWidget);
              await tester.tap(find.text('Experience'));
              await tester.pumpAndSettle();
              expect(find.byKey(const Key('workspace-title')), findsOneWidget);

              await tester.tap(find.text('Owner Mode'));
              await tester.pumpAndSettle();
              expect(find.text('Owner Mode is unavailable'), findsOneWidget);
              expect(find.textContaining('Diagnostic: merged_p1a_service_unavailable'),
                  findsOneWidget);
              expect(find.textContaining('Bad state'), findsNothing);
            });
          }
          DART

          cat > test/product/p2_owner_mode_failure_presentation_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:kristin_local_agent/product/p2_product_runtime_bootstrap.dart';

          void main() {
            test('missing merged P1A service returns a stable diagnostic', () async {
              final root = await Directory.systemTemp.createTemp('kristin-p1a-missing-');
              addTearDown(() => root.delete(recursive: true));

              final handle = await P2ProductRuntimeBootstrap.start(
                dataRoot: root,
                p1AuthorityService: null,
              );

              expect(handle.available, isFalse);
              expect(handle.failureCode, 'merged_p1a_service_unavailable');
              expect(
                handle.runtimeProvenance['failureCode'],
                'merged_p1a_service_unavailable',
              );
            });

            testWidgets('blocked Owner Mode explains recovery without raw Dart text',
                (tester) async {
              final handle = P2ProductRuntimeOwnerModeHandle.blocked(
                'Bad_state:_merged_p1a_service_unavailable',
              );
              await tester.pumpWidget(MaterialApp(home: handle.buildWorkspace()));

              expect(find.textContaining('install or start it'), findsOneWidget);
              expect(find.textContaining('Diagnostic: merged_p1a_service_unavailable'),
                  findsOneWidget);
              expect(find.textContaining('Bad state'), findsNothing);
              expect(find.textContaining('Bad_state'), findsNothing);
            });
          }
          DART

      - name: Format and materialize canonical source inventory
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/product/ui.dart \
            lib/product/p2_product_runtime_bootstrap.dart \
            lib/product/p5_information_architecture \
            test/product/p5_information_architecture \
            test/product/p5_main_shell_integration_test.dart \
            test/product/p2_owner_mode_failure_presentation_test.dart \
            test/product/source_contract_test.dart
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/source-manifest.first
          python3 tool/p1a_refresh_source_manifest.py .
          cmp /tmp/source-manifest.first SOURCE_MANIFEST.sha256
          python3 tool/p1a_text_eof_contract_test.py --project .

      - name: Validate complete runnable Product candidate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python3 tool/dart_format_scope.py --check
          flutter analyze --no-pub --fatal-warnings --fatal-infos
          flutter test --no-pub --concurrency=1 --reporter expanded
          npm test --prefix automation_host

      - name: Prove exact Product scope
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import subprocess

          main = '67e6e0314877d4ff3233d3e11e0743dd7562de55'
          paths = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', main, '--'],
              text=True,
          ).splitlines()
          exact = {
              'SOURCE_MANIFEST.sha256',
              'lib/product/ui.dart',
              'lib/product/p2_product_runtime_bootstrap.dart',
              'test/product/source_contract_test.dart',
              'test/product/p5_main_shell_integration_test.dart',
              'test/product/p2_owner_mode_failure_presentation_test.dart',
          }
          prefixes = (
              'lib/product/p5_information_architecture/',
              'test/product/p5_information_architecture/',
          )
          unauthorized = [
              path for path in paths
              if path not in exact and not path.startswith(prefixes)
          ]
          assert not unauthorized, unauthorized
          assert len(paths) >= 20, paths
          assert '.github/workflows/temp-p5-main-delivery-20260815.yml' not in paths
          assert 'lib/p5_ia_preview.dart' not in paths
          print('\n'.join(paths))
          PY

      - name: Publish two-parent current-main candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'feat(p5): ship integrated experience workspace' \
            'Rebuild P5 on protected main, expose the tested experience workspace from the normal app shell, and replace raw Owner Mode startup errors with stable actionable recovery diagnostics.' \
            | git commit-tree "$tree" -p "$GITHUB_SHA" -p "$EXPECTED_MAIN")"
          git reset --hard "$commit"
          test "$(git rev-parse HEAD^{tree})" = "$tree"
          test -z "$(git status --porcelain=v1)"
          git push origin "$commit:refs/heads/$EXPECTED_BRANCH"
          {
            echo "### Published Product candidate"
            echo "- commit: \`$commit\`"
            echo "- tree: \`$tree\`"
            echo "- base main: \`$EXPECTED_MAIN\`"
          } >> "$GITHUB_STEP_SUMMARY"
