name: TEMP Worker B Exact Review Validation 90c5746

on:
  pull_request:
    paths:
      - .github/workflows/temp-worker-b-exact-review-validation-90c5746.yml

permissions:
  contents: read

jobs:
  exact-worker-b-review-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 90c574665363140aeb6cf764ab8387714cab88cf
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Validate exact Worker B final review head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '90c574665363140aeb6cf764ab8387714cab88cf'
          test "$(git rev-parse 'HEAD^{tree}')" = '438fe3f710c0fed32106ee6acdc138f4e4c6accc'
          sha256sum -c docs/roadmap/anarchy/reviews/WORKER_B_A_REVIEW_89a1533.json.sha256
          python -m unittest -v tool/test_center_contracts_test.py
          python tool/test_center_contracts.py check --project .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.before"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.before" SOURCE_MANIFEST.sha256
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.before" SOURCE_MANIFEST.sha256
          python tool/source_tree_policy_test.py
          python tool/generated_state_guard_test.py
          python tool/p0_010_generated_state_test.py --project .
          python tool/generated_state_guard.py audit --project . --strict
          python tool/p1a_source_inventory_test.py --project .
          python tool/p2_source_inventory_test.py --project .
          git diff --check
          test -z "$(git status --short)"
          {
            echo 'commit=90c574665363140aeb6cf764ab8387714cab88cf'
            echo 'tree=438fe3f710c0fed32106ee6acdc138f4e4c6accc'
            echo 'reviewArtifactSha256=d613497c297e332bab8ea47d3e29e96bc242dc7ed801b9fb57aa439ef93aac4d'
            echo 'semanticTests=PASS'
            echo 'testCenterCheck=PASS_NON_MUTATING'
            echo 'manifestFirstWrite=BYTE_IDENTICAL'
            echo 'manifestSecondWrite=BYTE_IDENTICAL'
            echo 'generatedState=PASS'
            echo 'p1aSourceInventory=PASS'
            echo 'p2SourceInventory=PASS'
            echo 'gitDiffCheck=PASS'
            echo 'gitStatus=CLEAN'
          } > "$RUNNER_TEMP/worker-b-exact-review-validation.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-b-exact-review-validation-90c5746
          path: ${{ runner.temp }}/worker-b-exact-review-validation.txt
          if-no-files-found: error
          retention-days: 90
