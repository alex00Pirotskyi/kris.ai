name: P8 Workflow Chaos

on:
  push:
    branches: [main]
    paths:
      - tool/p8_workflow_chaos_test.py
      - tool/workflow_kernel_test.py
      - migrations/workflow/**
      - .github/workflows/p8-workflow-chaos.yml
  pull_request:
    branches: [main]
    paths:
      - tool/p8_workflow_chaos_test.py
      - tool/workflow_kernel_test.py
      - migrations/workflow/**
      - .github/workflows/p8-workflow-chaos.yml

permissions:
  contents: read

jobs:
  chaos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false
      - name: Workflow chaos and recovery
        run: python tool/p8_workflow_chaos_test.py
