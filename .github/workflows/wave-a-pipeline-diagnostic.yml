name: Wave A product-pipeline diagnostic

on:
  push:
    branches:
      - perf/cache-sqlite-foundation

permissions:
  contents: read

jobs:
  trace-first-report-producer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact failing Wave A head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9b4cb1c38f98c1a2ed8d3f2074d4473391d57e9d
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json

      - name: Install Linux desktop build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Replay product gate and stop at first root reports producer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports

          trace_reports() {
            local label="$1"
            if [[ ! -d reports ]]; then
              echo "REPORTS_ABSENT_AFTER: $label"
              return 0
            fi
            echo '=== FIRST ROOT REPORTS PRODUCER ==='
            echo "step=$label"
            date --iso-8601=ns
            echo '=== DIRECTORY CONTENTS ==='
            find reports -maxdepth 10 -printf '%TY-%Tm-%TdT%TH:%TM:%TS %y %p %s bytes\n' 2>&1 || true
            echo '=== TEXT PREVIEW ==='
            find reports -type f -maxdepth 10 -print0 2>/dev/null | while IFS= read -r -d '' file; do
              echo "--- $file ---"
              head -n 80 "$file" 2>/dev/null || true
            done
            exit 0
          }

          flutter create --project-name kristin_local_agent --org local.kristin --platforms=linux .
          trace_reports 'flutter create'
          flutter pub get
          trace_reports 'flutter pub get'
          python tool/v71r12_bootstrap_hosted_python.py --project .
          trace_reports 'P1/P2 Python dependency bootstrap'
          npm ci --prefix automation_host --no-audit --no-fund
          trace_reports 'automation-host npm ci'
          python tool/capture_ci_environment.py --output "release/evidence/P0-003/ci-environment-Linux.json" --print
          trace_reports 'capture CI environment'
          python tool/toolchain_lock_test.py --json-output "release/evidence/P0-004/toolchain-Linux.json"
          trace_reports 'toolchain lock test'
          python tool/v1_trust_disablement_test.py
          trace_reports 'P0-002 trust retirement'
          python tool/p0_003_repair_test.py
          trace_reports 'P0-003 integration repair'
          python tool/policy_support_test.py
          trace_reports 'P0-005 policy and support truth'
          python tool/repository_governance_test.py --json-output release/evidence/P0-006/local_governance_results.json
          trace_reports 'P0-006 repository governance contract'
          python -m unittest -v tool/github_governance_client_test.py
          trace_reports 'P0-006 GitHub governance fixtures'
          python tool/generate_v170_contracts.py --check
          trace_reports 'V1.7 generated contracts'
          python tool/generate_v180_contracts.py --check
          trace_reports 'V1.8 generated contracts'
          python tool/generate_v190_contracts.py --check
          trace_reports 'V1.9 generated contracts'
          python tool/roadmap_control_test.py
          trace_reports 'roadmap control unit test'
          python tool/p0_008_roadmap_test.py --project .
          trace_reports 'P0-008 roadmap test'
          python tool/roadmap_control.py validate --project . --strict
          trace_reports 'P0-008 strict roadmap validation'
          python tool/source_tree_policy_test.py
          trace_reports 'source tree policy test'
          python tool/generated_state_guard_test.py
          trace_reports 'generated state guard test'
          python tool/p0_010_generated_state_test.py --project .
          trace_reports 'P0-010 generated state test'
          python tool/generated_state_guard.py audit --project . --strict
          trace_reports 'P0-010 strict generated state audit'
          python tool/protocol_contract_test.py
          trace_reports 'generated protocol contracts'
          python tool/benchmark_runner_test.py
          trace_reports 'benchmark runner test'
          python tool/p0_009_benchmark_test.py --project .
          trace_reports 'P0-009 benchmark governance test'
          python tool/benchmark_runner.py check --project .
          trace_reports 'P0-009 benchmark baseline check'
          python tool/p0_007_assurance_test.py --project .
          trace_reports 'P0-007 assurance classification'
          python tool/generate_workflow_migrations.py --check
          trace_reports 'generated workflow migrations'
          python tool/workflow_kernel_test.py --project .
          trace_reports 'durable workflow kernel'
          python tool/generate_prompt_studio_contracts.py --check
          trace_reports 'Prompt Studio generated contracts'
          python tool/generate_prompt_studio_fixtures.py --check
          trace_reports 'Prompt Studio fixtures'
          python tool/prompt_studio_v2_test.py
          trace_reports 'Prompt Studio compiler gate'
          python tool/dart_format_scope.py --check
          trace_reports 'Dart format scope'
          flutter analyze --no-pub --fatal-warnings --fatal-infos
          trace_reports 'fatal Flutter analyzer'
          flutter test --no-pub --concurrency=1 --reporter expanded
          trace_reports 'full Flutter test suite'
          echo 'NO_ROOT_REPORTS_DIRECTORY_PRODUCED'
