name: P24-001 Adoption Review

on:
  push:
    branches: [agent/j/P24-001-roadmap-as-data-adr]
    paths:
      - .github/workflows/p24-adoption-review.yml
      - docs/roadmap/anarchy/**
      - release/evidence/P24-001/**
      - schemas/anarchy_execution.schema.json
      - test/product/anarchy_control_plane/**
      - tool/anarchy_control_plane.py
      - tool/anarchy_control_plane_parts/**
      - tool/anarchy_control_plane_test.py
      - tool/anarchy_control_plane_test_parts/**
      - tool/p24_ci_driver.py
      - tool/p24_ci_driver_parts/**
      - SOURCE_MANIFEST.sha256
  pull_request:
    branches: [agent/anarchy-execution-os]
    paths:
      - .github/workflows/p24-adoption-review.yml
      - docs/roadmap/anarchy/**
      - release/evidence/P24-001/**
      - schemas/anarchy_execution.schema.json
      - test/product/anarchy_control_plane/**
      - tool/anarchy_control_plane.py
      - tool/anarchy_control_plane_parts/**
      - tool/anarchy_control_plane_test.py
      - tool/anarchy_control_plane_test_parts/**
      - tool/p24_ci_driver.py
      - tool/p24_ci_driver_parts/**
      - SOURCE_MANIFEST.sha256

permissions:
  contents: read

concurrency:
  group: p24-001-adoption-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: p24-adoption-review-${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: ubuntu, os: ubuntu-24.04}
          - {lane: windows, os: windows-2025}
          - {lane: macos, os: macos-15}
    runs-on: ${{ matrix.os }}
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false

      - id: identity
        name: Record exact candidate and initialize durable diagnostics
        shell: bash
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD^{tree})"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          python tool/p24_ci_driver.py init \
            --root . --temporary "$RUNNER_TEMP" \
            --candidate "$CANDIDATE_SHA" --tree "$tree"

      - id: tests
        name: Compile, run deterministic regressions, and prove clean-room resume
        continue-on-error: true
        shell: bash
        run: |
          python tool/p24_ci_driver.py tests \
            --root . --temporary "$RUNNER_TEMP" \
            --candidate "$CANDIDATE_SHA" --tree '${{ steps.identity.outputs.tree }}'

      - id: generation
        name: Build deterministic generated outputs in an isolated exact-head clone
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python tool/p24_ci_driver.py generate \
            --root . --temporary "$RUNNER_TEMP" \
            --candidate "$CANDIDATE_SHA" --tree '${{ steps.identity.outputs.tree }}'

      - id: exact_check
        name: Validate exact checkout without mutation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python tool/p24_ci_driver.py exact \
            --root . --temporary "$RUNNER_TEMP" \
            --candidate "$CANDIDATE_SHA" --tree '${{ steps.identity.outputs.tree }}'

      - name: Upload bounded adoption-review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p24-001-adoption-review-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p24-*
            ${{ runner.temp }}/expected-*
          if-no-files-found: error
          retention-days: 90

      - name: Enforce exact-check conclusion without obscuring the first failure
        if: always()
        shell: bash
        run: |
          python tool/p24_ci_driver.py enforce \
            --root . --temporary "$RUNNER_TEMP" \
            --candidate "$CANDIDATE_SHA" --tree '${{ steps.identity.outputs.tree }}' \
            --tests-outcome '${{ steps.tests.outcome }}' \
            --generation-outcome '${{ steps.generation.outcome }}' \
            --exact-outcome '${{ steps.exact_check.outcome }}'
