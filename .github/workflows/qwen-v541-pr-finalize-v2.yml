name: Qwen 5.4.1 PR Finalize v2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/qwen-v541-pr-finalize-v2.yml'

permissions:
  contents: write

concurrency:
  group: qwen-v541-pr-finalize-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Capture exact candidate
        run: echo "CANDIDATE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Materialize exact 5.4.1 final candidate
        run: python tool/qwen_v541_finalize.py
      - name: Validate exact stable runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            run_my_server.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control_v21_base.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_worker_v53_base.py \
            tool/kris_qwen_worker_v531.py \
            tool/kris_qwen_worker_v54.py \
            tool/kris_qwen_worker_v541.py \
            tool/kris_qwen_engineering_env.py \
            tool/kris_qwen_v531_test.py \
            tool/kris_qwen_engineering_env_test.py \
            tool/kris_qwen_v541_test.py \
            tool/kris_qwen_control_token_redaction_test.py
          python tool/kris_qwen_v531_test.py
          python tool/kris_qwen_engineering_env_test.py
          python tool/kris_qwen_v541_test.py
          python tool/kris_qwen_control_token_redaction_test.py
          python tool/kris_qwen_control_test.py
          python tool/kris_qwen_control_compat_test.py
          python tool/kris_qwen_worker_v53.py version > "$RUNNER_TEMP/v541.json"
          python - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'v541.json').read_text(encoding='utf-8'))
          assert value.get('scriptVersion') == '5.4.1', value
          assert str(value.get('path', '')).endswith('kris_qwen_worker_v541.py'), value
          PY
          ! grep -Fq 'PHONE CONTROL TOKEN (keep private):' tool/kris_qwen_control.py
          ! grep -Fq 'controller.token, flush=True' tool/kris_qwen_control.py
          bash -n tool/install_kris_qwen_control_systemd.sh
          bash -n tool/rotate_kris_qwen_control_token.sh
          test "$(python tool/kris_qwen_control.py.compat.py --version)" = '2.2.0'
      - name: Regenerate and validate exact source identity
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp -s "$RUNNER_TEMP/manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --check
      - name: Publish CAS-safe final candidate
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --heads origin refs/heads/agent/qwen-phone-control | awk '{print $1}')"
          test "$remote" = "$CANDIDATE_BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(qwen): repair 5.4.1 production deployment'
          git push origin HEAD:refs/heads/agent/qwen-phone-control
