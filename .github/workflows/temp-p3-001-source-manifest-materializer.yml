name: TEMP P3-001 Source Manifest Materializer

on:
  push:
    branches:
      - 'agent/help/elastic-7c51a2e4/mission-003/p3-manifest-materializer'

permissions:
  contents: write

env:
  P3_CANDIDATE: 2ecf469251af705573d955efcfa8ac81afe1ae4e
  P3_TREE: 6e8372c1ec661e142436ed5d9fa038a0ad35ee73
  P3_BRANCH: agent/c/mission-003-browser-runtime
  RUNTIME_BRANCH: agent/mission-runtime
  MATERIALIZER_WORK_ORDER: WO-P3-001-MANIFEST-MATERIALIZER-7C51A2E4
  MATERIALIZER_SEMAPHORE: SEM-P3-001-MANIFEST-MATERIALIZER-7C51A2E4
  RELEASE_WORK_ORDER: WO-P3-001-SOURCE-MANIFEST-44AE364B
  RELEASE_SEMAPHORE: SEM-P3-001-SOURCE-MANIFEST-7C51A2E4

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2

      - name: Bind helper to the exact frozen P3 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$P3_CANDIDATE"
          test "$(git rev-parse 'HEAD^1^{tree}')" = "$P3_TREE"
          test "$(git diff --name-only HEAD^1 HEAD)" = '.github/workflows/temp-p3-001-source-manifest-materializer.yml'

      - name: Re-resolve runtime and require both bounded authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$RUNTIME_BRANCH:refs/remotes/origin/$RUNTIME_BRANCH" \
            "+refs/heads/$P3_BRANCH:refs/remotes/origin/$P3_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$P3_BRANCH")" = "$P3_CANDIDATE"
          python3 - <<'PY'
          import json
          import subprocess

          runtime = 'refs/remotes/origin/agent/mission-runtime'
          candidate = '2ecf469251af705573d955efcfa8ac81afe1ae4e'
          tree = '6e8372c1ec661e142436ed5d9fa038a0ad35ee73'

          def load(path):
              raw = subprocess.check_output(['git', 'show', f'{runtime}:{path}'])
              return json.loads(raw)

          meta = load('runtime/meta.json')
          if int(meta.get('runtimeGeneration', -1)) < 411:
              raise SystemExit(f'runtime generation regressed: {meta}')

          checks = (
              (
                  'runtime/semaphores/MISSION-003/SEM-P3-001-MANIFEST-MATERIALIZER-7C51A2E4.json',
                  'SEM-P3-001-MANIFEST-MATERIALIZER-7C51A2E4',
                  'WO-P3-001-MANIFEST-MATERIALIZER-7C51A2E4',
                  '.github/workflows/temp-p3-001-source-manifest-materializer.yml',
              ),
              (
                  'runtime/semaphores/MISSION-003/SEM-P3-001-SOURCE-MANIFEST-7C51A2E4.json',
                  'SEM-P3-001-SOURCE-MANIFEST-7C51A2E4',
                  'WO-P3-001-SOURCE-MANIFEST-44AE364B',
                  'SOURCE_MANIFEST.sha256',
              ),
          )
          for path, semaphore_id, work_order_id, allowed_path in checks:
              value = load(path)
              if value.get('status') != 'ACTIVE':
                  raise SystemExit(f'{semaphore_id} is not ACTIVE: {value}')
              if value.get('semaphoreId') != semaphore_id or value.get('workOrderId') != work_order_id:
                  raise SystemExit(f'{semaphore_id} identity mismatch: {value}')
              if value.get('workerIdentity') != 'ELASTIC-GPT-7C51A2E4':
                  raise SystemExit(f'{semaphore_id} worker mismatch: {value}')
              if value.get('baseCommit') != candidate or value.get('baseTree') != tree:
                  raise SystemExit(f'{semaphore_id} base mismatch: {value}')
              if allowed_path not in value.get('allowedPaths', []):
                  raise SystemExit(f'{semaphore_id} path authority mismatch: {value}')
          PY

      - name: Generate and verify the canonical manifest twice
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/p3-candidate" "$P3_CANDIDATE"
          cd "$RUNNER_TEMP/p3-candidate"
          test "$(git rev-parse HEAD)" = "$P3_CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$P3_TREE"
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.committed"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.candidate"
          test "$(git diff --name-only)" = 'SOURCE_MANIFEST.sha256'
          git diff --check -- SOURCE_MANIFEST.sha256
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import sys

          path = pathlib.Path('tool/v71r12_exact_source_gate.py').resolve()
          spec = importlib.util.spec_from_file_location('p3_manifest_exact_gate', path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load exact source gate')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.verify_source_manifest(pathlib.Path('.').resolve())
          PY

      - name: Create manifest-only canonical P3 commit and fast-forward it
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p3-candidate"
          git config user.name 'Mission V1.5 Release Finalizer'
          git config user.email 'mission-v15-release@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256
          git commit -m 'chore(p3): materialize exact source manifest'
          final_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^1)" = "$P3_CANDIDATE"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'SOURCE_MANIFEST.sha256'

          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags origin \
            "+refs/heads/$RUNTIME_BRANCH:refs/remotes/origin/$RUNTIME_BRANCH" \
            "+refs/heads/$P3_BRANCH:refs/remotes/origin/$P3_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$P3_BRANCH")" = "$P3_CANDIDATE"
          python3 - <<'PY'
          import json
          import subprocess

          runtime = 'refs/remotes/origin/agent/mission-runtime'
          for path, expected in (
              ('runtime/semaphores/MISSION-003/SEM-P3-001-MANIFEST-MATERIALIZER-7C51A2E4.json', 'SEM-P3-001-MANIFEST-MATERIALIZER-7C51A2E4'),
              ('runtime/semaphores/MISSION-003/SEM-P3-001-SOURCE-MANIFEST-7C51A2E4.json', 'SEM-P3-001-SOURCE-MANIFEST-7C51A2E4'),
          ):
              value = json.loads(subprocess.check_output(['git', 'show', f'{runtime}:{path}']))
              if value.get('semaphoreId') != expected or value.get('status') != 'ACTIVE':
                  raise SystemExit(f'authority changed before publication: {value}')
          PY
          git -C "$RUNNER_TEMP/p3-candidate" push origin HEAD:"refs/heads/$P3_BRANCH"
          git fetch --no-tags origin "+refs/heads/$P3_BRANCH:refs/remotes/origin/$P3_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$P3_BRANCH")" = "$final_head"
          echo "P3_FINAL_HEAD=$final_head" >> "$GITHUB_ENV"

      - name: Record exact materialization receipt
        shell: bash
        run: |
          set -euo pipefail
          export P3_FINAL_HEAD
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          candidate = Path(os.environ['RUNNER_TEMP']) / 'source-manifest.candidate'
          raw = candidate.read_bytes()
          payload = {
              'schemaVersion': '1.0.0',
              'workExecutionId': 'WRK-20260809T192000Z-7c51a2e4',
              'workerIdentity': 'ELASTIC-GPT-7C51A2E4',
              'productPr': 131,
              'parentCommit': os.environ['P3_CANDIDATE'],
              'parentTree': os.environ['P3_TREE'],
              'finalHead': os.environ['P3_FINAL_HEAD'],
              'changedPath': 'SOURCE_MANIFEST.sha256',
              'manifestSha256': hashlib.sha256(raw).hexdigest(),
              'entryCount': len(raw.decode('utf-8').splitlines()),
              'generator': 'tool/p1a_refresh_source_manifest.py',
              'generationCount': 2,
              'byteIdenticalGenerations': True,
              'fullManifestVerification': True,
              'fastForwardPublication': True,
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'source-manifest-metadata.json'
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p3-001-source-manifest-${{ env.P3_FINAL_HEAD }}
          path: |
            ${{ runner.temp }}/source-manifest.candidate
            ${{ runner.temp }}/source-manifest-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Retire the temporary helper workflow without changing its base tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git rm .github/workflows/temp-p3-001-source-manifest-materializer.yml
          git config user.name 'Mission V1.5 Release Finalizer'
          git config user.email 'mission-v15-release@users.noreply.github.com'
          git commit -m 'ci(p3): retire source manifest materializer'
          test "$(git rev-parse 'HEAD^{tree}')" = "$P3_TREE"
          git push origin HEAD:refs/heads/agent/help/elastic-7c51a2e4/mission-003/p3-manifest-materializer
