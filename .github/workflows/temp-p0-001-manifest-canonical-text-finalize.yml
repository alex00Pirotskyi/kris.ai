name: TEMP P0-001 Canonical Text Manifest Finalizer

on:
  push:
    branches:
      - 'agent/help/elastic-7c51a2e4/mission-001/p1a-manifest-canonical-text'

permissions:
  actions: read
  contents: write

env:
  SOURCE_HEAD: 9b5a7b78ab1b97c1ff8a81d5e65d36a5e1a0bdd8
  SOURCE_TREE: 3dd7e90e3510e3f224eac0bce0c2ef9891064942
  SOURCE_BRANCH: agent/help/elastic-7c51a2e4/mission-001/p1a-manifest-canonical-text
  RUNTIME_BRANCH: agent/mission-runtime
  RELEASE_WORK_ORDER: WO-P0-001-MANIFEST-CANONICAL-TEXT-RELEASE-7C51A2E4
  RELEASE_SEMAPHORE: SEM-P0-001-MANIFEST-CANONICAL-TEXT-RELEASE-7C51A2E4
  SOURCE_VALIDATION_RUN: '31463235983'
  TEMP_WORKFLOW: .github/workflows/temp-p0-001-manifest-canonical-text-finalize.yml

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2

      - name: Bind transport commit to frozen source candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$SOURCE_HEAD"
          test "$(git rev-parse 'HEAD^1^{tree}')" = "$SOURCE_TREE"
          test "$(git diff --name-only HEAD^1 HEAD)" = "$TEMP_WORKFLOW"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Re-resolve runtime release authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$RUNTIME_BRANCH:refs/remotes/origin/$RUNTIME_BRANCH" \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import subprocess

          runtime = 'refs/remotes/origin/agent/mission-runtime'
          expected_head = '9b5a7b78ab1b97c1ff8a81d5e65d36a5e1a0bdd8'
          expected_tree = '3dd7e90e3510e3f224eac0bce0c2ef9891064942'

          def load(path):
              return json.loads(subprocess.check_output(['git', 'show', f'{runtime}:{path}']))

          meta = load('runtime/meta.json')
          if int(meta.get('runtimeGeneration', -1)) < 413:
              raise SystemExit(f'runtime generation regressed: {meta}')

          release = load(
              'runtime/semaphores/MISSION-001/'
              'SEM-P0-001-MANIFEST-CANONICAL-TEXT-RELEASE-7C51A2E4.json'
          )
          if release.get('status') != 'ACTIVE':
              raise SystemExit(f'release semaphore is not ACTIVE: {release}')
          if release.get('workerIdentity') != 'ELASTIC-GPT-7C51A2E4':
              raise SystemExit(f'release worker mismatch: {release}')
          if release.get('workOrderId') != 'WO-P0-001-MANIFEST-CANONICAL-TEXT-RELEASE-7C51A2E4':
              raise SystemExit(f'release work-order mismatch: {release}')
          if release.get('baseCommit') != expected_head or release.get('baseTree') != expected_tree:
              raise SystemExit(f'release base mismatch: {release}')
          if sorted(release.get('allowedPaths', [])) != sorted([
              'SOURCE_MANIFEST.sha256',
              '.github/workflows/temp-p0-001-manifest-canonical-text-finalize.yml',
          ]):
              raise SystemExit(f'release allowed-path mismatch: {release}')

          source_sem = load(
              'runtime/semaphores/MISSION-001/'
              'SEM-P0-001-MANIFEST-CANONICAL-TEXT-7C51A2E4.json'
          )
          if source_sem.get('status') != 'RELEASED':
              raise SystemExit(f'source WRITE semaphore not released: {source_sem}')
          PY

      - name: Require tri-platform source-contract proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs_json="$RUNNER_TEMP/source-jobs.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_VALIDATION_RUN/jobs?per_page=100" \
            > "$jobs_json"
          python3 - "$jobs_json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          expected = {
              'p1a-source-contract (ubuntu-24.04)',
              'p1a-source-contract (macos-15)',
              'p1a-source-contract (windows-2025)',
          }
          found = {
              job.get('name'): job.get('conclusion')
              for job in payload.get('jobs', [])
              if job.get('name') in expected
          }
          if set(found) != expected or any(value != 'success' for value in found.values()):
              raise SystemExit(f'tri-platform P1A source proof is not green: {found}')
          print(f'tri-platform P1A source proof: PASS {found}')
          PY

      - name: Generate canonical root manifest twice
        shell: bash
        run: |
          set -euo pipefail
          git rm "$TEMP_WORKFLOW"
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.before"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.candidate"
          test -s "$RUNNER_TEMP/source-manifest.candidate"
          if grep -q $'\r' SOURCE_MANIFEST.sha256; then
            echo 'manifest contains CR bytes' >&2
            exit 1
          fi
          git diff --check -- SOURCE_MANIFEST.sha256
          git add SOURCE_MANIFEST.sha256
          expected_staged="$(printf '%s\n%s\n' "$TEMP_WORKFLOW" 'SOURCE_MANIFEST.sha256' | sort)"
          actual_staged="$(git diff --cached --name-only | sort)"
          test "$actual_staged" = "$expected_staged"

      - name: Commit final manifest and prove final effective scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mission V1.5 Release Finalizer'
          git config user.email 'mission-v15-release@users.noreply.github.com'
          git commit -m 'chore(p1a): materialize canonical source manifest'
          final_head="$(git rev-parse HEAD)"
          test ! -e "$TEMP_WORKFLOW"
          if git ls-tree -r --name-only HEAD | grep -Fxq "$TEMP_WORKFLOW"; then
            echo 'temporary workflow survived final tree' >&2
            exit 1
          fi
          test "$(git diff --name-only "$SOURCE_HEAD" HEAD)" = 'SOURCE_MANIFEST.sha256'
          git diff --check "$SOURCE_HEAD" HEAD -- SOURCE_MANIFEST.sha256
          test -z "$(git status --porcelain)"
          echo "FINAL_HEAD=$final_head" >> "$GITHUB_ENV"

      - name: Verify final committed manifest against final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import sys

          path = pathlib.Path('tool/v71r12_exact_source_gate.py').resolve()
          spec = importlib.util.spec_from_file_location('p1a_manifest_exact_gate', path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load exact source gate')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.verify_source_manifest(pathlib.Path('.').resolve())
          PY
          python tool/p1a_text_eof_contract_test.py --project .
          test -z "$(git status --porcelain)"

      - name: Re-check release authority and fast-forward source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$RUNTIME_BRANCH:refs/remotes/origin/$RUNTIME_BRANCH" \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import subprocess

          runtime = 'refs/remotes/origin/agent/mission-runtime'
          path = (
              'runtime/semaphores/MISSION-001/'
              'SEM-P0-001-MANIFEST-CANONICAL-TEXT-RELEASE-7C51A2E4.json'
          )
          value = json.loads(subprocess.check_output(['git', 'show', f'{runtime}:{path}']))
          if value.get('status') != 'ACTIVE':
              raise SystemExit(f'release authority changed before publication: {value}')
          if value.get('baseCommit') != '9b5a7b78ab1b97c1ff8a81d5e65d36a5e1a0bdd8':
              raise SystemExit(f'release base changed before publication: {value}')
          PY
          git push origin HEAD:"refs/heads/$SOURCE_BRANCH"
          git fetch --no-tags origin "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")" = "$FINAL_HEAD"

      - name: Record exact manifest receipt
        shell: bash
        run: |
          set -euo pipefail
          export FINAL_HEAD
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = Path(os.environ['RUNNER_TEMP']) / 'source-manifest.candidate'
          raw = manifest.read_bytes()
          payload = {
              'schemaVersion': '1.0.0',
              'workExecutionId': 'WRK-20260809T192000Z-7c51a2e4',
              'workerIdentity': 'ELASTIC-GPT-7C51A2E4',
              'repairPr': 138,
              'sourceHead': os.environ['SOURCE_HEAD'],
              'sourceTree': os.environ['SOURCE_TREE'],
              'finalHead': os.environ['FINAL_HEAD'],
              'effectiveFinalizationDiff': ['SOURCE_MANIFEST.sha256'],
              'manifestSha256': hashlib.sha256(raw).hexdigest(),
              'entryCount': len(raw.decode('utf-8').splitlines()),
              'generator': 'tool/p1a_refresh_source_manifest.py',
              'generationCount': 2,
              'byteIdenticalGenerations': True,
              'exactManifestVerifier': True,
              'sourceContractRun': 31463235983,
              'sourcePlatforms': ['ubuntu-24.04', 'macos-15', 'windows-2025'],
              'temporaryWorkflowInFinalTree': False,
              'fastForwardPublication': True,
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'source-manifest-metadata.json'
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p0-001-canonical-text-manifest-${{ env.FINAL_HEAD }}
          path: |
            ${{ runner.temp }}/source-manifest.candidate
            ${{ runner.temp }}/source-manifest-metadata.json
          if-no-files-found: error
          retention-days: 30
