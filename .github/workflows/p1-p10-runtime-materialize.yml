name: P1-P10 Runtime Bundle Materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: p1-p10-runtime-materializer-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'hotfix/p2-p3-runtime-p1-p10-20260824'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
          check-latest: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Apply and format durable patch
        run: |
          python tool/p1_p10_runtime_bundle_finalize.py
          dart format \
            lib/product/p2_runtime_resource_resolver.dart \
            lib/product/browser/browser_runtime_bundle.dart \
            test/product/p2_p3_packaged_runtime_paths_test.dart \
            test/product/p1_p10_packaged_runtime_smoke_test.dart
          flutter pub get

      - name: Focused contracts and analyzer
        run: |
          python tool/p2_packaging_contract_test.py
          python tool/p2_p3_product_packaging_contract_test.py
          python -m unittest -v tool/p9_release_engineering_test.py
          python -m unittest -v tool/p9_update_install_test.py
          python -m unittest -v tool/p10_release_readiness_test.py
          flutter test --no-pub test/product/p2_p3_packaged_runtime_paths_test.dart
          flutter test --no-pub test/product/p2_single_click_owner_mode_test.dart
          flutter test --no-pub test/product/browser/browser_runtime_bundle_test.dart
          flutter analyze --no-pub --fatal-warnings --fatal-infos

      - name: Build exact durable manifest
        run: |
          rm tool/p1_p10_runtime_bundle_finalize.py
          rm .github/workflows/p1-p10-runtime-finalizer.yml
          rm .github/workflows/p1-p10-runtime-materialize.yml
          python tool/p2_refresh_source_manifest.py .
          flutter test --no-pub test/product/source_contract_test.dart
          git diff --check

      - name: Emit exact materialized blobs
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib
          paths = [
              'lib/product/p2_runtime_resource_resolver.dart',
              'lib/product/browser/browser_runtime_bundle.dart',
              'tool/v70_package_platform.py',
              'test/product/p2_p3_packaged_runtime_paths_test.dart',
              'test/product/p1_p10_packaged_runtime_smoke_test.dart',
              'SOURCE_MANIFEST.sha256',
          ]
          for name in paths:
              data = pathlib.Path(name).read_bytes()
              print(f'MATERIALIZED_BEGIN {name} {hashlib.sha256(data).hexdigest()} {len(data)}')
              print(base64.b64encode(data).decode('ascii'))
              print(f'MATERIALIZED_END {name}')
          PY
