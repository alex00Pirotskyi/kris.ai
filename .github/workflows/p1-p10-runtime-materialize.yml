name: P1-P10 Runtime Bundle Materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: p1-p10-runtime-materializer-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'hotfix/p2-p3-runtime-p1-p10-20260824'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
          check-latest: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Apply and format durable source patch
        run: |
          python tool/p1_p10_runtime_bundle_finalize.py
          dart format \
            lib/product/p2_runtime_resource_resolver.dart \
            lib/product/browser/browser_runtime_bundle.dart \
            test/product/p2_p3_packaged_runtime_paths_test.dart \
            test/product/p1_p10_packaged_runtime_smoke_test.dart
          python tool/v71r12_bootstrap_hosted_python.py --project .
          flutter pub get

      - name: Focused contracts and analyzer
        run: |
          python tool/p2_packaging_contract_test.py
          python tool/p2_p3_product_packaging_contract_test.py
          python -m unittest -v tool/p9_release_engineering_test.py
          python -m unittest -v tool/p9_update_install_test.py
          python -m unittest -v tool/p10_release_readiness_test.py
          flutter test --no-pub test/product/p2_p3_packaged_runtime_paths_test.dart
          flutter test --no-pub test/product/p2_single_click_owner_mode_test.dart
          flutter test --no-pub test/product/browser/browser_runtime_bundle_test.dart
          flutter test --no-pub test/product/browser/browser_product_runtime_test.dart
          flutter analyze --no-pub --fatal-warnings --fatal-infos
          git diff --check

      - name: Publish qualified non-workflow source bytes
        shell: bash
        run: |
          set -euo pipefail
          rm tool/p1_p10_runtime_bundle_finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/product/p2_runtime_resource_resolver.dart \
            lib/product/browser/browser_runtime_bundle.dart \
            tool/v70_package_platform.py \
            test/product/p2_p3_packaged_runtime_paths_test.dart \
            test/product/p1_p10_packaged_runtime_smoke_test.dart \
            tool/p1_p10_runtime_bundle_finalize.py
          git diff --cached --check
          git commit -m 'fix(runtime): embed and resolve P2/P3 product bundles'
          git push origin HEAD:hotfix/p2-p3-runtime-p1-p10-20260824
