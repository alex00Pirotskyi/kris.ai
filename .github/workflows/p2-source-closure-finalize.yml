name: P2 bounded source-closure finalizer

on:
  push:
    branches:
      - agent/p2-source-closure-20260822
    paths:
      - .github/workflows/p2-source-closure-finalize.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p2-source-closure-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_PARENT: 457c0f954bd986a3b4d47b585abeb1c1e699e094
      EXPECTED_MAIN: ac7531f9c192caf90699b53ddb7fdcdd16f24208
      TARGET_BRANCH: agent/p2-source-closure-20260822
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PATCH_PATH: .repo-p2-source-closure-finalize.py
      FINALIZER_PATH: .github/workflows/p2-source-closure-finalize.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact bounded transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git diff --name-only HEAD^ HEAD)" = "${FINALIZER_PATH}"
          git fetch --no-tags origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          test "$(git rev-parse origin/${TARGET_BRANCH})" = "${SOURCE_SHA}"
          test -f "${PATCH_PATH}"
          test -f "${FINALIZER_PATH}"
          test -z "$(git status --short)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: config/p2.python-version
          check-latest: false
      - name: Resolve locked toolchains
        id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.1.0
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.toolchains.outputs.flutter }}
          channel: stable
          cache: true
          pub-cache: true
      - name: Apply repair and remove transport before evidence generation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "${PATCH_PATH}"
          python "${PATCH_PATH}"
          git rm -f "${PATCH_PATH}" "${FINALIZER_PATH}"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python tool/v71r12_bootstrap_hosted_python.py --project .
          flutter pub get
          npm ci --prefix automation_host --ignore-scripts=false --no-audit --no-fund
      - name: Validate P2 packaging and source contracts
        shell: bash
        run: |
          set -euo pipefail
          python tool/p2_packaging_contract_test.py
          python tool/toolchain_lock_test.py --source-only
          python tool/p2_toolchain_extension_test.py --project .
          python tool/p2_source_inventory_test.py --project .
          python tool/p2_evidence_contract_test.py
          python tool/p2_patch_application_composition_test.py
          python tool/p2_runtime_resource_contract_test.py
          python tool/p2_shared_p1_authority_contract_test.py --project . --owner-risk-qa
          python tool/p2_runner_attestation_contract_test.py
          python tool/p2_post_run_cleanup_contract_test.py
          python tool/p2_strict_finalizer_contract_test.py --project .
          python tool/p2_task_assertion_cli_test.py --project .
      - name: Validate product and automation host
        shell: bash
        run: |
          set -euo pipefail
          python tool/dart_format_scope.py --check
          flutter analyze --no-pub --fatal-warnings --fatal-infos
          flutter test --no-pub --concurrency=1 --reporter expanded test/product
          npm test --prefix automation_host
          ruby tool/workflow_integrity_test.rb .
      - name: Validate exact clean delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only --diff-filter=U)"
          mapfile -t paths < <(git status --short | sed -E 's/^...//' | sort)
          expected=(
            .github/workflows/p2-source-closure-finalize.yml
            .repo-p2-source-closure-finalize.py
            SOURCE_MANIFEST.sha256
            automation_host/package.json
            tool/p2_packaging_contract_test.py
            tool/v70_package_platform.py
          )
          test "${paths[*]}" = "${expected[*]}"
      - name: Publish exact clean source candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          test "$(git rev-parse origin/${TARGET_BRANCH})" = "${SOURCE_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p2): repair macOS PTY packaging trust boundary'
          candidate="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "Published candidate ${candidate}"
