name: temporary-one-kristin-dispatch-product-gates

on:
  push:
    branches:
      - draft/one-kristin-convergence-checkpoint
    paths:
      - .github/workflows/temporary-one-kristin-dispatch-product-gates.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Restore exact fully-qualified candidate tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-one-kristin-dispatch-product-gates.yml
          git add -A
          expected_tree='727a0fbe51e9326c4fef075a2801a56573b6c500'
          candidate_tree="$(git write-tree)"
          test "$candidate_tree" = "$expected_tree"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'checkpoint: restore fully-qualified One-Kristin tree'
          git push origin HEAD:draft/one-kristin-convergence-checkpoint
          remote_head="$(git ls-remote origin refs/heads/draft/one-kristin-convergence-checkpoint | awk '{print $1}')"
          test "$remote_head" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"

      - name: Dispatch protected tri-platform product gates
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"draft/one-kristin-convergence-checkpoint"}'
