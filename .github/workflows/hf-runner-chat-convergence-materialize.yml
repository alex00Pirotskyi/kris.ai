name: Runner Chat Convergence Materializer

on:
  push:
    branches:
      - hotfix/runner-chat-convergence-20260823
    paths:
      - .github/workflows/hf-runner-chat-convergence-materialize.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize-qualify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hotfix/runner-chat-convergence-20260823
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Materialize exact-base hotfix
        shell: bash
        run: |
          set -euo pipefail
          cat .hf-runner-materializer/part* | base64 -d | gzip -d > .repo-hf-runner-chat-convergence.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.repo-hf-runner-chat-convergence.py')
          text = path.read_text(encoding='utf-8')
          old = r'''        'test/product/source_contract_test.dart',
                  "        'lib/product/workspace_tools.dart',\n",
          '''
          new = r'''        'test/product/source_contract_test.dart',
                  "        'lib/product/ui_components.dart',\n"
                  "        'lib/product/workspace_tools.dart',\n",
          '''
          if text.count(old) != 1:
              raise SystemExit(f'materializer repair anchor mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 .repo-hf-runner-chat-convergence.py
          rm -f .repo-hf-runner-chat-convergence.py
          rm -rf .hf-runner-materializer
          rm -f .github/workflows/hf-runner-chat-convergence-materialize.yml
      - name: Format source and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/product/conversation_orchestrator.dart \
            lib/product/product_error_normalizer.dart \
            lib/product/project_provisioning.dart \
            lib/product/run_execution_projection.dart \
            lib/product/run_live_signals.dart \
            lib/product/run_preflight.dart \
            lib/product/run_steering.dart \
            lib/product/planning_runtime.dart \
            lib/product/product_runtime.dart \
            lib/product/chat_studio.dart \
            test/product/source_contract_test.dart \
            test/product/hf_runner_chat_convergence_test.dart
          python3 tool/p2_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python3 tool/p2_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
      - name: Verify exact durable scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'SOURCE_MANIFEST.sha256',
              'docs/HF_RUNNER_CHAT_CONVERGENCE.md',
              'lib/product/chat_studio.dart',
              'lib/product/conversation_orchestrator.dart',
              'lib/product/planning_runtime.dart',
              'lib/product/product_error_normalizer.dart',
              'lib/product/product_runtime.dart',
              'lib/product/project_provisioning.dart',
              'lib/product/run_execution_projection.dart',
              'lib/product/run_live_signals.dart',
              'lib/product/run_preflight.dart',
              'lib/product/run_steering.dart',
              'test/product/hf_runner_chat_convergence_test.dart',
              'test/product/source_contract_test.dart',
          }
          base = 'e851e60d6feead7f3850b5745eb1df62cdc9a170'
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(
                  f'exact hotfix scope mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
              )
          PY
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Focused hotfix contracts
        run: flutter test --no-pub test/product/hf_runner_chat_convergence_test.dart
      - name: Source governance contract
        run: flutter test --no-pub test/product/source_contract_test.dart
      - name: Fatal static analysis
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Complete Flutter regression
        run: flutter test --no-pub --concurrency=1
      - name: Deterministic release validator
        run: python3 tool/validate_release.py
      - name: Publish qualified durable candidate
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runner): converge chat preflight live execution and steering"
          git push origin HEAD:hotfix/runner-chat-convergence-20260823
