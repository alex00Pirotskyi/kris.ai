name: Runner Chat Convergence Materializer

on:
  push:
    branches:
      - hotfix/runner-chat-convergence-20260823
    paths:
      - .github/workflows/hf-runner-chat-convergence-materialize.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize-qualify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hotfix/runner-chat-convergence-20260823
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Materialize exact-base hotfix
        shell: bash
        run: |
          set -euo pipefail
          cat .hf-runner-materializer/part* | base64 -d | gzip -d > .repo-hf-runner-chat-convergence.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.repo-hf-runner-chat-convergence.py')
          text = path.read_text(encoding='utf-8')
          repairs = [
              (
                  r'''        'test/product/source_contract_test.dart',
                  "        'lib/product/workspace_tools.dart',\n",
          ''',
                  r'''        'test/product/source_contract_test.dart',
                  "        'lib/product/ui_components.dart',\n"
                  "        'lib/product/workspace_tools.dart',\n",
          ''',
              ),
              (
                  r'''  Future<RunRecord> retryRun(String sourceRunId) async {\n''',
                  r'''  Future<RunRecord> retryRun(String runId) async {\n''',
              ),
              (
                  r'''    replace_once(
                  'lib/product/chat_studio.dart',
                  "          error = runtime.redactor.redact('$failure');\n          status = 'Kristin needs your help';",
                  "          error = runtime.redactor.redact(\n            ProductErrorNormalizer.userMessage(failure),\n          );\n          status = 'Kristin needs your help';",
              )''',
                  r'''    replace_once(
                  'lib/product/chat_studio.dart',
                  "          status = '$activity completed';\n        });\n      }\n      return result;\n    } catch (failure) {\n      if (mounted) {\n        setState(() {\n          error = runtime.redactor.redact('$failure');\n          status = 'Kristin needs your help';",
                  "          status = '$activity completed';\n        });\n      }\n      return result;\n    } catch (failure) {\n      if (mounted) {\n        setState(() {\n          error = runtime.redactor.redact(\n            ProductErrorNormalizer.userMessage(failure),\n          );\n          status = 'Kristin needs your help';",
              )''',
              ),
              (
                  r'''        _runGraphPanel(run),\n        const SizedBox(height: 14),\n''',
                  r'''                        _runGraphPanel(run),\n                        const SizedBox(height: 14),\n''',
              ),
          ]
          for old, new in repairs:
              if text.count(old) != 1:
                  raise SystemExit(f'materializer repair anchor mismatch: {old!r} count={text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python3 .repo-hf-runner-chat-convergence.py
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('lib/product/product_runtime.dart')
          runtime_text = runtime_path.read_text(encoding='utf-8')
          runtime_needle = "    final tools = ToolRegistry.standard();\\n    final liveRunSignals = LiveRunSignalBus();"
          if runtime_text.count(runtime_needle) != 1:
              raise SystemExit(
                  f'product runtime escaped-newline repair anchor mismatch: {runtime_text.count(runtime_needle)}'
              )
          runtime_start = runtime_text.index(runtime_needle)
          runtime_end = runtime_text.find('\n', runtime_start)
          if runtime_end < 0:
              runtime_end = len(runtime_text)
          physical_line = runtime_text[runtime_start:runtime_end]
          repaired_line = physical_line.replace(r'\n', '\n')
          runtime_path.write_text(
              runtime_text[:runtime_start] + repaired_line + runtime_text[runtime_end:],
              encoding='utf-8',
          )

          chat_path = Path('lib/product/chat_studio.dart')
          chat_text = chat_path.read_text(encoding='utf-8')
          chat_needle = (
              "          Wrap(\n"
              "            spacing: 8,\n"
              "            runSpacing: 8,\n"
              "            children: <Widget>[\n"
              "              if (run.state == RunState.running)          const SizedBox(height: 12),\n"
          )
          if chat_text.count(chat_needle) != 1:
              raise SystemExit(
                  f'chat control-wrap repair anchor mismatch: {chat_text.count(chat_needle)}'
              )
          chat_path.write_text(chat_text.replace(chat_needle, '', 1), encoding='utf-8')
          PY
          rm -f .repo-hf-runner-chat-convergence.py
          rm -rf .hf-runner-materializer
          rm -f .github/workflows/hf-runner-chat-convergence-materialize.yml
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Format source and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/product/conversation_orchestrator.dart \
            lib/product/product_error_normalizer.dart \
            lib/product/project_provisioning.dart \
            lib/product/run_execution_projection.dart \
            lib/product/run_live_signals.dart \
            lib/product/run_preflight.dart \
            lib/product/run_steering.dart \
            lib/product/planning_runtime.dart \
            lib/product/product_runtime.dart \
            lib/product/chat_studio.dart \
            test/product/source_contract_test.dart \
            test/product/hf_runner_chat_convergence_test.dart
          python3 tool/p2_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python3 tool/p2_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          echo '--- analyzer region chat 820-870 ---'
          nl -ba lib/product/chat_studio.dart | sed -n '820,870p'
          echo '--- analyzer region chat 2075-2120 ---'
          nl -ba lib/product/chat_studio.dart | sed -n '2075,2120p'
          echo '--- analyzer region chat 9108-9142 ---'
          nl -ba lib/product/chat_studio.dart | sed -n '9108,9142p'
          echo '--- analyzer region planning 2038-2072 ---'
          nl -ba lib/product/planning_runtime.dart | sed -n '2038,2072p'
          echo '--- analyzer region projection 145-165 ---'
          nl -ba lib/product/run_execution_projection.dart | sed -n '145,165p'
          echo '--- run_preflight imports ---'
          sed -n '1,18p' lib/product/run_preflight.dart
          echo '--- product_runtime imports ---'
          sed -n '1,30p' lib/product/product_runtime.dart
          echo '--- focused test imports ---'
          sed -n '1,12p' test/product/hf_runner_chat_convergence_test.dart
      - name: Verify exact durable scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'SOURCE_MANIFEST.sha256',
              'docs/HF_RUNNER_CHAT_CONVERGENCE.md',
              'lib/product/chat_studio.dart',
              'lib/product/conversation_orchestrator.dart',
              'lib/product/planning_runtime.dart',
              'lib/product/product_error_normalizer.dart',
              'lib/product/product_runtime.dart',
              'lib/product/project_provisioning.dart',
              'lib/product/run_execution_projection.dart',
              'lib/product/run_live_signals.dart',
              'lib/product/run_preflight.dart',
              'lib/product/run_steering.dart',
              'test/product/hf_runner_chat_convergence_test.dart',
              'test/product/source_contract_test.dart',
          }
          base = 'e851e60d6feead7f3850b5745eb1df62cdc9a170'
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base], text=True
          ).splitlines())
          actual.update(subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(
                  f'exact hotfix scope mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
              )
          PY
      - name: Focused hotfix contracts
        run: flutter test --no-pub test/product/hf_runner_chat_convergence_test.dart
      - name: Source governance contract
        run: flutter test --no-pub test/product/source_contract_test.dart
      - name: Fatal static analysis
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Complete Flutter regression
        run: flutter test --no-pub --concurrency=1
      - name: Deterministic release validator
        run: python3 tool/validate_release.py
      - name: Publish qualified durable candidate
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runner): converge chat preflight live execution and steering"
          git push origin HEAD:hotfix/runner-chat-convergence-20260823
