          new_fetch_entry = '''    def _queue_fetch_latest_and_run(self, kind: str) -> dict[str, Any]:\n        with self.lock:\n            if self.operation_running():\n                raise ControllerError("another controller operation is already running")\n            self.auto_run_enabled = True\n            self.operation_thread = threading.Thread(\n                target=self._fetch_latest_and_run_job,\n                args=(kind,),\n                name=f"kris-qwen-fetch-run-{kind.lower()}",\n                daemon=True,\n            )\n            self._record_operation(state="QUEUED", kind=kind, result=None, error=None)\n            self.operation_thread.start()\n            return {"status": "QUEUED", "kind": kind}\n\n    def fetch_latest_and_run(self) -> dict[str, Any]:\n        return self._queue_fetch_latest_and_run("FETCH_LATEST_AND_RUN")\n\n    def _remote_branch_head(self) -> str:\n        result = self._git(\n            "ls-remote", "--heads", "origin", f"refs/heads/{self.cfg.repo_branch}",\n            timeout=120,\n        )\n        rows = [line.split() for line in result.stdout.splitlines() if line.strip()]\n        if len(rows) != 1 or len(rows[0]) < 2:\n            raise ControllerError(f"cannot resolve unique remote head for {self.cfg.repo_branch}")\n        return rows[0][0]\n\n    def _auto_update_once(self) -> dict[str, Any]:\n        with self.lock:\n            if self.operation_running():\n                return {"status": "BUSY"}\n            self._validate_repo()\n            local = self._git_head()\n            remote = self._remote_branch_head()\n            if remote != local:\n                queued = self._queue_fetch_latest_and_run("AUTO_UPDATE")\n                return {"status": "UPDATE_QUEUED", "local": local, "remote": remote, **queued}\n            if self.auto_run_enabled and not self.worker_pid():\n                started = self._start_worker_unlocked()\n                self._record_operation(\n                    state="IDLE", kind="AUTO_START", result=started, error=None,\n                )\n                return {"status": "AUTO_STARTED", "local": local, "remote": remote}\n            return {"status": "CURRENT", "local": local, "remote": remote}\n\n    def _auto_update_loop(self) -> None:\n        time.sleep(1.0)\n        while True:\n            try:\n                self._auto_update_once()\n            except Exception as exc:\n                if not self.operation_running():\n                    self._record_operation(\n                        state="ERROR", kind="AUTO_UPDATE", error=str(exc),\n                    )\n            time.sleep(self.cfg.auto_update_seconds)\n'''
