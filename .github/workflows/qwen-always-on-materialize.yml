          docs += '''\n\n## Always-on Product protocol (5.3 / controller 2.2)\n\nNormal `IDLE` is a red-alert condition, not a steady state. The persistent worker immediately chains successful Work Orders, wakes eligible context-independent R1 review lanes, wakes reviewed helper integration lanes, and when the governed frontier is genuinely empty it may create one bounded `PRODUCT_DEFECT_REPAIR` Work Order only against an existing ACTIVE canonical Product PR through `mission_orchestrator.py work-create`. Canonical runtime validation, path authority, WIP limits, semaphores, review independence and protected-main restrictions remain fail-closed.\n\nThe phone controller enables `KRIS_QWEN_AUTO_UPDATE=1` by default. Every 30 seconds (configurable with `KRIS_QWEN_AUTO_UPDATE_SECONDS`) it compares the configured remote Qwen branch head with the local checkout. A newer fast-forward head triggers the same graceful drain, clean-checkout guard, fast-forward-only update, refreshed version probe and stack restart as the manual Fetch latest action. If the worker is unexpectedly stopped and the operator has not explicitly paused it with Safe stop, the controller starts it again.\n\nA manually requested Safe stop pauses automatic worker restart until Run current Qwen or Fetch latest + run Qwen is requested, while remote update monitoring remains available.\n'''
