name: Qwen Always-On Materializer

on:
  push:
    branches:
      - agent/qwen-phone-control
    paths:
      - .github/workflows/qwen-always-on-materialize.yml

permissions:
  contents: write

concurrency:
  group: qwen-always-on-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact Qwen branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize always-on worker and controller
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker_path = Path('tool/kris_qwen_worker.py')
          worker = worker_path.read_text(encoding='utf-8')

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          worker = once(
              worker,
              'SCRIPT_VERSION = "5.2.2"',
              'SCRIPT_VERSION = "5.3.0"',
              'worker version',
          )

          old_fetch = 'def fetch_all(cfg: Config) -> None:\n    git(cfg.anchor, "fetch", "origin", "+refs/heads/*:refs/remotes/origin/*", "--prune", timeout=1800)\n'
          new_fetch = '''def fetch_all(cfg: Config) -> None:\n    git(\n        cfg.anchor,\n        "fetch",\n        "origin",\n        "+refs/heads/*:refs/remotes/origin/*",\n        "+refs/pull/*/head:refs/remotes/origin/pull/*/head",\n        "--prune",\n        timeout=1800,\n    )\n'''
          worker = once(worker, old_fetch, new_fetch, 'immutable PR-head fetch')

          old_integration_status = '''        and w.get("type") == "INTEGRATION"\n        and w.get("status") == "VALIDATING"\n'''
          new_integration_status = '''        and w.get("type") == "INTEGRATION"\n        and w.get("status") in {"VALIDATING", "BLOCKED"}\n'''
          worker = once(worker, old_integration_status, new_integration_status, 'integration wake status')

          old_promote = '''    candidates = [\n        w for w in runtime_work_rows(cfg)\n        if w.get("mission") == lease.work.get("mission")\n        and w.get("parentProductPr") == lease.work.get("parentProductPr")\n        and w.get("status") == "REVIEW"\n        and w.get("type") in {"PRODUCT_FEATURE", "PRODUCT_DEFECT_REPAIR", "PRODUCT_TEST", "CI_REPAIR", "BLOCKER_REMOVAL"}\n        and sorted(w.get("allowedPaths") or []) == sorted(lease.work.get("allowedPaths") or [])\n    ]\n    if len(candidates) != 1:\n        return\n    transition_work_order_cas(\n        cfg, str(candidates[0]["workOrderId"]), "HELPER_READY",\n        f"ELASTIC-QWEN-V5:R1_PASS:{target_head}", make_work_execution_id(),\n    )\n    refresh_snapshots(cfg)\n    wake_integration_for_helper(cfg, candidates[0])\n'''
          new_promote = '''    candidates = [\n        w for w in runtime_work_rows(cfg)\n        if w.get("mission") == lease.work.get("mission")\n        and w.get("parentProductPr") == lease.work.get("parentProductPr")\n        and w.get("status") in {"REVIEW", "HELPER_READY"}\n        and w.get("type") in {"PRODUCT_FEATURE", "PRODUCT_DEFECT_REPAIR", "PRODUCT_TEST", "CI_REPAIR", "BLOCKER_REMOVAL"}\n        and sorted(w.get("allowedPaths") or []) == sorted(lease.work.get("allowedPaths") or [])\n    ]\n    if len(candidates) != 1:\n        return\n    source_work = candidates[0]\n    if source_work.get("status") == "REVIEW":\n        transition_work_order_cas(\n            cfg, str(source_work["workOrderId"]), "HELPER_READY",\n            f"ELASTIC-QWEN-V53:R1_PASS:{target_head}", make_work_execution_id(),\n        )\n        refresh_snapshots(cfg)\n        source_work = next(\n            row for row in runtime_work_rows(cfg)\n            if row.get("workOrderId") == source_work.get("workOrderId")\n        )\n    wake_integration_for_helper(cfg, source_work)\n'''
          worker = once(worker, old_promote, new_promote, 'review promotion')

          marker = '\ndef validate_authority_append_safety(cfg: Config, lease: WorkLease) -> None:\n'
          if marker not in worker:
              raise SystemExit('always-on insertion marker missing')
          insert = r'''

CONTINUOUS_ACTIVE_WORK_STATES = {
    "READY", "RESERVED", "IN_PROGRESS", "HELPER_READY", "INTEGRATING",
    "VALIDATING", "REVIEW",
}
CONTINUOUS_SOURCE_TYPES = {
    "PRODUCT_FEATURE", "PRODUCT_DEFECT_REPAIR", "PRODUCT_TEST", "CI_REPAIR",
    "BLOCKER_REMOVAL",
}
CONTINUOUS_CODE_PREFIXES = (
    "lib/", "test/", "automation_host/", "services/", "native/", "tool/",
)


def review_requires_external_identity(work: dict[str, Any]) -> bool:
    if str(work.get("externalReviewerGitHub") or "").strip():
        return True
    text = (str(work.get("objective") or "") + "\n" + "\n".join(
        str(x) for x in work.get("requiredTests", [])
    )).lower()
    markers = (
        "must be submitted by github identity",
        "distinct external reviewer identity",
        "externalreviewergithub",
        "requires github identity alex11",
    )
    return any(marker in text for marker in markers)


def wake_pending_reviews(cfg: Config) -> list[str]:
    """Promote one safe pending R1 REVIEW state into dispatchable READY authority."""
    rows = sorted(
        (
            row for row in runtime_work_rows(cfg)
            if row.get("status") == "REVIEW"
            and row.get("type") == "REVIEW"
            and not row.get("activeSemaphoreId")
        ),
        key=lambda row: (-int(row.get("priority", 0)), str(row.get("workOrderId"))),
    )
    for row in rows:
        work_id = str(row.get("workOrderId") or "")
        if not work_id or local_cooldown_active(cfg, work_id):
            continue
        if review_requires_external_identity(row):
            continue
        try:
            if not review_is_independent_enough(cfg, row):
                continue
            _, _, target_head = review_target(cfg, row)
            transition_work_order_cas(
                cfg,
                work_id,
                "READY",
                f"ELASTIC-QWEN-V53:AUTO_WAKE_REVIEW:{target_head}",
                make_work_execution_id(),
            )
            return [work_id]
        except (CASLost, TransientFleetState):
            refresh_snapshots(cfg)
            return []
        except Exception:
            continue
    return []


def continuous_seed_allowed_paths(cfg: Config, product: dict[str, Any]) -> list[str]:
    parent_pr = int(product["productPr"])
    paths: list[str] = []
    for row in runtime_work_rows(cfg):
        if row.get("parentProductPr") != parent_pr:
            continue
        if row.get("type") not in CONTINUOUS_SOURCE_TYPES:
            continue
        for raw in row.get("allowedPaths") or []:
            value = str(raw)
            if value.startswith(CONTINUOUS_CODE_PREFIXES) and value not in paths:
                paths.append(value)
    if paths:
        return paths[:24]

    branch = str(product["branch"])
    diff = git(
        cfg.anchor,
        "diff",
        "--name-only",
        f"origin/{cfg.main_branch}...origin/{branch}",
        "--",
        check=False,
        timeout=120,
    )
    if diff.returncode != 0:
        return []
    for raw in diff.stdout.splitlines():
        value = raw.strip()
        if value.startswith(CONTINUOUS_CODE_PREFIXES) and value not in paths:
            paths.append(value)
    return paths[:24]


def seed_continuous_product_work(cfg: Config, worker_identity: str) -> str | None:
    """Create one bounded code/test hardening Work Order through canonical runtime authority."""
    products = []
    for path in sorted((cfg.runtime / "runtime/integration/product-prs").glob("*.json")):
        product = read_json(path)
        if product.get("status") != "ACTIVE":
            continue
        products.append(product)
    products.sort(key=lambda row: (str(row.get("mission")), str(row.get("task"))))

    all_work = runtime_work_rows(cfg)
    for product in products:
        parent_pr = product.get("productPr")
        if not isinstance(parent_pr, int) or parent_pr <= 0:
            continue
        if any(
            row.get("parentProductPr") == parent_pr
            and row.get("status") in CONTINUOUS_ACTIVE_WORK_STATES
            for row in all_work
        ):
            continue
        branch = str(product.get("branch") or "")
        if not branch:
            continue
        try:
            info = gh_pr_info(cfg, parent_pr)
        except Exception:
            continue
        if info.get("state") != "OPEN" or str(info.get("headRefName") or "") != branch:
            continue
        try:
            live_head = git(cfg.anchor, "rev-parse", f"origin/{branch}").stdout.strip()
            if str(info.get("headRefOid") or "") != live_head:
                continue
            live_tree = exact_tree(cfg.anchor, live_head)
        except Exception:
            continue
        allowed_paths = continuous_seed_allowed_paths(cfg, product)
        if not allowed_paths:
            continue

        for attempt in range(1, 5):
            refresh_snapshots(cfg)
            generation = runtime_generation(cfg)
            work_id = (
                f"WO-{slug(str(product['task']), 18).upper()}-CONTINUOUS-QWEN-"
                f"{short_id(8).upper()}"
            )
            spec = {
                "schemaVersion": 1,
                "workOrderId": work_id,
                "mission": product["mission"],
                "roadmapTask": product["task"],
                "parentProductPr": parent_pr,
                "priority": 85,
                "type": "PRODUCT_DEFECT_REPAIR",
                "objective": (
                    "Always-on Product hardening. Inspect the exact current canonical Product source and tests "
                    "inside allowedPaths, identify one concrete correctness, performance, reliability, UX-facing "
                    "behavior, or missing-regression defect that can be proven locally, then implement the smallest "
                    "durable code/test fix. Do not create documentation-only, formatting-only, governance-only, "
                    "or no-op changes. If implementation is already correct, add a meaningful regression for a real "
                    "uncovered invariant and harden source only when that regression proves a defect."
                ),
                "requestedRole": "DEFECT_HUNTER",
                "allowedPaths": allowed_paths,
                "baseCommit": live_head,
                "baseTree": live_tree,
                "dependencyRequirements": [],
                "requiredTests": [
                    "run at least one focused local product/source regression or analyzer command and require exit 0",
                    "final changed paths remain inside the exact Work Order allowedPaths",
                    "no documentation-only or no-op candidate is allowed",
                ],
                "maxChildWorkOrders": 1,
                "status": "READY",
                "createdBy": worker_identity,
                "createdAt": utc_iso(),
            }
            with tempfile.NamedTemporaryFile("w", encoding="utf-8", delete=False, suffix=".json") as fh:
                json.dump(spec, fh, indent=2, sort_keys=True)
                fh.write("\n")
                spec_path = fh.name
            try:
                result = control_python(
                    cfg,
                    "mission_orchestrator.py",
                    "--project", str(cfg.runtime),
                    "work-create",
                    "--spec", spec_path,
                    "--work-id", make_work_execution_id(),
                    "--expected-generation", str(generation),
                    check=False,
                )
            finally:
                pathlib.Path(spec_path).unlink(missing_ok=True)
            if result.returncode != 0:
                dirty = git(cfg.runtime, "status", "--porcelain", check=False).stdout.strip()
                if dirty:
                    git(cfg.runtime, "reset", "--hard", f"origin/{cfg.runtime_branch}", check=False)
                    git(cfg.runtime, "clean", "-fd", check=False)
                if "runtime generation moved" in result.combined(4000) and attempt < 4:
                    continue
                break
            try:
                commit_runtime_transition(
                    cfg,
                    f"mission-runtime: seed always-on Product hardening {work_id}",
                )
            except CASLost:
                if attempt < 4:
                    continue
                return None
            refresh_snapshots(cfg)
            resilient_preflight(cfg)
            return work_id
    return None


def recover_continuous_frontier(
    cfg: Config,
    worker_identity: str,
    log: JsonlLog,
) -> dict[str, Any]:
    woken_reviews = wake_pending_reviews(cfg)
