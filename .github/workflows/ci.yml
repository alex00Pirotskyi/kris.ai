name: product-gates
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
env:
  PRODUCT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  KRISTIN_V70_P2_PACKAGE_SHA256: "7b0d77d8956f05ff907ca7463b0d787dcebf93a60426aab105be2b610e6072b0"
jobs:
  validate:
    name: validate-${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ubuntu
            os: ubuntu-24.04
            platform: linux
          - lane: windows
            os: windows-2025
            platform: windows
          - lane: macos
            os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          fetch-depth: 1
      - id: source
        name: Bind exact candidate
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libstdc++-12-dev
      - name: Generate native runner
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) platforms=linux ;;
            Windows) platforms=windows ;;
            macOS) platforms=macos ;;
          esac
          flutter create --project-name kristin_local_agent --org local.kristin --platforms="$platforms" .
      - run: flutter pub get
      - name: Install hash-locked P1/P2 Python test dependencies
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Install exact automation-host dependency closure
        shell: bash
        run: npm ci --prefix automation_host --no-audit --no-fund
      - name: Capture CI environment
        run: python tool/capture_ci_environment.py --output "release/evidence/P0-003/ci-environment-${{ runner.os }}.json" --print
      - name: Validate locked toolchain
        run: python tool/toolchain_lock_test.py --json-output "release/evidence/P0-004/toolchain-${{ runner.os }}.json"
      - name: Upload P0-004 toolchain receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p0-004-toolchain-${{ matrix.lane }}
          path: release/evidence/P0-004/toolchain-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload P0-003 CI environment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p0-003-ci-environment-${{ matrix.lane }}
          path: release/evidence/P0-003/ci-environment-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
      - name: P0-002 trust retirement
        run: python tool/v1_trust_disablement_test.py
      - name: P0-003 integration repair
        run: python tool/p0_003_repair_test.py
      - name: P0-005 policy and support truth
        run: python tool/policy_support_test.py
      - name: P0-006 repository governance contract
        run: python tool/repository_governance_test.py --json-output release/evidence/P0-006/local_governance_results.json
      - name: P0-006 GitHub governance client fixtures
        run: python -m unittest -v tool/github_governance_client_test.py
      - name: V1.7 generated contracts
        run: python tool/generate_v170_contracts.py --check
      - name: V1.8 generated contracts
        run: python tool/generate_v180_contracts.py --check
      - name: V1.9 generated contracts
        run: python tool/generate_v190_contracts.py --check
      - name: P0-008 roadmap control plane
        run: |
          python tool/roadmap_control_test.py
          python tool/p0_008_roadmap_test.py --project .
          python tool/roadmap_control.py validate --project . --strict
      - name: P0-010 generated-state hygiene
        run: |
          python tool/source_tree_policy_test.py
          python tool/generated_state_guard_test.py
          python tool/p0_010_generated_state_test.py --project .
          python tool/generated_state_guard.py audit --project . --strict
      - name: Generated protocol contracts
        run: python tool/protocol_contract_test.py
      - name: P0-009 reproducible benchmark baseline
        run: |
          python tool/benchmark_runner_test.py
          python tool/p0_009_benchmark_test.py --project .
          python tool/benchmark_runner.py check --project .
      - name: P0-007 assurance classification
        run: python tool/p0_007_assurance_test.py --project .
      - name: Generated workflow migrations
        run: python tool/generate_workflow_migrations.py --check
      - name: Durable workflow kernel
        run: python tool/workflow_kernel_test.py --project .
      - name: Prompt Studio 2 contracts
        run: python tool/generate_prompt_studio_contracts.py --check
      - name: Prompt Studio 2 fixtures
        run: python tool/generate_prompt_studio_fixtures.py --check
      - name: Prompt Studio 2 compiler gate
        run: python tool/prompt_studio_v2_test.py
      - run: python tool/dart_format_scope.py --check
      - run: flutter analyze --no-pub --fatal-warnings --fatal-infos
      - run: flutter test --no-pub --concurrency=1 --reporter expanded
      - name: P1-002 access profile v2
        run: |
          python tool/access_profile_v2_test.py
          python tool/p1_002_access_profile_test.py --project .
      - name: P1 full trust closure
        run: |
          python tool/integration_train_test.py --project .
          python tool/p1_exit_gate_test.py --project .
      - name: P1-004 deterministic policy engine
        run: |
          python tool/deterministic_policy_engine_test.py
          python tool/p1_004_policy_engine_test.py --project .
      - name: P1-003 capability grant v2
        run: |
          python tool/capability_grant_v2_test.py
          python tool/p1_003_capability_grant_test.py --project .
      - name: P1-001 runtime boundary contract
        run: python tool/p1_001_runtime_boundary_test.py --project .
      - name: Architecture and security gate
        run: python tool/validate_release.py --skip-tests
      - name: P1-P11 converged source and release gates
        shell: bash
        run: |
          python tool/v71r12_patch_owner_risk_test_compatibility.py --project . --json-output "$RUNNER_TEMP/owner-runtime-compat.json"
          python -m unittest -v tool/p9_release_engineering_test.py
          python -m unittest -v tool/p9_update_install_test.py
          python -m unittest -v tool/p10_release_readiness_test.py
          python tool/p2_packaging_contract_test.py
          python tool/p2_p3_product_packaging_contract_test.py
          python -m unittest -v tool/p11_native_conformance_test.py
          python tool/p11_native_conformance.py --output "$RUNNER_TEMP/p11-${{ matrix.platform }}.json"
      - name: Prove P10 promotion remains fail-closed without external evidence
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p10-current-evidence.json'
          path.write_text(json.dumps({
              'schemaVersion': 1,
              'candidate': {
                  'sourceCommit': os.environ['SOURCE_COMMIT'],
                  'version': '1.9.0+190',
                  'releasePlatforms': ['windows', 'macos', 'linux'],
              },
              'p1ToP8': {'evidenceCurrent': True},
              'p9': {},
              'p10': {},
              'p11': {'platforms': {}},
          }), encoding='utf-8')
          PY
          set +e
          python tool/p10_release_readiness.py \
            --input "$RUNNER_TEMP/p10-current-evidence.json" \
            --output "$RUNNER_TEMP/p10-current-readiness.json"
          rc=$?
          set -e
          test "$rc" -eq 1
          python - <<'PY'
          import json, os, pathlib
          report = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'p10-current-readiness.json').read_text())
          assert report['resultState'] == 'BLOCKED'
          assert report['p10']['betaExitReady'] is False
          assert report['p10']['rcReady'] is False
          assert report['p10']['gaReady'] is False
          print('P10_EXTERNAL_EVIDENCE_BOUNDARY_PASS')
          PY
      - name: Switch to exact hosted P1A Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false
      - name: Build P1A/P2 native components on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python tool/p1a_toolchains.py --project . --verify-native-host --hosted-source-build --skip-node --platform linux
          cmake -S authority_service/native/linux -B .p1a-build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-linux --parallel 2
          cmake -S authority_service/connector/linux -B .p1a-connector-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-linux --parallel 2
          cmake -S authority_service/worker_launcher/linux -B .p1a-worker-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-linux --parallel 2
          .p1a-build-linux/kristin_p1_authority_service --source-self-test
          .p1a-build-linux/kristin_p1a_authority_core_regression
          .p1a-connector-linux/kristin_p1a_connector_cli --source-self-test
          .p1a-worker-linux/kristin_p2_worker_launcher --source-self-test
          cmake -S automation_host/native/posix -B .p2-native-posix -DCMAKE_BUILD_TYPE=Release
          cmake --build .p2-native-posix --parallel 2
      - name: Build P1A/P2 native components on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          python tool/p1a_toolchains.py --project . --verify-native-host --hosted-source-build --skip-node --platform macos
          cmake -S authority_service/native/macos -B .p1a-build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-macos --parallel 2
          cmake -S authority_service/connector/macos -B .p1a-connector-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-macos --parallel 2
          cmake -S authority_service/worker_launcher/macos -B .p1a-worker-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-macos --parallel 2
          cmake -S authority_service/install/macos -B .p1a-manager-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-manager-macos --parallel 2
          .p1a-build-macos/kristin_p1_authority_service_macos --source-self-test
          .p1a-build-macos/kristin_p1a_authority_core_regression
          .p1a-connector-macos/kristin_p1a_connector_cli --source-self-test
          .p1a-worker-macos/kristin_p2_worker_launcher --source-self-test
          cmake -S automation_host/native/posix -B .p2-native-posix -DCMAKE_BUILD_TYPE=Release
          cmake --build .p2-native-posix --parallel 2
      - name: Build P1A/P2 native components on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $installation = ([string](& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -Last 1)).Trim()
          if ([string]::IsNullOrWhiteSpace($installation)) { throw 'Visual Studio C++ workload not found' }
          . (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python tool/p1a_toolchains.py --project . --verify-native-host --hosted-source-build --skip-node --platform windows
          cmake -G Ninja -S authority_service/native/windows -B .p1a-build-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-windows --parallel 2
          cmake -G Ninja -S authority_service/connector/windows -B .p1a-connector-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-windows --parallel 2
          cmake -G Ninja -S authority_service/worker_launcher/windows -B .p1a-worker-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-windows --parallel 2
          .\.p1a-build-windows\kristin_p1_authority_service_windows.exe --source-self-test
          .\.p1a-build-windows\kristin_p1a_authority_core_regression.exe
          .\.p1a-connector-windows\kristin_p1a_connector_cli.exe --source-self-test
          .\.p1a-worker-windows\kristin_p2_worker_launcher.exe --source-self-test
          cmake -G Ninja -S automation_host/native/windows -B .p2-native-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p2-native-windows --parallel 2
      - name: Stage product current-account P2 runtime
        shell: bash
        run: |
          python tool/v70_stage_runtime.py \
            --project . \
            --platform "${{ matrix.platform }}" \
            --output .v70-stage \
            --source-commit "${{ steps.source.outputs.commit }}" \
            --source-tree "${{ steps.source.outputs.tree }}" \
            --p2-package-sha256 "$KRISTIN_V70_P2_PACKAGE_SHA256" \
            --configurator tool/configure-owner-risk-runtime.mjs \
            --mode product-current-account \
            --github-env "$GITHUB_ENV"
      - name: Real P2 current-account host-effect smoke
        shell: bash
        run: flutter test --no-pub test/product/p2_owner_risk_runtime_smoke_test.dart
      - name: Download pinned Chromium for packaging
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/p1-p11-pw-browsers" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/p1-p11-pw-browsers" node automation_host/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Stage P3 application-owned browser runtime
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_EXEC="$(PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" node -e "const {chromium}=require('./automation_host/node_modules/playwright-core'); process.stdout.write(chromium.executablePath())")"
          export BROWSER_EXEC
          BROWSER_ROOT="$(python - <<'PY'
          import os, pathlib
          cache = pathlib.Path(os.environ['PLAYWRIGHT_BROWSERS_PATH']).resolve()
          executable = pathlib.Path(os.environ['BROWSER_EXEC']).resolve()
          relative = executable.relative_to(cache)
          if not relative.parts:
              raise SystemExit('browser executable outside Playwright cache')
          print(cache / relative.parts[0])
          PY
          )"
          NODE_EXE="$(node -p "process.execPath")"
          python tool/p3_stage_browser_runtime_bundle.py \
            --project . \
            --destination "$RUNNER_TEMP/p3-runtime" \
            --node-executable "$NODE_EXE" \
            --browser-root "$BROWSER_ROOT" \
            --browser-executable "$BROWSER_EXEC" \
            --source-commit "${{ steps.source.outputs.commit }}" \
            --source-tree "${{ steps.source.outputs.tree }}"
      - name: Native release build
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux) flutter build linux --release --no-pub ;;
            windows) flutter build windows --release --no-pub ;;
            macos) flutter build macos --release --no-pub ;;
          esac
      - name: Package one Kristin payload containing P2 and P3
        shell: bash
        run: |
          python tool/v70_package_platform.py \
            --project . \
            --platform "${{ matrix.platform }}" \
            --runtime-stage .v70-stage \
            --browser-runtime-stage "$RUNNER_TEMP/p3-runtime" \
            --output-dir .v70-dist \
            --source-commit "${{ steps.source.outputs.commit }}" \
            --source-tree "${{ steps.source.outputs.tree }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --product-current-account
      - name: Bind exact packaged executable
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          platform = os.environ['PLATFORM']
          payload = pathlib.Path('.v70-dist') / f'payload-{platform}'
          metadata = json.loads((payload / 'OWNER_RUNTIME_METADATA.json').read_text(encoding='utf-8'))
          executable = (payload / 'app' / metadata['appExecutable']).resolve()
          if not executable.is_file():
              raise SystemExit(f'packaged executable missing: {executable}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='\n') as handle:
              handle.write(f'KRISTIN_PACKAGED_APP_EXECUTABLE={executable}\n')
          print(executable)
          PY
      - name: Packaged P2 plus P3 end-to-end smoke
        shell: bash
        run: flutter test --no-pub test/product/p1_p10_packaged_runtime_smoke_test.dart
      - name: P9 package and verify the converged product payload
        shell: bash
        run: |
          mkdir -p release/p9
          bundle="release/p9/kristin-${{ matrix.platform }}-combined-unsigned.zip"
          python tool/p9_release_engineering.py package \
            --project . \
            --platform "${{ matrix.platform }}" \
            --artifact ".v70-dist/payload-${{ matrix.platform }}/app" \
            --output "$bundle" \
            --source-commit "${{ steps.source.outputs.commit }}"
          python tool/p9_release_engineering.py verify \
            --project . \
            --bundle "$bundle" \
            --provenance "${bundle}.provenance.json"
      - name: Upload P1-P11 qualification receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p1-p11-runtime-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .v70-dist/KRISTIN_OWNER_MODE_*.zip.sha256
            .v70-dist/result-${{ matrix.platform }}.json
            release/p9/*.provenance.json
            ${{ runner.temp }}/p11-${{ matrix.platform }}.json
            ${{ runner.temp }}/p10-current-readiness.json
            ${{ runner.temp }}/owner-runtime-compat.json
          if-no-files-found: error
          retention-days: 30
