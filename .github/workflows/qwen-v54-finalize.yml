name: Qwen 5.4 Finalize

on:
  push:
    branches:
      - agent/qwen-phone-control
    paths:
      - '.github/workflows/qwen-v54-finalize.yml'

permissions:
  contents: write

concurrency:
  group: qwen-v54-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Capture exact candidate
        shell: bash
        run: echo "CANDIDATE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Revalidate stable Qwen 5.4 path
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_worker_v53_base.py \
            tool/kris_qwen_worker_v531.py \
            tool/kris_qwen_worker_v54.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_v53_recovery.py \
            tool/kris_qwen_v53_reconcile.py \
            tool/kris_qwen_engineering_env.py \
            tool/kris_qwen_engineering_env_test.py \
            tool/kris_qwen_v531_test.py
          python tool/kris_qwen_v531_test.py
          python tool/kris_qwen_engineering_env_test.py
          python tool/kris_qwen_worker_v53.py version > "$RUNNER_TEMP/stable-v54.json"
          python - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'stable-v54.json').read_text(encoding='utf-8'))
          assert value.get('scriptVersion') == '5.4.0', value
          PY
          bash -n tool/install_kris_qwen_control_systemd.sh
          test "$(python tool/kris_qwen_control.py.compat.py --version)" = '2.2.0'
      - name: Remove temporary validation transports and regenerate source identity
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qwen-v54-engineering-validation.yml
          rm .github/workflows/qwen-v54-finalize.yml
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp -s "$RUNNER_TEMP/manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          mapfile -t paths < <(git diff --name-only HEAD | LC_ALL=C sort)
          printf 'FINAL_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 3
          test "${paths[0]}" = '.github/workflows/qwen-v54-engineering-validation.yml'
          test "${paths[1]}" = '.github/workflows/qwen-v54-finalize.yml'
          test "${paths[2]}" = 'SOURCE_MANIFEST.sha256'
      - name: Publish only if branch did not move
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --heads origin refs/heads/agent/qwen-phone-control | awk '{print $1}')"
          test "$remote" = "$CANDIDATE_BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/qwen-v54-engineering-validation.yml \
            .github/workflows/qwen-v54-finalize.yml \
            SOURCE_MANIFEST.sha256
          git diff --cached --check
          git commit -m 'chore(qwen): finalize 5.4 engineering environment'
          git push origin HEAD:refs/heads/agent/qwen-phone-control
