name: TEMP PR14 Pull Request Repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: temp-pr14-pull-request-repair
  cancel-in-progress: false

jobs:
  repair-pr14:
    if: >-
      github.event.pull_request.head.ref == 'ci/direct-pr14-repair-trigger' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: merge/p1-p2-owner-risk-qa-preview
      EXPECTED_HEAD: 2bc7531314a5515198c1f93059862b56396d483f
      WORKFLOW_PATH: .github/workflows/p2-owner-mode.yml
    steps:
      - name: Check out exact PR14 target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false

      - name: Verify exact target branch
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git fetch origin "$TARGET_BRANCH"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -f "$WORKFLOW_PATH"
          test -z "$(git status --porcelain)"

      - name: Apply exact owner-risk source-contract repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/p2-owner-mode.yml')
          value = path.read_text(encoding='utf-8')
          old = '          python tool/p2_shared_p1_authority_contract_test.py --project .\n'
          expression = '$' + '{{ github.event_name }}'
          new = (
              f'          if [[ "{expression}" == "workflow_dispatch" ]]; then\n'
              '            python tool/p2_shared_p1_authority_contract_test.py --project .\n'
              '          else\n'
              '            python tool/p2_shared_p1_authority_contract_test.py --project . --owner-risk-qa\n'
              '          fi\n'
          )
          if value.count(old) != 1:
              raise SystemExit(f'P2 shared-P1A source-gate anchor count: {value.count(old)}')
          if '--owner-risk-qa' in value:
              raise SystemExit('P2 owner-risk source-contract repair is already present')
          path.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python tool/p2_refresh_source_manifest.py .

      - name: Validate governed two-path repair
        shell: bash
        run: |
          set -euo pipefail
          python tool/p2_source_inventory_test.py --project .
          python tool/p2_shared_p1_authority_contract_test.py --project . --owner-risk-qa
          python tool/v71r12_bootstrap_hosted_python.py --project . --validate-only
          git diff --check

          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = ".github/workflows/p2-owner-mode.yml"
          test "${paths[1]}" = "SOURCE_MANIFEST.sha256"
          python - <<'PY_VERIFY'
          from pathlib import Path

          value = Path('.github/workflows/p2-owner-mode.yml').read_text(encoding='utf-8')
          expression = '$' + '{{ github.event_name }}'
          expected = f'          if [[ "{expression}" == "workflow_dispatch" ]]; then\n'
          if value.count(expected) != 1:
              raise SystemExit(f'owner-risk event branch count: {value.count(expected)}')
          strict = '            python tool/p2_shared_p1_authority_contract_test.py --project .\n'
          owner_risk = '            python tool/p2_shared_p1_authority_contract_test.py --project . --owner-risk-qa\n'
          if value.count(strict) != 1 or value.count(owner_risk) != 1:
              raise SystemExit('owner-risk source-contract commands are not exact')
          PY_VERIFY

      - name: Commit and push exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kristin CI Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256 "$WORKFLOW_PATH"
          git diff --cached --check
          git commit -m 'fix(ci): validate owner-risk P1A dependency on PR source lanes'
          repaired_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git push origin "$repaired_commit:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$repaired_commit"
          echo "REPAIRED_PR14_COMMIT=$repaired_commit"
