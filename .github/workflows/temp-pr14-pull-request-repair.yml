name: TEMP PR14 Explicit Owner Comment Repair

on:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: temp-pr14-explicit-owner-comment-repair
  cancel-in-progress: false

jobs:
  repair-pr14:
    if: >-
      github.event.issue.number == 48 &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'alex00Pirotskyi' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.sender.login == 'alex00Pirotskyi' &&
      github.actor == 'alex00Pirotskyi' &&
      github.event.comment.body == '/kristin pr14-repair 0b91e02f2d7413c40dcfa81176877cd3a0daf87e nonce-20260805-bfcd8c76'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: merge/p1-p2-owner-risk-qa-preview
      EXPECTED_HEAD: 0b91e02f2d7413c40dcfa81176877cd3a0daf87e
      STATUS_BRANCH: ci/direct-pr14-repair-trigger
      EXPECTED_TRIGGER_HEAD: 61037b13e71d8b0e6b47feaa9922d476c5666347
      EXPECTED_TRIGGER_PR: '48'
      EXPECTED_OWNER: alex00Pirotskyi
      EXPECTED_COMMAND: /kristin pr14-repair 0b91e02f2d7413c40dcfa81176877cd3a0daf87e nonce-20260805-bfcd8c76
      EXPECTED_SOURCE_RUN_ID: '30950745333'
      EVIDENCE_ATTEMPT_ONE: '1'
      EVIDENCE_ATTEMPT_TWO: '2'
      CI_PATH: .github/workflows/ci.yml
      DOC_PATH: docs/progress/2026-08-05-pr14-ci-recovery.md
    steps:
      - name: Check out exact status branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/direct-pr14-repair-trigger
          fetch-depth: 0
          persist-credentials: true
          path: status

      - name: Check out exact PR14 target without comment-PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: true
          path: target

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Verify owner command, exact trigger PR, and both successful source attempts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python - "$GITHUB_EVENT_PATH" <<'PY_EVENT'
          import json
          import os
          import pathlib
          import sys

          event = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          issue = event.get('issue') or {}
          comment = event.get('comment') or {}
          sender = event.get('sender') or {}
          expected_owner = os.environ['EXPECTED_OWNER']
          expected_command = os.environ['EXPECTED_COMMAND']

          if issue.get('number') != int(os.environ['EXPECTED_TRIGGER_PR']):
              raise SystemExit('trigger issue number mismatch')
          if not isinstance(issue.get('pull_request'), dict):
              raise SystemExit('trigger issue is not a pull request')
          if comment.get('body') != expected_command:
              raise SystemExit('trigger command mismatch')
          if (comment.get('user') or {}).get('login') != expected_owner:
              raise SystemExit('trigger comment owner mismatch')
          if comment.get('author_association') != 'OWNER':
              raise SystemExit('trigger author association is not OWNER')
          if sender.get('login') != expected_owner:
              raise SystemExit('trigger sender mismatch')
          comment_id = comment.get('id')
          if not isinstance(comment_id, int) or comment_id <= 0:
              raise SystemExit('trigger comment id is invalid')

          with pathlib.Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'TRIGGER_COMMENT_ID={comment_id}\n')
          print(f'TRIGGER_COMMENT_ID={comment_id}')
          PY_EVENT

          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$TRIGGER_COMMENT_ID" > "$RUNNER_TEMP/comment.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_TRIGGER_PR" > "$RUNNER_TEMP/trigger-pr.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_SOURCE_RUN_ID/attempts/$EVIDENCE_ATTEMPT_ONE/jobs?per_page=100" > "$RUNNER_TEMP/attempt-one-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_SOURCE_RUN_ID/attempts/$EVIDENCE_ATTEMPT_TWO/jobs?per_page=100" > "$RUNNER_TEMP/attempt-two-jobs.json"

          python - \
            "$RUNNER_TEMP/comment.json" \
            "$RUNNER_TEMP/trigger-pr.json" \
            "$RUNNER_TEMP/source-run.json" \
            "$RUNNER_TEMP/attempt-one-jobs.json" \
            "$RUNNER_TEMP/attempt-two-jobs.json" <<'PY_VERIFY'
          import json
          import os
          import pathlib
          import sys

          comment = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          pull = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          run = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding='utf-8'))
          attempt_one = json.loads(pathlib.Path(sys.argv[4]).read_text(encoding='utf-8')).get('jobs', [])
          attempt_two = json.loads(pathlib.Path(sys.argv[5]).read_text(encoding='utf-8')).get('jobs', [])

          expected_owner = os.environ['EXPECTED_OWNER']
          expected_command = os.environ['EXPECTED_COMMAND']
          expected_pr = int(os.environ['EXPECTED_TRIGGER_PR'])

          if comment.get('id') != int(os.environ['TRIGGER_COMMENT_ID']):
              raise SystemExit('fetched comment id mismatch')
          if comment.get('body') != expected_command:
              raise SystemExit('fetched comment body mismatch')
          if (comment.get('user') or {}).get('login') != expected_owner:
              raise SystemExit('fetched comment owner mismatch')
          if comment.get('author_association') != 'OWNER':
              raise SystemExit('fetched comment association mismatch')

          if pull.get('number') != expected_pr or pull.get('state') != 'open':
              raise SystemExit('trigger pull request is not exact and open')
          if pull.get('draft') is not True:
              raise SystemExit('disposable trigger pull request must remain draft')
          if (pull.get('base') or {}).get('ref') != 'main':
              raise SystemExit('trigger pull request base mismatch')
          head = pull.get('head') or {}
          if head.get('ref') != os.environ['STATUS_BRANCH']:
              raise SystemExit('trigger branch mismatch')
          if head.get('sha') != os.environ['EXPECTED_TRIGGER_HEAD']:
              raise SystemExit('trigger head mismatch')
          if (head.get('repo') or {}).get('full_name') != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('trigger repository mismatch')

          expected_run = {
              'id': int(os.environ['EXPECTED_SOURCE_RUN_ID']),
              'name': 'product-gates',
              'event': 'pull_request',
              'status': 'completed',
              'conclusion': 'success',
              'head_branch': os.environ['STATUS_BRANCH'],
              'head_sha': os.environ['EXPECTED_TRIGGER_HEAD'],
              'run_attempt': int(os.environ['EVIDENCE_ATTEMPT_TWO']),
          }
          for key, value in expected_run.items():
              if run.get(key) != value:
                  raise SystemExit(f'source run {key} mismatch: {run.get(key)!r} != {value!r}')
          if (run.get('head_repository') or {}).get('full_name') != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('source run repository mismatch')
          run_prs = {row.get('number') for row in (run.get('pull_requests') or [])}
          if expected_pr not in run_prs:
              raise SystemExit('source run does not reference exact trigger PR')

          required = ('validate-ubuntu', 'validate-windows', 'validate-macos')
          for attempt_name, jobs in (('attempt-1', attempt_one), ('attempt-2', attempt_two)):
              for name in required:
                  matches = [row for row in jobs if row.get('name') == name]
                  if len(matches) != 1:
                      raise SystemExit(f'{attempt_name} job count mismatch for {name}: {len(matches)}')
                  row = matches[0]
                  if row.get('status') != 'completed' or row.get('conclusion') != 'success':
                      raise SystemExit(f'{attempt_name} job did not pass: {name}')
                  print(f'SOURCE_PRODUCT_JOB={attempt_name}:{name} ID={row.get("id")} CONCLUSION=success')

          print('EXPLICIT_OWNER_COMMAND_VERIFIED=true')
          PY_VERIFY

          echo "SOURCE_WORKFLOW_RUN_ID=$EXPECTED_SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "SOURCE_WORKFLOW_EVIDENCE_ATTEMPTS=$EVIDENCE_ATTEMPT_ONE,$EVIDENCE_ATTEMPT_TWO" >> "$GITHUB_ENV"

      - name: Build and validate exact documented repair candidate
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            test -n "${TRIGGER_COMMENT_ID:-}"
            test "${SOURCE_WORKFLOW_RUN_ID:-}" = "$EXPECTED_SOURCE_RUN_ID"
            test "${SOURCE_WORKFLOW_EVIDENCE_ATTEMPTS:-}" = "$EVIDENCE_ATTEMPT_ONE,$EVIDENCE_ATTEMPT_TWO"

            cd target
            git config core.autocrlf false
            git fetch origin "$TARGET_BRANCH"
            test "$(git branch --show-current)" = "$TARGET_BRANCH"
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
            test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
            test -f "$CI_PATH"
            test -z "$(git status --porcelain)"

            python - <<'PY_EDIT'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          value = path.read_text(encoding='utf-8')
          old = '''      - run: flutter pub get

      - name: Capture CI environment
'''
          new = '''      - run: flutter pub get

      - name: Install hash-locked P1/P2 Python test dependencies
        run: python tool/v71r12_bootstrap_hosted_python.py --project .

      - name: Capture CI environment
'''
          if value.count(old) != 1:
              raise SystemExit(f'product CI bootstrap anchor count: {value.count(old)}')
          if 'Install hash-locked P1/P2 Python test dependencies' in value:
              raise SystemExit('product CI bootstrap step is already present')
          path.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY_EDIT

            mkdir -p "$(dirname "$DOC_PATH")"
            cat > "$DOC_PATH" <<'DOC'
          # PR #14 owner-risk QA preview recovery: product CI bootstrap

          **Recorded:** 2026-08-05  
          **Human roadmap authority:** `docs/roadmap/MASTER.md`  
          **Machine dependency authority:** `docs/roadmap/roadmap.yaml`  
          **Recovery target:** `merge/p1-p2-owner-risk-qa-preview` at `0b91e02f2d7413c40dcfa81176877cd3a0daf87e`

          ## Purpose

          This significant recovery step makes the protected product gate reproducible on clean Windows, macOS, and Ubuntu runners before the P1/P2 owner-risk QA preview can be reconsidered for landing. It changes no product behavior and widens no authority boundary.

          The product workflow invokes the complete P1 exit gate. Two Ed25519 reference tests import the pinned `cryptography` dependency, but the workflow previously reached them before installing the repository's existing hash-locked hosted-Python dependency bundle. A clean runner could therefore fail with `ModuleNotFoundError: cryptography` despite green product source, Flutter analysis/tests, P1 contracts, and isolated P1/P2 runtime validation.

          ## Exact change

          1. `.github/workflows/ci.yml` installs the existing wheel-only, hash-locked P1/P2 Python test dependency closure immediately after `flutter pub get` and before every Python trust-closure test.
          2. `SOURCE_MANIFEST.sha256` is regenerated by `tool/p2_refresh_source_manifest.py`.
          3. This document records implementation, challenges, evidence boundaries, and governed next steps.

          No dependency version, test assertion, product API, runtime message format, access profile, security classification, or release claim changes.

          ## Challenges passed

          - Formal manual-dispatch and owner-risk pull-request source contracts were separated without weakening the formal lane.
          - A verifier false positive was corrected by matching the exact inserted five-line block instead of counting unrelated conditions globally.
          - GitHub correctly blocked an Actions token from updating workflow files without workflow-write authority; the exact validated commit object is retained for a separately authenticated ref update.
          - Connector-authored commits did not reliably emit push workflows, the reviewed `pull_request_target` fallback emitted no receipt, and two reviewed `workflow_run` handoffs also emitted no machine-readable receipt.
          - One Ubuntu hosted runner stalled inside package installation while Windows and macOS completed. That partial run was rejected and could not authorize mutation.
          - Product run `30950745333` was verified twice. Attempt 1 and attempt 2 each contain successful Windows, macOS, and Ubuntu jobs. Both attempt-specific job sets are re-fetched before mutation.
          - The final transport is an explicit one-time command on disposable PR #48. The command is accepted only from repository owner `alex00Pirotskyi`, with `OWNER` association, exact body, exact nonce, exact comment ID, exact PR, exact branch, exact SHA, and same-repository provenance.
          - Clean hosted runners exposed the missing dependency bootstrap. The fix reuses the existing locked dependency closure rather than adding unpinned installation or weakening the P1 exit gate.

          ## Candidate validation

          Before target mutation, the executor verifies the owner command and re-fetches its comment, PR #48, source run `30950745333`, and all three successful jobs in both source attempts.

          Against the exact target head it runs the P2 source inventory, owner-risk P1A dependency contract, hash-locked bootstrap, integration-train gate, full P1 exit gate, P0-003 repair gate, P0-008 roadmap controls, strict roadmap validator, P0-010 generated-state gate, Git whitespace checks, and exact three-path/exact-once assertions.

          Earlier isolated P1/P2 validation, including tri-platform run `30913519385`, remains owner-risk QA evidence. It is not substituted for fresh protected checks required after reconciliation.

          ## Claim boundary

          This remains an **owner-risk QA preview** for immediate application testing. Formal independent security completion, public-GA eligibility, production-release eligibility, signed-installer readiness, and unrestricted consumer release remain false. `docs/roadmap/MASTER.md` remains the sole human roadmap authority.

          ## Next governed steps

          1. Verify `repair-status.json` and the exact child commit.
          2. Attach the commit through connected GitHub authority if workflow writes are blocked.
          3. Reconcile with then-current protected `main`, regenerate inventories, and add a separate reconciliation document.
          4. Reopen PR #14 and require fresh protected P1A, P2, and product checks on Windows, macOS, and Ubuntu.
          5. Merge only when every required check is green, then publish a separate landing and roadmap-transition document before advancing the next `MASTER.md` task.
          DOC

            python tool/p2_refresh_source_manifest.py .
            python tool/p2_source_inventory_test.py --project .
            python tool/p2_shared_p1_authority_contract_test.py --project . --owner-risk-qa
            python tool/v71r12_bootstrap_hosted_python.py --project .
            python tool/integration_train_test.py --project .
            python tool/p1_exit_gate_test.py --project .
            python tool/p0_003_repair_test.py
            python tool/p0_008_roadmap_test.py --project .
            python tool/roadmap_control.py validate --project . --strict
            python tool/p0_010_generated_state_test.py --project .
            git diff --check

            mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
            printf 'CHANGED_PATH=%s\n' "${paths[@]}"
            test "${#paths[@]}" -eq 3
            test "${paths[0]}" = ".github/workflows/ci.yml"
            test "${paths[1]}" = "SOURCE_MANIFEST.sha256"
            test "${paths[2]}" = "$DOC_PATH"
            test "$(grep -c '^[[:space:]]*- name: Install hash-locked P1/P2 Python test dependencies$' "$CI_PATH")" -eq 1
            test "$(grep -c '^[[:space:]]*run: python tool/v71r12_bootstrap_hosted_python.py --project \.$' "$CI_PATH")" -eq 1
            grep -F '**Human roadmap authority:** `docs/roadmap/MASTER.md`' "$DOC_PATH"
            grep -F '## Challenges passed' "$DOC_PATH"
            grep -F 'explicit one-time command' "$DOC_PATH"

            git config user.name 'Kristin CI Repair'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add SOURCE_MANIFEST.sha256 "$CI_PATH" "$DOC_PATH"
            git diff --cached --check
            git commit -m 'fix(ci): bootstrap P1 closure and document PR14 recovery'
            repaired_commit="$(git rev-parse HEAD)"
            test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
            printf '%s\n' "$repaired_commit" > "$RUNNER_TEMP/repaired-commit.txt"

            set +e
            push_output="$(git push origin "$repaired_commit:refs/heads/$TARGET_BRANCH" 2>&1)"
            push_rc=$?
            set -e
            printf '%s\n' "$push_output"
            if [ "$push_rc" -eq 0 ]; then
              test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$repaired_commit"
              printf 'true\n' > "$RUNNER_TEMP/ref-updated-by-action.txt"
            else
              printf '%s' "$push_output" | grep -E 'refusing to allow a GitHub App|workflows permission'
              printf 'false\n' > "$RUNNER_TEMP/ref-updated-by-action.txt"
              echo 'REPAIR_OBJECT_TRANSFERRED_FOR_CONNECTED_REF_UPDATE=true'
            fi
          ) > "$RUNNER_TEMP/pr14-repair.log" 2>&1
          repair_rc=$?
          cat "$RUNNER_TEMP/pr14-repair.log"
          echo "REPAIR_RC=$repair_rc" >> "$GITHUB_ENV"
          if [ -f "$RUNNER_TEMP/repaired-commit.txt" ]; then
            echo "REPAIRED_COMMIT=$(cat "$RUNNER_TEMP/repaired-commit.txt")" >> "$GITHUB_ENV"
          else
            echo "REPAIRED_COMMIT=" >> "$GITHUB_ENV"
          fi
          if [ -f "$RUNNER_TEMP/ref-updated-by-action.txt" ]; then
            echo "REF_UPDATED_BY_ACTION=$(cat "$RUNNER_TEMP/ref-updated-by-action.txt")" >> "$GITHUB_ENV"
          else
            echo "REF_UPDATED_BY_ACTION=false" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Publish machine-readable repair receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd status
          if [ -f "$RUNNER_TEMP/pr14-repair.log" ]; then
            cp "$RUNNER_TEMP/pr14-repair.log" repair.log
          else
            printf 'candidate construction did not reach captured execution\n' > repair.log
          fi
          python - <<'PY_RECEIPT'
          import hashlib
          import json
          import os
          from pathlib import Path

          command = os.environ['EXPECTED_COMMAND']
          payload = {
              'schemaVersion': '1.3.0',
              'repairRc': int(os.environ.get('REPAIR_RC', '255')),
              'targetBranch': os.environ['TARGET_BRANCH'],
              'expectedHead': os.environ['EXPECTED_HEAD'],
              'triggerBranch': os.environ['STATUS_BRANCH'],
              'triggerHead': os.environ['EXPECTED_TRIGGER_HEAD'],
              'triggerPullRequest': int(os.environ['EXPECTED_TRIGGER_PR']),
              'triggerCommentId': os.environ.get('TRIGGER_COMMENT_ID', ''),
              'triggerOwner': os.environ['EXPECTED_OWNER'],
              'triggerCommandSha256': hashlib.sha256(command.encode('utf-8')).hexdigest(),
              'sourceWorkflowRunId': os.environ.get('SOURCE_WORKFLOW_RUN_ID', ''),
              'sourceWorkflowEvidenceAttempts': os.environ.get('SOURCE_WORKFLOW_EVIDENCE_ATTEMPTS', ''),
              'repairedCommit': os.environ.get('REPAIRED_COMMIT', ''),
              'refUpdatedByAction': os.environ.get('REF_UPDATED_BY_ACTION', 'false') == 'true',
              'workflowRunId': os.environ.get('GITHUB_RUN_ID', ''),
              'workflowRunAttempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              'roadmapAuthority': 'docs/roadmap/MASTER.md',
              'authorizedPaths': [
                  '.github/workflows/ci.yml',
                  'SOURCE_MANIFEST.sha256',
                  'docs/progress/2026-08-05-pr14-ci-recovery.md',
              ],
          }
          Path('repair-status.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY_RECEIPT
          git config user.name 'Kristin CI Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair.log repair-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record explicit-owner documented PR14 repair candidate'
            git push origin "HEAD:refs/heads/$STATUS_BRANCH"
          fi

      - name: Enforce successful candidate construction
        if: always()
        shell: bash
        run: |
          test "${REPAIR_RC:-255}" -eq 0
          test -n "${REPAIRED_COMMIT:-}"
