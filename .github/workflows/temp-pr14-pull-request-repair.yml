name: TEMP PR14 Pull Request Target Repair

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-pr14-pull-request-target-repair
  cancel-in-progress: false

jobs:
  repair-pr14:
    if: >-
      github.event.pull_request.head.ref == 'ci/direct-pr14-repair-trigger' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.sha == '61037b13e71d8b0e6b47feaa9922d476c5666347'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: merge/p1-p2-owner-risk-qa-preview
      EXPECTED_HEAD: 0b91e02f2d7413c40dcfa81176877cd3a0daf87e
      EXPECTED_TRIGGER_HEAD: 61037b13e71d8b0e6b47feaa9922d476c5666347
      STATUS_BRANCH: ci/direct-pr14-repair-trigger
      CI_PATH: .github/workflows/ci.yml
      DOC_PATH: docs/progress/2026-08-05-pr14-ci-recovery.md
    steps:
      - name: Check out exact PR14 target without PR-supplied code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: true
          path: target

      - name: Check out exact status branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/direct-pr14-repair-trigger
          fetch-depth: 0
          persist-credentials: true
          path: status

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Build and validate the exact documented repair candidate
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            test "${{ github.event.pull_request.head.sha }}" = "$EXPECTED_TRIGGER_HEAD"

            cd target
            git config core.autocrlf false
            git fetch origin "$TARGET_BRANCH"
            test "$(git branch --show-current)" = "$TARGET_BRANCH"
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
            test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
            test -f "$CI_PATH"
            test -z "$(git status --porcelain)"

            python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          value = path.read_text(encoding='utf-8')
          old = '''      - run: flutter pub get

      - name: Capture CI environment
'''
          new = '''      - run: flutter pub get

      - name: Install hash-locked P1/P2 Python test dependencies
        run: python tool/v71r12_bootstrap_hosted_python.py --project .

      - name: Capture CI environment
'''
          if value.count(old) != 1:
              raise SystemExit(f'product CI bootstrap anchor count: {value.count(old)}')
          if 'Install hash-locked P1/P2 Python test dependencies' in value:
              raise SystemExit('product CI bootstrap step is already present')
          path.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

            mkdir -p "$(dirname "$DOC_PATH")"
            cat > "$DOC_PATH" <<'DOC'
          # PR #14 owner-risk QA preview recovery: product CI bootstrap

          **Recorded:** 2026-08-05  
          **Human roadmap authority:** `docs/roadmap/MASTER.md`  
          **Machine dependency authority:** `docs/roadmap/roadmap.yaml`  
          **Recovery target:** `merge/p1-p2-owner-risk-qa-preview` at `0b91e02f2d7413c40dcfa81176877cd3a0daf87e`

          ## Purpose

          This significant recovery step makes the protected product gate reproducible on clean Windows, macOS, and Ubuntu runners before the P1/P2 owner-risk QA preview can be reconsidered for landing. It does not change product behavior or widen any authority boundary.

          The product workflow already invokes the complete P1 exit gate. Two Ed25519 reference tests import the repository's pinned `cryptography` dependency, but the product workflow previously reached those tests before installing the existing hash-locked hosted-Python dependency bundle. A clean runner could therefore fail with `ModuleNotFoundError: cryptography` even though the product source, Flutter analysis, Flutter tests, P1 contracts, and isolated P1/P2 runtime validation were otherwise green.

          ## Exact change

          The recovery candidate changes exactly three governed paths:

          1. `.github/workflows/ci.yml` installs the existing hash-locked P1/P2 Python test dependencies immediately after `flutter pub get` and before any Python trust-closure test.
          2. `SOURCE_MANIFEST.sha256` is regenerated by the repository's own `tool/p2_refresh_source_manifest.py` authority.
          3. This document records the work, evidence boundaries, and challenges passed.

          No dependency version, test assertion, product API, runtime message format, access profile, security classification, or release claim is changed.

          ## Challenges passed

          - The first P2 pull-request source lane used the formal manual-dispatch dependency contract and failed honestly; pull-request and push lanes were then narrowed to the explicit owner-risk QA dependency contract while formal dispatch remained strict.
          - An initial verifier counted a similar pre-existing event branch elsewhere in the workflow. The verifier was corrected to match the complete inserted five-line block rather than a global condition count.
          - GitHub correctly refused an Actions GitHub App token that attempted to update a workflow file without workflow-write authority. The recovery process therefore retains the validated child commit as a Git object and requires a separately authenticated connected ref update.
          - Connector-authored commits do not reliably emit push-triggered Actions runs. The final executor uses `pull_request_target`, accepts only the same repository and exact trigger SHA, and never checks out code from the disposable trigger PR.
          - Clean hosted runners exposed the missing dependency bootstrap. The fix reuses the existing wheel-only, hash-locked dependency closure instead of adding an unpinned installation or weakening the P1 exit gate.

          ## Candidate validation performed before commit creation

          The executor must pass all of the following against the exact target head before it records a candidate commit:

          - `python tool/p2_source_inventory_test.py --project .`
          - `python tool/p2_shared_p1_authority_contract_test.py --project . --owner-risk-qa`
          - `python tool/v71r12_bootstrap_hosted_python.py --project .`
          - `python tool/integration_train_test.py --project .`
          - `python tool/p1_exit_gate_test.py --project .`
          - `python tool/p0_003_repair_test.py`
          - `python tool/p0_008_roadmap_test.py --project .`
          - `python tool/roadmap_control.py validate --project . --strict`
          - `python tool/p0_010_generated_state_test.py --project .`
          - `git diff --check`
          - exact three-path scope and exact-once bootstrap checks

          Earlier isolated P1/P2 validation remains evidence for the owner-risk QA preview, including tri-platform run `30913519385`. It is not substituted for the fresh protected pull-request checks required after this candidate is attached.

          ## Claim boundary

          This remains an **owner-risk QA preview** for immediate application testing. Formal independent security completion, public-GA eligibility, production-release eligibility, signed-installer readiness, and unrestricted consumer release remain false. The owner-risk classification does not weaken durable evidence, cleanup, kill, redaction, reconciliation, or final verification requirements defined by `docs/roadmap/MASTER.md`.

          ## Next governed steps

          1. Read and verify the machine-readable `repair-status.json` receipt from the exact trigger branch.
          2. Confirm the candidate is exactly one child of `0b91e02f2d7413c40dcfa81176877cd3a0daf87e` and changes only the three paths listed above.
          3. Move the PR #14 branch ref through the connected GitHub authority if the Actions token was blocked.
          4. Reopen PR #14 and require fresh protected P1A, P2, and product checks on all three desktop platforms.
          5. Merge only after those checks are green, then record a separate landing and roadmap-transition document before advancing the next task authorized by `docs/roadmap/MASTER.md`.
          DOC

            python tool/p2_refresh_source_manifest.py .

            python tool/p2_source_inventory_test.py --project .
            python tool/p2_shared_p1_authority_contract_test.py --project . --owner-risk-qa
            python tool/v71r12_bootstrap_hosted_python.py --project .
            python tool/integration_train_test.py --project .
            python tool/p1_exit_gate_test.py --project .
            python tool/p0_003_repair_test.py
            python tool/p0_008_roadmap_test.py --project .
            python tool/roadmap_control.py validate --project . --strict
            python tool/p0_010_generated_state_test.py --project .
            git diff --check

            mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
            printf 'CHANGED_PATH=%s\n' "${paths[@]}"
            test "${#paths[@]}" -eq 3
            test "${paths[0]}" = ".github/workflows/ci.yml"
            test "${paths[1]}" = "SOURCE_MANIFEST.sha256"
            test "${paths[2]}" = "$DOC_PATH"
            test "$(grep -c '^[[:space:]]*- name: Install hash-locked P1/P2 Python test dependencies$' "$CI_PATH")" -eq 1
            test "$(grep -c '^[[:space:]]*run: python tool/v71r12_bootstrap_hosted_python.py --project \.$' "$CI_PATH")" -eq 1
            grep -F '**Human roadmap authority:** `docs/roadmap/MASTER.md`' "$DOC_PATH"
            grep -F '## Challenges passed' "$DOC_PATH"

            git config user.name 'Kristin CI Repair'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add SOURCE_MANIFEST.sha256 "$CI_PATH" "$DOC_PATH"
            git diff --cached --check
            git commit -m 'fix(ci): bootstrap P1 closure and document PR14 recovery'
            repaired_commit="$(git rev-parse HEAD)"
            test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
            printf '%s\n' "$repaired_commit" > "$RUNNER_TEMP/repaired-commit.txt"

            set +e
            push_output="$(git push origin "$repaired_commit:refs/heads/$TARGET_BRANCH" 2>&1)"
            push_rc=$?
            set -e
            printf '%s\n' "$push_output"
            if [ "$push_rc" -eq 0 ]; then
              test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$repaired_commit"
              printf 'true\n' > "$RUNNER_TEMP/ref-updated-by-action.txt"
            else
              printf '%s' "$push_output" | grep -E 'refusing to allow a GitHub App|workflows permission'
              printf 'false\n' > "$RUNNER_TEMP/ref-updated-by-action.txt"
              echo 'REPAIR_OBJECT_TRANSFERRED_FOR_CONNECTED_REF_UPDATE=true'
            fi
          ) > "$RUNNER_TEMP/pr14-repair.log" 2>&1
          repair_rc=$?
          cat "$RUNNER_TEMP/pr14-repair.log"
          echo "REPAIR_RC=$repair_rc" >> "$GITHUB_ENV"
          if [ -f "$RUNNER_TEMP/repaired-commit.txt" ]; then
            echo "REPAIRED_COMMIT=$(cat "$RUNNER_TEMP/repaired-commit.txt")" >> "$GITHUB_ENV"
          else
            echo "REPAIRED_COMMIT=" >> "$GITHUB_ENV"
          fi
          if [ -f "$RUNNER_TEMP/ref-updated-by-action.txt" ]; then
            echo "REF_UPDATED_BY_ACTION=$(cat "$RUNNER_TEMP/ref-updated-by-action.txt")" >> "$GITHUB_ENV"
          else
            echo "REF_UPDATED_BY_ACTION=false" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Publish machine-readable repair receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd status
          cp "$RUNNER_TEMP/pr14-repair.log" repair.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              'schemaVersion': '1.0.0',
              'repairRc': int(os.environ.get('REPAIR_RC', '255')),
              'targetBranch': os.environ['TARGET_BRANCH'],
              'expectedHead': os.environ['EXPECTED_HEAD'],
              'triggerHead': os.environ['EXPECTED_TRIGGER_HEAD'],
              'repairedCommit': os.environ.get('REPAIRED_COMMIT', ''),
              'refUpdatedByAction': os.environ.get('REF_UPDATED_BY_ACTION', 'false') == 'true',
              'workflowRunId': os.environ.get('GITHUB_RUN_ID', ''),
              'workflowRunAttempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              'roadmapAuthority': 'docs/roadmap/MASTER.md',
              'authorizedPaths': [
                  '.github/workflows/ci.yml',
                  'SOURCE_MANIFEST.sha256',
                  'docs/progress/2026-08-05-pr14-ci-recovery.md',
              ],
          }
          Path('repair-status.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          git config user.name 'Kristin CI Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair.log repair-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record documented PR14 repair candidate'
            git push origin "HEAD:refs/heads/$STATUS_BRANCH"
          fi

      - name: Enforce successful candidate construction
        if: always()
        shell: bash
        run: |
          test "${REPAIR_RC:-255}" -eq 0
          test -n "${REPAIRED_COMMIT:-}"
