name: TEMP PR14 Pull Request Repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: temp-pr14-pull-request-repair
  cancel-in-progress: false

jobs:
  repair-pr14:
    if: >-
      github.event.pull_request.head.ref == 'ci/direct-pr14-repair-trigger' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_BRANCH: merge/p1-p2-owner-risk-qa-preview
      EXPECTED_HEAD: 0b91e02f2d7413c40dcfa81176877cd3a0daf87e
      CI_PATH: .github/workflows/ci.yml
    steps:
      - name: Check out exact PR14 target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Verify exact target branch
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git fetch origin "$TARGET_BRANCH"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -f "$CI_PATH"
          test -z "$(git status --porcelain)"

      - name: Add the existing hash-locked bootstrap to product CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          value = path.read_text(encoding='utf-8')
          old = '''      - run: flutter pub get

      - name: Capture CI environment
'''
          new = '''      - run: flutter pub get

      - name: Install hash-locked P1/P2 Python test dependencies
        run: python tool/v71r12_bootstrap_hosted_python.py --project .

      - name: Capture CI environment
'''
          if value.count(old) != 1:
              raise SystemExit(f'product CI bootstrap anchor count: {value.count(old)}')
          if 'Install hash-locked P1/P2 Python test dependencies' in value:
              raise SystemExit('product CI bootstrap step is already present')
          path.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python tool/p2_refresh_source_manifest.py .

      - name: Validate the governed two-path repair and P1 closure
        shell: bash
        run: |
          set -euo pipefail
          python tool/p2_source_inventory_test.py --project .
          python tool/v71r12_bootstrap_hosted_python.py --project .
          python tool/integration_train_test.py --project .
          python tool/p1_exit_gate_test.py --project .
          git diff --check

          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = ".github/workflows/ci.yml"
          test "${paths[1]}" = "SOURCE_MANIFEST.sha256"
          test "$(grep -c '^[[:space:]]*- name: Install hash-locked P1/P2 Python test dependencies$' "$CI_PATH")" -eq 1
          test "$(grep -c '^[[:space:]]*run: python tool/v71r12_bootstrap_hosted_python.py --project \.$' "$CI_PATH")" -eq 1

      - name: Create the exact repair commit and transfer its Git object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kristin CI Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256 "$CI_PATH"
          git diff --cached --check
          git commit -m 'fix(ci): install hash-locked Python dependencies before P1 closure'
          repaired_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          echo "REPAIRED_PR14_COMMIT=$repaired_commit"

          set +e
          push_output="$(git push origin "$repaired_commit:refs/heads/$TARGET_BRANCH" 2>&1)"
          push_rc=$?
          set -e
          printf '%s\n' "$push_output"
          if [ "$push_rc" -eq 0 ]; then
            test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$repaired_commit"
            echo "REPAIR_REF_UPDATED_BY_ACTION=true"
          else
            printf '%s' "$push_output" | grep -E 'refusing to allow a GitHub App|workflows permission'
            echo "REPAIR_REF_UPDATED_BY_ACTION=false"
            echo "REPAIR_OBJECT_TRANSFERRED_FOR_CONNECTED_REF_UPDATE=true"
          fi
