name: TEMP PR14 Pinned Run Repair

on:
  workflow_run:
    workflows:
      - product-gates
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: temp-pr14-pinned-run-repair
  cancel-in-progress: false

jobs:
  repair-pr14:
    if: >-
      github.event.workflow_run.id == 30950745333 &&
      github.event.workflow_run.run_attempt == 2 &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'ci/direct-pr14-repair-trigger' &&
      github.event.workflow_run.head_sha == '61037b13e71d8b0e6b47feaa9922d476c5666347' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: merge/p1-p2-owner-risk-qa-preview
      EXPECTED_HEAD: 0b91e02f2d7413c40dcfa81176877cd3a0daf87e
      EXPECTED_TRIGGER_HEAD: 61037b13e71d8b0e6b47feaa9922d476c5666347
      EXPECTED_TRIGGER_PR: '48'
      EXPECTED_SOURCE_RUN_ID: '30950745333'
      EVIDENCE_ATTEMPT: '1'
      EVENT_ATTEMPT: '2'
      STATUS_BRANCH: ci/direct-pr14-repair-trigger
      CI_PATH: .github/workflows/ci.yml
      DOC_PATH: docs/progress/2026-08-05-pr14-ci-recovery.md
    steps:
      - name: Check out exact status branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/direct-pr14-repair-trigger
          fetch-depth: 0
          persist-credentials: true
          path: status

      - name: Check out exact PR14 target without trigger code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: true
          path: target

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Verify exact run, immutable tri-platform evidence, and fresh event attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_run_id="$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")"
          source_run_attempt="$(jq -r '.workflow_run.run_attempt' "$GITHUB_EVENT_PATH")"
          test "$source_run_id" = "$EXPECTED_SOURCE_RUN_ID"
          test "$source_run_attempt" = "$EVENT_ATTEMPT"
          test "$(jq -r '.workflow_run.name' "$GITHUB_EVENT_PATH")" = 'product-gates'
          test "$(jq -r '.workflow_run.event' "$GITHUB_EVENT_PATH")" = 'pull_request'
          test "$(jq -r '.workflow_run.status' "$GITHUB_EVENT_PATH")" = 'completed'
          test "$(jq -r '.workflow_run.conclusion' "$GITHUB_EVENT_PATH")" = 'success'
          test "$(jq -r '.workflow_run.head_branch' "$GITHUB_EVENT_PATH")" = "$STATUS_BRANCH"
          test "$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")" = "$EXPECTED_TRIGGER_HEAD"
          test "$(jq -r '.workflow_run.head_repository.full_name' "$GITHUB_EVENT_PATH")" = "$GITHUB_REPOSITORY"
          test "$(jq --argjson pr "$EXPECTED_TRIGGER_PR" '[.workflow_run.pull_requests[]? | select(.number == $pr)] | length' "$GITHUB_EVENT_PATH")" -eq 1

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_SOURCE_RUN_ID/attempts/$EVIDENCE_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/evidence-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_SOURCE_RUN_ID/attempts/$EVENT_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/event-jobs.json"

          python - "$RUNNER_TEMP/source-run.json" "$RUNNER_TEMP/evidence-jobs.json" "$RUNNER_TEMP/event-jobs.json" <<'PY_VERIFY'
          import json
          import os
          import pathlib
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          evidence_jobs = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8')).get('jobs', [])
          event_jobs = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding='utf-8')).get('jobs', [])
          expected = {
              'id': int(os.environ['EXPECTED_SOURCE_RUN_ID']),
              'name': 'product-gates',
              'event': 'pull_request',
              'status': 'completed',
              'conclusion': 'success',
              'head_branch': os.environ['STATUS_BRANCH'],
              'head_sha': os.environ['EXPECTED_TRIGGER_HEAD'],
              'run_attempt': int(os.environ['EVENT_ATTEMPT']),
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f'source run {key} mismatch: {run.get(key)!r} != {value!r}')

          for name in ('validate-ubuntu', 'validate-windows', 'validate-macos'):
              matches = [row for row in evidence_jobs if row.get('name') == name]
              if len(matches) != 1:
                  raise SystemExit(f'evidence-attempt job count mismatch for {name}: {len(matches)}')
              row = matches[0]
              if row.get('status') != 'completed' or row.get('conclusion') != 'success':
                  raise SystemExit(f'evidence-attempt job did not pass: {name}')
              print(f'EVIDENCE_PRODUCT_JOB={name} ID={row.get("id")} CONCLUSION=success')

          ubuntu = [row for row in event_jobs if row.get('name') == 'validate-ubuntu']
          if len(ubuntu) != 1:
              raise SystemExit(f'event-attempt Ubuntu job count mismatch: {len(ubuntu)}')
          if ubuntu[0].get('status') != 'completed' or ubuntu[0].get('conclusion') != 'success':
              raise SystemExit('event-attempt Ubuntu job did not pass')
          for row in event_jobs:
              if row.get('status') != 'completed' or row.get('conclusion') not in {'success', 'skipped'}:
                  raise SystemExit(f'event-attempt job is not terminal-successful: {row.get("name")}')
          print(f'EVENT_PRODUCT_JOB=validate-ubuntu ID={ubuntu[0].get("id")} CONCLUSION=success')
          PY_VERIFY

          echo "SOURCE_WORKFLOW_RUN_ID=$source_run_id" >> "$GITHUB_ENV"
          echo "SOURCE_WORKFLOW_EVIDENCE_ATTEMPT=$EVIDENCE_ATTEMPT" >> "$GITHUB_ENV"
          echo "SOURCE_WORKFLOW_EVENT_ATTEMPT=$source_run_attempt" >> "$GITHUB_ENV"

      - name: Build and validate exact documented repair candidate
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            test "${SOURCE_WORKFLOW_RUN_ID:-}" = "$EXPECTED_SOURCE_RUN_ID"
            test "${SOURCE_WORKFLOW_EVIDENCE_ATTEMPT:-}" = "$EVIDENCE_ATTEMPT"
            test "${SOURCE_WORKFLOW_EVENT_ATTEMPT:-}" = "$EVENT_ATTEMPT"

            cd target
            git config core.autocrlf false
            git fetch origin "$TARGET_BRANCH"
            test "$(git branch --show-current)" = "$TARGET_BRANCH"
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
            test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
            test -f "$CI_PATH"
            test -z "$(git status --porcelain)"

            python - <<'PY_EDIT'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          value = path.read_text(encoding='utf-8')
          old = '''      - run: flutter pub get

      - name: Capture CI environment
'''
          new = '''      - run: flutter pub get

      - name: Install hash-locked P1/P2 Python test dependencies
        run: python tool/v71r12_bootstrap_hosted_python.py --project .

      - name: Capture CI environment
'''
          if value.count(old) != 1:
              raise SystemExit(f'product CI bootstrap anchor count: {value.count(old)}')
          if 'Install hash-locked P1/P2 Python test dependencies' in value:
              raise SystemExit('product CI bootstrap step is already present')
          path.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY_EDIT

            mkdir -p "$(dirname "$DOC_PATH")"
            cat > "$DOC_PATH" <<'DOC'
          # PR #14 owner-risk QA preview recovery: product CI bootstrap

          **Recorded:** 2026-08-05  
          **Human roadmap authority:** `docs/roadmap/MASTER.md`  
          **Machine dependency authority:** `docs/roadmap/roadmap.yaml`  
          **Recovery target:** `merge/p1-p2-owner-risk-qa-preview` at `0b91e02f2d7413c40dcfa81176877cd3a0daf87e`

          ## Purpose

          This significant recovery step makes the protected product gate reproducible on clean Windows, macOS, and Ubuntu runners before the P1/P2 owner-risk QA preview can be reconsidered for landing. It changes no product behavior and widens no authority boundary.

          The product workflow already invokes the complete P1 exit gate. Two Ed25519 reference tests import the pinned `cryptography` dependency, but the workflow previously reached them before installing the repository's existing hash-locked hosted-Python dependency bundle. A clean runner could therefore fail with `ModuleNotFoundError: cryptography` despite green product source, Flutter analysis/tests, P1 contracts, and isolated P1/P2 runtime validation.

          ## Exact change

          1. `.github/workflows/ci.yml` installs the existing wheel-only, hash-locked P1/P2 Python test dependency closure immediately after `flutter pub get` and before every Python trust-closure test.
          2. `SOURCE_MANIFEST.sha256` is regenerated by `tool/p2_refresh_source_manifest.py`.
          3. This document records implementation, challenges, evidence boundaries, and governed next steps.

          No dependency version, test assertion, product API, runtime message format, access profile, security classification, or release claim changes.

          ## Challenges passed

          - Formal manual-dispatch and owner-risk pull-request source contracts were separated without weakening the formal lane.
          - A verifier false positive was corrected by matching the exact inserted five-line block instead of counting unrelated conditions globally.
          - GitHub correctly blocked an Actions token from updating workflow files without workflow-write authority; the exact validated commit object is retained for a separately authenticated ref update.
          - Connector-authored commits did not reliably emit push workflows, and the reviewed `pull_request_target` fallback emitted no receipt.
          - A broad `workflow_run` handoff was installed, but a later Ubuntu hosted runner stalled inside package installation while Windows and macOS completed successfully. The stalled run was not accepted as evidence and cannot race the receipt.
          - The final handoff pins immutable tri-platform evidence to product run `30950745333`, attempt 1, where Windows, macOS, and Ubuntu all passed. A fresh Ubuntu rerun as attempt 2 emits the post-merge event. Both attempts are verified directly, and every other run ID is ignored.
          - Clean hosted runners exposed the missing dependency bootstrap. The fix reuses the existing locked dependency closure rather than adding unpinned installation or weakening the P1 exit gate.

          ## Candidate validation

          Before target mutation, the executor verifies exact trigger PR #48, repository, branch, SHA, source run `30950745333`, all three successful jobs in evidence attempt 1, and a fresh successful Ubuntu job in event attempt 2.

          Against the exact target head it runs the P2 source inventory, owner-risk P1A dependency contract, hash-locked bootstrap, integration-train gate, full P1 exit gate, P0-003 repair gate, P0-008 roadmap controls, strict roadmap validator, P0-010 generated-state gate, Git whitespace checks, and exact three-path/exact-once assertions.

          Earlier isolated P1/P2 validation, including tri-platform run `30913519385`, remains owner-risk QA evidence. It is not substituted for fresh protected checks required after reconciliation.

          ## Claim boundary

          This remains an **owner-risk QA preview** for immediate application testing. Formal independent security completion, public-GA eligibility, production-release eligibility, signed-installer readiness, and unrestricted consumer release remain false. `docs/roadmap/MASTER.md` remains the sole human roadmap authority.

          ## Next governed steps

          1. Verify `repair-status.json` and the exact child commit.
          2. Attach the commit through connected GitHub authority if workflow writes are blocked.
          3. Reconcile with then-current protected `main`, regenerate inventories, and add a separate reconciliation document.
          4. Reopen PR #14 and require fresh protected P1A, P2, and product checks on Windows, macOS, and Ubuntu.
          5. Merge only when every required check is green, then publish a separate landing and roadmap-transition document before advancing the next `MASTER.md` task.
          DOC

            python tool/p2_refresh_source_manifest.py .
            python tool/p2_source_inventory_test.py --project .
            python tool/p2_shared_p1_authority_contract_test.py --project . --owner-risk-qa
            python tool/v71r12_bootstrap_hosted_python.py --project .
            python tool/integration_train_test.py --project .
            python tool/p1_exit_gate_test.py --project .
            python tool/p0_003_repair_test.py
            python tool/p0_008_roadmap_test.py --project .
            python tool/roadmap_control.py validate --project . --strict
            python tool/p0_010_generated_state_test.py --project .
            git diff --check

            mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
            printf 'CHANGED_PATH=%s\n' "${paths[@]}"
            test "${#paths[@]}" -eq 3
            test "${paths[0]}" = ".github/workflows/ci.yml"
            test "${paths[1]}" = "SOURCE_MANIFEST.sha256"
            test "${paths[2]}" = "$DOC_PATH"
            test "$(grep -c '^[[:space:]]*- name: Install hash-locked P1/P2 Python test dependencies$' "$CI_PATH")" -eq 1
            test "$(grep -c '^[[:space:]]*run: python tool/v71r12_bootstrap_hosted_python.py --project \.$' "$CI_PATH")" -eq 1
            grep -F '**Human roadmap authority:** `docs/roadmap/MASTER.md`' "$DOC_PATH"
            grep -F '## Challenges passed' "$DOC_PATH"
            grep -F 'pins immutable tri-platform evidence' "$DOC_PATH"

            git config user.name 'Kristin CI Repair'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add SOURCE_MANIFEST.sha256 "$CI_PATH" "$DOC_PATH"
            git diff --cached --check
            git commit -m 'fix(ci): bootstrap P1 closure and document PR14 recovery'
            repaired_commit="$(git rev-parse HEAD)"
            test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
            printf '%s\n' "$repaired_commit" > "$RUNNER_TEMP/repaired-commit.txt"

            set +e
            push_output="$(git push origin "$repaired_commit:refs/heads/$TARGET_BRANCH" 2>&1)"
            push_rc=$?
            set -e
            printf '%s\n' "$push_output"
            if [ "$push_rc" -eq 0 ]; then
              test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$repaired_commit"
              printf 'true\n' > "$RUNNER_TEMP/ref-updated-by-action.txt"
            else
              printf '%s' "$push_output" | grep -E 'refusing to allow a GitHub App|workflows permission'
              printf 'false\n' > "$RUNNER_TEMP/ref-updated-by-action.txt"
              echo 'REPAIR_OBJECT_TRANSFERRED_FOR_CONNECTED_REF_UPDATE=true'
            fi
          ) > "$RUNNER_TEMP/pr14-repair.log" 2>&1
          repair_rc=$?
          cat "$RUNNER_TEMP/pr14-repair.log"
          echo "REPAIR_RC=$repair_rc" >> "$GITHUB_ENV"
          if [ -f "$RUNNER_TEMP/repaired-commit.txt" ]; then
            echo "REPAIRED_COMMIT=$(cat "$RUNNER_TEMP/repaired-commit.txt")" >> "$GITHUB_ENV"
          else
            echo "REPAIRED_COMMIT=" >> "$GITHUB_ENV"
          fi
          if [ -f "$RUNNER_TEMP/ref-updated-by-action.txt" ]; then
            echo "REF_UPDATED_BY_ACTION=$(cat "$RUNNER_TEMP/ref-updated-by-action.txt")" >> "$GITHUB_ENV"
          else
            echo "REF_UPDATED_BY_ACTION=false" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Publish machine-readable repair receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd status
          if [ -f "$RUNNER_TEMP/pr14-repair.log" ]; then
            cp "$RUNNER_TEMP/pr14-repair.log" repair.log
          else
            printf 'candidate construction did not reach captured execution\n' > repair.log
          fi
          python - <<'PY_RECEIPT'
          import json
          import os
          from pathlib import Path

          payload = {
              'schemaVersion': '1.2.0',
              'repairRc': int(os.environ.get('REPAIR_RC', '255')),
              'targetBranch': os.environ['TARGET_BRANCH'],
              'expectedHead': os.environ['EXPECTED_HEAD'],
              'triggerHead': os.environ['EXPECTED_TRIGGER_HEAD'],
              'triggerPullRequest': int(os.environ['EXPECTED_TRIGGER_PR']),
              'sourceWorkflowRunId': os.environ.get('SOURCE_WORKFLOW_RUN_ID', ''),
              'sourceWorkflowEvidenceAttempt': os.environ.get('SOURCE_WORKFLOW_EVIDENCE_ATTEMPT', ''),
              'sourceWorkflowEventAttempt': os.environ.get('SOURCE_WORKFLOW_EVENT_ATTEMPT', ''),
              'repairedCommit': os.environ.get('REPAIRED_COMMIT', ''),
              'refUpdatedByAction': os.environ.get('REF_UPDATED_BY_ACTION', 'false') == 'true',
              'workflowRunId': os.environ.get('GITHUB_RUN_ID', ''),
              'workflowRunAttempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              'roadmapAuthority': 'docs/roadmap/MASTER.md',
              'authorizedPaths': [
                  '.github/workflows/ci.yml',
                  'SOURCE_MANIFEST.sha256',
                  'docs/progress/2026-08-05-pr14-ci-recovery.md',
              ],
          }
          Path('repair-status.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY_RECEIPT
          git config user.name 'Kristin CI Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair.log repair-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record pinned documented PR14 repair candidate'
            git push origin "HEAD:refs/heads/$STATUS_BRANCH"
          fi

      - name: Enforce successful candidate construction
        if: always()
        shell: bash
        run: |
          test "${REPAIR_RC:-255}" -eq 0
          test -n "${REPAIRED_COMMIT:-}"
