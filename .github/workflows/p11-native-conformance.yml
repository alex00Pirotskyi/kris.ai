name: P11 Native Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p11-native-conformance.yml'
      - 'config/p11_native_contract.v1.json'
      - 'tool/p11_native_conformance.py'
      - 'tool/p11_native_conformance_test.py'

permissions:
  contents: read

concurrency:
  group: p11-native-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false

      - name: Verify governed source manifest
        shell: bash
        run: |
          set -euo pipefail
          python tool/p2_refresh_source_manifest.py .
          git diff --check
          if git diff --quiet -- SOURCE_MANIFEST.sha256; then
            exit 0
          fi
          echo 'SOURCE_MANIFEST.sha256 is stale. Regenerate and commit it before qualification.' >&2
          git diff -- SOURCE_MANIFEST.sha256 >&2
          exit 1

  platform:
    needs: source-manifest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false

      - name: P11 contract and current-host conformance
        shell: bash
        run: |
          python -m unittest -v tool/p11_native_conformance_test.py
          python tool/p11_native_conformance.py --output "$RUNNER_TEMP/p11-${{ matrix.platform }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p11-current-host-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/p11-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30
