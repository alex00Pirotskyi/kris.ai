name: P5 UI Quality Probe Finalize

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p5-ui-quality-probe-finalize.yml

permissions:
  contents: write

jobs:
  qualify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p5-012-014-quality-closure-20260823
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Normalize bounded source and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          quality = Path('lib/product/p5_ui_quality.dart')
          text = quality.read_text(encoding='utf-8')
          old = 'return sorted[index.clamp(0, sorted.length - 1)];'
          new = 'return sorted[index.clamp(0, sorted.length - 1).toInt()];'
          if text.count(old) != 1:
              raise SystemExit('percentile clamp anchor mismatch')
          quality.write_text(text.replace(old, new, 1), encoding='utf-8')

          ux = Path('test/product/p5_ux_regression_gate_test.dart')
          text = ux.read_text(encoding='utf-8')
          old = '''      await _pressChord(\n        tester,\n        modifier: LogicalKeyboardKey.altLeft,\n        key: LogicalKeyboardKey.digit3,\n      );\n      expect(controller.state.workspace, P5WorkspaceId.runsActivity);\n      await _pressChord(\n        tester,\n        modifier: LogicalKeyboardKey.altLeft,\n        key: LogicalKeyboardKey.digit4,\n      );\n      expect(controller.state.workspace, P5WorkspaceId.verificationCenter);\n      await tester.sendKeyEvent(LogicalKeyboardKey.escape);\n      await tester.pumpAndSettle();\n      expect(controller.state.workspace, P5WorkspaceId.homeChat);\n      expect(controller.sideEffects.isZero, isTrue);\n'''
          new = '''      await tester.sendKeyDownEvent(LogicalKeyboardKey.controlLeft);\n      await tester.sendKeyDownEvent(LogicalKeyboardKey.shiftLeft);\n      await tester.sendKeyEvent(LogicalKeyboardKey.keyV);\n      await tester.sendKeyUpEvent(LogicalKeyboardKey.shiftLeft);\n      await tester.sendKeyUpEvent(LogicalKeyboardKey.controlLeft);\n      await tester.pumpAndSettle();\n      expect(controller.state.workspace, P5WorkspaceId.verificationCenter);\n      await tester.sendKeyEvent(LogicalKeyboardKey.escape);\n      await tester.pumpAndSettle();\n      expect(controller.state.workspace, P5WorkspaceId.homeChat);\n      await _pressChord(\n        tester,\n        modifier: LogicalKeyboardKey.altLeft,\n        key: LogicalKeyboardKey.digit3,\n      );\n      expect(controller.state.workspace, P5WorkspaceId.runsActivity);\n      await tester.sendKeyEvent(LogicalKeyboardKey.escape);\n      await tester.pumpAndSettle();\n      expect(controller.state.workspace, P5WorkspaceId.homeChat);\n      expect(controller.sideEffects.isZero, isTrue);\n'''
          if text.count(old) != 1:
              raise SystemExit('keyboard regression anchor mismatch')
          text = text.replace(old, new, 1)
          if text.count('      addTearDown(semantics.dispose);\n') != 1:
              raise SystemExit('semantics teardown anchor mismatch')
          text = text.replace('      addTearDown(semantics.dispose);\n', '', 1)
          tail = '''      expect(\n        find.bySemanticsLabel('Owner Mode status: Blocked by environment.'),\n        findsOneWidget,\n      );\n    });\n'''
          replacement = '''      expect(\n        find.bySemanticsLabel('Owner Mode status: Blocked by environment.'),\n        findsOneWidget,\n      );\n      semantics.dispose();\n    });\n'''
          if text.count(tail) != 1:
              raise SystemExit('semantics dispose anchor mismatch')
          ux.write_text(text.replace(tail, replacement, 1), encoding='utf-8')

          contract = Path('test/product/source_contract_test.dart')
          text = contract.read_text(encoding='utf-8')
          entry = "        'lib/product/p5_ui_quality.dart',\n"
          if entry not in text:
              anchor = "        'lib/product/p5_global_autonomy.dart',\n"
              if text.count(anchor) != 1:
                  raise SystemExit('source contract P5 anchor mismatch')
              text = text.replace(anchor, anchor + entry, 1)
              contract.write_text(text, encoding='utf-8')
          PY
          dart format \
            lib/product/p5_ui_quality.dart \
            test/product/p5_accessibility_compliance_test.dart \
            test/product/p5_ui_performance_test.dart \
            test/product/p5_ux_regression_gate_test.dart \
            test/product/source_contract_test.dart
      - name: Generate deterministic Linux golden
        run: >-
          flutter test --no-pub --update-goldens --reporter expanded
          test/product/p5_ux_regression_gate_test.dart
      - name: P5 accessibility performance and UX gate
        run: >-
          flutter test --no-pub --concurrency=1 --reporter expanded
          test/product/p5_design_tokens_test.dart
          test/product/p5_accessibility_compliance_test.dart
          test/product/p5_ui_performance_test.dart
          test/product/p5_ux_regression_gate_test.dart
          test/product/p5_information_architecture
      - name: Fatal static analysis
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos
      - name: Publish clean qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p5-ui-quality-probe-finalize.yml
          python tool/p2_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python tool/p2_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          python tool/dart_format_scope.py --check
          flutter test --no-pub --concurrency=1 test/product/source_contract_test.dart
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(p5): qualify accessibility performance and UX gates'
          git push origin HEAD:agent/p5-012-014-quality-closure-20260823
