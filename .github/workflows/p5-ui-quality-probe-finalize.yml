name: P5 UI Quality Probe Finalize

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p5-ui-quality-probe-finalize.yml

permissions:
  contents: write

jobs:
  qualify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p5-012-014-quality-closure-20260823
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Repair bounded P5 quality defects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          quality = Path('lib/product/p5_ui_quality.dart')
          text = quality.read_text(encoding='utf-8')
          old = 'return sorted[index.clamp(0, sorted.length - 1)];'
          new = 'return sorted[index.clamp(0, sorted.length - 1).toInt()];'
          if old in text:
              quality.write_text(text.replace(old, new, 1), encoding='utf-8')

          perf = Path('test/product/p5_ui_performance_test.dart')
          text = perf.read_text(encoding='utf-8')
          old = '''      final semantics = tester.ensureSemantics();\n      addTearDown(semantics.dispose);\n'''
          if old in text:
              text = text.replace(old, '''      final semantics = tester.ensureSemantics();\n''', 1)
          tail = '''      expect(find.text('Large-list mounted item peak'), findsOneWidget);\n    });\n'''
          replacement = '''      expect(find.text('Large-list mounted item peak'), findsOneWidget);\n      semantics.dispose();\n    });\n'''
          if '      semantics.dispose();\n    });\n' not in text[text.find("performance dashboard exposes measured state semantically"):]:
              if text.count(tail) != 1:
                  raise SystemExit('performance semantics anchor mismatch')
              text = text.replace(tail, replacement, 1)
          perf.write_text(text, encoding='utf-8')

          prototype = Path('lib/product/p5_information_architecture/p5_prototype.dart')
          text = prototype.read_text(encoding='utf-8')
          state_anchor = '''    final state = controller.state;\n    return Scaffold(\n'''
          state_replacement = '''    final state = controller.state;\n    final accessibilityCompact =\n        MediaQuery.textScalerOf(context).scale(1) >= 1.5;\n    return Scaffold(\n'''
          if 'final accessibilityCompact =' not in text:
              if text.count(state_anchor) != 1:
                  raise SystemExit('P5 shell state anchor mismatch')
              text = text.replace(state_anchor, state_replacement, 1)

          old_title = '''      appBar: AppBar(\n        titleSpacing: compact ? 0 : 20,\n        title: Column(\n          crossAxisAlignment: CrossAxisAlignment.start,\n          children: <Widget>[\n            Text(state.workspace.label, key: const Key('workspace-title')),\n            Text(\n              widget.ownerMode == null && widget.browserSessionStarter == null\n                  ? 'P5 presentation prototype — runtime not bound'\n                  : 'Experience workspace — live P2/P3 runtime integration',\n              style: const TextStyle(\n                fontSize: 12,\n                fontWeight: FontWeight.normal,\n              ),\n            ),\n          ],\n        ),\n'''
          new_title = '''      appBar: AppBar(\n        titleSpacing: compact ? 0 : 20,\n        toolbarHeight: accessibilityCompact ? 72 : null,\n        title: accessibilityCompact\n            ? Text(\n                state.workspace.label,\n                key: const Key('workspace-title'),\n                maxLines: 1,\n                overflow: TextOverflow.ellipsis,\n              )\n            : Column(\n                crossAxisAlignment: CrossAxisAlignment.start,\n                children: <Widget>[\n                  Text(\n                    state.workspace.label,\n                    key: const Key('workspace-title'),\n                  ),\n                  Text(\n                    widget.ownerMode == null &&\n                            widget.browserSessionStarter == null\n                        ? 'P5 presentation prototype — runtime not bound'\n                        : 'Experience workspace — live P2/P3 runtime integration',\n                    style: const TextStyle(\n                      fontSize: 12,\n                      fontWeight: FontWeight.normal,\n                    ),\n                  ),\n                ],\n              ),\n'''
          if old_title in text:
              text = text.replace(old_title, new_title, 1)
          elif 'toolbarHeight: accessibilityCompact ? 72 : null' not in text:
              raise SystemExit('P5 AppBar title anchor mismatch')

          old_history = '''          IconButton(\n            key: const Key('history-back'),\n            tooltip: 'Back (Escape or Alt+Left)',\n            onPressed: controller.canGoBack ? controller.back : null,\n            icon: const Icon(Icons.arrow_back),\n          ),\n          IconButton(\n            key: const Key('history-forward'),\n            tooltip: 'Forward (Alt+Right)',\n            onPressed: controller.canGoForward ? controller.forward : null,\n            icon: const Icon(Icons.arrow_forward),\n          ),\n'''
          new_history = '''          if (accessibilityCompact)\n            PopupMenuButton<String>(\n              key: const Key('p5-history-menu'),\n              tooltip: 'Navigation history',\n              icon: const Icon(Icons.history),\n              onSelected: (value) {\n                if (value == 'back') controller.back();\n                if (value == 'forward') controller.forward();\n              },\n              itemBuilder: (context) => <PopupMenuEntry<String>>[\n                PopupMenuItem<String>(\n                  value: 'back',\n                  enabled: controller.canGoBack,\n                  child: const Text('Back'),\n                ),\n                PopupMenuItem<String>(\n                  value: 'forward',\n                  enabled: controller.canGoForward,\n                  child: const Text('Forward'),\n                ),\n              ],\n            )\n          else ...<Widget>[\n            IconButton(\n              key: const Key('history-back'),\n              tooltip: 'Back (Escape or Alt+Left)',\n              onPressed: controller.canGoBack ? controller.back : null,\n              icon: const Icon(Icons.arrow_back),\n            ),\n            IconButton(\n              key: const Key('history-forward'),\n              tooltip: 'Forward (Alt+Right)',\n              onPressed: controller.canGoForward ? controller.forward : null,\n              icon: const Icon(Icons.arrow_forward),\n            ),\n          ],\n'''
          if old_history in text:
              text = text.replace(old_history, new_history, 1)
          elif "key: const Key('p5-history-menu')" not in text:
              raise SystemExit('P5 history action anchor mismatch')

          old_status = '''          if (!compact) _experienceSelector(context),\n          const SizedBox(width: 8),\n          Semantics(\n            liveRegion: true,\n            label: 'Owner Mode status: $_liveOwnerLabel.',\n            child: _StatusChip(\n              key: const Key('global-owner-status'),\n              label: 'Owner: $_liveOwnerLabel',\n              icon: Icons.admin_panel_settings_outlined,\n            ),\n          ),\n          const SizedBox(width: 12),\n'''
          new_status = '''          if (!compact && !accessibilityCompact) _experienceSelector(context),\n          if (!accessibilityCompact) const SizedBox(width: 8),\n          Semantics(\n            liveRegion: true,\n            label: 'Owner Mode status: $_liveOwnerLabel.',\n            child: accessibilityCompact\n                ? IconButton(\n                    key: const Key('global-owner-status'),\n                    tooltip: 'Owner Mode: $_liveOwnerLabel',\n                    onPressed: widget.onOpenOwnerMode,\n                    icon: const Icon(Icons.admin_panel_settings_outlined),\n                  )\n                : _StatusChip(\n                    key: const Key('global-owner-status'),\n                    label: 'Owner: $_liveOwnerLabel',\n                    icon: Icons.admin_panel_settings_outlined,\n                  ),\n          ),\n          const SizedBox(width: 8),\n'''
          if old_status in text:
              text = text.replace(old_status, new_status, 1)
          elif 'if (!compact && !accessibilityCompact)' not in text:
              raise SystemExit('P5 owner status anchor mismatch')
          prototype.write_text(text, encoding='utf-8')

          contract = Path('test/product/source_contract_test.dart')
          text = contract.read_text(encoding='utf-8')
          entry = "        'lib/product/p5_ui_quality.dart',\n"
          if entry not in text:
              anchor = "        'lib/product/p5_global_autonomy.dart',\n"
              if text.count(anchor) != 1:
                  raise SystemExit('source contract P5 anchor mismatch')
              text = text.replace(anchor, anchor + entry, 1)
              contract.write_text(text, encoding='utf-8')
          PY
          dart format \
            lib/product/p5_ui_quality.dart \
            lib/product/p5_information_architecture/p5_prototype.dart \
            test/product/p5_accessibility_compliance_test.dart \
            test/product/p5_ui_performance_test.dart \
            test/product/p5_ux_regression_gate_test.dart \
            test/product/source_contract_test.dart
      - name: Generate deterministic Linux golden
        run: >-
          flutter test --no-pub --update-goldens --reporter expanded
          test/product/p5_ux_regression_gate_test.dart
      - name: P5 accessibility performance and UX gate
        run: >-
          flutter test --no-pub --concurrency=1 --reporter expanded
          test/product/p5_design_tokens_test.dart
          test/product/p5_accessibility_compliance_test.dart
          test/product/p5_ui_performance_test.dart
          test/product/p5_ux_regression_gate_test.dart
          test/product/p5_information_architecture
      - name: Fatal static analysis
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos
      - name: Publish clean qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p5-ui-quality-probe-finalize.yml
          python tool/p2_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python tool/p2_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          python tool/dart_format_scope.py --check
          flutter test --no-pub --concurrency=1 test/product/source_contract_test.dart
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(p5): close text-scale accessibility and quality gates'
          git push origin HEAD:agent/p5-012-014-quality-closure-20260823
