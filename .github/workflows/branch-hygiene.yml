name: owner-product-macos-resources-qualifier

on:
  pull_request:
    branches:
      - hotfix/owner-mode-single-click-provisioning

permissions:
  contents: read

concurrency:
  group: owner-product-macos-resources-ab7e8c18
  cancel-in-progress: true

env:
  OWNER_CANDIDATE_SHA: ab7e8c18bb37c69d20e14ea8ac4694a3b7b1af8e
  KRISTIN_V70_P2_PACKAGE_SHA256: 7b0d77d8956f05ff907ca7463b0d787dcebf93a60426aab105be2b610e6072b0

jobs:
  macos:
    name: owner-product-macos-resources
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OWNER_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false
      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.toolchains.outputs.flutter }}
          channel: stable
          cache: true
      - name: Apply macOS product bundle layout fix to exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          dart = Path('lib/product/p2_bundled_current_account_runtime.dart')
          text = dart.read_text(encoding='utf-8')
          start_marker = "    final bundledRoot = Directory(\n"
          end_marker = "    final bundled = _object(\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'dart bundle structural anchors missing: start={start} end={end}')
          new = """    final bundledCandidates = <Directory>[
            if (Platform.isMacOS)
              Directory(
                '${executable.parent.parent.path}${Platform.pathSeparator}Resources'
                '${Platform.pathSeparator}runtime${Platform.pathSeparator}p2'
                '${Platform.pathSeparator}current',
              ),
            Directory(
              '${executable.parent.path}${Platform.pathSeparator}runtime'
              '${Platform.pathSeparator}p2${Platform.pathSeparator}current',
            ),
          ];
          Directory? selectedBundledRoot;
          for (final candidate in bundledCandidates) {
            final manifest = File(
              '${candidate.path}${Platform.pathSeparator}runtime-manifest.v3.json',
            );
            if (!await manifest.exists()) continue;
            if (await FileSystemEntity.isLink(manifest.path)) {
              throw StateError('p2_bundled_runtime_manifest_symlink');
            }
            selectedBundledRoot = candidate;
            break;
          }
          if (selectedBundledRoot == null) return false;
          final bundledRoot = selectedBundledRoot;
          final bundledManifest = File(
            '${bundledRoot.path}${Platform.pathSeparator}runtime-manifest.v3.json',
          );

          """
          dart.write_text(text[:start] + new + text[end:], encoding='utf-8', newline='\n')

          packager = Path('tool/v70_package_platform.py')
          text = packager.read_text(encoding='utf-8')
          old = '        runtime_destination = app_destination / app_source.name / "Contents/MacOS/runtime/p2/current"\n'
          new = '''        runtime_destination = app_destination / app_source.name / (\n            "Contents/Resources/runtime/p2/current"\n            if args.product_current_account\n            else "Contents/MacOS/runtime/p2/current"\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'packager mac runtime anchor count={text.count(old)}')
          packager.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          dart format lib/product/p2_bundled_current_account_runtime.dart
          python -m py_compile tool/v70_package_platform.py
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_bootstrap_hosted_cmake.py --project .
          flutter pub get
          npm ci --prefix automation_host --ignore-scripts=false --no-audit --no-fund
      - name: Build macOS authority and host helpers
        shell: bash
        run: |
          set -euo pipefail
          cmake -S authority_service/native/macos -B .p1a-build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-macos --parallel 2
          cmake -S authority_service/connector/macos -B .p1a-connector-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-macos --parallel 2
          cmake -S authority_service/worker_launcher/macos -B .p1a-worker-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-macos --parallel 2
          cmake -S automation_host/native/posix -B .p2-native-posix -DCMAKE_BUILD_TYPE=Release
          cmake --build .p2-native-posix --parallel 2
      - name: Stage product current-account runtime
        shell: bash
        run: |
          set -euo pipefail
          python tool/v70_stage_runtime.py \
            --project . \
            --platform macos \
            --output .v70-stage \
            --source-commit "$OWNER_CANDIDATE_SHA" \
            --source-tree "$(git rev-parse "$OWNER_CANDIDATE_SHA^{tree}")" \
            --p2-package-sha256 "$KRISTIN_V70_P2_PACKAGE_SHA256" \
            --configurator tool/configure-owner-risk-runtime.mjs \
            --mode product-current-account \
            --github-env "$GITHUB_ENV"
      - name: Prove first-run relocation from Contents Resources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bundle-app .bundle-data
          mkdir -p .bundle-app/Test.app/Contents/MacOS .bundle-app/Test.app/Contents/Resources/runtime/p2 .bundle-data
          cp -R .v70-stage/runtime .bundle-app/Test.app/Contents/Resources/runtime/p2/current
          touch .bundle-app/Test.app/Contents/MacOS/kristin
          cat > test/_p2_macos_resources_relocation_test.dart <<'DART'
          import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:kristin_local_agent/product/p2_bundled_current_account_runtime.dart';
          import 'package:kristin_local_agent/product/p2_runtime_resource_resolver.dart';
          void main() {
            test('macOS product runtime relocates from Contents Resources', () async {
              final sep = Platform.pathSeparator;
              final app = Directory('.bundle-app/Test.app').absolute;
              final data = Directory('.bundle-data').absolute;
              final executable = '${app.path}${sep}Contents${sep}MacOS${sep}kristin';
              final source = File('${app.path}${sep}Contents${sep}Resources${sep}runtime${sep}p2${sep}current${sep}runtime-manifest.v3.json');
              final before = await source.readAsBytes();
              expect(await P2BundledCurrentAccountRuntime.prepareIfPresent(
                applicationDataRoot: data,
                executablePath: executable,
              ), isTrue);
              final target = File('${data.path}${sep}runtime${sep}p2${sep}current${sep}runtime-manifest.v3.json');
              expect(await target.readAsBytes(), before);
              final resources = await P2ApplicationOwnedRuntimeResourceResolver(
                applicationDataRoot: data,
                executablePath: executable,
              ).resolve();
              expect(resources.provisionedEnvironment['KRISTIN_CURRENT_ACCOUNT_OWNER_PRODUCT'], '1');
            });
          }
          DART
          flutter test test/_p2_macos_resources_relocation_test.dart
          rm test/_p2_macos_resources_relocation_test.dart
      - name: Build and package signed-layout macOS product app
        shell: bash
        run: |
          set -euo pipefail
          flutter build macos --release --no-pub
          python tool/v70_package_platform.py \
            --project . \
            --platform macos \
            --runtime-stage .v70-stage \
            --output-dir .v70-dist \
            --source-commit "$OWNER_CANDIDATE_SHA" \
            --source-tree "$(git rev-parse "$OWNER_CANDIDATE_SHA^{tree}")" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --product-current-account
          test -f .v70-dist/payload-macos/app/kris_studio_ai_2.app/Contents/Resources/runtime/p2/current/runtime-manifest.v3.json
          test ! -e .v70-dist/payload-macos/app/kris_studio_ai_2.app/Contents/MacOS/runtime
          /usr/bin/codesign --verify --deep --strict --verbose=2 .v70-dist/payload-macos/app/kris_studio_ai_2.app
          python - <<'PY'
          import json, pathlib
          payload = pathlib.Path('.v70-dist/payload-macos')
          meta = json.loads((payload / 'OWNER_RUNTIME_METADATA.json').read_text())
          assert meta['functionalOwnerModeEligible'] is True
          assert meta['secureIsolationCertified'] is False
          archives = list(pathlib.Path('.v70-dist').glob('KRISTIN_OWNER_MODE_MACOS_*.zip'))
          assert len(archives) == 1, archives
          print('MACOS_RESOURCES_PACKAGE_OK', archives[0])
          PY
