name: owner-single-click-format-finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-finalize:
    name: owner-single-click-format-finalize
    if: >-
      github.event.pull_request.head.ref == 'hotfix/owner-mode-single-click-provisioning' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Normalize exact reported Dart files
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/product/p2_automation_host.dart \
            lib/product/p2_automation_host_process_client.dart \
            lib/product/p2_bundled_current_account_runtime.dart \
            lib/product/p2_owner_risk_authority.dart \
            lib/product/p2_product_runtime_bootstrap.dart \
            lib/product/p2_product_runtime_integration.dart \
            lib/product/p2_runtime_resource_resolver.dart \
            lib/product/product_runtime.dart \
            test/product/p2_owner_mode_failure_presentation_test.dart \
            test/product/p2_owner_risk_runtime_smoke_test.dart \
            test/product/source_contract_test.dart
          python tool/dart_format_scope.py --check
          flutter test --concurrency=1 \
            test/product/p2_single_click_owner_mode_test.dart \
            test/product/p2_owner_risk_contract_test.dart \
            test/product/p2_qa_preview_gate_test.dart \
            test/product/source_contract_test.dart
          flutter analyze --fatal-warnings --fatal-infos
          git diff --check
      - name: Restore canonical workflow and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/branch-hygiene.yml
          python tool/p1a_refresh_source_manifest.py .
          git add \
            .github/workflows/branch-hygiene.yml \
            SOURCE_MANIFEST.sha256 \
            lib/product/p2_automation_host.dart \
            lib/product/p2_automation_host_process_client.dart \
            lib/product/p2_bundled_current_account_runtime.dart \
            lib/product/p2_owner_risk_authority.dart \
            lib/product/p2_product_runtime_bootstrap.dart \
            lib/product/p2_product_runtime_integration.dart \
            lib/product/p2_runtime_resource_resolver.dart \
            lib/product/product_runtime.dart \
            test/product/p2_owner_mode_failure_presentation_test.dart \
            test/product/p2_owner_risk_runtime_smoke_test.dart \
            test/product/source_contract_test.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(owner): normalize governed Dart format scope'
          git push origin HEAD:hotfix/owner-mode-single-click-provisioning
