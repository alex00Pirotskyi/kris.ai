name: owner-macos-resources-publish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: owner-macos-resources-publish-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: owner-macos-resources-publish
    if: >-
      github.event.pull_request.head.ref == 'hotfix/owner-mode-single-click-provisioning' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Reproduce already-qualified macOS layout source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tool/owner_macos_resources_finalize.py
          python tool/owner_macos_resources_finalize.py
          python -m py_compile tool/v70_package_platform.py
          grep -F 'Resources/runtime/p2/current' tool/v70_package_platform.py
          grep -F 'executable.parent.parent.path' lib/product/p2_bundled_current_account_runtime.dart
      - name: Strip carrier state and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/branch-hygiene.yml
          git rm -f tool/owner_macos_resources_finalize.py
          python tool/p1a_refresh_source_manifest.py .
          git add -A
          git diff --cached --check
          mapfile -t paths < <(git diff --cached --name-only | LC_ALL=C sort)
          printf 'PUBLISH_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 5
          test "${paths[0]}" = '.github/workflows/branch-hygiene.yml'
          test "${paths[1]}" = 'SOURCE_MANIFEST.sha256'
          test "${paths[2]}" = 'lib/product/p2_bundled_current_account_runtime.dart'
          test "${paths[3]}" = 'tool/owner_macos_resources_finalize.py'
          test "${paths[4]}" = 'tool/v70_package_platform.py'
      - name: Publish durable macOS Resources fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(owner): embed macOS product runtime as app resources'
          git push origin HEAD:hotfix/owner-mode-single-click-provisioning
