name: owner-single-click-publish

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: owner-single-click-publish-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  publish-qualified-owner-runtime:
    name: publish-qualified-owner-runtime
    if: >-
      github.event.pull_request.head.ref == 'hotfix/owner-mode-single-click-provisioning' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Reproduce exact qualified source transformation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tool/owner_single_click_transport_fix.py \
            tool/owner_single_click_transport_repair.py \
            tool/owner_single_click_chain_fix.py \
            tool/owner_single_click_chain_repair.py \
            tool/owner_single_click_bundle_fix.py \
            tool/owner_single_click_relocatable_fix.py \
            tool/owner_single_click_fast_command_fix.py
          python tool/owner_single_click_transport_repair.py
          python tool/owner_single_click_transport_fix.py
          python tool/owner_single_click_chain_repair.py
          python tool/owner_single_click_chain_fix.py
          python tool/owner_single_click_bundle_fix.py
          python tool/owner_single_click_relocatable_fix.py
          node --check automation_host/src/authenticated-ipc.mjs
          node --check automation_host/src/host.mjs
          node --check automation_host/src/host-operations.mjs
          node --check automation_host/src/owner-risk-launcher.mjs
          node --check tool/configure-owner-risk-runtime.mjs
          python -m py_compile tool/v70_stage_runtime.py tool/v70_package_platform.py
          dart format \
            lib/product/p2_bundled_current_account_runtime.dart \
            lib/product/p2_owner_risk_authority.dart \
            lib/product/p2_automation_host.dart \
            lib/product/p2_automation_host_process_client.dart \
            lib/product/p2_runtime_resource_resolver.dart \
            lib/product/p2_product_runtime_bootstrap.dart \
            lib/product/p2_product_runtime_integration.dart \
            lib/product/product_runtime.dart \
            test/product/p2_owner_risk_contract_test.dart \
            test/product/p2_owner_risk_runtime_smoke_test.dart \
            test/product/p2_qa_preview_gate_test.dart \
            test/product/p2_single_click_owner_mode_test.dart
      - name: Strip qualifier state and refresh governed manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/branch-hygiene.yml
          git rm -f \
            tool/owner_single_click_transport_fix.py \
            tool/owner_single_click_transport_repair.py \
            tool/owner_single_click_chain_fix.py \
            tool/owner_single_click_chain_repair.py \
            tool/owner_single_click_bundle_fix.py \
            tool/owner_single_click_relocatable_fix.py
          test ! -e tool/owner_single_click_fast_command_fix.py
          rm -rf \
            .p1a-build-linux .p1a-build-macos .p1a-build-windows \
            .p1a-connector-linux .p1a-connector-macos .p1a-connector-windows \
            .p1a-worker-linux .p1a-worker-macos .p1a-worker-windows \
            .p1a-manager-macos \
            .p2-native-posix .p2-native-windows \
            .v70-stage .v70-dist .bundle-app .bundle-data build .dart_tool
          rm -f test/_p2_bundle_relocation_smoke_test.dart
          python tool/p1a_refresh_source_manifest.py .
          git add -A
          git diff --cached --check
          test ! -e tool/owner_single_click_transport_fix.py
          test ! -e tool/owner_single_click_transport_repair.py
          test ! -e tool/owner_single_click_chain_fix.py
          test ! -e tool/owner_single_click_chain_repair.py
          test ! -e tool/owner_single_click_bundle_fix.py
          test ! -e tool/owner_single_click_relocatable_fix.py
          test ! -e tool/owner_single_click_fast_command_fix.py
      - name: Publish durable implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(owner): make bundled current-account runtime product-ready'
          git push origin HEAD:hotfix/owner-mode-single-click-provisioning
