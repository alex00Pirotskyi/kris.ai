name: temporary-chat-formatter
on:
  push:
    branches:
      - tmp/chat-format
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format scoped chat files
        shell: bash
        run: |
          dart format \
            lib/product/chat_control_plane.dart \
            lib/product/chat_control_plane_studio.dart \
            lib/product/chat_control_plane_studio_actions.dart \
            lib/product/chat_control_plane_studio_view.dart \
            test/product/adaptive_decomposition_test.dart \
            test/product/chat_control_plane_test.dart
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name 'Kristin CI Formatter'
          git config user.email 'actions@github.com'
          git add \
            lib/product/chat_control_plane.dart \
            lib/product/chat_control_plane_studio.dart \
            lib/product/chat_control_plane_studio_actions.dart \
            lib/product/chat_control_plane_studio_view.dart \
            test/product/adaptive_decomposition_test.dart \
            test/product/chat_control_plane_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(chat): apply canonical Dart formatting'
          git push origin HEAD:tmp/chat-format
