name: owner-single-click-cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cleanup:
    name: owner-single-click-cleanup
    if: >-
      github.event.pull_request.head.ref == 'hotfix/owner-mode-single-click-provisioning' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Restore canonical workflow and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/branch-hygiene.yml
          git rm -f tool/owner_single_click_transport_fix.py
          python tool/p1a_refresh_source_manifest.py .
          git add .github/workflows/branch-hygiene.yml SOURCE_MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(owner): strip single-click qualifier carrier'
          git push origin HEAD:hotfix/owner-mode-single-click-provisioning
