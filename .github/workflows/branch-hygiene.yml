name: owner-single-click-product-smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: owner-single-click-product-smoke-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  product-current-account-linux:
    name: product-current-account-linux
    if: >-
      github.event.pull_request.head.ref == 'hotfix/owner-mode-single-click-provisioning' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false
      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.toolchains.outputs.flutter }}
          channel: stable
          cache: true
      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev build-essential
          python tool/p1a_bootstrap_hosted_cmake.py --project .
      - name: Apply product transport, authority chain and relocatable bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tool/owner_single_click_transport_fix.py \
            tool/owner_single_click_transport_repair.py \
            tool/owner_single_click_chain_fix.py \
            tool/owner_single_click_chain_repair.py \
            tool/owner_single_click_bundle_fix.py \
            tool/owner_single_click_relocatable_fix.py
          python tool/owner_single_click_transport_repair.py
          python tool/owner_single_click_transport_fix.py
          python tool/owner_single_click_chain_repair.py
          python tool/owner_single_click_chain_fix.py
          python tool/owner_single_click_bundle_fix.py
          python tool/owner_single_click_relocatable_fix.py
          node --check automation_host/src/authenticated-ipc.mjs
          node --check automation_host/src/owner-risk-launcher.mjs
          node --check tool/configure-owner-risk-runtime.mjs
          python -m py_compile tool/v70_stage_runtime.py tool/v70_package_platform.py
          dart format \
            lib/product/p2_bundled_current_account_runtime.dart \
            lib/product/p2_owner_risk_authority.dart \
            lib/product/p2_automation_host.dart \
            lib/product/p2_automation_host_process_client.dart \
            lib/product/p2_runtime_resource_resolver.dart \
            lib/product/p2_product_runtime_bootstrap.dart \
            test/product/p2_owner_risk_runtime_smoke_test.dart \
            test/product/p2_single_click_owner_mode_test.dart
      - name: Resolve dependencies and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          npm ci --prefix automation_host --ignore-scripts=false --no-audit --no-fund
          npm test --prefix automation_host
          python tool/p2_source_inventory_test.py --project .
          python tool/p2_runtime_resource_contract_test.py
          flutter test --concurrency=1 \
            test/product/p2_single_click_owner_mode_test.dart \
            test/product/p2_owner_risk_contract_test.dart \
            test/product/p2_qa_preview_gate_test.dart \
            test/product/p2_effect_boundary_test.dart
          flutter analyze --fatal-warnings --fatal-infos
      - name: Build Linux P1A and P2 native helpers
        shell: bash
        run: |
          set -euo pipefail
          cmake -S authority_service/native/linux -B .p1a-build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-linux --parallel 2
          cmake -S authority_service/connector/linux -B .p1a-connector-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-linux --parallel 2
          cmake -S authority_service/worker_launcher/linux -B .p1a-worker-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-linux --parallel 2
          cmake -S automation_host/native/posix -B .p2-native-posix -DCMAKE_BUILD_TYPE=Release
          cmake --build .p2-native-posix --parallel 2
      - name: Stage relocatable product current-account runtime
        shell: bash
        env:
          KRISTIN_V70_P2_PACKAGE_SHA256: 7b0d77d8956f05ff907ca7463b0d787dcebf93a60426aab105be2b610e6072b0
        run: |
          set -euo pipefail
          python tool/v70_stage_runtime.py \
            --project . \
            --platform linux \
            --output .v70-stage \
            --source-commit "${{ github.event.pull_request.head.sha }}" \
            --source-tree "$(git rev-parse HEAD^{tree})" \
            --p2-package-sha256 "$KRISTIN_V70_P2_PACKAGE_SHA256" \
            --configurator tool/configure-owner-risk-runtime.mjs \
            --mode product-current-account \
            --github-env "$GITHUB_ENV"
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.v70-stage/runtime')
          manifest=json.loads((root/'runtime-manifest.v3.json').read_text())
          env=json.loads((root/'provisioning/environment.v1.json').read_text())['environment']
          policy=json.loads((root/'provisioning/worker-policy.v2.json').read_text())
          assert manifest['productCurrentAccount'] is True
          assert manifest['ownerRiskQa'] is False
          assert env['KRISTIN_CURRENT_ACCOUNT_OWNER_PRODUCT']=='1'
          assert 'KRISTIN_OWNER_RISK_QA' not in env
          assert 'KRISTIN_P2_E2E_ROOT' not in env
          for key in ('nodeExecutable','hostScript','workingDirectory','launcherPath'):
            assert not pathlib.PurePath(policy[key]).is_absolute(), (key, policy[key])
          print('RELOCATABLE_PRODUCT_STAGE_OK')
          PY
      - name: Prove packaged runtime self-relocates without mutating digest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bundle-app .bundle-data
          mkdir -p .bundle-app/runtime/p2/current .bundle-data
          cp -a .v70-stage/runtime/. .bundle-app/runtime/p2/current/
          touch .bundle-app/kristin
          cat > test/_p2_bundle_relocation_smoke_test.dart <<'DART'
          import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:kristin_local_agent/product/p2_bundled_current_account_runtime.dart';
          import 'package:kristin_local_agent/product/p2_runtime_resource_resolver.dart';
          void main() {
            test('bundled product runtime relocates and resolves without QA mode', () async {
              final appData = Directory('.bundle-data').absolute;
              final executable = File('.bundle-app/kristin').absolute.path;
              final sourceManifest = await File('.bundle-app/runtime/p2/current/runtime-manifest.v3.json').readAsBytes();
              final prepared = await P2BundledCurrentAccountRuntime.prepareIfPresent(
                applicationDataRoot: appData,
                executablePath: executable,
              );
              expect(prepared, isTrue);
              final targetManifest = await File('${appData.path}/runtime/p2/current/runtime-manifest.v3.json').readAsBytes();
              expect(targetManifest, sourceManifest);
              final resources = await P2ApplicationOwnedRuntimeResourceResolver(
                applicationDataRoot: appData,
                executablePath: executable,
              ).resolve();
              expect(resources.provisionedEnvironment['KRISTIN_CURRENT_ACCOUNT_OWNER_PRODUCT'], '1');
              expect(resources.provisionedEnvironment.containsKey('KRISTIN_OWNER_RISK_QA'), isFalse);
            });
          }
          DART
          flutter test test/_p2_bundle_relocation_smoke_test.dart
          rm test/_p2_bundle_relocation_smoke_test.dart
      - name: Execute product-mode host effects without QA Dart define
        shell: bash
        run: |
          set -euo pipefail
          test "${KRISTIN_CURRENT_ACCOUNT_OWNER_PRODUCT:-}" = '1'
          test -z "${KRISTIN_OWNER_RISK_QA:-}"
          flutter test test/product/p2_owner_risk_runtime_smoke_test.dart
      - name: Build and package normal Linux release
        shell: bash
        run: |
          set -euo pipefail
          flutter build linux --release --no-pub
          python tool/v70_package_platform.py \
            --project . \
            --platform linux \
            --runtime-stage .v70-stage \
            --output-dir .v70-dist \
            --source-commit "${{ github.event.pull_request.head.sha }}" \
            --source-tree "$(git rev-parse HEAD^{tree})" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --product-current-account
          python - <<'PY'
          import json, pathlib
          meta=json.loads(pathlib.Path('.v70-dist/payload-linux/OWNER_RUNTIME_METADATA.json').read_text())
          assert meta['functionalOwnerModeEligible'] is True
          assert meta['secureIsolationCertified'] is False
          assert meta['qaShipmentEligible'] is False
          embedded=pathlib.Path('.v70-dist/payload-linux/app/runtime/p2/current/runtime-manifest.v3.json')
          assert embedded.is_file()
          archives=list(pathlib.Path('.v70-dist').glob('KRISTIN_OWNER_MODE_LINUX_*.zip'))
          assert len(archives)==1
          print('PRODUCT_OWNER_PACKAGE_OK', archives[0])
          PY
      - name: Publish exact qualified single-click runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/branch-hygiene.yml
          git rm -f \
            tool/owner_single_click_transport_fix.py \
            tool/owner_single_click_transport_repair.py \
            tool/owner_single_click_chain_fix.py \
            tool/owner_single_click_chain_repair.py \
            tool/owner_single_click_bundle_fix.py \
            tool/owner_single_click_relocatable_fix.py
          python tool/p1a_refresh_source_manifest.py .
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(owner): make bundled current-account runtime relocatable'
          git push origin HEAD:hotfix/owner-mode-single-click-provisioning
