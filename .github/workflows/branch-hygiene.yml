name: owner-single-click-source-contract-fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fix:
    name: owner-single-click-source-contract-fix
    if: >-
      github.event.pull_request.head.ref == 'hotfix/owner-mode-single-click-provisioning' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Add bundled Owner runtime to exact library inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('test/product/source_contract_test.dart')
          s=p.read_text(encoding='utf-8')
          anchor="        'lib/product/p2_automation_host_process_client.dart',\n"
          addition="        'lib/product/p2_bundled_current_account_runtime.dart',\n"
          if addition not in s:
              if s.count(anchor) != 1:
                  raise SystemExit('source contract anchor mismatch')
              s=s.replace(anchor, anchor+addition, 1)
              p.write_text(s, encoding='utf-8', newline='\n')
          PY
          dart format test/product/source_contract_test.dart
          flutter pub get
          flutter test test/product/source_contract_test.dart
          git diff --check
      - name: Restore canonical workflow and refresh source manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/branch-hygiene.yml
          python tool/p1a_refresh_source_manifest.py .
          git add test/product/source_contract_test.dart SOURCE_MANIFEST.sha256 .github/workflows/branch-hygiene.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(owner): register bundled runtime in library inventory'
          git push origin HEAD:hotfix/owner-mode-single-click-provisioning
