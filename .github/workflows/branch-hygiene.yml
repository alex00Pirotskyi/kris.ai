name: repository-branch-hygiene

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/branch-hygiene.yml
      - config/branch_hygiene.json
      - tool/branch_hygiene.py
      - docs/progress/2026-08-05-branch-hygiene-cleanup.md
      - SOURCE_MANIFEST.sha256
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-hygiene.yml
      - config/branch_hygiene.json
      - tool/branch_hygiene.py
      - docs/progress/2026-08-05-branch-hygiene-cleanup.md
      - SOURCE_MANIFEST.sha256

permissions:
  contents: read

concurrency:
  group: repository-branch-hygiene-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: branch-hygiene-validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Compile and self-test branch hygiene
        run: |
          python -m py_compile tool/branch_hygiene.py
          python tool/branch_hygiene.py --self-test
      - name: Validate exact remote cleanup plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tool/branch_hygiene.py
          --config config/branch_hygiene.json
          --repository "$GITHUB_REPOSITORY"
          --receipt "$RUNNER_TEMP/branch-hygiene-plan.json"
      - name: Upload reviewed cleanup plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-hygiene-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/branch-hygiene-plan.json
          if-no-files-found: error
          retention-days: 30

  refresh-source-manifest:
    name: branch-hygiene-source-manifest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/repository-branch-hygiene-20260805' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Regenerate governed source inventory
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          git diff --check
          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          if [ "${#paths[@]}" -eq 0 ]; then
            echo 'SOURCE_MANIFEST_CURRENT=true'
            exit 0
          fi
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = 'SOURCE_MANIFEST.sha256'
      - name: Publish exact source manifest to cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- SOURCE_MANIFEST.sha256; then
            echo 'SOURCE_MANIFEST_PUSH_REQUIRED=false'
            exit 0
          fi
          git config user.name 'Kristin Branch Hygiene'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256
          git diff --cached --check
          git commit -m 'chore(repo): refresh source manifest for branch hygiene'
          git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"

  execute:
    name: branch-hygiene-execute
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Delete only exact reviewed redundant branches
        id: cleanup
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tool/branch_hygiene.py \
            --config config/branch_hygiene.json \
            --repository "$GITHUB_REPOSITORY" \
            --execute \
            --receipt "$RUNNER_TEMP/branch-hygiene-receipt.json"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload branch deletion receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-hygiene-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/branch-hygiene-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce complete cleanup
        if: always()
        shell: bash
        run: test "${{ steps.cleanup.outputs.rc }}" -eq 0

  p1a-runtime-ux-finalize:
    name: p1a-runtime-ux-finalize
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'sync/p1-p8-main-6237-20260823' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: config/p2.python-version
          check-latest: false
      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.toolchains.outputs.flutter }}
          channel: stable
          cache: true
      - name: Apply hardened P1A runtime corrections
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tool/p1a_runtime_ux_patch_dart_v2.py tool/p1a_runtime_ux_patch_native_v2.py
          python tool/p1a_runtime_ux_patch_dart_v2.py
          python tool/p1a_runtime_ux_patch_native_v2.py
      - name: Format governed Dart sources
        shell: bash
        run: |
          dart format \
            lib/product/p1_authority_service_contract_v1.dart \
            lib/product/p2_owner_mode.dart \
            lib/product/p2_owner_workspace.dart \
            lib/product/p2_p1_authority_adapter.dart \
            lib/product/p2_product_runtime_integration.dart \
            lib/product/p2_product_runtime_bootstrap.dart \
            test/product/p2_owner_workspace_test.dart
      - name: Native P1A core regression
        shell: bash
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iauthority_service/native/common \
            authority_service/native/common/authority_core_regression_test.cpp \
            -o /tmp/p1a-authority-core-regression
          /tmp/p1a-authority-core-regression
      - name: P1A and P2 contracts
        shell: bash
        run: |
          python tool/p1a_activation_contract_test.py
          python tool/p1a_finalizer_contract_test.py
          python tool/p2_shared_p1_authority_contract_test.py --project . --owner-risk-qa
      - name: Flutter qualification
        shell: bash
        run: |
          flutter pub get
          flutter test test/product/p2_owner_workspace_test.dart test/product/p1_authority_service_product_runtime_v1_test.dart
          flutter analyze --fatal-infos --fatal-warnings
      - name: Refresh governed source manifest
        shell: bash
        run: |
          git add -A
          python tool/p1a_refresh_source_manifest.py .
          python - <<'PY'
          from pathlib import Path
          p=Path('SOURCE_MANIFEST.sha256')
          excluded={
            '.github/workflows/p1a-runtime-ux-finalize.yml',
            'tool/p1a_runtime_ux_patch_dart.py',
            'tool/p1a_runtime_ux_patch_native.py',
            'tool/p1a_runtime_ux_patch_dart_v2.py',
            'tool/p1a_runtime_ux_patch_native_v2.py',
            'tool/p1a_runtime_ux_trigger.txt',
            'tool/p1a_runtime_ux_trigger_v2.txt',
            'tool/p1a_runtime_ux_trigger_v3.txt',
          }
          rows=[]
          for line in p.read_text(encoding='utf-8').splitlines():
            path=line.split('  ',1)[1] if '  ' in line else ''
            if path not in excluded:
              rows.append(line)
          p.write_text('\n'.join(rows)+'\n',encoding='utf-8',newline='\n')
          PY
          git add -A
          git diff --cached --check
      - name: Publish correction to carrier
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(p1a): decouple secure runtime from certification and bound owner approvals'
          git push origin HEAD:sync/p1-p8-main-6237-20260823
