name: owner-product-triplatform-qualifier

on:
  push:
    branches:
      - ci/owner-product-triplatform-ab7e8c18
  pull_request:
    branches:
      - hotfix/owner-mode-single-click-provisioning
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-product-triplatform-ab7e8c18-${{ github.event_name }}
  cancel-in-progress: false

env:
  OWNER_CANDIDATE_SHA: ab7e8c18bb37c69d20e14ea8ac4694a3b7b1af8e
  KRISTIN_V70_P2_PACKAGE_SHA256: 7b0d77d8956f05ff907ca7463b0d787dcebf93a60426aab105be2b610e6072b0

jobs:
  platform:
    name: owner-product-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OWNER_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false
      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.toolchains.outputs.flutter }}
          channel: stable
          cache: true
      - name: Install Linux desktop prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev build-essential
      - name: Install hash-locked hosted CMake
        shell: bash
        run: python tool/p1a_bootstrap_hosted_cmake.py --project .
      - name: Resolve exact product dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          npm ci --prefix automation_host --ignore-scripts=false --no-audit --no-fund
      - name: Build Linux authority and host helpers
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S authority_service/native/linux -B .p1a-build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-linux --parallel 2
          cmake -S authority_service/connector/linux -B .p1a-connector-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-linux --parallel 2
          cmake -S authority_service/worker_launcher/linux -B .p1a-worker-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-linux --parallel 2
          cmake -S automation_host/native/posix -B .p2-native-posix -DCMAKE_BUILD_TYPE=Release
          cmake --build .p2-native-posix --parallel 2
      - name: Build macOS authority and host helpers
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S authority_service/native/macos -B .p1a-build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-macos --parallel 2
          cmake -S authority_service/connector/macos -B .p1a-connector-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-macos --parallel 2
          cmake -S authority_service/worker_launcher/macos -B .p1a-worker-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-macos --parallel 2
          cmake -S automation_host/native/posix -B .p2-native-posix -DCMAKE_BUILD_TYPE=Release
          cmake --build .p2-native-posix --parallel 2
      - name: Build Windows authority and host helpers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $installation = ([string](& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -Last 1)).Trim()
          if ([string]::IsNullOrWhiteSpace($installation)) { throw 'Visual Studio C++ workload not found' }
          . (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake -G Ninja -S authority_service/native/windows -B .p1a-build-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-build-windows --parallel 2
          cmake -G Ninja -S authority_service/connector/windows -B .p1a-connector-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-connector-windows --parallel 2
          cmake -G Ninja -S authority_service/worker_launcher/windows -B .p1a-worker-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p1a-worker-windows --parallel 2
          cmake -G Ninja -S automation_host/native/windows -B .p2-native-windows -DCMAKE_BUILD_TYPE=Release
          cmake --build .p2-native-windows --parallel 2
      - name: Stage exact product current-account runtime
        shell: bash
        run: |
          set -euo pipefail
          python tool/v70_stage_runtime.py \
            --project . \
            --platform "${{ matrix.platform }}" \
            --output .v70-stage \
            --source-commit "$OWNER_CANDIDATE_SHA" \
            --source-tree "$(git rev-parse HEAD^{tree})" \
            --p2-package-sha256 "$KRISTIN_V70_P2_PACKAGE_SHA256" \
            --configurator tool/configure-owner-risk-runtime.mjs \
            --mode product-current-account \
            --github-env "$GITHUB_ENV"
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('.v70-stage/runtime')
          manifest = json.loads((root / 'runtime-manifest.v3.json').read_text())
          env = json.loads((root / 'provisioning/environment.v1.json').read_text())['environment']
          policy = json.loads((root / 'provisioning/worker-policy.v2.json').read_text())
          assert manifest['productCurrentAccount'] is True
          assert manifest['ownerRiskQa'] is False
          assert env['KRISTIN_CURRENT_ACCOUNT_OWNER_PRODUCT'] == '1'
          assert 'KRISTIN_OWNER_RISK_QA' not in env
          assert 'KRISTIN_P2_E2E_ROOT' not in env
          for key in ('nodeExecutable', 'hostScript', 'workingDirectory', 'launcherPath'):
              assert not pathlib.PurePath(policy[key]).is_absolute(), (key, policy[key])
          print('PRODUCT_STAGE_OK')
          PY
      - name: Prove immutable relocation on current OS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, shutil
          for name in ('.bundle-app', '.bundle-data'):
              path = pathlib.Path(name)
              if path.exists(): shutil.rmtree(path)
          target = pathlib.Path('.bundle-app/runtime/p2/current')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree('.v70-stage/runtime', target)
          pathlib.Path('.bundle-data').mkdir()
          pathlib.Path('.bundle-app/kristin.exe').touch()
          pathlib.Path('.bundle-app/kristin').touch()
          PY
          cat > test/_p2_triplatform_relocation_test.dart <<'DART'
          import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:kristin_local_agent/product/p2_bundled_current_account_runtime.dart';
          import 'package:kristin_local_agent/product/p2_runtime_resource_resolver.dart';
          void main() {
            test('product runtime relocates immutably on current OS', () async {
              final sep = Platform.pathSeparator;
              final appData = Directory('.bundle-data').absolute;
              final appRoot = Directory('.bundle-app').absolute;
              final executable = File('${appRoot.path}$sep${Platform.isWindows ? 'kristin.exe' : 'kristin'}').path;
              final source = File('${appRoot.path}${sep}runtime${sep}p2${sep}current${sep}runtime-manifest.v3.json');
              final sourceBytes = await source.readAsBytes();
              expect(await P2BundledCurrentAccountRuntime.prepareIfPresent(
                applicationDataRoot: appData,
                executablePath: executable,
              ), isTrue);
              final target = File('${appData.path}${sep}runtime${sep}p2${sep}current${sep}runtime-manifest.v3.json');
              expect(await target.readAsBytes(), sourceBytes);
              final resources = await P2ApplicationOwnedRuntimeResourceResolver(
                applicationDataRoot: appData,
                executablePath: executable,
              ).resolve();
              expect(resources.provisionedEnvironment['KRISTIN_CURRENT_ACCOUNT_OWNER_PRODUCT'], '1');
              expect(resources.provisionedEnvironment.containsKey('KRISTIN_OWNER_RISK_QA'), isFalse);
            });
          }
          DART
          flutter test test/_p2_triplatform_relocation_test.dart
          rm test/_p2_triplatform_relocation_test.dart
      - name: Execute real product-mode host effects without QA define
        shell: bash
        run: |
          set -euo pipefail
          test "${KRISTIN_CURRENT_ACCOUNT_OWNER_PRODUCT:-}" = '1'
          test -z "${KRISTIN_OWNER_RISK_QA:-}"
          flutter test test/product/p2_owner_risk_runtime_smoke_test.dart
      - name: Build native app and product Owner package
        shell: bash
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux) flutter build linux --release --no-pub ;;
            windows) flutter build windows --release --no-pub ;;
            macos) flutter build macos --release --no-pub ;;
          esac
          python tool/v70_package_platform.py \
            --project . \
            --platform "${{ matrix.platform }}" \
            --runtime-stage .v70-stage \
            --output-dir .v70-dist \
            --source-commit "$OWNER_CANDIDATE_SHA" \
            --source-tree "$(git rev-parse HEAD^{tree})" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --product-current-account
          python - <<'PY'
          import json, pathlib, os
          platform = os.environ['MATRIX_PLATFORM']
          payload = pathlib.Path('.v70-dist') / f'payload-{platform}'
          meta = json.loads((payload / 'OWNER_RUNTIME_METADATA.json').read_text())
          assert meta['functionalOwnerModeEligible'] is True
          assert meta['secureIsolationCertified'] is False
          assert meta['qaShipmentEligible'] is False
          manifests = list((payload / 'app').rglob('runtime-manifest.v3.json'))
          assert len(manifests) >= 1, manifests
          archives = list(pathlib.Path('.v70-dist').glob(f'KRISTIN_OWNER_MODE_{platform.upper()}_*.zip'))
          assert len(archives) == 1, archives
          print('PRODUCT_PACKAGE_OK', platform, archives[0])
          PY

  tri-platform-gate:
    name: owner-product-tri-platform-gate
    needs: platform
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Exact durable Owner Mode product runtime passed Windows, macOS and Linux.'
