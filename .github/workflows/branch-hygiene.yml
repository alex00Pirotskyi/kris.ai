name: repository-branch-hygiene

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: owner-single-click-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owner-single-click-publish:
    name: owner-single-click-publish
    if: >-
      github.event.pull_request.head.ref == 'hotfix/owner-mode-single-click-provisioning' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Reproduce qualified source tree
        shell: bash
        run: |
          set -euo pipefail
          python tool/owner_single_click_patch_repair.py
          python tool/owner_single_click_patch.py
          dart format \
            lib/product/p2_bundled_current_account_runtime.dart \
            lib/product/p2_owner_risk_authority.dart \
            lib/product/p2_runtime_resource_resolver.dart \
            lib/product/p2_product_runtime_bootstrap.dart \
            lib/product/p2_product_runtime_integration.dart \
            lib/product/product_runtime.dart \
            test/product/p2_owner_risk_contract_test.dart \
            test/product/p2_owner_risk_runtime_smoke_test.dart \
            test/product/p2_single_click_owner_mode_test.dart
      - name: Strip temporary machinery and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/branch-hygiene.yml
          git rm -f tool/owner_single_click_patch.py tool/owner_single_click_patch_repair.py
          python tool/p1a_refresh_source_manifest.py .
          git add -A
          git diff --cached --check
      - name: Publish durable implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(owner): make Owner Mode usable without separate helper install'
          git push origin HEAD:hotfix/owner-mode-single-click-provisioning
