name: Wave A report-directory diagnostic

on:
  push:
    branches:
      - perf/cache-sqlite-foundation

permissions:
  contents: read

jobs:
  trace-report-directory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Trace the first creator of root reports directory
        shell: bash
        run: |
          set -uo pipefail
          rm -rf reports
          : > /tmp/flutter-test.log
          : > /tmp/report-directory-evidence.log

          (
            while true; do
              if [[ -d reports ]]; then
                {
                  echo '=== REPORT DIRECTORY FIRST OBSERVED ==='
                  date --iso-8601=ns
                  echo "repository=$PWD"
                  echo '=== DIRECTORY CONTENTS ==='
                  find reports -maxdepth 8 -printf '%TY-%Tm-%TdT%TH:%TM:%TS %y %p %s bytes\n' 2>&1 || true
                  echo '=== OPEN FILE DESCRIPTORS REFERENCING REPORTS ==='
                  for fd in /proc/[0-9]*/fd/*; do
                    target="$(readlink "$fd" 2>/dev/null || true)"
                    case "$target" in
                      "$PWD/reports"|"$PWD/reports/"*) echo "$fd -> $target" ;;
                    esac
                  done
                  echo '=== PROCESS SNAPSHOT ==='
                  ps -ef --forest || true
                  echo '=== ACTIVE TEST LOG TAIL ==='
                  tail -n 300 /tmp/flutter-test.log || true
                } | tee /tmp/report-directory-evidence.log
                exit 0
              fi
              sleep 0.05
            done
          ) &
          watcher_pid=$!

          set +e
          stdbuf -oL -eL flutter test --concurrency=1 --reporter expanded 2>&1 | tee /tmp/flutter-test.log
          test_status=${PIPESTATUS[0]}
          set -e

          sleep 1
          if kill -0 "$watcher_pid" 2>/dev/null; then
            kill "$watcher_pid" 2>/dev/null || true
            wait "$watcher_pid" 2>/dev/null || true
          else
            wait "$watcher_pid" 2>/dev/null || true
          fi

          echo '=== FINAL DIAGNOSTIC EVIDENCE ==='
          if [[ -s /tmp/report-directory-evidence.log ]]; then
            cat /tmp/report-directory-evidence.log
          else
            echo 'Root reports directory was not observed during the serial full Flutter suite.'
          fi
          echo '=== FINAL ROOT REPORTS STATE ==='
          if [[ -d reports ]]; then
            find reports -maxdepth 8 -printf '%TY-%Tm-%TdT%TH:%TM:%TS %y %p %s bytes\n' 2>&1 || true
          else
            echo 'reports directory absent'
          fi
          echo "flutter_test_exit=$test_status"
          exit "$test_status"
