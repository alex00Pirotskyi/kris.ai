name: Wave A apply and validate

on:
  push:
    branches:
      - perf/cache-sqlite-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve Dart and Flutter dependencies
        run: flutter pub get

      - name: Apply and validate Wave A
        run: python tool/wave_a_bootstrap.py . --validate

      - name: Finalize governed source tree and push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tool/wave_a_payload
          rm -f tool/wave_a_bootstrap.py
          rm -f .github/workflows/wave-a-apply.yml
          python tool/p2_refresh_source_manifest.py .
          python tool/dart_format_scope.py --check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'perf: add Wave A observability and cache foundation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
