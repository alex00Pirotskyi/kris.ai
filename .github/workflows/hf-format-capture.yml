name: hf-format-capture

on:
  push:
    branches:
      - hotfix/runner-capability-followup
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/runner-capability-followup
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Capture exact formatter output
        shell: bash
        run: |
          dart format test/product/process_launch_test.dart
          printf '%s\n' '---BEGIN-FORMATTED-FILE---'
          cat test/product/process_launch_test.dart
          printf '%s\n' '---END-FORMATTED-FILE---'
