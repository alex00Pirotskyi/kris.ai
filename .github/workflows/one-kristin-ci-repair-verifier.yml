name: one-kristin-ci-repair-verifier

on:
  push:
    branches:
      - automation/one-kristin-ci-repair-20260829

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Resolve package context
        run: flutter pub get
      - name: Verify format
        run: dart format --output=none --set-exit-if-changed test/product/runner_retry_budget_integration_test.dart
      - name: Analyze
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos
      - name: Verify retry budget contract
        run: flutter test --no-pub --concurrency=1 --reporter expanded test/product/runner_retry_budget_integration_test.dart
      - name: Verify deferred takeover contract
        run: flutter test --no-pub --concurrency=1 --reporter expanded test/product/runner_deferred_takeover_contract_test.dart
      - name: Verify convergence policy
        run: flutter test --no-pub --concurrency=1 --reporter expanded test/product/runner_convergence_policy_test.dart
      - name: Finalize clean source tree
        shell: bash
        run: |
          git rm .github/workflows/one-kristin-ci-repair-verifier.yml
          python tool/p1a_refresh_source_manifest.py .
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE_MANIFEST.sha256 test/product/runner_retry_budget_integration_test.dart
          git commit -m "test: finalize typed parser retry contract repair"
          git push origin HEAD:automation/one-kristin-ci-repair-20260829
