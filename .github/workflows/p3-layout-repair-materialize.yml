name: P3 Fixture Layout Repair Materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p3-layout-repair-materialize.yml'
      - '.p3-layout-repair/**'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/p3-phase-completion'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p3-phase-completion
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Move P3 fixtures into governed product-test scope
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python .p3-layout-repair/materialize.py
          dart format test/product/browser/browser_security_suite_test.dart
          python tool/validate_release.py --skip-tests
          flutter test --no-pub test/product/browser/browser_security_suite_test.dart --reporter expanded
          rm -f .github/workflows/p3-layout-repair-materialize.yml
          rm -rf .p3-layout-repair
          python tool/p2_refresh_source_manifest.py .
          flutter test --no-pub test/product/source_contract_test.dart --reporter expanded
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'test(p3): move browser fixtures into governed test scope'
          git push origin HEAD:agent/p3-phase-completion
