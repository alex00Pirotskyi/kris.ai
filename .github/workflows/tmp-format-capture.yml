name: Temporary Dart Format Capture

on:
  push:
    branches:
      - feat/one-kristin-convergence

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Format convergence Dart files
        run: |
          dart format \
            lib/product/agent_protocol_v3.dart \
            lib/product/kristin_conversation_session.dart \
            test/product/agent_protocol_v3_execution_step_test.dart \
            test/product/kristin_conversation_session_test.dart
          git diff --binary > format.patch

      - name: Upload formatter patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dart-format-patch
          path: format.patch
          if-no-files-found: error
