name: Temporary Dart Format Capture

on:
  push:
    branches:
      - feat/one-kristin-convergence

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve project dependencies
        run: flutter pub get
      - name: Record formatter toolchain
        run: |
          flutter --version
          dart --version
      - name: Apply repository Dart formatting
        run: python tool/dart_format_scope.py --write
      - name: Capture canonical files
        shell: bash
        run: |
          git diff --binary > format.patch
          mkdir -p canonical/lib/product
          cp lib/product/agent_protocol_v3.dart canonical/lib/product/agent_protocol_v3.dart
          cp lib/product/kristin_conversation_session.dart canonical/lib/product/kristin_conversation_session.dart
      - name: Upload canonical formatter output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-dart-format
          path: |
            format.patch
            canonical/
          if-no-files-found: error
          retention-days: 1
