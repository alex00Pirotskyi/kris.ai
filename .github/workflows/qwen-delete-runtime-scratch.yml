name: Qwen Delete Runtime CAS Scratch

on:
  push:
    branches:
      - 'automation/qwen-phone-control-materializer'
    paths:
      - '.github/workflows/qwen-delete-runtime-scratch.yml'

permissions:
  contents: write

concurrency:
  group: qwen-runtime-scratch-cleanup
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete exact unconsumed scratch ref
        shell: bash
        run: |
          set -euo pipefail
          branch='automation/runtime-rebind-scratch-657'
          expected='ef990f2781c8772afe4627cae8c4bc323ba70c07'
          actual="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [[ -z "$actual" ]]; then
            echo 'QWEN_RUNTIME_SCRATCH already absent'
            exit 0
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "scratch ref moved unexpectedly: $actual != $expected" >&2
            exit 1
          fi
          if git ls-remote origin 'refs/pull/*/head' | grep -Fq "$actual"; then
            echo 'ref SHA is still exposed as a PR head; refusing deletion' >&2
            exit 1
          fi
          git push origin ":refs/heads/$branch"
          [[ -z "$(git ls-remote --heads origin "refs/heads/$branch")" ]]
          echo "QWEN_RUNTIME_SCRATCH_DELETED $branch"
