name: Qwen v53 Self Finalizer

on:
  push:
    branches:
      - 'agent/qwen-phone-control'
    paths:
      - '.github/workflows/qwen-v53-self-finalize.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: qwen-v53-self-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Capture exact publication base
        shell: bash
        run: |
          set -euo pipefail
          echo "CANDIDATE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Execute v53/controller/durable contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_v53_recovery.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_test.py \
            tool/kris_qwen_control_compat_test.py
          python3 tool/kris_qwen_control_test.py
          KRIS_QWEN_AUTO_UPDATE=0 python3 tool/kris_qwen_control_compat_test.py
          python3 tool/kris_qwen_worker_v53.py version | tee "$RUNNER_TEMP/v53.json"
          python3 - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'v53.json').read_text(encoding='utf-8'))
          if value.get('scriptVersion') != '5.3.0':
              raise SystemExit(f'wrong v53 version payload: {value}')
          PY
          [[ "$(python3 tool/kris_qwen_control.py.compat.py --version)" == '2.2.0' ]]
          bash -n tool/install_kris_qwen_control_systemd.sh
          python3 - <<'PY'
          from pathlib import Path
          merged = '\n'.join(
              Path(path).read_text(encoding='utf-8')
              for path in (
                  'tool/kris_qwen_worker_v53.py',
                  'tool/kris_qwen_v53_policy.py',
                  'tool/kris_qwen_v53_recovery.py',
                  'tool/kris_qwen_control.py.compat.py',
                  'tool/install_kris_qwen_control_systemd.sh',
                  'run_my_server.py',
              )
          )
          required = (
              'RED_ALERT_FRONTIER',
              'RED_ALERT_HARD_ERROR',
              'RED_ALERT_MODEL_SERVER',
              'stack stays alive',
              'CONTINUOUS_HELPER_CI_REPAIR_MARKER',
              'CONTINUOUS_CANONICAL_CI_REPAIR_MARKER',
              'WIP_SNAPSHOT_FROM_MISSION_V15',
              'UPDATE_BLOCKED_CANDIDATE_INVALID',
              '_fast_forward_validated',
              'controllerRuntimeSha256',
              'KRIS_QWEN_CONTROLLER_SELF_RESTART',
              'Restart=always',
              'StartLimitIntervalSec=0',
              'kris_qwen_v53_recovery.py',
              '--phone',
          )
          missing = [marker for marker in required if marker not in merged]
          if missing:
              raise SystemExit(f'missing final always-on contracts: {missing}')
          PY

      - name: Repair proven hygiene drift and final operator truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cfg = Path('config/branch_hygiene.json')
          text = cfg.read_text(encoding='utf-8')
          blocks = (
              ('ci/direct-pr14-repair-trigger', '''    {\n      "name": "ci/direct-pr14-repair-trigger",\n      "reason": "Historical repair-status lineage retained until PR14 cleanup is fully closed."\n    },\n'''),
              ('integration/p2-owner-risk-v71r12', '''    {\n      "name": "integration/p2-owner-risk-v71r12",\n      "reason": "Unique P1/P2 owner-risk evidence lineage pending current-schema migration."\n    },\n'''),
          )
          for name, block in blocks:
              if text.count(block) > 1:
                  raise SystemExit(f'duplicated stale keep block: {name}')
              if block in text:
                  text = text.replace(block, '', 1)
              elif f'"name": "{name}"' in text:
                  raise SystemExit(f'unexpected stale keep representation: {name}')
          cfg.write_text(text, encoding='utf-8', newline='\n')

          docs = Path('docs/KRIS_QWEN_SERVER_CONTROL.md')
          doc = docs.read_text(encoding='utf-8')
          marker = '## Qwen 5.3 final always-on contract'
          if marker not in doc:
              doc += '''\n\n## Qwen 5.3 final always-on contract\n\nThe executed phone worker is `tool/kris_qwen_worker_v53.py` (**5.3.0**) and the executed controller is `tool/kris_qwen_control.py.compat.py` (**2.2.0**). Normal idle is not a steady state. Successful Product Work Orders chain immediately; a genuinely empty safe frontier is `RED_ALERT_FRONTIER`; repeated hard Work Order failures become `RED_ALERT_HARD_ERROR` without terminating the persistent stack; and managed `llama-server` death/unreachability is recovered through `RED_ALERT_MODEL_SERVER`. Persistent fleet/control-plane retry backoff is capped at 30 seconds.\n\nContinuous Product work uses canonical Mission WIP/backpressure. Pending hosted helper CI can coexist with additional Product hardening up to bounded WIP. Red continuous helper CI never integrates the failed helper: its immutable exact head becomes evidence for a targeted `CI_REPAIR` on current canonical Product bytes. Red exact canonical Product CI likewise creates a targeted canonical-head repair instead of unrelated hardening.\n\nController 2.2 validates candidate worker/controller entries in a detached worktree before drain, refuses dirty/non-fast-forward/invalid candidates while the current worker keeps running, pins updates to the exact probed SHA, and restarts the unchanged worker if a post-drain update aborts. Under durable systemd supervision, controller runtime byte changes trigger a controller-only restart after the new worker is running; systemd `Restart=always` reloads the new controller while `KillMode=process` leaves the worker alive.\n\nFor durable phone control use `sudo ./tool/install_kris_qwen_control_systemd.sh --phone` on a trusted LAN/VPN. The service runs as the invoking GitHub-authenticated user, requires the complete v53 policy/recovery path, enables automatic updates and supervised controller reload, and disables systemd start-rate lockout. `./run_my_server.py` preserves an already-active durable service.\n'''
          docs.write_text(doc, encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Remove this transport before source identity generation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qwen-v53-self-finalize.yml

      - name: Validate live branch-hygiene plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tool/branch_hygiene.py --self-test
          python3 tool/branch_hygiene.py \
            --config config/branch_hygiene.json \
            --repository "$GITHUB_REPOSITORY" \
            --receipt "$RUNNER_TEMP/hygiene.json"
          python3 - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'hygiene.json').read_text(encoding='utf-8'))
          if value.get('status') == 'blocked' or value.get('errors'):
              raise SystemExit(f'branch hygiene remains blocked: {value.get("errors")}')
          print('QWEN_V53_HYGIENE_PASS')
          PY

      - name: Generate source manifest twice and validate exact tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest.first"
          python3 tool/p1a_refresh_source_manifest.py .
          cmp -s "$RUNNER_TEMP/manifest.first" SOURCE_MANIFEST.sha256
          python3 tool/p1a_source_manifest_test.py .
          python3 tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          for path in \
            run_my_server.py \
            tool/install_kris_qwen_control_systemd.sh \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_v53_recovery.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_compat_test.py; do
            grep -F "$path" SOURCE_MANIFEST.sha256
          done
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              '.github/workflows/qwen-v53-self-finalize.yml',
              'SOURCE_MANIFEST.sha256',
              'config/branch_hygiene.json',
              'docs/KRIS_QWEN_SERVER_CONTROL.md',
          }
          if actual != expected:
              raise SystemExit(f'self-finalizer scope mismatch actual={sorted(actual)} expected={sorted(expected)}')
          PY

      - name: Publish only if exact feature base is unchanged
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --heads origin refs/heads/agent/qwen-phone-control | awk '{print $1}')"
          if [[ "$remote" != "$CANDIDATE_BASE" ]]; then
            echo "feature branch moved while validating: base=$CANDIDATE_BASE remote=$remote" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/qwen-v53-self-finalize.yml \
            SOURCE_MANIFEST.sha256 \
            config/branch_hygiene.json \
            docs/KRIS_QWEN_SERVER_CONTROL.md
          git diff --cached --check
          git commit -m 'feat(qwen): finalize always-on v53 execution'
          candidate="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/agent/qwen-phone-control
          git fetch origin '+refs/heads/agent/qwen-phone-control:refs/remotes/origin/agent/qwen-phone-control'
          [[ "$(git rev-parse origin/agent/qwen-phone-control)" == "$candidate" ]]
          echo "QWEN_V53_FINAL_PASS candidate=$candidate"
