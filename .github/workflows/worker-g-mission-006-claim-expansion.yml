name: Worker G MISSION-006 narrow claim expansion

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: worker-g-mission-006-claim-expansion
  cancel-in-progress: false

jobs:
  expand-claim:
    if: >-
      github.event.pull_request.number == 73 &&
      github.event.pull_request.head.ref == 'agent/anarchy-autonomous-worker-missions' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: agent/anarchy-autonomous-worker-missions
      EXPECTED_PARENT: 833c44b4c603e61b6357ea1ef5b26dd38e5e4ef8
      STAGING_HEAD: ${{ github.event.pull_request.head.sha }}
      WORK_EXECUTION_ID: WRK-20260806T191746Z-15c6e8b5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/anarchy-autonomous-worker-missions
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Require exact uncontended staging head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${STAGING_HEAD}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          git fetch origin "${BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${BRANCH})" = "${STAGING_HEAD}"
      - name: Expand only the two unclaimed inventory paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('config/mission_execution.v1.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          claims = [c for c in doc['activeClaims'] if c['mission'] == 'MISSION-006']
          if len(claims) != 1:
              raise SystemExit(f'expected one MISSION-006 claim, found {len(claims)}')
          claim = claims[0]
          if claim['worker'] != 'G' or claim['branch'] != 'agent/g/mission-006-model-routing' or claim['pr'] != 76:
              raise SystemExit(f'unexpected claim identity: {claim!r}')
          additions = [
              'test/product/source_contract_test.dart',
              'tool/validate_release.py',
          ]
          paths = list(claim.get('exclusivePaths', []))
          for item in additions:
              if item not in paths:
                  paths.append(item)
          claim['exclusivePaths'] = sorted(paths)
          claim['current'] = (
              'P6-001 review repair owns the exact global Dart source inventory and '
              'release-validator files required to register lib/product/model/**; '
              'Worker B Test Center authority remains external and review-gated.'
          )
          path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          PY
          python tool/mission_control.py --project . bootstrap
      - name: Append claim-expansion checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path('docs/roadmap/missions/checkpoints/MISSION-006-0004.json')
          if target.exists():
              raise SystemExit('MISSION-006-0004 already exists')
          payload = {
              'schemaVersion': 1,
              'mission': 'MISSION-006',
              'sequence': 4,
              'worker': 'G',
              'branch': 'agent/g/mission-006-model-routing',
              'pullRequest': 76,
              'observedHead': '9799768170f13556d3098a07b40be922377f8deb',
              'observedTree': '2a5def77debba67066e083222bd7ef76af66c1f9',
              'completed': [
                  'Generated execution identity ' + os.environ['WORK_EXECUTION_ID'] + '.',
                  'Re-resolved PR #76 review findings P6-C-001 and P6-C-002.',
                  'Reserved only test/product/source_contract_test.dart and tool/validate_release.py because no other active claim owns them and P6-001 needs exact inventory registration.',
                  'Preserved all Worker B Test Center paths outside Worker G exclusive ownership.',
              ],
              'validation': [
                  'Canonical mission_control bootstrap and validate run after the exact path expansion.',
                  'Exclusive-path collision validation must pass before publication.',
              ],
              'blockers': [
                  'P6-C-001 source repair and deterministic negative tests are not yet published.',
                  'Worker B Test Center changes must be removed from Worker G or consumed from an owner-published authority commit.',
                  'A new exact candidate requires settled CI and fresh independent review.',
              ],
              'nextAction': 'Repair P6-C-001 on Worker G branch, reconcile the latest Worker B ancestry without retaining ungranted authority edits, run exact ownership and CI, then request fresh review; do not merge.',
              'supersededBy': None,
          }
          target.write_text(json.dumps(payload, indent=2, sort_keys=True, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Remove carrier, validate, and refresh manifest twice
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/worker-g-mission-006-claim-expansion.yml
          python tool/mission_control.py --project . validate
          python tool/mission_control.py --project . status | grep -F $'MISSION-006\tCLAIMED\tWorker G\tP6,P18'
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          python tool/mission_control.py --project . validate
          git diff --check
      - name: Publish exact claim expansion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${BRANCH})" = "${STAGING_HEAD}"
          git add -A -- .
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(mission-006): reserve exact P6 inventory paths'
          git push origin "HEAD:${BRANCH}"
