name: P217 bounded validator finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p217-validator-finalize.yml

permissions:
  contents: write

env:
  BASE_MAIN_SHA: d2ea234ea5297fabcf0fa0a5ec3395b98486ed0c
  TARGET_BRANCH: agent/p5-web-studio-runtime-clean-20260822
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PATCH_PATH: .repo-p217-validator-finalize.py
  FINALIZER_PATH: .github/workflows/p217-validator-finalize.yml

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact bounded head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          test -f "$PATCH_PATH"
          test -f "$FINALIZER_PATH"
          test -z "$(git status --short)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - name: Install exact validator dependencies
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Apply validator alignment and remove transport
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$PATCH_PATH"
          python "$PATCH_PATH"
          git rm -f "$PATCH_PATH" "$FINALIZER_PATH"
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
      - name: Validate architecture release contract
        shell: bash
        run: |
          set -euo pipefail
          python tool/validate_release.py --skip-tests
          python -m py_compile tool/validate_release.py
          git diff --check
      - name: Assert exact durable scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_MAIN_SHA" | sort > "$RUNNER_TEMP/actual.paths"
          cat > "$RUNNER_TEMP/expected.paths" <<'EOF'
          SOURCE_MANIFEST.sha256
          automation_host/src/browser-runtime.mjs
          automation_host/src/browser-runtime.test.mjs
          lib/product/browser/browser_runtime.dart
          lib/product/p5_information_architecture/p5_fixtures.dart
          lib/product/p5_information_architecture/p5_models.dart
          lib/product/p5_information_architecture/p5_prototype.dart
          lib/product/p5_information_architecture/p5_support_workspaces.dart
          lib/product/p5_information_architecture/p5_verification_workspaces.dart
          lib/product/ui.dart
          test/product/browser/browser_runtime_process_test.dart
          test/product/p5_information_architecture/p5_accessibility_test.dart
          test/product/p5_information_architecture/p5_navigation_test.dart
          test/product/p5_information_architecture/p5_source_boundary_test.dart
          test/product/p5_information_architecture/p5_state_controller_test.dart
          tool/validate_release.py
          EOF
          sort -o "$RUNNER_TEMP/expected.paths" "$RUNNER_TEMP/expected.paths"
          diff -u "$RUNNER_TEMP/expected.paths" "$RUNNER_TEMP/actual.paths"
      - name: Publish clean validator-aligned candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): recognize current chat-first Experience shell'
          git push origin "HEAD:$TARGET_BRANCH"
