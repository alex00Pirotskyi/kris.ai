name: Owner P25 Adaptive Source Salvage

on:
  push:
    branches:
      - automation/owner-recovery
    paths:
      - .github/workflows/owner-p25-adaptive-salvage.yml

permissions:
  contents: write

concurrency:
  group: owner-p25-adaptive-source-salvage
  cancel-in-progress: false

env:
  FOUNDATION_HEAD: 97c198e485058707f40cef87457f1811a0ae41dc
  OLD_FOUNDATION: 64286a2110fd9d852dbbeb7653e5896866b0c4ac
  OLD_ADAPTIVE_HEAD: 2f5b8f8fdf83f56f6405590675d3cb39881793a3
  SALVAGE_BRANCH: agent/salvage/p25-004-adaptive-mission-planner

jobs:
  salvage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact clean P25 foundation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 97c198e485058707f40cef87457f1811a0ae41dc
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Apply only valuable adaptive planner source as a three-way patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FOUNDATION_HEAD}"
          test -z "$(git ls-remote --heads origin "refs/heads/${SALVAGE_BRANCH}")"
          git fetch origin "${OLD_FOUNDATION}" "${OLD_ADAPTIVE_HEAD}"
          git diff --binary "${OLD_FOUNDATION}" "${OLD_ADAPTIVE_HEAD}" -- \
            lib/product/adaptive_mission_planning.dart \
            lib/product/adaptive_mission_ui.dart \
            lib/product/chat_studio.dart \
            lib/product/prompt_planning.dart \
            test/product/adaptive_mission_planning_test.dart \
            test/product/source_contract_test.dart \
            > "${RUNNER_TEMP}/adaptive-source.patch"
          test -s "${RUNNER_TEMP}/adaptive-source.patch"
          git switch -c "${SALVAGE_BRANCH}"
          git apply --3way --index "${RUNNER_TEMP}/adaptive-source.patch"
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          test ! -e .p25-adaptive
          test ! -e .github/workflows/p25-004-adaptive-mission-planner.yml
          git diff --cached --check

      - name: Canonically format and validate salvage source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/product/adaptive_mission_planning.dart \
            lib/product/adaptive_mission_ui.dart \
            lib/product/chat_studio.dart \
            lib/product/prompt_planning.dart \
            test/product/adaptive_mission_planning_test.dart \
            test/product/source_contract_test.dart
          git add -- \
            lib/product/adaptive_mission_planning.dart \
            lib/product/adaptive_mission_ui.dart \
            lib/product/chat_studio.dart \
            lib/product/prompt_planning.dart \
            test/product/adaptive_mission_planning_test.dart \
            test/product/source_contract_test.dart
          flutter test --no-pub --reporter expanded \
            test/product/adaptive_mission_planning_test.dart \
            test/product/p25_fast_path_contract_test.dart \
            test/product/prompt_studio_v2_test.dart
          flutter analyze --no-pub --fatal-warnings --fatal-infos
          git diff --cached --check
          test -z "$(git diff --name-only)"

      - name: Bind salvage source in its own manifest
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          git add -- SOURCE_MANIFEST.sha256
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/salvage-manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/salvage-manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 7

      - name: Publish non-competing source-only salvage branch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${SALVAGE_BRANCH}")"
          git config user.name 'alex00Pirotskyi'
          git config user.email '177022051+alex00Pirotskyi@users.noreply.github.com'
          git commit -m 'salvage(p25): preserve adaptive mission planner source'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${FOUNDATION_HEAD}"
          git push origin "HEAD:refs/heads/${SALVAGE_BRANCH}"
          git fetch origin "+refs/heads/${SALVAGE_BRANCH}:refs/remotes/origin/${SALVAGE_BRANCH}"
          test "$(git rev-parse "origin/${SALVAGE_BRANCH}")" = "${candidate}"
          echo "P25_ADAPTIVE_SALVAGE=${candidate}"
