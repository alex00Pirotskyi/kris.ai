        shell: pwsh
        run: |
          python tool/p2_ensure_provisional_receipt.py --attestation-receipt "release/evidence/P2/platforms/runner-attestation-windows-${{ github.run_id }}-${{ github.run_attempt }}.json" --output "release/evidence/P2/platforms/windows-${{ github.run_id }}-${{ github.run_attempt }}-provisional.json" --reason "behavior-${{ steps.behavior.outcome }}"
      - name: Perform and verify exact current-job cleanup
        if: always()
        shell: pwsh
        run: |
          python tool/p2_post_run_cleanup.py --attestation-receipt "release/evidence/P2/platforms/runner-attestation-windows-${{ github.run_id }}-${{ github.run_attempt }}.json" --provisional-receipt "release/evidence/P2/platforms/windows-${{ github.run_id }}-${{ github.run_attempt }}-provisional.json" --policy $env:KRISTIN_P2_RUNNER_POLICY --output "release/evidence/P2/platforms/windows-${{ github.run_id }}-${{ github.run_attempt }}-cleanup.json"
      - name: Finalize only after signed cleanup
        if: always()
        shell: pwsh
        run: |
          python tool/p2_finalize_platform_after_cleanup.py --provisional "release/evidence/P2/platforms/windows-${{ github.run_id }}-${{ github.run_attempt }}-provisional.json" --cleanup "release/evidence/P2/platforms/windows-${{ github.run_id }}-${{ github.run_attempt }}-cleanup.json" --output "release/evidence/P2/platforms/windows-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: p2-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/evidence/P2/platforms/
          if-no-files-found: error
          retention-days: 30
