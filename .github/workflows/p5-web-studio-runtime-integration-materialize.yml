name: P5 Web Studio Runtime Integration Materializer

on:
  push:
    branches:
      - 'agent/p5-web-studio-runtime-integration'
    paths:
      - '.github/workflows/p5-web-studio-runtime-integration-materialize.yml'
      - '.p5-web-studio-runtime-integration.b64'

permissions:
  contents: write

concurrency:
  group: p5-web-studio-runtime-integration-materialize
  cancel-in-progress: false

env:
  BASE_MAIN_SHA: 26fd52f4bbb9906955d4b7d8c0e81e0fed6f180a
  BRANCH_NAME: agent/p5-web-studio-runtime-integration

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact transport head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_MAIN_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '24.18.0'
          check-latest: false
          cache: npm
          cache-dependency-path: automation_host/package-lock.json

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          npm ci --prefix automation_host --ignore-scripts --no-audit --no-fund

      - name: Decode and apply guarded product slice
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .p5-web-studio-runtime-integration.b64 | gzip --decompress > "$RUNNER_TEMP/apply_p5_web_studio_integration.py"
          python -m py_compile "$RUNNER_TEMP/apply_p5_web_studio_integration.py"
          python "$RUNNER_TEMP/apply_p5_web_studio_integration.py"

      - name: Apply pinned Dart formatter
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/product/ui.dart \
            lib/product/p5_information_architecture \
            lib/product/browser/browser_runtime.dart \
            test/product/p5_information_architecture \
            test/product/browser/browser_runtime_process_test.dart

      - name: P3 Node browser contracts
        shell: bash
        working-directory: automation_host
        run: |
          set -euo pipefail
          npm test

      - name: P3 Dart browser contracts
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 test/product/browser/browser_runtime_process_test.dart

      - name: P5 Experience contracts
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 test/product/p5_information_architecture

      - name: Analyzer and formatting scope
        shell: bash
        run: |
          set -euo pipefail
          python tool/dart_format_scope.py --check
          flutter analyze --no-pub --fatal-warnings --fatal-infos

      - name: Remove one-shot transport and regenerate source identity
        shell: bash
        run: |
          set -euo pipefail
          rm .p5-web-studio-runtime-integration.b64
          rm .github/workflows/p5-web-studio-runtime-integration-materialize.yml
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --check

      - name: Abort if protected main moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA" || {
            echo 'Protected main moved during materialization; refusing stale publication.' >&2
            exit 79
          }

      - name: Stage only the collision-safe product candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            SOURCE_MANIFEST.sha256 \
            automation_host/src/browser-runtime.mjs \
            automation_host/src/browser-runtime.test.mjs \
            lib/product/browser/browser_runtime.dart \
            test/product/browser/browser_runtime_process_test.dart \
            lib/product/ui.dart \
            lib/product/p5_information_architecture/p5_models.dart \
            lib/product/p5_information_architecture/p5_fixtures.dart \
            lib/product/p5_information_architecture/p5_prototype.dart \
            lib/product/p5_information_architecture/p5_support_workspaces.dart \
            lib/product/p5_information_architecture/p5_verification_workspaces.dart \
            test/product/p5_information_architecture/p5_source_boundary_test.dart \
            test/product/p5_information_architecture/p5_navigation_test.dart \
            .p5-web-studio-runtime-integration.b64 \
            .github/workflows/p5-web-studio-runtime-integration-materialize.yml
          python - <<'PY'
          import subprocess
          expected = {
              'SOURCE_MANIFEST.sha256',
              'automation_host/src/browser-runtime.mjs',
              'automation_host/src/browser-runtime.test.mjs',
              'lib/product/browser/browser_runtime.dart',
              'test/product/browser/browser_runtime_process_test.dart',
              'lib/product/ui.dart',
              'lib/product/p5_information_architecture/p5_models.dart',
              'lib/product/p5_information_architecture/p5_fixtures.dart',
              'lib/product/p5_information_architecture/p5_prototype.dart',
              'lib/product/p5_information_architecture/p5_support_workspaces.dart',
              'lib/product/p5_information_architecture/p5_verification_workspaces.dart',
              'test/product/p5_information_architecture/p5_source_boundary_test.dart',
              'test/product/p5_information_architecture/p5_navigation_test.dart',
              '.p5-web-studio-runtime-integration.b64',
              '.github/workflows/p5-web-studio-runtime-integration-materialize.yml',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'candidate scope mismatch: actual={sorted(actual)} expected={sorted(expected)}')
          print('P5 materializer exact staged scope: PASS')
          PY

      - name: Publish exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kristin P5 Integration Worker'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(p5): connect Web Studio to landed P2/P3 runtime'
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
          echo "P5_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "P5_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Candidate identity
        shell: bash
        run: |
          echo "candidate=$P5_CANDIDATE_SHA"
          echo "tree=$P5_CANDIDATE_TREE"
