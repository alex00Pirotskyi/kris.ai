name: Mission Execution Materializer

on:
  push:
    branches:
      - agent/anarchy-autonomous-worker-missions
    paths:
      - '.github/workflows/mission-execution-materialize.yml'
      - 'config/mission_execution.v1.json'
      - 'docs/roadmap/missions/checkpoints/**'
      - 'docs/roadmap/missions/coordination/**'
      - 'tool/mission_control.py'
      - 'tool/mission_live_materializer.py'
      - 'tool/mission_live_materializer_test.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mission-execution-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'alex00Pirotskyi/kris.ai'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/anarchy-autonomous-worker-missions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Require exact branch head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Verify durable live-memory regressions
        run: python -m unittest -v tool/mission_live_materializer_test.py
      - name: Materialize deterministic mission views from durable live memory
        run: python tool/mission_live_materializer.py --project . --write
      - name: Fail closed on generated live claim or state mutation
        shell: bash
        run: |
          set -euo pipefail
          live_state_changes="$(git diff --name-only -- \
            docs/roadmap/missions/claims \
            docs/roadmap/missions/state)"
          if test -n "${live_state_changes}"; then
            echo "Mission materializer attempted to rewrite durable live claim/state memory:" >&2
            printf '%s\n' "${live_state_changes}" >&2
            echo "Claim/state changes must be committed explicitly by the owning mission or a recorded transfer before materialization." >&2
            git diff -- \
              docs/roadmap/missions/claims \
              docs/roadmap/missions/state >&2
            exit 1
          fi
      - name: Remove superseded prompt and transport artifacts
        shell: bash
        run: |
          git rm -rf --ignore-unmatch -- \
            .github/workflows/mission-execution-generator-repair.yml \
            docs/roadmap/anarchy/materializer \
            docs/roadmap/anarchy/materializer-v2 \
            docs/roadmap/missions-bootstrap \
            docs/roadmap/anarchy/workers/prompts \
            docs/roadmap/anarchy/AUTONOMOUS_WORKER_EXECUTION.md \
            docs/roadmap/v32-source-import \
            tool/temp_anarchy_mission_materializer.py \
            tool/temp_anarchy_mission_materializer_v2.py
      - name: Validate deterministic live mission views
        run: python tool/mission_live_materializer.py --project . --check
      - name: Refresh canonical source manifest twice
        shell: bash
        run: |
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
      - name: Verify generated diff
        shell: bash
        run: |
          git diff --check
          test -n "$(git status --porcelain=v1)"
      - name: Publish generated mission system
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .
          git diff --cached --check
          git commit -m 'ANARCHY: materialize protected mission execution OS'
          git push origin HEAD:agent/anarchy-autonomous-worker-missions
