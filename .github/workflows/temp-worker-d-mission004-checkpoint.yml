name: TEMP Worker D MISSION-004 Checkpoint

on:
  push:
    branches:
      - ci/worker-d-mission004-checkpoint

permissions:
  contents: write

concurrency:
  group: worker-d-mission004-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/worker-d-mission004-checkpoint
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Publish exact MISSION-004 review checkpoint
        shell: bash
        env:
          MISSION_HEAD: d1b48c66091bd469d28b332b4a7a3a16fa8dff03
          TARGET_BRANCH: agent/anarchy-autonomous-worker-missions
          P4_HEAD: 1c089c7094a122bb3cfbbc78221f218b3dd7ac0f
          P4_TREE: 276481693c3da7d56fa3e315018c851e659ddec5
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$MISSION_HEAD"
          git switch -C mission004-checkpoint "$MISSION_HEAD"
          git config user.name 'Worker D MISSION-004 Checkpoint'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python - <<'PY'
          from __future__ import annotations

          import datetime
          import json
          import pathlib

          config_path = pathlib.Path('config/mission_execution.v1.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          matches = [claim for claim in config['activeClaims'] if claim['mission'] == 'MISSION-004']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one MISSION-004 claim, found {len(matches)}')
          claim = matches[0]
          expected = {
              'worker': 'D',
              'branch': 'agent/p4-001-search-provider-foundation',
              'pr': 62,
              'head': '69e44e08395d89da1767c58b84655c289a969f66',
              'tree': '1114c576fe67d9f9202f7f44c98a0af6e35a915a',
          }
          for key, value in expected.items():
              if claim.get(key) != value:
                  raise SystemExit(f'stale MISSION-004 claim: {key}={claim.get(key)!r}, expected {value!r}')

          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          config['generatedAt'] = now
          claim['head'] = '1c089c7094a122bb3cfbbc78221f218b3dd7ac0f'
          claim['tree'] = '276481693c3da7d56fa3e315018c851e659ddec5'
          claim['status'] = 'REVIEW'
          claim['current'] = (
              'P4-001 exact source/integration candidate is reconciled with current Worker B/P8 ancestry and all '
              'exact-head CI passes; Worker B and Worker J decisions are pending, Worker I is BLOCKED_EXTERNAL, '
              'and P4-002 plus merge remain unauthorized.'
          )
          config_path.write_text(
              json.dumps(config, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          checkpoint = {
              'schemaVersion': 1,
              'mission': 'MISSION-004',
              'sequence': 3,
              'worker': 'D',
              'status': 'REVIEW',
              'branch': 'agent/p4-001-search-provider-foundation',
              'pullRequest': 62,
              'observedHead': '1c089c7094a122bb3cfbbc78221f218b3dd7ac0f',
              'observedTree': '276481693c3da7d56fa3e315018c851e659ddec5',
              'protectedMain': {
                  'commit': '0a4176bcbcb975684c3a590be652c9fffe1ce770',
                  'tree': '641e11e63fa84f3a16dc4d74b418778839ce5bc2',
              },
              'workerBBase': {
                  'commit': '22a8ac34cbf9601100f60c4929198f15f3c60e52',
                  'tree': 'ef5d5ae584b1d823502bf6f2191ecf4285d36845',
                  'pullRequest': 65,
              },
              'candidate': {
                  'commit': '1c089c7094a122bb3cfbbc78221f218b3dd7ac0f',
                  'tree': '276481693c3da7d56fa3e315018c851e659ddec5',
                  'parents': [
                      '69e44e08395d89da1767c58b84655c289a969f66',
                      '22a8ac34cbf9601100f60c4929198f15f3c60e52',
                  ],
                  'aheadOfWorkerB': 58,
                  'behindWorkerB': 0,
                  'mergeable': True,
                  'draft': True,
                  'merged': False,
              },
              'classifications': [
                  'MISSION_004_TRANSFER_COMPLETE',
                  'P4_001_SOURCE_IMPLEMENTATION_COMPLETE',
                  'P4_001_CANONICAL_TEST_CENTER_RECONCILED',
                  'P4_001_P8_BINDINGS_COMPLETE',
                  'P4_001_EXACT_HEAD_CI_PASS',
                  'P4_001_INDEPENDENT_REVIEW_PENDING',
                  'WORKER_I_BLOCKED_EXTERNAL',
                  'P4_002_NOT_STARTED',
