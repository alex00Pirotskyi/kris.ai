                          {'id': 8964677938, 'name': 'p0-003-ci-environment-macos', 'digest': 'sha256:d2c599c3a639e230c51fa343ef8b8b7740da157fcd544596b25ac0b71c0d2686'},
                          {'id': 8964677378, 'name': 'p0-004-toolchain-macos', 'digest': 'sha256:2803f42d12f605ba5295e6e60f147105b21fa42638baddddde0cb36c82226560'},
                      ],
                  },
                  'reviewRequests': {
                      'workerBReviewId': 4873833836,
                      'workerBComment': 5203670639,
                      'workerIComment': 5203674356,
                      'workerJComment': 5203678073,
                  },
              },
              'blockers': [
                  {
                      'class': 'WORKER_B_EXACT_REVIEW_PENDING',
                      'detail': 'No independent exact-candidate Test Center/P8/P4 decision has been published for commit 1c089c7094a122bb3cfbbc78221f218b3dd7ac0f.',
                  },
                  {
                      'class': 'WORKER_I_BLOCKED_EXTERNAL',
                      'detail': 'No active agent/i branch, PR, or verified independent security reviewer mechanism is discoverable.',
                  },
                  {
                      'class': 'WORKER_J_NO_CONFLICT_PENDING',
                      'detail': 'No exact MISSION-004 no-conflict record has been published for the current candidate.',
                  },
                  {
                      'class': 'WORKER_B_BASE_INDEPENDENT_REVIEW_BLOCKED_EXTERNAL',
                      'detail': 'The current Worker B/P8 base remains draft and independently review-blocked; Worker D does not alter Worker B-owned governance.',
                  },
                  {
                      'class': 'P4_002_DEPENDENCY_GATE',
                      'detail': 'P4-002 must not start until P4-001 independent exact-candidate review closes and mission sequencing authorizes continuation.',
                  },
                  {
                      'class': 'NO_MERGE_AUTHORIZATION',
                      'detail': 'PR #62 remains draft and no integration authorization exists.',
                  },
              ],
              'nextAction': (
                  'Consume the Worker B exact-candidate decision, Worker J no-conflict record, and any authorized Worker I policy disposition. '
                  'Repair only proven exact defects, update this mission checkpoint if the candidate changes, and do not start P4-002 or merge PR #62 before those gates close.'
              ),
              'supersedes': 'docs/roadmap/missions/checkpoints/MISSION-004-0002.transfer.json',
              'supersededBy': None,
          }
          checkpoint_path = pathlib.Path('docs/roadmap/missions/checkpoints/MISSION-004-0003.json')
          if checkpoint_path.exists():
              raise SystemExit('MISSION-004-0003.json already exists')
          checkpoint_path.write_text(
              json.dumps(checkpoint, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY

          python -m json.tool config/mission_execution.v1.json >/dev/null
          python -m json.tool docs/roadmap/missions/checkpoints/MISSION-004-0003.json >/dev/null
          git diff --check
          git add -- config/mission_execution.v1.json docs/roadmap/missions/checkpoints/MISSION-004-0003.json
          git diff --cached --check
          git commit -m 'mission(MISSION-004): checkpoint exact P4-001 review candidate'
          git push origin HEAD:"$TARGET_BRANCH"
