typedef PromptStudioTraceClock = DateTime Function();
typedef PromptStudioTraceListener = void Function(
  PromptStudioLatencyEvent event,
);

DateTime _promptStudioUtcNow() => DateTime.now().toUtc();

Object? _boundedPromptStudioTraceValue(Object? value) {
  if (value == null || value is bool || value is num) return value;
  if (value is String) {
    if (value.length <= 512) return value;
    return <String, Object?>{
      'sha256': Sha256.text(value),
      'length': value.length,
    };
  }
  if (value is List) {
    return value
        .take(64)
        .map<Object?>((item) => _boundedPromptStudioTraceValue(item))
        .toList(growable: false);
  }
  if (value is Map) {
    final keys = value.keys.map((key) => key.toString()).toList()..sort();
    return <String, Object?>{
      for (final key in keys.take(64))
        key: _boundedPromptStudioTraceValue(value[key]),
    };
  }
  final rendered = value.toString();
  return <String, Object?>{
    'type': value.runtimeType.toString(),
    'sha256': Sha256.text(rendered),
    'length': rendered.length,
  };
}

Map<String, Object?> _boundedPromptStudioTraceDetails(
  Map<String, Object?> details,
) {
  final keys = details.keys.toList()..sort();
  return Map<String, Object?>.unmodifiable(<String, Object?>{
    for (final key in keys.take(64))
      key: _boundedPromptStudioTraceValue(details[key]),
  });
}

final class PromptStudioLatencyEvent {
  const PromptStudioLatencyEvent({
    required this.sequence,
    required this.stage,
    required this.timestamp,
    required this.elapsed,
    required this.attempt,
    required this.details,
  });

  final int sequence;
  final String stage;
  final DateTime timestamp;
  final Duration elapsed;
  final int attempt;
  final Map<String, Object?> details;

  Map<String, Object?> toJson() => <String, Object?>{
        'sequence': sequence,
        'stage': stage,
        'timestamp': timestamp.toIso8601String(),
        'elapsedMilliseconds': elapsed.inMilliseconds,
        'attempt': attempt,
        if (details.isNotEmpty) 'details': details,
      };
}

final class PromptStudioLatencyTrace {
  PromptStudioLatencyTrace({
    required this.operation,
    required this.model,
    String? traceId,
    PromptStudioTraceClock? clock,
    PromptStudioTraceListener? onEvent,
  })  : traceId = traceId ?? newId('prompt_studio_trace'),
        _clock = clock ?? _promptStudioUtcNow,
        _onEvent = onEvent {
    startedAt = _clock().toUtc();
  }

  final String traceId;
  final String operation;
  final ModelIdentity model;
  final PromptStudioTraceClock _clock;
  final PromptStudioTraceListener? _onEvent;
  final List<PromptStudioLatencyEvent> _events = <PromptStudioLatencyEvent>[];
  late final DateTime startedAt;
  DateTime? _completedAt;
  String _status = 'running';

  List<PromptStudioLatencyEvent> get events =>
      List<PromptStudioLatencyEvent>.unmodifiable(_events);

  DateTime? get completedAt => _completedAt;
  String get status => _status;
  int get generationCalls =>
      _events.where((event) => event.stage == 'generation_attempt_started').length;
  int get repairCount =>
      _events.where((event) => event.stage == 'repair_scheduled').length;

  PromptStudioLatencyEvent record(
    String stage, {
    int attempt = 1,
    Map<String, Object?> details = const <String, Object?>{},
  }) {
    if (_completedAt != null) {
      throw StateError('prompt_studio_trace_already_completed');
    }
    final timestamp = _clock().toUtc();
    final event = PromptStudioLatencyEvent(
      sequence: _events.length + 1,
      stage: stage,
      timestamp: timestamp,
      elapsed: timestamp.difference(startedAt),
      attempt: attempt,
      details: _boundedPromptStudioTraceDetails(details),
    );
    _events.add(event);
    try {
      _onEvent?.call(event);
    } catch (_) {
      // Trace observers must never change Prompt Studio behavior.
    }
    return event;
  }

  PromptStudioLatencyEvent recordGenerationResult(
    ModelGenerationResult result, {
    required int attempt,
  }) =>
      record(
        'generation_completed',
        attempt: attempt,
        details: <String, Object?>{
          'providerId': result.identity.providerId,
          'modelName': result.identity.name,
          'modelDigest': result.identity.digest,
          'startedAt': result.startedAt.toIso8601String(),
          'firstTokenAt': result.firstTokenAt.toIso8601String(),
          'completedAt': result.completedAt.toIso8601String(),
          'firstTokenLatencyMilliseconds':
              result.firstTokenLatency.inMilliseconds,
          'totalLatencyMilliseconds': result.totalLatency.inMilliseconds,
          'inputTokens': result.inputTokens,
          'outputTokens': result.outputTokens,
          'responseHash': Sha256.text(result.text),
          'responseCharacters': result.text.length,
          if (result.providerDetails.isNotEmpty)
            'providerDetails': result.providerDetails,
        },
      );

  void finish(
    String status, {
    int attempt = 1,
    Map<String, Object?> details = const <String, Object?>{},
  }) {
    if (_completedAt != null) return;
    final event = record(
      status == 'completed' ? 'operation_completed' : 'operation_failed',
      attempt: attempt,
      details: details,
    );
    _status = status;
    _completedAt = event.timestamp;
  }

  Map<String, Object?> toJson() => <String, Object?>{
        'schemaVersion': '1.0.0',
        'traceId': traceId,
        'operation': operation,
        'status': status,
        'model': model.toJson(),
        'startedAt': startedAt.toIso8601String(),
        if (_completedAt != null)
          'completedAt': _completedAt!.toIso8601String(),
        'totalDurationMilliseconds':
            (_completedAt ?? _clock().toUtc()).difference(startedAt).inMilliseconds,
        'generationCalls': generationCalls,
        'repairCount': repairCount,
        'events': events.map((event) => event.toJson()).toList(growable: false),
      };
}
'''
