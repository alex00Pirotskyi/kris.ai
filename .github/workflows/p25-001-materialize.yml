        },
      );
    } catch (_) {
      // Trace persistence must never alter Prompt Studio semantics.
    }
  }

  Future<void> _persistLatencyTrace(PromptStudioLatencyTrace trace) async {
    final payload = trace.toJson();
    final summary = <String, dynamic>{
      'traceId': trace.traceId,
      'operation': trace.operation,
      'status': trace.status,
      'model': trace.model.toJson(),
      'startedAt': trace.startedAt.toIso8601String(),
      if (trace.completedAt != null)
        'completedAt': trace.completedAt!.toIso8601String(),
      'eventCount': trace.events.length,
      'generationCalls': trace.generationCalls,
      'repairCount': trace.repairCount,
      'traceHash': Sha256.text(canonicalJson(payload)),
    };
    try {
      await audit.append(
        'prompt_studio.trace_completed',
        trace.traceId,
        summary,
      );
      await events.publish(
        'prompt_studio.trace_completed',
        trace.traceId,
        <String, dynamic>{...summary, 'trace': payload},
      );
    } catch (_) {
      // Diagnostics are fail-isolated from prompt and plan results.
    }
  }
