name: P25-001 Prompt Studio Latency Instrumentation Materializer

on:
  push:
    branches:
      - 'agent/product/p25-001-prompt-studio-latency-trace'
    paths:
      - '.github/workflows/p25-001-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
