import 'dart:io';

import 'package:kristin_local_agent/product/crypto_utils.dart';
import 'package:kristin_local_agent/product/domain.dart';
import 'package:kristin_local_agent/product/product_runtime.dart';
import 'package:kristin_local_agent/product/prompt_planning.dart';

Future<void> main(List<String> arguments) async {
  if (arguments.contains('--help') || arguments.contains('-h')) {
    stdout.writeln('''
P25-001 real Prompt Studio benchmark

Required environment:
  P25_MODEL_PROVIDER   Exact provider ID, normally ollama
  P25_MODEL_NAME       Exact installed model name
  P25_HARDWARE_REPORT  JSON file containing cpuModel, memoryBytes,
                       operatingSystem, and architecture

Options:
  --iterations N       Repetitions per case (default: 3)
  --case-limit N       Simple corpus cases to run (default: 1)
  --output PATH        Evidence output path
  --data-root PATH     Persistent benchmark data root (default: temporary)
''');
    return;
  }

  final options = _Options.parse(arguments);
  final providerId = Platform.environment['P25_MODEL_PROVIDER']?.trim() ?? '';
  final modelName = Platform.environment['P25_MODEL_NAME']?.trim() ?? '';
  final hardwarePath =
      Platform.environment['P25_HARDWARE_REPORT']?.trim() ?? '';
  if (providerId.isEmpty || modelName.isEmpty || hardwarePath.isEmpty) {
    stderr.writeln(
      'BLOCKED_ENVIRONMENT: set P25_MODEL_PROVIDER, P25_MODEL_NAME, '
      'and P25_HARDWARE_REPORT.',
    );
    exitCode = 2;
    return;
  }
  final hardwareFile = File(hardwarePath);
  if (!await hardwareFile.exists()) {
    stderr.writeln('BLOCKED_ENVIRONMENT: hardware report does not exist.');
    exitCode = 2;
    return;
  }
  final hardwareBytes = await hardwareFile.readAsBytes();
  final hardware = _requireHardwareReport(hardwareBytes);
  final corpusFile = File('docs/roadmap/p25/benchmark_corpus.v1.json');
  final corpus = jsonDecode(await corpusFile.readAsString());
  final rawCases = corpus is Map ? corpus['cases'] : null;
  if (rawCases is! List) {
    throw StateError('P25 benchmark corpus is invalid.');
  }
  final cases = rawCases
      .whereType<Map>()
      .map((item) => Map<String, Object?>.from(item))
      .where((item) => item['complexity'] == 'simple')
      .take(options.caseLimit)
      .toList(growable: false);
  if (cases.isEmpty) throw StateError('No simple P25 benchmark case exists.');

  final temporary = options.dataRoot == null
      ? await Directory.systemTemp.createTemp('kristin-p25-benchmark-')
      : null;
  final dataRoot = options.dataRoot ?? temporary!.path;
  final runtime = await ProductRuntime.initialize(dataRoot: dataRoot);
  try {
    final models = await runtime.discoverModels();
    final selected = models.where(
      (model) => model.providerId == providerId && model.name == modelName,
    ).firstOrNull;
    if (selected == null) {
      stderr.writeln(
        'BLOCKED_ENVIRONMENT: exact model $providerId/$modelName is not installed.',
      );
      exitCode = 2;
      return;
    }

    final runs = <Map<String, Object?>>[];
    for (final benchmarkCase in cases) {
      final caseId = benchmarkCase['id']?.toString() ?? '';
      final goal = benchmarkCase['goal']?.toString() ?? '';
      for (var iteration = 0; iteration < options.iterations; iteration += 1) {
        final trace = PromptStudioLatencyTrace(
          operation: 'prompt_generation',
          model: selected,
          traceId: 'p25-$caseId-${iteration + 1}',
        );
        final wall = Stopwatch()..start();
        final draft = await runtime.generatePromptDraft(
          goal: goal,
          model: selected,
          trace: trace,
        );
        wall.stop();
        runs.add(<String, Object?>{
          'caseId': caseId,
          'iteration': iteration + 1,
          'temperatureClass': iteration == 0 ? 'cold' : 'warm',
          'wallClockMilliseconds': wall.elapsedMilliseconds,
          'draftHash': Sha256.text(canonicalJson(draft.toJson())),
          'trace': trace.toJson(),
        });
      }
    }

    final source = await _gitIdentity();
    final evidence = <String, Object?>{
      'schemaVersion': '1.0.0',
      'suiteId': 'p25.owner-phi-benchmark',
      'capturedAt': DateTime.now().toUtc().toIso8601String(),
      'source': source,
      'providerId': providerId,
      'model': selected.toJson(),
      'hardware': hardware,
      'hardwareReportSha256': Sha256.hex(hardwareBytes),
      'iterationsPerCase': options.iterations,
      'caseCount': cases.length,
      'runs': runs,
      'summary': _summary(runs),
      'claimBoundary': <String, Object?>{
        'sourceMeasured': true,
        'packagedBehaviorCertified': false,
        'platformQualified': false,
        'releaseSupported': false,
        'productionSupported': false,
        'ga': false,
      },
    };
    final output = File(options.outputPath);
    await output.parent.create(recursive: true);
    await output.writeAsString(
      '${const JsonEncoder.withIndent('  ').convert(evidence)}\n',
      flush: true,
    );
    stdout.writeln(output.path);
  } finally {
    await runtime.close();
    if (temporary != null && await temporary.exists()) {
      await temporary.delete(recursive: true);
    }
  }
}

Map<String, Object?> _requireHardwareReport(List<int> bytes) {
  final decoded = jsonDecode(utf8.decode(bytes));
  if (decoded is! Map) throw StateError('Hardware report must be a JSON object.');
  final value = Map<String, Object?>.from(decoded);
  const required = <String>{
    'cpuModel',
    'memoryBytes',
    'operatingSystem',
    'architecture',
  };
  for (final key in required) {
    if (!value.containsKey(key) || value[key].toString().trim().isEmpty) {
      throw StateError('Hardware report is missing $key.');
    }
  }
  return <String, Object?>{
    for (final key in required) key: value[key],
  };
}

Future<Map<String, Object?>> _gitIdentity() async {
  Future<String> read(List<String> arguments) async {
    final result = await Process.run('git', arguments, runInShell: false);
    if (result.exitCode != 0) {
      throw StateError('git ${arguments.join(' ')} failed.');
    }
    return result.stdout.toString().trim();
  }

  return <String, Object?>{
    'commit': await read(<String>['rev-parse', 'HEAD']),
    'tree': await read(<String>['rev-parse', 'HEAD^{tree}']),
    'branch': await read(<String>['rev-parse', '--abbrev-ref', 'HEAD']),
  };
}

Map<String, Object?> _summary(List<Map<String, Object?>> runs) {
  final cold = <int>[];
  final warm = <int>[];
  for (final run in runs) {
    final value = run['wallClockMilliseconds'];
    if (value is! int) continue;
    (run['temperatureClass'] == 'cold' ? cold : warm).add(value);
  }
  int percentile(List<int> values, double fraction) {
    if (values.isEmpty) return 0;
    final sorted = List<int>.from(values)..sort();
    final index = ((sorted.length - 1) * fraction).ceil();
    return sorted[index.clamp(0, sorted.length - 1)];
  }

  return <String, Object?>{
    'coldCount': cold.length,
    'warmCount': warm.length,
    'coldP95Milliseconds': percentile(cold, 0.95),
    'warmP50Milliseconds': percentile(warm, 0.50),
    'warmP95Milliseconds': percentile(warm, 0.95),
  };
}

final class _Options {
  const _Options({
    required this.iterations,
    required this.caseLimit,
    required this.outputPath,
    required this.dataRoot,
  });

  factory _Options.parse(List<String> arguments) {
    var iterations = 3;
    var caseLimit = 1;
    var outputPath = 'build/p25-test-station/owner-phi-benchmark.json';
    String? dataRoot;
    for (var index = 0; index < arguments.length; index += 1) {
      final argument = arguments[index];
      String next() {
        if (index + 1 >= arguments.length) {
          throw FormatException('Missing value for $argument.');
        }
        index += 1;
        return arguments[index];
      }

      switch (argument) {
        case '--iterations':
          iterations = int.parse(next());
        case '--case-limit':
          caseLimit = int.parse(next());
        case '--output':
          outputPath = next();
        case '--data-root':
          dataRoot = next();
        default:
          throw FormatException('Unknown argument: $argument');
      }
    }
    if (iterations < 1 || iterations > 20) {
      throw RangeError.range(iterations, 1, 20, 'iterations');
    }
    if (caseLimit < 1 || caseLimit > 20) {
      throw RangeError.range(caseLimit, 1, 20, 'caseLimit');
    }
    return _Options(
      iterations: iterations,
      caseLimit: caseLimit,
      outputPath: outputPath,
