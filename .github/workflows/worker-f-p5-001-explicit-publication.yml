name: Worker F MISSION-005 explicit source publication

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: worker-f-mission-005-explicit-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Set up locked Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Reset validation tree to exact current Worker B
        env:
          EXPECTED_WORKER_B: 788af8db5891518a2b405d25e8d5b50cb89e8871
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Worker F MISSION-005 Publication'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/b/test-center-contracts-and-review
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_WORKER_B"
          helper_dir=$(mktemp -d)
          cp tool/worker_f_recovery_source.yml "$helper_dir/"
          cp tool/worker_f_recovery_patch.py "$helper_dir/"
          cp tool/worker_f_recovery_bootstrap.py "$helper_dir/"
          cp tool/worker_f_recovery_test_patch.py "$helper_dir/"
          cp tool/worker_f_recovery_manifest_patch.py "$helper_dir/"
          cp tool/worker_f_p5_ia_template.py "$helper_dir/"
          cp tool/worker_f_p5_ia_workflow_template.yml "$helper_dir/"
          git reset --hard "$EXPECTED_WORKER_B"
          mkdir -p tool
          cp "$helper_dir"/* tool/
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORKER_B"
      - name: Install governed Python dependencies
        shell: bash
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Recover reviewed source and bounded repairs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python tool/worker_f_recovery_bootstrap.py
          python tool/worker_f_recovery_test_patch.py
          python tool/worker_f_recovery_manifest_patch.py
          rm -f \
            tool/worker_f_recovery_source.yml \
            tool/worker_f_recovery_patch.py \
            tool/worker_f_recovery_bootstrap.py \
            tool/worker_f_recovery_test_patch.py \
            tool/worker_f_recovery_manifest_patch.py \
            tool/worker_f_p5_ia_template.py \
            tool/worker_f_p5_ia_workflow_template.yml
      - name: Validate exact ordinary source tree
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/p5_ia_preview.dart lib/product/p5_information_architecture test/product/p5_information_architecture
          flutter analyze
          flutter test test/product/p5_information_architecture/
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/worker_f_p5_ia.py manifest --project .
          python tool/worker_f_p5_ia.py manifest --project . --check
          python tool/worker_f_p5_ia.py check --project .
          python tool/worker_f_p5_ia_test.py
          python tool/roadmap_control.py validate --project . --strict
          python tool/generated_state_guard.py audit --project . --strict
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/worker-f-source-manifest
          python tool/p1a_refresh_source_manifest.py .
          cmp /tmp/worker-f-source-manifest SOURCE_MANIFEST.sha256
          git diff --check
      - name: Create explicit-path source commit object
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLEAN_BASE_TREE: e2a0f45bd2e23f529c89f8c806b3b7a5114424a1
          EXPECTED_WORKER_B: 788af8db5891518a2b405d25e8d5b50cb89e8871
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          project = Path('.')

          def request(method: str, path: str, payload=None):
              body = None
              headers = {
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              if payload is not None:
                  body = json.dumps(payload).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(
                  f'{api}/{path}', data=body, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)

          carrier = os.environ['GITHUB_SHA']
          worker_b = os.environ['EXPECTED_WORKER_B']
          exact = {
              'config/test_center_registry.v1.json',
              'config/test_center_assurance_hierarchy.v1.json',
              'SOURCE_MANIFEST.sha256',
              'docs/roadmap/progress/2026-08-05-p5-001-information-architecture.md',
              'docs/roadmap/progress/2026-08-06-mission-005-p5-001-recovery.md',
              'docs/ux/P5-001_INFORMATION_ARCHITECTURE.md',
              'lib/p5_ia_preview.dart',
              'tool/worker_f_p5_ia.py',
              'tool/worker_f_p5_ia_test.py',
          }
          for directory in (
              project / 'lib/product/p5_information_architecture',
              project / 'test/product/p5_information_architecture',
              project / 'release/evidence/P5-001',
          ):
              exact.update(
                  path.relative_to(project).as_posix()
                  for path in directory.rglob('*')
                  if path.is_file()
              )

          required = {
              'lib/p5_ia_preview.dart',
              'lib/product/p5_information_architecture/p5_models.dart',
              'lib/product/p5_information_architecture/p5_controller.dart',
              'lib/product/p5_information_architecture/p5_fixtures.dart',
              'lib/product/p5_information_architecture/p5_prototype.dart',
              'lib/product/p5_information_architecture/p5_task_workspaces.dart',
              'lib/product/p5_information_architecture/p5_verification_workspaces.dart',
              'lib/product/p5_information_architecture/p5_support_workspaces.dart',
              'lib/product/p5_information_architecture/p5_components.dart',
              'test/product/p5_information_architecture/p5_state_controller_test.dart',
              'test/product/p5_information_architecture/p5_source_boundary_test.dart',
              'test/product/p5_information_architecture/p5_verification_center_test.dart',
              'test/product/p5_information_architecture/p5_accessibility_test.dart',
              'test/product/p5_information_architecture/p5_navigation_test.dart',
              'release/evidence/P5-001/manifest.json',
              'release/evidence/P5-001/test-center-registration.json',
              'tool/worker_f_p5_ia.py',
              'tool/worker_f_p5_ia_test.py',
              'SOURCE_MANIFEST.sha256',
          }
          missing = sorted(path for path in required if not (project / path).is_file())
          if missing:
              raise RuntimeError(f'explicit publication paths missing: {missing}')

          elements = []
          for relative in sorted(exact):
              path = project / relative
              raw = path.read_bytes()
              blob = request('POST', 'git/blobs', {
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              })
              elements.append({
                  'path': relative,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob['sha'],
              })

          tree = request('POST', 'git/trees', {
              'base_tree': os.environ['CLEAN_BASE_TREE'],
              'tree': elements,
          })
          commit = request('POST', 'git/commits', {
              'message': 'P5-001: publish explicit information architecture source',
              'tree': tree['sha'],
              'parents': [carrier, worker_b],
          })
          print(f'WORKER_F_EXPLICIT_COMMIT={commit["sha"]}')
          print(f'WORKER_F_EXPLICIT_TREE={tree["sha"]}')
          print(f'WORKER_F_EXPLICIT_CARRIER={carrier}')
          print(f'WORKER_F_EXPLICIT_WORKER_B={worker_b}')
          print(f'WORKER_F_EXPLICIT_PATH_COUNT={len(elements)}')
          PY
