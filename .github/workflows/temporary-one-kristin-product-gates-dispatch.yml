name: temporary-one-kristin-full-test-diagnostic

on:
  push:
    branches:
      - automation/one-kristin-product-gates-dispatch-20260902
    paths:
      - .github/workflows/temporary-one-kristin-product-gates-dispatch.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact reconciliation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ba0ff2a6e40fa5e78f60d80c48ea812b9644085c
          fetch-depth: 1

      - name: Apply exhaustive source contract repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/product/source_contract_test.dart')
          text = path.read_text(encoding='utf-8')
          assert "'lib/product/run_steering_record.dart'," not in text
          assert "'lib/product/task_kernel/command_planning_context.dart'," not in text
          text = text.replace(
              "        'lib/product/run_steering.dart',\n",
              "        'lib/product/run_steering.dart',\n        'lib/product/run_steering_record.dart',\n",
              1,
          )
          text = text.replace(
              "        'lib/product/task_kernel/task_specification.dart',\n",
              "        'lib/product/task_kernel/command_planning_context.dart',\n        'lib/product/task_kernel/task_specification.dart',\n",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- test/product/source_contract_test.dart

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json

      - name: Install Linux desktop build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libstdc++-12-dev

      - name: Generate native runner
        shell: bash
        run: flutter create --project-name kristin_local_agent --org local.kristin --platforms=linux .

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Install protected-test dependency closure
        shell: bash
        run: |
          python tool/v71r12_bootstrap_hosted_python.py --project .
          npm ci --prefix automation_host --no-audit --no-fund

      - id: tests
        name: Run full Flutter suite after contract repair
        shell: bash
        run: |
          set +e
          flutter test --no-pub --concurrency=1 --machine > "$RUNNER_TEMP/flutter-test.jsonl" 2>&1
          rc=$?
          set -e
          echo "test_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Flutter test exit code: $rc"

      - name: Extract compact failure summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw_path = Path(os.environ['RUNNER_TEMP']) / 'flutter-test.jsonl'
          summary_path = Path(os.environ['RUNNER_TEMP']) / 'failure-summary.txt'
          tests = {}
          failures = []
          parse_misses = []

          if raw_path.exists():
              for raw in raw_path.read_text(encoding='utf-8', errors='replace').splitlines():
                  try:
                      event = json.loads(raw)
                  except json.JSONDecodeError:
                      if raw.strip():
                          parse_misses.append(raw)
                      continue
                  kind = event.get('type')
                  if kind == 'testStart':
                      test = event.get('test') or {}
                      tests[test.get('id')] = {
                          'name': test.get('name'),
                          'url': test.get('url'),
                          'line': test.get('line'),
                      }
                  elif kind == 'error':
                      test = tests.get(event.get('testID'), {})
                      failures.append({
                          'name': test.get('name'),
                          'url': test.get('url'),
                          'line': test.get('line'),
                          'error': event.get('error'),
                          'stack': event.get('stackTrace'),
                      })

          out = []
          if failures:
              out.append(f'FAILURE_EVENTS={len(failures)}')
              for index, failure in enumerate(failures, 1):
                  out.append(f'--- FAILURE {index} ---')
                  out.append(f"TEST: {failure.get('name') or '<unknown>'}")
                  location = failure.get('url') or '<unknown>'
                  if failure.get('line') is not None:
                      location += f":{failure['line']}"
                  out.append(f'LOCATION: {location}')
                  out.append('ERROR:')
                  out.append(str(failure.get('error') or '<none>'))
                  stack = str(failure.get('stack') or '').splitlines()
                  if stack:
                      out.append('STACK_HEAD:')
                      out.extend(stack[:20])
          else:
              out.append('FAILURE_EVENTS=0')
              out.append('No structured error event was found.')

          if parse_misses:
              out.append('--- NON_JSON_TAIL ---')
              out.extend(parse_misses[-40:])

          summary = '\n'.join(out) + '\n'
          summary_path.write_text(summary, encoding='utf-8')
          print(summary)
          PY

      - name: Upload compact failure summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: one-kristin-flutter-failure-summary
          path: ${{ runner.temp }}/failure-summary.txt
          if-no-files-found: error
          retention-days: 7

      - name: Preserve test result
        if: always()
        shell: bash
        run: exit "${{ steps.tests.outputs.test_rc }}"
