name: temporary-one-kristin-product-gates-dispatch

on:
  push:
    branches:
      - automation/one-kristin-product-gates-dispatch-20260902
    paths:
      - .github/workflows/temporary-one-kristin-product-gates-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch product-gates on reconciliation ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches \
            -d '{"ref":"feat/one-kristin-live-continuation-reconciliation"}'
