name: temporary-dispatch-final-one-kristin

on:
  push:
    branches:
      - integration/one-kristin-convergence-qualified
    paths:
      - .github/workflows/temporary-dispatch-final-one-kristin.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout dispatcher branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove dispatcher from auxiliary branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-dispatch-final-one-kristin.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove final One-Kristin dispatcher'
          git push origin HEAD:integration/one-kristin-convergence-qualified

      - name: Dispatch protected product gates on final one-commit head
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_ref='feat/one-kristin-convergence-qualified'
          expected_head='a047e52a66a0e73a4c6e2e27271ebfc2c57f05ce'
          actual_head="$(git ls-remote origin "refs/heads/${final_ref}" | awk '{print $1}')"
          test "$actual_head" = "$expected_head"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"feat/one-kristin-convergence-qualified"}'
