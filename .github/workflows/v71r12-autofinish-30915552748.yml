name: TEMP Repair PR14 P1 P2 QA Preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v71r12-autofinish-30915552748.yml

permissions:
  contents: write

concurrency:
  group: temp-repair-pr14-p1-p2-qa-preview
  cancel-in-progress: false

jobs:
  repair-pr14:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: merge/p1-p2-owner-risk-qa-preview
      EXPECTED_HEAD: da0578b1cbdcf25785f8b53eca6b5cd961dde3f5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: merge/p1-p2-owner-risk-qa-preview
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
          check-latest: false

      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git fetch origin "$TARGET_BRANCH"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Repair governed workflows and benchmark baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p2 = Path('.github/workflows/p2-owner-mode.yml')
          value = p2.read_text(encoding='utf-8')
          old = '''      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"
'''
          new = '''      - name: Install exact hash-locked hosted Python test dependencies
        shell: bash
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"
'''
          if value.count(old) < 1:
              raise SystemExit('P2 source-contract toolchain anchor missing')
          p2.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')

          promotion = Path('.github/workflows/p1-p2-owner-risk-promotion-v71r12.yml')
          value = promotion.read_text(encoding='utf-8')
          old = '''          if-no-files-found: error
          retention-days: 30
'''
          new = '''          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
'''
          if value.count(old) != 1:
              raise SystemExit(f'expected one shipment upload target, found {value.count(old)}')
          if 'include-hidden-files: true' in value:
              raise SystemExit('shipment visibility repair already present')
          promotion.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          python tool/benchmark_runner.py run \
            --project . \
            --mode portable \
            --output evals/results/p0_009_baseline.json \
            --markdown evals/results/P0_009_BASELINE.md
          python tool/p2_refresh_source_manifest.py .

      - name: Validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          python tool/benchmark_runner.py check --project .
          python tool/p0_010_generated_state_test.py --project .
          python tool/p2_source_inventory_test.py --project .
          git diff --check

          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 5
          test "${paths[0]}" = ".github/workflows/p1-p2-owner-risk-promotion-v71r12.yml"
          test "${paths[1]}" = ".github/workflows/p2-owner-mode.yml"
          test "${paths[2]}" = "SOURCE_MANIFEST.sha256"
          test "${paths[3]}" = "evals/results/P0_009_BASELINE.md"
          test "${paths[4]}" = "evals/results/p0_009_baseline.json"
          test "$(grep -c '^[[:space:]]*include-hidden-files: true$' .github/workflows/p1-p2-owner-risk-promotion-v71r12.yml)" -eq 1
          test "$(grep -c 'Install exact hash-locked hosted Python test dependencies' .github/workflows/p2-owner-mode.yml)" -eq 1

      - name: Commit exact PR repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kristin CI Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/p1-p2-owner-risk-promotion-v71r12.yml \
            .github/workflows/p2-owner-mode.yml \
            SOURCE_MANIFEST.sha256 \
            evals/results/P0_009_BASELINE.md \
            evals/results/p0_009_baseline.json
          git diff --cached --check
          git commit -m "fix(ci): refresh P2 preview gates and benchmark baseline"
          repaired_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git push origin "$repaired_commit:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$repaired_commit"
          echo "REPAIRED_PR14_COMMIT=$repaired_commit"
