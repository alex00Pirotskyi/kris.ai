name: TEMP V71-R12 Autofinish 30915552748

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v71r12-autofinish-30915552748.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: temp-v71r12-autofinish-30915552748
  cancel-in-progress: false

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TARGET_BRANCH: integration/p2-owner-risk-v71r12
      EXPECTED_HEAD: 7e02d2d4651d0871c4bf6c5a5b69cd7e5ad5927b
      GOVERNED_WORKFLOW: p1-p2-owner-risk-promotion-v71r12.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integration/p2-owner-risk-v71r12
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
          check-latest: false

      - name: Verify exact governed head
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git fetch origin "$TARGET_BRANCH"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Patch hidden artifact upload and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/p1-p2-owner-risk-promotion-v71r12.yml')
          value = workflow.read_text(encoding='utf-8')
          old = '''          if-no-files-found: error
          retention-days: 30
'''
          new = '''          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
'''
          if value.count(old) != 1:
              raise SystemExit(f'expected one upload target, found {value.count(old)}')
          if 'include-hidden-files: true' in value:
              raise SystemExit('artifact visibility repair already present unexpectedly')
          workflow.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          python tool/p2_refresh_source_manifest.py .
          git diff --check

          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = ".github/workflows/p1-p2-owner-risk-promotion-v71r12.yml"
          test "${paths[1]}" = "SOURCE_MANIFEST.sha256"
          test "$(grep -c '^[[:space:]]*include-hidden-files: true$' .github/workflows/p1-p2-owner-risk-promotion-v71r12.yml)" -eq 1
          sha256sum -c SOURCE_MANIFEST.sha256 --quiet

      - name: Commit and push exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kristin CI Autofinish"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/p1-p2-owner-risk-promotion-v71r12.yml SOURCE_MANIFEST.sha256
          git diff --cached --check
          git commit -m "fix(ci): include hidden V71-R12 shipment artifacts"
          repaired_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          echo "REPAIRED_COMMIT=$repaired_commit" >> "$GITHUB_ENV"
          git push origin "$repaired_commit:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$repaired_commit"

      - name: Dispatch exact governed tri-platform workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run "$GOVERNED_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"

          run_id=""
          for _ in $(seq 1 120); do
            run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$GOVERNED_WORKFLOW" \
                --branch "$TARGET_BRANCH" \
                --event workflow_dispatch \
                --limit 30 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$REPAIRED_COMMIT\") | .databaseId" \
                | head -n 1
            )"
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id"
          echo "GOVERNED_RUN_ID=$run_id" >> "$GITHUB_ENV"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify exact governed success and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/run.json"
          artifacts="$RUNNER_TEMP/artifacts.json"
          gh run view "$GOVERNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha,status,conclusion,jobs > "$receipt"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GOVERNED_RUN_ID/artifacts?per_page=100" > "$artifacts"

          python - "$receipt" "$artifacts" <<'PY'
          import json
          import os
          import pathlib
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          artifacts = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          expected_head = os.environ['REPAIRED_COMMIT']
          run_id = os.environ['GOVERNED_RUN_ID']

          if run.get('headSha') != expected_head:
              raise SystemExit('governed run head mismatch')
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('governed run did not complete successfully')
          jobs = {row.get('name'): row.get('conclusion') for row in run.get('jobs', [])}
          for name in ('owner-risk-windows', 'owner-risk-macos', 'owner-risk-linux', 'tri-platform-gate'):
              if jobs.get(name) != 'success':
                  raise SystemExit(f'{name}: expected success, observed {jobs.get(name)!r}')

          names = {row.get('name'): row for row in artifacts.get('artifacts', [])}
          for platform in ('windows', 'macos', 'linux'):
              name = f'kristin-p1-p2-owner-risk-{platform}-{run_id}-1'
              row = names.get(name)
              if not row or row.get('expired') is True or int(row.get('size_in_bytes', 0)) <= 0:
                  raise SystemExit(f'missing or empty artifact: {name}')
          print('AUTOFINISH_GOVERNED_VALIDATION=PASS')
          PY

          echo "REPAIRED_COMMIT=$REPAIRED_COMMIT"
          echo "GOVERNED_RUN_ID=$GOVERNED_RUN_ID"
          echo "AUTOFINISH_EXIT=0"
