name: Mission V1.5 Historical Audit Repair Adjust

on:
  push:
    branches:
      - agent/mission-execution-v15-gold
    paths:
      - '.github/workflows/mission-v15-history-audit-repair-adjust.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mission-execution-v15-gold
          fetch-depth: 0
      - name: Permit equality only for inactive historical semaphore expiry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/mission-v15-history-audit-repair.yml')
          text = path.read_text(encoding='utf-8')
          old = '              if refreshed < created or expires <= refreshed:\n                  raise ValueError("historical semaphore timestamp ordering invalid")\n'
          new = '              if refreshed < created or expires < refreshed:\n                  raise ValueError("historical semaphore timestamp ordering invalid")\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one historical semaphore ordering rule, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/mission-v15-history-audit-repair-adjust.yml
          git diff --check
          git fetch origin agent/mission-execution-v15-gold:refs/remotes/origin/agent/mission-execution-v15-gold
          test "$(git rev-parse refs/remotes/origin/agent/mission-execution-v15-gold)" = "$GITHUB_SHA"
          git config user.name 'mission-v15-history-audit-adjust'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/mission-v15-history-audit-repair.yml
          git commit -m 'fix(mission-v15): preserve released semaphore timestamp history'
          git push origin HEAD:refs/heads/agent/mission-execution-v15-gold
