name: Worker F MISSION-005 source recovery

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: worker-f-mission-005-source-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Reconcile current Worker B ancestry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Worker F MISSION-005 Recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/b/test-center-contracts-and-review
          git merge --no-ff --no-commit FETCH_HEAD
      - name: Materialize surviving reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python - <<'PY'
          from __future__ import annotations
          import textwrap
          from pathlib import Path
          import yaml

          payload = yaml.safe_load(Path('tool/worker_f_recovery_source.yml').read_text(encoding='utf-8'))
          step = next(item for item in payload['jobs']['prepare']['steps'] if item.get('name') == 'Materialize reviewed source and deterministic contracts')
          script = step['run']
          marker = "python - <<'PY'\n"
          start = script.index(marker) + len(marker)
          end = script.index("\n          PY", start)
          code = textwrap.dedent(script[start:end])
          replacements = {
              'd39fc0bad7980f35942dcdac170032722d765caa': '344a2c615a85a87cae7b54db72bc5590e5f180c8',
              '19d8e3e848e4ec937acb9f51ac65c07c044361f9': 'f9b8e871c254fb939a4089af28f63ff6b131768f',
              'a13aa488c7d0c35bb0105a8e739decf6b0e07280': 'f235dbb77741c429302e86744ad3859be04ffda9',
              '845b99d2e99a6d4cf31073d5b10099781eb4da63': '845b9539ee32013dac519eb835f6869e818be931',
              '642eb0eba2ca9b3ae16a1170915db03263b9ea59': '633e5226596ce373df90b149340c9f6d17a7dad3',
              'c4368ce437caa96a9b99b9505df981a0f9a7ad9b': 'f16ee298c8f5f755657b5515cbf56c1d679df032',
              '2e3b7d098696bd7f92d3830a506ff33fe7205e0f': 'c3d728294ace39abf82702cb4e9b36e9b3a6e233',
              'd95b658732943b5e6fa4f47ae1d7b958124f38eb': '7506299c039eba219821534598593d78176c20bd',
          }
          for old, new in replacements.items():
              code = code.replace(old, new)
          exec(compile(code, 'worker_f_recovered_materializer.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Repair current Test Center and P8 hierarchy integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path('.')
          registry_path = root / 'config/test_center_registry.v1.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          test_ids = sorted(item['testId'] for item in registry['testCases'] if str(item.get('testId', '')).startswith('tc.p5-001.'))
          if len(test_ids) != 10:
              raise RuntimeError(f'expected 10 P5 test IDs, found {test_ids}')
          for case in registry['testCases']:
              if str(case.get('testId', '')).startswith('tc.p5-001.'):
                  case['roadmapTaskIds'] = ['P5-001']
          for profile in registry['projectTestProfiles']:
              if str(profile.get('stableCheckId', '')).startswith('tc.p5-001.'):
                  profile['evidenceDestination'] = 'release/evidence/P5-001/test-results.json'
                  profile['platforms'] = ['linux', 'macos', 'windows']
                  profile['mutationPolicy'] = 'NON_MUTATING'
          registry_path.write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          hierarchy_path = root / 'config/test_center_assurance_hierarchy.v1.json'
          hierarchy = json.loads(hierarchy_path.read_text(encoding='utf-8'))
          hierarchy['testBindings'] = [item for item in hierarchy['testBindings'] if not str(item.get('testId', '')).startswith('tc.p5-001.')]
          for test_id in test_ids:
              hierarchy['testBindings'].append({
                  'testId': test_id,
                  'levelId': 'unit',
                  'rationale': 'Deterministic in-memory presentation behavior capped at SOURCE_FOUNDATION support.',
              })
          hierarchy['testBindings'].sort(key=lambda item: item['testId'])
          hierarchy_path.write_text(json.dumps(hierarchy, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          checker_path = root / 'tool/worker_f_p5_ia.py'
          checker = checker_path.read_text(encoding='utf-8')
          checker = checker.replace(
              "profiles={p.get('profileId'):p for p in registry.get('projectTestProfiles',[]) if 'p5-001' in str(p.get('profileId',''))}",
              "profiles={p.get('stableCheckId'):p for p in registry.get('projectTestProfiles',[]) if str(p.get('stableCheckId','')).startswith('tc.p5-001.')}",
          )
          old = (
              "            for case in cases.values():\n"
              "              ids=case.get('projectProfileIds') or case.get('profileIds') or []\n"
              "              if len(ids)!=1 or ids[0] not in profiles: raise AssertionError(f'case profile mismatch: {case.get(\"testId\")}')\n"
          )
          new = (
              "            if set(cases) != set(profiles):\n"
              "              raise AssertionError('P5 case/profile identities differ')\n"
          )
          if old not in checker:
              raise RuntimeError('expected Worker F profile validation block was not found')
          checker = checker.replace(old, new)
          checker_path.write_text(checker, encoding='utf-8')

          workflow_path = root / '.github/workflows/worker-f-p5-001-information-architecture.yml'
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace('ubuntu-latest', 'ubuntu-24.04').replace('windows-latest', 'windows-2025').replace('macos-latest', 'macos-15')
          needle = '                    python tool/test_center_contracts.py check --project .\n'
          if needle in workflow and 'test_center_assurance_hierarchy.py check' not in workflow:
              workflow = workflow.replace(needle, needle + '                    python tool/test_center_assurance_hierarchy.py check --project .\n')
          workflow_path.write_text(workflow, encoding='utf-8')

          progress = root / 'docs/roadmap/progress/2026-08-06-mission-005-p5-001-recovery.md'
          progress.parent.mkdir(parents=True, exist_ok=True)
          progress.write_text(
              '# MISSION-005 / P5-001 recovery — 2026-08-06\n\n'
              'Recovered the ordinary P5-001 source candidate from surviving reviewed Git blobs, reconciled current Worker B/P8 ancestry, removed the self-publishing workflow chain, registered the stable IDs in the canonical Test Center and assurance hierarchy, and restored read-only exact-head validation. P5-002+, P22, runtime behavior, and production support remain out of scope.\n',
              encoding='utf-8',
          )
          PY
      - name: Validate recovered candidate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/p5_ia_preview.dart lib/product/p5_information_architecture test/product/p5_information_architecture
          flutter analyze
          flutter test test/product/p5_information_architecture/
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/worker_f_p5_ia.py manifest --project .
          python tool/worker_f_p5_ia.py manifest --project . --check
          python tool/worker_f_p5_ia.py check --project .
          python tool/worker_f_p5_ia_test.py
          python tool/roadmap_control.py validate --project . --strict
          python tool/generated_state_guard.py audit --project . --strict
          python tool/p1a_refresh_source_manifest.py .
          cp docs/roadmap/SOURCE_MANIFEST.sha256 /tmp/p5-source-manifest
          python tool/p1a_refresh_source_manifest.py .
          cmp /tmp/p5-source-manifest docs/roadmap/SOURCE_MANIFEST.sha256
          git diff --check
      - name: Publish ordinary source candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/worker-f-mission-005-recovery.yml tool/worker_f_recovery_source.yml
          git add -A
          git commit -m 'P5-001: recover information architecture source candidate'
          git push origin HEAD:refs/heads/agent/f/P5-001-information-architecture
