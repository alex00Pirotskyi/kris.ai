name: Mission V1.5 Scale Matrix

on:
  pull_request:
    paths:
      - 'tool/mission_runtime_model.py'
      - 'tool/mission_orchestrator.py'
      - 'tool/mission_v15_scale_test.py'
      - 'schemas/mission_work_order.schema.json'
      - 'schemas/mission_semaphore.schema.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale:
    strategy:
      fail-fast: false
      matrix:
        workers: [10, 25, 50, 100]
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      MISSION_V15_WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Assert exact source head
        shell: bash
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Compile scale/runtime controls
        run: >-
          python -m py_compile
          tool/mission_runtime_model.py
          tool/mission_orchestrator.py
          tool/mission_v15_scale_test.py
      - name: Simulate worker concurrency
        run: python tool/mission_v15_scale_test.py
      - name: Verify non-mutation
        shell: bash
        run: test -z "$(git status --porcelain=v1)"
