name: Owner P25 Benchmark Baseline Repair

on:
  push:
    branches:
      - automation/owner-recovery
    paths:
      - .github/workflows/owner-p25-benchmark-baseline-repair.yml

permissions:
  contents: write

concurrency:
  group: owner-p25-benchmark-baseline-repair
  cancel-in-progress: false

env:
  EXPECTED_P25_HEAD: 97c198e485058707f40cef87457f1811a0ae41dc
  EXPECTED_MAIN: 278aeccfa013411bc7cf23b4a34199718327f4b2
  EXPECTED_BASELINE_FINGERPRINT: 55f1209ed283da418b04e3062a8e465d1f9e7efb8d3f74cd57f37a9cd685f8be
  P25_BRANCH: agent/owner-p25-current-main

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact P25 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/owner-p25-current-main
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Verify exact publication preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_P25_HEAD}"
          test "$(git ls-remote origin "refs/heads/${P25_BRANCH}" | cut -f1)" = "${EXPECTED_P25_HEAD}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${EXPECTED_MAIN}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Extend P0-009 roadmap compatibility to canonical P25 roadmap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tool/p0_009_benchmark_test.py')
          text = path.read_text(encoding='utf-8')
          old = '''SUPPORTED_ROADMAP_VERSIONS = {
              "3.1.5-p0-009-initial-benchmark",
              "3.1.6-p0-010-generated-state-hygiene",
          }
          '''
          new = '''SUPPORTED_ROADMAP_VERSIONS = {
              "3.1.5-p0-009-initial-benchmark",
              "3.1.6-p0-010-generated-state-hygiene",
              "3.1.7-p25-prompt-studio-product-rescue",
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('P0-009 supported-roadmap anchor drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python3 -m py_compile tool/p0_009_benchmark_test.py
          git diff --check

      - name: Regenerate deterministic portable benchmark baseline
        shell: bash
        run: |
          set -euo pipefail
          python tool/benchmark_runner.py run --project . --mode portable --strict-infrastructure
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('evals/results/p0_009_baseline.json').read_text(encoding='utf-8'))
          expected = '55f1209ed283da418b04e3062a8e465d1f9e7efb8d3f74cd57f37a9cd685f8be'
          actual = report.get('resultFingerprint')
          if actual != expected:
              raise SystemExit(f'unexpected regenerated P0-009 fingerprint: {actual} != {expected}')
          if report.get('summary', {}).get('recordingStatus') != 'complete':
              raise SystemExit('regenerated P0-009 baseline is not complete')
          if report.get('claims', {}).get('baselineRecordedMeansProductReady') is not False:
              raise SystemExit('regenerated P0-009 baseline weakened claim boundary')
          PY
          git diff --check

      - name: Refresh canonical source manifest to repaired source truth
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/manifest.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --check

      - name: Validate P0-009 and generated-state integration
        shell: bash
        run: |
          set -euo pipefail
          python tool/benchmark_runner.py validate --project .
          python tool/benchmark_runner.py check --project .
          python tool/benchmark_runner_test.py
          python tool/p0_009_benchmark_test.py --project .
          python tool/p0_010_generated_state_test.py --project .
          python tool/generated_state_guard.py audit --project . --strict >/dev/null
          python tool/roadmap_control.py validate --project . --strict
          python tool/p25_prompt_studio_roadmap_test.py --project .
          git diff --check

      - name: Prove exact bounded repair scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff --name-only)
          printf '%s\n' "${paths[@]}"
          python3 - <<'PY'
          import subprocess

          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'SOURCE_MANIFEST.sha256',
              'evals/results/P0_009_BASELINE.md',
              'evals/results/p0_009_baseline.json',
              'tool/p0_009_benchmark_test.py',
          }
          if actual != expected:
              raise SystemExit(f'P25 P0-009 repair scope mismatch: actual={sorted(actual)} expected={sorted(expected)}')
          PY
          git diff --check
          test "$(git ls-remote origin "refs/heads/${P25_BRANCH}" | cut -f1)" = "${EXPECTED_P25_HEAD}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${EXPECTED_MAIN}"

      - name: Publish exact validated repair as fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'alex00Pirotskyi'
          git config user.email '177022051+alex00Pirotskyi@users.noreply.github.com'
          git add -- \
            SOURCE_MANIFEST.sha256 \
            evals/results/P0_009_BASELINE.md \
            evals/results/p0_009_baseline.json \
            tool/p0_009_benchmark_test.py
          git diff --cached --check
          git commit -m 'fix(p25): refresh deterministic P0-009 baseline'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_P25_HEAD}"
          remote="$(git ls-remote origin "refs/heads/${P25_BRANCH}" | cut -f1)"
          test "${remote}" = "${EXPECTED_P25_HEAD}"
          git push origin "HEAD:refs/heads/${P25_BRANCH}"
          git fetch origin "+refs/heads/${P25_BRANCH}:refs/remotes/origin/${P25_BRANCH}"
          test "$(git rev-parse "origin/${P25_BRANCH}")" = "${candidate}"
          echo "P25_BASELINE_REPAIRED_HEAD=${candidate}"
