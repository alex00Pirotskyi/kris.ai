name: P5-011 Rebased Finalize

on:
  pull_request:
    branches: [main]
    paths:
      - .repo-p5-011-rebase-finalize.py
      - .github/workflows/p5-011-rebase-finalize.yml
      - lib/product/capability_doctor.dart
      - lib/product/chat_studio.dart
      - lib/product/product_runtime.dart
      - test/product/p5_capability_doctor_test.dart

permissions:
  contents: write

concurrency:
  group: p5-011-rebased-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p5-011-capability-doctor-rebase-20260823
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Verify current-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Apply bounded P5-011 finalization
        shell: bash
        run: |
          set -euo pipefail
          python3 .repo-p5-011-rebase-finalize.py
          rm -f .repo-p5-011-rebase-finalize.py
          rm -f .github/workflows/p5-011-rebase-finalize.yml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format and refresh source manifest
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/product/capability_doctor.dart \
            lib/product/chat_studio.dart \
            lib/product/product_runtime.dart \
            test/product/p5_capability_doctor_test.dart \
            test/product/source_contract_test.dart
          python tool/p2_refresh_source_manifest.py .
          git add -A
      - name: Verify clean durable delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'SOURCE_MANIFEST.sha256',
              'lib/product/capability_doctor.dart',
              'lib/product/chat_studio.dart',
              'lib/product/product_runtime.dart',
              'test/product/p5_capability_doctor_test.dart',
              'test/product/source_contract_test.dart',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', 'origin/main', '--'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected P5-011 durable delta: {sorted(changed)}')
          PY
      - name: Focused P5-011 Doctor contract
        run: >-
          flutter test --no-pub --reporter expanded
          test/product/p5_capability_doctor_test.dart
      - name: Focused Runner convergence contract
        run: >-
          flutter test --no-pub --reporter expanded
          test/product/hf_runner_chat_convergence_test.dart
      - name: Source formatting contract
        run: python tool/dart_format_scope.py --check
      - name: Fatal static analysis
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos
      - name: Complete Flutter regression
        run: flutter test --no-pub --concurrency=1 --reporter expanded
      - name: Deterministic release validator
        run: python tool/validate_release.py
      - name: Publish clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(p5-011): finalize onboarding capability doctor'
          git push origin HEAD:agent/p5-011-capability-doctor-rebase-20260823
