name: Worker G MISSION-006 claim materializer

on:
  push:
    branches:
      - agent/anarchy-autonomous-worker-missions
    paths:
      - '.github/workflows/worker-g-mission-006-claim.yml'

permissions:
  contents: write

concurrency:
  group: worker-g-mission-006-claim
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/anarchy-autonomous-worker-missions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Require exact uncontended branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin agent/anarchy-autonomous-worker-missions
          test "$(git rev-parse refs/remotes/origin/agent/anarchy-autonomous-worker-missions)" = "${GITHUB_SHA}"
      - name: Materialize claim, coordination packet, and generated mission state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          config_path = Path('config/mission_execution.v1.json')
          payload = json.loads(config_path.read_text(encoding='utf-8'))
          claim = {
              'mission': 'MISSION-006',
              'worker': 'G',
              'branch': 'agent/g/mission-006-model-routing',
              'pr': 76,
              'head': 'fc62949503caad11a6edbeb65535d3d3409631f4',
              'tree': 'ef5d5ae584b1d823502bf6f2191ecf4285d36845',
              'status': 'CLAIMED',
              'current': 'P6-001 model registry v2 source foundation on the exact Worker B Test Center base; canonical registry extension requires Worker B exact-head review.',
              'exclusivePaths': [
                  '.github/workflows/worker-g*.yml',
                  'lib/ai/model/**',
                  'lib/ai/test_center/**',
                  'lib/product/model/**',
                  'lib/settings/model/**',
                  'release/evidence/P6-*/**',
                  'test/ai/model/**',
                  'test/product/model/**',
                  'tool/worker_g*.py',
              ],
          }
          claims = payload.setdefault('activeClaims', [])
          existing = [item for item in claims if item.get('mission') == 'MISSION-006']
          if existing and existing != [claim]:
              raise SystemExit(f'MISSION-006 already has a different claim: {existing!r}')
          payload['activeClaims'] = sorted(
              [item for item in claims if item.get('mission') != 'MISSION-006'] + [claim],
              key=lambda item: item['mission'],
          )
          payload['generatedAt'] = '2026-08-06T11:42:30Z'
          config_path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          coordination_path = Path(
              'docs/roadmap/missions/coordination/'
              'MISSION-006-P6-001-TEST-CENTER.json'
          )
          coordination_path.parent.mkdir(parents=True, exist_ok=True)
          coordination_path.write_text(
              json.dumps(
                  {
                      'schemaVersion': 1,
                      'coordinationId': 'MISSION-006-P6-001-TEST-CENTER',
                      'status': 'REQUESTED',
                      'requestedAt': '2026-08-06T11:42:30Z',
                      'requester': {
                          'mission': 'MISSION-006',
                          'worker': 'G',
                          'branch': 'agent/g/mission-006-model-routing',
                          'pullRequest': 76,
                          'observedHead': 'fc62949503caad11a6edbeb65535d3d3409631f4',
                          'observedTree': 'ef5d5ae584b1d823502bf6f2191ecf4285d36845',
                      },
                      'authorityOwner': {
                          'mission': 'MISSION-002',
                          'worker': 'B',
                          'branch': 'agent/b/test-center-contracts-and-review',
                          'pullRequest': 65,
                          'observedHead': '22a8ac34cbf9601100f60c4929198f15f3c60e52',
                          'observedTree': 'ef5d5ae584b1d823502bf6f2191ecf4285d36845',
                      },
                      'sharedPaths': ['config/test_center_registry.v1.json'],
                      'scope': 'Add only the P6-TC-001 Agent Quality & Model Routing module, stable test identity, non-mutating profile, and affected-path mapping for P6-001 model registry validation.',
                      'constraints': [
                          'Do not create a second Test Center or result vocabulary.',
                          'Do not alter existing Worker B stable IDs or assurance semantics.',
                          'Do not promote behavior, platform, capability, release, or GA support.',
                          'Worker B exact-commit/tree review is required before integration.',
                      ],
                      'authorityTransferred': False,
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python tool/mission_control.py --project . bootstrap
          python tool/mission_control.py --project . validate
          git rm -- .github/workflows/worker-g-mission-006-claim.yml
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          git diff --check
          git add -A -- .
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'MISSION-006: claim Worker G P6-001'
          git push origin HEAD:agent/anarchy-autonomous-worker-missions
