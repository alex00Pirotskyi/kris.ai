name: TEMP Worker E Unified Execution Validate

on:
  push:
    branches:
      - agent/e/mission-system-live-validate-1a04c186
    paths:
      - '.github/workflows/temp-worker-e-unified-execution-validate.yml'

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  control-planes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Assert bounded carrier
        shell: bash
        env:
          CARRIER_PATH: .github/workflows/temp-worker-e-unified-execution-validate.yml
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD)" = "$CARRIER_PATH"
      - name: Validate canonical mission-system head
        shell: bash
        env:
          SOURCE_SHA: 082b4e2b6c95b3f9d00f42f79b2aa035f43b116d
          SOURCE_TREE: b9b61b64f28b8c92eae768183e596a858b91db33
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}" || git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          python tool/mission_control.py --project . validate
          python tool/mission_control.py --project . status
          python tool/mission_control.py --project . bootstrap --check
          python tool/mission_control.py --project . resume --mission MISSION-010 --worker E
          git diff --check
          test -z "$(git status --porcelain=v1)"
      - name: Validate PR 78 delivery overlay
        shell: bash
        env:
          OVERLAY_SHA: ef18bdf4562ddff499af85f797accf5c77a94710
          OVERLAY_TREE: 9bd9c9512f21e41e75ab13e344ddfc1664be6530
        run: |
          set -euo pipefail
          git cat-file -e "$OVERLAY_SHA^{commit}" || git fetch --no-tags origin "$OVERLAY_SHA"
          git checkout --detach "$OVERLAY_SHA"
          test "$(git rev-parse HEAD)" = "$OVERLAY_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$OVERLAY_TREE"
          python tool/mission_delivery_control.py --project . work-id
          python -m py_compile tool/mission_delivery_lib.py tool/mission_delivery_checks.py tool/mission_delivery_live.py tool/mission_delivery_control.py tool/mission_delivery_control_test.py
          python -m unittest -v tool/mission_delivery_control_test.py
          python tool/mission_control.py --project . validate
          python tool/mission_delivery_control.py --project . validate
          python tool/mission_delivery_control.py --project . generate --check
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.before"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.before" SOURCE_MANIFEST.sha256
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          git diff --check
          test -z "$(git status --porcelain=v1)"

  live-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ef18bdf4562ddff499af85f797accf5c77a94710
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Run live mission audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tool/mission_delivery_control.py --project . live-audit --repo alex00Pirotskyi/kris.ai --output "$RUNNER_TEMP/mission-live-audit.json"
      - name: Upload live audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-e-live-audit-ef18bdf
          path: ${{ runner.temp }}/mission-live-audit.json
          if-no-files-found: warn
          retention-days: 30

  p2-review-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ef18bdf4562ddff499af85f797accf5c77a94710
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Fetch exact PR 75 identities
        shell: bash
        env:
          BASE_SHA: 89a15332019c73675a19cdacd7021fae2199d75e
          HEAD_SHA: 139ce09edceaab2c9b24bb3119c4e8c324c02e0a
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags origin "$BASE_SHA"
          git cat-file -e "$HEAD_SHA^{commit}" || git fetch --no-tags origin "$HEAD_SHA"
      - name: Check actual changed-file ownership
        shell: bash
        run: |
          python tool/mission_delivery_control.py --project . ownership \
            --mission MISSION-001 \
            --base 89a15332019c73675a19cdacd7021fae2199d75e \
            --head 139ce09edceaab2c9b24bb3119c4e8c324c02e0a \
            --head-branch agent/a/p2-004-measurement-contract-repair \
            --output "$RUNNER_TEMP/mission-ownership.json"
      - name: Calculate scoped review impact
        if: always()
        shell: bash
        run: |
          python tool/mission_delivery_control.py --project . review-impact \
            --base 89a15332019c73675a19cdacd7021fae2199d75e \
            --head 139ce09edceaab2c9b24bb3119c4e8c324c02e0a \
            --output "$RUNNER_TEMP/review-impact.json"
      - name: Upload ownership and review impact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-e-p2-review-controls-139ce09
          path: |
            ${{ runner.temp }}/mission-ownership.json
            ${{ runner.temp }}/review-impact.json
          if-no-files-found: warn
          retention-days: 30
