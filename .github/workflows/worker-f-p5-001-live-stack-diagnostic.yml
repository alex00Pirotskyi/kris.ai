name: Worker F P5-001 Live Stack Diagnostic

on:
  pull_request:
    branches:
      - agent/b/test-center-contracts-and-review
    types:
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-f-p5-001-live-stack-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  WORK_EXECUTION_ID: WRK-20260806T201211Z-19E2373A
  WORKER_B_BRANCH: agent/b/test-center-contracts-and-review
  MISSION_BRANCH: agent/anarchy-autonomous-worker-missions
  DELIVERY_OVERLAY_BRANCH: agent/mission-delivery-enforcement-v1
  DIAGNOSTIC_WORKFLOW: .github/workflows/worker-f-p5-001-live-stack-diagnostic.yml

jobs:
  diagnose:
    name: Build and validate unpushed live-stack candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact Worker F carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture exact source identities
        id: identities
        shell: bash
        run: |
          set -euo pipefail
          worker_f_head="$(git rev-parse HEAD)"
          worker_f_tree="$(git rev-parse 'HEAD^{tree}')"
          git fetch origin "$WORKER_B_BRANCH:refs/remotes/origin/$WORKER_B_BRANCH"
          worker_b_head="$(git rev-parse "origin/$WORKER_B_BRANCH")"
          worker_b_tree="$(git rev-parse "origin/$WORKER_B_BRANCH^{tree}")"
          {
            echo "worker_f_head=$worker_f_head"
            echo "worker_f_tree=$worker_f_tree"
            echo "worker_b_head=$worker_b_head"
            echo "worker_b_tree=$worker_b_tree"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            "WORK_EXECUTION_ID=$WORK_EXECUTION_ID" \
            "WORKER_F_HEAD=$worker_f_head" \
            "WORKER_F_TREE=$worker_f_tree" \
            "WORKER_B_HEAD=$worker_b_head" \
            "WORKER_B_TREE=$worker_b_tree" \
            > /tmp/worker-f-live-identities.txt

      - name: Preserve P5 shared-authority records
        shell: bash
        run: |
          set -euo pipefail
          cp config/test_center_registry.v1.json /tmp/worker-f-registry.json
          cp config/test_center_assurance_hierarchy.v1.json /tmp/worker-f-hierarchy.json

      - name: Merge live Worker B fail-closed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Worker F live-stack diagnostic'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-ff --no-commit "origin/$WORKER_B_BRANCH"
          merge_rc=$?
          set -e
          if [[ "$merge_rc" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            allowed=(
              SOURCE_MANIFEST.sha256
              config/test_center_registry.v1.json
              config/test_center_assurance_hierarchy.v1.json
              tool/test_center_assurance_hierarchy_test.py
              tool/test_center_assurance_semantics.py
            )
            for path in "${conflicts[@]}"; do
              ok=false
              for expected in "${allowed[@]}"; do
                if [[ "$path" == "$expected" ]]; then ok=true; break; fi
              done
              if [[ "$ok" != true ]]; then
                echo "Unplanned merge conflict: $path" >&2
                exit 1
              fi
              git checkout --theirs -- "$path"
              git add -- "$path"
            done
          fi
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo 'Unresolved conflicts remain' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Reapply only granted P5 Test Center records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, value):
              Path(path).write_text(
                  json.dumps(value, indent=2, ensure_ascii=False) + '\n',
                  encoding='utf-8',
                  newline='\n',
              )

          current = load('config/test_center_registry.v1.json')
          source = load('/tmp/worker-f-registry.json')
          selectors = {
              'testModules': lambda item: item.get('moduleId') == 'tm.p5-information-architecture',
              'testCases': lambda item: str(item.get('testId', '')).startswith('tc.p5-001.'),
              'projectTestProfiles': lambda item: str(item.get('stableCheckId', '')).startswith('tc.p5-001.'),
              'affectedTestMappings': lambda item: str(item.get('mappingId', '')).startswith('affected.p5-001.'),
          }
          identity = {
              'testModules': 'moduleId',
              'testCases': 'testId',
              'projectTestProfiles': 'stableCheckId',
              'affectedTestMappings': 'mappingId',
          }
          for key, selector in selectors.items():
              records = [item for item in source.get(key, []) if selector(item)]
              existing = {str(item.get(identity[key])) for item in current.get(key, [])}
              for item in records:
                  item_id = str(item.get(identity[key]))
                  if item_id not in existing:
                      current.setdefault(key, []).append(item)
                      existing.add(item_id)
          write('config/test_center_registry.v1.json', current)

          current = load('config/test_center_assurance_hierarchy.v1.json')
          source = load('/tmp/worker-f-hierarchy.json')
          existing = {str(item.get('testId')) for item in current.get('testBindings', [])}
          for item in source.get('testBindings', []):
              test_id = str(item.get('testId', ''))
              if test_id.startswith('tc.p5-001.') and test_id not in existing:
                  current.setdefault('testBindings', []).append(item)
                  existing.add(test_id)
          write('config/test_center_assurance_hierarchy.v1.json', current)
          PY

      - name: Remove known undeclared and temporary paths
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$DIAGNOSTIC_WORKFLOW"
          rm -f docs/roadmap/progress/2026-08-05-p5-001-information-architecture.md
          rm -f docs/roadmap/progress/2026-08-06-mission-005-p5-001-recovery.md
          git add -A

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Set up locked Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Install governed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python tool/v71r12_bootstrap_hosted_python.py --project .
          flutter pub get

      - name: Validate Worker B and P5 contracts
        shell: bash
        run: |
          set -euo pipefail
          python tool/roadmap_control.py validate --project . --strict
          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/test_center_contracts_test.py
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/test_center_assurance_hierarchy.py check-report --project . --report release/evidence/TEST_CENTER/P8-001/fixtures/assurance-execution-report.pass.json
          python -m unittest -v tool/test_center_assurance_hierarchy_test.py
          python tool/worker_f_p5_ia.py manifest --project .
          python tool/worker_f_p5_ia.py manifest --project . --check
          python tool/worker_f_p5_ia.py check --project .
          python tool/worker_f_p5_ia_test.py

      - name: Validate Flutter and affected shell contracts
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed \
            lib/p5_ia_preview.dart \
            lib/product/p5_information_architecture \
            test/product/p5_information_architecture
          flutter analyze
          flutter test test/product/p5_information_architecture/
          flutter test test/product/source_contract_test.dart
          while IFS= read -r test_path; do
            if [[ -n "$test_path" ]]; then flutter test "$test_path"; fi
          done < <(
            find test -type f \( \
              -iname '*p2_app_shell*test.dart' -o \
              -iname '*p2_owner*test.dart' -o \
              -iname '*chat_studio*test.dart' \
            \) | sort
          )

      - name: Generate canonical source manifest twice
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/SOURCE_MANIFEST.first.sha256
          python tool/p1a_refresh_source_manifest.py .
          cmp /tmp/SOURCE_MANIFEST.first.sha256 SOURCE_MANIFEST.sha256
          python tool/generated_state_guard.py audit --project . --strict
          git diff --check
          git add -A

      - name: Create unpushed two-parent candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'P5-001: diagnose live Test Center stack'
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          parent_count="$(git rev-list --parents -n 1 HEAD | wc -w)"
          if [[ "$parent_count" -ne 3 ]]; then
            echo "Expected two-parent candidate, got word count $parent_count" >&2
            exit 1
          fi
          {
            echo "candidate_sha=$candidate_sha"
            echo "candidate_tree=$candidate_tree"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            "CANDIDATE_SHA=$candidate_sha" \
            "CANDIDATE_TREE=$candidate_tree" \
            >> /tmp/worker-f-live-identities.txt

      - name: Checkout current mission control and delivery overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MISSION_BRANCH }}
          path: _mission_system
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout PR 78 delivery overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DELIVERY_OVERLAY_BRANCH }}
          path: _delivery_overlay
          fetch-depth: 1
          persist-credentials: false

      - name: Run actual ownership and review-impact checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/worker-f-live-stack
          cp -a _mission_system/docs/roadmap/missions ./docs/roadmap/
          cp _delivery_overlay/config/mission_delivery.v1.json config/mission_delivery.v1.json
          cp _delivery_overlay/tool/mission_delivery_lib.py tool/mission_delivery_lib.py
          cp _delivery_overlay/tool/mission_delivery_checks.py tool/mission_delivery_checks.py
          cp _delivery_overlay/tool/mission_delivery_live.py tool/mission_delivery_live.py
          cp _delivery_overlay/tool/mission_delivery_control.py tool/mission_delivery_control.py
          cp _delivery_overlay/schemas/mission_delivery_record.v1.schema.json schemas/mission_delivery_record.v1.schema.json

          set +e
          python tool/mission_delivery_control.py --project . ownership \
            --mission MISSION-005 \
            --base "${{ steps.identities.outputs.worker_b_head }}" \
            --head "${{ steps.candidate.outputs.candidate_sha }}" \
            --head-branch agent/f/P5-001-information-architecture \
            --output /tmp/worker-f-live-stack/ownership.json \
            > /tmp/worker-f-live-stack/ownership.stdout.txt 2>&1
          ownership_rc=$?
          set -e
          python tool/mission_delivery_control.py --project . review-impact \
            --base "${{ steps.identities.outputs.worker_b_head }}" \
            --head "${{ steps.candidate.outputs.candidate_sha }}" \
            --output /tmp/worker-f-live-stack/review-impact.json \
            > /tmp/worker-f-live-stack/review-impact.stdout.txt

          printf '%s\n' "$ownership_rc" > /tmp/worker-f-live-stack/ownership.exit-code.txt
          cp /tmp/worker-f-live-identities.txt /tmp/worker-f-live-stack/identities.txt
          cp SOURCE_MANIFEST.sha256 /tmp/worker-f-live-stack/SOURCE_MANIFEST.sha256
          cp release/evidence/P5-001/manifest.json /tmp/worker-f-live-stack/P5-001-manifest.json
          git diff --name-status "${{ steps.identities.outputs.worker_b_head }}..${{ steps.candidate.outputs.candidate_sha }}" -- \
            > /tmp/worker-f-live-stack/changed-files.txt
          git log -1 --format=fuller "${{ steps.candidate.outputs.candidate_sha }}" \
            > /tmp/worker-f-live-stack/candidate-commit.txt
          sha256sum /tmp/worker-f-live-stack/* \
            > /tmp/worker-f-live-stack/SHA256SUMS

          {
            echo '## Worker F live-stack diagnostic'
            echo
            echo "- Work execution: \`$WORK_EXECUTION_ID\`"
            echo "- Worker F carrier: \`${{ steps.identities.outputs.worker_f_head }}\`"
            echo "- Live Worker B: \`${{ steps.identities.outputs.worker_b_head }}\`"
            echo "- Unpushed candidate: \`${{ steps.candidate.outputs.candidate_sha }}\`"
            echo "- Candidate tree: \`${{ steps.candidate.outputs.candidate_tree }}\`"
            echo "- Ownership exit code: \`$ownership_rc\`"
            echo '- Candidate pushed: no'
            echo '- Support promotion: none'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact diagnostic artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-f-p5-001-live-stack-${{ steps.candidate.outputs.candidate_sha }}
          path: /tmp/worker-f-live-stack
          if-no-files-found: error
          retention-days: 14
