name: P3-005 Repaired Source Materializer

on:
  push:
    branches:
      - 'agent/product/p3-005-verified-visual-fallback'
    paths:
      - '.github/workflows/p3-005-transport-repair.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install exact Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '24.18.0'
          check-latest: false
          cache: npm
          cache-dependency-path: automation_host/package-lock.json
      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Build, validate, and publish only product source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          source = Path('.github/workflows/p3-browser-runtime.yml').read_text(
              encoding='utf-8'
          )
          start_token = (
              '          cat > "$RUNNER_TEMP/p3-005-patch.py.gz.b64" '
              "<<'PAYLOAD'\n"
          )
          end_token = '\n          PAYLOAD\n'
          start = source.index(start_token) + len(start_token)
          end = source.index(end_token, start)
          encoded = ''.join(
              line.strip() for line in source[start:end].splitlines()
          )
          patch = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          old = '      action: action,\n'
          new = '      action: action!,\n'
          if patch.count(old) != 1:
              raise SystemExit(
                  'expected exactly one nullable action constructor binding; '
                  f'found {patch.count(old)}'
              )
          patch = patch.replace(old, new, 1)
          Path('/tmp/p3-005-patch.py').write_text(patch, encoding='utf-8')
          PY
          python3 /tmp/p3-005-patch.py
          node --check automation_host/src/browser-runtime.mjs
          npm ci --prefix automation_host --ignore-scripts --no-audit --no-fund
          npm test --prefix automation_host
          flutter pub get
          dart fix --apply
          dart format \
            lib/product/browser/browser_runtime.dart \
            test/product/browser/browser_runtime_process_test.dart
          flutter test test/product/browser
          flutter analyze --fatal-infos --fatal-warnings
          git diff --check
          python3 - <<'PY'
          import subprocess

          expected = {
              'automation_host/src/browser-runtime.mjs',
              'automation_host/src/browser-runtime.test.mjs',
              'lib/product/browser/browser_runtime.dart',
              'test/product/browser/browser_runtime_process_test.dart',
          }
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', 'HEAD', '--name-only'], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f'P3-005 product scope mismatch '
                  f'actual={sorted(actual)} expected={sorted(expected)}'
              )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            automation_host/src/browser-runtime.mjs \
            automation_host/src/browser-runtime.test.mjs \
            lib/product/browser/browser_runtime.dart \
            test/product/browser/browser_runtime_process_test.dart
          git diff --cached --check
          git commit -m 'feat(p3-005): add verified visual fallback'
          git push origin HEAD:refs/heads/agent/product/p3-005-verified-visual-fallback
