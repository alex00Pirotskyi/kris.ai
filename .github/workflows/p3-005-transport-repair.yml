name: P3-005 Transport Repair

on:
  push:
    branches:
      - 'agent/product/p3-005-verified-visual-fallback'
    paths:
      - '.github/workflows/p3-005-transport-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Repair pinned Node action and remove repair transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/p3-browser-runtime.yml')
          source = target.read_text(encoding='utf-8')
          bad = 'actions/setup-node@48b55a011bda9f5d6aeb4d4f8c696479add0b2'
          good = 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e'
          if source.count(bad) != 1:
              raise SystemExit(f'expected one bad setup-node ref, found {source.count(bad)}')
          target.write_text(source.replace(bad, good, 1), encoding='utf-8')
          Path('.github/workflows/p3-005-transport-repair.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/p3-browser-runtime.yml .github/workflows/p3-005-transport-repair.yml
          git diff --cached --check
          git commit -m 'fix(p3-005): repair pinned Node setup action'
          git push origin HEAD:refs/heads/agent/product/p3-005-verified-visual-fallback
