name: P3-005 Analyzer Diagnostic

on:
  push:
    branches:
      - 'agent/product/p3-005-verified-visual-fallback'
    paths:
      - '.github/workflows/p3-005-transport-repair.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Reproduce exact analyzer warning with source context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          source = Path('.github/workflows/p3-browser-runtime.yml').read_text(
              encoding='utf-8'
          )
          start_token = (
              '          cat > "$RUNNER_TEMP/p3-005-patch.py.gz.b64" '
              "<<'PAYLOAD'\n"
          )
          end_token = '\n          PAYLOAD\n'
          start = source.index(start_token) + len(start_token)
          end = source.index(end_token, start)
          encoded = ''.join(
              line.strip() for line in source[start:end].splitlines()
          )
          patch = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          old = '      action: action,\n'
          if patch.count(old) != 1:
              raise SystemExit(f'nullable action anchor count={patch.count(old)}')
          patch = patch.replace(old, '      action: action!,\n', 1)
          Path('/tmp/p3-005-patch.py').write_text(patch, encoding='utf-8')
          PY
          python3 /tmp/p3-005-patch.py
          flutter pub get
          dart format \
            lib/product/browser/browser_runtime.dart \
            test/product/browser/browser_runtime_process_test.dart
          echo '--- generated browser_runtime.dart lines 1210-1235 ---'
          nl -ba lib/product/browser/browser_runtime.dart | sed -n '1210,1235p'
          echo '--- analyzer ---'
          flutter analyze --fatal-infos --fatal-warnings
