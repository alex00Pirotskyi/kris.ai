name: Worker F P8 Windows path compatibility repair

on:
  push:
    branches:
      - agent/f/P5-001-information-architecture

permissions:
  contents: write

concurrency:
  group: worker-f-p8-windows-path-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install governed Python dependencies
        shell: bash
        run: python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Apply and validate platform-neutral P8 path contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          semantics_path = Path('tool/test_center_assurance_semantics.py')
          semantics = semantics_path.read_text(encoding='utf-8')
          old = 'contract["executionReportSchema"] != str(REPORT_SCHEMA)'
          new = 'contract["executionReportSchema"] != REPORT_SCHEMA.as_posix()'
          if semantics.count(old) != 1:
              raise RuntimeError('expected one platform-dependent execution schema comparison')
          semantics_path.write_text(semantics.replace(old, new), encoding='utf-8')

          test_path = Path('tool/test_center_assurance_hierarchy_test.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              'from pathlib import Path\n',
              'from pathlib import Path, PureWindowsPath\n',
              1,
          )
          test = test.replace(
              'import test_center_assurance_hierarchy as H  # noqa:E402\n',
              'import test_center_assurance_hierarchy as H  # noqa:E402\nimport test_center_assurance_semantics as S  # noqa:E402\n',
              1,
          )
          marker = "    def test_32_deterministic_regressions(self):\n"
          regression = '''    def test_execution_schema_path_is_platform_neutral(self):\n        original=S.REPORT_SCHEMA\n        try:\n            S.REPORT_SCHEMA=PureWindowsPath(r"schemas\\test_center_assurance_execution_report.v1.json")\n            report=self.docs(copy.deepcopy(self.h))\n            self.assertEqual(report['executionReportSchema'],'schemas/test_center_assurance_execution_report.v1.json')\n        finally:\n            S.REPORT_SCHEMA=original\n\n'''
          if marker not in test or 'test_execution_schema_path_is_platform_neutral' in test:
              raise RuntimeError('P8 path regression insertion point drifted')
          test_path.write_text(test.replace(marker, regression + marker, 1), encoding='utf-8')
          PY
          rm .github/workflows/worker-f-p8-windows-path-repair.yml
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/test_center_assurance_hierarchy.py check-report --project . --report release/evidence/TEST_CENTER/P8-001/fixtures/assurance-execution-report.pass.json
          python -m unittest -v tool/test_center_assurance_hierarchy_test.py
          python tool/worker_f_p5_ia.py manifest --project . --check
          python tool/worker_f_p5_ia.py check --project .
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 /tmp/worker-f-p8-source-manifest
          python tool/p1a_refresh_source_manifest.py .
          cmp /tmp/worker-f-p8-source-manifest SOURCE_MANIFEST.sha256
          git diff --check
      - name: Create clean repair commit object
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLEAN_BASE_TREE: 7db4dfcd03439f2891fb6b57c813106549571f37
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path

          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          def request(method,path,payload=None):
              body=None; headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
              if payload is not None:
                  body=json.dumps(payload).encode(); headers['Content-Type']='application/json'
              req=urllib.request.Request(f'{api}/{path}',data=body,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=120) as response: return json.load(response)
          elements=[]
          for relative in ('tool/test_center_assurance_semantics.py','tool/test_center_assurance_hierarchy_test.py','SOURCE_MANIFEST.sha256'):
              raw=Path(relative).read_bytes()
              blob=request('POST','git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              elements.append({'path':relative,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=request('POST','git/trees',{'base_tree':os.environ['CLEAN_BASE_TREE'],'tree':elements})
          commit=request('POST','git/commits',{'message':'P8-001: normalize execution schema path across platforms','tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          print(f'WORKER_F_P8_REPAIR_COMMIT={commit["sha"]}')
          print(f'WORKER_F_P8_REPAIR_TREE={tree["sha"]}')
          PY
