name: Worker G P6-001 materializer

on:
  push:
    branches:
      - agent/g/mission-006-model-routing
    paths:
      - '.github/workflows/worker-g-p6-001-materialize.yml'

permissions:
  contents: write

concurrency:
  group: worker-g-p6-001-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BRANCH: agent/g/mission-006-model-routing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/g/mission-006-model-routing
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Require exact uncontended branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin "${BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${BRANCH})" = "${GITHUB_SHA}"
      - name: Materialize reviewed source and canonical Test Center registration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          part_dir = Path('release/evidence/P6-001/.materializer')
          parts = sorted(part_dir.glob('part-*.txt'))
          expected_names = [f'part-{index:02d}.txt' for index in range(1, 14)]
          if [part.name for part in parts] != expected_names:
              raise SystemExit('materializer packet is incomplete or reordered')
          packet = base64.b64decode(''.join(part.read_text().strip() for part in parts))
          expected_digest = '28afbd774c79d462724d74bcaf24d29a668737429ba41f33d63c72618fa59b8b'
          actual_digest = hashlib.sha256(packet).hexdigest()
          if actual_digest != expected_digest:
              raise SystemExit(
                  f'packet digest mismatch: {actual_digest} != {expected_digest}'
              )
          allowed = {
              'lib/product/model/model.dart',
              'lib/product/model/model_registry.dart',
              'release/evidence/P6-001/README.md',
              'release/evidence/P6-001/source-contract.json',
              'test/product/model/model_registry_test.dart',
              'tool/worker_g_p6_001_materialize.py',
          }
          with tarfile.open(fileobj=io.BytesIO(packet), mode='r:gz') as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != allowed:
                  raise SystemExit(f'unexpected packet paths: {sorted(names ^ allowed)}')
              for member in members:
                  if (
                      not member.isfile()
                      or member.name.startswith('/')
                      or '..' in Path(member.name).parts
                  ):
                      raise SystemExit(f'unsafe packet member: {member.name}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'missing packet content: {member.name}')
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())
          PY
          python tool/worker_g_p6_001_materialize.py
      - name: Format and validate the focused source packet
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/product/model test/product/model
          flutter analyze
          flutter test test/product/model
          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/test_center_contracts_test.py
      - name: Remove materializer and refresh the canonical source manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/worker-g-p6-001-materialize.yml
          git rm -r -- release/evidence/P6-001/.materializer
          rm -f tool/worker_g_p6_001_materialize.py
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          git diff --check
      - name: Commit exact validated source packet
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${BRANCH})" = "${GITHUB_SHA}"
          git add -A -- .
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(p6-001): add fail-closed model registry v2'
          git push origin "HEAD:${BRANCH}"
