name: Wave A canonical manifest finalizer

on:
  push:
    branches:
      - perf/cache-sqlite-foundation
    paths:
      - .github/workflows/wave-a-manifest-finalizer.yml

permissions:
  contents: write

concurrency:
  group: wave-a-manifest-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Regenerate, verify, self-remove, and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/wave-a-manifest-finalizer.yml
          python3 tool/p1a_refresh_source_manifest.py .
          actual="$(sha256sum SOURCE_MANIFEST.sha256 | awk '{print $1}')"
          expected="6542e2962e5e6cdf8fbdb4d783f317d9e913ad8146a4d21f84a645b423fa5b55"
          test "$actual" = "$expected"
          git add -A
          changed="$(git diff --cached --name-only)"
          test "$changed" = $'.github/workflows/wave-a-manifest-finalizer.yml\nSOURCE_MANIFEST.sha256'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(perf): refresh canonical source manifest"
          git push origin "HEAD:${GITHUB_REF_NAME}"
