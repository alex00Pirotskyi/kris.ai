name: Worker G P6 release output restore

on:
  push:
    branches:
      - agent/g/mission-006-model-routing
    paths:
      - '.github/workflows/worker-g-p6-release-output-restore.yml'

permissions:
  contents: write

concurrency:
  group: worker-g-p6-release-output-restore
  cancel-in-progress: false

jobs:
  restore-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WORKER_G_BRANCH: agent/g/mission-006-model-routing
      WORKER_B_BRANCH: agent/b/test-center-contracts-and-review
      EXPECTED_G_PARENT: 5a56560b2994ffd20fccc398abb13ce379bb0526
      EXPECTED_B_HEAD: 800643bb5898a80ee3843f83f7657411183a9e6a
      PORTABLE_SOURCE_COMMIT: 88405ba55ca7336d05797ec801f579704436f94c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/g/mission-006-model-routing
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Require exact uncontended candidate and authority heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_G_PARENT}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin "${WORKER_G_BRANCH}" "${WORKER_B_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_G_BRANCH})" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_B_BRANCH})" = "${EXPECTED_B_HEAD}"
          git cat-file -e "${PORTABLE_SOURCE_COMMIT}^{commit}"
      - name: Restore tri-platform-stable release result bytes
        shell: bash
        run: |
          set -euo pipefail
          git checkout "${PORTABLE_SOURCE_COMMIT}" -- \
            release/FILE_ADAPTER_RESULTS.json \
            release/KNOWLEDGE_MEMORY_V2_RESULTS.json
          git rm -- .github/workflows/worker-g-p6-release-output-restore.yml
          cp release/FILE_ADAPTER_RESULTS.json "$RUNNER_TEMP/FILE_ADAPTER_RESULTS.canonical.json"
          cp release/KNOWLEDGE_MEMORY_V2_RESULTS.json "$RUNNER_TEMP/KNOWLEDGE_MEMORY_V2_RESULTS.canonical.json"
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Prove release validation without retaining timing side effects
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tool/worker_g_p6_release_inventory_test.py
          python tool/validate_release.py --skip-tests
          cp "$RUNNER_TEMP/FILE_ADAPTER_RESULTS.canonical.json" release/FILE_ADAPTER_RESULTS.json
          cp "$RUNNER_TEMP/KNOWLEDGE_MEMORY_V2_RESULTS.canonical.json" release/KNOWLEDGE_MEMORY_V2_RESULTS.json
          cmp "$RUNNER_TEMP/FILE_ADAPTER_RESULTS.canonical.json" release/FILE_ADAPTER_RESULTS.json
          cmp "$RUNNER_TEMP/KNOWLEDGE_MEMORY_V2_RESULTS.canonical.json" release/KNOWLEDGE_MEMORY_V2_RESULTS.json
      - name: Prove Test Center checks preserve the restored outputs
        shell: bash
        run: |
          set -euo pipefail
          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/test_center_contracts_test.py
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/test_center_assurance_hierarchy.py check-report \
            --project . \
            --report release/evidence/TEST_CENTER/P8-001/fixtures/assurance-execution-report.pass.json
          python -m unittest -v tool/test_center_assurance_hierarchy_test.py
          cmp "$RUNNER_TEMP/FILE_ADAPTER_RESULTS.canonical.json" release/FILE_ADAPTER_RESULTS.json
          cmp "$RUNNER_TEMP/KNOWLEDGE_MEMORY_V2_RESULTS.canonical.json" release/KNOWLEDGE_MEMORY_V2_RESULTS.json
      - name: Verify canonical source manifest and focused P6 suites
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          git diff --exit-code -- SOURCE_MANIFEST.sha256
          python tool/dart_format_scope.py --check
          flutter test --no-pub --concurrency=1 --reporter expanded \
            test/product/model/model_registry_test.dart \
            test/product/source_contract_test.dart
          python - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(
                  ['git', 'diff', 'HEAD', '--name-only'],
                  text=True,
              ).splitlines()
          )
          expected = {
              '.github/workflows/worker-g-p6-release-output-restore.yml',
              'release/FILE_ADAPTER_RESULTS.json',
              'release/KNOWLEDGE_MEMORY_V2_RESULTS.json',
          }
          if changed != expected:
              raise SystemExit(
                  f'unexpected tracked mutations after validation: {sorted(changed)!r}'
              )
          PY
          git diff --check
      - name: Commit exact portable repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${WORKER_G_BRANCH}" "${WORKER_B_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_G_BRANCH})" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_B_BRANCH})" = "${EXPECTED_B_HEAD}"
          git add -A -- .
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(p6-001): restore portable release validation outputs'
          git push origin "HEAD:${WORKER_G_BRANCH}"
