name: Mission Delivery Materializer

on:
  push:
    branches:
      - agent/anarchy-autonomous-worker-missions
      - agent/mission-delivery-enforcement-v1
    paths:
      - '.github/workflows/mission-delivery-materialize.yml'
      - 'config/mission_delivery.v1.json'
      - 'docs/roadmap/missions/delivery/records/**'
      - 'tool/mission_delivery_*.py'
      - 'tool/mission_materialize_safe.py'
      - 'tool/mission_runtime_control.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mission-delivery-materializer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'alex00Pirotskyi/kris.ai'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Require exact triggering head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Compile mission controls
        run: >-
          python -m py_compile
          tool/mission_control.py
          tool/mission_materialize_safe.py
          tool/mission_runtime_control.py
          tool/mission_delivery_lib.py
          tool/mission_delivery_checks.py
          tool/mission_delivery_live.py
          tool/mission_delivery_control.py
          tool/mission_delivery_strict.py
          tool/mission_delivery_metrics_safe.py
          tool/mission_delivery_control_test.py
      - name: Validate durable-claim materializer
        run: python tool/mission_materialize_safe.py --project . validate
      - name: Validate helper runtime
        run: python tool/mission_runtime_control.py --project . validate
      - name: Run legacy delivery regressions
        run: python -m unittest -v tool/mission_delivery_control_test.py
      - name: Validate strict delivery provenance
        run: python tool/mission_delivery_strict.py --project . validate
      - name: Materialize delivery metrics
        shell: bash
        run: |
          set -euo pipefail
          python tool/mission_delivery_metrics_safe.py --project .
          python tool/mission_delivery_metrics_safe.py --project . --check
      - name: Refresh source manifest twice
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          git diff --check
      - name: Publish generated delivery views
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain=v1)"; then
            echo "Delivery views and source manifest are already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/roadmap/missions/DELIVERY_METRICS.json \
            docs/roadmap/missions/DELIVERY_DASHBOARD.md \
            SOURCE_MANIFEST.sha256
          git diff --cached --check
          git commit -m 'ANARCHY: materialize mission delivery metrics'
          git push origin HEAD:${{ github.ref_name }}
