name: V71-R12 Validation Monitor

on:
  workflow_run:
    workflows:
      - TEMP V71-R12 Tri-Platform Repair 30889417167
      - P1 P2 Owner-Risk Promotion V71-R12
    types:
      - completed
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish-repair-candidate:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'TEMP V71-R12 Tri-Platform Repair 30889417167' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'fix/v71r12-triplatform-30889417167'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download, verify and publish validated repair candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_BASE: a0f7e7a709e79625aa86e4b35fe9c66c8b046ddf
          TARGET_REF: refs/heads/validated/v71r12-p1-p2-final
        run: |
          set -euo pipefail

          handoff="$RUNNER_TEMP/v71r12-handoff"
          mkdir -p "$handoff"

          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "v71r12-triplatform-candidate-$SOURCE_RUN_ID" \
            --dir "$handoff"

          (
            cd "$handoff"
            sha256sum -c KRISTIN_V71R12_TRIPLATFORM_REPAIR.sha256
          )

          mapfile -t metadata < <(
            python - "$handoff/KRISTIN_V71R12_TRIPLATFORM_REPAIR.json" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8-sig"))
          print(data["baseCommit"])
          print(data["candidateCommit"])
          print(data["candidateTree"])
          print(str(data["candidateParentExact"]).lower())
          print(str(data["triPlatformRunMustSucceedBeforePromotion"]).lower())
          print(str(data["formalSecurityCompletion"]).lower())
          PY
          )

          base="${metadata[0]}"
          candidate="${metadata[1]}"
          tree="${metadata[2]}"

          test "$base" = "$EXPECTED_BASE"
          test "${metadata[3]}" = true
          test "${metadata[4]}" = true
          test "${metadata[5]}" = false

          git bundle verify "$handoff/KRISTIN_V71R12_TRIPLATFORM_REPAIR.bundle"
          git fetch "$handoff/KRISTIN_V71R12_TRIPLATFORM_REPAIR.bundle" \
            "+refs/heads/v71r12-triplatform-candidate:refs/remotes/v71r12-monitor/candidate"

          test "$(git rev-parse refs/remotes/v71r12-monitor/candidate)" = "$candidate"
          test "$(git rev-parse "$candidate^")" = "$base"
          test "$(git rev-parse "$candidate^{tree}")" = "$tree"

          existing="$(git ls-remote origin "$TARGET_REF" | awk '{print $1}')"
          if [ -n "$existing" ] && [ "$existing" != "$candidate" ]; then
            echo "Validated target already points to unexpected commit: $existing" >&2
            exit 1
          fi

          git push origin "$candidate:$TARGET_REF"

          echo "VALIDATED_CANDIDATE=$candidate"
          echo "VALIDATED_TREE=$tree"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID"

  finalize-owner-risk-p2:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'P1 P2 Owner-Risk Promotion V71-R12' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'integration/p2-owner-risk-v71r12'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_HEAD: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      OWNER_RISK_ATTESTATION: I ACCEPT OWNER-RISK P1/P2 SECURITY WAIVER; FORMAL SECURITY EVIDENCE AND INDEPENDENT HUMAN REVIEW WERE NOT PERFORMED
      RELEASE_ATTESTATION: I ACCEPT TRI-PLATFORM CI AS THE PROMOTION GATE; MANUAL QA AND RELEASE SIGNING REMAIN REQUIRED BEFORE PUBLIC GA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
          check-latest: false

      - id: toolchains
        shell: bash
        run: python tool/p2_toolchains.py --project . --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: config/p2.node-version
          cache: npm
          cache-dependency-path: automation_host/package-lock.json

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.toolchains.outputs.flutter }}
          channel: stable
          cache: true

      - name: Install exact closure prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev build-essential xvfb
          python tool/p1a_bootstrap_hosted_cmake.py --project .
          python tool/v71r12_bootstrap_hosted_python.py --project .

      - name: Download and verify exact tri-platform shipment artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ROOT: ${{ runner.temp }}/v71r12-platform-artifacts
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT"

          for platform in windows macos linux; do
            gh run download "$SOURCE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "kristin-p1-p2-owner-risk-${platform}-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}" \
              --dir "$ARTIFACT_ROOT/$platform"
          done

          source_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          echo "SOURCE_TREE=$source_tree" >> "$GITHUB_ENV"

          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["ARTIFACT_ROOT"])
          source_head = os.environ["SOURCE_HEAD"]
          source_tree = os.environ["SOURCE_TREE"]
          run_id = int(os.environ["SOURCE_RUN_ID"])
          run_attempt = str(os.environ["SOURCE_RUN_ATTEMPT"])
          platforms = ["windows", "macos", "linux"]
          artifacts = []

          def digest(path: pathlib.Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          for platform in platforms:
              directory = root / platform
              result_paths = list(directory.rglob(f"result-{platform}.json"))
              archive_paths = list(directory.rglob("KRISTIN_P1_P2_OWNER_RISK_QA_*.zip"))
              if len(result_paths) != 1 or len(archive_paths) != 1:
                  raise SystemExit(f"{platform}: exact result/archive pair required")
              result_path = result_paths[0]
              archive = archive_paths[0]
              sidecar = archive.with_name(archive.name + ".sha256")
              if not sidecar.is_file():
                  raise SystemExit(f"{platform}: checksum sidecar missing")
              observed = digest(archive)
              fields = sidecar.read_text(encoding="utf-8").strip().split()
              if len(fields) != 2 or fields[0] != observed or fields[1] != archive.name:
                  raise SystemExit(f"{platform}: checksum sidecar mismatch")
              result = json.loads(result_path.read_text(encoding="utf-8"))
              expected = {
                  "bundleType": "kristin-p1-p2-owner-risk-qa-v71r12",
                  "platform": platform,
                  "sourceCommit": source_head,
                  "sourceTree": source_tree,
                  "p2PackageSha256": "7b0d77d8956f05ff907ca7463b0d787dcebf93a60426aab105be2b610e6072b0",
                  "workflowRunId": str(run_id),
                  "workflowRunAttempt": run_attempt,
                  "securityEvidenceWaived": True,
                  "formalSecurityCompletion": False,
                  "productionReleaseEligible": False,
                  "qaShipmentEligible": True,
                  "allThreePlatformArtifactsRequired": True,
              }
              for key, value in expected.items():
                  if result.get(key) != value:
                      raise SystemExit(
                          f"{platform}: result {key} mismatch: {result.get(key)!r}"
                      )
              if result.get("archiveSha256") != observed:
                  raise SystemExit(f"{platform}: result archive digest mismatch")
              if int(result.get("bytes", -1)) != archive.stat().st_size:
                  raise SystemExit(f"{platform}: result archive size mismatch")
              artifacts.append(
                  {
                      "platform": platform,
                      "archive": str(archive.resolve()),
                      "sha256": observed,
                      "bytes": archive.stat().st_size,
                  }
              )

          readiness = {
              "schemaVersion": "1.0.0",
              "status": "passed",
              "qaShipmentReady": True,
              "allPlatformsPassed": platforms,
              "securityEvidenceWaived": True,
              "formalSecurityCompletion": False,
              "productionReleaseEligible": False,
              "manualQaStillRequired": True,
              "sourceCommit": source_head,
              "sourceTree": source_tree,
              "workflowRunId": run_id,
              "workflowRunAttempt": int(run_attempt),
              "artifacts": artifacts,
          }
          readiness_path = root / "SHIPMENT_READINESS.json"
          readiness_path.write_text(
              json.dumps(readiness, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          pass_record = {
              "schemaVersion": "1.0.0",
              "validationType": "v71r12-integration-triplatform-pass",
              "validatedHeadSha": source_head,
              "validatedTreeSha": source_tree,
              "workflowRunId": run_id,
              "workflowRunAttempt": int(run_attempt),
              "workflowName": "P1 P2 Owner-Risk Promotion V71-R12",
              "branch": "integration/p2-owner-risk-v71r12",
              "conclusion": "success",
              "securityEvidenceWaived": True,
              "formalSecurityCompletion": False,
              "productionReleaseEligible": False,
          }
          path = pathlib.Path("release/evidence/P2/v71r12-integration-pass.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(pass_record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(json.dumps(readiness, indent=2, sort_keys=True))
          PY

      - name: Finalize P2 under the governed owner-risk waiver
        shell: bash
        env:
          SHIPMENT_READINESS: ${{ runner.temp }}/v71r12-platform-artifacts/SHIPMENT_READINESS.json
        run: |
          set -euo pipefail
          short="${SOURCE_HEAD:0:12}"
          closure_branch="closure/v71r12-p1-p2-$short"

          git config user.name "Kristin P1/P2 Finalizer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$closure_branch"

          python tool/v71_finalize_owner_risk_p2.py \
            --project . \
            --shipment-readiness "$SHIPMENT_READINESS" \
            --source-commit "$SOURCE_HEAD" \
            --source-tree "$SOURCE_TREE" \
            --owner alex00Pirotskyi \
            --owner-risk-attestation "$OWNER_RISK_ATTESTATION" \
            --release-attestation "$RELEASE_ATTESTATION"

          python tool/p2_refresh_source_manifest.py .
          git diff --check
          git add -A
          git diff --cached --check
          git commit -m "feat(p2): finalize owner-risk closure and unblock P3"

          closure_commit="$(git rev-parse HEAD)"
          closure_tree="$(git rev-parse HEAD^{tree})"
          echo "CLOSURE_BRANCH=$closure_branch" >> "$GITHUB_ENV"
          echo "CLOSURE_COMMIT=$closure_commit" >> "$GITHUB_ENV"
          echo "CLOSURE_TREE=$closure_tree" >> "$GITHUB_ENV"

      - name: Run full finalized-tree closure gate
        shell: bash
        run: |
          set -euo pipefail
          python tool/v71r12_exact_source_gate.py \
            --project . \
            --timeout-minutes 180 \
            --json-output "$RUNNER_TEMP/v71r12-finalized-source-gate.json"
          python tool/p2_exit_gate_test.py \
            --project . \
            --owner-risk-waiver \
            --reviewed-sha "$SOURCE_HEAD"
          git diff --exit-code
          git diff --check
          test "$(git rev-parse HEAD)" = "$CLOSURE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$CLOSURE_TREE"
          echo "FULL_EXIT=0"

      - name: Publish protected P1/P2 closure pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          existing="$(git ls-remote origin "refs/heads/$CLOSURE_BRANCH" | awk '{print $1}')"
          if [ -n "$existing" ] && [ "$existing" != "$CLOSURE_COMMIT" ]; then
            echo "Closure branch already points to unexpected commit: $existing" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$CLOSURE_BRANCH"

          pr_url="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$CLOSURE_BRANCH" \
              --base main \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"
          if [ -z "$pr_url" ]; then
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --head "$CLOSURE_BRANCH" \
                --base main \
                --title "P1/P2 closure: owner-risk tri-platform validation" \
                --body "Finalizes TRAIN-02 using the governed owner-risk waiver after exact Windows, macOS, and Linux validation. Formal security completion, public-GA eligibility, and production release eligibility remain false. Marks P3 dependency satisfied and TRAIN-03 ready."
            )"
          fi
          echo "CLOSURE_PR=$pr_url"
          echo "CLOSURE_COMMIT=$CLOSURE_COMMIT"
          echo "FULL_EXIT=0"

  prepare-p3-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create P3 development branch only from closed P2 authority
        shell: bash
        env:
          TARGET_REF: refs/heads/integration/p3-browser-foundation
        run: |
          set -euo pipefail

          if ! python - <<'PY'
          import json
          import pathlib

          manifest_path = pathlib.Path("release/evidence/P2/manifest.json")
          trains_path = pathlib.Path("docs/roadmap/integration_trains.json")
          if not manifest_path.is_file() or not trains_path.is_file():
              raise SystemExit(1)
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          trains = json.loads(trains_path.read_text(encoding="utf-8"))
          rows = {
              row.get("id"): row
              for row in trains.get("trains", [])
              if isinstance(row, dict)
          }
          valid = (
              manifest.get("status") == "passed"
              and manifest.get("completionClaim") is True
              and manifest.get("p3DependencySatisfied") is True
              and manifest.get("promotionMode") == "owner-risk-security-waiver"
              and manifest.get("productionReleaseEligible") is False
              and rows.get("TRAIN-02", {}).get("status") == "DONE"
              and rows.get("TRAIN-03", {}).get("status") == "READY"
          )
          raise SystemExit(0 if valid else 1)
          PY
          then
            echo "P2 closure is not yet authoritative; P3 branch creation skipped."
            exit 0
          fi

          existing="$(git ls-remote origin "$TARGET_REF" | awk '{print $1}')"
          if [ -z "$existing" ]; then
            git push origin "$GITHUB_SHA:$TARGET_REF"
            echo "P3_BRANCH_CREATED=$GITHUB_SHA"
          else
            git fetch origin "$TARGET_REF:refs/remotes/origin/p3-browser-foundation"
            if git merge-base --is-ancestor "$GITHUB_SHA" "$existing"; then
              echo "P3 branch already contains the authoritative P2 closure: $existing"
            elif [ "$existing" = "$GITHUB_SHA" ]; then
              echo "P3 branch already points to the authoritative P2 closure."
            else
              echo "Existing P3 branch does not contain the authoritative P2 closure: $existing" >&2
              exit 1
            fi
          fi
