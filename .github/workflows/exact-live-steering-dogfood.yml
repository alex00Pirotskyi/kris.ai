name: exact-live-steering-dogfood
on:
  push:
    branches:
      - automation/one-kristin-product-gates-dispatch-20260902
    paths:
      - .github/workflows/exact-live-steering-dogfood.yml
      - tool/ci/exact_live_steering_dogfood_v2.dart
permissions:
  contents: read
jobs:
  dogfood-linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: e59583b170b2a5d333a3c6eff5243725daef0d54
          fetch-depth: 1
      - name: Bind exact candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "e59583b170b2a5d333a3c6eff5243725daef0d54"
          git diff --exit-code
      - name: Check out external dogfood driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: automation/one-kristin-product-gates-dispatch-20260902
          path: _dogfood_harness
          sparse-checkout: |
            tool/ci/exact_live_steering_dogfood_v2.dart
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Install Linux native dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
      - name: Generate native runner
        run: flutter create --project-name kristin_local_agent --org local.kristin --platforms=linux .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Materialize external driver without changing tracked product source
        shell: bash
        run: |
          cp _dogfood_harness/tool/ci/exact_live_steering_dogfood_v2.dart tool/exact_live_steering_dogfood.dart
          test "$(git rev-parse HEAD)" = "e59583b170b2a5d333a3c6eff5243725daef0d54"
          git diff --exit-code -- lib test pubspec.yaml SOURCE_MANIFEST.sha256
      - name: Analyze external driver against exact candidate APIs
        run: flutter analyze --no-pub tool/exact_live_steering_dogfood.dart
      - name: Run native approval-steering-continuation dogfood
        shell: bash
        run: |
          xvfb-run -a flutter run -d linux --debug --no-pub -t tool/exact_live_steering_dogfood.dart
      - name: Verify receipt and exact tracked product tree
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "e59583b170b2a5d333a3c6eff5243725daef0d54"
          git diff --exit-code -- lib test pubspec.yaml SOURCE_MANIFEST.sha256
          if [ -f exact-live-steering-dogfood.json ]; then
            cat exact-live-steering-dogfood.json
          fi
          test -f exact-live-steering-dogfood.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('exact-live-steering-dogfood.json').read_text())
          assert data['candidateSha'] == 'e59583b170b2a5d333a3c6eff5243725daef0d54'
          assert data['result'] == 'pass'
          assert data['sequence'] == [
              'native_approval',
              'live_steering',
              'safe_boundary_interruption',
              'linked_continuation',
              'no_inherited_authority',
              'explicit_continuation_approval',
          ]
          assert data['noInheritedAuthority']['activeGrantCountBeforeExplicitApproval'] == 0
          PY
      - name: Upload exact dogfood receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-live-steering-dogfood-e59583b1
          path: exact-live-steering-dogfood.json
          if-no-files-found: warn
          retention-days: 7
