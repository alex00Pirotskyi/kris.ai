name: Qwen Phone Control Materializer

on:
  push:
    branches:
      - 'automation/qwen-phone-control-materializer'
    paths:
      - '.github/workflows/qwen-phone-control-materialize.yml'

permissions:
  contents: write

concurrency:
  group: qwen-phone-control-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out phone-control candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Apply phone URL discovery repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          controller_path = Path('tool/kris_qwen_control.py')
          controller = controller_path.read_text(encoding='utf-8')
          old = (
              "        for _, _, addresses in socket.gethostbyname_ex(name):\n"
              "            candidates.update(addresses)\n"
          )
          new = (
              "        _, _, addresses = socket.gethostbyname_ex(name)\n"
              "        candidates.update(addresses)\n"
          )
          if old not in controller:
              raise SystemExit('expected broken gethostbyname_ex loop not found')
          controller_path.write_text(
              controller.replace(old, new, 1),
              encoding='utf-8',
              newline='\n',
          )

          test_path = Path('tool/kris_qwen_control_test.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '\n\nclass WorkerVersionTest(unittest.TestCase):\n'
          if marker not in tests:
              raise SystemExit('worker-version test marker not found')
          regression = (
              "\n"
              "    def test_phone_url_discovery_handles_gethostbyname_ex_result(self) -> None:\n"
              "        with mock.patch.object(control.socket, 'gethostname', return_value='kris-server'):\n"
              "            with mock.patch.object(\n"
              "                control.socket,\n"
              "                'gethostbyname_ex',\n"
              "                return_value=('kris-server', [], ['10.0.0.2', '10.0.0.3']),\n"
              "            ):\n"
              "                with mock.patch.object(\n"
              "                    control.socket, 'socket', side_effect=OSError('offline')\n"
              "                ):\n"
              "                    urls = control.discover_phone_urls(8090)\n"
              "        self.assertEqual(\n"
              "            urls,\n"
              "            ['http://10.0.0.2:8090', 'http://10.0.0.3:8090'],\n"
              "        )\n"
          )
          test_path.write_text(
              tests.replace(marker, regression + marker, 1),
              encoding='utf-8',
              newline='\n',
          )
          PY

      - name: Validate Qwen phone control and refresh exact source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control_test.py
          python3 tool/kris_qwen_control_test.py
          python3 - <<'PY'
          import json
          import subprocess

          raw = subprocess.check_output(
              ['python3', 'tool/kris_qwen_worker.py', 'version'],
              text=True,
          )
          value = json.loads(raw)
          version = str(value.get('scriptVersion') or '').strip()
          if not version:
              raise SystemExit(f'worker version JSON missing scriptVersion: {raw!r}')
          if subprocess.check_output(
              ['python3', 'tool/kris_qwen_control.py', '--version'],
              text=True,
          ).strip() != '2.1.0':
              raise SystemExit('unexpected Qwen controller version')
          print(f'validated worker version {version}')
          PY
          test -x run_my_server.py
          bash -n tool/install_kris_qwen_control_systemd.sh
          bash -n tool/run_kris_qwen_phone_control.sh
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python3 tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          python3 tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          python3 - <<'PY'
          import subprocess

          expected = {
              'SOURCE_MANIFEST.sha256',
              'tool/kris_qwen_control.py',
              'tool/kris_qwen_control_test.py',
          }
          actual = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f'phone-control materializer scope mismatch actual={sorted(actual)} '
                  f'expected={sorted(expected)}'
              )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            SOURCE_MANIFEST.sha256 \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control_test.py
          git diff --cached --check
          git commit -m 'fix(qwen): repair phone URL discovery'
          git push origin HEAD:refs/heads/agent/qwen-phone-control
