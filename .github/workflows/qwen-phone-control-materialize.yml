              '            self.assertEqual(result["workerVersion"], "5.4.1")\n'
              '            self.assertEqual(result["controllerVersion"], "2.2.1")\n',
              "candidate version assertions",
          )
          replace_count(
              "tool/kris_qwen_control_compat_test.py",
