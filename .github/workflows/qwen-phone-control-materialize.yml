name: Qwen Phone Control Materializer

on:
  push:
    branches:
      - 'automation/qwen-phone-control-materializer'
    paths:
      - '.github/workflows/qwen-phone-control-materialize.yml'

permissions:
  contents: write

concurrency:
  group: qwen-phone-control-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact phone-control candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Verify clean always-on rollout surface
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/qwen-always-on-materialize.yml
          test ! -e .github/workflows/qwen-always-on-anchor-audit.yml
          for path in \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_test.py \
            tool/kris_qwen_control_compat_test.py; do
            test -f "$path"
          done
          git diff --check

      - name: Compile and execute deterministic worker 5.3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_test.py \
            tool/kris_qwen_control_compat_test.py
          python3 tool/kris_qwen_control_test.py
          python3 tool/kris_qwen_control_compat_test.py
          python3 tool/kris_qwen_worker_v53.py version | tee "$RUNNER_TEMP/worker-version.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib

          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'worker-version.json').read_text(encoding='utf-8'))
          if value.get('scriptVersion') != '5.3.0':
              raise SystemExit(f"executed worker entry is not 5.3.0: {value}")

          deterministic = pathlib.Path('tool/kris_qwen_worker_v53.py').read_text(encoding='utf-8')
          policy = pathlib.Path('tool/kris_qwen_v53_policy.py').read_text(encoding='utf-8')
          legacy = pathlib.Path('tool/kris_qwen_worker.py.compat.py').read_text(encoding='utf-8')
          required = (
              'TARGET_VERSION = "5.3.0"',
              'def wake_pending_reviews',
              'def ensure_continuous_integration_lane',
              'def ensure_continuous_validation_lane',
              'def seed_continuous_product_work',
              'RED_ALERT_FRONTIER',
              'Successful work chains immediately',
              '+refs/pull/*/head:refs/remotes/origin/pull/*/head',
          )
          combined = deterministic + '\n' + policy
          missing = [marker for marker in required if marker not in combined]
          if missing:
              raise SystemExit(f'missing always-on worker markers: {missing}')
          if 'kris_qwen_worker_v53.py' not in legacy:
              raise SystemExit('legacy worker entry no longer forwards to deterministic 5.3')
          print('QWEN_WORKER_5_3_ALWAYS_ON_PASS')
          PY

      - name: Verify launcher binds exact always-on entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('run_my_server.py').read_text(encoding='utf-8')
          required = (
              'kris_qwen_control.py.compat.py',
              'kris_qwen_worker_v53.py',
              'kris_qwen_v53_policy.py',
              'KRIS_QWEN_WORKER_SCRIPT',
              'KRIS_QWEN_AUTO_UPDATE',
              'KRIS_QWEN_AUTO_UPDATE_SECONDS',
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'launcher missing always-on bindings: {missing}')
          print('QWEN_ALWAYS_ON_LAUNCHER_PASS')
          PY

      - name: Refresh operator truth text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/KRIS_QWEN_SERVER_CONTROL.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Always-on Product protocol (executed worker 5.3.0 / controller 2.2.0)'
          if marker not in text:
              text += '''\n\n## Always-on Product protocol (executed worker 5.3.0 / controller 2.2.0)\n\nThe phone launcher executes `tool/kris_qwen_worker_v53.py` as worker **5.3.0**. Normal `IDLE` is a red-alert condition, not a steady state: successful jobs chain immediately, eligible context-independent R1 review Work Orders are woken into dispatchable authority, HELPER_READY source is integrated through a bounded canonical Product lane, and continuous integration is settled only after exact tri-platform Product CI. When the governed frontier is genuinely empty, the worker may create one bounded `PRODUCT_DEFECT_REPAIR` Work Order only against an existing ACTIVE canonical Product PR through the existing Mission Runtime CAS path. Path authority, WIP limits, semaphores, exact-head review independence, canonical Product CI, and protected-main restrictions remain fail-closed. Documentation-only, formatting-only, governance-only and no-op continuous work are explicitly disallowed.\n\nThe launcher executes `tool/kris_qwen_control.py.compat.py` as controller **2.2.0**. Automatic update supervision is enabled by default and checks the configured remote Qwen branch every 30 seconds. A newer remote head reuses the existing safe Fetch latest + run path: graceful worker drain, dirty-checkout refusal, fast-forward-only update, refreshed worker version probe and stack restart. If the worker exits unexpectedly while the tracked branch is current, the controller starts it again. `kris_qwen_worker_v53.py` is recognized as the managed worker process, so duplicate auto-starts are rejected. A deliberate Safe stop pauses both automatic restart and automatic update until Run current Qwen or Fetch latest + run Qwen is requested.\n\nThe large retained base worker/controller source files still carry their prior 5.2.2/2.1.0 labels during this compatibility rollout. Those labels are not the phone execution version; the launcher binds the 5.3/2.2 entries above.\n'''
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Regenerate manifest twice and validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python3 tool/p1a_refresh_source_manifest.py .
          cmp -s "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          python3 tool/p1a_source_manifest_test.py .
          python3 tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          for path in \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_compat_test.py; do
            grep -F "$path" SOURCE_MANIFEST.sha256
          done
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          allowed = {'SOURCE_MANIFEST.sha256', 'docs/KRIS_QWEN_SERVER_CONTROL.md'}
          if not actual or 'SOURCE_MANIFEST.sha256' not in actual or not actual.issubset(allowed):
              raise SystemExit(f'finalization scope mismatch actual={sorted(actual)} allowed={sorted(allowed)}')
          PY

      - name: Publish validated always-on manifest candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256 docs/KRIS_QWEN_SERVER_CONTROL.md
          if git diff --cached --quiet; then
            echo 'QWEN_ALWAYS_ON_VALIDATED no publication required'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'feat(qwen): validate always-on phone execution'
          candidate="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/agent/qwen-phone-control
          git fetch origin '+refs/heads/agent/qwen-phone-control:refs/remotes/origin/agent/qwen-phone-control'
          remote="$(git rev-parse origin/agent/qwen-phone-control)"
          [[ "$remote" == "$candidate" ]]
          echo "QWEN_ALWAYS_ON_VALIDATED candidate=$candidate"
