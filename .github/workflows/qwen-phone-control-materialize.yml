name: Qwen Phone Control Materializer

on:
  push:
    branches:
      - 'automation/qwen-phone-control-materializer'
    paths:
      - '.github/workflows/qwen-phone-control-materialize.yml'

permissions:
  contents: write

concurrency:
  group: qwen-phone-control-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out phone-control candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Verify Qwen 5.2.2 compatibility source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control_test.py
          python3 tool/kris_qwen_control_test.py
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          source = pathlib.Path('tool/kris_qwen_worker.py').read_text(encoding='utf-8')
          if 'SCRIPT_VERSION = "5.2.2"' not in source:
              raise SystemExit('Qwen worker 5.2.2 marker missing')
          if 'parsed["expiresAt"] < parsed["refreshedAt"]' not in source:
              raise SystemExit('canonical historical semaphore comparison missing')
          if 'parsed["expiresAt"] <= parsed["refreshedAt"]' in source:
              raise SystemExit('obsolete strict historical semaphore comparison remains')

          raw = subprocess.check_output(['python3', 'tool/kris_qwen_worker.py', 'version'], text=True)
          if str(json.loads(raw).get('scriptVersion') or '').strip() != '5.2.2':
              raise SystemExit(f'unexpected worker version JSON: {raw!r}')
          compat = subprocess.check_output(['python3', 'tool/kris_qwen_worker.py.compat.py', 'version'], text=True)
          if str(json.loads(compat).get('scriptVersion') or '').strip() != '5.2.2':
              raise SystemExit(f'unexpected compatibility worker version JSON: {compat!r}')
          if subprocess.check_output(['python3', 'tool/kris_qwen_control.py', '--version'], text=True).strip() != '2.1.0':
              raise SystemExit('unexpected Qwen controller version')
          print('verified Qwen 5.2.2 and compatibility entry')
          PY
          test -x run_my_server.py
          test -x tool/run_kris_qwen_phone_control.sh
          bash -n tool/install_kris_qwen_control_systemd.sh
          bash -n tool/run_kris_qwen_phone_control.sh

      - name: Refresh exact source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python3 tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          python3 tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'SOURCE_MANIFEST.sha256'}
          if actual != expected:
              raise SystemExit(f'manifest refresh scope mismatch actual={sorted(actual)} expected={sorted(expected)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256
          git diff --cached --check
          git commit -m 'chore(qwen): refresh compatibility entry manifest'
          git push origin HEAD:refs/heads/agent/qwen-phone-control
