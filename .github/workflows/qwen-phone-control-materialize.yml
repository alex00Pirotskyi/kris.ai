# validation target: Qwen 5.3 never-idle / never-stop / self-healing phone execution
name: Qwen Phone Control Materializer

on:
  push:
    branches:
      - 'automation/qwen-phone-control-materializer'
    paths:
      - '.github/workflows/qwen-phone-control-materialize.yml'

permissions:
  contents: write

concurrency:
  group: qwen-phone-control-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact phone-control candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Verify clean always-on rollout surface
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/qwen-always-on-materialize.yml
          test ! -e .github/workflows/qwen-always-on-anchor-audit.yml
          for path in \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_test.py \
            tool/kris_qwen_control_compat_test.py; do
            test -f "$path"
          done
          git diff --check

      - name: Compile and execute deterministic worker 5.3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_test.py \
            tool/kris_qwen_control_compat_test.py
          python3 tool/kris_qwen_control_test.py
          python3 tool/kris_qwen_control_compat_test.py
          python3 tool/kris_qwen_worker_v53.py version | tee "$RUNNER_TEMP/worker-version.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib

          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'worker-version.json').read_text(encoding='utf-8'))
          if value.get('scriptVersion') != '5.3.0':
              raise SystemExit(f"executed worker entry is not 5.3.0: {value}")

          deterministic = pathlib.Path('tool/kris_qwen_worker_v53.py').read_text(encoding='utf-8')
          policy = pathlib.Path('tool/kris_qwen_v53_policy.py').read_text(encoding='utf-8')
          legacy = pathlib.Path('tool/kris_qwen_worker.py.compat.py').read_text(encoding='utf-8')
          required = (
              'TARGET_VERSION = "5.3.0"',
              'def wake_pending_reviews',
              'def ensure_continuous_integration_lane',
              'def ensure_continuous_validation_lane',
              'def seed_continuous_product_work',
              'CONTINUOUS_PRIMARY_CODE_PREFIXES',
              'CONTINUOUS_TOOL_DENY_PREFIXES',
              'RED_ALERT_FRONTIER',
              'RED_ALERT_HARD_ERROR',
              'RED_ALERT_MODEL_SERVER',
              '"managedServer": "RESTARTED"',
              'backoff = min(30, max(5, int(cfg.loop_sleep) * 5))',
              'stack stays alive',
              'Successful work chains immediately',
              '+refs/pull/*/head:refs/remotes/origin/pull/*/head',
          )
          combined = deterministic + '\n' + policy
          missing = [marker for marker in required if marker not in combined]
          if missing:
              raise SystemExit(f'missing always-on worker markers: {missing}')
          if 'persistent worker reached' in deterministic and 'persistent hard error recovery' not in deterministic:
              raise SystemExit('5.2 stack-termination path was not replaced by 5.3')
          if 'kris_qwen_worker_v53.py' not in legacy:
              raise SystemExit('legacy worker entry no longer forwards to deterministic 5.3')
          print('QWEN_WORKER_5_3_ALWAYS_ON_PASS')
          PY

      - name: Verify launcher binds exact always-on entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('run_my_server.py').read_text(encoding='utf-8')
          required = (
              'kris_qwen_control.py.compat.py',
              'kris_qwen_worker_v53.py',
              'kris_qwen_v53_policy.py',
              'KRIS_QWEN_WORKER_SCRIPT',
              'KRIS_QWEN_AUTO_UPDATE',
              'KRIS_QWEN_AUTO_UPDATE_SECONDS',
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'launcher missing always-on bindings: {missing}')
          print('QWEN_ALWAYS_ON_LAUNCHER_PASS')
          PY

      - name: Refresh operator truth text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/KRIS_QWEN_SERVER_CONTROL.md')
          text = path.read_text(encoding='utf-8')

          hard_truth = (
              'Repeated hard Work Order errors do not terminate the persistent stack. '
              'After the configured threshold, worker 5.3 reports `RED_ALERT_HARD_ERROR`, '
              'keeps the model/worker stack alive, and re-resolves within a maximum 30-second backoff.'
          )
          chaining_anchor = (
              'Successful Work Orders chain immediately. The normal 60-second inter-job sleep '
              'is removed by the 5.3 execution adapter.\n'
          )
          if hard_truth not in text:
              if chaining_anchor not in text:
                  raise SystemExit('operator docs always-on chaining anchor missing')
              text = text.replace(chaining_anchor, chaining_anchor + '\n' + hard_truth + '\n', 1)

          model_truth = (
              'In managed `stack` mode, worker 5.3 also supervises its `llama-server` child. '
              'A dead child is restarted before the next Work Order; an unreachable managed model '
              'endpoint is recycled through `RED_ALERT_MODEL_SERVER` recovery instead of leaving '
              'a live worker process attached to a dead model server.'
          )
          if model_truth not in text:
              anchor = hard_truth + '\n'
              if anchor not in text:
                  raise SystemExit('operator docs hard-error truth anchor missing')
              text = text.replace(anchor, anchor + '\n' + model_truth + '\n', 1)

          old_update = '''Every interval it resolves the remote head of the configured Qwen branch. If the remote head differs from the local checkout, controller 2.2 reuses the existing safe Fetch latest + run path:\n\n1. graceful worker drain;\n2. dirty-checkout refusal;\n3. fetch of the configured branch;\n4. fast-forward-only update;\n5. refreshed worker `version` probe;\n6. stack restart using the newly fetched worker entry.\n'''
          new_update = '''Every interval it resolves the remote head of the configured Qwen branch. If the remote head differs from the local checkout, controller 2.2 first validates the update **without draining the current Qwen worker**:\n\n1. dirty-checkout check;\n2. fetch of the configured branch without modifying the checkout;\n3. fast-forward ancestry validation.\n\nA dirty checkout reports `UPDATE_BLOCKED_DIRTY`; a divergent update reports `UPDATE_BLOCKED_NON_FAST_FORWARD`. In both cases the currently running Qwen worker is kept alive. Only a proven safe fast-forward update enters the existing controlled update path: graceful worker drain, fast-forward checkout update, refreshed worker `version` probe, and stack restart using the newly fetched worker entry.\n'''
          if old_update in text:
              text = text.replace(old_update, new_update, 1)
          elif 'UPDATE_BLOCKED_DIRTY' not in text or 'UPDATE_BLOCKED_NON_FAST_FORWARD' not in text:
              raise SystemExit('operator docs automatic-update section has unexpected shape')

          old_stop = (
              'If the tracked branch is already current but the worker process exited unexpectedly, '
              'controller 2.2 starts it again automatically. A deliberate **Safe stop** pauses automatic '
              'worker restart until the operator explicitly selects Run current Qwen or Fetch latest + run Qwen.'
          )
          new_stop = (
              'If the tracked branch is already current but the worker process exited unexpectedly, '
              'controller 2.2 starts it again automatically. A deliberate **Safe stop** pauses both '
              'automatic update and automatic worker restart until the operator explicitly selects '
              'Run current Qwen or Fetch latest + run Qwen.'
          )
          if old_stop in text:
              text = text.replace(old_stop, new_stop, 1)
          elif 'pauses both automatic update and automatic worker restart' not in text:
              raise SystemExit('operator docs Safe stop section has unexpected shape')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Regenerate manifest twice and validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python3 tool/p1a_refresh_source_manifest.py .
          cmp -s "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          python3 tool/p1a_source_manifest_test.py .
          python3 tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          for path in \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_v53_policy.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_compat_test.py; do
            grep -F "$path" SOURCE_MANIFEST.sha256
          done
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          allowed = {'SOURCE_MANIFEST.sha256', 'docs/KRIS_QWEN_SERVER_CONTROL.md'}
          if not actual or 'SOURCE_MANIFEST.sha256' not in actual or not actual.issubset(allowed):
              raise SystemExit(f'finalization scope mismatch actual={sorted(actual)} allowed={sorted(allowed)}')
          PY

      - name: Publish validated always-on manifest candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256 docs/KRIS_QWEN_SERVER_CONTROL.md
          if git diff --cached --quiet; then
            echo 'QWEN_ALWAYS_ON_VALIDATED no publication required'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'feat(qwen): validate always-on phone execution'
          candidate="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/agent/qwen-phone-control
          git fetch origin '+refs/heads/agent/qwen-phone-control:refs/remotes/origin/agent/qwen-phone-control'
          remote="$(git rev-parse origin/agent/qwen-phone-control)"
          [[ "$remote" == "$candidate" ]]
          echo "QWEN_ALWAYS_ON_VALIDATED candidate=$candidate"
