name: Qwen Phone Control Materializer

on:
  push:
    branches:
      - 'automation/qwen-phone-control-materializer'
    paths:
      - '.github/workflows/qwen-phone-control-materialize.yml'

permissions:
  contents: write

concurrency:
  group: qwen-phone-control-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact phone-control candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Verify clean always-on rollout surface
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/qwen-always-on-materialize.yml
          test ! -e .github/workflows/qwen-always-on-anchor-audit.yml
          test -f tool/kris_qwen_worker.py
          test -f tool/kris_qwen_worker.py.compat.py
          test -f tool/kris_qwen_worker_v53.py
          test -f tool/kris_qwen_control.py
          test -f tool/kris_qwen_control.py.compat.py
          test -f run_my_server.py
          git diff --check

      - name: Compile and execute deterministic worker 5.3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_worker_v53.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_test.py
          python3 tool/kris_qwen_control_test.py
          python3 tool/kris_qwen_worker_v53.py version | tee "$RUNNER_TEMP/worker-version.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib

          value = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'worker-version.json').read_text(encoding='utf-8'))
          if value.get('scriptVersion') != '5.3.0':
              raise SystemExit(f"executed worker entry is not 5.3.0: {value}")
          deterministic = pathlib.Path('tool/kris_qwen_worker_v53.py').read_text(encoding='utf-8')
          policy = pathlib.Path('tool/kris_qwen_worker.py.compat.py').read_text(encoding='utf-8')
          for marker in (
              'TARGET_VERSION = "5.3.0"',
              'def wake_pending_reviews',
              'def seed_continuous_product_work',
              'RED_ALERT_FRONTIER',
              'Successful work chains immediately',
              '+refs/pull/*/head:refs/remotes/origin/pull/*/head',
          ):
              if marker not in deterministic and marker not in policy:
                  raise SystemExit(f'missing always-on worker marker: {marker}')
          print('QWEN_WORKER_5_3_ALWAYS_ON_PASS')
          PY

      - name: Verify controller 2.2 auto-update supervision
        shell: bash
        run: |
          set -euo pipefail
          KRIS_QWEN_AUTO_UPDATE=0 python3 - <<'PY'
          import importlib.util
          import pathlib
          import sys
          import tempfile
          from unittest import mock

          path = pathlib.Path('tool/kris_qwen_control.py.compat.py').resolve()
          spec = importlib.util.spec_from_file_location('kris_qwen_control_compat_validation', path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot import controller compatibility entry')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          if module.TARGET_CONTROL_VERSION != '2.2.0' or module.base.CONTROL_VERSION != '2.2.0':
              raise SystemExit('controller compatibility entry is not 2.2.0')

          with tempfile.TemporaryDirectory() as raw:
              root = pathlib.Path(raw)
              cfg = module.base.Config(
                  repo_dir=pathlib.Path.cwd(),
                  repo_branch='agent/qwen-phone-control',
                  worker_script=pathlib.Path.cwd() / 'tool' / 'kris_qwen_worker_v53.py',
                  root=root / 'worker-root',
                  bind_host='127.0.0.1',
                  port=8090,
                  phone_mode=False,
                  allow_remote_http=False,
                  stop_timeout=30,
                  worker_extra_args=(),
              )
              controller = module.AlwaysOnQwenController(cfg)

              with mock.patch.object(controller, '_validate_repo'), mock.patch.object(
                  controller, '_git_head', return_value='a' * 40
              ), mock.patch.object(
                  controller, '_remote_branch_head', return_value='b' * 40
              ), mock.patch.object(
                  module.BaseController, 'fetch_latest_and_run', return_value={'status': 'QUEUED'}
              ) as fetch:
                  result = controller._auto_update_once()
              if result.get('status') != 'UPDATE_QUEUED':
                  raise SystemExit(f'new remote head did not queue automatic update: {result}')
              fetch.assert_called_once()

              with mock.patch.object(controller, '_validate_repo'), mock.patch.object(
                  controller, '_git_head', return_value='c' * 40
              ), mock.patch.object(
                  controller, '_remote_branch_head', return_value='c' * 40
              ), mock.patch.object(controller, 'worker_pid', return_value=None), mock.patch.object(
                  module.BaseController, 'start', return_value={'status': 'STARTED', 'pid': 42}
              ) as start:
                  result = controller._auto_update_once()
              if result.get('status') != 'AUTO_STARTED':
                  raise SystemExit(f'unexpected worker stop did not auto-start: {result}')
              start.assert_called_once()

              controller.auto_run_enabled = False
              with mock.patch.object(controller, '_validate_repo'), mock.patch.object(
                  controller, '_git_head', return_value='d' * 40
              ), mock.patch.object(
                  controller, '_remote_branch_head', return_value='d' * 40
              ), mock.patch.object(controller, 'worker_pid', return_value=None), mock.patch.object(
                  module.BaseController, 'start'
              ) as start:
                  result = controller._auto_update_once()
              if result.get('status') != 'CURRENT':
                  raise SystemExit(f'manual pause did not suppress auto-start: {result}')
              start.assert_not_called()
          print('QWEN_CONTROLLER_2_2_AUTO_UPDATE_PASS')
          PY

      - name: Verify launcher binds exact always-on entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('run_my_server.py').read_text(encoding='utf-8')
          required = (
              'kris_qwen_control.py.compat.py',
              'kris_qwen_worker_v53.py',
              'KRIS_QWEN_WORKER_SCRIPT',
              'KRIS_QWEN_AUTO_UPDATE',
              'KRIS_QWEN_AUTO_UPDATE_SECONDS',
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'launcher missing always-on bindings: {missing}')
          print('QWEN_ALWAYS_ON_LAUNCHER_PASS')
          PY

      - name: Refresh operator truth text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/KRIS_QWEN_SERVER_CONTROL.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Always-on Product protocol (executed worker 5.3.0 / controller 2.2.0)'
          section = '''\n\n## Always-on Product protocol (executed worker 5.3.0 / controller 2.2.0)\n\nThe phone launcher executes `tool/kris_qwen_worker_v53.py` as worker **5.3.0**. Normal `IDLE` is a red-alert condition, not a steady state: successful jobs chain immediately, eligible context-independent R1 review Work Orders are woken into dispatchable authority, reviewed HELPER_READY source can wake its integration lane, and when the governed frontier is genuinely empty the worker may create one bounded `PRODUCT_DEFECT_REPAIR` Work Order only against an existing ACTIVE canonical Product PR through the existing Mission Runtime `work-create` CAS path. Path authority, WIP limits, semaphores, exact-head review independence and protected-main restrictions remain fail-closed. Documentation-only, formatting-only, governance-only and no-op continuous work are explicitly disallowed.\n\nThe launcher executes `tool/kris_qwen_control.py.compat.py` as controller **2.2.0**. Automatic update supervision is enabled by default and checks the configured remote Qwen branch every 30 seconds (configurable by `KRIS_QWEN_AUTO_UPDATE_SECONDS`). A newer remote head reuses the existing safe Fetch latest + run path: graceful worker drain, dirty-checkout refusal, fast-forward-only update, refreshed worker version probe and stack restart. If the worker exits unexpectedly while the tracked branch is current, the controller starts it again. A deliberate Safe stop pauses automatic restart until Run current Qwen or Fetch latest + run Qwen is requested.\n\nThe large retained base worker/controller source files still carry their prior 5.2.2/2.1.0 labels during this compatibility rollout. Those labels are not the phone execution version; the launcher binds the 5.3/2.2 entries above.\n'''
          if marker not in text:
              text += section
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Regenerate manifest twice and validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python3 tool/p1a_refresh_source_manifest.py .
          cmp -s "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          python3 tool/p1a_source_manifest_test.py .
          python3 tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          grep -F 'tool/kris_qwen_worker_v53.py' SOURCE_MANIFEST.sha256
          grep -F 'tool/kris_qwen_control.py.compat.py' SOURCE_MANIFEST.sha256
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'SOURCE_MANIFEST.sha256', 'docs/KRIS_QWEN_SERVER_CONTROL.md'}
          if actual != expected:
              raise SystemExit(f'finalization scope mismatch actual={sorted(actual)} expected={sorted(expected)}')
          PY

      - name: Publish validated always-on manifest candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256 docs/KRIS_QWEN_SERVER_CONTROL.md
          git diff --cached --check
          git commit -m 'feat(qwen): validate always-on phone execution'
          candidate="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/agent/qwen-phone-control
          git fetch origin '+refs/heads/agent/qwen-phone-control:refs/remotes/origin/agent/qwen-phone-control'
          remote="$(git rev-parse origin/agent/qwen-phone-control)"
          [[ "$remote" == "$candidate" ]]
          echo "QWEN_ALWAYS_ON_VALIDATED candidate=$candidate"
