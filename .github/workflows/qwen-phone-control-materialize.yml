name: Qwen Phone Control Materializer

on:
  push:
    branches:
      - 'automation/qwen-phone-control-materializer'
    paths:
      - '.github/workflows/qwen-phone-control-materialize.yml'

permissions:
  contents: write

concurrency:
  group: qwen-phone-control-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out phone-control candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true

      - name: Add immutable Product PR ref fetching
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker_path = Path('tool/kris_qwen_worker.py')
          worker = worker_path.read_text(encoding='utf-8')
          old_version = 'SCRIPT_VERSION = "5.2.2"'
          new_version = 'SCRIPT_VERSION = "5.2.3"'
          if worker.count(old_version) != 1:
              raise SystemExit('expected exactly one Qwen worker version 5.2.2')
          worker = worker.replace(old_version, new_version, 1)

          old_fetch = (
              'def fetch_all(cfg: Config) -> None:\n'
              '    git(cfg.anchor, "fetch", "origin", "+refs/heads/*:refs/remotes/origin/*", "--prune", timeout=1800)\n'
          )
          new_fetch = (
              'def fetch_all(cfg: Config) -> None:\n'
              '    git(\n'
              '        cfg.anchor,\n'
              '        "fetch",\n'
              '        "origin",\n'
              '        "+refs/heads/*:refs/remotes/origin/*",\n'
              '        "+refs/pull/*/head:refs/remotes/origin/pull/*/head",\n'
              '        "--prune",\n'
              '        timeout=1800,\n'
              '    )\n'
          )
          if worker.count(old_fetch) != 1:
              raise SystemExit('expected heads-only fetch_all implementation exactly once')
          worker = worker.replace(old_fetch, new_fetch, 1)
          worker_path.write_text(worker, encoding='utf-8', newline='\n')

          compat_path = Path('tool/kris_qwen_worker.py.compat.py')
          compat = compat_path.read_text(encoding='utf-8')
          if compat.count('TARGET_VERSION = "5.2.2"') != 1:
              raise SystemExit('expected compatibility target 5.2.2')
          compat = compat.replace('TARGET_VERSION = "5.2.2"', 'TARGET_VERSION = "5.2.3"', 1)
          old_version_block = (
              "    old_version = 'SCRIPT_VERSION = \"5.2.1\"'\n"
              "    new_version = f'SCRIPT_VERSION = \"{TARGET_VERSION}\"'\n"
              "    if old_version in text:\n"
              "        if text.count(old_version) != 1:\n"
              "            raise SystemExit(\"KRIS_QWEN_COMPAT_ERROR: ambiguous worker version marker\")\n"
              "        text = text.replace(old_version, new_version, 1)\n"
              "    elif new_version not in text:\n"
              "        raise SystemExit(\"KRIS_QWEN_COMPAT_ERROR: unsupported worker version\")\n"
          )
          new_version_block = (
              "    new_version = f'SCRIPT_VERSION = \"{TARGET_VERSION}\"'\n"
              "    if new_version not in text:\n"
              "        old_versions = [\n"
              "            marker for marker in (\n"
              "                'SCRIPT_VERSION = \"5.2.1\"',\n"
              "                'SCRIPT_VERSION = \"5.2.2\"',\n"
              "            ) if marker in text\n"
              "        ]\n"
              "        if len(old_versions) != 1 or text.count(old_versions[0]) != 1:\n"
              "            raise SystemExit(\"KRIS_QWEN_COMPAT_ERROR: unsupported/ambiguous worker version\")\n"
              "        text = text.replace(old_versions[0], new_version, 1)\n"
          )
          if compat.count(old_version_block) != 1:
              raise SystemExit('expected compatibility version block exactly once')
          compat = compat.replace(old_version_block, new_version_block, 1)

          marker = '    if old_cmp in text:\n        raise SystemExit("KRIS_QWEN_COMPAT_ERROR: obsolete historical semaphore guard remains")\n'
          fetch_compat = (
              '\n    old_fetch = \'git(cfg.anchor, "fetch", "origin", "+refs/heads/*:refs/remotes/origin/*", "--prune", timeout=1800)\'\n'
              '    new_fetch = (\n'
              '        \'git(cfg.anchor, "fetch", "origin", \'+refs/heads/*:refs/remotes/origin/*\', \'\n'
              '        \'"+refs/pull/*/head:refs/remotes/origin/pull/*/head", "--prune", timeout=1800)\'\n'
              '    )\n'
              '    if old_fetch in text:\n'
              '        if text.count(old_fetch) != 1:\n'
              '            raise SystemExit("KRIS_QWEN_COMPAT_ERROR: ambiguous heads-only fetch")\n'
              '        text = text.replace(old_fetch, new_fetch, 1)\n'
              '    elif "+refs/pull/*/head:refs/remotes/origin/pull/*/head" not in text:\n'
              '        raise SystemExit("KRIS_QWEN_COMPAT_ERROR: immutable PR-head fetch missing")\n'
          )
          if marker not in compat:
              raise SystemExit('expected compatibility historical guard marker')
          compat = compat.replace(marker, marker + fetch_compat, 1)
          compat_path.write_text(compat, encoding='utf-8', newline='\n')

          docs_path = Path('docs/KRIS_QWEN_SERVER_CONTROL.md')
          docs = docs_path.read_text(encoding='utf-8')
          if docs.count('The current candidate is **5.2.2**.') != 1:
              raise SystemExit('expected Qwen 5.2.2 docs marker')
          docs = docs.replace('The current candidate is **5.2.2**.', 'The current candidate is **5.2.3**.', 1)
          anchor = '5.2.2 fixes a second compatibility defect discovered against live runtime generation 652. Qwen\'s subprocess-only historical semaphore audit incorrectly rejected immutable `RELEASED` history when `expiresAt == refreshedAt`, even though the canonical Mission runtime audit permits equality and rejects only `expiresAt < refreshedAt`. 5.2.2 now matches that canonical historical rule. Active/executable semaphore validation remains unchanged and strict.\n'
          note = '\n5.2.3 fixes Product-ref durability after branch cleanup. The worker now fetches both remote branch heads and GitHub immutable `refs/pull/*/head` refs. This lets the repository live-runtime audit verify merged Product PRs after their source branches are deleted, exactly as its `refs/remotes/origin/pull/<pr>/head` fallback contract requires.\n'
          if anchor not in docs:
              raise SystemExit('expected Qwen 5.2.2 docs paragraph')
          if note.strip() not in docs:
              docs = docs.replace(anchor, anchor + note, 1)
          docs_path.write_text(docs, encoding='utf-8', newline='\n')
          PY

      - name: Validate PR-ref durability and phone control
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            run_my_server.py \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control_test.py
          python3 tool/kris_qwen_control_test.py
          python3 - <<'PY'
          import importlib.util
          import json
          import pathlib
          import subprocess
          import sys

          path = pathlib.Path('tool/kris_qwen_worker.py').resolve()
          spec = importlib.util.spec_from_file_location('kris_qwen_worker_prrefs', path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot import Qwen worker')
          worker = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = worker
          spec.loader.exec_module(worker)

          class Cfg:
              anchor = pathlib.Path.cwd()

          worker.fetch_all(Cfg())
          pr62 = subprocess.check_output(
              ['git', 'rev-parse', '--verify', 'refs/remotes/origin/pull/62/head^{commit}'],
              text=True,
          ).strip()
          if pr62 != '402a5764472a19feebdd51de192513640a05463d':
              raise SystemExit(f'PR62 immutable head mismatch: {pr62}')

          raw = subprocess.check_output(['python3', 'tool/kris_qwen_worker.py', 'version'], text=True)
          if str(json.loads(raw).get('scriptVersion') or '').strip() != '5.2.3':
              raise SystemExit(f'unexpected worker version JSON: {raw!r}')
          compat = subprocess.check_output(['python3', 'tool/kris_qwen_worker.py.compat.py', 'version'], text=True)
          if str(json.loads(compat).get('scriptVersion') or '').strip() != '5.2.3':
              raise SystemExit(f'unexpected compatibility worker version JSON: {compat!r}')
          if subprocess.check_output(['python3', 'tool/kris_qwen_control.py', '--version'], text=True).strip() != '2.1.0':
              raise SystemExit('unexpected Qwen controller version')
          print(f'validated immutable PR62 head {pr62} and Qwen 5.2.3')
          PY

          git worktree add --detach "$RUNNER_TEMP/control" origin/agent/mission-execution-v15-gold >/dev/null
          PYTHONPATH="$RUNNER_TEMP/control/tool" python3 - <<'PY'
          import pathlib
          from mission_v15_live_runtime_audit import resolve_product_head

          result = resolve_product_head(
              pathlib.Path.cwd(),
              'agent/p4-001-search-provider-foundation',
              62,
          )
          if result['head'] != '402a5764472a19feebdd51de192513640a05463d':
              raise SystemExit(f'unexpected PR62 resolved head: {result}')
          print(f"PR62 audit resolution PASS ref={result['ref']} head={result['head']}")
          PY

          test -x run_my_server.py
          test -x tool/run_kris_qwen_phone_control.sh
          bash -n tool/install_kris_qwen_control_systemd.sh
          bash -n tool/run_kris_qwen_phone_control.sh

      - name: Refresh exact source manifest and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/source-manifest.first"
          python3 tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/source-manifest.first" SOURCE_MANIFEST.sha256
          python3 tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'SOURCE_MANIFEST.sha256',
              'docs/KRIS_QWEN_SERVER_CONTROL.md',
              'tool/kris_qwen_worker.py',
              'tool/kris_qwen_worker.py.compat.py',
          }
          if actual != expected:
              raise SystemExit(f'Qwen 5.2.3 scope mismatch actual={sorted(actual)} expected={sorted(expected)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            SOURCE_MANIFEST.sha256 \
            docs/KRIS_QWEN_SERVER_CONTROL.md \
            tool/kris_qwen_worker.py \
            tool/kris_qwen_worker.py.compat.py
          git diff --cached --check
          git commit -m 'fix(qwen): fetch immutable Product PR refs'
          git push origin HEAD:refs/heads/agent/qwen-phone-control
