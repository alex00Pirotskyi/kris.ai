          )
          replace_exact(
              "tool/kris_qwen_control_compat_test.py",
              '''    repo.mkdir()
              (repo / ".git").mkdir()
              worker = repo / "tool" / "kris_qwen_worker_v53.py"
              worker.parent.mkdir()
          ''',
              '''    repo.mkdir(exist_ok=True)
              (repo / ".git").mkdir(exist_ok=True)
              worker = repo / "tool" / "kris_qwen_worker_v53.py"
              worker.parent.mkdir(exist_ok=True)
          ''',
