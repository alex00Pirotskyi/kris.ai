name: Qwen Materializer Heartbeat

on:
  push:
    branches:
      - 'automation/qwen-phone-control-materializer'
    paths:
      - '.github/workflows/qwen-phone-control-materialize.yml'

permissions:
  contents: write

concurrency:
  group: qwen-phone-control-materializer
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/qwen-phone-control-materializer
          fetch-depth: 0
          persist-credentials: true
      - name: Record execution heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          printf 'workflow=%s\ntrigger=%s\nrun=%s\n' \
            "${GITHUB_WORKFLOW}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" \
            > .github/qwen-materializer-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/qwen-materializer-heartbeat.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(qwen): record materializer heartbeat'
          git push origin HEAD:automation/qwen-phone-control-materializer
