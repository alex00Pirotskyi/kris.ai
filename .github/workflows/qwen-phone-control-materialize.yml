          python3 -m py_compile \
            tool/kris_qwen_control.py \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_compat_test.py \
            tool/kris_qwen_control_token_redaction_test.py
          python3 tool/kris_qwen_control_compat_test.py
          python3 tool/kris_qwen_control_token_redaction_test.py
          test "$(python3 tool/kris_qwen_control.py.compat.py --version)" = "2.2.1"
          bash -n tool/install_kris_qwen_control_systemd.sh
          grep -F 'TARGET_CONTROL_VERSION = "2.2.1"' tool/kris_qwen_control.py.compat.py
          grep -F 'auto-run-state.json' tool/kris_qwen_control.py.compat.py
          grep -F 'test_operator_pause_survives_controller_restart' tool/kris_qwen_control_compat_test.py
          if grep -R -n -F '2.2.0' \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_compat_test.py \
            tool/install_kris_qwen_control_systemd.sh \
            docs/KRIS_QWEN_SERVER_CONTROL.md \
            .github/workflows/ci.yml; then
            echo "stale controller 2.2.0 execution truth remains" >&2
            exit 1
          fi
          git diff --check

      - name: Regenerate canonical manifest twice
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256"
          python3 tool/p1a_refresh_source_manifest.py .
          cmp -s "${RUNNER_TEMP}/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          python3 tool/p1a_source_manifest_test.py .
          python3 tool/p1a_text_eof_contract_test.py --project .
          git diff --check
          python3 - <<'PY'
          import subprocess

          actual = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          expected = {
              ".github/workflows/ci.yml",
              "SOURCE_MANIFEST.sha256",
              "docs/KRIS_QWEN_ENGINEERING_ENVIRONMENT.md",
              "docs/KRIS_QWEN_SERVER_CONTROL.md",
              "tool/install_kris_qwen_control_systemd.sh",
              "tool/kris_qwen_control.py.compat.py",
              "tool/kris_qwen_control_compat_test.py",
          }
          if actual != expected:
              raise SystemExit(
                  f"durable-pause materialization scope mismatch actual={sorted(actual)} "
                  f"expected={sorted(expected)}"
              )
          PY

      - name: Publish exact durable-pause candidate
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)"
          test "${remote_head}" = "${EXPECTED_HEAD}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/ci.yml \
            SOURCE_MANIFEST.sha256 \
            docs/KRIS_QWEN_ENGINEERING_ENVIRONMENT.md \
            docs/KRIS_QWEN_SERVER_CONTROL.md \
            tool/install_kris_qwen_control_systemd.sh \
            tool/kris_qwen_control.py.compat.py \
            tool/kris_qwen_control_compat_test.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'fix(qwen): persist operator safe stop'
          candidate="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          git fetch origin "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          remote="$(git rev-parse "origin/${PRODUCT_BRANCH}")"
          test "${remote}" = "${candidate}"
          echo "QWEN_DURABLE_PAUSE_PUBLISHED candidate=${candidate}"
