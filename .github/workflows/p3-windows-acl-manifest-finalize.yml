name: p3-windows-acl-manifest-finalize

on:
  push:
    branches:
      - hotfix/p3-windows-sandbox-acl-20260824

permissions:
  contents: write

concurrency:
  group: p3-windows-acl-manifest-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
          check-latest: false
      - name: Qualify focused staging contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tool/p3_stage_browser_runtime_bundle.py tool/p3_stage_browser_runtime_bundle_test.py
          python tool/p3_stage_browser_runtime_bundle_test.py -v
      - name: Remove carrier and refresh governed inventory
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/p3-windows-acl-manifest-finalize.yml
          python tool/p1a_refresh_source_manifest.py .
          git add SOURCE_MANIFEST.sha256
          git diff --cached --check
          mapfile -t paths < <(git diff --cached --name-only | LC_ALL=C sort)
          printf 'FINAL_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = '.github/workflows/p3-windows-acl-manifest-finalize.yml'
          test "${paths[1]}" = 'SOURCE_MANIFEST.sha256'
      - name: Publish clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(p3): refresh Windows sandbox ACL manifest'
          git push origin HEAD:hotfix/p3-windows-sandbox-acl-20260824
