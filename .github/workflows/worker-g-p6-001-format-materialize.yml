name: Worker G P6-001 canonical format materialization

on:
  push:
    branches:
      - agent/g/mission-006-model-routing
    paths:
      - '.github/workflows/worker-g-p6-001-format-materialize.yml'

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/g/mission-006-model-routing
          fetch-depth: 2
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Require exact uncontended repair parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "17eed9bb16c25b8de80b69bd8a0be7eed323173a"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin agent/g/mission-006-model-routing
          test "$(git rev-parse refs/remotes/origin/agent/g/mission-006-model-routing)" = "${GITHUB_SHA}"
      - name: Materialize canonical Dart formatting
        shell: bash
        run: |
          set -euo pipefail
          python tool/dart_format_scope.py --write
          python tool/dart_format_scope.py --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = [
              'lib/product/model/model_registry.dart',
              'test/product/model/model_registry_identity_guard_test.dart',
              'test/product/model/model_registry_public_contract_test.dart',
              'test/product/model/model_registry_test.dart',
          ]
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          if changed != expected:
              raise SystemExit(
                  f'unexpected formatter diff: expected={expected!r} actual={changed!r}'
              )
          root = Path('formatted-p6')
          for relative in expected:
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(Path(relative).read_bytes())
          subprocess.run(
              ['git', 'diff', '--check', '--', *expected], check=True
          )
          PY
      - name: Upload canonical formatted P6 files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-g-p6-001-formatted-dart
          path: formatted-p6
          if-no-files-found: error
          retention-days: 1
