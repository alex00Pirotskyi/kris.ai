name: Worker G P6-001 provenance repair

on:
  push:
    branches:
      - agent/g/mission-006-model-routing
    paths:
      - '.github/workflows/worker-g-p6-001-format-materialize.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/g/mission-006-model-routing
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Require exact uncontended repair head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4a38abb53da0e60785aa9cd562befb0ea5afdc6e"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin agent/g/mission-006-model-routing
          test "$(git rev-parse refs/remotes/origin/agent/g/mission-006-model-routing)" = "${GITHUB_SHA}"
      - name: Resolve pinned Dart package context
        shell: bash
        run: flutter pub get
      - name: Apply benchmark provenance repair
        shell: bash
        env:
          P6_PATCH_GZIP_BASE64: 
        run: |
          set -euo pipefail
          python tool/dart_format_scope.py --write
          printf '%s' "${P6_PATCH_GZIP_BASE64}" | base64 --decode | gzip --decompress > "$RUNNER_TEMP/p6.patch"
          git apply --check "$RUNNER_TEMP/p6.patch"
          git apply "$RUNNER_TEMP/p6.patch"
          python tool/dart_format_scope.py --write
          python tool/dart_format_scope.py --check
          python - <<'PY'
          import subprocess
          expected = {
              'lib/product/model/model_registry.dart',
              'test/product/model/model_registry_identity_guard_test.dart',
              'test/product/model/model_registry_public_contract_test.dart',
              'test/product/model/model_registry_test.dart',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected product diff: expected={sorted(expected)!r} actual={sorted(changed)!r}')
          PY
          test "$(git rev-parse 954f231fa28a22c85e0be3a76205cc31635f6466^{tree})" = "34aa8b80adc34255ca04986c2368759a05a3dfc9"
          git diff --check -- \
            lib/product/model/model_registry.dart \
            test/product/model/model_registry_identity_guard_test.dart \
            test/product/model/model_registry_public_contract_test.dart \
            test/product/model/model_registry_test.dart
      - name: Analyze exact repaired source tree
        shell: bash
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos
      - name: Execute focused P6 model-registry regressions
        shell: bash
        run: |
          flutter test --no-pub --concurrency=1 --reporter expanded \
            test/product/model/model_registry_test.dart \
            test/product/model/model_registry_identity_guard_test.dart \
            test/product/model/model_registry_public_contract_test.dart
      - name: Commit validated repair and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/g/mission-006-model-routing
          test "$(git rev-parse refs/remotes/origin/agent/g/mission-006-model-routing)" = "${GITHUB_SHA}"
          git rm -- .github/workflows/worker-g-p6-001-format-materialize.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            lib/product/model/model_registry.dart \
            test/product/model/model_registry_identity_guard_test.dart \
            test/product/model/model_registry_public_contract_test.dart \
            test/product/model/model_registry_test.dart
          git commit -m 'fix(p6-001): require trusted benchmark execution receipts'
          final_commit="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          printf '{"commit":"%s","tree":"%s","validatedByRun":"%s"}\n' "$final_commit" "$final_tree" "${GITHUB_RUN_ID}" > "$RUNNER_TEMP/p6-final-receipt.json"
          git push origin HEAD:agent/g/mission-006-model-routing
          cp "$RUNNER_TEMP/p6-final-receipt.json" p6-final-receipt.json
      - name: Upload exact-tree validation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-g-p6-001-provenance-repair-receipt
          path: p6-final-receipt.json
          if-no-files-found: error
          retention-days: 30
