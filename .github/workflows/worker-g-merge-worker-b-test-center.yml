name: Worker G merge latest Worker B Test Center

on:
  push:
    branches:
      - agent/g/mission-006-model-routing
    paths:
      - '.github/workflows/worker-g-merge-worker-b-test-center.yml'

permissions:
  contents: write

concurrency:
  group: worker-g-merge-worker-b-test-center
  cancel-in-progress: false

jobs:
  merge-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WORKER_G_BRANCH: agent/g/mission-006-model-routing
      WORKER_B_BRANCH: agent/b/test-center-contracts-and-review
      EXPECTED_G_PARENT: 87d0cb1241fa6d80832e13c39a62578d1808ad2f
      EXPECTED_B_HEAD: 788af8db5891518a2b405d25e8d5b50cb89e8871
      EXPECTED_B_TREE: fe2bd4068d83b652ef988fd11d0de86a0fc9bffd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/g/mission-006-model-routing
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Require exact uncontended heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_G_PARENT}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin "${WORKER_G_BRANCH}" "${WORKER_B_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_G_BRANCH})" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_B_BRANCH})" = "${EXPECTED_B_HEAD}"
          test "$(git rev-parse ${EXPECTED_B_HEAD}^{tree})" = "${EXPECTED_B_TREE}"
      - name: Preserve bounded Worker G Test Center fragments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          registry = json.loads(Path('config/test_center_registry.v1.json').read_text(encoding='utf-8'))
          hierarchy = json.loads(Path('config/test_center_assurance_hierarchy.v1.json').read_text(encoding='utf-8'))
          selectors = {
              'affectedTestMappings': ('mappingId', 'affected.p6.model-registry-v2'),
              'projectTestProfiles': ('stableCheckId', 'tc.p6.model-registry-v2'),
              'testCases': ('testId', 'tc.p6.model-registry-v2'),
              'testModules': ('moduleId', 'tm.agent-quality-model-routing'),
          }
          fragments = {}
          for collection, (field, identity) in selectors.items():
              matches = [item for item in registry[collection] if item.get(field) == identity]
              if len(matches) != 1:
                  raise SystemExit(f'expected one {identity} in {collection}, found {len(matches)}')
              fragments[collection] = matches[0]
          bindings = [
              item for item in hierarchy['testBindings']
              if item.get('testId') == 'tc.p6.model-registry-v2'
          ]
          if len(bindings) != 1 or bindings[0].get('levelId') != 'unit':
              raise SystemExit(f'unexpected P6 hierarchy binding: {bindings!r}')
          fragments['testBinding'] = bindings[0]
          Path(os.environ['RUNNER_TEMP'], 'worker-g-p6-fragments.json').write_text(
              json.dumps(fragments, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Merge Worker B and resolve only declared shared authority files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff "refs/remotes/origin/${WORKER_B_BRANCH}"
          merge_rc=$?
          set -e
          if [ "${merge_rc}" -gt 1 ]; then
            echo "unexpected git merge exit code ${merge_rc}" >&2
            exit "${merge_rc}"
          fi
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'Merge conflicts (%s):\n' "${#conflicts[@]}"
          printf '  %s\n' "${conflicts[@]:-}"
          for path in "${conflicts[@]}"; do
            case "${path}" in
              SOURCE_MANIFEST.sha256|config/test_center_assurance_hierarchy.v1.json|config/test_center_registry.v1.json)
                git checkout --theirs -- "${path}"
                git add -- "${path}"
                ;;
              *)
                echo "unexpected merge conflict: ${path}" >&2
                exit 1
                ;;
            esac
          done
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Reapply bounded P6 registration onto Worker B authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          fragments = json.loads((temp / 'worker-g-p6-fragments.json').read_text(encoding='utf-8'))

          registry_path = Path('config/test_center_registry.v1.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          selectors = {
              'affectedTestMappings': ('mappingId', 'affected.p6.model-registry-v2'),
              'projectTestProfiles': ('stableCheckId', 'tc.p6.model-registry-v2'),
              'testCases': ('testId', 'tc.p6.model-registry-v2'),
              'testModules': ('moduleId', 'tm.agent-quality-model-routing'),
          }
          for collection, (field, identity) in selectors.items():
              registry[collection] = [
                  item for item in registry[collection]
                  if item.get(field) != identity
              ]
              registry[collection].append(fragments[collection])
          registry_path.write_text(
              json.dumps(registry, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          hierarchy_path = Path('config/test_center_assurance_hierarchy.v1.json')
          hierarchy = json.loads(hierarchy_path.read_text(encoding='utf-8'))
          hierarchy['testBindings'] = [
              item for item in hierarchy['testBindings']
              if item.get('testId') != 'tc.p6.model-registry-v2'
          ]
          hierarchy['testBindings'].append(fragments['testBinding'])
          hierarchy_path.write_text(
              json.dumps(hierarchy, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          evidence_path = Path('release/evidence/P6-001/source-contract.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          evidence['base'] = {
              'branch': os.environ['WORKER_B_BRANCH'],
              'commit': os.environ['EXPECTED_B_HEAD'],
              'tree': os.environ['EXPECTED_B_TREE'],
          }
          evidence_path.write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          git add -- \
            config/test_center_assurance_hierarchy.v1.json \
            config/test_center_registry.v1.json \
            release/evidence/P6-001/source-contract.json
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python tool/v71r12_bootstrap_hosted_python.py --project .
      - name: Validate Worker G P6-001 and governed source inventory
        shell: bash
        run: |
          set -euo pipefail
          python tool/dart_format_scope.py --check
          flutter test --no-pub --concurrency=1 --reporter expanded \
            test/product/model/model_registry_test.dart \
            test/product/source_contract_test.dart
      - name: Validate latest Worker B Test Center authority
        shell: bash
        run: |
          set -euo pipefail
          python tool/test_center_contracts.py check --project .
          python -m unittest -v tool/test_center_contracts_test.py
          python tool/test_center_assurance_hierarchy.py check --project .
          python tool/test_center_assurance_hierarchy.py check-report \
            --project . \
            --report release/evidence/TEST_CENTER/P8-001/fixtures/assurance-execution-report.pass.json
          python -m unittest -v tool/test_center_assurance_hierarchy_test.py
      - name: Remove merge workflow and refresh canonical source manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/worker-g-merge-worker-b-test-center.yml
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.first.sha256" SOURCE_MANIFEST.sha256
          git add -- SOURCE_MANIFEST.sha256
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
      - name: Revalidate final merge tree
        shell: bash
        run: |
          set -euo pipefail
          python tool/test_center_contracts.py check --project .
          python tool/test_center_assurance_hierarchy.py check --project .
          flutter test --no-pub --concurrency=1 --reporter expanded \
            test/product/model/model_registry_test.dart \
            test/product/source_contract_test.dart
          git diff --cached --check
      - name: Commit and push true two-parent merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${WORKER_G_BRANCH}" "${WORKER_B_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_G_BRANCH})" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/${WORKER_B_BRANCH})" = "${EXPECTED_B_HEAD}"
          git add -A -- .
          git diff --cached --check
          git commit -m 'merge(p6-001): synchronize latest Worker B Test Center authority'
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" -eq 3
          git push origin "HEAD:${WORKER_G_BRANCH}"
