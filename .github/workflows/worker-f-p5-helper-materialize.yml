name: Worker F P5 Helper Materializer

on:
  push:
    branches:
      - agent/help/i/mission-005/p5-helper-ci-exact-head

permissions:
  contents: write

concurrency:
  group: worker-f-p5-helper-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'alex00Pirotskyi/kris.ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require exact helper identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Set up locked Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Materialize only leased P5-owned outputs
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/product/p5_information_architecture/p5_controller.dart \
            lib/product/p5_information_architecture/p5_support_workspaces.dart \
            lib/product/p5_information_architecture/p5_task_workspaces.dart \
            test/product/p5_information_architecture/p5_active_context_lock_test.dart \
            test/product/p5_information_architecture/p5_active_context_widget_test.dart \
            test/product/p5_information_architecture/p5_experience_warning_lifecycle_test.dart
          python test/product/p5_information_architecture/worker_f_p5_ia.py manifest --project .
          python test/product/p5_information_architecture/worker_f_p5_ia.py check --project .
          python test/product/p5_information_architecture/worker_f_p5_ia_test.py
      - name: Require bounded changed paths
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only --)
          python - "${changed[@]}" <<'PY'
          import sys
          allowed = {
              'lib/product/p5_information_architecture/p5_controller.dart',
              'lib/product/p5_information_architecture/p5_support_workspaces.dart',
              'lib/product/p5_information_architecture/p5_task_workspaces.dart',
              'release/evidence/P5-001/manifest.json',
              'test/product/p5_information_architecture/p5_active_context_lock_test.dart',
              'test/product/p5_information_architecture/p5_active_context_widget_test.dart',
              'test/product/p5_information_architecture/p5_experience_warning_lifecycle_test.dart',
          }
          changed = set(sys.argv[1:])
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('unexpected materializer paths: ' + ', '.join(unexpected))
          if not changed:
              raise SystemExit('materializer produced no leased P5 changes')
          PY
      - name: Remove one-shot materializer and publish by fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/worker-f-p5-helper-materialize.yml
          git diff --check
          git add -- \
            lib/product/p5_information_architecture/p5_controller.dart \
            lib/product/p5_information_architecture/p5_support_workspaces.dart \
            lib/product/p5_information_architecture/p5_task_workspaces.dart \
            release/evidence/P5-001/manifest.json \
            test/product/p5_information_architecture/p5_active_context_lock_test.dart \
            test/product/p5_information_architecture/p5_active_context_widget_test.dart \
            test/product/p5_information_architecture/p5_experience_warning_lifecycle_test.dart
          git diff --cached --check
          git fetch origin agent/help/i/mission-005/p5-helper-ci-exact-head
          test "$(git rev-parse origin/agent/help/i/mission-005/p5-helper-ci-exact-head)" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(p5): materialize canonical formatting and evidence'
          git push origin HEAD:agent/help/i/mission-005/p5-helper-ci-exact-head
