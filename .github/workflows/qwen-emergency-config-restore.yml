name: Qwen Emergency Config Restore

on:
  push:
    branches:
      - agent/qwen-phone-control
    paths:
      - .github/workflows/qwen-emergency-config-restore.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/qwen-phone-control
          fetch-depth: 0
          persist-credentials: true
      - name: Restore exact config and remove recovery transports
        shell: bash
        run: |
          set -euo pipefail
          expected='2e63b23ae846f5a0c1e59663e19c3972a9acfe1e'
          git cat-file blob "$expected" > config/branch_hygiene.json
          [[ "$(git hash-object config/branch_hygiene.json)" == "$expected" ]]
          rm -f \
            .github/workflows/qwen-restore-hygiene-config.yml \
            .github/workflows/qwen-emergency-config-restore.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            config/branch_hygiene.json \
            .github/workflows/qwen-restore-hygiene-config.yml \
            .github/workflows/qwen-emergency-config-restore.yml
          if git diff --cached --quiet; then
            echo 'QWEN_CONFIG_ALREADY_RESTORED'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'chore(qwen): restore branch-hygiene config after connector error'
          git push origin HEAD:refs/heads/agent/qwen-phone-control
          echo 'QWEN_CONFIG_RESTORE_PASS'
