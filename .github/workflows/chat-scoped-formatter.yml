name: chat-scoped-formatter
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/chat-control-plane'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        shell: bash
        run: |
          dart format \
            lib/product/chat_control_plane.dart \
            lib/product/chat_control_plane_studio.dart \
            lib/product/chat_control_plane_studio_actions.dart \
            lib/product/chat_control_plane_studio_view.dart \
            test/product/adaptive_decomposition_test.dart \
            test/product/chat_control_plane_test.dart
      - name: Commit formatting if needed
        shell: bash
        run: |
          git config user.name 'Kristin CI Formatter'
          git config user.email 'actions@github.com'
          git add \
            lib/product/chat_control_plane.dart \
            lib/product/chat_control_plane_studio.dart \
            lib/product/chat_control_plane_studio_actions.dart \
            lib/product/chat_control_plane_studio_view.dart \
            test/product/adaptive_decomposition_test.dart \
            test/product/chat_control_plane_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(chat): apply canonical Dart formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
