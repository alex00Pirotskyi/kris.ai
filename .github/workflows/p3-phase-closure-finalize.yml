name: P3 bounded phase-closure finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p3-phase-closure-finalize.yml

permissions:
  contents: write

env:
  BASE_MAIN_SHA: d2ea234ea5297fabcf0fa0a5ec3395b98486ed0c
  TARGET_BRANCH: agent/p3-phase-closure-20260822
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PATCH_PATH: .repo-p3-phase-closure-finalize.py
  FINALIZER_PATH: .github/workflows/p3-phase-closure-finalize.yml

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact bounded source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          test -f "$PATCH_PATH"
          test -f "$FINALIZER_PATH"
          test -z "$(git status --short)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
          check-latest: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Apply workspace integration and remove transport
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python -m py_compile "$PATCH_PATH"
          python "$PATCH_PATH"
          git rm -f "$PATCH_PATH" "$FINALIZER_PATH"
      - name: Format and validate complete browser product suite
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/product/browser/*.dart test/product/browser/*.dart
          flutter test --no-pub --concurrency=1 test/product/browser
          flutter analyze --no-pub --fatal-warnings --fatal-infos
          ruby tool/workflow_integrity_test.rb .
          git diff --check
      - name: Regenerate canonical source identity twice
        shell: bash
        run: |
          set -euo pipefail
          python tool/p1a_refresh_source_manifest.py .
          cp SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/SOURCE_MANIFEST.first"
          python tool/p1a_refresh_source_manifest.py .
          cmp "$RUNNER_TEMP/SOURCE_MANIFEST.first" SOURCE_MANIFEST.sha256
          python tool/p1a_text_eof_contract_test.py --project .
          git diff --check
      - name: Assert exact durable diff against protected main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff --name-only "$BASE_MAIN_SHA" | sort)
          expected=(
            SOURCE_MANIFEST.sha256
            lib/product/browser/browser_quality.dart
            lib/product/browser/browser_workspace.dart
            test/product/browser/browser_quality_recipes_test.dart
            test/product/browser/fixtures/p3_browser/fixture.js
            test/product/browser/fixtures/p3_browser/index.html
            test/product/browser/fixtures/p3_browser/popup.html
          )
          test "${paths[*]}" = "${expected[*]}"
          test -z "$(git diff --name-only --diff-filter=U)"
          echo '--- P3 durable diff ---'
          git diff --stat "$BASE_MAIN_SHA"
      - name: Publish exact clean P3 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(p3): close browser quality security fixture and recipe gaps'
          git push origin "HEAD:$TARGET_BRANCH"
