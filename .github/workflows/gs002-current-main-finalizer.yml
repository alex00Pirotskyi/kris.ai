name: GS002 Current-Main Evidence State Finalizer

on:
  push:
    branches:
      - agent/gpt-gold/gs-002-p2-evidence-state-current-main
    paths:
      - .github/workflows/gs002-current-main-finalizer.yml

permissions:
  contents: write

concurrency:
  group: gs002-current-main-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: gs002-current-main-finalizer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gpt-gold/gs-002-p2-evidence-state-current-main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Validate, regenerate the canonical manifest, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'agent/gpt-gold/gs-002-p2-evidence-state-current-main'

          python -m py_compile tool/p2_evidence_state.py tool/p2_evidence_state_test.py
          python tool/p2_evidence_state.py --project .
          python tool/p2_evidence_state_test.py
          python -m json.tool schemas/p2_evidence_state.v1.schema.json >/dev/null
          ruby tool/workflow_integrity_test.rb .

          python tool/p1a_refresh_source_manifest.py .
          rm .github/workflows/gs002-current-main-finalizer.yml
          python tool/p1a_refresh_source_manifest.py .

          python tool/p2_evidence_state.py --project .
          python tool/p2_evidence_state_test.py
          ruby tool/workflow_integrity_test.rb .
          git diff --check

          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = '.github/workflows/gs002-current-main-finalizer.yml'
          test "${paths[1]}" = 'SOURCE_MANIFEST.sha256'

          git config user.name 'KRIS.AI Gold Standard Finalizer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(p2): finalize canonical evidence state on current main'
          git push origin HEAD:refs/heads/agent/gpt-gold/gs-002-p2-evidence-state-current-main
