name: GS001 Source Manifest Finalizer

on:
  push:
    branches:
      - agent/gpt-gold/gs-001-workflow-sanitation
    paths:
      - .github/workflows/gs001-source-manifest-finalizer.yml

permissions:
  contents: write

concurrency:
  group: gs001-source-manifest-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: gs001-source-manifest-finalizer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact sanitation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gpt-gold/gs-001-workflow-sanitation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Regenerate the canonical manifest and remove this finalizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'agent/gpt-gold/gs-001-workflow-sanitation'
          test -f .github/workflows/gs001-source-manifest-finalizer.yml

          python tool/p1a_refresh_source_manifest.py .
          rm .github/workflows/gs001-source-manifest-finalizer.yml
          python tool/p1a_refresh_source_manifest.py .
          ruby tool/workflow_integrity_test.rb .
          git diff --check

          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          printf 'CHANGED_PATH=%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = '.github/workflows/gs001-source-manifest-finalizer.yml'
          test "${paths[1]}" = 'SOURCE_MANIFEST.sha256'

          git config user.name 'KRIS.AI Gold Standard Finalizer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(ci): finalize workflow sanitation manifest'
          git push origin HEAD:refs/heads/agent/gpt-gold/gs-001-workflow-sanitation
