name: P5 Stale Preview Source Contract Repair

on:
  push:
    branches:
      - agent/help/elastic-7d41b6a2/mission-005/p5-stale-preview
    paths:
      - '.github/workflows/p5-stale-preview-source-contract-repair.yml'

permissions:
  contents: write

concurrency:
  group: p5-stale-preview-source-contract-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'alex00Pirotskyi/kris.ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: agent/help/elastic-7d41b6a2/mission-005/p5-stale-preview
      EXPECTED_BASE: 1da13554983f2211b2a75e28743efb36465b7fd5
      TARGET_PATH: test/product/source_contract_test.dart
      EXPECTED_OLD_BLOB: 46825f12e87806d8cca99f535f3a97ec3ed0a373
      EXPECTED_NEW_BLOB: 8a7fad0a5f005cc70d2cf51c30b83bded4335bea
      TRANSPORT_PATH: .github/workflows/p5-stale-preview-source-contract-repair.yml
    steps:
      - name: Check out exact helper staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/help/elastic-7d41b6a2/mission-005/p5-stale-preview
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact staging envelope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git hash-object "$TARGET_PATH")" = "$EXPECTED_OLD_BLOB"
          mapfile -t staged_paths < <(git diff --name-only "$EXPECTED_BASE" HEAD)
          test "${#staged_paths[@]}" -eq 1
          test "${staged_paths[0]}" = "$TRANSPORT_PATH"
          test -z "$(git status --porcelain)"

      - name: Apply exact one-line source-contract repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('test/product/source_contract_test.dart')
          value = path.read_text(encoding='utf-8')
          old = "        'lib/p5_ia_preview.dart',\n"
          if value.count(old) != 1:
              raise SystemExit(f'expected exactly one stale preview inventory entry, found {value.count(old)}')
          path.write_text(value.replace(old, '', 1), encoding='utf-8', newline='\n')
          PY
          test "$(git hash-object "$TARGET_PATH")" = "$EXPECTED_NEW_BLOB"
          mapfile -t paths < <(git diff --name-only)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = "$TARGET_PATH"
          read -r adds deletes path < <(git diff --numstat -- "$TARGET_PATH")
          test "$adds" = "0"
          test "$deletes" = "1"
          test "$path" = "$TARGET_PATH"
          ! grep -Fq "'lib/p5_ia_preview.dart'" "$TARGET_PATH"
          git diff --check

      - name: Commit and publish exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kristin P5 Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET_PATH"
          git diff --cached --check
          read -r adds deletes path < <(git diff --cached --numstat -- "$TARGET_PATH")
          test "$adds" = "0"
          test "$deletes" = "1"
          test "$path" = "$TARGET_PATH"
          git commit -m 'P5: retire stale preview source inventory'
          repaired_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test "$(git hash-object "$TARGET_PATH")" = "$EXPECTED_NEW_BLOB"
          git push origin "$repaired_commit:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$repaired_commit"
          echo "REPAIRED_COMMIT=$repaired_commit"
